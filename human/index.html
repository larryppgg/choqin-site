留一项不只服务别人的活动，不必优秀、昂贵或可变副业。问最近因好奇做过什么，是否有不围绕分配任务的关系。责任不是唯一自我定义。\u003c/p\u003e\n\u003cp\u003e长期无兴趣、无恢复感或麻木时，不只追加娱乐，也考虑睡眠、情绪和负荷评估。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开多重责任日M\u003c/summary\u003e\n\u003cp\u003e晨间确认不可移动责任、实际接手和备用。将疲惫纳入驾驶、设备与决策风险。工作保留主目标，新任务明确替代关系。\u003c/p\u003e\n\u003cp\u003e交接写状态，不写人格评价。晚间收尾并保留短而真实的个人或关系时段。超载时找上游缺口，每周改一个能减少重复劳动的接口，熟练后回归常规。\u003c/p\u003e\n\u003c/details\u003e\n\u003cp\u003e一个不允许任何人生病、犯错或暂退的系统，即使平时效率很高，也不是稳健生活。最优不是每个角色满分，而是重要责任可靠、本人的恢复与选择仍被保护。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c11-s000","title":"11.1　新增变量是责任耦合"},{"id":"c11-s001","title":"11.2　三十至三十四岁：承诺账本"},{"id":"c11-s002","title":"11.3　三十五至三十九岁：恢复进入工作设计"},{"id":"c11-s003","title":"11.4　四十至四十四岁：中途校准"},{"id":"c11-s004","title":"11.5　身体变化不默认等于年龄"},{"id":"c11-s005","title":"11.6　生育是分支，不是必经节点"},{"id":"c11-s006","title":"11.7　照护首先需要连续性"},{"id":"c11-s007","title":"11.8　家庭运行会处理协调，不审判人格"},{"id":"c11-s008","title":"11.9　管理者不把自己的透支复制给别人"},{"id":"c11-s009","title":"11.10　财务压力进入现实排序"},{"id":"c11-s010","title":"11.11　父母需要帮助时，先看任务"},{"id":"c11-s011","title":"11.12　给私人身份留一个角落"}]},{"id":12,"title":"卷十二　四十五至六十岁：维护长期功能，不恐慌性抗衰","html":"\u003ch2\u003e卷十二　四十五至六十岁：维护长期功能，不恐慌性抗衰\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c12\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**先补预防记录中的空白，再考虑额外套餐。**找出血压、血脂、按风险需要的血糖评估，以及适用器官筛查的上次结论与下一步。没有症状不等于血脂正常；检查频率与处理目标需结合整体风险，而非只看年龄或体形。\u003ca href=\"#s166\"\u003eS166\u003c/a\u003e 宫颈与骨质疏松筛查的地区示例及例外见\u003ca href=\"#r31-prevention\"\u003e预防总表\u003c/a\u003e，不能由本卷标题自动开出一套检查。\u003c/p\u003e\n\u003ch3 id=\"c12-s000\"\u003e12.1　年龄提醒复核，不替人决定退场\u003c/h3\u003e\n\u003cp\u003e本卷不假设每个人四十五岁出现同样变化。以本人过去功能、当前目标与资源为参照，不用同龄榜单判定合格。维护看三条线：持续新变化、治疗预防未闭环、生活是否支持重要功能。\u003c/p\u003e\n\u003cp\u003e年度目标可分保住、恢复、尝试。保住独立出行，恢复受限活动，尝试新学习或关系，可以并行。不是风险全部清零后才允许生活。\u003c/p\u003e\n\u003ch3 id=\"c12-s001\"\u003e12.2　四十五至四十九岁：风险档案不是报告堆\u003c/h3\u003e\n\u003cp\u003e记录重要家族史、疾病、吸烟暴露、已知指标、用药和复查。家族史尽量有关系、诊断和发病年龄，不将模糊印象当事实。\u003c/p\u003e\n\u003cp\u003e高血压可无明显症状，精神好或不头晕不能排除；异常应规范测量并评估，生活调整不能自动代替需要的治疗。\u003ca href=\"#s74\"\u003eS74\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e询问风险判断来自单项还是整体，是否需确认测量，收益与复核时间是什么。参考范围内不保证所有情境无风险，一次轻微超出也不自动要求治疗。具体解释依病史与方法。\u003c/p\u003e\n\u003ch3 id=\"c12-s002\"\u003e12.3　五十至五十四岁：预防要走到结果处理\u003c/h3\u003e\n\u003cp\u003e筛查按所在地、器官、年龄、家族史和既往结果选择，不越全面越好。重点是预约、完成、取得解释和后续行动，完整原则见卷二十。\u003c/p\u003e\n\u003cp\u003e检查前核对准备、药物、交通、陪同、结果时间和后续成本。禁食停药按团队要求，不复制网上通用攻略。结果后明确下一次日期和提前联系条件。\u003c/p\u003e\n\u003cp\u003e别让昂贵检查挤掉牙痛、听力、睡眠或血压等实际问题。能改善每天生活的基础事项，不应被更像科技的项目遮住。\u003c/p\u003e\n\u003ch3 id=\"c12-s003\"\u003e12.4　五十五至五十九岁：为下一阶段保留选择\u003c/h3\u003e\n\u003cp\u003e讨论工作量和居住不等于立刻退休。分清收入需求、身份、社交和工作兴趣，再分别设计，避免一个职位承担全部人生功能。\u003c/p\u003e\n\u003cp\u003e居住从入口、楼梯、浴室、服务距离和可靠关系评估。暂不搬也可改善照明和常用物位置，不必一次预言未来三十年，但尽量别制造难逆障碍。\u003c/p\u003e\n\u003cp\u003e重要资料和事务应有安全可接续方式，不只本人知道。接续不等于公开所有密码，授权、最小权限和恢复测试见卷二十四。\u003c/p\u003e\n\u003ch3 id=\"c12-s004\"\u003e12.5　围绝经期：围绕症状与本人目标\u003c/h3\u003e\n\u003cp\u003e月经、潮热、睡眠、情绪和泌尿生殖不适可能变化，程度不同。记录最影响生活的几项即可。绝经后出血即使少量或一次也要评估，不能自行解释为恢复年轻。\u003ca href=\"#s75\"\u003eS75\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e向医生描述真实影响，如夜醒妨碍工作、疼痛妨碍亲密。不要把所有疲劳、心悸和情绪变化都归此阶段，其他原因仍需考虑。\u003c/p\u003e\n\u003cp\u003e激素与非激素方案应结合症状、病史、风险和偏好讨论，不是人人必用，也不是一概不能谈，更非统一抗衰处方。\u003ca href=\"#s26\"\u003eS26\u003c/a\u003e 剂量、途径、配合治疗和复查由合格人员确定。\u003c/p\u003e\n\u003ch3 id=\"c12-s005\"\u003e12.6　不经历绝经者同样需要针对性评估\u003c/h3\u003e\n\u003cp\u003e性欲、勃起、精力和体形变化可涉及睡眠、关系、药物与疾病，不能凭年龄和网络问卷认定激素不足，不自行用睾酮。说清持续情况、病史和目标，避免正常差异全部医疗化。\u003c/p\u003e\n\u003cp\u003e性健康不等于固定频率或表现。讨论舒适、同意、疼痛与保护，症状需要诊疗，不用不明成分产品掩盖。身体价值不以性功能和生育能力为唯一标准。\u003c/p\u003e\n\u003ch3 id=\"c12-s006\"\u003e12.7　肌肉、骨与关节围绕任务维护\u003c/h3\u003e\n\u003cp\u003e列想保有的任务：提物、台阶、起身、地面活动、旅行或运动，再拆力量、平衡、耐力、活动范围和技巧。训练细则见卷十八，不仅关注体重外形。\u003c/p\u003e\n\u003cp\u003e骨质疏松在骨折前可能无明显症状，男性也会受影响。低创伤骨折、相关家族史或长期某些药物，应讨论评估，喝奶和体形结实不能排除。\u003ca href=\"#s76\"\u003eS76\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e关节不适不在完全不动与忍痛练之间二选一。急性损伤、红肿热痛或骤变先评估，再安排活动。记录任务影响，不将每天疼痛数字当唯一进展。\u003c/p\u003e\n\u003ch3 id=\"c12-s007\"\u003e12.8　感官输入影响参与\u003c/h3\u003e\n\u003cp\u003e小字、噪声中谈话和反复确认变费力时，调整字体、照明、座位与交流，按变化安排视听评估。别长期依赖猜测，也不将可改善问题全部视为年龄。\u003c/p\u003e\n\u003cp\u003e交流先降背景噪声、面对对方、清楚正常语速，而非直接吼。突然明显视听变化及时评估。退出聚会可能是听不清，少读书可能是看得累，先问障碍再评价动机。\u003c/p\u003e\n\u003ch3 id=\"c12-s008\"\u003e12.9　睡眠：打鼾不代表睡得香\u003c/h3\u003e\n\u003cp\u003e大声鼾声伴暂停、喘憋、反复醒或白天困倦，值得评估睡眠呼吸暂停，不能靠手表确诊。\u003ca href=\"#s77\"\u003eS77\u003c/a\u003e 困倦驾驶与设备风险当天就需处理，不能等检查结束。\u003c/p\u003e\n\u003cp\u003e失眠可能被疼痛、潮热或夜尿打断，分流见卷十六。不要统一添加酒精、镇静产品或深睡补剂，不用他人处方。若监测反而制造焦虑，可降频，保留能改变行动的信息。\u003c/p\u003e\n\u003ch3 id=\"c12-s009\"\u003e12.10　体形管理避免惩罚逻辑\u003c/h3\u003e\n\u003cp\u003e变化有意还是无意、速度怎样、饮食活动药物是否改变、有没有其他症状，先说清。无意下降不自动好，衣服变紧也不自动授权极低热量饮食。\u003c/p\u003e\n\u003cp\u003e调整保留足够供给、可接受食物与社会生活，不因聚餐就禁食或过量运动补偿。评价同时看体力、睡眠、可持续性、必要指标和感受，不让单一数字统治生活。\u003c/p\u003e\n\u003ch3 id=\"c12-s010\"\u003e12.11　角色需要重新协商\u003c/h3\u003e\n\u003cp\u003e孩子长大、父母需要帮助、伴侣工作变化，旧分工不会自动适应。分别讨论需要、愿意和能做到的事情，不把能力不足直接视为不关心。\u003c/p\u003e\n\u003cp\u003e离岗后不必立刻用同等头衔填空，孩子离家后关心不等于继续全管。保留跨角色关系，避免一个角色受挫时所有支持一起消失。\u003c/p\u003e\n\u003ch3 id=\"c12-s011\"\u003e12.12　年度维护的最小文件\u003c/h3\u003e\n\u003cp\u003e一页记录重要变化、当前治疗、关键目标、下一步和最重视的功能。原报告另存。优先新问题、持续疾病、明确到期项目和药物复核，其余分散安排，不一天完成全部。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开中年维护接口R\u003c/summary\u003e\n\u003cp\u003e普通日沿用底座，不每天加一套抗衰动作。持续变化按分流处理，不等年度体检，也不立即买十种产品。\u003c/p\u003e\n\u003cp\u003e定期关闭一个行政或医疗环节，年度比较功能与目标。若健康方案长期牺牲睡眠、预算和重要关系，重新检验净价值。基础行动优先，年龄不是退出生活的命令。\u003c/p\u003e\n\u003c/details\u003e\n\u003chr/\u003e\n","sections":[{"id":"c12-s000","title":"12.1　年龄提醒复核，不替人决定退场"},{"id":"c12-s001","title":"12.2　四十五至四十九岁：风险档案不是报告堆"},{"id":"c12-s002","title":"12.3　五十至五十四岁：预防要走到结果处理"},{"id":"c12-s003","title":"12.4　五十五至五十九岁：为下一阶段保留选择"},{"id":"c12-s004","title":"12.5　围绝经期：围绕症状与本人目标"},{"id":"c12-s005","title":"12.6　不经历绝经者同样需要针对性评估"},{"id":"c12-s006","title":"12.7　肌肉、骨与关节围绕任务维护"},{"id":"c12-s007","title":"12.8　感官输入影响参与"},{"id":"c12-s008","title":"12.9　睡眠：打鼾不代表睡得香"},{"id":"c12-s009","title":"12.10　体形管理避免惩罚逻辑"},{"id":"c12-s010","title":"12.11　角色需要重新协商"},{"id":"c12-s011","title":"12.12　年度维护的最小文件"}]},{"id":13,"title":"卷十三　六十至七十五岁：功能、参与和自主继续展开","html":"\u003ch2\u003e卷十三　六十至七十五岁：功能、参与和自主继续展开\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c13\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c13-s000\"\u003e13.1　不从退休身份推导能力\u003c/h3\u003e\n\u003cp\u003e退休与保障规则因地区和时间不同，本书不指定必须退出工作的生日。决定看本人意愿、工作条件、收入和支持，而非单一标签。\u003c/p\u003e\n\u003cp\u003e健康老龄化关注在具体环境中能否做重视的事，不要求完全无病。人群差异很大，环境支持能够改变功能，没有适合所有老人的统一日程。\u003ca href=\"#s22\"\u003eS22\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e先列想去哪里、见谁、学什么、继续承担和停止什么，再反推支持。活动可以是舞蹈、研究、编程或安静阅读，不由别人想象的适老生活决定。\u003c/p\u003e\n\u003ch3 id=\"c13-s001\"\u003e13.2　六十至六十四岁：试运行时间结构\u003c/h3\u003e\n\u003cp\u003e工作减少后，原有通勤和任务锚点变化。先稳定起居、进餐、活动、联系和维护，其余灵活，不立即用课程填满。\u003c/p\u003e\n\u003cp\u003e观察是否恢复、是否真实参与、是否长期陷入本人并不满意的被动消耗。偶尔娱乐不是问题，长期挤掉想做的事才需要调整入口与环境，而非羞辱性禁令。\u003c/p\u003e\n\u003cp\u003e继续工作可讨论任务、夜班、工具与通勤，保留学习机会。不要因年龄默认不愿学，也不为证明年轻接受不必要危险。\u003c/p\u003e\n\u003ch3 id=\"c13-s002\"\u003e13.3　六十五至六十九岁：建立任务基线\u003c/h3\u003e\n\u003cp\u003e在真实生活观察起身、转身、出行、药物、账单和沟通，而非家人偷偷打失能分。本人参与支持地图，知道记录用来做什么。\u003c/p\u003e\n\u003cp\u003e写具体限制：平路可以、夜间楼梯不稳；纸账单能看、手机字太小；原本会管理药物、最近处方变化造成混乱。它们分别指向环境、界面或医疗整合，不必笼统增加限制。\u003c/p\u003e\n\u003cp\u003e正式功能测试由合适人员指导。已有跌倒、疼痛、头晕或虚弱者，不在家无保护挑战单脚站和地面起身以证明达到网络标准。\u003c/p\u003e\n\u003ch3 id=\"c13-s003\"\u003e13.4　七十至七十四岁：增加备用路径\u003c/h3\u003e\n\u003cp\u003e交通临时不可用怎样就医，主要联系人不在谁接应，断电时信息哪里找。备用不是多几个人监控，而是关键功能不依赖单点。\u003c/p\u003e\n\u003cp\u003e常用品无需攀高，灯和开关易达，电话和助具在手边，通道清楚。改动先试用，不突然重排熟悉环境。帮助明确时间、范围、反馈和退出，接受服务不等于放弃表达不满意的权利。\u003c/p\u003e\n\u003ch3 id=\"c13-s004\"\u003e13.5　活动以能力和目标分级\u003c/h3\u003e\n\u003cp\u003e老年活动通常仍包含有氧、力量与平衡，按能力和病情调整。达不到通用量时仍寻找安全参与方式，而不是全停。\u003ca href=\"#s33\"\u003eS33\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e去市场需要走、转、携物与休息；园艺可调整工具高度和分段；轮椅使用者围绕上肢、转移、耐力和兴趣适配。复杂情况寻求康复支持，不由家人凭视频强练。\u003c/p\u003e\n\u003cp\u003e记录去了哪里、需要怎样帮助、回来能否正常生活。只有步数会漏掉力量、轮椅和参与，也可能鼓励走到无法安全返回。\u003c/p\u003e\n\u003ch3 id=\"c13-s005\"\u003e13.6　跌倒预防是一组接口\u003c/h3\u003e\n\u003cp\u003e风险涉及平衡、感官、疾病、药物和环境。跌倒或明显担忧后评估原因，不只叮嘱小心。合脚鞋、去绊倒物、可靠扶手和合适助具属于具体方向。\u003ca href=\"#s78\"\u003eS78\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e沿床到厕所、厨房到餐桌和门到电梯的真实路线检查摸索、急转、跨越和手不够用之处。先修实际障碍，不大量购买未用产品。承重设施要可靠安装，不能用不稳定吸附件代替。\u003c/p\u003e\n\u003cp\u003e夜间单独检查灯、鞋、助具和通道。起身头晕、新不稳需要评估，不自行靠少喝水避免夜间起床。\u003c/p\u003e\n\u003ch3 id=\"c13-s006\"\u003e13.7　药物按真实执行复核\u003c/h3\u003e\n\u003cp\u003e把处方、非处方、草药与补剂放同一清单，说明实际服法与未遵循原因。目的让团队看到现实，不是接受批评。\u003c/p\u003e\n\u003cp\u003e每项回答为什么用、谁管理、何时复核。药多不等于可自行停，用多年也不等于永远必要。症状变化带清单讨论，具体调整由团队完成。\u003c/p\u003e\n\u003cp\u003e药盒和提醒按能力适配，先确认能否离开原包装和储存条件。看不清或认知受限时，不把复杂分药交给未受训者。完整协议见卷二十。\u003c/p\u003e\n\u003ch3 id=\"c13-s007\"\u003e13.8　吃得到、吃得动、吃得下\u003c/h3\u003e\n\u003cp\u003e食欲问题可能涉及采购、准备、牙口、吞咽、药物、情绪和疾病。先问实际障碍，不一律让人多吃或买营养粉。\u003c/p\u003e\n\u003cp\u003e无意体重下降、持续少吃或功能受影响要评估。虚弱时沿用年轻减重限制可能不适合；能量蛋白结合营养与疾病状态，不按年龄统一加量。\u003c/p\u003e\n\u003cp\u003e共同吃饭可支持，但不强迫疲惫聚餐。在安全计划内保留熟悉口味、安静环境和节奏。食物也承担文化与选择，而不只是营养素。\u003c/p\u003e\n\u003ch3 id=\"c13-s008\"\u003e13.9　学习与贡献不只剩娱乐\u003c/h3\u003e\n\u003cp\u003e可做真实项目：教技能、整理历史、社区协作、创作或新工具。责任匹配意愿，不因有经验默认无限免费贡献。\u003c/p\u003e\n\u003cp\u003e学技术从一个可用目标开始，如预约或联系朋友，调整字体、输入和提示。一次讲完所有功能再把遗忘归年龄并不合理。\u003c/p\u003e\n\u003cp\u003e传承记录判断与约束，不只结论。说明当时为何适用、今天变化后哪里需改，既尊重经验，也避免将过去成功方法永久化。\u003c/p\u003e\n\u003ch3 id=\"c13-s009\"\u003e13.10　关系质量与隐私\u003c/h3\u003e\n\u003cp\u003e独居不必然孤独，共居也不保证理解。分别看平时交流、求助回应和愿意参与的活动。电话数量不能代替关系感受。\u003c/p\u003e\n\u003cp\u003e联系节奏双方商定，平稳时未即时回复不自动失踪；有明确风险时制定未回应流程。定位和摄像须考虑本人同意、数据权限和谁负责响应，不以安全无限监控。\u003c/p\u003e\n\u003cp\u003e新关系保持开放，同时独立核实大额转账、产品和保密要求。支持判断与防骗不等于取消所有交易权。\u003c/p\u003e\n\u003ch3 id=\"c13-s010\"\u003e13.11　外出先准备返回能力\u003c/h3\u003e\n\u003cp\u003e除了目的地，还看药物、资料、分段体力、厕所、休息、无障碍和同行分工。身体变化后先小规模体验，不用别人都能走决定行程。\u003c/p\u003e\n\u003cp\u003e运输药物、时区、储存、保险和目的地卫生要求需出发前查官方现行规则。费用已付不代表必须继续高风险活动，能调整更有利于保留以后外出的可能。\u003c/p\u003e\n\u003ch3 id=\"c13-s011\"\u003e13.12　提前表达照护偏好\u003c/h3\u003e\n\u003cp\u003e平稳时谈重病时重视舒适、清醒、独立、延长生命或关系等哪些目标。可以有冲突和变化，不需一次永久答案。\u003c/p\u003e\n\u003cp\u003e指定希望参与的人，按当地法律了解授权和预先照护文件。家人的理解应来自表达，不是推测一定希望不惜一切。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开自主老年日程O\u003c/summary\u003e\n\u003cp\u003e继续成人底座，按状态调整节奏。活动看环境和辅助，进食看摄入与舒适，用药统一，每天保留一件本人选择的事。\u003c/p\u003e\n\u003cp\u003e一周分散外出、活动与维护，避免一天耗尽后多日恢复。新功能变化展开评估，不折叠成老了都这样。帮助哪一步说清，能自己完成的保留；成功看仍能参与多少重视的生活。\u003c/p\u003e\n\u003c/details\u003e\n\u003chr/\u003e\n","sections":[{"id":"c13-s000","title":"13.1　不从退休身份推导能力"},{"id":"c13-s001","title":"13.2　六十至六十四岁：试运行时间结构"},{"id":"c13-s002","title":"13.3　六十五至六十九岁：建立任务基线"},{"id":"c13-s003","title":"13.4　七十至七十四岁：增加备用路径"},{"id":"c13-s004","title":"13.5　活动以能力和目标分级"},{"id":"c13-s005","title":"13.6　跌倒预防是一组接口"},{"id":"c13-s006","title":"13.7　药物按真实执行复核"},{"id":"c13-s007","title":"13.8　吃得到、吃得动、吃得下"},{"id":"c13-s008","title":"13.9　学习与贡献不只剩娱乐"},{"id":"c13-s009","title":"13.10　关系质量与隐私"},{"id":"c13-s010","title":"13.11　外出先准备返回能力"},{"id":"c13-s011","title":"13.12　提前表达照护偏好"}]},{"id":14,"title":"卷十四　七十五至九十岁：精细支持，不统一接管","html":"\u003ch2\u003e卷十四　七十五至九十岁：精细支持，不统一接管\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c14\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c14-s000\"\u003e14.1　按任务选择支持\u003c/h3\u003e\n\u003cp\u003e本卷不要求到七十五岁就接受护理。能够独立且愿意继续原有活动的人沿用卷十三；出现特定困难才启用相应支持。需要协助洗澡，不代表不能处理钱款、不能决定吃什么或不能表达治疗偏好。\u003c/p\u003e\n\u003cp\u003e每项任务可标为独立、工具辅助、提醒、旁边保护、部分代做、完全协助。状态可以随疾病、环境与一天精力变化。标记用于分配支持，不是人格等级。照护计划第一句应写本人希望怎样生活，第二句才是哪里需要帮助。\u003c/p\u003e\n\u003ch3 id=\"c14-s001\"\u003e14.2　七十五至七十九岁：尽早处理具体变化\u003c/h3\u003e\n\u003cp\u003e比较本人原有状态。原来能去市场，现在多次停下；原来能安排药物，现在连续混淆；原来参加聚会，现在因为听不清回避。这样的记录比最近老了很多更有用。\u003c/p\u003e\n\u003cp\u003e先看工具、药物、环境、疼痛与感觉是否变化，持续或进展问题再进入专业评估。不能只增加摄像头来应对所有变化，也不能因本人还能完成其他任务就忽视一个持续恶化的问题。\u003c/p\u003e\n\u003cp\u003e支持从一项开始并试用。共同采购仍由本人选择食物，协助核药仍解释变化，接送不取消全部外出。帮助解决卡点，而不是借机替换全部生活。\u003c/p\u003e\n\u003ch3 id=\"c14-s002\"\u003e14.3　八十至八十四岁：治疗负担也是负担\u003c/h3\u003e\n\u003cp\u003e多科就诊和多种治疗需要交通、理解、执行、费用与恢复。把实际负担带入诊室，明确最看重减少症状、保持清醒、走路、在家生活还是其他目标。单项指南目标不能不经协调全部相加。\u003c/p\u003e\n\u003cp\u003e可以请求一份统一计划：主要协调人、优先问题、可观察问题和复核时间。必要时讨论简化剂次与安排，但具体调整由团队完成。家属不要自己删药，也不要将复杂清单执行失败归咎于本人不配合。\u003c/p\u003e\n\u003ch3 id=\"c14-s003\"\u003e14.4　八十五至八十九岁：压力测试照护系统\u003c/h3\u003e\n\u003cp\u003e在平稳时讨论主照护者生病、夜间设备故障、临时复诊和药物短缺。每种情境有一个真实联系人和下一步，不只写家人负责。备用人需要掌握当前计划，不能危机时从零学习。\u003c/p\u003e\n\u003cp\u003e明确受训者才能做的操作。复杂转移、管路、伤口和吞咽不能凭短视频上手。培训应有示范、回演、纠错和求助入口；多发几页说明书不等于学会。\u003c/p\u003e\n\u003ch3 id=\"c14-s004\"\u003e14.5　晨间第一轮：先看状态，再开始任务\u003c/h3\u003e\n\u003cp\u003e进入前让本人知道谁来了、准备做什么，确认是否清醒、是否有新不适。不要一进门就拉被子、测一串数值和安排起床。能表达者先听本人，表达困难者观察与平常不同的动作、表情、呼吸和反应。\u003c/p\u003e\n\u003cp\u003e把当天必须任务与可推迟任务分开。本人明显疲倦时，可以调整洗浴或外出，不因此取消必要治疗与安全。晨间例行流程的目的应是帮助进入一天，而非在短时间完成最多护理记录。\u003c/p\u003e\n\u003ch3 id=\"c14-s005\"\u003e14.6　转移与起身：保护两个人\u003c/h3\u003e\n\u003cp\u003e需要协助的人按已经评估的方式转移，不突然拉手臂、不靠一名家属硬抱。实际设备的刹车、脚踏、扶手和高度按专业指导核对。不能凭看起来结实就把桌椅当承重支撑。\u003c/p\u003e\n\u003cp\u003e操作前说明目标、确认本人能做的部分、清理路线、准备好终点。途中才找椅子或调整脚踏会增加混乱。若今天能力明显不同于原计划，暂停并求助，不强行照旧完成。照护者腰背或肩部受伤也会破坏照护连续性，因此工具与培训同时保护双方。\u003c/p\u003e\n\u003ch3 id=\"c14-s006\"\u003e14.7　如厕：时间、位置与尊严\u003c/h3\u003e\n\u003cp\u003e了解本人习惯、路线和求助方式，衣物易穿脱，必要设施可靠。门是否便于求助与保护隐私，可以提前共同决定，而不是在紧急时争论。不能因为担心弄脏就长期限制饮水或不让外出。\u003c/p\u003e\n\u003cp\u003e尿失禁值得评估类型和原因，不是必须接受的年龄结局；治疗与支持需要个体选择。\u003ca href=\"#s83\"\u003eS83\u003c/a\u003e 用品的作用是保持生活和皮肤舒适，不是代替评估。更换时先解释、适度遮挡，不在无关人面前讨论排泄细节。\u003c/p\u003e\n\u003ch3 id=\"c14-s007\"\u003e14.8　洗浴：不是每次都必须完成全套\u003c/h3\u003e\n\u003cp\u003e选择本人较有精力的时间，用品预先摆齐，地面和室温适宜，帮助范围提前说清。身体不适、伤口或医疗限制需要团队指导。不能为了固定护理表强行站立或长时间洗浴。\u003c/p\u003e\n\u003cp\u003e可根据状态分区清洁、调整时段或使用适合设施，但安全承重和水温控制不能省。衣物与毛巾准备好，避免洗完后长时间等待。本人能洗的部位保留自行完成，成人照护不要使用幼儿化语气。\u003c/p\u003e\n\u003ch3 id=\"c14-s008\"\u003e14.9　口腔与假牙：小任务连接进食与交流\u003c/h3\u003e\n\u003cp\u003e每天的口腔护理应有负责人，能够自己做就提供工具和适合姿势，不能只因吃得少而取消。牙痛、口腔破损、假牙不适或口干会影响进食，应提出来而不是只换成更软食物。\u003c/p\u003e\n\u003cp\u003e假牙清洁和夜间处理按牙科及产品要求，不以热水、强清洁剂或自行修磨解决。将牙刷、杯子和假牙容器明确区分，照护交接说明用品位置，避免被当作普通杂物丢弃。口腔完整规则见卷十九。\u003c/p\u003e\n\u003ch3 id=\"c14-s009\"\u003e14.10　穿衣：支持表达，也支持功能\u003c/h3\u003e\n\u003cp\u003e衣物选择考虑温度、摩擦、关节活动、管路和如厕，同时保留颜色、风格与个人偏好。不因便于照护就默认所有人只能穿同样衣物。扣子、拉链或鞋具困难可以改接口，不代表本人没有穿衣决定权。\u003c/p\u003e\n\u003cp\u003e协助前说明顺序，避免突然移动疼痛关节。发现新肿胀、皮肤破损或鞋子明显不合脚时记录并评估。本人愿意打扮不是不必要负担，它可能是重要身份和社交表达。\u003c/p\u003e\n\u003ch3 id=\"c14-s010\"\u003e14.11　进餐：完成一顿饭的真实链条\u003c/h3\u003e\n\u003cp\u003e先看食物能否获得、是否合口味、能否坐到餐桌、看清并拿起餐具。准备失败不能被归为食欲差。需要协助时尊重节奏，小范围提供选择，不边看手机边机械喂食。\u003c/p\u003e\n\u003cp\u003e观察吃到多少、是否疲惫、是否出现咳呛或不适，记录能改变下一步的异常。不要以盘子清空作为唯一成功，也不以一顿吃少立即强加大量营养品。持续摄入不足或体重无意下降，应讨论评估与适合营养支持。\u003c/p\u003e\n\u003ch3 id=\"c14-s011\"\u003e14.12　吞咽分支：不能靠大声催促\u003c/h3\u003e\n\u003cp\u003e进食饮水时咳嗽、呛咳、卡住感、湿性声音、气短或反复胸部感染等，需要及时评估吞咽；问题可能涉及不同食物和液体，并不只发生于高龄。\u003ca href=\"#s80\"\u003eS80\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e已确诊者使用评估后的姿势、质地、餐具和协助方案。不要给所有人统一加增稠剂、用吸管或仰头饮水，也不将药片随意碾碎混食。吞咽方案与药物剂型需要分别确认。急性气道梗阻按急救培训和调度处理，不能继续喂水试图冲下。\u003c/p\u003e\n\u003ch3 id=\"c14-s012\"\u003e14.13　皮肤与压力：按风险制定计划\u003c/h3\u003e\n\u003cp\u003e行动受限者更易发生压力损伤，骨突处持续变色、温热、硬软改变、疼痛或破损需要关注；较深肤色不一定呈鲜红。怀疑损伤应联系医疗人员，伴发热、流脓、明显加重疼痛等更需及时处理。\u003ca href=\"#s82\"\u003eS82\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e由团队制定换位、减压、皮肤与营养计划，频率依据风险、表面、状态和耐受，不能将固定两小时当作所有人的唯一答案。专用床垫不意味着无需其他护理。不要在可疑损伤处用力按摩，也不自行剪除组织或随意换药。\u003c/p\u003e\n\u003ch3 id=\"c14-s013\"\u003e14.14　药物交接：读得懂，还要知道已经做了什么\u003c/h3\u003e\n\u003cp\u003e每次变化更新同一份清单，明确从何时开始、旧药怎样处理、谁解释。新旧包装同时存在时避免重复。实际给药记录需要能区分已给、未给、拒绝或因何暂缓，不只写一个模糊勾号。\u003c/p\u003e\n\u003cp\u003e本人拒绝药物时先了解吞咽、恶心、困惑、担心或意愿，不偷偷藏入食物。隐蔽给药涉及严格医疗和法律边界，不能由家属自行决定。漏服和呕吐后的处理查具体药物计划，不自动补倍量。\u003c/p\u003e\n\u003ch3 id=\"c14-s014\"\u003e14.15　疼痛与不适：表达困难不代表没有感受\u003c/h3\u003e\n\u003cp\u003e询问具体位置、动作影响、开始时间和本人最希望缓解什么。无法流畅表达时，观察护住某部位、面部变化、回避移动、睡眠和行为改变，并提供适合沟通方式。观察用于帮助专业评估，不等于家属自行确定原因。\u003c/p\u003e\n\u003cp\u003e镇痛目标可以是能够翻身、吃饭、休息或交流。药物与非药物措施按团队安排，出现新严重症状先评估。不能把安静当作无痛，也不要求忍耐来避免被视为麻烦。\u003c/p\u003e\n\u003ch3 id=\"c14-s015\"\u003e14.16　认知改变：按具体决定支持\u003c/h3\u003e\n\u003cp\u003e痴呆不是正常老化必然结果，持续记忆、思考和生活能力变化需要评估与支持。\u003ca href=\"#s81\"\u003eS81\u003c/a\u003e 诊断不自动取消全部选择，决定能力可能因事项复杂度与状态不同，需要专业和当地法律框架判断。\u003c/p\u003e\n\u003cp\u003e沟通可放慢、减少同时提问、用熟悉语言与可见物帮助。可以给少量具体选择，而不是十个选项；也不要每次都考还记得我是谁。意见不同不等于没有判断能力，家属方便不能代替本人利益。\u003c/p\u003e\n\u003ch3 id=\"c14-s016\"\u003e14.17　突然混乱：不是等几天观察的年龄现象\u003c/h3\u003e\n\u003cp\u003e突然认不清时间地点、无法清楚思考、明显异常言行或新的困惑，应立即获得医疗帮助，原因可能多样，不自行诊断为痴呆加重。\u003ca href=\"#s79\"\u003eS79\u003c/a\u003e 既有认知问题也不能排除急性情况。\u003c/p\u003e\n\u003cp\u003e等待帮助时保持陪伴和环境安全，说明身份与位置，准备药物清单和最后正常时间。不要多人围问、争辩或强行要求回答大量问题；也不要为让人安静自行增加镇静药。急症优先覆盖普通照护表。\u003c/p\u003e\n\u003ch3 id=\"c14-s017\"\u003e14.18　视听和沟通设备\u003c/h3\u003e\n\u003cp\u003e眼镜、助听器、义齿和沟通板应在需要时可用、状态正常。设备找不到或没电，可能让人看似理解下降。就诊、住院和转移时记录随身物，不把它们当次要附件。\u003c/p\u003e\n\u003cp\u003e交流先减少背景干扰、面对本人、清楚说明，不在他面前只和照护者谈论他。辅助沟通可包含图片、文字、手势与技术，选择本人能使用的方式。对隐私问题提供尽可能独立的表达机会。\u003c/p\u003e\n\u003ch3 id=\"c14-s018\"\u003e14.19　白天仍应有生活，而不只是护理\u003c/h3\u003e\n\u003cp\u003e在护理之间安排本人选择的小活动：看窗外、听喜欢的音乐、读几段文字、触摸熟悉材料、与人讨论一件事。活动不必全被标为认知训练，也不要求表现提升。\u003c/p\u003e\n\u003cp\u003e保留贡献机会，例如选择菜单、讲一个经验、参与简单整理或决定来访。帮助者不要为了效率把所有决定提前完成。即使身体受限，一个人仍可以影响自己的环境和关系。\u003c/p\u003e\n\u003ch3 id=\"c14-s019\"\u003e14.20　出院交接必须重新核对能力\u003c/h3\u003e\n\u003cp\u003e出院前问当前哪些任务与住院前不同，能否安全转移、进食和如厕，是否需要设备与培训，何时复诊，谁负责结果。回到熟悉住所并不自动意味着原计划仍适用。\u003c/p\u003e\n\u003cp\u003e把停药、新药、剂量变化和临时药分别说明，确认药物实际到手。交通安排考虑座位、陪同、楼梯和到家后的第一顿饭，不止预订一辆车。若必要支持未准备，应向团队明确表达，不把困难藏到回家后。\u003c/p\u003e\n\u003ch3 id=\"c14-s020\"\u003e14.21　夜间方案：保护睡眠与响应能力\u003c/h3\u003e\n\u003cp\u003e明确夜间哪些事项必须观察，哪些无需例行叫醒，使用个体医疗计划而非家属焦虑决定。呼叫装置或电话在本人可使用位置，通道有适当照明，必要用品顺手。\u003c/p\u003e\n\u003cp\u003e传感器报警必须对应响应人、阈值和失败备份，否则只是制造声音。连续误报会消耗注意力，应复核设置与用途。监控需尊重同意与隐私，不把卧室全天直播默认成唯一照护方式。\u003c/p\u003e\n\u003ch3 id=\"c14-s021\"\u003e14.22　照护者也需要一份健康计划\u003c/h3\u003e\n\u003cp\u003e排班明确连续休息、吃饭、本人就医与替补。疲惫导致发怒、动作粗暴、重复用药或无法安全驾驶时，系统已经需要调整，不是再讲一次责任感。\u003c/p\u003e\n\u003cp\u003e求助应具体到任务与时段。不能让某一位亲属永远值班，只因他住得近、没有孩子或看起来好说话。正式服务也要核对能力、责任、费用与投诉渠道，监督服务质量不等于无边界监视工作人员。\u003c/p\u003e\n\u003ch3 id=\"c14-s022\"\u003e14.23　两种不同的日程示例\u003c/h3\u003e\n\u003cp\u003e独立生活但听视受限者，仍可自己安排早餐、活动与社交，新增只是照明、设备维护和预约支持，不需要全日护理。其日程重心仍是本人目标。\u003c/p\u003e\n\u003cp\u003e需要部分协助、近期出院者，晨间确认状态与计划，按受训方式转移，进食依吞咽与营养安排，白天穿插恢复和喜欢活动，晚上交接明确夜间响应。这里新增的不是更多娱乐项目，而是每个必要任务都有可执行接口。\u003c/p\u003e\n\u003ch3 id=\"c14-s023\"\u003e14.24　每周复盘只看真正变化\u003c/h3\u003e\n\u003cp\u003e问本人最不舒服的一件事、最希望保留的一件事，再问照护者哪个环节最容易失败。选择一个问题修正：用品位置、沟通方式、替班、药物整合或外出路径。\u003c/p\u003e\n\u003cp\u003e维持不变的规则折叠保存，不每周重写。出现新诊断、跌倒、出院、能力变化或支持者退出才重新展开相关部分。照护文件应跟随生活，而不是生活被文件驱动。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c14-s000","title":"14.1　按任务选择支持"},{"id":"c14-s001","title":"14.2　七十五至七十九岁：尽早处理具体变化"},{"id":"c14-s002","title":"14.3　八十至八十四岁：治疗负担也是负担"},{"id":"c14-s003","title":"14.4　八十五至八十九岁：压力测试照护系统"},{"id":"c14-s004","title":"14.5　晨间第一轮：先看状态，再开始任务"},{"id":"c14-s005","title":"14.6　转移与起身：保护两个人"},{"id":"c14-s006","title":"14.7　如厕：时间、位置与尊严"},{"id":"c14-s007","title":"14.8　洗浴：不是每次都必须完成全套"},{"id":"c14-s008","title":"14.9　口腔与假牙：小任务连接进食与交流"},{"id":"c14-s009","title":"14.10　穿衣：支持表达，也支持功能"},{"id":"c14-s010","title":"14.11　进餐：完成一顿饭的真实链条"},{"id":"c14-s011","title":"14.12　吞咽分支：不能靠大声催促"},{"id":"c14-s012","title":"14.13　皮肤与压力：按风险制定计划"},{"id":"c14-s013","title":"14.14　药物交接：读得懂，还要知道已经做了什么"},{"id":"c14-s014","title":"14.15　疼痛与不适：表达困难不代表没有感受"},{"id":"c14-s015","title":"14.16　认知改变：按具体决定支持"},{"id":"c14-s016","title":"14.17　突然混乱：不是等几天观察的年龄现象"},{"id":"c14-s017","title":"14.18　视听和沟通设备"},{"id":"c14-s018","title":"14.19　白天仍应有生活，而不只是护理"},{"id":"c14-s019","title":"14.20　出院交接必须重新核对能力"},{"id":"c14-s020","title":"14.21　夜间方案：保护睡眠与响应能力"},{"id":"c14-s021","title":"14.22　照护者也需要一份健康计划"},{"id":"c14-s022","title":"14.23　两种不同的日程示例"},{"id":"c14-s023","title":"14.24　每周复盘只看真正变化"}]},{"id":15,"title":"卷十五　九十至一百岁：继续生活，也为有限性作准备","html":"\u003ch2\u003e卷十五　九十至一百岁：继续生活，也为有限性作准备\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c15\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c15-s000\"\u003e15.1　九十岁不是临终诊断\u003c/h3\u003e\n\u003cp\u003e年龄不能单独决定预后、治疗价值或应否继续学习与活动。功能稳定的人继续前卷日程；需要帮助的人启用对应任务支持。生命末期部分由实际疾病和专业评估触发，也适用于更年轻的人，不能因为读到这一卷就自动进入。\u003c/p\u003e\n\u003cp\u003e本阶段先问今天仍然有什么值得期待。它可以是一位来访者、一段音乐、一顿熟悉饭、一封信、一点户外光线或一项尚未完成的工作。别人觉得小的事，可能是本人重要的生活内容，不需要达到宏大意义标准。\u003c/p\u003e\n\u003ch3 id=\"c15-s001\"\u003e15.2　九十至九十二岁：把愿望缩放，不直接删除\u003c/h3\u003e\n\u003cp\u003e无法完成原来的长途旅行，可以讨论更短路程、更多停留、无障碍支持或以其他方式接触相关人和地点。缩放目标保留其核心价值：是想见人、看景、离开日常，还是体验自主？不同核心有不同替代方式。\u003c/p\u003e\n\u003cp\u003e不能每次用年纪大别折腾结束讨论，也不能为完成愿望忽视本人当前安全。列出必要支持、可取消部分、停止条件和本人愿意承担的负担，让选择变得可说明。\u003c/p\u003e\n\u003ch3 id=\"c15-s002\"\u003e15.3　九十三至九十五岁：减少无意义的搬动与等待\u003c/h3\u003e\n\u003cp\u003e诊疗、家务和社交安排尽量整合，减少反复出门、长时间排队和不必要转换。预约前说明行动、听视、吞咽或沟通需要，确认场地和服务是否可及。\u003c/p\u003e\n\u003cp\u003e一次外出不仅算活动本身，还算准备、交通、转移和恢复。活动结束后持续多日无法回到平常状态，提示安排需要重新设计。允许拒绝来访或提前结束，不因别人特意来就必须配合到疲惫。\u003c/p\u003e\n\u003ch3 id=\"c15-s003\"\u003e15.4　九十六至九十九岁：保留对环境的影响力\u003c/h3\u003e\n\u003cp\u003e本人可以决定衣物、音乐、会见谁、怎样被称呼、房间物品和谈话内容。身体协助增加不应使所有决定自动转交。表达缓慢时给时间，不替每句话抢答。\u003c/p\u003e\n\u003cp\u003e生活史可以记录，但不是必须交付的最后作品。有人愿意讲过去，有人更想讨论今天，不要一直问还有什么遗憾。录音、拍摄和公开需同意，故事中的其他人也有隐私。\u003c/p\u003e\n\u003ch3 id=\"c15-s004\"\u003e15.5　一百岁生日当天\u003c/h3\u003e\n\u003cp\u003e先按本人状态完成平常需要，庆祝服从舒适与意愿，不让生日打断药物、休息和必要照护。邀请多少人、是否拍照、吃什么、持续多久，由本人尽可能决定。\u003c/p\u003e\n\u003cp\u003e不要求发表长寿秘诀，也不要把个人经历当可复制医学证据。可以庆祝生命与关系，而不从幸存者经验推导所有人照做就能百岁。生日之后继续按状态和目标生活，书到一百岁结束，人的权利不会结束。\u003c/p\u003e\n\u003ch3 id=\"c15-s005\"\u003e15.6　从疾病名称转向照护目标\u003c/h3\u003e\n\u003cp\u003e重病时先问最希望保留什么：清醒、交流、舒适、回家、继续某项活动，还是尽可能延长生命。目标可能相互牵制，应由本人和团队讨论，而不是默认所有人同样排序。\u003c/p\u003e\n\u003cp\u003e把目标转成可观察结果。例如希望见家人，需要交通、探视与症状控制；希望保持清醒，需要讨论药物和症状之间的取舍；希望在家，需要支持能力和突发处理。价值表达只有接到操作上，才真正影响照护。\u003c/p\u003e\n\u003ch3 id=\"c15-s006\"\u003e15.7　缓和医疗并不等于放弃\u003c/h3\u003e\n\u003cp\u003e缓和医疗关注严重疾病相关的身体、心理、社会和精神痛苦，可与其他治疗并行，不应只在最后几天才想到，也不限癌症或高龄。\u003ca href=\"#s23\"\u003eS23\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e提出转介时可以说目前症状和治疗负担已经影响生活，希望增加支持。它不自动取消原有治疗，也不是宣告某个准确死亡日期。服务可获得性不同，应向当前团队了解本地资源。\u003c/p\u003e\n\u003ch3 id=\"c15-s007\"\u003e15.8　治疗决策的四个问题\u003c/h3\u003e\n\u003cp\u003e这项治疗希望改善什么，发生机会和不确定性怎样；需要承受什么，包括住院、恢复和后续支持；不做或延后有哪些替代；结果多久能够评价。不要只问能不能做，还要问做了以后可能怎样生活。\u003c/p\u003e\n\u003cp\u003e数字无法提供时，要求描述合理的较好、常见和较坏情境。无法保证不等于毫无价值，能够实施也不等于符合本人目标。医疗决定须与专业人员共同完成，家庭会议不能替代临床判断。\u003c/p\u003e\n\u003ch3 id=\"c15-s008\"\u003e15.9　试行治疗与复评\u003c/h3\u003e\n\u003cp\u003e某些情况下可与团队商定有限时间的治疗尝试：目标、观察指标、复评日期和无效时下一步。适用性由医疗情况决定，不是家属自行设定停药期限。\u003c/p\u003e\n\u003cp\u003e提前讨论复评可以避免后来只能在继续所有治疗与突然全部停止之间二选一。记录的是共同理解，不是让本人签一份以后不能改变的承诺。情况变化或意愿改变时，重新讨论。\u003c/p\u003e\n\u003ch3 id=\"c15-s009\"\u003e15.10　抢救决定必须具体\u003c/h3\u003e\n\u003cp\u003e不实施心肺复苏的决定针对心肺复苏，不等于停止其他适当治疗、疼痛缓解、护理和支持。\u003ca href=\"#s87\"\u003eS87\u003c/a\u003e 相关术语、程序、文件效力和代理权限有地区差异，必须由本地团队和合格法律支持确认。\u003c/p\u003e\n\u003cp\u003e不要因年龄、残障、认知诊断或居住机构统一替一群人决定。也不能把家庭口头说不折腾当作完整有效医疗文件。日常紧急情况仍按已经正式确定的计划和当地急救要求处理，书中一般讨论不构成拒绝救治指令。\u003c/p\u003e\n\u003ch3 id=\"c15-s010\"\u003e15.11　预先照护计划是沟通，不只是签字\u003c/h3\u003e\n\u003cp\u003e记录谁应参与、本人重视什么、哪些情境特别担心、希望在哪里获得照护。文件应能在需要时找到，并让相关团队知道。重要变化后复核，不将多年前一句话脱离当时情境机械执行。\u003c/p\u003e\n\u003cp\u003e当本人暂时无法表达，依法有权参与者应尽量依据已知意愿与利益，而不是自己的恐惧、内疚或亲戚压力。存在分歧时请团队解释并使用适当伦理、社会工作或法律支持。\u003c/p\u003e\n\u003ch3 id=\"c15-s011\"\u003e15.12　在家、医院或机构：比较实际支持\u003c/h3\u003e\n\u003cp\u003e地点不是善终质量的唯一标准。在家需要实际照护、药物、设备、夜间响应和人员；医院可能提供某些症状处理，但也有环境与探视负担。机构质量需要具体观察，不由名字和装修判断。\u003c/p\u003e\n\u003cp\u003e选择前列出一天和夜间的真实需求，逐项确认谁完成。不要为满足一定在家的观念让一名亲属独自承担无法安全完成的任务，也不要为了成人方便忽略本人明确偏好。现实限制可以坦诚讨论，不需要包装成唯一正确选择。\u003c/p\u003e\n\u003ch3 id=\"c15-s012\"\u003e15.13　症状控制：不把忍耐当作美德\u003c/h3\u003e\n\u003cp\u003e疼痛、气促、恶心、便秘、焦虑和其他困扰应反馈团队。描述严重程度之外，还说影响了什么。治疗方案、救急药和何时联系由专业人员明确，不能自行增加镇静或止痛药。\u003c/p\u003e\n\u003cp\u003e照护者可以学习非药物支持和观察，但不能因怕成瘾或怕麻烦擅自扣除已经合理安排的治疗。担心副作用应讨论监测和替代，而不是让本人在无解释中忍受。\u003c/p\u003e\n\u003ch3 id=\"c15-s013\"\u003e15.14　食物与水：临终情境与普通营养不同\u003c/h3\u003e\n\u003cp\u003e经过团队判断处于临终阶段时，食欲和吞咽可能变化，强迫进食并非必要照护。无法安全吞咽时，药物途径和口腔舒适需要专业安排；家属可按指导湿润口唇，不擅自灌水。\u003ca href=\"#s86\"\u003eS86\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这个分支不能用于解释所有高龄者吃得少。尚未明确临终、出现新吞咽或摄入问题时仍需评估可治疗原因。不要因为怕延长痛苦取消普通病人的食物，也不要因为怕饿着对临终者强行喂食。\u003c/p\u003e\n\u003ch3 id=\"c15-s014\"\u003e15.15　呼吸、意识与行为变化\u003c/h3\u003e\n\u003cp\u003e临终时可能更嗜睡、呼吸模式改变或出现混乱，但每个人不同，家属不能仅凭一项表现自行判断剩余时间。新痛苦或行为改变仍要联系团队，可能存在可处理原因。\u003ca href=\"#s86\"\u003eS86\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e准备好夜间电话、明确谁来评估和什么情况呼叫急救。若此前没有正式末期计划，突然无反应或呼吸异常仍按急症处理。避免把一般网页描述当作可以不求助的依据。\u003c/p\u003e\n\u003ch3 id=\"c15-s015\"\u003e15.16　陪伴无需持续说话\u003c/h3\u003e\n\u003cp\u003e可以安静坐着、握手前先询问、读熟悉文字、放本人喜欢且不刺激的声音。本人不想说话时允许沉默。别要求一直保持积极、完成和解或安慰所有来访者。\u003c/p\u003e\n\u003cp\u003e不要在床边只讨论费用、遗产和谁付出多，仿佛本人已经不在。即使反应减少，仍以尊重方式说明照护。关系中的复杂历史不必在最后时刻被强制改写成圆满故事。\u003c/p\u003e\n\u003ch3 id=\"c15-s016\"\u003e15.17　遗憾、道歉与未完成关系\u003c/h3\u003e\n\u003cp\u003e愿意表达时可以说感谢、歉意、爱或具体回忆，但对方没有义务立即原谅。受过伤害的人不必因病情而放弃边界。和解不是获得好结局的必需条件。\u003c/p\u003e\n\u003cp\u003e不能见面时可选择信件、录音或由可信人转达，也可以决定不联系。尊重双方，不用最后机会施压。未完成本来就是人生的一部分，不必把所有关系问题在短期内解决。\u003c/p\u003e\n\u003ch3 id=\"c15-s017\"\u003e15.18　安排身后事务，但不让事务吞掉当下\u003c/h3\u003e\n\u003cp\u003e有意愿和能力时，按所在地法律整理遗嘱、授权、财产与数字账户处理，寻求合格支持。医疗意愿与财产文件用途不同，不要混成一份未经核实的万能模板。\u003c/p\u003e\n\u003cp\u003e将必要资料位置和联系人交给适当人员，权限最小化。不要在本人虚弱时匆忙施压签署重大文件，也不要公开密码作为唯一交接方式。争议与利益冲突需要独立协助。\u003c/p\u003e\n\u003ch3 id=\"c15-s018\"\u003e15.19　死亡发生后的第一轮行动\u003c/h3\u003e\n\u003cp\u003e按已有照护计划联系负责团队或当地应急服务，由有资格人员确认并说明后续程序。地点、情境与法律不同，家属不应仅凭本书自行确认死亡、移除设备或处理遗体。\u003c/p\u003e\n\u003cp\u003e安排可信人陪伴主要家属，暂缓不必要群消息和重大财务决定。必要行政事项分配责任并记录，不让悲伤最强的一人同时处理所有电话。尊重宗教文化，但安全、法律与本人既往意愿仍需协调。\u003c/p\u003e\n\u003ch3 id=\"c15-s019\"\u003e15.20　哀伤没有统一进度表\u003c/h3\u003e\n\u003cp\u003e有人哭、有人成为事务处理者、有人暂时麻木，不能据此排名爱得深浅。不要要求必须经过固定阶段才算正常，也不规定多久必须恢复社交或清理遗物。\u003c/p\u003e\n\u003cp\u003e保持基本进食、睡眠机会和支持渠道，允许具体帮助。若长期明显不能生活、出现危险物质使用或自伤想法，应寻求专业帮助；急迫风险进入安全路径。失去宠物、朋友或非传统关系同样可以带来真实哀伤。\u003c/p\u003e\n\u003ch3 id=\"c15-s020\"\u003e15.21　留下什么，不必由社会标准决定\u003c/h3\u003e\n\u003cp\u003e遗产可以是财物、技能、作品、关系、照护、一个被改善的地方，也可以只是一段认真生活过的经历。无需为了证明一生值得而产出最后一本书或公开故事。\u003c/p\u003e\n\u003cp\u003e记录时选择本人愿意保留的片段，并注明回忆可能有误，不将口述自动变成无争议事实。家人可以同时保存不同版本，尊重复杂性，而不为了纪念删除全部矛盾。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开生命末期支持接口L：只有实际情况适用时启用\u003c/summary\u003e\n\u003cp\u003e当天先确认舒适、症状、意愿与正式医疗计划。必要护理和联系保持可靠，其他任务以本人可承受和愿意为准。活动可以缩短，来访可以拒绝，沟通可以沉默。\u003c/p\u003e\n\u003cp\u003e照护者有替班和求助，重要变化及时反馈。不要用普通健康打卡要求临终者，也不要把本接口套到仅仅高龄的人。若情况改善或目标改变，重新进入相应生活与治疗路径。\u003c/p\u003e\n\u003c/details\u003e\n\u003cp\u003e一百年的指南最后并不需要得出用身体榨取最多产出的结论。更重要的是，在拥有能力时发展它，在能力变化时找到支持，在关系中保有尊严，在不确定中作诚实选择，并允许有限的生命本身具有价值。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c15-s000","title":"15.1　九十岁不是临终诊断"},{"id":"c15-s001","title":"15.2　九十至九十二岁：把愿望缩放，不直接删除"},{"id":"c15-s002","title":"15.3　九十三至九十五岁：减少无意义的搬动与等待"},{"id":"c15-s003","title":"15.4　九十六至九十九岁：保留对环境的影响力"},{"id":"c15-s004","title":"15.5　一百岁生日当天"},{"id":"c15-s005","title":"15.6　从疾病名称转向照护目标"},{"id":"c15-s006","title":"15.7　缓和医疗并不等于放弃"},{"id":"c15-s007","title":"15.8　治疗决策的四个问题"},{"id":"c15-s008","title":"15.9　试行治疗与复评"},{"id":"c15-s009","title":"15.10　抢救决定必须具体"},{"id":"c15-s010","title":"15.11　预先照护计划是沟通，不只是签字"},{"id":"c15-s011","title":"15.12　在家、医院或机构：比较实际支持"},{"id":"c15-s012","title":"15.13　症状控制：不把忍耐当作美德"},{"id":"c15-s013","title":"15.14　食物与水：临终情境与普通营养不同"},{"id":"c15-s014","title":"15.15　呼吸、意识与行为变化"},{"id":"c15-s015","title":"15.16　陪伴无需持续说话"},{"id":"c15-s016","title":"15.17　遗憾、道歉与未完成关系"},{"id":"c15-s017","title":"15.18　安排身后事务，但不让事务吞掉当下"},{"id":"c15-s018","title":"15.19　死亡发生后的第一轮行动"},{"id":"c15-s019","title":"15.20　哀伤没有统一进度表"},{"id":"c15-s020","title":"15.21　留下什么，不必由社会标准决定"}]},{"id":16,"title":"卷十六　睡眠与节律：给身体可靠的恢复机会","html":"\u003ch2\u003e卷十六　睡眠与节律：给身体可靠的恢复机会\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c16\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c16-s000\"\u003e16.1　先问睡眠机会，而不是先买助眠产品\u003c/h3\u003e\n\u003cp\u003e睡不够、想睡却睡不着、睡了仍很困，是不同问题。前者可能主要缺时间，第二类需要了解失眠、节律、疼痛和环境，第三类可能涉及呼吸、药物或其他疾病。不能用同一份睡前仪式包办。\u003c/p\u003e\n\u003cp\u003e先画真实的一天：必须何时起床，通勤多久，照护何时发生，工作何时结束，躺下后是否仍在处理事务。若只有五小时可睡，却试图靠床垫获得八小时恢复，结构上已经不成立。真正的第一动作可能是协商任务、交通或照护排班。\u003c/p\u003e\n\u003ch3 id=\"c16-s001\"\u003e16.2　分龄总时长参考\u003c/h3\u003e\n\u003cp\u003e以下为CDC公布的群体参考，婴幼儿包含午睡。它们用于识别机会是否大致足够，不是个体诊断阈值，也不保证在范围内就没有问题。\u003ca href=\"#s05\"\u003eS05\u003c/a\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e年龄\u003c/th\u003e\n\u003cth\u003e每二十四小时睡眠参考\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e零至三个月\u003c/td\u003e\n\u003ctd\u003e十四至十七小时\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e四至十二个月\u003c/td\u003e\n\u003ctd\u003e十二至十六小时\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e一至两岁\u003c/td\u003e\n\u003ctd\u003e十一至十四小时\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e三至五岁\u003c/td\u003e\n\u003ctd\u003e十至十三小时\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e六至十二岁\u003c/td\u003e\n\u003ctd\u003e九至十二小时\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e十三至十七岁\u003c/td\u003e\n\u003ctd\u003e八至十小时\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e十八至六十岁\u003c/td\u003e\n\u003ctd\u003e至少七小时\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e六十一至六十四岁\u003c/td\u003e\n\u003ctd\u003e七至九小时\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e六十五岁及以上\u003c/td\u003e\n\u003ctd\u003e七至八小时\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e新生儿仍优先保证适用喂养、安全睡眠和医学观察，不能为凑表格小时数延迟喂养或叫醒后训练。成人也不因某晚多睡就自动认为有病；要看变化、日间功能和其他症状。\u003c/p\u003e\n\u003ch3 id=\"c16-s002\"\u003e16.3　四种状态的入口\u003c/h3\u003e\n\u003cp\u003e第一种是机会不足：日程不给睡眠时间，先调整约束。第二种是环境不允许：噪声、光线、温度、拥挤、照护打断，先寻找具体改造。第三种是有机会但持续难睡：考虑专业评估。第四种是睡眠中呼吸、动作或白天清醒出现异常：按相应医疗路径处理。\u003c/p\u003e\n\u003cp\u003e这些状态可以叠加。一个轮班照护者既可能机会不足，也可能有呼吸暂停。不要因为找到一个合理解释就停止识别其他明显问题，也不要一次把所有可能疾病都当成自己的诊断。\u003c/p\u003e\n\u003ch3 id=\"c16-s003\"\u003e16.4　起床锚点与现实弹性\u003c/h3\u003e\n\u003cp\u003e选择与工作、学习和生活相容的起床范围，尽量保持可预测；入睡机会则根据需要向前安排。规律、安静较暗的睡眠环境、适当日间活动，以及避免临近睡眠的刺激物，是常用基础做法。\u003ca href=\"#s88\"\u003eS88\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e规律不是每天误差必须归零。家庭危机、疾病和旅行可能改变安排，回到常规即可，不用第二天极端惩罚补偿。长期不断漂移则值得寻找原因，是工作制度、社交、拖延结束工作还是节律本身难以匹配。\u003c/p\u003e\n\u003ch3 id=\"c16-s004\"\u003e16.5　日间光线与夜间环境\u003c/h3\u003e\n\u003cp\u003e白天有条件时接触自然日间环境，晚上逐步降低不必要的强光和高刺激活动。照明应服务实际任务：需要安全如厕和照护时不能一味追求全黑。感光、眼病或特殊治疗者按专业建议安排。\u003c/p\u003e\n\u003cp\u003e不要把普通环境管理变成自行实施强光治疗。强光设备、时间安排与某些精神或眼科情况有额外考虑。无法户外时先利用现实可获得的光线和生活节奏，不因为条件不足放弃所有改善。\u003c/p\u003e\n\u003ch3 id=\"c16-s005\"\u003e16.6　睡前不是第二个工作日\u003c/h3\u003e\n\u003cp\u003e设置一个可完成的结束流程：记录未完成处、准备必要物品、停止非紧急回复，再进入清洁和安静活动。重点是给未完成事项可靠位置，不是要求大脑瞬间清空。\u003c/p\u003e\n\u003cp\u003e睡前待办越长越可能变成新压力。洗澡、阅读、音乐或轻松交流选择适合的一两项即可。仪式被旅行打断不应使人相信今晚一定睡不好；它是支持，不是必须严格执行的安全咒语。\u003c/p\u003e\n\u003ch3 id=\"c16-s006\"\u003e16.7　咖啡因、酒精和其他物质\u003c/h3\u003e\n\u003cp\u003e查看所有来源与使用时间，包括咖啡、茶、能量饮料和某些药品。影响持续时间有个体差异，可从减少靠近睡眠的使用观察，而非统一用杯数判断。孕期的专门上限见卷二，不可混用一般成人习惯。\u003c/p\u003e\n\u003cp\u003e酒精不应成为助眠方案，尼古丁和其他刺激物同样需要考虑。\u003ca href=\"#s88\"\u003eS88\u003c/a\u003e 已经长期依赖酒精或镇静药者，不自行突然改变高风险用法，应寻求医疗指导，避免把戒断风险误当普通失眠。\u003c/p\u003e\n\u003ch3 id=\"c16-s007\"\u003e16.8　午睡要看用途\u003c/h3\u003e\n\u003cp\u003e午睡可以是补充、轮班安排或年龄需要，不是人人必须，也不是一概有害。若晚间难睡且午睡很长，记录时点与变化，和专业人员讨论。婴幼儿午睡不能套成人规则。\u003c/p\u003e\n\u003cp\u003e不要在必须马上驾驶或操作危险设备前，把短暂休息当成保证清醒的认证。醒后仍困就继续处理安全问题。午睡地点也要安全，特别是抱着婴儿、停在危险道路或使用可能遮挡呼吸的环境。\u003c/p\u003e\n\u003ch3 id=\"c16-s008\"\u003e16.9　晚上醒来时做什么\u003c/h3\u003e\n\u003cp\u003e偶尔醒来不必立即看表、计算损失或检查设备评分。先处理真实需要：如厕、温度、疼痛或照护，然后回到适合休息的状态。反复确认自己有没有睡着，可能使注意力持续围绕睡眠表现。\u003c/p\u003e\n\u003cp\u003e若长时间清醒且明显烦躁，可选择安全、低刺激活动，再在有睡意时返回；行动不便、跌倒风险或特定病情者需要适配，不能机械要求夜间下床。持续失眠应进入专业路径，不靠不断更换偏方。\u003c/p\u003e\n\u003ch3 id=\"c16-s009\"\u003e16.10　慢性失眠的治疗入口\u003c/h3\u003e\n\u003cp\u003e失眠认知行为治疗是慢性失眠常用的首选治疗，可通过专业面谈、电话或合适的线上方式开展，内容不只睡眠卫生，还包括思维、行为和睡眠安排。\u003ca href=\"#s17\"\u003eS17\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e其中涉及缩短卧床时间的部分不宜凭一句话自行极端执行。癫痫、双相障碍、明显日间困倦、危险职业或其他复杂情况需要专业调整。不能用短期睡得更少作为意志训练，也不把本书的生活建议等同完整治疗。\u003c/p\u003e\n\u003ch3 id=\"c16-s010\"\u003e16.11　呼吸相关问题\u003c/h3\u003e\n\u003cp\u003e打鼾伴被目击的呼吸暂停、喘憋和白天困倦时，向医疗人员描述具体观察，必要时评估。诊断与治疗见相应睡眠服务，不能用一晚手机录音或手表排除。\u003ca href=\"#s77\"\u003eS77\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e已经使用呼吸治疗设备者，旅行、面罩不适、漏气、皮肤压痛和清洁问题应向服务团队反馈。不要因为某晚感觉好就自行停用，也不要因为设备难受而默默放弃；可调整的接口问题需要被看见。\u003c/p\u003e\n\u003ch3 id=\"c16-s011\"\u003e16.12　夜间疼痛、夜尿与胃部不适\u003c/h3\u003e\n\u003cp\u003e记录是哪种症状先出现，是否与姿势、进餐、药物或活动有关。频繁被症状打断时，处理原因比单纯增加助眠用品重要。不能为减少夜尿随意严重限水，不能用多种止痛与镇静产品叠加解决。\u003c/p\u003e\n\u003cp\u003e卧室改造可以帮助，但不应掩盖新症状。新出现明显胸痛、严重气短、意识变化等，按安全卷处理，不因发生在夜里就归为焦虑或睡不好。\u003c/p\u003e\n\u003ch3 id=\"c16-s012\"\u003e16.13　儿童入睡：支持者共同执行\u003c/h3\u003e\n\u003cp\u003e先确认安全、年龄需要、喂养与身体状况，再讨论稳定顺序和回应方式。实际照护者要能执行同一套基本计划，不能一人使用一种方法并互相责备。幼儿对分离或环境变化的反应也需要理解。\u003c/p\u003e\n\u003cp\u003e不要以停止哭声为唯一效果指标。观察孩子白天功能、照护者状态、是否有疼痛或呼吸问题。褪黑素不是儿童日程管理的默认工具，使用前应与医疗人员讨论。\u003ca href=\"#s89\"\u003eS89\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c16-s013\"\u003e16.14　青少年：先修日程，不羞辱生物节律\u003c/h3\u003e\n\u003cp\u003e把上学、通勤、训练、作业和社交总量放在一起。学校起得早而任务结束晚时，问题不能全部由孩子承担。减少临睡前争执，协商设备存放和提醒，给真正的睡眠机会。\u003c/p\u003e\n\u003cp\u003e周末补觉可以显示平日不足，但不能仅凭晚起诊断懒惰。若长期睡得很晚且难以匹配要求，寻求节律相关评估。考试冲刺期间也需保护最低机会，不把通宵视为努力证明。\u003c/p\u003e\n\u003ch3 id=\"c16-s014\"\u003e16.15　轮班：把安全放在排班里\u003c/h3\u003e\n\u003cp\u003e轮班需要根据实际班次安排睡眠、光线和恢复，不能照搬白班起居。NIOSH提供专门培训，强调工作安排与个体策略共同作用。\u003ca href=\"#s90\"\u003eS90\u003c/a\u003e 若可以选择，向雇主讨论足够恢复和疲劳风险，而不只购买提神物。\u003c/p\u003e\n\u003cp\u003e下班前决定能否安全回家；明显困倦时寻求替代交通或适当安全休息。白天睡眠与家人共同约定不打扰时段，同时留出真正紧急联系。照护儿童者需要实际替班，耳塞不能解决无人照护。\u003c/p\u003e\n\u003ch3 id=\"c16-s015\"\u003e16.16　跨时区旅行\u003c/h3\u003e\n\u003cp\u003e先看出发与到达时间、需要执行的任务、停留长度和药物时点，再决定是否逐步调整。不是所有旅行都值得强行完全倒时差。重要驾驶、手术、考试或高风险工作要考虑到达后的恢复。\u003c/p\u003e\n\u003cp\u003e褪黑素在某些节律问题和时差中可能有用途，但时点、剂量、产品和个体情况需要核对，不是越多越好。儿童、孕哺期、复杂疾病及长期使用的安全与证据存在边界，应咨询专业人员。\u003ca href=\"#s89\"\u003eS89\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c16-s016\"\u003e16.17　照护者夜间被打断\u003c/h3\u003e\n\u003cp\u003e先区分哪些夜间任务真的必要、哪些可由其他人接手、哪些是流程不清造成重复。将用品提前准备、明确交接和减少无意义叫醒，可能比任何助眠技巧更有效。\u003c/p\u003e\n\u003cp\u003e交替值班要能形成实际连续休息，不是一人负责主照护另一人一直被叫来指导。需要全天照护时讨论正式服务与资源，不能要求家庭靠永久睡眠剥夺运转。\u003c/p\u003e\n\u003ch3 id=\"c16-s017\"\u003e16.18　高龄睡眠与夜间安全\u003c/h3\u003e\n\u003cp\u003e不要因为年龄就要求在床上停留更久，也不要将白天困倦全部归为老化。夜间照明、助具、厕所路线和药物需要共同复核。睡眠计划不能增加跌倒风险。\u003c/p\u003e\n\u003cp\u003e认知改变、夜间不安或昼夜颠倒应结合疾病、药物、环境和日间活动评估，不能自行用更多镇静药压下行为。本人舒适与照护者安全都要进入计划。\u003c/p\u003e\n\u003ch3 id=\"c16-s018\"\u003e16.19　睡眠日记只记录能用的信息\u003c/h3\u003e\n\u003cp\u003e简记大致入床、起床、估计清醒段、午睡、咖啡因与明显事件，不需要每次醒来立即开灯记录。次日大致补记即可。重点是模式和生活影响，不是获得秒级精确。\u003c/p\u003e\n\u003cp\u003e日记用于回答一个问题，例如是不是工作日机会太少、某段午睡是否影响夜间、症状是否有规律。问题回答后可以降频，持续记录没有决策用途的数据并不自动更科学。\u003c/p\u003e\n\u003ch3 id=\"c16-s019\"\u003e16.20　穿戴设备：辅助观察，不负责判定一夜价值\u003c/h3\u003e\n\u003cp\u003e设备输出是估计和算法结果，不能仅凭深睡或睡眠分数自行诊断与用药。比较时设备、佩戴和算法变化都可能影响结果。临床疑问需要合适评估，消费设备不替代。\u003c/p\u003e\n\u003cp\u003e可先看本人是否恢复、是否困倦、是否能够安全完成生活，再参考趋势。数据与体感长期矛盾时寻求解释，不自动相信更精细的图。如果每天查看造成焦虑，可以停用一段或只定期看总趋势。\u003c/p\u003e\n\u003ch3 id=\"c16-s020\"\u003e16.21　环境升级的顺序\u003c/h3\u003e\n\u003cp\u003e先解决噪声源、光线、温度舒适、床铺适配和房间用途，再考虑设备。昂贵床垫不能补偿没有睡眠时间，白噪声不能替代处理危险设备声或婴儿求助，香氛也可能造成刺激。\u003c/p\u003e\n\u003cp\u003e共同居住时明确打扰和紧急例外；环境无法完全控制时寻找可行降级，例如遮光、调整位置、协商安静时段。安全与通风不应为全黑或隔音被牺牲。\u003c/p\u003e\n\u003ch3 id=\"c16-s021\"\u003e16.22　七日睡眠排查示例\u003c/h3\u003e\n\u003cp\u003e第一天只画机会，第二天查主要干扰，第三天核对刺激物和药物，第四天确认是否有呼吸或症状线索，第五天调整一个环境接口，第六天审视日间功能，第七天决定继续观察还是求助。这是整理顺序，不是七天治愈承诺。\u003c/p\u003e\n\u003cp\u003e一次只改少量变量，才能知道什么有帮助。无改善不代表不努力，可能说明原假设不对。持续明显困扰、危险困倦或异常睡眠表现，不必等七天结束再联系专业人员。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开睡眠专题调用规则\u003c/summary\u003e\n\u003cp\u003e每天保留足够机会与适宜环境；没有新问题就继续，不重新研究所有技巧。工作、照护、疾病或时区变化时展开对应分支。危险清醒度问题当日处理，持续失眠与呼吸等问题进入专业路径。\u003c/p\u003e\n\u003cp\u003e不设每天必须获得的深睡分数，不以偶发坏夜惩罚第二天。睡眠服务于清醒时的安全与生活，而不是成为另一项永远达不到的绩效指标。\u003c/p\u003e\n\u003c/details\u003e\n\u003chr/\u003e\n","sections":[{"id":"c16-s000","title":"16.1　先问睡眠机会，而不是先买助眠产品"},{"id":"c16-s001","title":"16.2　分龄总时长参考"},{"id":"c16-s002","title":"16.3　四种状态的入口"},{"id":"c16-s003","title":"16.4　起床锚点与现实弹性"},{"id":"c16-s004","title":"16.5　日间光线与夜间环境"},{"id":"c16-s005","title":"16.6　睡前不是第二个工作日"},{"id":"c16-s006","title":"16.7　咖啡因、酒精和其他物质"},{"id":"c16-s007","title":"16.8　午睡要看用途"},{"id":"c16-s008","title":"16.9　晚上醒来时做什么"},{"id":"c16-s009","title":"16.10　慢性失眠的治疗入口"},{"id":"c16-s010","title":"16.11　呼吸相关问题"},{"id":"c16-s011","title":"16.12　夜间疼痛、夜尿与胃部不适"},{"id":"c16-s012","title":"16.13　儿童入睡：支持者共同执行"},{"id":"c16-s013","title":"16.14　青少年：先修日程，不羞辱生物节律"},{"id":"c16-s014","title":"16.15　轮班：把安全放在排班里"},{"id":"c16-s015","title":"16.16　跨时区旅行"},{"id":"c16-s016","title":"16.17　照护者夜间被打断"},{"id":"c16-s017","title":"16.18　高龄睡眠与夜间安全"},{"id":"c16-s018","title":"16.19　睡眠日记只记录能用的信息"},{"id":"c16-s019","title":"16.20　穿戴设备：辅助观察，不负责判定一夜价值"},{"id":"c16-s020","title":"16.21　环境升级的顺序"},{"id":"c16-s021","title":"16.22　七日睡眠排查示例"}]},{"id":17,"title":"卷十七　饮食、营养与厨房：每天都要运行的供给系统","html":"\u003ch2\u003e卷十七　饮食、营养与厨房：每天都要运行的供给系统\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c17\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c17-s000\"\u003e17.1　先辨认正在解决哪一种问题\u003c/h3\u003e\n\u003cp\u003e吃饭的困难至少有五种：没有稳定食物，食物不安全，总量或结构不合适，身体无法正常进食，以及与食物的关系充满恐惧。它们需要不同方案。没有厨房的人需要可获得的餐食；吞咽困难的人需要专业评估；进食障碍者不适合再增加称重和热量纪律。不能给所有人同一张“少吃多动”的纸。\u003c/p\u003e\n\u003cp\u003e第一次整理饮食，不必先下载记录应用。看三个普通日：实际什么时候吃、在哪里获得、谁准备、什么最容易缺失、吃完感觉怎样。把周末聚餐与出差另记，不用一个刻意表现完美的日子代表全年。只有知道真实流程，才知道应改采购、份量、选择、烹饪，还是时间安排。\u003c/p\u003e\n\u003cp\u003e本卷默认能够正常经口进食的一般人群。婴儿奶与辅食使用卷四、卷五；妊娠使用孕期分支；吞咽障碍、慢性肾病、特殊代谢疾病、管饲、严重过敏等使用个体方案。一个食物对多数人合适，不代表对每个病情、每一种质地都安全。\u003c/p\u003e\n\u003ch3 id=\"c17-s001\"\u003e17.2　建立一餐的骨架，而不是背完整菜单\u003c/h3\u003e\n\u003cp\u003e一种可选编排是每餐先考虑三件东西：提供主要能量的主食，明确的蛋白质来源，以及蔬菜或水果等植物性食物；再根据全天饮食安排奶类或合适替代来源、油脂和饮水。它不是每餐必须等比例摆盘的处方，混合菜、面食、粥饭和地方饮食也可以拆出这些部分。\u003c/p\u003e\n\u003cp\u003e例如一碗面不必被判为“不健康”，可以看是否只有面和汤，是否能加入鸡蛋、豆制品或其他合适来源，是否有蔬菜，汤和调味是否占据太多盐。一份沙拉也不自动营养完整，需要看能量、蛋白来源和整体份量。名称与外观不能替代构成。\u003c/p\u003e\n\u003cp\u003e当资源有限，先补最明显缺口，不追求每餐完美。连续几天没有蔬菜，就解决购买和准备；早餐只有甜饮，就考虑更稳定的食物组合；晚上总因疲惫放弃进食，就准备一个容易获得的备用餐。改动的价值来自长期能执行，而非拍照时符合某种风格。\u003c/p\u003e\n\u003ch3 id=\"c17-s002\"\u003e17.3　少数参考数字如何使用\u003c/h3\u003e\n\u003cp\u003eWHO的成人公共卫生参考包括每天至少四百克蔬果、食盐少于五克、游离糖低于总能量的百分之十。游离糖包括添加糖及蜂蜜、糖浆、果汁等中的糖，不等于把完整水果一并禁止。这些是群体饮食方向，不是要求婴儿、所有疾病或营养不足者照搬同一个份量。\u003ca href=\"#s02\"\u003eS02\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eEFSA对健康成人提出的蛋白质人群参考摄入量为每天每千克体重零点八三克。它用于满足一般人群需要，不是运动员增肌、重病恢复、孕哺期或每个老年人的唯一最优数值，也不是所有人都应该额外购买相同克数蛋白粉。\u003ca href=\"#s97\"\u003eS97\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e数字进入日常前要说清单位和来源。包装上“每份”可能不是你实际吃的量；干重与熟重不同；一勺、一个碗、一个手掌并非标准测量。需要精细营养治疗时采用专业方案；普通家庭则可用短期核对建立直觉，不必终身称量每一口。\u003c/p\u003e\n\u003ch3 id=\"c17-s003\"\u003e17.4　主食与碳水化合物：先看形式、份量和情境\u003c/h3\u003e\n\u003cp\u003e主食可以来自米、面、薯类、杂粮和其他当地可获得的食物。选择时考虑个人耐受、烹饪条件、口味以及整餐结构。无需为了追逐一个饮食标签彻底撤掉熟悉食物，也不要把所有精制主食视为毒物。\u003c/p\u003e\n\u003cp\u003e一种渐进办法是保留熟悉做法，逐步加入能接受的全谷或豆类，而不是突然把整锅饭换成难以消化且不愿吃的组合。胃肠敏感者更需要观察份量和变化速度；有明确疾病饮食要求时向专业人员核对。纤维增加之后身体不舒服，不等于必须继续忍受来“排毒”。\u003c/p\u003e\n\u003cp\u003e工作量和活动量变化会改变实际需求。长时间体力劳动、训练、发育和恢复中的人，不能把另一位久坐成人的份量直接当成自己的上限。反过来，手表估算的消耗也不是无限补吃的精确凭证。先看持续体重与功能趋势、饥饱和专业目标，而非单餐奖惩。\u003c/p\u003e\n\u003ch3 id=\"c17-s004\"\u003e17.5　蛋白质：辨认来源与总量，不迷信一瓶粉\u003c/h3\u003e\n\u003cp\u003e家庭可轮换蛋、奶、鱼、肉、豆及其制品等适合自身的来源；是否采用纯植物饮食，可以由价值与偏好决定，但需要相应营养规划。每餐明确一个蛋白来源，是本书便于执行的编排，不是要求每一餐达到同一个克数。\u003c/p\u003e\n\u003cp\u003e蛋白粉是一种方便形式，不是训练资格证。考虑使用前，先看普通食物已提供多少、产品的有效成分和过敏原、每份总量、购买可靠性与是否真正解决便利问题。正在使用的复合饮品也算入总量，不要把不同名称的产品当作互不相关。\u003c/p\u003e\n\u003cp\u003e慢性肾病的蛋白、钠、钾、磷和液体安排可能随病情、化验、营养状态和是否透析而不同。既不能一律高蛋白，也不能自行把所有蛋白食物撤掉；应与肾脏和营养团队制定方案。\u003ca href=\"#s96\"\u003eS96\u003c/a\u003e “年纪大就一定多补”与“肾不好就什么都不能吃”，都是过度压缩。\u003c/p\u003e\n\u003ch3 id=\"c17-s005\"\u003e17.6　脂肪：选择之外，还有使用方式\u003c/h3\u003e\n\u003cp\u003e烹饪油、坚果、种子、乳制品、肉类、糕点和酱料都可能贡献脂肪，不能只计算锅里倒了多少油。WHO建议优先采用不饱和脂肪来源、限制饱和脂肪并避免工业反式脂肪；不需要把脂肪全部清零。\u003ca href=\"#s02\"\u003eS02\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e实际改动可以从调味方式开始：酱汁另放、少量试味、比较同类产品、减少反复油炸的日常依赖。坚果等食物按年龄和咀嚼吞咽能力提供，婴幼儿的形状风险调用协议C。健康成分并不能抵消噎食危险，也不意味着份量无需考虑。\u003c/p\u003e\n\u003cp\u003e油品购买看用途、储存和实际消耗速度。不要为追求多样性同时开很多瓶，最后长期受热、见光或放到过期。产品宣传中的“冷压”“天然”等词不能单独证明适合任何烹饪温度或所有身体目标，按标签和可靠食品指导使用。\u003c/p\u003e\n\u003ch3 id=\"c17-s006\"\u003e17.7　蔬果、豆类与纤维：改变供应比提醒更有效\u003c/h3\u003e\n\u003cp\u003e把每天最容易遗漏的植物食物放在容易准备的位置。可以一次洗好适量、分装合适份量，或使用符合需求的冷冻与罐装产品，不必只有昂贵新鲜有机食品才算合格。选择加工产品时核对调味和实际用途，避免把果汁当作所有水果的等价替代。\u003c/p\u003e\n\u003cp\u003e不同颜色可以作为家庭增加种类的提示，但不是必须凑齐固定色卡的营养处方。重点是长期多样、可获得、愿意吃。孩子可以参与采购和烹饪，但不因拒绝一次新食物被贴上难养标签。多次低压力接触与强迫吃完，是不同的环境。\u003c/p\u003e\n\u003cp\u003e便秘、腹泻、腹胀或其他症状持续时，应按具体情况评估。不能把所有胃肠问题归为纤维不足，更不能靠不断加粗粮解决吞咽、肠道疾病或药物相关问题。观察记录保留食物、份量、症状和时间即可，不随意排除越来越多的食物组。\u003c/p\u003e\n\u003ch3 id=\"c17-s007\"\u003e17.8　饮水：从可获得性和实际需要开始\u003c/h3\u003e\n\u003cp\u003e饮水计划先解决水源安全、容器可达和是否愿意饮用。办公桌上有水却整天无法离岗，或老人因怕找厕所而不喝，问题不只是忘记。改善厕所、休息和照护条件，常比一连串手机提醒更直接。\u003c/p\u003e\n\u003cp\u003e水分来自饮料和食物，需求随体形、活动、天气、孕哺与病情改变。本书不要求所有人每天强制八杯或固定大桶。存在心肾疾病、低钠风险或特定用药时，液体目标听从医疗计划；高温、长时运动、呕吐腹泻等情境也可能需要专门安排。\u003ca href=\"#s39\"\u003eS39\u003c/a\u003e\u003ca href=\"#s96\"\u003eS96\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e不要把尿液必须完全透明当作健康目标，也不要临睡前补齐全天“欠量”。需要记录摄入时同时记录杯子容量与实际喝入，不只数倒水次数。吞咽困难者的饮水质地与姿势由专业团队评估，不能随手加增稠剂或统一禁用吸管。\u003c/p\u003e\n\u003ch3 id=\"c17-s008\"\u003e17.9　铁：先查原因，再补充\u003c/h3\u003e\n\u003cp\u003e疲劳和脸色变化不能独立证明缺铁。需要时由医疗人员结合症状、病史与检查判断；缺铁也需要理解来源，例如饮食不足、吸收问题或失血，而不仅是把铁数值补上。月经过多、孕期与特定疾病可能改变风险，具体方案需个体化。\u003ca href=\"#s93\"\u003eS93\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e铁补充剂不是普通糖果，过量可能有害，尤其要避免儿童误食。标签中的铁化合物重量与元素铁含量不能混淆；治疗量和一般营养摄入量也不是同一概念。\u003ca href=\"#s93\"\u003eS93\u003c/a\u003e 已经使用复合维生素时，把其中铁含量告诉医生或药师。\u003c/p\u003e\n\u003cp\u003e服用后不适、漏服或与其他药物时间冲突，应询问调整办法，不自行加倍。治疗开始时就问何时复查、预计继续多久、什么情况提前联系。只要不再疲劳就立即停，或检查正常后无限期继续，都可能偏离原计划。\u003c/p\u003e\n\u003ch3 id=\"c17-s009\"\u003e17.10　钙与维生素D：食物、补充和风险分开看\u003c/h3\u003e\n\u003cp\u003e钙可以来自奶类、部分豆制品、强化食品等，具体含量取决于产品和制作方式。需要补充时先估计饮食已有来源，并让专业人员核对剂量、肾结石等病史及药物相互作用；钙片不能代替力量活动和骨健康整体评估。\u003ca href=\"#s94\"\u003eS94\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e维生素D需要随年龄、暴露和健康情况考虑。补充过量可以造成伤害，因此不以“脂溶性维生素越高越抗衰”为依据长期叠加；治疗缺乏的方案和一般日常补充也不能互换。\u003ca href=\"#s95\"\u003eS95\u003c/a\u003e 儿童与孕哺期使用适合人群的产品和指导。\u003c/p\u003e\n\u003cp\u003e实际核对时，把所有产品横向放在一起：复合维生素、钙D合剂、单独D滴剂、强化饮品。记录每份含量、每天份数和单位。很多错误来自重复产品，而不是任何单瓶看起来特别高。\u003c/p\u003e\n\u003ch3 id=\"c17-s010\"\u003e17.11　维生素B12与特殊饮食\u003c/h3\u003e\n\u003cp\u003e纯素或几乎不吃动物性食物的人，需要可靠的维生素B12来源，例如合适强化食品或补充方案；不能把普通未强化植物食物自动算作充足来源。某些吸收障碍、胃肠手术及药物使用也会影响B12状态，需按情况评估。\u003ca href=\"#s92\"\u003eS92\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e饮食选择涉及宗教、伦理、过敏、文化和经济条件时，先尊重选择，再寻找营养接口。不要把“吃得和多数人不一样”直接视为错误，也不因为价值坚定就忽略实际缺口。儿童、孕哺期与疾病人群采用限制性饮食，更值得获得有资质的营养支持。\u003c/p\u003e\n\u003cp\u003e缺乏已经明确时，治疗应考虑原因与吸收，不只是购买最贵的剂型。对并不缺乏的人，B12补充不能自动提供额外精力与运动表现。\u003ca href=\"#s92\"\u003eS92\u003c/a\u003e 体感改善或下降也不能独立替代必要评估。\u003c/p\u003e\n\u003ch3 id=\"c17-s011\"\u003e17.12　过敏、不耐受与“吃完不舒服”\u003c/h3\u003e\n\u003cp\u003e出现呼吸、喉舌肿胀、晕厥等严重反应，直接调用急救规则。已有明确食物过敏的人，应保存行动计划、核对交叉接触与外食信息，并按医生要求携带相关药物。不能因以前只有轻微反应就在家自行做激发试验。\u003ca href=\"#s36\"\u003eS36\u003c/a\u003e\u003ca href=\"#s55\"\u003eS55\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e非紧急胃肠不适可以记录发生时间、食物组合、份量和其他因素，带给专业人员。不要依据一份解释不清的商业检测，把几十种常用食物永久列入黑名单。排除饮食需要明确目的、期限、营养替代和复评方式，而不应无限扩张。\u003c/p\u003e\n\u003cp\u003e家庭中一人有过敏，储存、器具与标签要让其他照护者看懂。临时换包装、共享勺子、误把植物奶与普通奶混淆等，都是流程问题。规则应具体到动作，不只贴“注意过敏”四个字。\u003c/p\u003e\n\u003ch3 id=\"c17-s012\"\u003e17.13　厨房安全协议Q\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开：从购买到剩菜的共用操作\u003c/summary\u003e\n\u003cp\u003e处理食物前后按需要洗手，生食与可直接入口食物避免交叉污染。蔬果用流动安全水清洗，不用洗洁精或漂白液清洗可食部分；生肉清洗飞溅可能扩大污染，不靠反复冲洗代替正确烹饪。肉类熟度需要时用食物温度计确认，而非只看颜色。\u003ca href=\"#s91\"\u003eS91\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e易腐食物及时冷藏，一般不在室温放超过两小时；环境高于约三十二摄氏度时缩短至一小时。冰箱目标不高于四摄氏度。剩食分浅容器及时冷却冷藏，不等整锅在室温放一夜。冷冻不等于杀灭所有病原体。\u003ca href=\"#s91\"\u003eS91\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e按食品种类核对储存时限与再加热要求；不知道是否在安全温度存放时，不靠闻起来正常决定食用。外卖、饭盒和野餐同样需要冷链或保温安排。停电、洪水及水源异常时采用当地卫生部门指导，不以煮沸解决所有化学污染。\u003c/p\u003e\n\u003cp\u003e清洁用品和食品分区，容器保留名称和日期。冰箱内原料位置应避免汁液滴到熟食。轮换先用较早购入的合格食物，过期或可疑食物不拿来“练肠胃”，也不转送给更脆弱的人。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c17-s013\"\u003e17.14　低预算、少时间、无厨房的三种适配\u003c/h3\u003e\n\u003cp\u003e低预算时先比较实际可食份量、储存损耗和准备成本。大包装只有能够安全用完才便宜；赠送很多不适合的食物也不是真正节省。建立几种普通原料的重复组合，通常比追逐不断变化的“超级食物”更容易维持。\u003c/p\u003e\n\u003cp\u003e少时间时，把决定与烹饪分开。每周预先选择几套能完成的组合，采购时按组合拿材料，忙碌日直接调用。批量准备只做能够安全储存和按时吃完的量，不让节省时间变成食品风险。清洁、分装和补货同样计入总劳动。\u003c/p\u003e\n\u003cp\u003e无厨房时，寻找正规餐食、可直接食用食品、合适强化食品或可合法安全加热的方案。不要因不具备理想烹饪条件就放弃结构，也不要在禁止明火或电力不足的房间私搭危险设备。最优方案必须活在现实住所里。\u003c/p\u003e\n\u003ch3 id=\"c17-s014\"\u003e17.15　体重目标与进食关系\u003c/h3\u003e\n\u003cp\u003e决定改变体重前，先问目标来自健康、功能、运动表现、外貌意愿，还是外界羞辱。需要医学体重管理的人可以获得正规支持，但任何人都不应通过极端饥饿、催吐、滥用泻药或惩罚性运动完成目标。进食障碍可发生于不同体重的人，不能只看是否很瘦。\u003ca href=\"#s69\"\u003eS69\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e建立能长期维持的改变时，先调整一种高频行为，例如含糖饮料、份量不知不觉增加、进食时间混乱或缺乏可用正餐。不要同一天更换全部食物、训练和称重规则，那会使不适原因和真正有效的部分难以分辨。\u003c/p\u003e\n\u003cp\u003e体重只是结果之一。还要看体力、情绪、社交、饥饿、恢复和必要临床指标。若体重变化伴无意下降、持续疲劳、晕厥或其他症状，进入医疗评估，不以数字变小自动庆祝。\u003c/p\u003e\n\u003ch3 id=\"c17-s015\"\u003e17.16　一周饮食系统的维护顺序\u003c/h3\u003e\n\u003cp\u003e第一步看未来一周在哪里吃，不在家吃的餐次不要重复采购。第二步确定几套可以轮换的主餐和一套备用餐。第三步核对特殊饮食、过敏、药物与食物的要求。第四步安排准备、储存与清洁。第五步决定哪一项变化需要观察，其余保持稳定。\u003c/p\u003e\n\u003cp\u003e每餐开始前只问：安全么，够不够，有没有明显结构缺口，今天吃起来是否可承受。餐后无需写长报告。若没有明确治疗需要，通常不必把所有食材、排泄和感受永久量化。吃饭应该释放生活能力，而不是成为全天的审计工作。\u003c/p\u003e\n\u003cp\u003e本卷的终点是一套可靠供给：普通日子能够吃好，忙碌日子有替代，疾病时知道如何转入专业方案，快乐的食物也有位置。它不是一张一百年不变的菜单，而是一种能随身体与生活更新的组织方式。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c17-s000","title":"17.1　先辨认正在解决哪一种问题"},{"id":"c17-s001","title":"17.2　建立一餐的骨架，而不是背完整菜单"},{"id":"c17-s002","title":"17.3　少数参考数字如何使用"},{"id":"c17-s003","title":"17.4　主食与碳水化合物：先看形式、份量和情境"},{"id":"c17-s004","title":"17.5　蛋白质：辨认来源与总量，不迷信一瓶粉"},{"id":"c17-s005","title":"17.6　脂肪：选择之外，还有使用方式"},{"id":"c17-s006","title":"17.7　蔬果、豆类与纤维：改变供应比提醒更有效"},{"id":"c17-s007","title":"17.8　饮水：从可获得性和实际需要开始"},{"id":"c17-s008","title":"17.9　铁：先查原因，再补充"},{"id":"c17-s009","title":"17.10　钙与维生素D：食物、补充和风险分开看"},{"id":"c17-s010","title":"17.11　维生素B12与特殊饮食"},{"id":"c17-s011","title":"17.12　过敏、不耐受与“吃完不舒服”"},{"id":"c17-s012","title":"17.13　厨房安全协议Q"},{"id":"c17-s013","title":"17.14　低预算、少时间、无厨房的三种适配"},{"id":"c17-s014","title":"17.15　体重目标与进食关系"},{"id":"c17-s015","title":"17.16　一周饮食系统的维护顺序"}]},{"id":18,"title":"卷十八　运动、力量与恢复：用可适应的负荷维护行动能力","html":"\u003ch2\u003e卷十八　运动、力量与恢复：用可适应的负荷维护行动能力\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c18\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"activity-child-table\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c18-s000\"\u003e18.0　婴幼儿与五岁以上儿童：先分清总活动和训练\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e对象\u003c/th\u003e\n\u003cth\u003e活动参考\u003c/th\u003e\n\u003cth\u003e屏幕与使用说明\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e未满一岁\u003c/td\u003e\n\u003ctd\u003e每日多次互动地面活动；尚不能自由移动者，清醒俯卧逐步分散累积到每天至少三十分钟的WHO参考量\u003c/td\u003e\n\u003ctd\u003e不是要求出生第一天一次趴满三十分钟；先按新生儿短段起步。静坐看屏幕不推荐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e一至二岁\u003c/td\u003e\n\u003ctd\u003e全天多种强度活动合计至少一百八十分钟\u003c/td\u003e\n\u003ctd\u003e一岁不推荐静坐看屏幕；两岁不超过一小时，越少越好。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e三至四岁\u003c/td\u003e\n\u003ctd\u003e总活动至少一百八十分钟，其中至少六十分钟为中高强度\u003c/td\u003e\n\u003ctd\u003e静坐看屏幕不超过一小时，越少越好。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e五至十七岁\u003c/td\u003e\n\u003ctd\u003e一周内平均每天至少六十分钟中高强度、主要为有氧的活动；每周至少三天含较高强度及增强肌肉、骨骼的活动\u003c/td\u003e\n\u003ctd\u003e游戏、体育课与主动出行可以构成活动；不是每日额外加一小时成人式健身。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e前面三行据WHO五岁以下指导；婴幼儿被约束在推车等装置中时，不宜连续超过一小时。最后一行据WHO分龄活动摘要。\u003ca href=\"#s62\"\u003eS62\u003c/a\u003e\u003ca href=\"#s161\"\u003eS161\u003c/a\u003e 上述是健康促进参考，不覆盖疾病、恢复与特殊运动限制。\u003c/p\u003e\n\u003cp\u003e“一百八十分钟活动”可以由很多玩耍、移动和探索片段组成，不等于三小时高强度训练；“三十分钟俯卧”与安全睡眠仰卧必须严格分场景。不要从耐受很少的起点跳到总量目标，也不因当天不足惩罚性补量。\u003c/p\u003e\n\u003ch3 id=\"c18-s001\"\u003e18.1　先定义你想保有哪一种行动\u003c/h3\u003e\n\u003cp\u003e运动计划可以从具体生活任务开始：走到车站、抱起孩子、从地上站起、搬运物品、参加球赛、长途旅行，或让轮椅移动更省力。不同目标需要不同能力，不能只用跑步公里数代表全部体能。一个人耐力很好，仍可能缺少力量、平衡、技巧或适合的动作范围。\u003c/p\u003e\n\u003cp\u003e把目标分成耐力、力量、协调与平衡、活动范围、速度或专项技能，再问目前真正限制你的是哪一项。没有必要同时最大化全部维度。普通生活需要足够能力和安全余量，竞技目标才可能要求更专门的训练与恢复资源。\u003c/p\u003e\n\u003cp\u003e开始前记录当前能够舒服完成的活动，不做极限测试。若已有疾病、近期手术、妊娠风险、反复晕厥、运动胸痛、明显气短或其他担忧，先获得合适评估。不是所有普通散步都需要繁复体检，但有问题时也不能拿“运动有益”作为忽略症状的许可。\u003c/p\u003e\n\u003ch3 id=\"c18-s002\"\u003e18.2　分龄活动参考集中放在这里\u003c/h3\u003e\n\u003cp\u003e一般成人可朝每周至少一百五十分钟中等强度有氧活动，或七十五分钟高强度活动及其等效组合逐步安排，并在每周至少两天进行主要肌群的力量活动；进一步增加至约三百分钟中等强度活动可以是有能力者的选择，而不是所有新手第一周的任务。\u003ca href=\"#s101\"\u003eS101\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e老年人在适合的有氧与力量之外，应重视平衡，尤其行动受限者可在专业支持下把相关活动安排到一周三天或更多。儿童青少年的参考见卷八，五岁以下以全天主动游戏为主，不使用成人健身课替代日常探索。\u003ca href=\"#s101\"\u003eS101\u003c/a\u003e\u003ca href=\"#s32\"\u003eS32\u003c/a\u003e\u003ca href=\"#s62\"\u003eS62\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这些总量不意味着必须一次连续完成，也不意味着所有活动必须在健身房。通勤、家务、娱乐和适配运动都可能贡献，但要看实际强度和持续方式。无法达到完整参考时，从能够安全执行的部分开始；特殊疾病的例外见本卷后部。\u003c/p\u003e\n\u003ch3 id=\"c18-s003\"\u003e18.3　判断强度：身体反应优先于同一速度\u003c/h3\u003e\n\u003cp\u003e同样的步速、坡度和重量，对不同人可能代表完全不同的负荷。CDC提供的谈话测试可作粗略参考：中等强度通常仍可说话但难以唱歌，高强度时往往只能说几个词就需换气。零至十分的主观用力感中，中等强度常约五至六分，高强度约七至八分。\u003ca href=\"#s98\"\u003eS98\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这不是急症排除工具。胸痛、异常气短、晕厥感、突然无力或明显不适时，不能因为心率仍在某个区间就继续。药物、心律问题、天气与设备误差也可能影响读数；不要把简单年龄公式或手表颜色当成个人医学处方。\u003c/p\u003e\n\u003cp\u003e记录强度时可用一句话：“能正常交谈，结束后仍能完成日常事务。”对于语言、呼吸或感觉表达不同的人，使用适合的专业评估方式，不强迫所有人用同一种量表。\u003c/p\u003e\n\u003ch3 id=\"c18-s004\"\u003e18.4　起步协议：先形成可重复的一次\u003c/h3\u003e\n\u003cp\u003e下面是一般低风险成人的编排示例，不是疾病康复处方。先选择一种熟悉且低门槛的活动，时间短到不必大幅改变生活；结束时仍保留余力，并观察之后和次日的反应。连续几次能够舒服完成，再决定增加时长、频率或难度中的一项。\u003c/p\u003e\n\u003cp\u003e如果连最小版本都做不到，先查入口：场地太远、鞋不合适、担心被评价、工作结束太晚，还是活动本身不喜欢。换一种形式可以比增强纪律更有效。身体有明确限制时寻找适配，不把“无法走路”等同于“没有任何运动选择”。\u003c/p\u003e\n\u003cp\u003e不要设一个必须每周上涨的百分比。增加应由执行质量、恢复和生活能力决定；有时维持数周就是合适选择。旅行、疾病或照护压力增加时，减量不是失败，而是整个身体负荷发生了变化。\u003c/p\u003e\n\u003ch3 id=\"c18-s005\"\u003e18.5　力量动作的选择逻辑\u003c/h3\u003e\n\u003cp\u003e普通力量计划可以考虑下肢起立与蹲类、髋部伸展、推、拉、携物及躯干稳定等不同任务，但不要求每个人完成同一个动作。动作只是工具，目标是适合身体与生活。深蹲不适合时可以调整范围或选择其他方式，不能把某一种姿势当作合格人体的考试。\u003c/p\u003e\n\u003cp\u003e器具先检查稳定、承重和抓握。椅子不能带轮或在地面滑动，弹力带固定点应可靠，地面没有绊倒物。重量轻也不意味着无风险，尤其在高处举物、平衡困难或疲劳时。需要教练或康复指导时，优先看资质、是否询问病史、是否解释替代动作与停止条件。\u003c/p\u003e\n\u003cp\u003e一个动作学会之后再增加复杂度。不要同时更换器具、速度、负重与不稳定表面，否则很难知道身体在适应什么。训练不是展示动作花样，能稳定重复并用于生活，比视频看起来更高级重要。\u003c/p\u003e\n\u003ch3 id=\"c18-s006\"\u003e18.6　低门槛动作示例与边界\u003c/h3\u003e\n\u003cp\u003e椅子起立可以从合适高度的稳定座椅开始，脚得到支撑，向前调整重心后起身，再有控制地坐下。需要扶手或协助的人不应为了达到“不能用手”的挑战而冒险。墙壁推撑可通过离墙距离调整难度，提踵可扶稳固定支持物。NHS提供了这些低门槛动作的公开示范。\u003ca href=\"#s99\"\u003eS99\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e上述只是动作入口，不构成人人适用的组数和负重。初学者可以先少量尝试，确认没有异常并能保持控制；有骨折、术后限制、严重平衡问题、胸痛或其他病情时先使用个人方案。呼吸自然，不通过长时间憋气或全身僵硬证明用力。\u003c/p\u003e\n\u003cp\u003e若动作令人疼痛，不需要硬撑到预定次数。记录疼痛部位、何时出现、是否持续和对生活的影响，必要时评估。替代动作也应解决同一目标，而不是仅仅换一个同样令人不适的姿势。\u003c/p\u003e\n\u003ch3 id=\"c18-s007\"\u003e18.7　力量练习如何记录进展\u003c/h3\u003e\n\u003cp\u003e每次记录动作名称、采用的版本、实际完成量和明显反应即可。随着熟练，可以增加可控次数、合适阻力或动作范围，但一次优先改变一项。没有必要每周测试最大重量，更不靠他人协助勉强完成最后一次来证明有效。\u003c/p\u003e\n\u003cp\u003e进展也可以表现为同样购物更轻松、上楼更稳定、起身不再需要额外帮助。体形和体重并非力量变化的唯一窗口。使用辅助设备的人可以记录转移更安全、推动更舒适或需要休息减少，而非套用健全人群的动作排行榜。\u003c/p\u003e\n\u003cp\u003e连续下降时先看睡眠、饮食、疾病、压力和训练安排。不是所有停滞都需要再加一组，也不是每次状态差都意味着计划失效。观察足够的普通训练，再作调整，避免被单日情绪驱动。\u003c/p\u003e\n\u003ch3 id=\"c18-s008\"\u003e18.8　耐力：选择能持续的运动形式\u003c/h3\u003e\n\u003cp\u003e步行、骑行、游泳、舞蹈、划船、轮椅活动或其他适配形式，都可以根据目标与条件考虑。选择时除了强度，还要算交通、器材、天气、学习与安全成本。最有效率的项目不一定最适合你的生活，愿意长期参与的方式更值得优先试验。\u003c/p\u003e\n\u003cp\u003e路线需要有退出和返回能力。初次外出不把全程体力用在去程；炎热、偏远或陌生路线尤其需要预留。携带必要联系工具和个人救急用品，具体依据自身疾病行动计划。独自活动时让合适的人知道安排，不把公开实时定位当成唯一安全方式。\u003c/p\u003e\n\u003cp\u003e进入更高强度前，先确认基础活动已稳定、身体适合且理解专项风险。高强度间歇不是人人必需的“效率升级”，更不能在严重缺觉、发热、急性症状或明显恢复不足时强行完成。\u003c/p\u003e\n\u003ch3 id=\"c18-s009\"\u003e18.9　平衡、活动范围与动作技巧\u003c/h3\u003e\n\u003cp\u003e平衡练习应靠近可靠支撑，并根据能力决定是否需要旁人保护。不要闭眼站在高处、用摇晃家具作支撑，或拿跌倒风险换挑战感。已经跌倒、反复头晕或步态变化的人，先进入相应评估，而不是单靠练习解决。\u003c/p\u003e\n\u003cp\u003e活动范围以舒适、可控制和任务需要为目标。拉伸不是疼得越深越好，也不要求所有关节达到同一角度。对于关节过度活动、术后和神经系统问题，需要个体指导。疼痛、麻木或明显不稳不应被解释成“筋打开了”。\u003c/p\u003e\n\u003cp\u003e技巧学习把整体动作拆小：先稳定环境，再练一个要点，再放回完整动作。例如球类先练接触与方向，游泳先在正规教学中掌握安全与基本动作。掌握技巧可能降低任务难度，但不意味着可以忽略体力和环境风险。\u003c/p\u003e\n\u003ch3 id=\"c18-s010\"\u003e18.10　久坐工作的变化策略\u003c/h3\u003e\n\u003cp\u003e目标不是找到一个可以保持八小时不变的完美姿势，而是让工作允许变化。把常用工具放在舒适范围，减少持续伸手和耸肩；根据任务轮换坐、站、走和短暂休息。升降桌只是工具，站着不动一整天也不是唯一答案。\u003c/p\u003e\n\u003cp\u003e提醒频率可以按工作流程编排，例如完成一段任务后离开座位、通话时在安全处移动、取水时顺便休息。不存在本书能够证明对所有人最优的统一二十五分钟或三十分钟间隔。若症状与工作明显相关，记录具体姿势、持续时间和任务，寻求合适的职业健康或医疗建议。\u003c/p\u003e\n\u003cp\u003e休息时不要同时把另一个屏幕塞进手中，完全保留相同眼部与手部负荷。可以望向远处、改变姿势、活动一下或做非屏幕任务；不必把每次休息都升级成训练课。\u003c/p\u003e\n\u003ch3 id=\"c18-s011\"\u003e18.11　儿童运动：机会与保护同时存在\u003c/h3\u003e\n\u003cp\u003e儿童需要能够参与的活动空间，而不只是被成人观察的训练成绩。把跑、跳、投、接、攀、平衡和节奏等体验放进适龄游戏，不必过早只剩一个专项。已有竞技训练时，也要考虑学校、成长、睡眠与兴趣的总负担。\u003c/p\u003e\n\u003cp\u003e教练的权威不能覆盖儿童的疼痛报告和身体边界。不能因比赛而强迫带伤上场，也不能用羞辱、体罚或限制饮水作为纪律。选择项目时了解保护规则、急救能力、人员资质和家长投诉渠道，避免只看获奖数量。\u003c/p\u003e\n\u003cp\u003e成年人提出的外貌目标不应成为儿童训练主轴。减重、体重级别和高负荷训练涉及发育与健康时，应由适当专业团队参与，而不是根据同队孩子的方案复制。\u003c/p\u003e\n\u003ch3 id=\"c18-s012\"\u003e18.12　孕产期与高龄的接口\u003c/h3\u003e\n\u003cp\u003e孕期运动使用产科确认的范围，避免将普通成人计划直接加在妊娠负荷之上。产后恢复还要考虑伤口、盆底症状、睡眠和喂养负担，不由一个固定天数自动解锁跑跳。具体分流已在卷二、卷三展开。\u003c/p\u003e\n\u003cp\u003e高龄者的练习可以围绕穿衣、起身、携物、行走、上下交通工具等真实目标。使用扶手、助行器或椅子不降低训练价值。若今天只能完成一段安全活动，也可以保留参与，不因没有达到整套标准而取消。\u003c/p\u003e\n\u003cp\u003e照护者不能把训练变成证明服务质量的强迫任务。先说明目的、获得配合、观察疲劳，并保留停止权。活动结束后仍需要有余力吃饭、洗漱和做本人选择的事，不能把全天能力耗在护理记录上。\u003c/p\u003e\n\u003ch3 id=\"c18-s013\"\u003e18.13　恢复：总负荷不只来自运动\u003c/h3\u003e\n\u003cp\u003e出差、长时间站立、搬家、睡眠中断、情绪危机和照护都可能增加负担。训练计划应随总负荷调整，而不是只看上一次健身日期。恢复不足时可以减少量、降低强度、换形式或休息，具体取决于状态与病情。\u003c/p\u003e\n\u003cp\u003e普通训练后的感觉不应被强行解释成越疼越有效。疼痛持续、加重、局部明显肿胀、功能受限或有其他异常时，应评估。按摩、冷热和设备可以是个人偏好或治疗辅助手段，但不能掩盖需要处理的损伤，也不能代替基本休息与供给。\u003c/p\u003e\n\u003cp\u003e没有一个产品能让人在所有条件下无限增加负荷。购买恢复工具前，先明确希望改善哪项结果、怎样判断、会不会因此继续透支。用昂贵恢复项目支持不可持续训练，不是系统优化。\u003c/p\u003e\n\u003ch3 id=\"c18-s014\"\u003e18.14　活动后延迟恶化：必须退出普通递增计划\u003c/h3\u003e\n\u003cp\u003e有些疾病中，轻微体力或认知活动之后也可能出现延迟的明显症状恶化。ME/CFS中的活动后不适可在活动后若干小时至一两天显现，并持续更久；通用健康人群的运动方案可能造成伤害。\u003ca href=\"#s102\"\u003eS102\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这种情况下，不应把“今天撑过去，明天就会适应”作为原则，也不能采用不顾症状固定加量的分级运动方案。应与了解相关疾病的专业人员合作，识别个人限制、安排活动与休息，并以避免恶化为边界。\u003ca href=\"#s103\"\u003eS103\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e本书其他章节中“逐步增加”的建议，都不覆盖这一例外。记录活动影响要包括之后的反应，而非只看当时能否完成。疲劳不是懒惰，家务、社交和脑力任务也需要计入个人负荷。\u003c/p\u003e\n\u003ch3 id=\"c18-s015\"\u003e18.15　脑震荡和损伤后的回归\u003c/h3\u003e\n\u003cp\u003e疑似脑震荡时先停止相关运动并评估，危险信号见卷八。回归不能只凭本人感觉想上场；CDC建议在医疗人员批准和监督下分阶段进行，出现新症状或原症状返回时停止并联系团队。\u003ca href=\"#s100\"\u003eS100\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e其他损伤、手术和疾病恢复也有自己的限制。把出院或康复要求写清楚：能做什么、暂不做什么、可以怎样替代、何时复查。不能因为疼痛减少就自行认定组织已恢复到全部负荷，也不能因为担心而无限期不动。\u003c/p\u003e\n\u003cp\u003e回归时的目标先是安全重新参与，再考虑以前的成绩。比较对象应是当前可承受的起点，而不是受伤前最好的那一天。\u003c/p\u003e\n\u003ch3 id=\"c18-s016\"\u003e18.16　一周示例：不是统一处方\u003c/h3\u003e\n\u003cp\u003e假设一位一般健康、已有基础活动且无相关禁忌的成人，希望维持日常功能。本书可选编排为：两天分别安排全身力量练习，其间留出恢复；数天安排喜欢的有氧活动；普通日穿插适合的活动范围与平衡；至少保留能够灵活调整的空间。具体分钟、组数和负重按实际能力与需要选择。\u003c/p\u003e\n\u003cp\u003e新手可以把示例缩小，不需要第一周就完成全部参考总量。熟练者可以根据目标更专门化，但仍保留安全与恢复。轮班、照护和疾病会改变顺序，“周一”并非身体必须接收某种刺激的日子。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开：X 每次运动的短检查\u003c/summary\u003e\n\u003cp\u003e开始前确认身体状态、环境、器具、计划和退出方式。先以较容易的方式进入活动，不直接冲向当天最高负荷。进行中观察动作控制与异常，不拿手表数据压过症状。\u003c/p\u003e\n\u003cp\u003e结束时确认能够安全返回和完成基本生活，记录实际做了什么及需要注意的反应。后续恢复良好再决定是否进阶；出现持续或延迟恶化则回到评估与个体方案。\u003c/p\u003e\n\u003cp\u003e错过一节不在次日翻倍补偿。运动的收益来自可持续参与与合适负荷，不来自从未断过的打卡记录。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c18-s017\"\u003e18.17　运动的最终验收\u003c/h3\u003e\n\u003cp\u003e计划至少应回答：你更能做哪些事，是否喜欢其中一部分，是否能够在普通周执行，有没有持续伤害或生活代价，遇到变化是否知道怎样调整。若只有数字增长，实际生活却越来越疲惫、疼痛或狭窄，就应重新检查目标。\u003c/p\u003e\n\u003cp\u003e最优使用人体不是把身体推到每一天的极限，而是让它在需要时有能力，在不需要时能恢复，并且仍愿意与你一起生活。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c18-s000","title":"18.0　婴幼儿与五岁以上儿童：先分清总活动和训练"},{"id":"c18-s001","title":"18.1　先定义你想保有哪一种行动"},{"id":"c18-s002","title":"18.2　分龄活动参考集中放在这里"},{"id":"c18-s003","title":"18.3　判断强度：身体反应优先于同一速度"},{"id":"c18-s004","title":"18.4　起步协议：先形成可重复的一次"},{"id":"c18-s005","title":"18.5　力量动作的选择逻辑"},{"id":"c18-s006","title":"18.6　低门槛动作示例与边界"},{"id":"c18-s007","title":"18.7　力量练习如何记录进展"},{"id":"c18-s008","title":"18.8　耐力：选择能持续的运动形式"},{"id":"c18-s009","title":"18.9　平衡、活动范围与动作技巧"},{"id":"c18-s010","title":"18.10　久坐工作的变化策略"},{"id":"c18-s011","title":"18.11　儿童运动：机会与保护同时存在"},{"id":"c18-s012","title":"18.12　孕产期与高龄的接口"},{"id":"c18-s013","title":"18.13　恢复：总负荷不只来自运动"},{"id":"c18-s014","title":"18.14　活动后延迟恶化：必须退出普通递增计划"},{"id":"c18-s015","title":"18.15　脑震荡和损伤后的回归"},{"id":"c18-s016","title":"18.16　一周示例：不是统一处方"},{"id":"c18-s017","title":"18.17　运动的最终验收"}]},{"id":19,"title":"卷十九　器官维护与感官：把小问题留在可以处理的时候","html":"\u003ch2\u003e卷十九　器官维护与感官：把小问题留在可以处理的时候\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c19\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c19-s000\"\u003e19.1　维护的三个层级\u003c/h3\u003e\n\u003cp\u003e第一层是日常保护：清洁、合适环境、减少明确伤害和正确使用工具。第二层是功能变化：看不清、听不清、咀嚼困难、疼痛、排泄变化等，需要记录并按情况评估。第三层是急迫信号：突然、明显或伴严重全身症状的变化，直接进入医疗分流。\u003c/p\u003e\n\u003cp\u003e器官不能按汽车零件理解成每天都需要单独刺激。心、肺、肝、肾并不要求各服一瓶保养品。睡眠、饮食、活动、减少暴露和适当医疗是共享底座；本卷只展开各个接口特有的操作与警戒，不再复制整套基础建议。\u003c/p\u003e\n\u003ch3 id=\"c19-s001\"\u003e19.2　牙齿：固定顺序，避免漏面\u003c/h3\u003e\n\u003cp\u003e一般日常口腔基础是每天两次使用含氟牙膏刷牙，每次约两分钟，并清洁牙齿之间的部位；牙刷大小与软硬应适合个人，不能用很大力度代替清洁效果。\u003ca href=\"#s18\"\u003eS18\u003c/a\u003e 顺序可以自己固定，例如从一侧外面开始，依次内面、咬合面，再到另一侧，目的是避免只刷最容易接触的位置。\u003c/p\u003e\n\u003cp\u003e牙缝工具按牙缝大小、牙龈和牙科建议选择。牙线、牙间刷等并非越粗越好，不应硬塞或反复切割牙龈。第一次使用有困难，可以请牙科人员当面示范并让自己回演；比购买更多工具更有价值。\u003c/p\u003e\n\u003cp\u003e刷牙时留意持续出血、疼痛、松动、食物嵌塞和咬合变化，预约牙科评估。止痛和暂时不出血不代表原因已解决。不要因为清洁会出血就永久停止相应区域，也不要用强力刷洗惩罚牙龈。\u003c/p\u003e\n\u003ch3 id=\"c19-s002\"\u003e19.3　儿童口腔：能力成熟以前成人仍负责结果\u003c/h3\u003e\n\u003cp\u003e第一颗牙出现后开始适合的刷牙护理。三岁以下通常使用薄薄一抹、类似米粒大小的含氟牙膏，三至六岁使用豌豆大小；浓度、额外氟化物和高龋风险方案按当地牙科建议。成人应持续监督并在必要时帮助，而不是孩子会握牙刷就退出。\u003ca href=\"#s61\"\u003eS61\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e儿童牙科接触不等牙痛。AAPD建议第一颗牙出现时安排首次牙科检查，最迟不晚于第一周岁；当地服务路径和后续频率由实际风险决定。\u003ca href=\"#s160\"\u003eS160\u003c/a\u003e 预约时带饮食、清洁方式及已知不适，离开时确认下一次随访和家长是否会实际操作。乳牙也需要保护，不能以“反正会换”忽视疼痛与进食影响。\u003c/p\u003e\n\u003cp\u003e把刷牙变成可预测的小过程，允许选择牙刷颜色或顺序，但安全护理不由是否愿意表演决定。出现感觉敏感、疼痛或持续强烈抗拒时，先查原因并寻找适配，不用压制和羞辱作为唯一方法。\u003c/p\u003e\n\u003ch3 id=\"c19-s003\"\u003e19.4　口干、假牙与口腔异味\u003c/h3\u003e\n\u003cp\u003e持续口干可以影响说话、咀嚼和吞咽，也可能与药物或疾病有关，不是年龄增加后必须接受的状态。向牙科或医生说明症状和全部用药，再讨论适合的处理；不能只靠不断含糖或大量饮水覆盖原因。\u003ca href=\"#s115\"\u003eS115\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e假牙、保持器与其他口腔器具按专业指导清洁、保存和复查。松动、磨破或疼痛时，不自行打磨到勉强能戴；也不要用家用胶水修补入口器具。吞咽困难或需要照护的人使用器具时，照护者要知道何时取下、如何标识与保管。\u003c/p\u003e\n\u003cp\u003e口气问题先检查清洁、牙龈、口干和相关症状，不默认胃有问题，更不只用强烈香味遮盖。口腔中持续不愈的破损、肿块或异常，应获得专业检查，而不是长期自行涂刺激性偏方。\u003c/p\u003e\n\u003ch3 id=\"c19-s004\"\u003e19.5　眼睛：让任务与视觉条件匹配\u003c/h3\u003e\n\u003cp\u003e阅读和工作时，先调整字体、照明、反光和观看距离，让内容能够轻松辨认。需要凑近或眯眼才能完成时，应考虑视力与眼部评估，而不是把坚持看清当成训练。儿童坐到前排只能暂时帮助看见，不能替代适当检查。\u003c/p\u003e\n\u003cp\u003e长时间近距离任务之间可以安排看向较远处、自然眨眼和更换活动。具体间隔可按任务编排，不把某个秒数当作已证实治疗近视的处方。护眼模式、滤镜和营养品也不能自动替代合适的矫正、检查与环境调整。\u003ca href=\"#s19\"\u003eS19\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e工作或运动存在飞溅、碎屑、化学品等风险时，使用针对风险的眼部防护，不以普通眼镜一概代替。儿童游戏材料和成人工具都要考虑眼部风险，不能等一次伤害之后才想到防护。\u003c/p\u003e\n\u003ch3 id=\"c19-s005\"\u003e19.6　眼部变化的紧急入口\u003c/h3\u003e\n\u003cp\u003e突然出现或明显增加的闪光、飞蚊，视野像被幕帘或阴影遮挡，尤其伴视力模糊、眼痛或外伤，应紧急获得眼部评估。长期稳定的飞蚊与新变化不是同一情境，不能凭以前检查正常就忽略今天的改变。\u003ca href=\"#s105\"\u003eS105\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e突然明显视力下降或严重眼痛，不应等待下次常规验光，应立即联系急救或眼科。强刺激化学品进入眼内时，在安全前提下立即用大量洁净、非热的缓流水冲洗，轻轻保持眼睑打开，至少二十分钟；同时让旁人联系急救，等待帮助期间持续冲洗，不为先找专用洗眼液或拍照而延误。保留容器信息供医护判断，不揉眼。\u003ca href=\"#s154\"\u003eS154\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e尖锐物刺入眼内属于另一分支：不要自行拔出或按压，也不要直接套用普通异物冲洗流程，应立即急救评估。\u003ca href=\"#s154\"\u003eS154\u003c/a\u003e 不把眼睛发红一律当疲劳，不使用他人的处方滴眼液试验。\u003c/p\u003e\n\u003cp\u003e就诊时说明变化发生时间、单眼或双眼、是否有外伤、隐形眼镜和既往手术。保留必要信息即可，不为拍摄清晰照片反复强光照射或延误就医。\u003c/p\u003e\n\u003ch3 id=\"c19-s006\"\u003e19.7　隐形眼镜的独立操作链\u003c/h3\u003e\n\u003cp\u003e接触镜片前洗净并擦干双手，按指定护理液和更换周期操作，不用水替代护理液，不将新旧护理液混合。洗澡、游泳前取下，除非眼科明确指导，不戴着入睡；镜片不适时取下并联系专业人员。\u003ca href=\"#s109\"\u003eS109\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e准备一副度数合适的备用框架眼镜，让取下镜片有现实可行性。旅行、夜班和临时过夜时，备用用品与干净容器应能找到，不为省事继续超时佩戴。美瞳同样涉及医疗器械和感染风险，不因只为外观使用就降低要求。\u003c/p\u003e\n\u003cp\u003e儿童或青少年使用时，看其是否能够完成清洁、保存、异常报告与随访，而不是只看年龄。需要成人监督的部分应明确，不能一旦购买就把全部责任交给孩子。\u003c/p\u003e\n\u003ch3 id=\"c19-s007\"\u003e19.8　听力：降低暴露，而不是等待损伤证明存在\u003c/h3\u003e\n\u003cp\u003e噪声风险与音量和持续时间有关。保护可以通过降低声源、增加距离、减少暴露时间，以及在合适场景使用正确的听力防护来实现。耳机最大音量的百分比不是跨设备统一安全线；听完持续耳鸣或发闷，也不应当作正常娱乐代价。\u003ca href=\"#s20\"\u003eS20\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e在工地、演出、器械或其他高噪环境中，先了解实际风险与防护要求。防护用品需要适配和正确佩戴，普通降噪耳机不自动等于符合职业防护要求的耳塞或耳罩。听音乐时不靠不断调高音量压过环境噪声。\u003c/p\u003e\n\u003cp\u003e家庭交流先降低背景声音、面向对方，再调整说话方式。听不清不是不认真，听力辅助也不是失败标志。适合的评估与支持，是让人继续参与关系，而不只是让测听图表变化。\u003c/p\u003e\n\u003ch3 id=\"c19-s008\"\u003e19.9　突发听力下降与日常清洁\u003c/h3\u003e\n\u003cp\u003e单耳或双耳突然明显听力下降，即使感觉像耳堵、伴耳鸣或眩晕，也应立即就医评估。不要自行认定只是耳屎、过敏或感冒而等待数天；突发感音神经性听力下降属于时间敏感的医疗问题。\u003ca href=\"#s106\"\u003eS106\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e日常清洁重点在外部可见区域，不把尖锐物、棉签深插耳道当作保养。持续疼痛、流液、异味、听力改变或反复堵塞，应由专业人员判断。耳烛和来路不明的“深度清洁”不能作为常规维护。\u003c/p\u003e\n\u003cp\u003e佩戴助听设备的人，按说明清洁与防潮、检查电量和耳塞配合。声音异常时先查设备与耳部状态，不直接推断认知或理解下降。照护者可以协助，但需询问本人实际听感。\u003c/p\u003e\n\u003ch3 id=\"c19-s009\"\u003e19.10　鼻腔、呼吸与声音\u003c/h3\u003e\n\u003cp\u003e鼻塞或鼻炎影响睡眠、活动和工作时，记录诱发环境、持续情况及已用药物，获得适当评估。长期反复用同一种产品却不清楚成分与适用时间，不是稳定治疗。需要鼻腔冲洗时，采用合适器具与指导。\u003c/p\u003e\n\u003cp\u003e冲洗水应使用标示为蒸馏或无菌的水，或煮沸后冷却的安全水；不能把可以饮用的自来水直接视为适合鼻腔冲洗。器具按说明清洁干燥，不共享。\u003ca href=\"#s111\"\u003eS111\u003c/a\u003e 本书不提供自行配置漂白液等替代做法。\u003c/p\u003e\n\u003cp\u003e用声多的人可以安排短暂声带休息、借助扩音、减少在噪声中喊话。声音嘶哑、说话费力或持续改变时，应评估，而非靠含片和继续硬喊维持。过度耳语也不是万能的嗓音休息方式。\u003ca href=\"#s112\"\u003eS112\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c19-s010\"\u003e19.11　皮肤清洁：先减少刺激，再增加成分\u003c/h3\u003e\n\u003cp\u003e清洁围绕汗液、污物、防晒和彩妆等实际需要，不追求洗后紧绷或彻底脱脂。选择温和且自己能够耐受的方式，避免同一次叠加磨砂、强清洁和多种活性成分。皮肤出现灼痛、明显脱皮或持续红痒时，先减少新增刺激并寻求适当帮助。\u003c/p\u003e\n\u003cp\u003e痤疮护理尤其不宜频繁换方案或挤压。AAD建议温和清洁、避免刺激和反复挤痘，并给合适治疗足够观察时间；严重、留疤或持续困扰时找皮肤科，而不是无限叠加产品。\u003ca href=\"#s104\"\u003eS104\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e护肤记录可以写产品、开始时间、实际频率和反应，不需要每天在不同光线下放大寻找缺陷。治疗用药与普通化妆品分开，孕哺期、儿童及有皮肤病者用药前确认适用性。\u003c/p\u003e\n\u003ch3 id=\"c19-s011\"\u003e19.12　防晒与外观选择\u003c/h3\u003e\n\u003cp\u003e户外可综合使用遮阴、衣帽与适合的防晒产品。AAD建议对未被衣物覆盖的皮肤使用广谱、耐水且SPF三十或以上的产品；这不是让人可以无限延长强烈日晒。\u003ca href=\"#s104\"\u003eS104\u003c/a\u003e 用量、补涂、涉水和擦拭后的处理按产品与专业指导。\u003c/p\u003e\n\u003cp\u003e防晒要覆盖实际暴露位置，例如耳部、颈部、手背和分缝，而不只涂面中部。儿童、皮肤敏感或特殊疾病者采用适合方案，婴儿优先遮阴与衣物等保护并询问专业建议。不要为“补维生素D”故意晒伤。\u003c/p\u003e\n\u003cp\u003e外观调整可以是本人真实愿望，但不应以贬低现有面貌为前提。选择医美或侵入性操作前，另用卷三十的证据与风险审查，不把“看起来年轻”直接等同身体健康。\u003c/p\u003e\n\u003ch3 id=\"c19-s012\"\u003e19.13　头发、头皮与指甲\u003c/h3\u003e\n\u003cp\u003e掉发可能有不同原因，先了解发生时间、分布、近期疾病、饮食、压力与用药，再决定是否需要评估。NHS建议在进入商业脱发治疗前先辨认原因，没有一种治疗对所有人完全有效。\u003ca href=\"#s110\"\u003eS110\u003c/a\u003e 不用每天数地漏里的头发来独立诊断。\u003c/p\u003e\n\u003cp\u003e洗发频率根据头皮和生活需要选择，轻柔处理打结，减少持续牵拉与不舒服的发型。明显头皮疼痛、破损、脓疱或快速变化，应寻求帮助，不用强刺激生姜、精油或高温仪器反复试验。\u003c/p\u003e\n\u003cp\u003e指甲剪到舒适且不伤皮肤的长度，工具清洁并避免共用可能造成破皮的器具。持续变色、增厚、疼痛或甲周炎症需要判断原因，不把所有变化都归为缺某种维生素。糖尿病、循环或感觉异常者的足部处理更加谨慎。\u003c/p\u003e\n\u003ch3 id=\"c19-s013\"\u003e19.14　手部与足部：高频工具需要合适接口\u003c/h3\u003e\n\u003cp\u003e手部反复接触水、清洁剂或摩擦时，检查工作流程是否可以减少直接暴露，采用适合任务的防护与清洁。护手产品不能抵消不合适化学接触，手套也需要正确材质与更换。持续裂口、疼痛或感染迹象应评估。\u003c/p\u003e\n\u003cp\u003e鞋袜检查舒适、摩擦、潮湿和空间，不因为鞋昂贵就坚持穿到破皮。走远路或换新鞋时，提前试穿并留意热点。脚底看不到的人可借助镜子或可信照护者；感觉异常时不能只凭痛不痛判断安全。\u003c/p\u003e\n\u003cp\u003e足部修剪、厚茧和小伤口在不同疾病下处理要求不同。已有糖尿病足风险、血流问题或感觉下降者，使用医疗团队的计划，不自行削切、烫泡或使用强腐蚀鸡眼产品。对应慢病分支见卷二十一。\u003c/p\u003e\n\u003ch3 id=\"c19-s014\"\u003e19.15　排尿：功能问题值得谈，不必等到失控\u003c/h3\u003e\n\u003cp\u003e尿频、尿急、漏尿、排尿困难和夜间反复起床，会影响睡眠与出行。记录发生时机、实际饮水、药物和其他症状，向医疗人员说明，不把所有问题都归为年龄或生育后的必然结果。尿失禁有不同类型，处理不能统一成少喝水或练盆底。\u003ca href=\"#s83\"\u003eS83\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e看见或怀疑血尿，即使量少、只一次或没有疼痛，也应及时就医检查。\u003ca href=\"#s113\"\u003eS113\u003c/a\u003e 出现严重疼痛、发热伴明显不适、无法排尿或其他急迫症状时，按紧急程度处理，不等自行消失。\u003c/p\u003e\n\u003cp\u003e如厕环境也属于治疗接口：能否及时到达，衣物是否方便，夜间照明是否安全，公共场所是否可及。不能因环境不便而长期牺牲正常饮水与外出机会。\u003c/p\u003e\n\u003ch3 id=\"c19-s015\"\u003e19.16　排便：看变化、质地和困难，不要求每天同一时刻\u003c/h3\u003e\n\u003cp\u003e排便维护先提供不被催促的时间与可获得厕所，不长期忽略便意。便秘可能与饮食、液体、活动、药物或疾病有关；持续问题、便血、无意体重下降或新出现的排便习惯改变，应评估，而不是一律加纤维。\u003ca href=\"#s108\"\u003eS108\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e在适合的身体条件下，调整坐姿和脚部支撑可能使排便更舒适，但设备应稳定，不能增加跌倒风险。不要长期屏气用力、边刷手机边无限延长厕所时间，或自行反复灌肠作为所谓排毒。\u003c/p\u003e\n\u003cp\u003e已有痔疮也不能解释每一次出血。症状变化要重新判断，出现大量出血、黑便伴不适、明显腹痛或全身状态异常时应及时医疗处理。成人方案不能直接用于婴幼儿，儿童排便问题使用儿科路径。\u003c/p\u003e\n\u003ch3 id=\"c19-s016\"\u003e19.17　生殖与私密部位：清洁不等于消毒\u003c/h3\u003e\n\u003cp\u003e正常阴道分泌物会随情况变化，不需要清洗阴道内部，也不应使用香味喷雾或反复消毒来追求完全无味。出现异味、颜色或质地改变、瘙痒、疼痛、异常出血等，应评估，不靠外观自行确定感染种类。\u003ca href=\"#s114\"\u003eS114\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e其他外生殖部位同样采用温和外部清洁，疼痛、包块、溃疡、分泌物或持续不适需要适当医疗。儿童包皮与私密护理不进行强行牵拉或不必要操作，具体问题由儿科说明。所有照护和检查均应解释并保护隐私。\u003c/p\u003e\n\u003cp\u003e突然剧烈睾丸疼痛，尤其伴恶心、呕吐或腹痛，应立即就医，不能先按摩、热敷或等待运动后自行恢复；睾丸扭转等问题需要及时处理。\u003ca href=\"#s107\"\u003eS107\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c19-s017\"\u003e19.18　盆底与性功能：先辨认问题，不统一“收紧”\u003c/h3\u003e\n\u003cp\u003e漏尿、盆腔疼痛、坠胀、排空困难或性接触疼痛，可能需要不同评估和康复。不要把每一种症状都归为松弛，更不把大量重复收缩当成唯一解决方式。合适的盆底训练需要正确识别动作与适应情况，必要时由专业人员指导。\u003c/p\u003e\n\u003cp\u003e性功能变化应同时考虑身体、药物、情绪、关系和本人意愿。就诊时可以说明最困扰的具体情况，而不是只追求某个次数或时长。关系中不舒适或没有意愿时，有权暂停，不需要通过药物维持他人的期待。\u003c/p\u003e\n\u003cp\u003e市场上承诺增大、紧致、永久增强或恢复年轻的产品，应使用高风险决策审查。尤其是激素、注射、手术和不明成分药物，不能按网络体验自行试用。\u003c/p\u003e\n\u003ch3 id=\"c19-s018\"\u003e19.19　心、肺、肝、肾：共享维护，不做每日刺激\u003c/h3\u003e\n\u003cp\u003e这些器官的日常支持主要来自基础生活、降低明确暴露、管理既有风险及遵循治疗。不能因没有感觉就排除问题，也不能因网络提到某种“压力”就每天增加器官检查。筛查与监测需根据病史和风险，而不是给所有器官安排年度影像全套餐。\u003c/p\u003e\n\u003cp\u003e持续咳嗽、异常气短、胸部不适、水肿、黄疸、尿量改变或其他持续变化，应按症状获得评估；严重或突然变化进入安全卷。不要用排毒茶、护肝片、吸氧或抗氧化产品覆盖需要解释的症状。\u003c/p\u003e\n\u003cp\u003e已确诊疾病的人，需要一份个人行动计划说明平稳日怎么做、哪些变化需要联系、急症怎么处理。具体指标和药物调整不由本书统一设定，详见卷二十与卷二十一。\u003c/p\u003e\n\u003ch3 id=\"c19-s019\"\u003e19.20　感官与身体维护的实际排程\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开：V 日常身体接口检查\u003c/summary\u003e\n\u003cp\u003e晨晚清洁时顺便观察牙齿、皮肤与足部是否有明显新变化，不另开一场全身搜查。工作前调整眼、耳、手和姿势的任务环境，外出前根据阳光、噪声、活动与天气准备防护。\u003c/p\u003e\n\u003cp\u003e器具使用后按各自说明清洁、保存和补充，尤其隐形眼镜、口腔器具、助听设备与医疗用品。发现持续功能变化时记录并安排评估；危险信号立即覆盖日程。\u003c/p\u003e\n\u003cp\u003e每次只解决一个高频摩擦：眼镜总找不到、牙缝工具不会用、鞋磨脚、洗手后裂口、厕所难到达。让正确行动更容易发生，比给身体增加更多评价更有用。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c19-s020\"\u003e19.21　维护不应吞掉感受生活的能力\u003c/h3\u003e\n\u003cp\u003e眼睛不只是视力数值，还用于看风景和人的表情；耳朵不只是听力阈值，还用于音乐与交谈；手不只是握力，还用于触摸、制作和照护；皮肤不只是无瑕，还承担感觉和边界。维护的目的，是保留这些参与，而不是让每次体验都变成检测。\u003c/p\u003e\n\u003cp\u003e当日常观察让你越来越害怕身体、反复检查或不断寻找缺陷时，应减少无效监测并考虑适当支持。一本人体指南最不应该造成的结果，是让人从此不敢正常使用自己的身体。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c19-s000","title":"19.1　维护的三个层级"},{"id":"c19-s001","title":"19.2　牙齿：固定顺序，避免漏面"},{"id":"c19-s002","title":"19.3　儿童口腔：能力成熟以前成人仍负责结果"},{"id":"c19-s003","title":"19.4　口干、假牙与口腔异味"},{"id":"c19-s004","title":"19.5　眼睛：让任务与视觉条件匹配"},{"id":"c19-s005","title":"19.6　眼部变化的紧急入口"},{"id":"c19-s006","title":"19.7　隐形眼镜的独立操作链"},{"id":"c19-s007","title":"19.8　听力：降低暴露，而不是等待损伤证明存在"},{"id":"c19-s008","title":"19.9　突发听力下降与日常清洁"},{"id":"c19-s009","title":"19.10　鼻腔、呼吸与声音"},{"id":"c19-s010","title":"19.11　皮肤清洁：先减少刺激，再增加成分"},{"id":"c19-s011","title":"19.12　防晒与外观选择"},{"id":"c19-s012","title":"19.13　头发、头皮与指甲"},{"id":"c19-s013","title":"19.14　手部与足部：高频工具需要合适接口"},{"id":"c19-s014","title":"19.15　排尿：功能问题值得谈，不必等到失控"},{"id":"c19-s015","title":"19.16　排便：看变化、质地和困难，不要求每天同一时刻"},{"id":"c19-s016","title":"19.17　生殖与私密部位：清洁不等于消毒"},{"id":"c19-s017","title":"19.18　盆底与性功能：先辨认问题，不统一“收紧”"},{"id":"c19-s018","title":"19.19　心、肺、肝、肾：共享维护，不做每日刺激"},{"id":"c19-s019","title":"19.20　感官与身体维护的实际排程"},{"id":"c19-s020","title":"19.21　维护不应吞掉感受生活的能力"}]},{"id":20,"title":"卷二十　预防、检查与用药：把医疗建议真正闭环","html":"\u003ch2\u003e卷二十　预防、检查与用药：把医疗建议真正闭环\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c20\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e本卷的三个癌症筛查例子不是全部预防项目。血压、血脂、按条件的代谢与感染评估，接种记录、宫颈与骨骼风险，以及家庭或职业暴露，都要经过适用性判断。使用\u003ca href=\"#r31-prevention\"\u003e预防总表\u003c/a\u003e记录“是否适用—已知结果—下一动作—负责人”；未填不等于正常，列出也不等于全部要查。\u003c/p\u003e\n\u003ch3 id=\"c20-s000\"\u003e20.1　三类检查必须分开\u003c/h3\u003e\n\u003cp\u003e筛查面向没有相关症状、但符合某种风险条件的人，目标是发现有必要更早处理的问题。诊断检查面对已经出现的症状或异常，回答原因是什么。监测则用于已经明确的问题或治疗，判断变化与调整。三者可以使用类似工具，但目的与解释不能混同。\u003c/p\u003e\n\u003cp\u003e例如出现便血的人，不应因为尚未到普通筛查年龄就等待；长期治疗中的复查，也不能因“不建议无症状人群普查”而自行取消。反过来，一项诊断工具在有症状人群有用，并不证明所有健康人都应每年使用。\u003c/p\u003e\n\u003cp\u003e每次开检前可以问：“这项检查要解决哪个问题？”若答案只是套餐包含，继续问结果会怎样改变行动。不一定要拒绝，但需要知道它的位置。检查的价值来自能够帮助决定，而不是报告页数。\u003c/p\u003e\n\u003ch3 id=\"c20-s001\"\u003e20.2　筛查的完整链条\u003c/h3\u003e\n\u003cp\u003e筛查前明确适用条件和可能后果；检查时按要求准备；检查后取得正式结果；异常时完成进一步评估；需要治疗时进入适当治疗；最后更新下一次计划。任何一环断开，前面完成的动作都不能自动转化成健康收益。\u003c/p\u003e\n\u003cp\u003e因此，家庭或个人记录中不能只有“体检已做”，还要有“结果已解释”“需要处理的事项有负责人”“下一次时间明确”。无需让所有亲友看到全部报告，但负责协助的人应拥有足够信息。\u003c/p\u003e\n\u003cp\u003e遇到不确定结果，不必立刻搜索最严重解释。问清它是测量问题、需要复核、低风险观察，还是确需转诊。把下一步写成时间和条件，不把“有空再看看”当成计划。\u003c/p\u003e\n\u003ch3 id=\"c20-s002\"\u003e20.3　为什么更多检查可能增加不确定性\u003c/h3\u003e\n\u003cp\u003e下面是作者构造的数学示例，不描述任何实际疾病或检测产品。假设一千人中十人真正有某问题，检查能检出其中九人，同时把其余九百九十人中的百分之五判成阳性。那么阳性者约有五十九人，其中真正有问题的约九人。检查很敏感，不等于阳性就接近确诊。\u003c/p\u003e\n\u003cp\u003e真实检测还涉及特异度、疾病风险、阈值、重复验证和后续路径。这个例子只提醒：结果必须在受检人群背景下解释，不能单凭“准确率很高”就推出个人结论。低风险人群做大量项目，可能出现需要解释的偶然异常。\u003c/p\u003e\n\u003cp\u003e假阳性不是唯一代价。检查本身、进一步侵入性操作、辐射、焦虑、时间与费用，都需要进入选择。某些发现即使不查也未必在一生中造成问题，这就是讨论过度诊断时需要理解的核心。具体收益与伤害必须看该项目证据，不能因此一概拒绝筛查。\u003ca href=\"#s116\"\u003eS116\u003c/a\u003e\u003ca href=\"#s117\"\u003eS117\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c20-s003\"\u003e20.4　三个地区指南示例，展示条件而非提供全球日历\u003c/h3\u003e\n\u003cp\u003e以下为本版核对到的美国USPSTF最终建议示例，不是中国或其他地区的统一医嘱，也不涵盖全部高风险和术后情况。使用时仍需核对所在地现行指南与个人病史。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e项目\u003c/th\u003e\n\u003cth\u003e示例条件\u003c/th\u003e\n\u003cth\u003e不能省略的限定\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e乳腺筛查\u003c/td\u003e\n\u003ctd\u003e该指南适用的平均风险人群，四十至七十四岁每两年乳腺X线筛查\u003c/td\u003e\n\u003ctd\u003e遗传高风险、既往癌症或特殊治疗史另有路径；较高龄需个体判断。\u003ca href=\"#s116\"\u003eS116\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e结直肠筛查\u003c/td\u003e\n\u003ctd\u003e平均风险、无相关症状成人，四十五至七十五岁；可选检测方式与间隔不同\u003c/td\u003e\n\u003ctd\u003e七十六至八十五岁结合整体健康、既往筛查与偏好选择；异常粪便筛查需要相应后续检查。\u003ca href=\"#s117\"\u003eS117\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e肺癌筛查\u003c/td\u003e\n\u003ctd\u003e五十至八十岁，至少二十包年吸烟史，仍吸烟或戒烟不足十五年，讨论年度低剂量CT\u003c/td\u003e\n\u003ctd\u003e不是所有人每年做胸部CT；健康情况、能否及愿否接受后续治疗影响决定。\u003ca href=\"#s118\"\u003eS118\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e包年是累计吸烟暴露的表达，不是吸烟年数本身。上述例子说明年龄必须与风险、器官和后续处理结合。书后的逐年索引因此安排“核对预防计划”，而不把这一版医学数字冻结一百年。\u003c/p\u003e\n\u003ch3 id=\"c20-s004\"\u003e20.5　用器官与病史建立个人预防卡\u003c/h3\u003e\n\u003cp\u003e个人预防卡记录相关器官、既往手术、重要家族史、既往异常和目前疾病。宫颈、乳腺、前列腺等项目不能仅靠身份证性别简单推导；需要结合实际器官、手术和激素治疗史，由专业人员确定适用路径。\u003c/p\u003e\n\u003cp\u003e卡片也包含血压与代谢风险、口腔、视听、骨健康、感染暴露、心理状态及生活安全。不是所有项目每年都检查，也不是每个人都需要同样实验室组合。把它们作为与基层医生讨论的议题，再形成个人计划。\u003c/p\u003e\n\u003cp\u003e对儿童，疫苗、生长与发育观察、视听和口腔属于相应儿童保健路径；对孕产期，采用孕产团队计划；对高龄和重病，结合本人目标及治疗负担。不能拿普通成人体检套餐替代这些路径。\u003c/p\u003e\n\u003ch3 id=\"c20-s005\"\u003e20.6　疫苗：记录比记忆可靠\u003c/h3\u003e\n\u003cp\u003e保存正式接种记录，包括产品、日期、剂次与重要反应。搬迁、转学、留学、工作或怀孕计划变化时，带记录核对当地现行安排。口头说“小时候都打过”可能不足以决定补种，但记录缺失也不意味着自己重打全部。\u003c/p\u003e\n\u003cp\u003e接种时间和适用性应结合年龄、已有剂次、疾病、用药、妊娠、旅行和暴露，必要时由医疗人员解释。WHO强调按推荐时间完成接种，并在错过后联系服务提供者讨论后续安排，而不是自行猜测是否需要重启。\u003ca href=\"#s121\"\u003eS121\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e接种后按机构要求观察，了解常见反应与需要求助的信号。既往反应要如实描述，包括发生时间、具体表现和是否接受治疗，不只写“过敏”两个字。下一剂之前让专业人员判断，不凭网络争论决定全部疫苗的安全性。\u003c/p\u003e\n\u003ch3 id=\"c20-s006\"\u003e20.7　家庭血压：先把测量做对\u003c/h3\u003e\n\u003cp\u003e测量前按指导准备，排空膀胱并安静坐至少五分钟，背部有支撑、双脚平放且不交叉，裸露上臂由桌面支撑在合适高度，袖带尺寸与位置适合，测量时不说话。\u003ca href=\"#s119\"\u003eS119\u003c/a\u003e 不在刚运动、情绪剧烈波动或姿势随意时取得一个数值就当作日常基线。\u003c/p\u003e\n\u003cp\u003e设备是否经过适当验证、袖带是否适合、需测几次和记录多久，应向医生或药师核对。保留日期、时间、读数和相关症状，不只记最好的一次。设备显示异常但本人不舒服时，症状优先进入医疗判断。\u003c/p\u003e\n\u003cp\u003e家庭测量不能独立授权增减处方。开始监测时就问清哪些数值或症状需要何种响应，包括何时重复、何时联系、何时急救。不要在没有行动计划时一天量几十次，让监测本身增加焦虑。\u003c/p\u003e\n\u003ch3 id=\"c20-s007\"\u003e20.8　药物总表：一人一份当前真相\u003c/h3\u003e\n\u003cp\u003e药物表应包括通用名称、规格、实际用量、使用时间、用途、开药者和复查安排。外用、滴眼、吸入、贴剂、针剂、非处方药、草药和补充剂都要考虑，不能只有口服处方。已经停用的移到历史区，保留停用原因和日期。\u003c/p\u003e\n\u003cp\u003e记录真实使用方式。漏服、费用、吞咽困难、不适或不理解导致未执行时，告诉医疗人员才能改进方案；把表写得完美却与实际不同，反而增加风险。照护多人时，每个人药物分区，避免靠包装颜色辨认。\u003c/p\u003e\n\u003cp\u003e每次住院、出院、换医生、出现新病情或药物改变后做一次核对。明确旧药是继续、替换、暂停还是停止，不让新旧方案同时存在而由家属猜测。必要时请药师协助整合。\u003c/p\u003e\n\u003ch3 id=\"c20-s008\"\u003e20.9　剂量、单位与器具\u003c/h3\u003e\n\u003cp\u003e读懂“每片含量”“每次片数”“每日次数”和“总疗程”是不同信息。毫克、微克、毫升、滴数和国际单位不能互换；液体药的体积必须结合浓度。儿童药物尤其需要按实际处方和适合量具，不能用厨房汤匙估计。\u003c/p\u003e\n\u003cp\u003e剂型变化也需要核对。不能因为名字相同就认为不同规格、缓释、肠溶或不同途径可以直接替换。需要切片、碾碎、混入食物或经管路给药时，先问药师或医疗团队，不能为了方便自行改变。\u003c/p\u003e\n\u003cp\u003e标签模糊、药片来源不明、包装破损或储存条件失控时，先暂停使用该不明物并寻求确认。对不能中断的必要药物，应及时联系服务获取安全替代，而不是简单停掉整个治疗。\u003c/p\u003e\n\u003ch3 id=\"c20-s009\"\u003e20.10　漏服与不良反应：事先准备规则\u003c/h3\u003e\n\u003cp\u003e漏服后怎样处理取决于具体药物、距离下一次时间、疾病和风险，不能统一“补上”或“加倍”。最好在开药时问清，并保留说明。发现已经重复给药、剂量明显错误或儿童误服时，立即联系当地急救或中毒咨询，不等待症状出现再处理。\u003c/p\u003e\n\u003cp\u003e不良反应记录包括何时开始、当时用了什么、表现、持续时间和处理。严重呼吸困难、喉舌肿胀、昏厥等使用安全卷。普通不适也应反馈，尤其影响持续治疗时；不要为了显得配合而一直隐瞒。\u003c/p\u003e\n\u003cp\u003e部分药物不能突然停用，是否暂停或替换需由专业人员判断。出现问题时要尽快联系，而不是独自忍耐与自行停药二选一。每个长期方案都应有明确的咨询入口。\u003c/p\u003e\n\u003ch3 id=\"c20-s010\"\u003e20.11　抗菌药与家庭剩药\u003c/h3\u003e\n\u003cp\u003e抗菌药不能治疗病毒感染，使用时遵照处方，不与他人共享、不为以后自行储备使用，也不服用为别人开的药。是否需要药物由医疗评估决定，不能根据鼻涕颜色或以前一次经验直接复制。\u003ca href=\"#s120\"\u003eS120\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e症状未改善、出现副作用或情况改变时，联系开药者讨论，而不是自行延长、缩短或叠加。网上“必须永远吃满所有剩药”和“舒服了立即停”都不能替代具体医嘱。保存处方与实际使用信息，有助于后续判断。\u003c/p\u003e\n\u003cp\u003e家庭清理剩药时按当地回收或安全处置要求处理，不把药物随意倒进水槽或放在儿童可接触垃圾中。需要持续使用的药物建立补充提醒，避免因清理或整理而误丢。\u003c/p\u003e\n\u003ch3 id=\"c20-s011\"\u003e20.12　补充剂也进入同一张表\u003c/h3\u003e\n\u003cp\u003e不要把补充剂放在药物之外，当成天然且没有相互作用的独立世界。产品标签、剂量、开始日期与使用目的应能说清，尤其在手术、妊娠、哺乳、慢病和多药使用时向专业人员说明。\u003ca href=\"#s38\"\u003eS38\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e若同时使用多种复合产品，先核对重复成分。某一营养素已足够，并不意味着增加就会继续获益。出现症状时不要立刻再加一个产品抵消前一个产品的反应；先考虑是否需要停用新增非必要项目并咨询。\u003c/p\u003e\n\u003cp\u003e所有前沿“优化”方案在卷三十统一审查，本卷只要求信息透明、来源可靠和适当监督。秘密使用所谓抗衰药物，会使后续诊疗缺少关键资料。\u003c/p\u003e\n\u003ch3 id=\"c20-s012\"\u003e20.13　就诊前、中、后的三张小卡\u003c/h3\u003e\n\u003cp\u003e就诊前写主要问题、症状时间线、正在使用的东西和最希望解决的功能。问题多时排序，先讲最重要的，不把紧急症状放在最后一句。带必要报告，不需要打印所有历史聊天。\u003c/p\u003e\n\u003cp\u003e就诊中确认自己理解了什么。可以用自己的话复述：“所以目前还不能确定，需要先做这项，再根据结果决定？”听不懂就要求解释，语言或感官障碍可申请合适支持。陪同者帮助补充，不替本人决定一切。\u003c/p\u003e\n\u003cp\u003e就诊后记录下一步、截止时间、结果入口和异常处理。收费完成不是闭环，预约成功也不是治疗完成。确实无法执行时，联系团队讨论可行替代，而不默默放弃。\u003c/p\u003e\n\u003ch3 id=\"c20-s013\"\u003e20.14　第二意见与意见冲突\u003c/h3\u003e\n\u003cp\u003e需要重大、不可逆或高风险治疗时，可以在不延误紧急处理的前提下寻求适当第二意见。提供完整资料和原建议，重点问适应证、替代方案、预期收益、主要风险和等待代价，不只是寻找一个最合意的答案。\u003c/p\u003e\n\u003cp\u003e两位医生意见不同，先看是否面对同样信息、讨论同一目标、采用不同证据或承担不同风险偏好。可以请其解释分歧点，必要时由多学科团队协调。不是票数最多的建议自动正确，也不是最昂贵的机构必然更可靠。\u003c/p\u003e\n\u003cp\u003e对紧急情况，不应为了收集无限意见延误救治。对非紧急且信息不足的决定，则可以先补关键证据，而不是被销售期限推动。\u003c/p\u003e\n\u003ch3 id=\"c20-s014\"\u003e20.15　高龄与重病：停止某项筛查不等于停止照护\u003c/h3\u003e\n\u003cp\u003e是否继续预防性检查，需要看本人整体健康、既往结果、潜在收益出现所需时间、后续治疗是否符合目标和实际负担。年龄可以进入判断，但不能单独决定所有事项。具体例子见本卷地区指南和卷十五。\u003ca href=\"#s117\"\u003eS117\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e减少低价值项目后，应把注意力转到疼痛、口腔、感官、功能、营养、关系和舒适。停止一种检查，不代表不再解释新症状；选择缓和医疗，也不等于不给可缓解痛苦的治疗。\u003c/p\u003e\n\u003cp\u003e家庭讨论要围绕本人目标，而不是把做更多检查当作孝顺证明。真正的照护可能是陪同一次有价值的复诊，也可能是减少一次没有实际意义的奔波。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开：H 医疗闭环协议\u003c/summary\u003e\n\u003cp\u003e提出问题时注明症状、风险或监测目的；行动前确认适用条件与准备；完成后取得结果并解释；有后续时写负责人和期限；计划变化时更新药物与日历。\u003c/p\u003e\n\u003cp\u003e每天不需要重复审查全部医疗资料，只处理到期和异常事项。每次跨机构、出院或重要用药变化后，额外做一次整合。没有明确行动的数字不必无限收集，有明确行动的结果不能无人跟进。\u003c/p\u003e\n\u003c/details\u003e\n\u003cp\u003e预防医疗的目标不是让每一天都像体检日，而是让必要服务准确到位，使普通日子可以放心用于生活。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c20-s000","title":"20.1　三类检查必须分开"},{"id":"c20-s001","title":"20.2　筛查的完整链条"},{"id":"c20-s002","title":"20.3　为什么更多检查可能增加不确定性"},{"id":"c20-s003","title":"20.4　三个地区指南示例，展示条件而非提供全球日历"},{"id":"c20-s004","title":"20.5　用器官与病史建立个人预防卡"},{"id":"c20-s005","title":"20.6　疫苗：记录比记忆可靠"},{"id":"c20-s006","title":"20.7　家庭血压：先把测量做对"},{"id":"c20-s007","title":"20.8　药物总表：一人一份当前真相"},{"id":"c20-s008","title":"20.9　剂量、单位与器具"},{"id":"c20-s009","title":"20.10　漏服与不良反应：事先准备规则"},{"id":"c20-s010","title":"20.11　抗菌药与家庭剩药"},{"id":"c20-s011","title":"20.12　补充剂也进入同一张表"},{"id":"c20-s012","title":"20.13　就诊前、中、后的三张小卡"},{"id":"c20-s013","title":"20.14　第二意见与意见冲突"},{"id":"c20-s014","title":"20.15　高龄与重病：停止某项筛查不等于停止照护"}]},{"id":21,"title":"卷二十一　慢病、残障与康复：让通用建议知道何时退出","html":"\u003ch2\u003e卷二十一　慢病、残障与康复：让通用建议知道何时退出\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c21\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c21-s000\"\u003e二十一·一　诊断是一个分流入口，不是整个人的定义\u003c/h3\u003e\n\u003cp\u003e一个人可以有糖尿病，同时是运动爱好者；可以使用轮椅，同时管理复杂项目；可以需要提醒用药，同时对其他生活决定表达清楚。诊断提供重要信息，却不能替代对具体能力、目标和环境的观察。本卷的作用是给前面的年龄日程增加适配接口，不另造一套只剩治疗的人生。\u003c/p\u003e\n\u003cp\u003e残障并非只由身体内部的状态决定，也与交通、建筑、沟通、制度和资源障碍相互作用。改善可及性是健康与参与的一部分，不应把所有困难都转成个人康复任务。\u003ca href=\"#s128\"\u003eS128\u003c/a\u003e 对本人而言，楼梯无法通行时需要的是可用路线，而不只是被鼓励更加坚强。\u003c/p\u003e\n\u003cp\u003e所有分支先回答：“今天最想完成什么？”再问“哪一步受限？”限制可能需要治疗、工具、协助或改变环境。不要一上来就要求把所有身体指标恢复成没有疾病的人，才允许工作、亲密、娱乐和选择。\u003c/p\u003e\n\u003ch3 id=\"c21-s001\"\u003e二十一·二　建立一页个人疾病行动卡\u003c/h3\u003e\n\u003cp\u003e行动卡应由本人和相应医疗团队共同确认。写明平稳状态是什么，日常用药与必要监测是什么，哪些变化需要当天联系，哪些情况直接急救，谁能提供支持，夜间如何联系。把药物商品名、成分、剂量单位和使用条件写清楚，不以颜色或模糊绰号作为唯一识别。\u003c/p\u003e\n\u003cp\u003e行动卡还需要写“不能照搬什么”。例如饮水受到个体限制，活动存在特定禁忌，某些非处方药不适合，或者出现某类症状时不能继续训练。这部分用来覆盖本书的普通建议，避免一条看似健康的通用规则破坏已经建立的治疗方案。\u003c/p\u003e\n\u003cp\u003e随病情和处方变化更新版本与日期，旧版明显作废。实际照护者应能找到当前版本，并通过复述或回演确认会用。电子文件方便更新，必要时仍保留可离线取得的最小纸质版本。\u003c/p\u003e\n\u003ch3 id=\"c21-s002\"\u003e二十一·三　糖尿病：平日、病日和急症不是同一张菜单\u003c/h3\u003e\n\u003cp\u003e日常饮食、运动、监测和药物应形成互相协调的方案。工作时能否按需进食、是否随身携带必要用品、设备故障后如何处理，都是实际治疗条件。不能在开始新运动或改变饮食后，仍假设原来所有操作无需复核。\u003c/p\u003e\n\u003cp\u003e对于已经确诊、清醒且能安全吞咽、其个人计划适用的低血糖情形，常见成人处理规则是摄入十五克快速吸收碳水，十五分钟后复测并按结果处理。儿童可能需要更少，必须使用医生给出的量。意识受损或不能安全吞咽时，不向口中塞糖或灌水；立即求助，按已经开具且受过培训的胰高血糖素方案处理。\u003ca href=\"#s122\"\u003eS122\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e反复低血糖不是靠不断增加零食就算闭环，应带着进食、活动、监测与用药记录请团队调整。不要自行照书修改胰岛素剂量。本书只说明行动计划的接口，不能提供适用于所有人的注射算法。\u003c/p\u003e\n\u003cp\u003e生病时要提前知道何时测血糖或酮体、哪些药物如何处理、何时联系。明显呕吐、腹痛、深快呼吸、异常嗜睡或其他严重不适可能提示需要急诊评估；酮症酸中毒可危及生命，不以“今天没吃东西所以不用管”处理。\u003ca href=\"#s123\"\u003eS123\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c21-s003\"\u003e二十一·四　糖尿病足：感觉不到疼痛也要看得到变化\u003c/h3\u003e\n\u003cp\u003e按个人医疗计划每天检查足底、趾间和鞋内，视力或动作受限时使用镜子或请人协助。发现水疱、伤口、颜色或温度变化、局部红肿等，应及时联系医疗人员；没有疼痛不能作为安全保证。不要自行剪除厚茧、用腐蚀性去鸡眼产品或在足部使用过热水与热源。\u003ca href=\"#s124\"\u003eS124\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e把检查嵌入穿袜或清洁后的顺序，用品放在固定位置。若没有人能够看清足底，问题不是“本人不配合”，而是照护方案缺少一个可执行步骤。需要鞋具或专业足部护理时，按评估选择，不凭商品“糖尿病专用”字样认定适合。\u003c/p\u003e\n\u003cp\u003e这项动作在启用期间每日重复，但只在本处展开。其他年龄章节引用行动卡即可，不必再抄一整份足部清单。\u003c/p\u003e\n\u003ch3 id=\"c21-s004\"\u003e二十一·五　哮喘：会拿吸入器，不等于会正确使用\u003c/h3\u003e\n\u003cp\u003e请医生、护士或药师看一次本人实际操作，再纠正具体装置的技术。不同吸入器与治疗方案并不相同，不能把颜色、吸气方式或一次用量通用于全部产品。个人行动计划应说明平稳期用法、症状恶化时怎么做，以及何时急救。\u003ca href=\"#s125\"\u003eS125\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e生活上检查救急药是否能随时取得、是否还有余量、学校或工作场所是否知道必要信息。症状影响活动、夜间反复醒来或越来越需要缓解药时，应复核控制情况，而不是悄悄忍耐。出现严重呼吸困难、持续恶化或按行动计划处理后仍不好，立即寻求紧急帮助。\u003c/p\u003e\n\u003cp\u003e不要一概取消所有活动，也不要把运动时不适当成锻炼不足必须硬撑。适合的活动方式与事前处理由个人方案决定。刺激物暴露若来自工作或居住环境，应考虑环境调整，而不只增加个人药物负担。\u003c/p\u003e\n\u003ch3 id=\"c21-s005\"\u003e二十一·六　心脏、肾脏与其他需要特殊饮食的疾病\u003c/h3\u003e\n\u003cp\u003e多种疾病共存时，“多喝水”“吃更多蛋白”“多补钾”“低盐就用替代盐”等普通建议，都可能需要重新判断。以慢性肾病为例，营养和液体安排取决于疾病阶段、化验、治疗与整体营养状态，不能由书中的健康成人菜单直接推导。\u003ca href=\"#s96\"\u003eS96\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e向团队确认哪些限制真正适用于自己，限制到什么程度，哪些食物可以替代，出现什么变化需要复核。把限制写成可买、可做、可吃的方案，而不是十张互相冲突的禁忌表。若限制多到实际吃不够，应寻求营养专业支持。\u003c/p\u003e\n\u003cp\u003e日常监测必须有用途。记录体重、血压或其他项目时，问清变化阈值、观察周期和联系对象；不同病情不能共享同一警报值。过多没有后续动作的记录，只会让患者成为数据录入员而不是治疗参与者。\u003c/p\u003e\n\u003ch3 id=\"c21-s006\"\u003e二十一·七　癌症治疗：把生活支持与治疗计划并列\u003c/h3\u003e\n\u003cp\u003e面对诊断，先确认病理信息、目前分期或尚待完成的评估、治疗目标、可选择方案、主要不确定性及下一步时间。需要第二意见时，带齐关键材料，避免仅凭互联网相似病例替自己决定。讨论生育、工作、照护和费用，是治疗规划的一部分，不必等治疗结束后才提。\u003c/p\u003e\n\u003cp\u003e某些癌症及治疗会增加感染风险。治疗团队应明确发热和感染的联系规则；出现发热、寒战或其他感染提示时及时联系，不先反复用退热药掩盖后等待。特别是中性粒细胞减少等风险状态，需要按团队的紧急计划处理。\u003ca href=\"#s126\"\u003eS126\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e把每个治疗周期的交通、陪同、食物、休息和工作安排画出来。状态较好的一天也不必补完全部欠下任务。亲友提供帮助时，优先承接实际负担，而不是持续发送未经核实的“治愈秘方”。任何补充产品、草药或所谓免疫增强方案都应先与团队核对，不能因为不是处方药就认为不会干扰治疗。\u003c/p\u003e\n\u003ch3 id=\"c21-s007\"\u003e二十一·八　疼痛：同时看原因、功能和治疗负担\u003c/h3\u003e\n\u003cp\u003e疼痛描述可以包括位置、开始方式、变化、相关动作、感觉特征、影响的任务和已经尝试的处理。新发、剧烈、伴明显神经变化或其他危险信号的疼痛，先走相应急症或诊疗路径。既有慢性疼痛的人同样可能出现新的问题，不能所有变化都归入旧诊断。\u003c/p\u003e\n\u003cp\u003e和专业人员讨论一个功能目标，例如能够连续准备简单食物、坐车参加活动或完成必要工作段。目标不是要求忽略疼痛，也不只追逐每天的分数归零。不同原因需要不同治疗与活动安排，本书不提供统一拉伸、按摩或止痛药方案。\u003c/p\u003e\n\u003cp\u003e家庭支持可以减少不必要的争论：不要求本人每次都证明疼痛真实，不把疼痛看作偷懒，也不替本人预测永远不能做什么。共同寻找合适的活动分段、工具和休息方式，效果不佳时及时复核，而不是不断加码同一种方法。\u003c/p\u003e\n\u003ch3 id=\"c21-s008\"\u003e二十一·九　活动后症状加重：不能套固定递增训练\u003c/h3\u003e\n\u003cp\u003e对于存在活动后症状加重的相关疾病，负荷不仅包括运动，还可能包括思考、社交、直立、通勤和感官刺激。已经在卷十八说明的肌痛性脑脊髓炎／慢性疲劳综合征分支，需要按自身能量界限和专业支持安排，不能以固定每周加量的方式强推。\u003ca href=\"#s102\"\u003eS102\u003c/a\u003e\u003ca href=\"#s103\"\u003eS103\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e实用记录关注延迟结果：一次活动之后当天、次日或更后面的生活能力有没有明显恶化。若只在活动结束当下看心率和主观感觉，可能漏掉后续负担。记录到足以识别模式即可，不要求把每
