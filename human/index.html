<script id="bookData" type="application/json">{"chapters":[{"id":0,"title":"卷〇　怎样使用这本书：不是把人生变成打卡表","html":"\u003ch2\u003e卷〇　怎样使用这本书：不是把人生变成打卡表\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c00\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**日历先服从启动条件。**本书的“第几天”和“几岁主题”有两种身份：医疗或安全事项的时间窗口，以及作者安排的学习、复核主题。后者不是首次允许执行的日期。需要从出生、首次暴露或异常出现时立即生效的规则，不能等到对应阅读日；已经启动的规则也不因翻到下一页而失效。新增事项写成“触发—动作—完成证据—退出条件”，见\u003ca href=\"#c31\"\u003e卷三十一\u003c/a\u003e。\u003c/p\u003e\n\u003ch3 id=\"c00-s000\"\u003e〇·一　先定义“最优”，否则勤奋可能朝着错误方向累积\u003c/h3\u003e\n\u003cp\u003e这本书把“最优地使用人体”解释为：在本人能够理解并认可的目标下，尽可能保有行动能力、学习能力、感受能力、关系能力与选择能力，同时减少可避免的伤害、痛苦和照护失控。活得久是其中一个目标，但不是可以吞掉其余目标的唯一数字。一个人为延长理论寿命而失去吃饭的快乐、持续害怕自己的心率、拒绝所有亲密关系，未必是在更好地生活。另一个人用极短期兴奋交换长期功能，也不能只凭“当时很开心”忽视代价。\u003c/p\u003e\n\u003cp\u003e本书不假设所有人都要结婚、生育、创业、拥有健全肢体、取得高收入或者活到一百岁。人生不是单一赛道。受精卵没有可自行执行的待办清单；胎儿、婴儿以及暂时不能独立决策的人，需要的是照护者正确地安排环境，而不是被要求为自己的发育负责。成年以后，书中的建议逐渐从“照护者应该做什么”转为“本人可以选择什么”。高龄以后，协助可能增加，但决策权不应因此自动被收走。\u003c/p\u003e\n\u003cp\u003e为了实际取舍，可以把每个计划放在五个问题下检验：它保护了什么功能；它占用多少时间、金钱、注意力和恢复空间；它最坏会造成什么；它是否会挤掉一件更重要的事；本人是否愿意让这种生活持续一年。这里不把答案硬算成一个貌似科学的总分。不同人的取舍不能由一组未经验证的权重替代。\u003c/p\u003e\n\u003cp\u003e全书的默认排序是：先处理急迫危险，再守住基本供给，然后恢复受限功能，继而发展能力，最后探索边际收益不确定的优化。排序并不意味着生活必须先毫无缺陷才允许快乐。恰恰相反，能让人愿意继续生活的关系、兴趣和自主感，应该进入基础层，而不是被放在“所有指标达标之后”的奖励层。\u003c/p\u003e\n\u003ch3 id=\"c00-s001\"\u003e〇·二　两套年龄，避免从第一页就算错时间\u003c/h3\u003e\n\u003cp\u003e本书使用受精时钟与出生时钟。受精当天写作“受精第零日”，是生物学叙述的起点。临床孕周通常按末次月经或超声校正结果记录，不能简单等同于受精后的周数；在常见的日期估算中，两者大约相差两周，但周期、排卵和辅助生殖情况都可能改变算法。实际产检以医疗团队确认的孕周和预产期为准，不用这本书反推一个声称精确到天的受精日期。\u003ca href=\"#s07\"\u003eS07\u003c/a\u003e\u003ca href=\"#s11\"\u003eS11\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e出生当天另起“日龄零日”。出生后一个月、六个月、一周岁，均按出生日期计算；讨论早产儿发育时，还需要医疗团队指导使用矫正年龄。全书覆盖受精至出生后满一百周岁这一段时间，因此不是把怀孕的月份从一百岁中扣掉。一个人的百岁生日也不是计划终止日：到达这个节点后，仍可继续使用高龄、照护和自主选择的协议。\u003c/p\u003e\n\u003cp\u003e日龄区间一律采用前端包含、后端不包含的理解。例如“六至十二个月”指已满六个月、未满十二个月；满十二个月当天进入下一阶段。连续日龄的数学覆盖并不表示人的能力会在午夜突然升级。月龄和周岁只是索引，真正的切换条件还包括能力、症状、生活事件和专业评估。\u003c/p\u003e\n\u003ch3 id=\"c00-s002\"\u003e〇·三　“每天应该干什么”的完整解法\u003c/h3\u003e\n\u003cp\u003e每天的行动不是从零重新发明，而由五层叠加：当前生命阶段的基础协议、年龄或能力带来的新增任务、当周轮换主题、已经发生的事件、当天的资源限制。除此以外，还有一个有权打断所有层次的安全判断。只要出现急迫危险，就先寻求适当帮助，而不是完成当天运动量后再处理。\u003c/p\u003e\n\u003cp\u003e读者可以把它理解成一个不会强迫执行的日程生成器。早晨先问：今天是在平稳状态、恢复状态，还是需要求助的状态？平稳时照常；恢复时减少非必要负荷；需要求助时把就医、转移危险、联系可信赖的人放在首位。然后打开所在年龄的章节，只看上一次没有出现过的增量。最后选一个今天确实容得下的新动作，而不是把全书同时搬进日历。\u003c/p\u003e\n\u003cp\u003e对婴儿，日程以喂养、睡眠、清醒互动、清洁和照护者交接为节律，不应按成人办公钟硬切。对学生，学校已经占用的时间必须进入总预算；不能再把每项能力训练都当作额外增加的免费时间。对工作者，通勤、家务、照护、恢复都是真实负荷。对高龄者，活动前后需要的准备和休息，也是任务的一部分。\u003c/p\u003e\n\u003cp\u003e如果某一天没有任何新增情况，正确答案就是继续执行已经展开过的基础协议。重复行动可以重复发生，但不需要重复写三万多遍。书中的折叠块负责保存这些共用行动；章节链接负责说明从哪里继承；新增内容负责告诉读者发生了什么变化、为何变化、怎么调整。\u003c/p\u003e\n\u003ch3 id=\"c00-s003\"\u003e〇·四　四种标签，防止把编排当成医学定律\u003c/h3\u003e\n\u003cp\u003e“依据”表示该结论有对应的官方指南、公共卫生资料或原始研究入口，正文用方括号来源编号标注。“编排”表示作者为了便于执行而设计的日程、练习、问题或顺序，不是临床试验已经证明的唯一最优解。“条件”表示必须先满足的能力、环境或医疗条件。“待核”表示此项依赖所在地政策、具体产品说明书、个体病史或未来更新，不能凭书中概括直接实施。\u003c/p\u003e\n\u003cp\u003e尤其需要注意：本书把某个主题安排在二十三岁、四十七岁或者八十二岁，不代表科学证明那一年存在独一无二的窗口。成人逐年主题是一份可移动的年度审视清单。已经掌握的人可以跳过；目前正遭遇这个问题的人可以提前使用；没有相关生活情境的人不需要为了完成表格而制造一个。\u003c/p\u003e\n\u003cp\u003e一个建议旁边没有药物剂量，往往不是遗漏，而是它本来就不应该变成跨越所有年龄、所有病史的自我处方。营养素的公共参考值也不等于每个人必须另吞一片补充剂。食物、强化食品、复合产品与处方可能共同构成总摄入量，不能把各处建议机械相加。\u003c/p\u003e\n\u003ch3 id=\"c00-s004\"\u003e〇·五　用身体能力，而不是只用年龄分流\u003c/h3\u003e\n\u003cp\u003e从能否安全完成任务来分流，比只看年龄更可操作。准备练习上楼的人，先确认是否能够安全起身、行走、转身以及表达不适；准备独立做饭的孩子，先确认能否理解热源、刀具、过敏和求助规则；准备独居的人，先确认能否处理紧急联系、基本生活和药物，而不是只问是否达到某个生日。\u003c/p\u003e\n\u003cp\u003e因此，年龄主线之外，本书始终保留四种接口：需要他人代执行、需要旁边协助、可以独立执行、可以教别人执行。它们不是人的等级，只是任务的权限状态。一个人在财务上能完全独立，在身体转移上需要协助，在语言沟通上需要辅助设备，在医疗决策上又能清楚表达，这些状态可以同时存在。\u003c/p\u003e\n\u003cp\u003e当功能下降，先找出具体任务哪里卡住，不要立即给整个人贴上“不行了”的标签。拿不到杯子可能是杯架太高；不愿出门可能是厕所难找；不回答问题可能是听不清；不会用手机可能是界面改变。先改接口，再判断能力，能够避免不少由环境制造出来的无能感。\u003c/p\u003e\n\u003ch3 id=\"c00-s005\"\u003e〇·六　最低可行日、常规日与探索日\u003c/h3\u003e\n\u003cp\u003e最低可行日是给生病、照护中断、考试冲刺、家庭危机或极端忙碌准备的降级方案。它只保留安全、基本进食饮水、必要治疗、可获得的休息、最低限度卫生，以及一个能求助的联系渠道。婴儿和依赖照护者的人不能因为成人忙碌而削减必要照护，降级应当从成人的非必要事务开始。\u003c/p\u003e\n\u003cp\u003e常规日是长期真正会反复发生的日子。它包含可以持续的睡眠安排、符合能力的活动、可负担的饮食、工作或学习、连接他人的时间和一点不被绩效考核的空白。常规日不需要每天都很精彩。它的检验标准是明天还能继续，而不是今天把所有项目都刷满。\u003c/p\u003e\n\u003cp\u003e探索日用来接触新运动、新知识、新环境和新关系，但应先划定风险预算。第一次攀登、第一次使用新设备、第一次处理高额合同，都不能只凭热情复制熟手的做法。探索可以让生活更丰富，前提是失败仍在可承受范围内，且不会把依赖你的人一起推入未经同意的风险。\u003c/p\u003e\n\u003cp\u003e这三种日型之间可以切换。没有必要把最低可行日解释成人格失败，也不要因为某个探索日特别有成就感，就要求全年维持同样强度。人的生活需要节奏，而不是一条永远向上的负荷曲线。\u003c/p\u003e\n\u003ch3 id=\"c00-s006\"\u003e〇·七　一个成人的示例日，展示生成方式而非规定钟点\u003c/h3\u003e\n\u003cp\u003e假设读者三十五岁，主要坐着工作，没有已知运动禁忌，今天精神平稳。晨间先完成必要卫生和早餐安排，确认今天一项最重要的工作结果，再决定活动放在哪里。通勤能安全步行的部分可以计入活动；工作间歇可以更换姿势、短暂离开屏幕；午间不必同时完成学习课程、社交和高强度训练。\u003c/p\u003e\n\u003cp\u003e下午把需要集中判断的工作与琐碎沟通分开，避免一天所有时间都被即时消息切碎。傍晚根据本周计划安排适量运动，或在疲惫时改为较轻的活动。晚上完成生活维护、必要沟通和第二天准备，留出结束工作的边界。这一天的新增事项可能只是“把家中药物清单整理成一页”，不需要再加十个健康挑战。\u003c/p\u003e\n\u003cp\u003e如果同一个人昨晚几乎未睡、今天还要长途驾驶，生成结果应当改变：驾驶风险优先，训练和额外学习可以取消。如果今天出现新发胸痛伴明显不适，日程生成器被安全规则打断，进入急救评估，而不是把不适解释成缺少意志力。这才叫真正的按天安排。\u003c/p\u003e\n\u003ch3 id=\"c00-s007\"\u003e〇·八　一个家庭的示例日，展示冲突如何处理\u003c/h3\u003e\n\u003cp\u003e假设家中有婴儿、上班的伴侣和行动不便的老人。三套最理想的个人日程相加，通常会超过家庭的人力预算。此时应先画出必须由真人完成的任务：谁负责喂养，谁处理老人转移，谁能连续休息，谁在突发情况时接班。家务可以推迟或外包，必要照护不能假装由“大家”负责。\u003c/p\u003e\n\u003cp\u003e安排交接时，不写“下午帮忙看一下”，而写清谁接手、何时接手、上一项照护完成到哪里、什么情况需要联系另一人。重要信息用一份可更新的记录，而不是散落在多人聊天的回忆里。这样做的目的不是把家庭变成机构，而是减少疲劳状态下的遗漏和相互指责。\u003c/p\u003e\n\u003cp\u003e真正需要优化的往往不是某个人更自律，而是家庭减少一次无谓往返、取消一项没有意义的消费、让一个照护者能够完整吃饭，或者让求助变得不丢脸。身体处在关系网络之中，维护一个人的功能，有时必须先维护支持他的系统。\u003c/p\u003e\n\u003ch3 id=\"c00-s008\"\u003e〇·九　记录什么，才能真正降低不确定性\u003c/h3\u003e\n\u003cp\u003e记录不是越多越好。一个有用的记录，应当能改变未来的行动。若某项数据既没有可靠测量方式，也不知道出现变化后怎么办，那么持续记录它可能只是增加焦虑。优先记录症状发生的时间、持续情况、相关活动、是否影响功能、已经采取的措施，以及专业人员给出的下一步。\u003c/p\u003e\n\u003cp\u003e对于习惯，只需记录是否执行到足以判断可持续的程度。例如想增加阅读，关注能否回忆和使用内容，比精确计算翻了多少页更重要；想改善家庭沟通，关注是否明确了下一步与责任人，比给每天的情绪打三种颜色更重要；想恢复步行能力，关注安全性、疲劳与生活参与，比追逐一个陌生人的步数纪录更重要。\u003c/p\u003e\n\u003cp\u003e记录也要有删除规则。已经稳定、不再影响决策的数据可以降频；包含他人隐私的内容要征得适当同意；孩子的照片、病史和日常细节不应因为父母管理方便就被无限公开。降低信息熵不能以剥夺他人的隐私为代价。\u003c/p\u003e\n\u003ch3 id=\"c00-s009\"\u003e〇·十　如何从任意年龄开始，而不是因“错过起点”放弃\u003c/h3\u003e\n\u003cp\u003e第一次打开本书，无论你十六岁、三十岁还是八十岁，都不必补做此前所有章节。先找当前年龄主线，再检查基础协议中是否有一个明显缺口，最后处理正在发生的生活事件。过去的章节仅作为理解背景，不构成需要偿还的作业。\u003c/p\u003e\n\u003cp\u003e对已经错过的机会，区分三类：仍能直接补上的能力；需要换一种方式实现的目标；已经不可逆但可以减轻后果的经历。例如不会游泳可以寻找合适教学；某项运动已不适合时可以保留其社交和户外价值；童年受到伤害则不应被要求通过“想开一点”重写历史。书中的任务是帮助现在的你拥有更多可行路径，不是裁判以前的你是否合格。\u003c/p\u003e\n\u003ch3 id=\"c00-s010\"\u003e〇·十一　阅读路线与折叠规则\u003c/h3\u003e\n\u003cp\u003e首次阅读建议先看本卷与安全卷，再看所在年龄阶段，随后根据现实问题进入专题。负责婴儿照护的人应同时阅读孕产、新生儿、喂养与安全部分；进入老年照护的人应同时阅读功能、药物、家庭协作和生命末期部分。阅读不是必须从第一页进行到最后一页的考试。\u003c/p\u003e\n\u003cp\u003e折叠块用来容纳确实反复复用的协议，例如成人日常底座、每周审视和家庭交接。支持原生HTML折叠的Markdown阅读器可以展开与收起；不支持的阅读器通常仍会显示全部文字。正文通过编号和标题引用，而不把同一段话改几个词反复写入不同年龄。必要的安全提醒可能在危险场景再次出现，这是有意保留的少量冗余。\u003c/p\u003e\n\u003cp\u003e书后提供年度主题、日程示例、异常分流、决策表和来源说明。它们不是让你每天阅读更多，而是让你用更少搜索找到下一步。真正成功的使用方式，是把大量可能性压缩为今天少数值得做的事，然后把注意力还给实际生活。\u003c/p\u003e\n\u003ch3 id=\"c00-s011\"\u003e〇·十二　这本书承认的边界\u003c/h3\u003e\n\u003cp\u003e截至本版核对日期，任何一本书都不能保证一个人活到一百岁，也不能为每一种罕见疾病、每一处法律制度、每一种残障或每一种家庭结构给出完整处方。本书追求的是宽覆盖、细粒度行动和清楚的分流，而不是宣称已穷尽人类生命中的每个信息点。\u003c/p\u003e\n\u003cp\u003e资料中的年龄范围是群体参考，不是给个人下判决的工具。新的症状不能靠这本书排除严重疾病；治疗、检查与用药需要适当专业人员结合实际情况决定。医学、公共政策和可用技术会变化，因此这是一份可更新的操作手册，不是一份可以封存一百年不再复核的圣典。\u003c/p\u003e\n\u003cp\u003e“最优”最后仍然要回到本人：这个安排是否让你更能做自己珍视的事，是否让你与他人相处得更有尊严，是否给未来留下选择。如果一个方案让所有数字都变漂亮，却使生活变得更狭窄，就需要重新检查目标，而不是继续加码执行。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c00-s000","title":"〇·一　先定义“最优”，否则勤奋可能朝着错误方向累积"},{"id":"c00-s001","title":"〇·二　两套年龄，避免从第一页就算错时间"},{"id":"c00-s002","title":"〇·三　“每天应该干什么”的完整解法"},{"id":"c00-s003","title":"〇·四　四种标签，防止把编排当成医学定律"},{"id":"c00-s004","title":"〇·五　用身体能力，而不是只用年龄分流"},{"id":"c00-s005","title":"〇·六　最低可行日、常规日与探索日"},{"id":"c00-s006","title":"〇·七　一个成人的示例日，展示生成方式而非规定钟点"},{"id":"c00-s007","title":"〇·八　一个家庭的示例日，展示冲突如何处理"},{"id":"c00-s008","title":"〇·九　记录什么，才能真正降低不确定性"},{"id":"c00-s009","title":"〇·十　如何从任意年龄开始，而不是因“错过起点”放弃"},{"id":"c00-s010","title":"〇·十一　阅读路线与折叠规则"},{"id":"c00-s011","title":"〇·十二　这本书承认的边界"}]},{"id":1,"title":"卷一　先守住不可逆的损失：安全、权限与共用底座","html":"\u003ch2\u003e卷一　先守住不可逆的损失：安全、权限与共用底座\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c01\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c01-s000\"\u003e一·一　安全不是每天害怕，而是提前决定少数关键动作\u003c/h3\u003e\n\u003cp\u003e安全管理的目标，是让危险发生时少做几次临场猜测。家庭最值得事先统一的不是“大家都要小心”，而是谁知道地址，谁能呼叫当地急救，谁会开门引导救援，谁能提供用药和过敏信息，谁负责其他孩子或依赖照护者。一个人在紧张时未必能同时回忆所有事项，因此把它们写在容易找到的一页上，比要求每个人保持镇定更可靠。\u003c/p\u003e\n\u003cp\u003e这张卡应包含姓名、紧急联系人、重要疾病、已知严重过敏、正在使用且急救相关的药物、常用医疗机构，以及主要沟通需要。不要把无关的完整人生经历塞进去。家人至少知道卡片放在哪里；独居者可在手机紧急信息和钱包中留出最小版本。涉及隐私的内容以够用为度，不需要公开给所有访客。\u003c/p\u003e\n\u003cp\u003e平时演练只练动作，不制造恐慌：从房间到门口的路是否畅通，楼栋和门牌是否清楚，电话没电时能否求助，夜间照护者不在时是否有替补。真正的演练结束时，应当留下一个改动，而不是只说“下次注意”。\u003c/p\u003e\n\u003ch3 id=\"c01-s001\"\u003e一·二　全龄紧急覆盖规则\u003c/h3\u003e\n\u003cp\u003e突然失去反应、没有正常呼吸或只有濒死喘息，应立即启动当地急救系统并按调度员指导行动；让旁人取来自动体外除颤器并依提示使用。成人心肺复苏的核心包含胸外按压；常用培训参考为每分钟一百至一百二十次。婴儿、儿童、溺水等情形的流程和通气要求不同，不能把成人摘要原样套用。最有价值的平日动作是接受正式实操培训，而不是只收藏文字。\u003ca href=\"#s34\"\u003eS34\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e突然一侧面部下垂、单侧无力、言语异常，或突发明显视力、平衡问题，应把卒中作为需要紧急排除的情况。记录最后一次状态正常的大致时间，不等待自行恢复后再决定；症状短暂消失也不表示风险已经解除。不要自行开车前往急诊，不用进食、按摩或临时服药替代急救评估。\u003ca href=\"#s35\"\u003eS35\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e接触食物、药物或昆虫后迅速出现喉舌肿胀、呼吸困难、明显头晕或倒下，可能是严重过敏反应。立即呼叫急救；有医生开具的肾上腺素自动注射器及行动计划时，依培训和说明使用。不能只等抗过敏药起效，也不应让当事人站起或走动去找帮助。\u003ca href=\"#s36\"\u003eS36\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e以上不是全部急症清单。持续或剧烈胸痛伴不适、严重呼吸困难、大量出血、抽搐后不能恢复、严重外伤、可疑中毒、突发意识混乱，都应优先获得紧急评估。不能把“书上没有出现这个组合”理解为可以放心等待。紧急程度看症状与状态，不看年龄是否年轻、平时是否自认为健康。\u003c/p\u003e\n\u003ch3 id=\"c01-s002\"\u003e一·三　婴儿与孕产期有更低的求助门槛\u003c/h3\u003e\n\u003cp\u003e未满三个月的婴儿测得体温达到三十八摄氏度，或照护者明显怀疑发热，应立即联系医疗服务获得及时评估，而不是先在家完成多轮退热观察。难唤醒、呼吸费力、发青、明显拒奶或反应异常，需要更紧迫处理。测量方法、环境和设备会影响读数，但不能用“可能是误差”拖延一个看起来生病的婴儿。\u003ca href=\"#s29\"\u003eS29\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e孕期和分娩后，严重腹痛、明显出血、胸痛、呼吸困难、持续严重头痛伴视物异常、昏厥，或伤害自己和婴儿的想法，均应及时获得医疗帮助。就医时主动说明正在怀孕或最近一年内分娩过，这项信息不能假设每位接诊者已经知道。\u003ca href=\"#s10\"\u003eS10\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e早孕出现单侧下腹痛、肩尖痛、头晕或晕厥等组合，需要警惕异位妊娠相关风险。早孕试纸阳性只回答是否检测到相关激素，不能独立证明妊娠位置和发育情况；是否需要超声、抽血和何时复查，由医疗团队结合症状安排。\u003ca href=\"#s27\"\u003eS27\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c01-s003\"\u003e一·四　把急救知识放在真正能用的地方\u003c/h3\u003e\n\u003cp\u003e急救箱不是药越多越好。它应当服务于家庭已明确的需要：合适的测温工具、常用敷料、个人处方救急药及其书面计划、可访问的联系方式。药物与工具分区，保留外包装和说明书，定期核对是否过期、是否适用于现有人口。儿童接触不到，不等于老人或照护者在紧急时也找不到。\u003c/p\u003e\n\u003cp\u003e对每一种救急药，应清楚“给谁用、什么条件下用、怎样用、用后还要做什么”。不知道属于谁的药，不能因为症状看似类似就给另一人使用。需要冷藏、避光或防高温的产品按具体说明保存；外出时也要计算储存条件，不把“带在身上”误当作“仍然有效”。\u003c/p\u003e\n\u003cp\u003e家庭若有人有严重过敏、癫痫、糖尿病或其他需要应急预案的疾病，应请相应团队制作个人行动计划。本书可以帮助检查计划是否好找、是否有人会执行，却不替代具体疾病的处方和急救教学。\u003c/p\u003e\n\u003ch3 id=\"c01-s004\"\u003e一·五　共用协议B：每天反复使用，只在此处完整展开\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开共用协议B：适用于能参与日常安排的人；婴儿与特殊疾病使用相应分龄版本\u003c/summary\u003e\n\u003cp\u003e晨间先确认今天的功能状态：能否安全起身，是否有明显的新症状，是否已经知道必须执行的治疗或照护。随后完成与个人能力匹配的清洁、口腔护理、进食和必要用药。不要为了晨间仪式一次增加很多产品；有处方时间要求时，围绕处方安排，而非让处方迁就网红作息。\u003c/p\u003e\n\u003cp\u003e白天安排身体活动与姿势变化，工作、学习、家务和交通一起计入总负荷。用能持续的方式接触日间环境、完成生活任务、与至少一个合适的人保持沟通。活动方式不局限于步行：轮椅推动、上肢活动、康复练习或协助下的转移，都可以是个体计划的一部分。\u003c/p\u003e\n\u003cp\u003e进食时先满足安全、足量、可获取和基本多样性，再考虑精细优化。饮水围绕实际需要、环境和医疗限制，不用统一的超大量灌水挑战。存在吞咽困难、心肾疾病、婴幼儿喂养问题时，采用专业方案，不套成人日常常识。\u003c/p\u003e\n\u003cp\u003e晚间完成必要口腔与身体清洁，把次日最容易遗漏的事项放到可以看见的位置，留出结束工作的边界。睡眠需求按年龄参考，睡眠安排应兼顾机会、规律和白天功能；不把可穿戴设备的单项评分当作最终裁判。\u003ca href=\"#s05\"\u003eS05\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e每日只做简短复盘：今天最需要处理的异常是什么；哪件事顺利到可以继续；明天需要取消、调整或求助什么。没有新问题时，允许不写长日记。完成基础照护后，娱乐、休息和无目的的体验都可以是合理选择。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c01-s005\"\u003e一·六　共用协议W：每周维护，而不是每天重新研究人生\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开共用协议W：每周一次的系统维护\u003c/summary\u003e\n\u003cp\u003e先看下一周的不可移动事项：诊疗、考试、出差、照护交接、工作截止日期。再放入基础生活和恢复，最后才加入新增目标。若总量超出可用时间，先删掉低价值承诺，而不是默默削掉睡眠或让某位家人无偿承接。\u003c/p\u003e\n\u003cp\u003e检查家庭供给：基本食材是否足够，个人处方是否接近用完，交通和接送是否已安排，必要器具能否正常使用。把需要他人配合的事提前确认，不把一周中的每一天都变成临时求救。\u003c/p\u003e\n\u003cp\u003e选一个值得改善的摩擦点。例如洗漱用品摆放不便、晚餐决定耗时、孩子作业通知散乱、老人外出路线没有休息点。只改一个具体接口，并在下一周判断是否真的减少了问题。不要每周重新更换整套生活系统。\u003c/p\u003e\n\u003cp\u003e保留一个关系窗口和一个不以产出为目的的空白窗口。前者可以是认真听一个人说话，后者可以是散步、看天、音乐、游戏或什么也不做。它们不是必须被量化的治疗，而是本书对可持续生活的编排建议。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c01-s006\"\u003e一·七　共用协议E：事件发生时，哪些事暂停\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开共用协议E：疾病、旅行、照护中断和危机的覆盖顺序\u003c/summary\u003e\n\u003cp\u003e出现急迫危险时，暂停普通日程，启动安全分流。出现非紧急但影响功能的新症状时，减少可推迟的负荷，记录关键信息并安排适当评估。已经有医生提供的疾病行动计划时，优先使用该计划。\u003c/p\u003e\n\u003cp\u003e出差或旅行时，保留必要药物、睡眠机会、食物与水的安全、交通与紧急联系；训练形式可以改变，非必要补充剂可以先向专业人员核对是否需要携带。不要把旅途当成必须维持所有平时数字的考试。\u003c/p\u003e\n\u003cp\u003e照护者暂时失能时，首先分配依赖照护者的吃、喝、药物、转移、安全与沟通，再处理家务和工作。接替者需要的是具体交接，不是“按照平时来”。家庭危机时，降低目标数量，但不要隔绝所有求助渠道。\u003c/p\u003e\n\u003cp\u003e恢复后从当前能力重新进入计划，不按旧计划“补课”。错过的运动、学习和社交不需要在下一天翻倍完成；需要补做的疫苗、复查、药物或医疗事项则按专业安排处理，不自行加倍。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c01-s007\"\u003e一·八　证据的三个误读：平均值、相关性和替代指标\u003c/h3\u003e\n\u003cp\u003e一个群体平均有益的做法，并不代表每个人都从同一剂量获得同样收益。把统计建议落到个人时，要考虑基础状态、疾病、能力、偏好和代价。年龄范围用于提示关注，不是要求在范围边缘突然改变全部行为。\u003c/p\u003e\n\u003cp\u003e两个现象一起出现，不一定说明一个造成另一个。经常运动的人可能还拥有更安全的社区、更稳定的收入和更多支持。对个人行动而言，不需要因此否定运动，但不能把每一种观察性关联都转译成确定的因果承诺，更不能随手宣称“这一动作能多活多少年”。\u003c/p\u003e\n\u003cp\u003e体重、步数、睡眠评分、化验结果和生物年龄都只是部分窗口。它们可以有用，却不是完整的人。一个人为了体重下降而丢失力量、为了步数达标而冒险夜行、为了睡眠评分而越躺越焦虑，说明代理指标正在压过真实目标。每个指标都应有配套的功能检查与停止条件。\u003c/p\u003e\n\u003ch3 id=\"c01-s008\"\u003e一·九　购买健康产品之前的九格审查\u003c/h3\u003e\n\u003cp\u003e先写下要解决的问题，是缺乏、症状、疾病风险还是外观愿望；再写明当前最可能的原因，不知道就保留不知道。之后核对产品究竟改变什么，是改善临床结局、缓解症状、改变化验指标，还是仅有机制推测。广告中的“支持”“促进”“焕活”不能自动翻译成可验证的收益。\u003c/p\u003e\n\u003cp\u003e接着问剂量、适用人群、研究产品与售卖产品是否一致，是否有与现有药物相互作用的可能，是否需要专业监测。补充剂的证据强弱差异很大，孕妇、哺乳期、儿童和准备手术的人尤其不能把“天然”理解为已证实安全。\u003ca href=\"#s38\"\u003eS38\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e最后问三件交易层面的事：总成本是什么；多久后能判断是否值得继续；停止后会发生什么。如果一个产品要求无限期坚持，却不允许定义失败标准，就无法形成清楚的决策闭环。即使价格负担得起，注意力和日常维护也不是免费的。\u003c/p\u003e\n\u003ch3 id=\"c01-s009\"\u003e一·十　不要把照护权变成支配权\u003c/h3\u003e\n\u003cp\u003e需要协助的人仍然有偏好。帮助洗澡前说明下一步，协助进食前询问口味和节奏，讨论治疗时尽可能让本人参与，替人处理事务时保留解释和选择。便利不应成为无条件剥夺决定权的理由。\u003c/p\u003e\n\u003cp\u003e儿童的自主权随理解与能力增加，成人的自主权不会只因年龄增加就归零。不能因为有人记性下降，便把他所有财务、社交和身体选择一次性收走；也不能因为孩子表达不够成熟，就忽视他对疼痛、恐惧或不舒服接触的报告。具体的法律代理和医疗决定权限要按所在地要求核对。\u003c/p\u003e\n\u003cp\u003e如果照护中出现羞辱、恐吓、限制必要食物、无故阻断求助或强迫不必要接触，应当把它视为需要处理的安全问题，而不是“家事不方便说”。寻求可信赖的医疗、社会服务或当地保护渠道，是维护身体安全的一部分。\u003c/p\u003e\n\u003ch3 id=\"c01-s010\"\u003e一·十一　安全余量从哪里来\u003c/h3\u003e\n\u003cp\u003e安全余量不是把所有风险消灭，而是避免每个环节都刚好卡在极限。时间上，重要出行不把路线安排到毫无缓冲；财物上，必要生活和应急资源不全押在一个不确定结果上；体力上，活动结束仍保留回家、洗澡、进食和照护所需的能力；关系上，不让所有求助都依赖同一个永远不能倒下的人。\u003c/p\u003e\n\u003cp\u003e检查余量时，可以问一个简单问题：如果今天一个人、一件设备或一个交通环节失效，最重要的生活功能还能不能继续？不能继续的地方，就是优先建设替补的地方。替补可以是一把备用钥匙、一个可靠联系人、一份纸质药单，也可以是把不必要的承诺删掉。\u003c/p\u003e\n\u003cp\u003e本卷的全部设计最终只服务一件事：让平稳的日子更省力，让不平稳的日子不至于因为混乱而变得更危险。它不要求你每天担忧风险，而是让风险有了明确入口以后，可以把更多注意力用于真正想过的生活。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c01-s000","title":"一·一　安全不是每天害怕，而是提前决定少数关键动作"},{"id":"c01-s001","title":"一·二　全龄紧急覆盖规则"},{"id":"c01-s002","title":"一·三　婴儿与孕产期有更低的求助门槛"},{"id":"c01-s003","title":"一·四　把急救知识放在真正能用的地方"},{"id":"c01-s004","title":"一·五　共用协议B：每天反复使用，只在此处完整展开"},{"id":"c01-s005","title":"一·六　共用协议W：每周维护，而不是每天重新研究人生"},{"id":"c01-s006","title":"一·七　共用协议E：事件发生时，哪些事暂停"},{"id":"c01-s007","title":"一·八　证据的三个误读：平均值、相关性和替代指标"},{"id":"c01-s008","title":"一·九　购买健康产品之前的九格审查"},{"id":"c01-s009","title":"一·十　不要把照护权变成支配权"},{"id":"c01-s010","title":"一·十一　安全余量从哪里来"}]},{"id":2,"title":"卷二　受精至孕十二周：先建设承载生命的环境","html":"\u003ch2\u003e卷二　受精至孕十二周：先建设承载生命的环境\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c02\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c02-s000\"\u003e2.0　受精前的准备入口\u003c/h3\u003e\n\u003cp\u003e叙事从受精开始，但有些准备必须在受精前完成。对可能怀孕的一般风险人群，CDC建议每日摄入四百微克叶酸；计划怀孕时至少提前一个月开始，并在妊娠中继续。既往神经管缺陷相关妊娠及其他高风险情况应提前确定个人剂量，不自行用多种复合维生素拼出高剂量。\u003ca href=\"#s03\"\u003eS03\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e准备就诊时，双方整理已有疾病、处方与补充剂、既往妊娠结果、接种记录及重要家族史。已怀孕才打开本书，也应从现在补齐信息，不用没有提前准备推断结局。药物调整、接种适用性与遗传咨询由相应专业人员负责；核对清单与交付要求见\u003ca href=\"#r31-preconception\"\u003e受精前行动卡\u003c/a\u003e。\u003c/p\u003e\n\u003ch3 id=\"c02-s001\"\u003e2.1　此时谁是行动者\u003c/h3\u003e\n\u003cp\u003e受精卵不会执行训练计划。这个阶段所有“今天应该做什么”，行动者都是孕育者、共同养育者、医疗团队与生活环境的管理者。把孕育者当作需要被优化的容器，会同时伤害其自主权与照护质量。因此，本卷每项决定都以孕育者知情同意为前提；伴侣的责任是分担成本，而不是监视饮食、情绪和体重。\u003c/p\u003e\n\u003cp\u003e本书所说“受精第一天”，只是生命时间线的起点，不是说每个人都能知道受精的准确日期。排卵试纸、同房日期和手机预测不能把误差消除；辅助生殖也有自己的计时方式。临床孕周通常从末次月经起算，再结合超声等资料校正，不能把本书的受精日直接填写为医院的孕周。\u003ca href=\"#s41\"\u003eS41\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这里最有价值的行动，大多很朴素：建立医疗联系，核对药物，降低明确暴露，保证获得食物与休息，预留应急交通，处理家庭中的不安全因素。没有必要把胎儿当作需要按天升级的学习设备；不必给腹部放音箱、购买“脑开发套餐”或追逐每天的细胞变化来指导饮食。\u003c/p\u003e\n\u003ch3 id=\"c02-s002\"\u003e2.2　受精日及随后几天：不要制造可控制一切的幻觉\u003c/h3\u003e\n\u003cp\u003e**受精日。**通常本人尚不知情。如果正在备孕，沿用已经确认安全的生活与用药计划即可。没有一个需要在受精后若干小时内抓住的健身、食补或姿势窗口。共同养育者此时能做的，是把未来两周的高风险饮酒场合、接触有害物质的工作和不必要的熬夜安排调整掉，而不是要求孕育者停止正常生活。\u003c/p\u003e\n\u003cp\u003e**受精后第一至第三天。**把“可能怀孕”作为用药咨询时需要说明的信息；必要治疗不要因为害怕而自行停掉。整理药盒中的处方药、非处方药、草药、保健品、外用药和长期使用的吸入剂，拍摄正反面标签。需要记录的是有效成分与剂量，不只是商品名。由专业人员判断保留、替换或停用，远比搜集“孕妇禁用药大全”可靠。\u003c/p\u003e\n\u003cp\u003e**受精后第四至第七天。**可把家庭安全检查安排在这个区间，但这是编排建议，不代表生物学在这一天要求检查。检查烟雾和一氧化碳报警器、燃气设备、通风、厨房生熟分区、清洁剂存放与急诊路线。高处擦窗、搬重物、强刺激清洁等任务交给有条件的其他人或专业服务；不要同时要求孕育者负责发现问题、购买用品和监督整改。\u003c/p\u003e\n\u003cp\u003e**受精后第八至第十四天。**等待可能带来反复测量与搜索冲动。给信息搜集设定一个容器：把问题记在同一个清单，集中向专业人员求证。单次身体感觉不能证明着床，试纸颜色也不是可供家庭独立判断胚胎发育的精密仪表。出现疼痛、出血或其他担忧时，按症状与医疗建议行动，而不是靠反复比较照片安慰自己。\u003c/p\u003e\n\u003cp\u003e上述区间中的细胞分裂、迁移和着床并非每个人严格同日发生。这里不提供“第六天必须吃什么帮助着床”一类伪精确任务。\u003ca href=\"#s41\"\u003eS41\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c02-s003\"\u003e2.3　首次发现怀孕的当天\u003c/h3\u003e\n\u003cp\u003e先解决三个问题：本人是否安全；医疗联系在哪里；已经在用的东西是什么。记录末次月经、检测日期、症状、既往妊娠情况以及重要疾病。联系当地正规的孕产服务，说明慢性病、既往宫外孕、近期出血或疼痛、辅助生殖等情况，让对方决定何时面诊。早发现并不等于必须同一天完成所有抽血与影像检查，也不等于“尚未看见某个结构就一定异常”。\u003c/p\u003e\n\u003cp\u003e把当前药物清单发给产科及原治疗医生协调。甲状腺病、糖尿病、癫痫、高血压、精神疾病等人群尤其需要连续治疗安排；本书不提供统一调整比例。向医生问清四句话：“目前哪些必须继续？哪些需要尽快评估？什么时候复查？什么症状需要提前联系？”不要以“孕妇不能吃药”取代风险比较。\u003c/p\u003e\n\u003cp\u003e一般风险人群的叶酸基础建议可参考每日四百微克叶酸；有神经管缺陷相关病史或其他高风险情况，剂量由医生另定。要核对复合维生素是否已经含有叶酸，避免把多个品牌叠加成自己也算不清的总量。单位中毫克与微克相差一千倍，抄写时必须保留单位。\u003ca href=\"#s03\"\u003eS03\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e生活方面，先撤掉酒精暴露，并将吸烟、二手烟和其他物质使用如实告诉医疗人员。咖啡因要合计咖啡、茶、能量饮料、巧克力与部分药品，而不是只数咖啡杯。NHS给出的孕期上限参考为每日二百毫克咖啡因；杯型与冲泡浓度差异很大，不能把“一杯”当成固定剂量。\u003ca href=\"#s08\"\u003eS08\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c02-s004\"\u003e2.4　临床孕四至六周：把不确定性装进计划\u003c/h3\u003e\n\u003cp\u003e这一阶段的家庭任务是建立一页孕期档案。档案包含联系人、就诊机构、预产期及其确定方式、过敏史、既往妊娠与手术、正在使用的药物、医生给出的复查日期。把“尚未确定”明确标出来，胜过填入一个看起来完整但来源不明的数值。\u003c/p\u003e\n\u003cp\u003e安排家务时，不问“还能不能做”，而问“做这件事的负担是否值得由她承担”。例如日常做饭可以保留，但闻到油烟就恶心的人不必证明自己坚强；可换成由伴侣备餐、购买卫生可靠的熟食、减少复杂烹饪。照护者提供两三个可接受的选择，不进行“为了孩子你必须吃”的说服。\u003c/p\u003e\n\u003cp\u003e如果出现单侧下腹痛、肩尖痛、头晕欲晕或出血，尤其伴明显疼痛，应及时获得医疗评估；严重疼痛、晕厥或循环不稳是急症。不要因为已经测到阳性，就自行认定妊娠位于宫内。\u003ca href=\"#s27\"\u003eS27\u003c/a\u003e 本卷不让读者在家区分所有原因，而让读者知道何时不该继续观察。\u003c/p\u003e\n\u003cp\u003e安排等待期时，把“下一次检查要回答什么”写下来。例如是确认位置、复核孕周、评估症状，还是讨论某种筛查。若答案只是“想再安心一次”，也可以坦诚提出，但需要理解额外检查可能产生新的不确定结果。\u003c/p\u003e\n\u003ch3 id=\"c02-s005\"\u003e2.5　临床孕七至八周：建立可吃、可睡、可工作的一天\u003c/h3\u003e\n\u003cp\u003e每日计划从当前耐受度开始。起床后先判断是否能正常饮水进食、能否完成基本活动、是否出现新危险信号。没有异常时，再选择当日工作量。不要把此前运动水平与工作效率当作这个时期必须维持的基准。\u003c/p\u003e\n\u003cp\u003e进食困难时，可以把一大顿拆成自己更能接受的几次，优先解决可入口和食物安全。记录真正引起恶心的气味、温度、质地，减少家庭反复猜测。若持续呕吐，明显喝不进去、尿量下降、头晕或体重持续下降，应联系医疗人员，不要只靠姜糖或硬撑解决。\u003ca href=\"#s10\"\u003eS10\u003c/a\u003e 药物止吐是否合适由医生判断，不能因为“天然”二字就忽略草药的成分与剂量。\u003c/p\u003e\n\u003cp\u003e睡眠安排要允许补偿现实负担，但不把床变成全天的信息焦虑中心。需要休息时关闭工作提醒；清醒且感觉可以活动时，安排轻量走动、洗漱和短暂户外活动。这里的目标是舒适和功能，而不是用步数证明妊娠稳定。已有运动习惯的人应根据产科建议调整，避免突然开始不熟悉的高强度、碰撞或高跌落风险活动。\u003ca href=\"#s09\"\u003eS09\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e工作场景增加一次“暴露盘点”：是否涉及溶剂、重金属、放射线、感染、极端温度、夜班、长期站立或体力搬运。向职业健康或产科提供具体岗位与材料名称，不用“工作有点累”概括所有风险。任务调整应尽量通过制度完成，而不是让同事私下承担长期不明责任。\u003c/p\u003e\n\u003ch3 id=\"c02-s006\"\u003e2.6　临床孕九至十周：为筛查作决定，而不是被套餐牵着走\u003c/h3\u003e\n\u003cp\u003e筛查的作用是估计某些情况的风险，诊断检查则试图确认特定问题。二者不能混同；筛查阴性不能承诺所有方面正常，筛查阳性也不等于确诊。需要做决定时，请医疗团队解释：查什么、不查什么、假阳性或不确定结果之后怎么办、进一步检查有什么代价、结果是否会改变照护。\u003c/p\u003e\n\u003cp\u003e这里不提供面向所有国家和所有风险人群的统一检查购物车。年龄、病史、超声结果、当地技术、费用与个人价值会改变选择。普通商业宣传中的“更全面”并不自动等于净收益更大；额外检查可能同时增加偶然发现和需要解释的灰区。\u003c/p\u003e\n\u003cp\u003e给信息处理留出私人空间。某些检查涉及妊娠选择、遗传信息和家庭意见，应优先听取孕育者本人的意愿，而不是在家庭群里先投票。可以带支持者，但允许单独与医护交流。把“我还没理解，需要再解释”当成正常权利。\u003c/p\u003e\n\u003cp\u003e此时共同养育者可以整理工作交接、育儿假、医保与费用渠道，先核对本地现行规则，再计算家庭现金流。不要把本书写作年份的规定当作未来每个读者的待遇。预算至少区分医疗、交通、生活协助和出生后照护，不只购买婴儿用品。\u003c/p\u003e\n\u003ch3 id=\"c02-s007\"\u003e2.7　临床孕十一至十二周：把检查结果转化为下一步\u003c/h3\u003e\n\u003cp\u003e不同地区有不同筛查路径。以NHS公开路径为例，早孕超声及部分染色体相关筛查常在十一至十四周窗口讨论；这只是地区示例，不是要求其他地区照搬。\u003ca href=\"#s11\"\u003eS11\u003c/a\u003e 真正需要带走的是：孕周是否调整、结果是什么、是否需转诊、下一次何时来、出现哪些症状提前联系。\u003c/p\u003e\n\u003cp\u003e每拿到一份报告，做一个三行摘要：“已经确认的事实；仍不确定的事情；明确的下一步。”不要把全部检验数值逐项贴到搜索引擎，再由最吓人的解释决定情绪。报告有异常标记但医生未解释时，可以追问其临床意义；没有异常标记但症状明显时，也应继续表达。\u003c/p\u003e\n\u003cp\u003e家务、工作和运动的调整在本周做一次复盘。哪些帮助真正减轻了负担？哪些“照顾”反而造成监督感？把同一句建议反复提醒十遍，通常不能替代一次实际分担。将固定任务直接移交：采购、清洁、预约交通、联系长辈、照顾其他孩子与宠物。\u003c/p\u003e\n\u003ch3 id=\"c02-s008\"\u003e2.8　环境与感染：抓住具体路径，不制造全面恐惧\u003c/h3\u003e\n\u003cp\u003e厨房重点是生熟分开、彻底加热、清洁双手与器具、避免未经巴氏消毒的高风险食品，并核对当地对鱼类汞污染的建议。某一国家对特定认证鸡蛋的例外，不应搬到来源不明的鸡蛋上。\u003ca href=\"#s08\"\u003eS08\u003c/a\u003e 外出吃饭可以询问食材与做法，不必把所有外食一概归为危险。\u003c/p\u003e\n\u003cp\u003e弓形虫预防应关注未熟肉类、被污染的土壤与猫粪，而不是把“摸过猫”直接等同感染。可由其他人处理猫砂；必须自己处理时使用手套、随后洗手，园艺同理。不要给宠物喂生肉。是否检查及如何解释结果，应结合当地孕期路径、具体暴露与医生意见；单纯养猫不是自动进行一串重复化验的充分理由。\u003ca href=\"#s42\"\u003eS42\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e清洁不是灭菌竞赛。把清洁剂按标签使用、避免混合、保证通风，比增加香味和消毒频率更重要。需要装修、除虫或处理霉变时，应说明家中有孕妇并选择合适的专业方案；不要让孕育者近距离闻一闻来判断“有没有毒”。\u003c/p\u003e\n\u003cp\u003e对发热、传染病接触、旅行或职业暴露，记录时间、地点、对方确诊情况和自己症状，交给医疗人员判断。不要自行把所有接触归为胎儿损伤，也不要因没有症状就认定无需咨询。\u003c/p\u003e\n\u003ch3 id=\"c02-s009\"\u003e2.9　早孕的心理与关系任务\u003c/h3\u003e\n\u003cp\u003e怀孕可以同时带来喜悦、担心、犹豫、遗憾或麻木，不需要演出单一情绪。伴侣可问：“今天你更需要我听你说、替你做事，还是一起找答案？”不要把每次哭泣都解释成激素，更不要把正常分歧变成“影响孩子”的道德指控。\u003c/p\u003e\n\u003cp\u003e有既往流产或创伤经历时，某些日期、检查室和身体感觉可能格外困难。可以事先告知医护，商定检查时是否需要解释过程、是否让陪伴者在场。家庭可以保留希望，也允许不确定；不要承诺“这次一定没问题”。\u003c/p\u003e\n\u003cp\u003e若出现持续无法生活的焦虑、明显抑郁、自伤念头或感到不安全，应及时寻求专业帮助；出现紧迫伤害风险，进入急症处理。把求助列为照护的一部分，而不是个人意志失败。关于心理危机的详细路径见卷二十二。\u003c/p\u003e\n\u003ch3 id=\"c02-s010\"\u003e2.10　本阶段每日卡与退出条件\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开：孕早期每日卡——只保留当天有变化的信息\u003c/summary\u003e\n\u003cp\u003e晨间先确认能否进水进食、是否有新症状以及今天的主要负担。按已经确认的医嘱用药与补充叶酸，查看当天是否有预约。没有预约不需要为了“做点什么”自行增加检查。\u003c/p\u003e\n\u003cp\u003e白天把饮食、休息与活动按耐受度分散安排；共同养育者承担一项完整家务链。工作中的暴露或不适要记录具体情境。必要的信息搜索集中进行，避免每次身体感觉都触发长时间浏览。\u003c/p\u003e\n\u003cp\u003e晚间只记录真正改变下一步的事项：症状加重、药物变化、检查结论、未解决的问题。为次日准备食物与交通，不做胚胎表现评分。睡前保留与怀孕无关的谈话或愉快活动。\u003c/p\u003e\n\u003cp\u003e危险信号、持续不能进食饮水、医生要求的紧急复查，立即覆盖本卡。妊娠结束、治疗方案变化或进入新的风险路径时，停止沿用旧计划，与医疗团队重新建立适用的照护方案。\u003c/p\u003e\n\u003c/details\u003e\n\u003cp\u003e本卷要保留的不是完美控制，而是可用的支持：有人知道情况，有人承担事务，有可靠医疗入口，有权改变计划。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c02-s000","title":"2.0　受精前的准备入口"},{"id":"c02-s001","title":"2.1　此时谁是行动者"},{"id":"c02-s002","title":"2.2　受精日及随后几天：不要制造可控制一切的幻觉"},{"id":"c02-s003","title":"2.3　首次发现怀孕的当天"},{"id":"c02-s004","title":"2.4　临床孕四至六周：把不确定性装进计划"},{"id":"c02-s005","title":"2.5　临床孕七至八周：建立可吃、可睡、可工作的一天"},{"id":"c02-s006","title":"2.6　临床孕九至十周：为筛查作决定，而不是被套餐牵着走"},{"id":"c02-s007","title":"2.7　临床孕十一至十二周：把检查结果转化为下一步"},{"id":"c02-s008","title":"2.8　环境与感染：抓住具体路径，不制造全面恐惧"},{"id":"c02-s009","title":"2.9　早孕的心理与关系任务"},{"id":"c02-s010","title":"2.10　本阶段每日卡与退出条件"}]},{"id":3,"title":"卷三　孕十三周至出生：把准备变成可运行的照护","html":"\u003ch2\u003e卷三　孕十三周至出生：把准备变成可运行的照护\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c03\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**产检结果要传到接生与新生儿团队。**例如妊娠中的乙肝表面抗原结果，不应只留在产检报告里；HBsAg阳性者的新生儿有出生时限明确的暴露后预防要求。孕期确认结果、分娩前交接、出生时完成处置、随后随访，是同一条任务链，见\u003ca href=\"#r31-hbv-birth\"\u003e围产期乙肝衔接\u003c/a\u003e。\u003c/p\u003e\n\u003ch3 id=\"c03-s000\"\u003e3.1　逐周目录怎样变成每天的安排\u003c/h3\u003e\n\u003cp\u003e本卷周序是家庭准备工作的编排，不是胎儿的每日训练表。医疗安排由实际孕周、病史、症状与当地路径决定。每一周第一次阅读新增任务，接下来确认负责人、准备资源、完成行动，余下日子沿用孕期日常卡。任务已经完成就不再重复；不适用就明确跳过；出现危险信号时退出普通日程。\u003c/p\u003e\n\u003cp\u003e不能把任何一次没有完成的家务、情绪波动或食物选择解释为胚胎发育的原因。孕育者不是要接受连续九个月的生活审计。共同养育者的责任，是接手真实事务、支持医疗决定和保护休息，而不是对每口食物发表评论。\u003c/p\u003e\n\u003ch3 id=\"c03-s001\"\u003e3.2　十三至二十周：让信息有入口、有出口\u003c/h3\u003e\n\u003cp\u003e**十三周，整理信息渠道。**保留正规产科联系、一个可靠资料入口和一份共享档案。把预约写进日历，注明交通、请假、需要携带的材料及检查要回答的问题。退出只制造恐惧、不提供证据和行动的讨论。信息进入后必须有去处：已解决、待问医生、需要行动，不能全部停留在收藏夹。\u003c/p\u003e\n\u003cp\u003e**十四周，检查饮食是否真的可持续。**盘点一周能买到、做得出、吃得下的基本食物，考虑气味、温度、胃口与预算。共同养育者负责采购和清洁整条任务链。持续吃不下或饮食种类极少时寻求专业支持，不用“为了孩子必须吃”替代帮助。\u003c/p\u003e\n\u003cp\u003e**十五周，调整工作条件。**把少加班改成可执行安排，例如减少非必要晚间会议、增加可坐下的工作段、明确急事接手人。职业暴露需要提供具体材料与操作，不只说工作很累。无法自行调整时向职业健康、产科和适用的工作支持渠道咨询。\u003c/p\u003e\n\u003cp\u003e**十六周，关闭前期结果。**每项检查都确认是否已解释、是否需复查、由谁负责。转诊不等于写在纸上就完成，需要知道对方是否收到材料、何时联系、等待期间怎样处理。结果不明确时允许询问，不靠搜索引擎中最吓人的解释作决定。\u003c/p\u003e\n\u003cp\u003e**十七周，检查居家路线。**沿起床、如厕、洗澡、做饭的实际路线看照明、湿滑、杂物和高处取物。优先移走反复造成负担的障碍，不以准备婴儿为由临时开启大规模装修。本人试用改动，确认真的更方便，而不是只符合家人的想象。\u003c/p\u003e\n\u003cp\u003e**十八周，准备结构筛查的问题。**问清检查观察什么、不能排除什么、显示不清时怎样补查。NHS的中孕结构超声通常安排在十八至二十一周，这是地区路径示例，不是其他地区必须照搬的时间表。\u003ca href=\"#s11\"\u003eS11\u003c/a\u003e 影像照片是否漂亮不是医学检查质量标准。\u003c/p\u003e\n\u003cp\u003e**十九周，保留连接，不制造胎教考核。**可以说话、唱歌或温柔触摸腹部，前提是孕育者舒适。这些活动用于关系和体验，不承诺提高智力。不要把高音量设备贴在腹部，也不要根据是否回应某段音乐给胎儿打分。\u003c/p\u003e\n\u003cp\u003e**二十周，重排出生预算。**将采购分为安全必需、近期会用、可借用、可延后。婴儿睡眠和交通安全优先于装饰；照护者的餐食、替班、交通与休息也必须占有预算。买了满屋用品却没有一个人能接班，不是完整准备。\u003c/p\u003e\n\u003ch3 id=\"c03-s002\"\u003e3.3　二十一至二十八周：把第二条照护路径建立起来\u003c/h3\u003e\n\u003cp\u003e**二十一周，让另一位照护者完整接手一项任务。**从发现需要、购买、整理到补充，都由同一责任人负责。主要照护者不必继续做后台管理。没有伴侣时寻找亲友、社区或正规服务，目标是可用支持，不是限定家庭形式。\u003c/p\u003e\n\u003cp\u003e**二十二周，整理重要家族史。**记录明确诊断、亲属关系和大致发病年龄。只收集会改变医疗判断的信息，未知保持未知。亲戚的一句猜测不能直接写成遗传病史；必要时通过本人同意获取相关医疗资料。\u003c/p\u003e\n\u003cp\u003e**二十三周，核对接种。**带既往疫苗记录向当地团队询问孕期与产后适用项目、时机和禁忌。不能把所有疫苗一律推迟，也不能照抄其他国家的项目；地区流行情况与现行政策会变化。\u003ca href=\"#s46\"\u003eS46\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**二十四周，确认代谢检查是否到期。**了解检查前要求、异常后谁跟进、是否需要营养支持。不要为取得正常结果临时极端节食。NHS对较高风险人群的妊娠糖尿病检测常在二十四至二十八周进行，个人安排仍以本地团队为准。\u003ca href=\"#s11\"\u003eS11\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**二十五周，明确胎动变化的联系方法。**了解本人感受到的活动模式，并询问团队建议。明显减少或改变时及时联系产科，不用家用多普勒偶尔听到声音来排除风险，也没有适用于所有胎儿的单一正常次数。\u003ca href=\"#s10\"\u003eS10\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**二十六周，练习出生后的基础操作。**实际照护者分别布置一次安全婴儿床，练习抱持、换尿布和交接。可以用模型，不必提前增加用品。每人都应理解睡眠时为什么要清空床面，具体协议在卷四，只需学习一次并持续执行。\u003c/p\u003e\n\u003cp\u003e**二十七周，写一页分娩偏好。**包括陪伴者、沟通方式、镇痛意愿、隐私、可能触发恐惧的情境和需要的支持。它是沟通工具，不是保证产程不改变的合同。可以写明希望在条件允许时解释操作，也明确自己可以改变主意。\u003c/p\u003e\n\u003cp\u003e**二十八周，测试夜间联络。**备用交通、医院入口、资料、钥匙和其他被照护者的安顿都要可用。不能让一人负责接二十通电话才启动全家。最简单的可运行路径，通常优于精美但依赖太多临时协调的计划。\u003c/p\u003e\n\u003ch3 id=\"c03-s003\"\u003e3.4　二十九至三十六周：准备分娩，也准备分娩之后\u003c/h3\u003e\n\u003cp\u003e**二十九周，了解镇痛。**询问机构提供什么、可能何时使用、效果不足怎么办、哪些个人情况需要提前讨论。呼吸和陪伴可以支持，但不能成为拒绝医学镇痛的理由；选择也可以在产程中改变。\u003ca href=\"#s43\"\u003eS43\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**三十周，安排出院第一周。**明确餐食、用品清洁、来访管理、婴儿复查与其他孩子照护的责任人。产妇不应同时负责恢复、喂养、接待和家务项目管理。把不重要的事务正式取消，而不是口头说可以休息却仍留下任务。\u003c/p\u003e\n\u003cp\u003e**三十一周，检查设备。**核对婴儿床、出行座椅的适用范围、结构和说明书。二手物品也要确认来源与状态；不知道型号和使用历史的安全设备，不因免费就自动合格。不要用成人经验替代产品安装与安全要求。\u003c/p\u003e\n\u003cp\u003e**三十二周，练习一分钟医疗表达。**孕周、主要症状、开始时间、变化、重要病史和用药依次说清。语言或听力有障碍时准备适合的沟通支持。练习的目的不是自行诊断，而是在紧张时仍能提供关键信息。\u003c/p\u003e\n\u003cp\u003e**三十三周，提前说清来访规则。**患病不来、先洗手、不要擅自亲吻婴儿口鼻、拍照与发布需要同意、来访应预约。由共同养育者负责对外说明，不把拒绝亲友的压力全部留给产后疲惫的人。\u003c/p\u003e\n\u003cp\u003e**三十四周，核实行政材料。**入院、保险、出生登记和儿童建档要求按本地现行制度核对。只提供必要个人信息，不将完整证件在无关群中流转。特殊监护或法律身份情况提前咨询正规机构，避免临场猜测。\u003c/p\u003e\n\u003cp\u003e**三十五周，确认孕晚期项目。**询问当地是否安排相关感染筛查、胎位或其他复查，结果怎样影响分娩。不要因为别人做过就自行追加，也不因为自己没有症状就取消医生依据病史提出的项目。\u003c/p\u003e\n\u003cp\u003e**三十六周，做一次现实演练。**模拟拿资料、出门、乘车、入院和安顿家中事务。发现缺口后只修实际问题，不不断添加物品。若计划只有一个人知道，至少让备用支持者能够找到关键资料。\u003c/p\u003e\n\u003ch3 id=\"c03-s004\"\u003e3.5　三十七周至出生：等待也需要明确规则\u003c/h3\u003e\n\u003cp\u003e**三十七周，明确何时联系产科。**宫缩、破水、出血、胎动变化和本人特殊风险，需要团队给出适用规则。破水、阴道出血、胎动减少或未足月疑似临产时应及时联系；强烈即将娩出的感觉可能需要紧急帮助。\u003ca href=\"#s44\"\u003eS44\u003c/a\u003e 不只背网上统一口诀。\u003c/p\u003e\n\u003cp\u003e**三十八周，缩小不必要的安排。**可以继续适合的生活，但重要活动有交通和返回余地。每一天的主要事务最好能够取消或移交，不把已经预约视为必须完成的承诺。长途或特殊活动先核对医疗意见。\u003c/p\u003e\n\u003cp\u003e**三十九周，讨论超过预产期的路径。**理解等待、监测和引产等选项的适用条件及主要代价。不要自行用草药、蓖麻油、高强度活动或其他偏方催产，也不用是否自然发动衡量本人表现。\u003c/p\u003e\n\u003cp\u003e**四十周，更新支持而不是催促。**预产期是临床估计，不是交付违约日。减少每日追问怎么还没有生，改问需要什么具体帮助。出现新症状按计划联系，不因为快到预产期就全部归为正常。\u003c/p\u003e\n\u003cp\u003e**四十一周及之后，使用个体医疗计划。**明确下一次评估和分娩决策安排，不能从书中推导某天之前绝对安全或所有人必须同日引产。若在此前出生，立即切换实际出生后的方案；早产儿需要专门喂养、体温、呼吸与随访安排。\u003c/p\u003e\n\u003ch3 id=\"c03-s005\"\u003e3.6　分娩当日的决策质量\u003c/h3\u003e\n\u003cp\u003e陪伴者先听本人需要：水、安静、姿势、触摸、停止触摸或解释。不要把录像和亲友汇报放在主要位置。医疗操作在条件允许时说明目的、替代方案和重要风险；急症先救治，稳定后补充解释。本人不是一段产程的旁观者。\u003c/p\u003e\n\u003cp\u003e不同分娩方式不是道德等级。计划改变时先保证安全，不用早知道、你没有坚持等语言增加负担。镇痛、器械助产或剖宫产是否适用，由医学情况与知情选择共同决定，不能以一份理想剧本压过现实。\u003c/p\u003e\n\u003cp\u003e婴儿出生后的保暖、呼吸与整体评估由团队负责。肌肤接触和早期喂养要在母婴状态允许并获得正确观察时进行。产妇困倦、镇静或无法安全抱持时需要实际协助，不能把促进亲密当成无人看护的理由。\u003c/p\u003e\n\u003ch3 id=\"c03-s006\"\u003e3.7　产后零至六周：母亲也有独立照护单\u003c/h3\u003e\n\u003cp\u003e出院交接除了婴儿事项，还应包括产妇疼痛处理、伤口、出血、排尿排便、活动限制、药物和复查。危险信号调用安全卷。出院不等于已经恢复，身体不适也不能一律用坐月子正常来解释。\u003c/p\u003e\n\u003cp\u003e安排休息应覆盖完整任务链。有人喂养，有人准备餐食，有人清洗用品，有人处理访客，才可能形成真正休息；只说宝宝睡你就睡，却让所有家务继续等待产妇完成，并没有提供帮助。\u003c/p\u003e\n\u003cp\u003e恢复运动依分娩方式、症状与专业评估逐步推进。漏尿、明显坠胀、疼痛或活动后加重需要评估，不用大量盆底收缩练习包办所有问题。喂养方式也不决定母爱，困难时尽早获得有资质支持，目标是营养、安全和可持续。\u003c/p\u003e\n\u003cp\u003e持续明显低落、焦虑、绝望或无法正常生活需要专业帮助；幻觉、妄想、严重混乱或躁狂等产后表现可能是精神急症，不应等待自行恢复。\u003ca href=\"#s45\"\u003eS45\u003c/a\u003e 亲密接触以意愿、舒适、愈合与医疗建议为前提，讨论适合的避孕，不以月经是否回来作为唯一判断。\u003c/p\u003e\n\u003ch3 id=\"c03-s007\"\u003e3.8　第一次家庭复盘\u003c/h3\u003e\n\u003cp\u003e精力允许时进行短会，每人只说最难的时段、无人真正负责的任务、需要更改的规则和可以取消的事项。不要开成对奶量、体重和谁更辛苦的审判。记录一项改动并真实执行即可。\u003c/p\u003e\n\u003cp\u003e缺乏支持时，寻找社区、医疗、可信亲友或正规照护资源。帮助可以很小但应具体：送一顿饭、清洗一次用品、陪同复查或照顾另一个孩子。物资不是人手，建议不是替班。准备是否成功，要看出生后仍有没有余力和清楚的交接，而不是采购清单是否全部完成。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c03-s000","title":"3.1　逐周目录怎样变成每天的安排"},{"id":"c03-s001","title":"3.2　十三至二十周：让信息有入口、有出口"},{"id":"c03-s002","title":"3.3　二十一至二十八周：把第二条照护路径建立起来"},{"id":"c03-s003","title":"3.4　二十九至三十六周：准备分娩，也准备分娩之后"},{"id":"c03-s004","title":"3.5　三十七周至出生：等待也需要明确规则"},{"id":"c03-s005","title":"3.6　分娩当日的决策质量"},{"id":"c03-s006","title":"3.7　产后零至六周：母亲也有独立照护单"},{"id":"c03-s007","title":"3.8　第一次家庭复盘"}]},{"id":4,"title":"卷四　出生零至二十八天：营养、安全与可靠回应","html":"\u003ch2\u003e卷四　出生零至二十八天：营养、安全与可靠回应\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c04\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c04-s000\"\u003e4.1　适用范围与照护者责任\u003c/h3\u003e\n\u003cp\u003e本卷默认出院后情况稳定的足月新生儿。早产、低出生体重、呼吸支持、低血糖风险、吞咽或其他疾病，使用出院团队的个体计划。出生日期、出生孕周和矫正年龄用途不能混写，更不能只看应用显示的月龄决定喂养。\u003c/p\u003e\n\u003cp\u003e新生儿不需要像成人一样按办公钟切割时间。循环是获得食物、清洁、保暖、睡眠、短暂清醒与被回应。每次醒来不必变成课程，哭闹也不是操控成人的行为。照护者的工作是识别需要和异常，不是证明孩子已经能够独立。\u003c/p\u003e\n\u003ch3 id=\"c04-s001\"\u003e4.2　协议N：每轮照护的五个检查点\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开新生儿共用照护循环N\u003c/summary\u003e\n\u003cp\u003e接近前清洁双手，确认自己清醒、能够安全抱持；先观察呼吸、肤色、反应与整体状态。明显异常时停止普通循环，进入安全卷分流。\u003c/p\u003e\n\u003cp\u003e按已确认的方式喂养并回应饥饱信号。寻找、手到口边可能提示饥饿；转头、闭口可能提示饱足。哭闹往往已经较晚，但嗜睡无力也不能误认成乖或不饿。\u003ca href=\"#s51\"\u003eS51\u003c/a\u003e 是否唤醒、间隔上限和补充安排由个体情况决定。\u003c/p\u003e\n\u003cp\u003e清洁和检查尿布时先把用品放齐，始终防跌；不离开高台去拿东西。温和清洁，不在正常皮肤褶皱或身体开口进行不必要的深部处理。\u003c/p\u003e\n\u003cp\u003e状态合适时短暂面对面交流；出现疲倦就减少刺激，睡眠切换协议S。成人在旁不等于危险睡姿因此安全。\u003c/p\u003e\n\u003cp\u003e交接说明最近喂养、排泄、异常、药物和下一项必须完成的事。采用一份统一记录，避免两人分别凭记忆重复喂药。任何人都不得摇晃、抛接或击打婴儿。\u003ca href=\"#s52\"\u003eS52\u003c/a\u003e\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c04-s002\"\u003e4.3　协议S：安全睡眠完整规则\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开一岁内安全睡眠协议S\u003c/summary\u003e\n\u003cp\u003e每次入睡仰卧，使用适合婴儿、坚实平坦水平的独立睡眠表面，床面只保留合适床单。不放枕头、床围、玩具、定位器、松散被褥或加重睡眠用品。同室而不同床；成人床、沙发和扶手椅不能替代婴儿安全睡眠表面。\u003ca href=\"#s06\"\u003eS06\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e出行座椅用于交通，不是到家后继续睡眠的默认场所。可行时转移到适合的平坦表面，不抬高床垫处理普通吐奶，不以侧睡替代仰卧。\u003ca href=\"#s06\"\u003eS06\u003c/a\u003e\u003ca href=\"#s40\"\u003eS40\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e出现翻身尝试就停止束缚式襁褓。能够自行双向翻身后仍以仰卧开始睡眠，不必整夜反复翻回，但床面保持清空。特殊医学姿势只能由治疗团队明确指示。\u003ca href=\"#s40\"\u003eS40\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e照护者困倦时将婴儿放回安全独立床面，尤其避免抱着坐在沙发上睡着。事先准备替班人和放置位置，比要求永远保持警觉更现实。家用监测设备不能替代环境与姿势规则。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c04-s003\"\u003e4.4　出生当日：核对交接\u003c/h3\u003e\n\u003cp\u003e以下逐日标题是复核与学习的可选顺序，不是推迟必要照护的许可。安全睡眠从第一次睡眠生效，出院随访在离院前落实；适用的维生素D及短时清醒俯卧，不等第十一天或第十天才首次处理。不同出生处境以团队明确的时间表为准。\u003c/p\u003e\n\u003cp\u003e零日由团队完成出生适应与相关评估。核对身份、出生时间、孕周、体重和重要处置，问清是否需要额外观察。状态允许时肌肤接触和早期喂养，安全优先于照片和仪式。\u003c/p\u003e\n\u003cp\u003e确认当地维生素K预防、出生时接种和筛查安排。维生素K注射用于预防新生儿维生素K缺乏性出血，不是家长随意购买普通滴剂即可替代的项目。\u003ca href=\"#s47\"\u003eS47\u003c/a\u003e 哪些筛查还未出结果，要有后续取得和解释渠道。\u003c/p\u003e\n\u003cp\u003e在离院前明确下一次复查日期、地点、负责人和夜间异常联系渠道；未回报筛查标为“待结果”，不标为正常。母乳或混合喂养婴儿通常需在出生不久开始每日四百国际单位维生素D补充；明确产品浓度、实际每次用量和给药人。纯配方喂养者结合实际摄入与产品含量核定，不把某国的奶量门槛直接移用于所有品牌。\u003ca href=\"#s14\"\u003eS14\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e成人当天只需把明确计划带走，不必完成所有育儿知识学习。避免婴儿在不同亲友间频繁传递，尊重产妇休息。公开照片前考虑身份、地点、病史等隐私，不让分享成为必须完成的家庭任务。\u003c/p\u003e\n\u003ch3 id=\"c04-s004\"\u003e4.5　第一至第七天：每天新增一个可靠动作\u003c/h3\u003e\n\u003cp\u003e**第一天，观察整次喂养。**请合适人员看含接、吞咽或瓶喂过程，不能只问吃了多久。摄入评估要结合有效进食、排泄、体重与状态，不能用乳房软硬、泵出量或哭声大小单独判断。\u003c/p\u003e\n\u003cp\u003e**第二天，建立最低记录。**统一记录必要时间、方式、湿尿布、大便、异常和医疗要求。不同时启用多个应用。医生要求的特殊喂养安排优先于任何睡眠训练；不知道是否要叫醒时应问清，不套用睡多久都不要管。\u003c/p\u003e\n\u003cp\u003e**第三天，复核离院前已经落实的随访。**确认体重、黄疸、筛查结果和周末联系。待回报项目必须有人追踪。出院较早、喂养困难或其他风险可能需要更早复查，按团队安排，不以同龄孩子下次就诊日期替代。\u003c/p\u003e\n\u003cp\u003e**第四天，正确处理黄疸疑问。**照片与肉眼不能替代需要时的胆红素测量。出生首日黄疸、伴难唤醒或喂养差、深色尿或浅色便等应及时评估，不靠晒太阳、糖水或自行停母乳处理。\u003ca href=\"#s28\"\u003eS28\u003c/a\u003e\u003ca href=\"#s50\"\u003eS50\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**第五天，复核实际摄入趋势。**带有效记录了解排泄与体重是否符合个体预期。反复喂养失败、反应变差或尿量令人担忧，不等待日历上的复查。需要补充时明确内容、方法、复评时间，而不是无限临时追加。\u003c/p\u003e\n\u003cp\u003e**第六天，让第二照护者独立完成一轮。**从准备到安全放回床面全部接手，第一照护者真正休息。复盘只修安全与效果问题，不把个人手势偏好当唯一正确答案。\u003c/p\u003e\n\u003cp\u003e**第七天，审计疲劳。**是否抱着打盹、驾驶犯困、重复操作、明显烦躁？若有，应调整排班与支持，不只增加提醒。亲友帮忙优先承担能让主要照护者睡觉和吃饭的任务，而不是只在婴儿安静时抱一会儿。\u003c/p\u003e\n\u003ch3 id=\"c04-s005\"\u003e4.6　第八至第十四天：把环境与互动做稳定\u003c/h3\u003e\n\u003cp\u003e**第八天，整理照护站。**清洁、尿布、备用衣物和垃圾处理顺手；药物、补充剂、消毒液分区。所有液体有清楚标签与浓度，不能将不同透明液体装入无标记小瓶。\u003c/p\u003e\n\u003cp\u003e**第九天，练习来回交流。**选择清醒、不太饥饿时说几句话，然后停顿等待。孩子看开、烦躁或疲惫就结束。目的不是听够多少词，而是成人根据孩子反应调整。\u003c/p\u003e\n\u003cp\u003e**第十天，复核已经启动的清醒俯卧。**多数婴儿在出生后一至两天即可按状态开始短时、有人持续看护的清醒俯卧，并不需要等到第十天。可从每天两三次、每次三至五分钟的短段参考起步；需要更短或有医疗限制时相应调整。清醒俯卧与睡眠仰卧是不同场景，困倦或不适就结束，睡着转入安全睡眠，不追求忍哭凑时。\u003ca href=\"#s48\"\u003eS48\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**第十一天，复核补充剂执行，不能把今天当默认起始日。**检查此前确认的维生素D计划是否已经执行、每滴或每毫升含量是否抄对、有没有重复产品、给药人是否明确。喂养方式改变时重新核对，不自行增加总量。\u003ca href=\"#s14\"\u003eS14\u003c/a\u003e 滴、毫升、国际单位不能混用。\u003c/p\u003e\n\u003cp\u003e**第十二天，准备外出小包。**只放尿布、衣物、喂养、清洁和必要医疗资料。重点是温度、回程与照护，不追求过早见世面，也不因避免外出而推迟必要复查。\u003c/p\u003e\n\u003cp\u003e**第十三天，检查听力流程是否有下一位负责人。**未通过筛查不等于确诊，但不能失访。CDC的“1—3—6”目标是一个月内筛查、三个月内完成必要诊断、确有听力损失者六个月内进入适当早期干预；能更早完成不必等到期限。只有取得结果解释并落实需要的后续，才算相应节点闭环。\u003ca href=\"#s153\"\u003eS153\u003c/a\u003e 通过后仍关注听觉与沟通变化。\u003c/p\u003e\n\u003cp\u003e**第十四天，减少无用测量。**若生长喂养稳定，讨论哪些记录可降频。普通家庭不必每餐前后称重；有明确问题则继续按计划监测。减少的是负担，不是必要随访。\u003c/p\u003e\n\u003ch3 id=\"c04-s006\"\u003e4.7　第十五至第二十一天：建立柔和的可预测性\u003c/h3\u003e\n\u003cp\u003e白天保留正常生活光线和交流，夜间减少不必要刺激。不要为培养作息让婴儿白天一直不睡，也不把整夜睡当健康证明。具体分龄睡眠范围在卷十六统一列出，不能拿总时长替代喂养和健康评估。\u003c/p\u003e\n\u003cp\u003e每天可有一个熟悉连接点，例如换尿布后说同一段话，或一次清醒时看熟悉照护者的脸。固定的是成人回应机会，不是要求婴儿准时表演。没有反应先检查疲倦、饥饿和不适，不直接判定发育问题。\u003c/p\u003e\n\u003cp\u003e检查衣物是否勒、标签是否摩擦、环境是否过热、抱持是否遮住口鼻。持续偏向一侧、明显不对称、喂养中反复呛咳或其他担忧，向随访团队提出，必要时提前评估；不自行用矫形枕或扳动颈部处理。\u003c/p\u003e\n\u003ch3 id=\"c04-s007\"\u003e4.8　第二十二至第二十八天及满月前过渡\u003c/h3\u003e\n\u003cp\u003e核对全部出生筛查、接种记录、复查结论和下次保健预约。医生说观察时，应知道观察什么、到何时、什么变化提前联系。没有这些条件的观察容易变成无限期忽略。\u003c/p\u003e\n\u003cp\u003e照护者回岗或更换时，提前让接替者实际完成多轮操作。交接主表保持简短，重要附件可另存，不能让对方从两百条聊天记录猜出当前方案。记录婴儿偏好，但随成长更新，不把早期反应永久标签化。\u003c/p\u003e\n\u003cp\u003e日龄二十九日到满一个月前，继续本卷日常循环，不存在无协议空档；满一个月后进入卷五月龄增量。月底总结只需：什么已稳定，什么仍担心，下次找谁，不对抬头、哭闹或睡眠作排名。\u003c/p\u003e\n\u003ch3 id=\"c04-s008\"\u003e4.9　协议F：配方奶的准备、保存与丢弃\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开配方奶操作协议F\u003c/summary\u003e\n\u003cp\u003e使用安全水源、合适年龄的正规产品和清洁器具。严格按产品与卫生要求执行水粉比例，先准确量水再加规定粉量，不加浓、不稀释，不凭目测。具体温度与准备方式需匹配产品和婴儿风险。\u003c/p\u003e\n\u003cp\u003e粉状配方并非无菌。未满两个月、早产或免疫功能受损者需要额外防感染措施，询问是否优先用无菌即食配方及相应冲调冷却要求。\u003ca href=\"#s13\"\u003eS13\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eCDC一般时限为冲调后两小时内、开始喂后一小时内使用；未开始喂且立即冷藏的通常二十四小时内使用。接触婴儿口腔的剩奶丢弃，不和新奶混合；不要微波加热。\u003ca href=\"#s13\"\u003eS13\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e特殊医学配方和当地条件可能不同，以具体说明和团队计划为准。水被化学污染时煮沸并不必然安全，灾害中应获取卫生部门认可的水源或适用即食配方。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c04-s009\"\u003e4.10　哭闹与照护失控\u003c/h3\u003e\n\u003cp\u003e先排疾病信号，再看饥饿、尿布、温度、衣物与安抚需要。轻声、温柔抱持、减少刺激都可尝试，但无效不意味着需要加大力度。长时间哭闹不能一概归为肠绞痛，突然安静也不自动代表问题解决。\u003c/p\u003e\n\u003cp\u003e成人即将失控时，将婴儿仰卧放回安全床面，短暂离开几步冷静、及时回看并联系可靠成人接手。不要交给醉酒、暴怒或有暴力风险者，不摇晃、不抛掷、不击打。\u003ca href=\"#s52\"\u003eS52\u003c/a\u003e 异常呼吸、发绀、难唤醒、反应差、明显脱水或发热优先进入安全卷。\u003c/p\u003e\n\u003cp\u003e本阶段最优不是最早独立，而是即使完全依赖别人，也能得到足够、稳定、安全并可持续的照护。评价的对象首先是支持系统是否可靠，而不是婴儿是否容易照顾。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c04-s000","title":"4.1　适用范围与照护者责任"},{"id":"c04-s001","title":"4.2　协议N：每轮照护的五个检查点"},{"id":"c04-s002","title":"4.3　协议S：安全睡眠完整规则"},{"id":"c04-s003","title":"4.4　出生当日：核对交接"},{"id":"c04-s004","title":"4.5　第一至第七天：每天新增一个可靠动作"},{"id":"c04-s005","title":"4.6　第八至第十四天：把环境与互动做稳定"},{"id":"c04-s006","title":"4.7　第十五至第二十一天：建立柔和的可预测性"},{"id":"c04-s007","title":"4.8　第二十二至第二十八天及满月前过渡"},{"id":"c04-s008","title":"4.9　协议F：配方奶的准备、保存与丢弃"},{"id":"c04-s009","title":"4.10　哭闹与照护失控"}]},{"id":5,"title":"卷五　一个月至一岁：从被照护到主动探索","html":"\u003ch2\u003e卷五　一个月至一岁：从被照护到主动探索\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c05\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**观察、筛查与诊断分开记录。**会不会某个动作的家庭观察，不等于完成标准化发育筛查。可在\u003ca href=\"#r31-development\"\u003e儿童窗口卡\u003c/a\u003e核对当地流程；其中美国AAP示例为九、十八、三十月龄一般发育筛查，以及十八、二十四月龄孤独症专项筛查。任何时候出现担忧或能力倒退，都不等待排定月龄。\u003ca href=\"#s152\"\u003eS152\u003c/a\u003e 早产儿同时保留实际年龄与\u003ca href=\"#r31-preterm\"\u003e矫正年龄\u003c/a\u003e，不把所有事项共用一个时钟。\u003c/p\u003e\n\u003ch3 id=\"c05-s000\"\u003e5.1　月龄负责导航，能力负责开关\u003c/h3\u003e\n\u003cp\u003e每个孩子在动作、交流、感觉和进食上的进度可能不同。月龄用来提醒成人提供机会，不用来发出合格证。发育观察清单不能替代标准化筛查；持续担忧、明显不对称或已经获得的能力消失，应及时向儿科或儿童保健人员提出。\u003ca href=\"#s53\"\u003eS53\u003c/a\u003e\u003ca href=\"#s54\"\u003eS54\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e每天仍调用卷四的安全睡眠与适用喂养协议。短暂清醒时增加一两种当前能力能够参与的活动就足够。重复同一首歌、同一个拿取动作不是浪费；孩子可能正在从同一经验中提取新关系。新增信息不一定来自新产品，也可以来自位置、质地、回应方式或自己动作造成的结果。\u003c/p\u003e\n\u003cp\u003e下面月序是机会清单，不是医学训练处方。没在某月完成的动作不能靠下月加倍训练补账。生病、早产、残障或家庭困难时，按实际需要调整支持，不能让标准清单成为拒绝参与的理由。\u003c/p\u003e\n\u003ch3 id=\"c05-s001\"\u003e5.2　满一个月至未满两个月：让回应变得可预测\u003c/h3\u003e\n\u003cp\u003e换尿布、抱起和安抚时，先说话、停顿、看反应再继续。描述正在发生的事，而不是全天播放语言。孩子看开、烦躁或疲倦时减少刺激，允许其退出互动。照护者的语气和节奏可以稳定，但不要求孩子每次给出相同反应。\u003c/p\u003e\n\u003cp\u003e检查声音环境：电视是否全天开着，玩具是否靠近耳朵，助眠声音是否遮盖了正常交流。安静本身就是可用环境，不需要每分钟都有刺激。清醒俯卧依卷四按耐受开展，不按住头部或忍哭凑时间。\u003c/p\u003e\n\u003cp\u003e本月新增成人任务是固定随访入口与替班。保健不只量体重，也可以讨论喂养、睡眠、视觉、听觉和照护困难。没有问题时不必为证明用心增加检查；有具体问题时也不必等满月仪式结束才求助。\u003c/p\u003e\n\u003ch3 id=\"c05-s002\"\u003e5.3　两至三个月：给孩子发起互动的时间\u003c/h3\u003e\n\u003cp\u003e把脸或安全物品放在容易看见的位置，不持续快速晃动。孩子看向、发声或动作时再回应，避免成人总是抢先填满停顿。记录一个真实变化即可，不要求每天拍出新技能视频。\u003c/p\u003e\n\u003cp\u003e抱持和摆放时给予左右两侧自然接触机会；持续明显偏向一侧、活动受限或头形疑虑应评估，不使用硬枕、绑带或强行扳动。婴儿难以表达具体不舒服，成人要区分习惯与持续受限，不凭一次照片判断。\u003c/p\u003e\n\u003cp\u003e外出可以只是安全地看树影、听普通生活声音。拥挤商场和连续陌生人逗弄不天然优于安静散步。天气、空气、个体疾病和可获得照护决定安排，不能为了见世面忽略实际负担。\u003c/p\u003e\n\u003ch3 id=\"c05-s003\"\u003e5.4　三至四个月：让动作能够改变结果\u003c/h3\u003e\n\u003cp\u003e提供少量完整、适龄、便于接触的物品，留出尝试空间。伸手能碰到、碰到会移动、放开会掉下，这些关系比成人不断展示玩具更多地允许孩子参与。一次只改变一个变量，避免声音、灯光和移动同时过强。\u003c/p\u003e\n\u003cp\u003e出现翻身尝试就更新睡眠与看护，不等成功后再处理。高台、沙发和成人床不能被当作临时安全停车位。睡眠襁褓边界调用协议S，不为延长睡眠而继续束缚可能翻身的孩子。\u003c/p\u003e\n\u003cp\u003e检查所有可能入口的物品是否脱落、破裂、缠绕或有未封牢的电池仓。家中其他孩子的玩具、药片和遥控器同样要检查；购买标签写婴儿适用，不等于家中摆放就自动安全。\u003c/p\u003e\n\u003ch3 id=\"c05-s004\"\u003e5.5　四至五个月：选择、抓握与自主地面活动\u003c/h3\u003e\n\u003cp\u003e一次给两个安全物品，观察孩子先关注哪一个，不把选择解释为终身天赋。不同状态下偏好会变化。成人可以命名所选物，但不要要求选中成人认为更有教育价值的那个。\u003c/p\u003e\n\u003cp\u003e地面活动留出移动空间，不长时间固定在各种座椅中，再用几分钟训练补偿。头躯干控制尚不稳定时，不靠枕头围成强迫坐姿，不为照片摆出无法自行维持的位置。坐、站、走的机会跟随能力，不按成人审美升级。\u003c/p\u003e\n\u003cp\u003e开始了解辅食准备条件与当地建议，但看到孩子盯成人食物不能单独作为开始大量辅食的依据。需要结合大致年龄、头颈和坐姿控制、吞咽及健康条件；早产或复杂情况另行咨询。\u003c/p\u003e\n\u003ch3 id=\"c05-s005\"\u003e5.6　五至六个月：先准备环境和成人能力\u003c/h3\u003e\n\u003cp\u003e准备稳定进食座位、适用约束、可清洁餐具和能专心看护的成人。高脚椅远离可拉到的热物、电线和会导致倾倒的位置。屏幕支架不是进食设施的核心；真正需要的是安全姿势与观察。\u003c/p\u003e\n\u003cp\u003e实际照护者参加婴幼儿急救实操，学习气道梗阻的识别与处置。不能将成人步骤按比例缩小给婴儿使用。紧急时按当地调度和已受训流程行动，不临时翻找长篇文章。\u003c/p\u003e\n\u003cp\u003eWHO建议约六个月开始安全、营养适宜的辅食，同时继续母乳喂养；未使用母乳的孩子需要适龄配方方案。\u003ca href=\"#s04\"\u003eS04\u003c/a\u003e 开始日期不是人生分水岭，关键是准备条件、营养与持续评估。\u003c/p\u003e\n\u003ch3 id=\"c05-s006\"\u003e5.7　六至七个月：辅食既是营养，也是新技能\u003c/h3\u003e\n\u003cp\u003e选择清醒、姿势稳定、不过度饥饿或疲惫的时候，从少量开始观察接受与吞咽，奶仍是重要营养来源。不要因为开始吃几口泥就突然撤掉大部分奶，也不拿一顿吃了多少与别家比较。\u003c/p\u003e\n\u003cp\u003e膳食逐步包含适合的富铁食物，不长期只用稀粥、水果或汤水。是否补铁由喂养方式、早产、贫血等风险决定，不给所有孩子同一剂量。限制多个食物类别时需要检查营养缺口，不让过敏担忧自动变成长期单一饮食。\u003c/p\u003e\n\u003cp\u003e常见致敏食物不应仅因害怕无限延迟，应按适合的形态、年龄与个体风险引入，耐受后纳入日常；明显湿疹、已有食物过敏等情况先咨询。整粒坚果和一大团黏稠坚果酱不是安全引入形式。\u003ca href=\"#s55\"\u003eS55\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e语言跟随正在发生的事：看碗就说碗，伸手就描述想拿。不要把说出词语变成获得食物或帮助的条件。孩子可以先通过手势和动作表达，成人负责把表达连接到回应。\u003c/p\u003e\n\u003ch3 id=\"c05-s007\"\u003e5.8　七至八个月：手、眼、口与空间共同学习\u003c/h3\u003e\n\u003cp\u003e把安全物品放在不同但可及的位置，让孩子尝试伸手、换手或转身。给予时间，明显挫败时降低难度，不用不断拉远物品制造所谓挑战。练习的结果应该可接近，而不是总被成人拿走。\u003c/p\u003e\n\u003cp\u003e辅食质地随能力逐步调整，不为清洁方便长期停留在完全细滑的形式；也不照搬视频中同龄人的大块食物。反复呛咳、吞咽困难、进食后呼吸异常需要评估，不能用多练就好带过。\u003c/p\u003e\n\u003cp\u003e成人从地面高度检查插座、电线、植物、宠物食盆、垃圾和小物。站着看整洁不代表婴儿能接触到的区域安全。每次新增移动能力，都要检查其能够到达的新范围。\u003c/p\u003e\n\u003ch3 id=\"c05-s008\"\u003e5.9　八至九个月：移动改变家庭权限\u003c/h3\u003e\n\u003cp\u003e移动方式存在差异，不必强迫一种标准爬行姿势。只要孩子开始改变位置，就提前完成家具防倾倒、楼梯、窗户和门缝保护。安全改造跟随可能做到的下一步，不等待一次险情证明能力。\u003c/p\u003e\n\u003cp\u003e可以把安全物品放入容器再拿出，观察顺序与空间。容器不能夹手、锋利、套住头部或含可入口的小部件。成人演示后退一步，让孩子操作，而不是完成整套表演。\u003c/p\u003e\n\u003cp\u003e更换照护者时安排熟悉过程，告别简短稳定，不偷偷消失后将哭闹解释为不独立。孩子可以不立即接受陌生人拥抱，成人负责建立安全关系，而不是要求其配合社交礼仪。\u003c/p\u003e\n\u003ch3 id=\"c05-s009\"\u003e5.10　九至十个月：共同注意与安全拒绝\u003c/h3\u003e\n\u003cp\u003e孩子看向或指向某物时，成人可以看同一个目标并回应。对象可以是窗外车、洗衣物或图画。意义在于共同关注，而不是每次把注意力拉回课程。\u003c/p\u003e\n\u003cp\u003e安全语言简短一致，例如烫、不碰，同时由成人移走危险物。不能指望婴儿理解禁止来承担安全责任。孩子会听一个词，不等于在兴奋、疲倦或陌生环境下能稳定控制行为。\u003c/p\u003e\n\u003cp\u003e挥手、拍手和轮流可在自然互动中练习，不强迫向客人表演。孩子拒绝时成人可以替其礼貌回应，保留对身体和注意力的基本边界。\u003c/p\u003e\n\u003ch3 id=\"c05-s010\"\u003e5.11　十至十一个月：自助从小动作开始\u003c/h3\u003e\n\u003cp\u003e允许安全地拿食物、接触勺子、练习杯子。洒落是清洁任务，不是必须立刻制止的失败。用小份量和易清理环境减少成人压力，比连续说不要弄脏更有用。\u003c/p\u003e\n\u003cp\u003e穿衣时停一下，等待伸手或抬脚；收拾时让孩子把一个物品放进盒子。不要求完成成人标准的整套家务，也不因做得慢就完全撤回机会。成人帮助应恰好填补当前困难。\u003c/p\u003e\n\u003cp\u003e精细拿取能力增加后，药片、硬币、磁铁、电池更加值得关注。能力进步同时意味着风险接口变化，不能只庆祝而不更新环境。疑似吞入危险物立即联系急救或医疗服务，不等待自行排出。\u003c/p\u003e\n\u003ch3 id=\"c05-s011\"\u003e5.12　十一至十二个月：准备过渡，而不是生日清零\u003c/h3\u003e\n\u003cp\u003e逐渐参与家庭餐桌，但食物仍按安全质地和营养需要调整。奶类、杯子和餐次的变化结合生长与专业建议，不因一岁生日突然撤掉全部熟悉安排。\u003c/p\u003e\n\u003cp\u003e一岁前不喂蜂蜜，不以普通牛奶替代主要奶源，也不需要果汁；未经巴氏消毒食品、高盐高添加糖及高汞鱼类按儿童安全要求避免或限制。\u003ca href=\"#s16\"\u003eS16\u003c/a\u003e 这套规则以后通过引用调用，不每个月重新列出。\u003c/p\u003e\n\u003cp\u003e一岁时是否独走不是单一合格线。整体发展轨迹、交流与探索、是否失去已有技能和筛查发现更重要。\u003ca href=\"#s54\"\u003eS54\u003c/a\u003e 庆祝可以围绕关系，不需要婴儿承受漫长仪式和展示压力。\u003c/p\u003e\n\u003ch3 id=\"c05-s012\"\u003e5.13　协议C：辅食防噎与回应式进食\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开每次进食前的安全检查C\u003c/summary\u003e\n\u003cp\u003e孩子清醒、坐姿稳定且有适当支持，成人全程专心看护；不边走边吃，不在移动交通中安排无法及时处理的进食。形状、硬度、黏性和大小共同决定风险，切小不一定安全。\u003c/p\u003e\n\u003cp\u003e整颗葡萄、圆片香肠、整粒坚果、爆米花、硬糖、硬生蔬菜块与大团坚果酱等是常见风险形式，要按年龄能力安全处理或不提供。\u003ca href=\"#s15\"\u003eS15\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e先核对已知过敏、温度和质地，再决定份量。严重反应进入急症分支，不能在家对已知过敏原自行做激发试验。孩子表示饱足就结束，不靠屏幕分心继续塞食。\u003c/p\u003e\n\u003cp\u003e长期进食困难、生长异常或餐桌持续冲突，应寻求喂养和营养评估，不提高强迫力度。不同喂养方法不是家长等级，合适、安全、营养和可持续比流派名称更重要。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c05-s013\"\u003e5.14　生长曲线、记录与玩具选择\u003c/h3\u003e\n\u003cp\u003e体重、身长和头围使用适合的生长参考，并由专业人员结合连续轨迹解释。WHO提供相应标准工具。\u003ca href=\"#s56\"\u003eS56\u003c/a\u003e 百分位不是成绩，接近中位数也不是所有孩子的目标。一次异常先看测量、既往趋势与状态，不立即用加餐或限制饮食追求五十分。\u003c/p\u003e\n\u003cp\u003e家庭记录优先保留新能力、异常和会改变行动的问题。视频选择自然情境，不为拍出标准动作反复诱导至疲惫。有感觉、运动或其他障碍的孩子，需要适配材料、沟通与机会，不是加倍完成普通清单。\u003c/p\u003e\n\u003cp\u003e玩具选择看能否安全操作、是否便于清洁、是否允许孩子影响结果、成人能否接受重复使用。无需不断换新。一次只放少量，轮换不需要购买，旧容器和结实图书在安全检查后也可提供丰富经验。\u003c/p\u003e\n\u003ch3 id=\"c05-s014\"\u003e5.15　婴儿的一天怎样生成\u003c/h3\u003e\n\u003cp\u003e醒来先完成照护与喂养；状态合适时短暂交流或地面活动；困倦时进入安全睡眠。某个清醒段换到适合的环境，另一个接触图书、声音或可操作物。辅食安排在成人能专心照看的时段，不把所有新尝试堆在睡前。\u003c/p\u003e\n\u003cp\u003e一天只选一个小变化：一种安全质地、一个拿取位置、另一位熟悉照护者讲同一本书。熟悉活动照常发生，不重新抄写为新增任务。生病、旅行或家庭疲惫时回到基础照护，未完成的训练不构成债务。\u003c/p\u003e\n\u003cp\u003e这一年的长期价值，是孩子逐渐发现自己的信号会被回应，尝试能够改变环境，拒绝和疲倦会得到尊重。成人不需要制造不断领先的婴儿，需要建设可以安心探索的世界。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c05-s000","title":"5.1　月龄负责导航，能力负责开关"},{"id":"c05-s001","title":"5.2　满一个月至未满两个月：让回应变得可预测"},{"id":"c05-s002","title":"5.3　两至三个月：给孩子发起互动的时间"},{"id":"c05-s003","title":"5.4　三至四个月：让动作能够改变结果"},{"id":"c05-s004","title":"5.5　四至五个月：选择、抓握与自主地面活动"},{"id":"c05-s005","title":"5.6　五至六个月：先准备环境和成人能力"},{"id":"c05-s006","title":"5.7　六至七个月：辅食既是营养，也是新技能"},{"id":"c05-s007","title":"5.8　七至八个月：手、眼、口与空间共同学习"},{"id":"c05-s008","title":"5.9　八至九个月：移动改变家庭权限"},{"id":"c05-s009","title":"5.10　九至十个月：共同注意与安全拒绝"},{"id":"c05-s010","title":"5.11　十至十一个月：自助从小动作开始"},{"id":"c05-s011","title":"5.12　十一至十二个月：准备过渡，而不是生日清零"},{"id":"c05-s012","title":"5.13　协议C：辅食防噎与回应式进食"},{"id":"c05-s013","title":"5.14　生长曲线、记录与玩具选择"},{"id":"c05-s014","title":"5.15　婴儿的一天怎样生成"}]},{"id":6,"title":"卷六　一至三岁：让自主性在稳固边界内成长","html":"\u003ch2\u003e卷六　一至三岁：让自主性在稳固边界内成长\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c06\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c06-s000\"\u003e6.1　主任务不是听话\u003c/h3\u003e\n\u003cp\u003e孩子开始移动、选择、拒绝、模仿和影响别人。若成人目标只是尽量少添麻烦，大量探索都会被误认成故障。本卷的编排是提供真实参与机会，同时由成人承担危险、时间压力和资源安排。\u003c/p\u003e\n\u003cp\u003e年龄只组织机会，能力决定具体难度。同一孩子不同领域进度可能不同，语言较快不代表情绪控制也要同步领先。CDC两岁、三岁清单可帮助讨论发育担忧，不作为家庭排名。\u003ca href=\"#s57\"\u003eS57\u003c/a\u003e\u003ca href=\"#s58\"\u003eS58\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e每天沿用已有照护底座，再加入一个能自然发生的小任务。不要把所有本卷活动同时排进日历；重复练习可以持续，但成人不必每日换花样证明重视。\u003c/p\u003e\n\u003ch3 id=\"c06-s001\"\u003e6.2　十二至十五个月：我也能参与\u003c/h3\u003e\n\u003cp\u003e把安全用品下移：一个放鞋篮、一个图书区、一个放安全餐具的抽屉。危险物品仍锁好，不将自主理解为全屋无边界。孩子够得到的东西，应是可以真的使用而非总被禁止的东西。\u003c/p\u003e\n\u003cp\u003e每天邀请一个有清楚结束的小动作，例如把毛巾放进篮子、递给成人一个物品。完成后描述发生了什么，不只用聪明或乖概括。成人提供足够简单的任务，不能先给复杂要求再用失败证明孩子不配参与。\u003c/p\u003e\n\u003cp\u003e回应手势、表情和声音，再补充语言。不会说一个词不应成为获得帮助的门槛。多语言家庭可以自然使用照护者熟练语言，不必让所有人改说不熟悉的表达。\u003c/p\u003e\n\u003cp\u003e会扶站检查可拉倒物，会攀爬检查窗边家具。安全保护先于提醒，喊停只是辅助。衣物和鞋应允许活动，不用外观限制身体探索。\u003c/p\u003e\n\u003ch3 id=\"c06-s002\"\u003e6.3　十五至十八个月：从动作到顺序\u003c/h3\u003e\n\u003cp\u003e示范一个两步过程，例如拿脏衣物到篮边再放入。孩子参与其中一部分也有价值。若中途离开，先看任务太长、环境太乱还是当前状态不合适，不急于贴注意力差标签。\u003c/p\u003e\n\u003cp\u003e进餐给有限但真实选择。成人负责适宜食物、场景和规律机会，孩子在安全与营养评估允许范围内决定吃多少。持续摄入不足、生长异常或明显痛苦要评估，不能无限等待他饿了自然吃。\u003c/p\u003e\n\u003cp\u003e练习请求帮助：先试，再提供所需的一点支持。扶稳碗而非全部代喂，松开一点拉链而非立刻替其完成。独立与合作不是相反目标，知道何时求助同样是能力。\u003c/p\u003e\n\u003cp\u003e本季度成人要统一少量安全规则。一个人允许危险动作、另一个靠大声制止，会使边界难预测。删掉纯粹为成人方便而过多增加的禁令，让真正重要的规则更清楚。\u003c/p\u003e\n\u003ch3 id=\"c06-s003\"\u003e6.4　十八至二十一个月：承认感受，保护行动边界\u003c/h3\u003e\n\u003cp\u003e离开喜欢的游戏时可以说，你还想玩，停下很难，现在要回家。承认情绪不等于取消边界。孩子激动时不用长篇讲道理，平静后再讨论下一次怎样过渡。\u003c/p\u003e\n\u003cp\u003e给出能兑现的选项，例如自己走到门口还是由成人抱。不要把威胁包装成选择，也不要提供实际上不能接受的选项。事先预告转换，比临时抢走物品更容易保留合作机会。\u003c/p\u003e\n\u003cp\u003e打人、咬人或扔危险物时先保护双方，平静阻止，之后示范退开、说不要、找成人等替代。不能通过打回去教不打人。道歉可以包括修复行动，不需要当场强迫拥抱。\u003c/p\u003e\n\u003cp\u003e记录反复冲突发生在哪里：饥饿、困倦、等太久、过度刺激还是任务转换。记录服务于修改环境，不是建立坏行为档案。成人也要观察自己的疲劳和反应是否在加剧循环。\u003c/p\u003e\n\u003ch3 id=\"c06-s004\"\u003e6.5　二十一至二十四个月：一天成为可理解的小地图\u003c/h3\u003e\n\u003cp\u003e用真实顺序说明吃饭后洗手再出门，可以用少量图片辅助。不要把墙面贴满复杂表格；提示应让孩子更容易行动，而非制造新的解读负担。\u003c/p\u003e\n\u003cp\u003e假装游戏允许盒子当车、布当桌布。成人加入角色但不接管故事，让物品用途、行动后果和角色交换成为新信息。游戏不需要高度逼真玩具，也不要求故事逻辑完全符合成人世界。\u003c/p\u003e\n\u003cp\u003e观察交流是否逐渐丰富、手势和词语是否帮助表达、是否与人共享注意。持续担心或能力丢失时寻求评估，不以贵人语迟带过。\u003ca href=\"#s57\"\u003eS57\u003c/a\u003e 早期支持是为了功能与交流，不是消除所有差异。\u003c/p\u003e\n\u003cp\u003e认识姓名、熟悉照护者和简单求助方式可以自然进行，但不能依赖孩子报出完整信息承担外出安全。成人仍负责看护和环境选择。\u003c/p\u003e\n\u003ch3 id=\"c06-s005\"\u003e6.6　二十四至二十七个月：如厕看准备，不看竞赛\u003c/h3\u003e\n\u003cp\u003e如厕准备包括理解简单提示、表达或显示排泄需要、兴趣以及家庭能否稳定支持。多数孩子在两至三岁才逐渐具备合适训练条件，过早强推可能增加压力。\u003ca href=\"#s57\"\u003eS57\u003c/a\u003e 早告别尿布不是育儿成绩。\u003c/p\u003e\n\u003cp\u003e先熟悉便盆或适合座圈和脚部支持，解释用途，允许穿衣试坐。自然时机提供尝试，不长时间扣坐等结果。没有排出就结束，弄湿衣物是清洁任务，不是羞耻事件。\u003c/p\u003e\n\u003cp\u003e大便痛、明显憋便、便秘、尿痛应处理，不继续加码训练。夜间干爽与白天可以不同步，不能反复叫醒或羞辱逼出成熟。生病、搬家或入园时临时回退支持，不等于全部失败。\u003c/p\u003e\n\u003cp\u003e准备备用衣物和外出厕所位置，降低每次失误的家庭成本。行动、感觉或发展差异可能需要工具和专业适配，不能只要求延长坐便时间。\u003c/p\u003e\n\u003ch3 id=\"c06-s006\"\u003e6.7　二十七至三十个月：从并排到协作\u003c/h3\u003e\n\u003cp\u003e两名孩子使用相似材料，各有空间，成人不强迫刚拿到的东西马上分享。可以轮流、等待或提供替代。说清个人与公共物品规则，避免总让较温顺的一方让步。\u003c/p\u003e\n\u003cp\u003e冲突先描述事实，再提出可行方式，不给孩子下自私结论。双方平静后修复可以是归还、整理或关心，不只有一句对不起。成人应观察有没有持续欺负，而非把所有伤害当普通玩闹。\u003c/p\u003e\n\u003cp\u003e用真实动作练位置、数量和行动词。把物品放里面、旁边或上方，理解通过行动显示。无法完成先示范，别连续发指令让孩子猜。\u003c/p\u003e\n\u003ch3 id=\"c06-s007\"\u003e6.8　三十至三十三个月：做可逆的小决定\u003c/h3\u003e\n\u003cp\u003e选择两件合适衣服、阅读顺序或一种安全游戏。选择后可以体验小后果，但不把决定变成不能反悔的惩罚。成人可以说明什么时候能换，保留可预测性。\u003c/p\u003e\n\u003cp\u003e尝试低风险预测，例如不同纸张放在浅水容器中会怎样。先说猜想，再观察；成人负责水和材料安全。结果不同不是出丑，而是获得信息，不必把每次探索做成答题比赛。\u003c/p\u003e\n\u003cp\u003e给未完成作品一个暂存位置。收纳不必每天彻底清空所有探索，但不能阻挡通道或留下危险材料。孩子开始学习个人项目与共同空间的协调。\u003c/p\u003e\n\u003ch3 id=\"c06-s008\"\u003e6.9　三十三至三十六个月：进入更大的社会空间\u003c/h3\u003e\n\u003cp\u003e托育或幼儿园过渡先熟悉照护者、厕所、吃饭和接送。角色游戏练告别、求助、说不舒服，不只训练数数和静坐。机构也应了解孩子的语言、过敏、疾病和支持需要。\u003c/p\u003e\n\u003cp\u003e观察的是是否得到回应、排泄进食是否受尊重、是否安全。哭得少不自动证明适应良好，哭得多也不单独证明机构差。长期明显痛苦、伤害或害怕特定成人需要认真了解。\u003c/p\u003e\n\u003cp\u003e三岁附近的来回对话、同伴参与、餐具与穿衣等可作为观察话题，必要时评估。\u003ca href=\"#s58\"\u003eS58\u003c/a\u003e 普通生活技能不值得用羞辱训练，有障碍时适配方法，而不是只增加次数。\u003c/p\u003e\n\u003ch3 id=\"c06-s009\"\u003e6.10　身体边界从照护语言开始\u003c/h3\u003e\n\u003cp\u003e洗澡、换衣或擦拭前告诉孩子做什么、为什么需要帮助。使用适龄正确身体名称，逐步说明私人部位与隐私。说不舒服时停下了解；必要护理也尽量解释、保护遮挡并采用最少强制。\u003c/p\u003e\n\u003cp\u003e拥抱、亲吻、坐亲友腿上都不是礼貌义务，可以挥手或说话替代。成人尊重小的拒绝，身体属于你才不只是口号。医疗与安全照护需要适当同意和监护责任，不能简单由拒绝决定是否完全停止必要治疗，应由专业人员帮助处理。\u003c/p\u003e\n\u003cp\u003e告诉孩子：使你害怕或不舒服的秘密可以向可信成人说，即使答应过或收过礼物也可以求助。听到担忧经历先保证安全、认真听，不诱导盘问，联系适当保护与专业渠道。\u003c/p\u003e\n\u003ch3 id=\"c06-s010\"\u003e6.11　游戏材料与感官负担\u003c/h3\u003e\n\u003cp\u003e少量安全容器、布、纸、粗画笔、图书、积木和球即可组成活动库。检查吞咽、缠绕、尖锐、毒性和清洁性。材料简单不代表缺乏价值，重要的是可操作与成人愿意留出空间。\u003c/p\u003e\n\u003cp\u003e每次换一个变量：容器大小、材料软硬、滚动还是滑动。变化过多时难知道结果来自哪里。音乐可轮流敲击和停顿，绘画先探索线条，不以像不像评分。\u003c/p\u003e\n\u003cp\u003e不喜欢某种声音、衣料、触感或人群时，先了解实际不适，降低强度或换方式。不能把忍受所有刺激当作训练目标。持续影响生活时寻求适当评估，避免购买没有明确目标的复杂课程。\u003c/p\u003e\n\u003ch3 id=\"c06-s011\"\u003e6.12　屏幕与睡前：场景边界比口号清楚\u003c/h3\u003e\n\u003cp\u003e屏幕不是必需早教入口。使用时选择适龄内容并有成人共同观看，连接现实。CDC两至三岁页面给出每日不超过一小时适合且有成人陪伴的节目参考，这不是必须用满的额度，活动、交流和睡眠仍优先。\u003ca href=\"#s57\"\u003eS57\u003c/a\u003e\u003ca href=\"#s58\"\u003eS58\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e可约定餐桌不靠视频塞食、卧室不无限自动播放、睡前逐渐降低刺激。成人也遵守注意力边界，不一边要求孩子放下设备一边始终低头。\u003c/p\u003e\n\u003cp\u003e旅行或照护者生病时偶尔增加，不需补偿性惩罚，恢复常规即可。评估长期模式是否挤掉真实互动，而不是单日是否达到完美。\u003c/p\u003e\n\u003ch3 id=\"c06-s012\"\u003e6.13　协议T：幼儿的一天\u003c/h3\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开幼儿日常骨架T\u003c/summary\u003e\n\u003cp\u003e起床清洁、早餐时参与一个小步骤。上午有安全移动与探索，条件适合时户外，活动间自然饮水与休息。不是按成人课程密集排列。\u003c/p\u003e\n\u003cp\u003e午间按实际睡眠需要安排休息，下午自由游戏、共同阅读或交谈、一个真实家务动作。晚餐和清洁继续提供参与机会，成人保留必要监督。\u003c/p\u003e\n\u003cp\u003e睡前使用简短稳定顺序：结束活跃游戏、口腔清洁、换衣、安静陪伴。成人提前准备次日用品，不临睡前增加能力测试。生病、旅行、入园或家庭变化时降低新任务，不补做练习债。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c06-s013\"\u003e6.14　成人应退出的四个位置\u003c/h3\u003e\n\u003cp\u003e无危险的尝试先别抢着帮；明确拒绝非必要接触不替亲友说服；表达故事时不每句纠语法；已经疲倦不为拍到成果继续。退出让孩子有真正反馈，而不是一直照着成人结果表演。\u003c/p\u003e\n\u003cp\u003e退出不等于放任。危险、伤害、持续发展担忧、营养问题与照护失控仍需介入。关键是区分我不喜欢这个样子与这会造成需要防止的伤害。边界守稳以后，把边界以内的空间还给孩子。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c06-s000","title":"6.1　主任务不是听话"},{"id":"c06-s001","title":"6.2　十二至十五个月：我也能参与"},{"id":"c06-s002","title":"6.3　十五至十八个月：从动作到顺序"},{"id":"c06-s003","title":"6.4　十八至二十一个月：承认感受，保护行动边界"},{"id":"c06-s004","title":"6.5　二十一至二十四个月：一天成为可理解的小地图"},{"id":"c06-s005","title":"6.6　二十四至二十七个月：如厕看准备，不看竞赛"},{"id":"c06-s006","title":"6.7　二十七至三十个月：从并排到协作"},{"id":"c06-s007","title":"6.8　三十至三十三个月：做可逆的小决定"},{"id":"c06-s008","title":"6.9　三十三至三十六个月：进入更大的社会空间"},{"id":"c06-s009","title":"6.10　身体边界从照护语言开始"},{"id":"c06-s010","title":"6.11　游戏材料与感官负担"},{"id":"c06-s011","title":"6.12　屏幕与睡前：场景边界比口号清楚"},{"id":"c06-s012","title":"6.13　协议T：幼儿的一天"},{"id":"c06-s013","title":"6.14　成人应退出的四个位置"}]},{"id":7,"title":"卷七　三至六岁：连接身体、语言与真实世界","html":"\u003ch2\u003e卷七　三至六岁：连接身体、语言与真实世界\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c07\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e本卷活动量不是统一的“三至六岁一个数值”。三至四岁沿用五岁以下规则；满五岁后进入WHO五至十七岁组。具体的总活动、较高强度活动和屏幕限制分开看\u003ca href=\"#activity-child-table\"\u003e运动卷分龄表\u003c/a\u003e，不要把所有分钟都理解成集中训练。\u003c/p\u003e\n\u003ch3 id=\"c07-s000\"\u003e7.1　从单项技能转向完整活动\u003c/h3\u003e\n\u003cp\u003e一个完整活动包括目的、材料、尝试、协作、结果和收尾。会背很多数字不等于能分餐具，会认字不等于能说明需要。这个阶段可将学习放进生活，让孩子知道能力有什么用。四岁与五岁发展清单适合帮助家庭与专业人员沟通，但不是入学考试。\u003ca href=\"#s59\"\u003eS59\u003c/a\u003e\u003ca href=\"#s60\"\u003eS60\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e本卷每半年的主题是可移动编排。选一项孩子有兴趣、身体能够参与、家庭能支持的活动即可。不必同时报满语言、艺术、运动与思维课程。资源有限时，日常生活仍能提供大量真实材料。\u003c/p\u003e\n\u003ch3 id=\"c07-s001\"\u003e7.2　三至三岁半：语言用来表达，而不只回答\u003c/h3\u003e\n\u003cp\u003e留出一段不被连续追问打断的叙述。孩子讲一件事，先听完再问后来呢，不将每天交流固定为学了什么、吃了多少、有没有乖。成人也可分享一件小事，示范故事有开始、过程和结果。\u003c/p\u003e\n\u003cp\u003e练习请求帮助、说明不舒服和表达不同意。打不开可以请帮忙，疼痛可以指出位置，不喜欢一种游戏可以说不想这样。使用手势、图片或辅助设备的人同样有表达权，不以口语流利作为被听见的条件。\u003c/p\u003e\n\u003cp\u003e位置、顺序和因果词放进实际动作：杯子在盘旁，地湿先擦再走。说错时自然示范，不把谈话变成每句重说三遍的训练。若持续理解或表达困难，向合适专业人员咨询，不只增加卡片数量。\u003c/p\u003e\n\u003ch3 id=\"c07-s002\"\u003e7.3　三岁半至四岁：同一个身体可以有不同解法\u003c/h3\u003e\n\u003cp\u003e在安全场所练走地面标记、跨低障碍、推轻箱、滚球、钻和爬。每次只增一个难度，如方向或顺序，不同时增加高度、速度和竞争。活动结束应仍有余力参与正常生活。\u003c/p\u003e\n\u003cp\u003e观察舒适、愿意继续和能否调整，不急于形成专业姿势。持续疼痛、动作显著不对称或能力下降应评估，不能统一解释为长身体。体力挑战不是服从训练，更不能用跑圈惩罚情绪。\u003c/p\u003e\n\u003cp\u003e手部活动可以揉捏适龄材料、撕纸、夹取大物、涂画和使用适合工具。成人先示范工具安全并看护，作品不必达到展示标准。材料探索本身就是完整活动。\u003c/p\u003e\n\u003ch3 id=\"c07-s003\"\u003e7.4　四至四岁半：从为什么到小型调查\u003c/h3\u003e\n\u003cp\u003e面对问题，区分知道、需要观察和暂时不知道。成人承认不确定，再共同寻找证据。可以研究不同折法的纸能否站稳，先猜、分别尝试、再比较，不需要实验室装备。\u003c/p\u003e\n\u003cp\u003e一次明确改变了什么，其他条件尽量类似。猜错不是失败，看到不同结果就问发生了什么。记录可用一幅画、一张照片或一句话，不必抄完整报告。成人若承担全部操作和解释，孩子只观看，就没有真正参与调查。\u003c/p\u003e\n\u003cp\u003e户外观察可以选择一棵树、一块阴影或某种常见声音，多次回到同一位置比较。避免抓取不明动植物、入口尝试或进入危险水域。探索与安全约束可以同时存在，限制危险不等于取消好奇。\u003c/p\u003e\n\u003ch3 id=\"c07-s004\"\u003e7.5　四岁半至五岁：规则、轮流与修复\u003c/h3\u003e\n\u003cp\u003e选择规则少且结束清楚的游戏，开始前确认怎样轮流、发生争议找谁。不要由输的一方随时改规则，也不偷偷作弊保证孩子一直赢。成人自己失误时可以示范承认与继续。\u003c/p\u003e\n\u003cp\u003e输后允许失望，平静后讨论策略、再玩或结束。不要用输不起以后怎么办进行人格评判。情绪恢复不必通过强迫继续到表现合格完成。\u003c/p\u003e\n\u003cp\u003e合作任务可让两人各搭一段路再连接。接不上时共同讨论调整，不由成人直接重建。孩子获得的是别人计划也影响结果的信息。修复争执可以是归还、收拾、重新约定，不只表演道歉。\u003c/p\u003e\n\u003ch3 id=\"c07-s005\"\u003e7.6　五至五岁半：数字、文字与时间服务生活\u003c/h3\u003e\n\u003cp\u003e分餐具时数实际人数，让每个人对应一份。数错重新对应，不通过增加背数上限掩盖理解。比较长短、多少、轻重用安全实物，不让孩子拿过重物品证明能力。\u003c/p\u003e\n\u003cp\u003e时间从早餐后、出门前、今天、明天等真实顺序进入。日历标记实际事件，不急于要求理解所有抽象单位。等待时可以用看得见的短过程提示，例如歌曲结束换人，而不是不断说等一下。\u003c/p\u003e\n\u003cp\u003e文字从姓名、标识、故事和本人想传达的话进入。孩子口述一句，成人写出再读，让其理解文字能够保存意思。书写需考虑舒适和精细动作，不用长时间描摹替代语言理解。\u003c/p\u003e\n\u003ch3 id=\"c07-s006\"\u003e7.7　五岁半至六岁：入学首先是生活过渡\u003c/h3\u003e\n\u003cp\u003e了解学校作息、饮水、厕所、午餐、接送与求助方式。练习向负责成人说不舒服、找不到东西和需要帮助。会背课文不能代替这些能力，成绩准备也不能掩盖环境是否可及。\u003c/p\u003e\n\u003cp\u003e成人陪同走真实通学路线，认识路口、出入口和走失时的安全求助。记住规则不代表能够独立应对复杂交通，独立出行要看能力、环境和当地要求。不要为了训练勇敢让孩子独自完成超出能力的路线。\u003c/p\u003e\n\u003cp\u003e书包只放真正需要的用品，知道每样用途和固定位置。回家有放包、洗手与恢复的过渡，不立刻切到第二轮课程。需要特殊沟通、用药、行动或感觉支持的孩子，应提前与学校落实适配，而非等反复失败才开始。\u003c/p\u003e\n\u003ch3 id=\"c07-s007\"\u003e7.8　阅读的三个层次\u003c/h3\u003e\n\u003cp\u003e共同享受是第一层：故事、图片与语言节奏，可以反复选同一本。成人无需每页考试，允许叙事完整流动。第二层是理解：角色想做什么、遇到什么、结果怎样，回到图文找依据。第三层是表达：换个结局、给角色写话、把自己的经历画出来。\u003c/p\u003e\n\u003cp\u003e材料不必昂贵，借书、讲熟悉故事和家庭口述都可使用。面对看不懂的内容，先补词语、背景和图片解释，不立刻归因于不认真。语言或视听困难需要适当评估，阅读时长不能代替必要支持。\u003c/p\u003e\n\u003cp\u003e孩子的解释与成人不同，可以问从哪里看出。合理的不同解读不必统一；明显误解则温和回到材料。这样既保留想象，也练习结论与依据之间的连接。\u003c/p\u003e\n\u003ch3 id=\"c07-s008\"\u003e7.9　艺术不是提前进入评比\u003c/h3\u003e\n\u003cp\u003e绘画先给安全材料，再问在做什么，不从第一笔纠正比例。音乐可比较快慢、强弱和停顿，避免靠近耳部的高声刺激。舞动探索节奏与空间，不一定转成舞台整齐。\u003c/p\u003e\n\u003cp\u003e展示作品征求孩子意愿，不是每次进步都要拍照发布。保留少量本人选的作品，其他可回收，避免家庭变成果仓库。孩子可以只享受过程，不必把兴趣发展成特长。\u003c/p\u003e\n\u003cp\u003e选择课程看是否安全、被尊重、愿意参与，教师怎样对待错误、拒绝和疼痛。价格、奖牌与考级不能单独证明适合。试听后听孩子描述具体体验，不只听机构评价。\u003c/p\u003e\n\u003ch3 id=\"c07-s009\"\u003e7.10　同伴关系不等于讨好所有人\u003c/h3\u003e\n\u003cp\u003e可以喜欢不同游戏、暂时独处或拒绝某种玩法。成人不以别人会不喜欢你控制所有行为。礼貌与边界并存，孩子不必用牺牲舒适换取接纳。\u003c/p\u003e\n\u003cp\u003e说没人跟我玩时了解具体情境：一次未加入，兴趣不同，长期排斥还是持续伤害。不要立刻要求送礼、道歉或变活泼。必要时由机构成人提供保护与参与机会。\u003c/p\u003e\n\u003cp\u003e加入游戏可以练具体句子，例如你们还需要一个送货的人吗。未成功时寻找其他活动，不把一次拒绝变成个人价值判断。持续排斥或伤害需升级处理，不让孩子独自承担改善群体环境的责任。\u003c/p\u003e\n\u003ch3 id=\"c07-s010\"\u003e7.11　卫生与身体参与\u003c/h3\u003e\n\u003cp\u003e成人持续监督并必要协助刷牙，直到孩子有能力有效完成；能拿牙刷不等于能清洁。含氟牙膏的年龄用量与牙科安排统一见卷十九。\u003ca href=\"#s61\"\u003eS61\u003c/a\u003e 洗手拆为可参与步骤，水温、滑倒和清洁用品安全由成人控制。\u003c/p\u003e\n\u003cp\u003e衣物适合活动和如厕，鞋合脚并适合场景。检查标签、袜口、鞋内异物和摩擦，持续拒绝某件衣服先了解不适。不是所有感觉差异都应靠坚持穿来克服。\u003c/p\u003e\n\u003cp\u003e身体不适可以报告，休息不需先证明严重。学校或家庭若要求忍痛参与，应重新检查规则。疼痛与疲劳的表达能力也是需要培养的生活能力。\u003c/p\u003e\n\u003ch3 id=\"c07-s011\"\u003e7.12　活动与空白时间\u003c/h3\u003e\n\u003cp\u003e主动活动应分散在全天，不能久坐一天后仅靠一节课补偿。WHO五岁以下指南强调主动游戏、减少长时间受限和久坐，具体参考在运动卷。\u003ca href=\"#s62\"\u003eS62\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e保留没有预设学习目标的时间。发呆、重复摆物、观察同一件事不必立刻增加刺激。可用材料与陪伴支持无聊，而不是每次用屏幕填补。\u003c/p\u003e\n\u003cp\u003e户外要考虑高温、空气、雷雨、交通与场地，不以全年打卡忽视风险。活动后若长期影响进食、睡眠和情绪，应调整负担。参与的目标是持续生活，不是证明能承受最多安排。\u003c/p\u003e\n\u003ch3 id=\"c07-s012\"\u003e7.13　用观察替代标签\u003c/h3\u003e\n\u003cp\u003e把注意力差改成在哪种环境难完成什么任务，把胆小改成陌生场景需要多久熟悉，把脾气大改成转换活动需要怎样预告。具体描述能指向支持，标签只能反复确认成人原有印象。\u003c/p\u003e\n\u003cp\u003e每月只选一个真实问题观察，记情境、行为、回应与结果，不全天采集。跨场景持续困难、明显生活影响或能力退步时寻求评估，不以家庭实验无限替代。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开学前日程P：有集体生活与没有集体生活\u003c/summary\u003e\n\u003cp\u003e有幼儿园时，家庭补足稳定回应、自由游戏、适合活动、进餐与休息，不复制全部课程。接回后先了解身体需要与情绪。\u003c/p\u003e\n\u003cp\u003e没有幼儿园时，一天围绕一个完整生活活动，如准备简单点心、整理角落或观察天气。安排主动探索、休息、同伴机会与自由游戏，社会接触不必等同付费课程。\u003c/p\u003e\n\u003cp\u003e睡前可问今天什么有趣、是否需要帮助，孩子不想回答也可以。次日新增内容以平静完成为限，基础照护和关系优先，练习没有补课债。\u003c/p\u003e\n\u003c/details\u003e\n\u003cp\u003e不要在六岁前用一项表现给人生封顶。可以承认当前优势与困难，同时保留改变空间。最值得积累的是问题可以拆开、错误可以修复、身体值得照顾、求助可以得到回应的经验。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c07-s000","title":"7.1　从单项技能转向完整活动"},{"id":"c07-s001","title":"7.2　三至三岁半：语言用来表达，而不只回答"},{"id":"c07-s002","title":"7.3　三岁半至四岁：同一个身体可以有不同解法"},{"id":"c07-s003","title":"7.4　四至四岁半：从为什么到小型调查"},{"id":"c07-s004","title":"7.5　四岁半至五岁：规则、轮流与修复"},{"id":"c07-s005","title":"7.6　五至五岁半：数字、文字与时间服务生活"},{"id":"c07-s006","title":"7.7　五岁半至六岁：入学首先是生活过渡"},{"id":"c07-s007","title":"7.8　阅读的三个层次"},{"id":"c07-s008","title":"7.9　艺术不是提前进入评比"},{"id":"c07-s009","title":"7.10　同伴关系不等于讨好所有人"},{"id":"c07-s010","title":"7.11　卫生与身体参与"},{"id":"c07-s011","title":"7.12　活动与空白时间"},{"id":"c07-s012","title":"7.13　用观察替代标签"}]},{"id":8,"title":"卷八　六至十二岁：学习方法、生活能力与同伴世界","html":"\u003ch2\u003e卷八　六至十二岁：学习方法、生活能力与同伴世界\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c08\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c08-s000\"\u003e8.1　学校不是全部人生\u003c/h3\u003e\n\u003cp\u003e若睡眠、活动、进餐和家庭交流都为学业不断让路，短期成绩即使提高，也不能直接说明整体生活更优。本卷把学习、身体、关系、自理与探索并列，允许每日比重不同，但不让基础领域长期消失。\u003c/p\u003e\n\u003cp\u003e学校归属意味着学生感到被成人和同伴关心、重视与支持，它不是可有可无的装饰。\u003ca href=\"#s65\"\u003eS65\u003c/a\u003e 所以下面逐年新增任务既包括学习，也包括求助、边界、交通和真实生活。\u003c/p\u003e\n\u003cp\u003e这些年份是可调整编排。教育制度、入学年龄、残障和个人发展会改变顺序，每年新增一项稳定责任已有意义，不必一次接管全部生活。\u003c/p\u003e\n\u003ch3 id=\"c08-s001\"\u003e8.2　六岁：建立可以恢复的学习日\u003c/h3\u003e\n\u003cp\u003e前晚准备常用物，晨间给早餐、如厕和出门留余地。不要同时纠正衣着、追问成绩、批评速度又补讲知识。稳定起点比不断提前叫醒更值得先尝试。\u003c/p\u003e\n\u003cp\u003e放学后先转换状态：饮水、适当进食、活动或安静休息，再看作业。先确认知道要做什么，再判断会不会做。卡住可能是没听懂、看不清、写得疼、忘记方法或情绪过载，不能统一要求认真。\u003c/p\u003e\n\u003cp\u003e本年责任可选收好自己的学习材料。成人提供少量清单和固定位置，逐步减少提醒。遗忘后修流程，不故意长期让孩子承受羞辱来证明责任心。\u003c/p\u003e\n\u003ch3 id=\"c08-s002\"\u003e8.3　七岁：错误变得可定位\u003c/h3\u003e\n\u003cp\u003e选一次练习，将错误分成概念不懂、步骤漏掉、题意误解和偶然笔误。每类一个代表即可，不把整页反复抄写。下一次需要改哪个动作，比总是粗心更有用。\u003c/p\u003e\n\u003cp\u003e阅读从读出声走向说明意思。用自己的话讲一小段，再回原文找依据。讲不出先看词汇、背景和理解，缩短材料或补解释后再试，不直接提高阅读时长。\u003c/p\u003e\n\u003cp\u003e本年生活责任可是一段洗漱整理，成人保留必要检查。另有一项不以成绩为目的的体验，如简单手工、球类或种植，观察普通练习中是否仍愿意参与，不只看初次新鲜感。\u003c/p\u003e\n\u003ch3 id=\"c08-s003\"\u003e8.4　八岁：第一次独立小项目\u003c/h3\u003e\n\u003cp\u003e项目可以是路线图、游戏、模型或主题展示。先确定看得见的结果，再列材料、步骤和需要帮助处。成人控制范围，不替孩子做成展示级作品。\u003c/p\u003e\n\u003cp\u003e每天推进一个步骤，结束知道下一步。失败后看目标是否太大、材料是否合适、时间是否足够，不只归因于努力。保留中间结果，可以比较预测与现实。\u003c/p\u003e\n\u003cp\u003e本年责任可参与采购：列几项、找货、比较数量、核对买齐。重点是需求与约束，不是提前接触复杂金融产品。社交上问谁让孩子感到安全、争执找谁，不只统计朋友多少。\u003c/p\u003e\n\u003ch3 id=\"c08-s004\"\u003e8.5　九岁：理解规则的目的\u003c/h3\u003e\n\u003cp\u003e讨论一条家庭规则保护什么、代价是什么、能否改善。例如设备充电位置为了睡眠与管理，不是证明权威。不能解释的规则也值得成人重新检查。\u003c/p\u003e\n\u003cp\u003e看到广告时问谁在说、是否出售东西、有没有其他解释。识别商业意图不是不信任所有人，而是增加核对步骤。成人自己的购买也可以示范暂停。\u003c/p\u003e\n\u003cp\u003e本年可管理一个范围有限的小预算，金额按家庭实际，允许可承受失误而非无限追加。记录买了什么、是否真正使用，比复杂收益计算更适合。运动选择保留多样性，不因体形或竞技成绩排除参与。\u003c/p\u003e\n\u003ch3 id=\"c08-s005\"\u003e8.6　十岁：自己安排顺序\u003c/h3\u003e\n\u003cp\u003e给几个真实任务和结束时间，让孩子先排顺序并说明理由。只提醒安全和明显不可行的部分，不立即改成成人版本。结束比较预计与实际，修下一次。\u003c/p\u003e\n\u003cp\u003e学习时开始先回忆再看答案，具体方法在卷二十三。熟悉不等于会用，暴露不知道是获得信息，不是丢脸。本年家务可承担一个完整链，如整理衣物或准备简单冷餐。\u003c/p\u003e\n\u003cp\u003e刀具、热源和电器权限按实际能力、环境与成人指导逐步增加，不由生日自动授权。身体变化教育也应提前提供，不等变化已发生才让孩子独自害怕。\u003c/p\u003e\n\u003ch3 id=\"c08-s006\"\u003e8.7　十一岁：自我评价不只剩排名\u003c/h3\u003e\n\u003cp\u003e一起看理解、表达、合作、创作、运动、耐心、求助与修复等维度，不要求每项优秀。用具体事实谈进步，也承认真正困难，不用空泛赞美掩盖问题。\u003c/p\u003e\n\u003cp\u003e共同明确私人信息和安全例外。普通日记、身体隐私与同伴聊天应尊重；威胁、伤害、勒索或迫近危险需要适当成人帮助。不能把保护扩展为永久无边界监视。\u003c/p\u003e\n\u003cp\u003e本年练习自己向老师或服务人员提出问题。提前演练，必要时陪同，但让本人表达。沟通障碍可用替代方式，不以口头流利作为独立唯一标准。\u003c/p\u003e\n\u003ch3 id=\"c08-s007\"\u003e8.8　十二岁：进入共同决策\u003c/h3\u003e\n\u003cp\u003e重新协商睡眠、设备、外出、活动与学习规则，给权限增加一条透明路径，不让孩子靠猜测成人心情争取自由。权限与责任可以同时逐步增加。\u003c/p\u003e\n\u003cp\u003e就医时让孩子先描述症状、理解相关药物和过敏信息，适当情况下获得私人交流。家长补充而非全程代答。本年责任可管理一周计划，知道考试、生病或活动改变时怎样调整。\u003c/p\u003e\n\u003cp\u003e进入青春期前至少知道：身体变化可以提问，压力可以拒绝，受伤害可以求助，成绩不决定是否值得被爱。这些信息需要在成人行动中得到验证。\u003c/p\u003e\n\u003ch3 id=\"c08-s008\"\u003e8.9　学业困难先分流，不先加时间\u003c/h3\u003e\n\u003cp\u003e持续读写困难先了解视听、语言背景、教学匹配和具体过程。看不清、听漏指令、书写疼痛或基础缺口都可能表现为不专心。长期问题需要教育与医疗评估，不只提高监督强度。\u003c/p\u003e\n\u003cp\u003e作业过长时记录几天的任务类型和卡点，带给教师讨论。把写到很晚拆成哪类占时、是否重复已会内容、是否未理解就要求速度。必要适配不应等同降低尊重，也不能把成本全放在睡眠。\u003c/p\u003e\n\u003cp\u003e训练前写清目标和复查时间。只在课程内得分提高，实际学校任务仍一样困难，应重新评估，不自动续费更多课时。真正效果应能转移到本人需要的场景。\u003c/p\u003e\n\u003ch3 id=\"c08-s009\"\u003e8.10　运动不是惩罚，也不只为比赛\u003c/h3\u003e\n\u003cp\u003e六至十七岁一般目标为每日至少六十分钟中高强度活动，并在一周中包含高强度、肌肉和骨骼强化活动，学校、游戏与出行可计入，不必全部成为训练课。\u003ca href=\"#s32\"\u003eS32\u003c/a\u003e 疾病或残障按能力与专业建议适配。\u003c/p\u003e\n\u003cp\u003e安全步行、课间、球类、舞蹈、游泳课程或其他喜欢形式都可构成机会。持续疼痛、胸部不适、明显头晕和异常气短要停止并评估，不能以坚持压过症状。\u003c/p\u003e\n\u003cp\u003e头部撞击后症状可能延迟。头痛加重、反复呕吐、混乱、难唤醒、抽搐或神经异常需紧急就医；疑似脑震荡不继续参赛。\u003ca href=\"#s63\"\u003eS63\u003c/a\u003e 恢复学习与运动按个体计划，不能因重要比赛绕过评估。\u003c/p\u003e\n\u003ch3 id=\"c08-s010\"\u003e8.11　欺凌与普通冲突\u003c/h3\u003e\n\u003cp\u003e欺凌涉及实际或感知的权力不平衡，以及重复或可能重复的伤害，可表现为攻击、威胁、羞辱、散谣或故意排斥，不只是打架。\u003ca href=\"#s64\"\u003eS64\u003c/a\u003e 普通力量相近的分歧需要协商，持续权力性伤害需要保护。\u003c/p\u003e\n\u003cp\u003e孩子报告时先保证安全，明确告诉孩子：“受到欺凌不是你的错，向可信赖的成人求助也没有错。”保存必要事实，联系学校责任人，要求具体措施和复核日期。不只要求更强硬、送礼求和或反复回到危险场景证明勇敢。\u003c/p\u003e\n\u003cp\u003e对实施伤害者，停止行为、承担适当责任并了解背景；困难不能为伤害开脱。旁观者可安全求助、支持受害者、不传播羞辱内容，不要求独自冒险制止一切。\u003c/p\u003e\n\u003ch3 id=\"c08-s011\"\u003e8.12　数字世界通行规则\u003c/h3\u003e\n\u003cp\u003e独立使用前约定目的、地点、结束信号、付费权限和不适内容求助。关闭不需要的公开定位和陌生人联系，不将真实姓名、学校、住址与日程拼成公开画像。\u003c/p\u003e\n\u003cp\u003e三个暂停点：有人要求秘密、转钱、私密图像或个人信息。孩子不必先判断对方是不是坏人，先停止并找可信成人。成人承诺先解决安全，不因违反过小规则拒绝帮助。\u003c/p\u003e\n\u003cp\u003e监护应说明范围、原因、期限与退出条件，随能力增长调整。不能让所有隐私永久成为获得一点自由的交换品。数字工具既提供学习，也有消费和操控风险，具体信息判断见卷二十三。\u003c/p\u003e\n\u003ch3 id=\"c08-s012\"\u003e8.13　家务与金钱的边界\u003c/h3\u003e\n\u003cp\u003e区分共同生活基础责任与可协商报酬的额外任务。家庭可有不同规则，但不把所有互助变交易，也不让孩子长期填补成人缺位。家务要适龄、安全、占时合理。\u003c/p\u003e\n\u003cp\u003e金钱从需要和想要、一次购买和持续成本、借用和拥有进入。买东西可问放哪里、多久用、坏了怎么办。孩子可以理解家庭有预算，但不承担父母债务和关系冲突。\u003c/p\u003e\n\u003cp\u003e经济困难时解释哪些选择需要变，仍明确基本照护由成人负责。不要通过恐吓自己可能被抛弃来促使节约；也不让孩子因同伴消费不同而承担家庭比较压力。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开学龄日程K\u003c/summary\u003e\n\u003cp\u003e晨间基础照护与出门，不加临时训练。学校期间饮水、如厕、活动与必要药物确实可及。回家转换后做范围清楚的任务，中间有移动和休息。\u003c/p\u003e\n\u003cp\u003e每天保留非评价交流或共同活动，夜间准备次日用品，避免睡前高压力争论。睡眠范围见卷十六，完成无限作业不是睡觉许可条件。\u003c/p\u003e\n\u003cp\u003e周末补生活多样性而非补满全部课程。考试周保留最低底座，生病时使用恢复分支，未完成的非必要任务可取消，不以熬夜追偿。\u003c/p\u003e\n\u003c/details\u003e\n\u003ch3 id=\"c08-s013\"\u003e8.14　年度验收看支持有没有到位\u003c/h3\u003e\n\u003cp\u003e每年问：困难时知道找谁吗，能表达身体需要吗，有不被成绩评价的关系吗，是否获得一项更独立的生活能力，学校和家庭有哪些障碍需要改变。答案差时不全面加码，先修最限制生活的一环。\u003c/p\u003e\n\u003cp\u003e可能真正需要的是合适眼镜、学习适配、一个愿意听的老师或停止辱骂的家庭环境，而不是更复杂的自律系统。帮助孩子识别和改善环境，也是学习如何生活。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c08-s000","title":"8.1　学校不是全部人生"},{"id":"c08-s001","title":"8.2　六岁：建立可以恢复的学习日"},{"id":"c08-s002","title":"8.3　七岁：错误变得可定位"},{"id":"c08-s003","title":"8.4　八岁：第一次独立小项目"},{"id":"c08-s004","title":"8.5　九岁：理解规则的目的"},{"id":"c08-s005","title":"8.6　十岁：自己安排顺序"},{"id":"c08-s006","title":"8.7　十一岁：自我评价不只剩排名"},{"id":"c08-s007","title":"8.8　十二岁：进入共同决策"},{"id":"c08-s008","title":"8.9　学业困难先分流，不先加时间"},{"id":"c08-s009","title":"8.10　运动不是惩罚，也不只为比赛"},{"id":"c08-s010","title":"8.11　欺凌与普通冲突"},{"id":"c08-s011","title":"8.12　数字世界通行规则"},{"id":"c08-s012","title":"8.13　家务与金钱的边界"},{"id":"c08-s013","title":"8.14　年度验收看支持有没有到位"}]},{"id":9,"title":"卷九　十二至十八岁：把身体、判断与边界逐步交还本人","html":"\u003ch2\u003e卷九　十二至十八岁：把身体、判断与边界逐步交还本人\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c09\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c09-s000\"\u003e9.1　责任与权限必须一起增长\u003c/h3\u003e\n\u003cp\u003e家长继续承担必要保护、资源和医疗责任，青少年则需要越来越真实的选择。不能一面要求像成人负责，一面不给生活决定权。可以自主选择房间安排、部分时间、兴趣与求助对象，同时了解哪些情境需要成人参与。\u003c/p\u003e\n\u003cp\u003e青春期开始和进程存在差异，不依据同学身高、声音、体形或月经给人排名。明显过早、过晚、进程停滞、疼痛或强烈困扰应评估，不自行购买激素、增高或发育套餐。\u003ca href=\"#s67\"\u003eS67\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e身体讨论分成事实、当前不便、可提供支持三层。月经先解决用品和疼痛求助，声音变化不模仿取笑，痤疮不成为自律评分。让人愿意继续提问，是安全的重要条件。\u003c/p\u003e\n\u003ch3 id=\"c09-s001\"\u003e9.2　十二岁：私人空间与求助并存\u003c/h3\u003e\n\u003cp\u003e约定进房先敲门，更衣和身体检查尊重遮挡，家庭群不随意公布照片、病史或成绩。隐私不等于必须独自承担危险；威胁、胁迫和让人害怕的秘密可以告诉可信成人。\u003c/p\u003e\n\u003cp\u003e管理一套随身用品：饮水、必要卫生用品、交通与紧急联系，医疗用品按成人和团队确认的权限保管。重点是位置、补充和丢失处理，不是品牌。\u003c/p\u003e\n\u003cp\u003e说出三类求助入口：学习、身体、人身安全。家长不必是所有问题唯一入口，但应成为说出问题后不会首先受羞辱的入口。可以共同找学校或社区中真正可信赖的人，不只指定名单却从不建立联系。\u003c/p\u003e\n\u003ch3 id=\"c09-s002\"\u003e9.3　十三岁：理解同意\u003c/h3\u003e\n\u003cp\u003e同意应自愿、清楚、具体并可撤回。答应一次不代表以后都答应，关系亲密不等于拥有对方身体；沉默、僵住、醉酒或被威胁不能轻率当许可。它同样适用于拥抱、玩笑、拍照、公开内容和查看设备。\u003c/p\u003e\n\u003cp\u003e日常先练询问与停止。别人不愿拍照就不拍，不要求解释到筋疲力尽才允许拒绝。涉及未成年人的性接触和影像有当地法律与保护要求，不能只用双方愿意概括。成年人利用身份、资源或秘密控制关系时，应优先寻求保护。\u003c/p\u003e\n\u003cp\u003e性教育提供准确、适龄的身体知识、避孕与感染预防入口，允许没有兴趣或暂不想谈。不把一个问题自动解释为已经发生性行为，也不将性别表达差异当疾病或道德缺陷。具体个人医疗问题由适当专业人员处理。\u003c/p\u003e\n\u003ch3 id=\"c09-s003\"\u003e9.4　十四岁：给同伴压力一个退出路径\u003c/h3\u003e\n\u003cp\u003e区分可恢复的挑战与高代价风险。上台、参加社团或尝试新技能可能令人害怕但可安全探索；酒后骑乘、危险攀高和胁迫接触不能因大家都做就接受。\u003c/p\u003e\n\u003cp\u003e外出前明确回程、接应与求助。家庭可约定一句求助词，先接人离开现场，安全后再讨论责任。拒绝可以很短：我不做，我要走了。不必在压力场景赢辩论。\u003c/p\u003e\n\u003cp\u003e合理边界若换来持续威胁和羞辱，需要重新评估关系。成人也示范拒绝不合理要求，不能只让孩子独自对抗群体。安全计划应包括可靠交通，而非让另一个同样不清醒的朋友送回。\u003c/p\u003e\n\u003ch3 id=\"c09-s004\"\u003e9.5　十五岁：处理任务量与恢复的冲突\u003c/h3\u003e\n\u003cp\u003e青春期节律可能偏晚，学校要求却未必改变。检查作业、通勤、咖啡因、手机与焦虑，不只说早点躺下。大脑持续发展不表示青少年意见无效，也没有某个生日突然获得全部理性的开关。\u003ca href=\"#s66\"\u003eS66\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e从截止时间倒推，先放睡眠、吃饭、清洁和交通。超出容量时删减或协商，不让不足全部变熬夜。考试问题拆成概念、检索、审题、时间与紧张，对不同卡点采用不同方法。\u003c/p\u003e\n\u003cp\u003e明日任务分必须、可推进、可不做。家长检查现实性，不要求三栏全空。明显疲惫、持续失眠或生活功能下降时先处理状态，不能靠加课证明重视。\u003c/p\u003e\n\u003ch3 id=\"c09-s005\"\u003e9.6　十六岁：接触真实工作，但不急于定型\u003c/h3\u003e\n\u003cp\u003e选择低风险项目：采访从业者、志愿活动、做一个有人使用的小作品，或在合法保护下接触工作。责任、监督与退出清楚，不把危险劳动和无边界免费替岗包装为锻炼。\u003c/p\u003e\n\u003cp\u003e职业观察不只看收入。一天做什么，能力从哪里来，最消耗什么，失败后能否转向？把喜欢游戏拆成叙事、竞争、系统、美术或社交，把想学医拆成愿意长期学习、接触患者、面对不确定和承担责任。\u003c/p\u003e\n\u003cp\u003e新练习是追溯一条重要消息：找到初始来源，区分事实、评论与广告，找一个可能反例。身体、升学捷径和投资类内容尤其不能仅因转发多而接受。\u003c/p\u003e\n\u003ch3 id=\"c09-s006\"\u003e9.7　十七岁：独立办事与就医表达\u003c/h3\u003e\n\u003cp\u003e在当地规定允许范围内，让本人描述症状、提问、复述下一步，家长补充而非全程代答。知道过敏、重要病史、药物和证件位置。私人健康问题无需向每位亲戚说明。\u003c/p\u003e\n\u003cp\u003e办理报名、交通、住宿和支付时核对对象、金额、期限、退款、隐私授权与求助。未取得相应法律资格的事务由合适监护人处理，不能以独立训练越权签约。\u003c/p\u003e\n\u003cp\u003e试住或集体活动前练完整链：起床、找路、进食、洗衣、保管财物、身体不适与联系支持。小失误修流程，药物、过敏、火灾和人身安全缺口则先补好再独立。\u003c/p\u003e\n\u003ch3 id=\"c09-s007\"\u003e9.8　十八岁入口：支持不应突然撤走\u003c/h3\u003e\n\u003cp\u003e成年权限因地区和事务不同，不是十八岁所有规则同时切换。讨论哪些决定由本人承担，经济支持是什么，共同生活怎样协商，出现疾病、失业和重大错误时有哪些帮助。\u003c/p\u003e\n\u003cp\u003e支持条件应提前明确。学费是否附带专业要求，住宿是否有边界，钱是借款还是赠与，不能事后用未说出的条件惩罚选择。亲密不等于交出全部密码和关系决定权。\u003c/p\u003e\n\u003cp\u003e独立不是不用别人，而是知道自己能处理什么、需要怎样帮助、如何对承诺负责。能够承认不会，是比表演无所不能更重要的成年能力。\u003c/p\u003e\n\u003ch3 id=\"c09-s008\"\u003e9.9　月经、皮肤、体味与体形\u003c/h3\u003e\n\u003cp\u003e记录月经开始、明显生活影响、异常出血和疼痛即可，不必追踪每个感觉。疼痛严重、显著加重、经常影响上学或伴异常出血等，应评估，不能因女性都这样长期忍耐。\u003ca href=\"#s68\"\u003eS68\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e清洁与衣物按实际需要安排，运动后换潮湿衣物，用品保持卫生。痤疮不同时叠加多种刺激产品，不挤压后再强刺激消毒；疼痛、留疤或严重困扰时寻求皮肤科支持，完整协议见卷十九。\u003c/p\u003e\n\u003cp\u003e体形变化不自动触发减肥。不要当众评价胸部、体毛、肌肉和臀腿，也不无条件赞美体重下降。进食障碍可发生在不同体重与性别人群，限制、失控进食、代偿或强迫运动应认真评估，不奖励意志力。\u003ca href=\"#s69\"\u003eS69\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c09-s009\"\u003e9.10　尼古丁、酒精与提神捷径\u003c/h3\u003e\n\u003cp\u003e对未吸烟青少年，电子烟不是健康入门品，气溶胶不是单纯水蒸气，尼古丁有成瘾风险。已使用者需要适龄戒除支持而非羞辱到隐瞒。\u003ca href=\"#s70\"\u003eS70\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e高咖啡因饮料、来源不明聪明药、他人处方兴奋剂或健身药物，不能作为考试和体形工具。药物适应证需要医疗判断，不能复制同伴体感；受监管物质还须遵守当地法律。\u003c/p\u003e\n\u003cp\u003e询问第一次接触发生在什么情境、想解决什么问题。压力、孤独、好奇与同伴需求要分别处理，单纯没收不一定改变需求。寻求帮助不应自动招致羞辱性公开。\u003c/p\u003e\n\u003ch3 id=\"c09-s010\"\u003e9.11　不能只当作叛逆的变化\u003c/h3\u003e\n\u003cp\u003e持续退缩、兴趣丧失、功能下降、自伤言论、危险性明显增加、睡眠饮食显著改变或遭受胁迫，需要认真听取和适当帮助。一次沉默不诊断疾病，成绩好也不排除困难。\u003c/p\u003e\n\u003cp\u003e可以直接平静询问是否想伤害自己。存在即时风险时陪同、在安全可行范围内移开危险物并联系当地急救或危机服务；不要让同龄朋友独自承担保密救援责任。详细心理分流见卷二十二。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开青少年日程A\u003c/summary\u003e\n\u003cp\u003e晨间确认用品、交通和主要任务。白天履行学校责任，同时保障如厕、饮水、活动、必要医疗和真实交流。身体不适允许报告。\u003c/p\u003e\n\u003cp\u003e放学先看饥饿、疲惫、情绪与任务量，再排学习。卡点写成问题，不在同一错误上熬到深夜。兴趣可轮换，不要求每天各领域最高水平。\u003c/p\u003e\n\u003cp\u003e晚间保留私人时间，准备次日后结束工作。设备规则共同协商并对成人同样适用，临睡前不启动审判谈话。持续功能变化切求助分支，不靠更严打卡解决。\u003c/p\u003e\n\u003c/details\u003e\n\u003cp\u003e本阶段要交给青少年的，是理解身体、判断风险、维护边界、建立关系与求助的能力。保护的目的应当是支持逐步自主，而不是让依赖永久化。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c09-s000","title":"9.1　责任与权限必须一起增长"},{"id":"c09-s001","title":"9.2　十二岁：私人空间与求助并存"},{"id":"c09-s002","title":"9.3　十三岁：理解同意"},{"id":"c09-s003","title":"9.4　十四岁：给同伴压力一个退出路径"},{"id":"c09-s004","title":"9.5　十五岁：处理任务量与恢复的冲突"},{"id":"c09-s005","title":"9.6　十六岁：接触真实工作，但不急于定型"},{"id":"c09-s006","title":"9.7　十七岁：独立办事与就医表达"},{"id":"c09-s007","title":"9.8　十八岁入口：支持不应突然撤走"},{"id":"c09-s008","title":"9.9　月经、皮肤、体味与体形"},{"id":"c09-s009","title":"9.10　尼古丁、酒精与提神捷径"},{"id":"c09-s010","title":"9.11　不能只当作叛逆的变化"}]},{"id":10,"title":"卷十　十八至三十岁：建成可以独立运行的生活","html":"\u003ch2\u003e卷十　十八至三十岁：建成可以独立运行的生活\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c10\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e已经使用烟草的人，不只需要知道危害，还需要可进入的戒烟支持。成人可把行为支持、合适药物与复查安排组合讨论，而不是把反复尝试等同意志薄弱；具体路径见\u003ca href=\"#r31-tobacco\"\u003e戒烟行动卡\u003c/a\u003e。\u003ca href=\"#s155\"\u003eS155\u003c/a\u003e 血脂、乙肝状态和适龄筛查则放入\u003ca href=\"#r31-prevention\"\u003e个人预防总表\u003c/a\u003e，不等到中年才第一次整理既往结果。\u003c/p\u003e\n\u003ch3 id=\"c10-s000\"\u003e10.1　先画生活地图\u003c/h3\u003e\n\u003cp\u003e这一阶段可能在升学、工作、迁移、照护家人、康复或探索，不只有大学到第一份工作的路线。共同任务是看懂自己的生活输入、承诺和求助路径，不以学历、职业起点和离家早晚判断成熟。\u003c/p\u003e\n\u003cp\u003e生活地图写住所、食物、收入或支持、医疗、交通、紧急联系和需要别人协助的任务。地图应指出断点：收入尚可但病时无人送餐，住所安全但通勤使工作难持续，技能足够但重要资料全在一台易失设备上。\u003c/p\u003e\n\u003cp\u003e每天新增动作可以很小：找到基层医疗入口、保存离线紧急联系、做一顿可重复饭、确认室友规则。它们比购买一套自律设备更直接决定高压时期能否继续生活。\u003c/p\u003e\n\u003ch3 id=\"c10-s001\"\u003e10.2　十八至二十岁：自由意味着看见成本\u003c/h3\u003e\n\u003cp\u003e晚睡、社交、兼职、学习和旅行都可能是选择，但同一段身体、时间和经济预算不能重复使用。先填真实固定事项，再决定剩余时间，不从理想清单反推不存在的额外小时。\u003c/p\u003e\n\u003cp\u003e集体居住提前确认噪声、清洁、访客、公共物品、过敏与费用。写成行为：夜间能否外放，谁清洗水槽，访客是否过夜，而不是大家自觉。冲突先描述影响和请求，不评价人格教养。\u003c/p\u003e\n\u003cp\u003e离开熟悉环境保留一个稳定联系点。新关系从共同活动逐步建立，观察守约、尊重和分歧处理。孤独不必通过迅速进入亲密关系解决，倾诉全部隐私也不是建立信任的必经步骤。\u003c/p\u003e\n\u003ch3 id=\"c10-s002\"\u003e10.3　二十一至二十三岁：学习开始面向真实使用者\u003c/h3\u003e\n\u003cp\u003e接任务先确认交付物、使用者、期限、资源和验收。陌生任务可先做小样确认理解，再投入全部精力。问清不等于能力不足，在错误方向安静努力才容易浪费。\u003c/p\u003e\n\u003cp\u003e作品记录包含问题、方法、约束、结果与改进，不只保存荣誉。涉及客户和雇主资料遵守授权，保留脱敏方法，不把机密原件当个人作品集。原始数据所有权与自己的经验要分开。\u003c/p\u003e\n\u003cp\u003e求职不只看名义工资，还看通勤、时段、训练支持、安全、结算和成本。合同按本地现行法律理解。要求先交高额费用、扣原件、替人担保或参与不明资金往来时暂停并独立核实。\u003c/p\u003e\n\u003ch3 id=\"c10-s003\"\u003e10.4　二十四至二十六岁：分清成长与单纯消耗\u003c/h3\u003e\n\u003cp\u003e忙不自动等于成长。检查是否积累可迁移能力、得到具体反馈、有适度新责任，身体和关系是否付出不可持续代价。任务增加但学习与自主不增加，应讨论优先级和资源，不只研究少睡一小时。\u003c/p\u003e\n\u003cp\u003e过量负荷、低控制、歧视与不安全环境可能成为心理健康风险，工作困扰不能全归个人抗压差。组织调整与合理支持同样重要。\u003ca href=\"#s71\"\u003eS71\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e常用问句是：这件事今天必须完成，哪件可延期？谁最终确认结果？继续前缺什么信息？把模糊压力转成可协商事项。暴力、骚扰或危险劳动不只是沟通技巧问题，应优先安全与专业支持。\u003c/p\u003e\n\u003ch3 id=\"c10-s004\"\u003e10.5　二十七至三十岁：决定哪些承诺值得长期化\u003c/h3\u003e\n\u003cp\u003e长期承诺包括关系、房屋、城市、创业、照护和治疗。决定前看退出成本、不可逆部分、最坏情境、对他人的影响，以及是否能小规模试验。过去投入不自动构成继续理由。\u003c/p\u003e\n\u003cp\u003e共同居住先讨论家务、财务、私人时间、访客、宠物、疾病和冲突。创业先验证需求、结算与基本交付，再增加不可回收投入。迁移先了解现实通勤、医疗与支持，不只喜欢旅行印象。\u003c/p\u003e\n\u003cp\u003e三十岁不是截止线。没有婚姻、房产或使命不等于失败。更重要的是选择越来越出于理解，还是越来越受比较驱动；是否保留调整路径，还是把全部资源锁进一个未经验证假设。\u003c/p\u003e\n\u003ch3 id=\"c10-s005\"\u003e10.6　个人医疗连续性\u003c/h3\u003e\n\u003cp\u003e第一次独立就医准备症状时间线：起始、频率、加重减轻、功能影响、相关用药和病史，不带一页未经验证的自我诊断。旧资料用于补充，不能掩盖今天的新变化。\u003c/p\u003e\n\u003cp\u003e离开诊室前确认判断、未确定之处、今天行动、复查、提前联系条件和结果由谁解释。拿到报告不等于完成医疗；待解释结果应保留为未闭环事项。\u003c/p\u003e\n\u003cp\u003e药物知道名称、目的、用法、主要注意和续药入口。不分享处方，不将不同药片混进无标签瓶，不凭网友经验处理漏服。完整用药协议见卷二十。\u003c/p\u003e\n\u003ch3 id=\"c10-s006\"\u003e10.7　亲密关系中的健康责任\u003c/h3\u003e\n\u003cp\u003e信任不能从外貌、职业和承诺推断感染状态。许多性传播感染可能无症状，预防结合适用疫苗、正确屏障措施和风险对应检测。\u003ca href=\"#s72\"\u003eS72\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e避孕与感染防护不同。某些避孕方法不提供感染保护，选择要看健康条件、偏好、可获得性和正确使用能力，而非只看宣传成功率。\u003ca href=\"#s73\"\u003eS73\u003c/a\u003e 具体药物由专业人员共同决定，不把月经应用当普遍可靠的独立方案。\u003c/p\u003e\n\u003cp\u003e保护失败、暴露或非自愿接触后尽早联系医疗和支持，因为某些处理有时间窗口。不要为避免尴尬等待数周，也不以反复清洗代替评估。本人可选择可信陪伴者，获得帮助不需要先向所有人解释。\u003c/p\u003e\n\u003ch3 id=\"c10-s007\"\u003e10.8　独居餐食的物流\u003c/h3\u003e\n\u003cp\u003e难点常不是知识，而是购买量、剩食、清洁与下班精力。准备少数可轮换组合：主食、蛋白来源、易处理蔬果和安全储存再加热。完整营养原则见卷十七，此处只解决执行。\u003c/p\u003e\n\u003cp\u003e采购按实际做饭天数，不按理想自律版本囤积。留一个安全可负担的备用餐，避免没做完美就不吃或吃变质食物。外食可在现有选项里改善，不需每餐称重。\u003c/p\u003e\n\u003cp\u003e无厨房时用正规餐食、适宜即食和合法安全加热方案。不要在禁明火或供电不足的住房硬搭厨房。环境限制必须进入设计，不能写成个人意志缺陷。\u003c/p\u003e\n\u003ch3 id=\"c10-s008\"\u003e10.9　钱先保护生活连续性\u003c/h3\u003e\n\u003cp\u003e区分固定、可调、债务和突发支出。储备没有普遍适用的月数，要看收入波动、公共保障、保险、支持网络和照护责任。目标是意外不立即迫使危险选择，而不是理财排名。\u003c/p\u003e\n\u003cp\u003e借贷投资前用自己的话说明最坏损失、何时发生、是否影响住房医疗与依赖者、对方利益关系和退出是否真实。解释不清先暂停。本书不推荐具体资产或杠杆，也不承诺收益。\u003c/p\u003e\n\u003cp\u003e与熟人涉及钱时明确赠与、借款、消费还是投资，保留适当记录。金额影响基本生活越大，越需要独立判断。感情不能替代双方对同一承诺的共同理解。\u003c/p\u003e\n\u003ch3 id=\"c10-s009\"\u003e10.10　运动习惯不依赖热血\u003c/h3\u003e\n\u003cp\u003e选择普通工作周能持续的形式，考虑地点、费用、交通、氛围和身体适配。新运动先学规则、防护与受伤求助，不复制熟手强度。总量和训练进阶在卷十八统一展开。\u003c/p\u003e\n\u003cp\u003e活动可嵌入生活，但不是所有碎片都必须锻炼。步行要安全路线，家练要稳定空间。身体不适或恢复期调整，不用连续打卡证明健康。\u003c/p\u003e\n\u003cp\u003e记录持续疼痛、睡眠影响、日常能力和精神状态，区分正常疲劳与需评估症状。长期参与通常比短期最高成绩更符合一般生活目标。\u003c/p\u003e\n\u003ch3 id=\"c10-s010\"\u003e10.11　建立不同功能的关系网络\u003c/h3\u003e\n\u003cp\u003e日常陪伴、共同兴趣、专业支持和紧急求助不必由一个人全包。低成本联系可以是散步、吃饭或共同完成小事，不把朋友管理成客户表。\u003c/p\u003e\n\u003cp\u003e进入不同生活阶段后联系节奏会变，先问怎样联系舒服，不用回复速度单独判断关系。求助尽量具体：陪一次就医、听十分钟、帮核对一份材料。别人做不到时找其他路径，不将一个拒绝解释为无人关心。\u003c/p\u003e\n\u003cp\u003e持续要求隐瞒、交出控制、切断外部联系或接受威胁的关系，进入安全分支。亲密不应让所有其他支持消失。\u003c/p\u003e\n\u003ch3 id=\"c10-s011\"\u003e10.12　从失败提取信息\u003c/h3\u003e\n\u003cp\u003e区分能力、信息、资源、时机和运气。哪些当时能核对却没核对，哪些不可合理预见，哪些目标不适合，哪些执行需改。既不全部归外部，也不全部归自己不够好。\u003c/p\u003e\n\u003cp\u003e短复盘写预期、实际、关键差异、保留、改变和停止。到能改变下一步就结束，不反复重播羞耻。失业或分手先恢复生活连续性，再作高不可逆决定，避免疲惫时同时重启所有领域。\u003c/p\u003e\n\u003ch3 id=\"c10-s012\"\u003e10.13　独立不是单机运行\u003c/h3\u003e\n\u003cp\u003e为了证明成年而拒绝任何支持，会增加不必要成本；反过来让别人永久替自己处理所有重要事务，也会减少选择。可以将任务分成已会、正在学、需要长期协助，分别设计下一步。\u003c/p\u003e\n\u003cp\u003e长期协助不一定是失败。有残障或疾病的人可以通过辅助技术、个人助理和制度支持独立决定生活；能够决定怎样被帮助，也是自主能力。评价应看掌控和参与，不只看是否亲手完成每一步。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开初成年接口Y\u003c/summary\u003e\n\u003cp\u003e普通工作学习日继承基础协议，安排一个主要交付和生活维护。每天最多新增一个现实需要的能力，掌握后折叠为常规。\u003c/p\u003e\n\u003cp\u003e探索日先写想了解的问题，选择低风险体验，结束记录改变判断的信息，不要求立即变收入或身份。失序日守住安全、供给、治疗和求助，先处理不可逆后果，其他逐步恢复。\u003c/p\u003e\n\u003cp\u003e不要用同时减肥、搬家、创业、断交和极端训练掩盖一个具体问题。真正的重启可以只是修复生活中最关键的一处断点。\u003c/p\u003e\n\u003c/details\u003e\n\u003chr/\u003e\n","sections":[{"id":"c10-s000","title":"10.1　先画生活地图"},{"id":"c10-s001","title":"10.2　十八至二十岁：自由意味着看见成本"},{"id":"c10-s002","title":"10.3　二十一至二十三岁：学习开始面向真实使用者"},{"id":"c10-s003","title":"10.4　二十四至二十六岁：分清成长与单纯消耗"},{"id":"c10-s004","title":"10.5　二十七至三十岁：决定哪些承诺值得长期化"},{"id":"c10-s005","title":"10.6　个人医疗连续性"},{"id":"c10-s006","title":"10.7　亲密关系中的健康责任"},{"id":"c10-s007","title":"10.8　独居餐食的物流"},{"id":"c10-s008","title":"10.9　钱先保护生活连续性"},{"id":"c10-s009","title":"10.10　运动习惯不依赖热血"},{"id":"c10-s010","title":"10.11　建立不同功能的关系网络"},{"id":"c10-s011","title":"10.12　从失败提取信息"},{"id":"c10-s012","title":"10.13　独立不是单机运行"}]},{"id":11,"title":"卷十一　三十至四十五岁：责任增加，不靠无限透支","html":"\u003ch2\u003e卷十一　三十至四十五岁：责任增加，不靠无限透支\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c11\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c11-s000\"\u003e11.1　新增变量是责任耦合\u003c/h3\u003e\n\u003cp\u003e这一时期可能有工作、养育、父母照护、创业或自身疾病，也可能没有这些典型情境。共同问题是，一个决定常同时影响收入、身体、关系和未来。晚间不能运动，可能不是不重视，而是接送、做饭和工作没有结束边界。\u003c/p\u003e\n\u003cp\u003e先画反复冲突的链条：什么触发，谁接手，哪里无备份，最后损失什么。修最上游可改变的一处，观察是否减少后续混乱。把所有问题都转成更早起、更晚睡，只是把系统缺口藏进身体。\u003c/p\u003e\n\u003ch3 id=\"c11-s001\"\u003e11.2　三十至三十四岁：承诺账本\u003c/h3\u003e\n\u003cp\u003e写清必须自己做、可以交接、只是一直自己做的事情。家务、照护、情绪支持、行政和恢复都算真实负担，不能只记录带来收入的工作。\u003c/p\u003e\n\u003cp\u003e接受长期承诺时问替代什么。答案若是只要努力就不影响，通常漏算时间或恢复。可设试行期、最低交付和退出条件；对依赖者的退出须有妥善接替，不将边界解释成突然失联。\u003c/p\u003e\n\u003cp\u003e完整交接包括发现、计划、执行和收尾。一个人永远提醒、安排与验收，其他人只临时帮忙，仍没有转移真正负担。明确责任链比增加待办应用更有用。\u003c/p\u003e\n\u003ch3 id=\"c11-s002\"\u003e11.3　三十五至三十九岁：恢复进入工作设计\u003c/h3\u003e\n\u003cp\u003e工作结束可以有收尾动作：记录停在哪、下一步、需要通知谁，然后关闭非必要入口。结束不是所有事情完成，而是未完成有可靠位置，不继续占满整晚注意。\u003c/p\u003e\n\u003cp\u003e密集会议和即时消息让人工作时无法完成工作，先查入口与权限，不只增加效率技巧。过量负荷、低控制和家庭工作冲突也属于环境问题，不应一律归个人抗压差。\u003ca href=\"#s71\"\u003eS71\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e保留真正恢复的空间，其形式可由本人选择，不必产生作品或被打分。若休闲同样带来强烈消费、竞争和义务，重新判断是否仍在恢复。\u003c/p\u003e\n\u003ch3 id=\"c11-s003\"\u003e11.4　四十至四十四岁：中途校准\u003c/h3\u003e\n\u003cp\u003e先看仍能做什么、什么变难、原因可能是健康、技能、环境还是负担。不要只看外貌老了多少。外观愿望可以被尊重，但不自动获得压过全部生活的优先级。\u003c/p\u003e\n\u003cp\u003e检查居住、工作、关系约定和兴趣是否仍适合。用小试验探索新安排，不为证明改变同时辞职、搬迁、借贷和断联。已经不再属于自己的目标可以停止，先处理承诺和损失，允许释然与悲伤并存。\u003c/p\u003e\n\u003cp\u003e减少一个长期耗损目标，可能比新增五个习惯更有效。校准是让计划再次服务本人，不是为过去选择寻找道德判决。\u003c/p\u003e\n\u003ch3 id=\"c11-s004\"\u003e11.5　身体变化不默认等于年龄\u003c/h3\u003e\n\u003cp\u003e持续疲劳、运动耐受下降、反复疼痛、无意体重变化或情绪功能改变，记录起始、相关事件、睡眠工作和药物，必要时就医。不要以中年为诊断，也不用抗衰套餐替代针对性问诊。\u003c/p\u003e\n\u003cp\u003e区分偶发且可恢复，与持续、进展和影响生活。紧急信号立即处理，非紧急但持续的问题预约评估，明确可观察的按计划复查。数据应回答具体问题，不用手表或体脂秤单次结果触发治疗。\u003c/p\u003e\n\u003ch3 id=\"c11-s005\"\u003e11.6　生育是分支，不是必经节点\u003c/h3\u003e\n\u003cp\u003e有意愿时双方共同核对健康、药物、既往妊娠和未来照护。计划自然妊娠、有规律未避孕性交且没有其他已知风险时，ASRM参考路径按拟妊娠者年龄与尝试时间讨论评估：三十五岁以下十二个月，三十五岁及以上六个月；四十岁以上可更早。月经明显异常、已知输卵管或男性因素等不必等满期限，双方评估应衔接，不只检查一方。\u003ca href=\"#s165\"\u003eS165\u003c/a\u003e具体路径见孕期卷，不只要求可能怀孕者调整生活。暂不生育选择适合避孕，不生育者可以建设支持与未来照护，孩子并不自动等于可靠养老系统。\u003c/p\u003e\n\u003cp\u003e治疗、流产或长期未受孕可能有身体、情绪与经济负担，不用放松就好带过，也不将结果归咎于一次情绪或一餐。专业评估与双方可承受边界一起进入决定，不无限追加。\u003c/p\u003e\n\u003ch3 id=\"c11-s006\"\u003e11.7　照护首先需要连续性\u003c/h3\u003e\n\u003cp\u003e不只算总小时，还看分布、能否离场、夜间打断与主照护者生病后的接替。一页交接表记录本人偏好、必要任务、异常、用品和专业联系。\u003c/p\u003e\n\u003cp\u003e真正替班需要知道怎样完成任务，不让疲惫者一边休息一边远程指挥。复杂问题可寻求社区、社会工作、康复和正规照护支持，按可获得资源安排。\u003c/p\u003e\n\u003cp\u003e照护者本人有看病、吃饭、休息和拒绝额外任务的资格。把这些排进计划，不留到别人全部满意后才允许发生。\u003c/p\u003e\n\u003ch3 id=\"c11-s007\"\u003e11.8　家庭运行会处理协调，不审判人格\u003c/h3\u003e\n\u003cp\u003e选择双方不极度疲惫时，讨论下周不可移动事项、责任、费用和独处需要。情感深谈另约，不把全部矛盾塞进一次排班。\u003c/p\u003e\n\u003cp\u003e标准描述为可观察结果，例如厨房结束后台面可用、食品妥善保存，不说像我一样认真。不同偏好可以分工或接受足够好。暂停冲突应有返回时间，不能无限冷处理；暴力与控制进入安全分支，不以沟通练习包办。\u003c/p\u003e\n\u003ch3 id=\"c11-s008\"\u003e11.9　管理者不把自己的透支复制给别人\u003c/h3\u003e\n\u003cp\u003e深夜派普通任务、频繁改优先级和要求随时在线，会改变他人恢复条件。明确紧急定义、响应时限和休息边界，不用自己也辛苦取消组织责任。\u003c/p\u003e\n\u003cp\u003e业务建立授权备份：流程、承诺、权限与交付状态能接续。备份保护公司，也让个人有生病、休假和处理家庭事务的余地。短期冲刺要有范围、结束条件和后续恢复，没有期限的冲刺就是常态制度。\u003c/p\u003e\n\u003ch3 id=\"c11-s009\"\u003e11.10　财务压力进入现实排序\u003c/h3\u003e\n\u003cp\u003e先看必要生活和治疗，不为让预算漂亮把健康成本藏到未来。区分安全照护、严重违约后果、可协商延期与形象消费。法律和债务事项寻求当地合格帮助，不用新高风险借贷自动覆盖旧压力。\u003c/p\u003e\n\u003cp\u003e共享风险的人应获得相称的信息，不能要求对方承担债务却拒绝说明承诺；同时合理个人隐私和独立资源应保留。透明不等于一方永久监控另一方每笔正常支出。\u003c/p\u003e\n\u003ch3 id=\"c11-s010\"\u003e11.11　父母需要帮助时，先看任务\u003c/h3\u003e\n\u003cp\u003e共同做饭、走熟悉路线、处理实际事务，了解哪一步变难。不会新手机或一次忘事不等于整体认知下降。提出具体帮助选项，保留本人决定。\u003c/p\u003e\n\u003cp\u003e持续功能变化或安全事件要评估，不在家族群投票决定接管财产。平稳时讨论紧急联系和未来偏好，正式授权按当地法律，目的在听见本人而非推行子女预设方案。\u003c/p\u003e\n\u003ch3 id=\"c11-s011\"\u003e11.12　给私人身份留一个角落\u003c/h3\u003e\n\u003cp\u003e保
