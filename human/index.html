和餐次的变化结合生长与专业建议，不因一岁生日突然撤掉全部熟悉安排。  一岁前不喂蜂蜜，不以普通牛奶替代主要奶源，也不需要果汁；未经巴氏消毒食品、高盐高添加糖及高汞鱼类按儿童安全要求避免或限制。 S16 这套规则以后通过引用调用，不每个月重新列出。  一岁时是否独走不是单一合格线。整体发展轨迹、交流与探索、是否失去已有技能和筛查发现更重要。 S54 庆祝可以围绕关系，不需要婴儿承受漫长仪式和展示压力。"},{"ch":5,"id":"c05-s012","title":"5.13　协议C：辅食防噎与回应式进食","text":"展开每次进食前的安全检查C 孩子清醒、坐姿稳定且有适当支持，成人全程专心看护；不边走边吃，不在移动交通中安排无法及时处理的进食。形状、硬度、黏性和大小共同决定风险，切小不一定安全。 整颗葡萄、圆片香肠、整粒坚果、爆米花、硬糖、硬生蔬菜块与大团坚果酱等是常见风险形式，要按年龄能力安全处理或不提供。 S15 先核对已知过敏、温度和质地，再决定份量。严重反应进入急症分支，不能在家对已知过敏原自行做激发试验。孩子表示饱足就结束，不靠屏幕分心继续塞食。 长期进食困难、生长异常或餐桌持续冲突，应寻求喂养和营养评估，不提高强迫力度。不同喂养方法不是家长等级，合适、安全、营养和可持续比流派名称更重要。"},{"ch":5,"id":"c05-s013","title":"5.14　生长曲线、记录与玩具选择","text":"体重、身长和头围使用适合的生长参考，并由专业人员结合连续轨迹解释。WHO提供相应标准工具。 S56 百分位不是成绩，接近中位数也不是所有孩子的目标。一次异常先看测量、既往趋势与状态，不立即用加餐或限制饮食追求五十分。  家庭记录优先保留新能力、异常和会改变行动的问题。视频选择自然情境，不为拍出标准动作反复诱导至疲惫。有感觉、运动或其他障碍的孩子，需要适配材料、沟通与机会，不是加倍完成普通清单。  玩具选择看能否安全操作、是否便于清洁、是否允许孩子影响结果、成人能否接受重复使用。无需不断换新。一次只放少量，轮换不需要购买，旧容器和结实图书在安全检查后也可提供丰富经验。"},{"ch":5,"id":"c05-s014","title":"5.15　婴儿的一天怎样生成","text":"醒来先完成照护与喂养；状态合适时短暂交流或地面活动；困倦时进入安全睡眠。某个清醒段换到适合的环境，另一个接触图书、声音或可操作物。辅食安排在成人能专心照看的时段，不把所有新尝试堆在睡前。  一天只选一个小变化：一种安全质地、一个拿取位置、另一位熟悉照护者讲同一本书。熟悉活动照常发生，不重新抄写为新增任务。生病、旅行或家庭疲惫时回到基础照护，未完成的训练不构成债务。  这一年的长期价值，是孩子逐渐发现自己的信号会被回应，尝试能够改变环境，拒绝和疲倦会得到尊重。成人不需要制造不断领先的婴儿，需要建设可以安心探索的世界。"},{"ch":6,"id":"c06-s000","title":"6.1　主任务不是听话","text":"孩子开始移动、选择、拒绝、模仿和影响别人。若成人目标只是尽量少添麻烦，大量探索都会被误认成故障。本卷的编排是提供真实参与机会，同时由成人承担危险、时间压力和资源安排。  年龄只组织机会，能力决定具体难度。同一孩子不同领域进度可能不同，语言较快不代表情绪控制也要同步领先。CDC两岁、三岁清单可帮助讨论发育担忧，不作为家庭排名。 S57 S58  每天沿用已有照护底座，再加入一个能自然发生的小任务。不要把所有本卷活动同时排进日历；重复练习可以持续，但成人不必每日换花样证明重视。"},{"ch":6,"id":"c06-s001","title":"6.2　十二至十五个月：我也能参与","text":"把安全用品下移：一个放鞋篮、一个图书区、一个放安全餐具的抽屉。危险物品仍锁好，不将自主理解为全屋无边界。孩子够得到的东西，应是可以真的使用而非总被禁止的东西。  每天邀请一个有清楚结束的小动作，例如把毛巾放进篮子、递给成人一个物品。完成后描述发生了什么，不只用聪明或乖概括。成人提供足够简单的任务，不能先给复杂要求再用失败证明孩子不配参与。  回应手势、表情和声音，再补充语言。不会说一个词不应成为获得帮助的门槛。多语言家庭可以自然使用照护者熟练语言，不必让所有人改说不熟悉的表达。  会扶站检查可拉倒物，会攀爬检查窗边家具。安全保护先于提醒，喊停只是辅助。衣物和鞋应允许活动，不用外观限制身体探索。"},{"ch":6,"id":"c06-s002","title":"6.3　十五至十八个月：从动作到顺序","text":"示范一个两步过程，例如拿脏衣物到篮边再放入。孩子参与其中一部分也有价值。若中途离开，先看任务太长、环境太乱还是当前状态不合适，不急于贴注意力差标签。  进餐给有限但真实选择。成人负责适宜食物、场景和规律机会，孩子在安全与营养评估允许范围内决定吃多少。持续摄入不足、生长异常或明显痛苦要评估，不能无限等待他饿了自然吃。  练习请求帮助：先试，再提供所需的一点支持。扶稳碗而非全部代喂，松开一点拉链而非立刻替其完成。独立与合作不是相反目标，知道何时求助同样是能力。  本季度成人要统一少量安全规则。一个人允许危险动作、另一个靠大声制止，会使边界难预测。删掉纯粹为成人方便而过多增加的禁令，让真正重要的规则更清楚。"},{"ch":6,"id":"c06-s003","title":"6.4　十八至二十一个月：承认感受，保护行动边界","text":"离开喜欢的游戏时可以说，你还想玩，停下很难，现在要回家。承认情绪不等于取消边界。孩子激动时不用长篇讲道理，平静后再讨论下一次怎样过渡。  给出能兑现的选项，例如自己走到门口还是由成人抱。不要把威胁包装成选择，也不要提供实际上不能接受的选项。事先预告转换，比临时抢走物品更容易保留合作机会。  打人、咬人或扔危险物时先保护双方，平静阻止，之后示范退开、说不要、找成人等替代。不能通过打回去教不打人。道歉可以包括修复行动，不需要当场强迫拥抱。  记录反复冲突发生在哪里：饥饿、困倦、等太久、过度刺激还是任务转换。记录服务于修改环境，不是建立坏行为档案。成人也要观察自己的疲劳和反应是否在加剧循环。"},{"ch":6,"id":"c06-s004","title":"6.5　二十一至二十四个月：一天成为可理解的小地图","text":"用真实顺序说明吃饭后洗手再出门，可以用少量图片辅助。不要把墙面贴满复杂表格；提示应让孩子更容易行动，而非制造新的解读负担。  假装游戏允许盒子当车、布当桌布。成人加入角色但不接管故事，让物品用途、行动后果和角色交换成为新信息。游戏不需要高度逼真玩具，也不要求故事逻辑完全符合成人世界。  观察交流是否逐渐丰富、手势和词语是否帮助表达、是否与人共享注意。持续担心或能力丢失时寻求评估，不以贵人语迟带过。 S57 早期支持是为了功能与交流，不是消除所有差异。  认识姓名、熟悉照护者和简单求助方式可以自然进行，但不能依赖孩子报出完整信息承担外出安全。成人仍负责看护和环境选择。"},{"ch":6,"id":"c06-s005","title":"6.6　二十四至二十七个月：如厕看准备，不看竞赛","text":"如厕准备包括理解简单提示、表达或显示排泄需要、兴趣以及家庭能否稳定支持。多数孩子在两至三岁才逐渐具备合适训练条件，过早强推可能增加压力。 S57 早告别尿布不是育儿成绩。  先熟悉便盆或适合座圈和脚部支持，解释用途，允许穿衣试坐。自然时机提供尝试，不长时间扣坐等结果。没有排出就结束，弄湿衣物是清洁任务，不是羞耻事件。  大便痛、明显憋便、便秘、尿痛应处理，不继续加码训练。夜间干爽与白天可以不同步，不能反复叫醒或羞辱逼出成熟。生病、搬家或入园时临时回退支持，不等于全部失败。  准备备用衣物和外出厕所位置，降低每次失误的家庭成本。行动、感觉或发展差异可能需要工具和专业适配，不能只要求延长坐便时间。"},{"ch":6,"id":"c06-s006","title":"6.7　二十七至三十个月：从并排到协作","text":"两名孩子使用相似材料，各有空间，成人不强迫刚拿到的东西马上分享。可以轮流、等待或提供替代。说清个人与公共物品规则，避免总让较温顺的一方让步。  冲突先描述事实，再提出可行方式，不给孩子下自私结论。双方平静后修复可以是归还、整理或关心，不只有一句对不起。成人应观察有没有持续欺负，而非把所有伤害当普通玩闹。  用真实动作练位置、数量和行动词。把物品放里面、旁边或上方，理解通过行动显示。无法完成先示范，别连续发指令让孩子猜。"},{"ch":6,"id":"c06-s007","title":"6.8　三十至三十三个月：做可逆的小决定","text":"选择两件合适衣服、阅读顺序或一种安全游戏。选择后可以体验小后果，但不把决定变成不能反悔的惩罚。成人可以说明什么时候能换，保留可预测性。  尝试低风险预测，例如不同纸张放在浅水容器中会怎样。先说猜想，再观察；成人负责水和材料安全。结果不同不是出丑，而是获得信息，不必把每次探索做成答题比赛。  给未完成作品一个暂存位置。收纳不必每天彻底清空所有探索，但不能阻挡通道或留下危险材料。孩子开始学习个人项目与共同空间的协调。"},{"ch":6,"id":"c06-s008","title":"6.9　三十三至三十六个月：进入更大的社会空间","text":"托育或幼儿园过渡先熟悉照护者、厕所、吃饭和接送。角色游戏练告别、求助、说不舒服，不只训练数数和静坐。机构也应了解孩子的语言、过敏、疾病和支持需要。  观察的是是否得到回应、排泄进食是否受尊重、是否安全。哭得少不自动证明适应良好，哭得多也不单独证明机构差。长期明显痛苦、伤害或害怕特定成人需要认真了解。  三岁附近的来回对话、同伴参与、餐具与穿衣等可作为观察话题，必要时评估。 S58 普通生活技能不值得用羞辱训练，有障碍时适配方法，而不是只增加次数。"},{"ch":6,"id":"c06-s009","title":"6.10　身体边界从照护语言开始","text":"洗澡、换衣或擦拭前告诉孩子做什么、为什么需要帮助。使用适龄正确身体名称，逐步说明私人部位与隐私。说不舒服时停下了解；必要护理也尽量解释、保护遮挡并采用最少强制。  拥抱、亲吻、坐亲友腿上都不是礼貌义务，可以挥手或说话替代。成人尊重小的拒绝，身体属于你才不只是口号。医疗与安全照护需要适当同意和监护责任，不能简单由拒绝决定是否完全停止必要治疗，应由专业人员帮助处理。  告诉孩子：使你害怕或不舒服的秘密可以向可信成人说，即使答应过或收过礼物也可以求助。听到担忧经历先保证安全、认真听，不诱导盘问，联系适当保护与专业渠道。"},{"ch":6,"id":"c06-s010","title":"6.11　游戏材料与感官负担","text":"少量安全容器、布、纸、粗画笔、图书、积木和球即可组成活动库。检查吞咽、缠绕、尖锐、毒性和清洁性。材料简单不代表缺乏价值，重要的是可操作与成人愿意留出空间。  每次换一个变量：容器大小、材料软硬、滚动还是滑动。变化过多时难知道结果来自哪里。音乐可轮流敲击和停顿，绘画先探索线条，不以像不像评分。  不喜欢某种声音、衣料、触感或人群时，先了解实际不适，降低强度或换方式。不能把忍受所有刺激当作训练目标。持续影响生活时寻求适当评估，避免购买没有明确目标的复杂课程。"},{"ch":6,"id":"c06-s011","title":"6.12　屏幕与睡前：场景边界比口号清楚","text":"屏幕不是必需早教入口。使用时选择适龄内容并有成人共同观看，连接现实。CDC两至三岁页面给出每日不超过一小时适合且有成人陪伴的节目参考，这不是必须用满的额度，活动、交流和睡眠仍优先。 S57 S58  可约定餐桌不靠视频塞食、卧室不无限自动播放、睡前逐渐降低刺激。成人也遵守注意力边界，不一边要求孩子放下设备一边始终低头。  旅行或照护者生病时偶尔增加，不需补偿性惩罚，恢复常规即可。评估长期模式是否挤掉真实互动，而不是单日是否达到完美。"},{"ch":6,"id":"c06-s012","title":"6.13　协议T：幼儿的一天","text":"展开幼儿日常骨架T 起床清洁、早餐时参与一个小步骤。上午有安全移动与探索，条件适合时户外，活动间自然饮水与休息。不是按成人课程密集排列。 午间按实际睡眠需要安排休息，下午自由游戏、共同阅读或交谈、一个真实家务动作。晚餐和清洁继续提供参与机会，成人保留必要监督。 睡前使用简短稳定顺序：结束活跃游戏、口腔清洁、换衣、安静陪伴。成人提前准备次日用品，不临睡前增加能力测试。生病、旅行、入园或家庭变化时降低新任务，不补做练习债。"},{"ch":6,"id":"c06-s013","title":"6.14　成人应退出的四个位置","text":"无危险的尝试先别抢着帮；明确拒绝非必要接触不替亲友说服；表达故事时不每句纠语法；已经疲倦不为拍到成果继续。退出让孩子有真正反馈，而不是一直照着成人结果表演。  退出不等于放任。危险、伤害、持续发展担忧、营养问题与照护失控仍需介入。关键是区分我不喜欢这个样子与这会造成需要防止的伤害。边界守稳以后，把边界以内的空间还给孩子。"},{"ch":7,"id":"c07-s000","title":"7.1　从单项技能转向完整活动","text":"一个完整活动包括目的、材料、尝试、协作、结果和收尾。会背很多数字不等于能分餐具，会认字不等于能说明需要。这个阶段可将学习放进生活，让孩子知道能力有什么用。四岁与五岁发展清单适合帮助家庭与专业人员沟通，但不是入学考试。 S59 S60  本卷每半年的主题是可移动编排。选一项孩子有兴趣、身体能够参与、家庭能支持的活动即可。不必同时报满语言、艺术、运动与思维课程。资源有限时，日常生活仍能提供大量真实材料。"},{"ch":7,"id":"c07-s001","title":"7.2　三至三岁半：语言用来表达，而不只回答","text":"留出一段不被连续追问打断的叙述。孩子讲一件事，先听完再问后来呢，不将每天交流固定为学了什么、吃了多少、有没有乖。成人也可分享一件小事，示范故事有开始、过程和结果。  练习请求帮助、说明不舒服和表达不同意。打不开可以请帮忙，疼痛可以指出位置，不喜欢一种游戏可以说不想这样。使用手势、图片或辅助设备的人同样有表达权，不以口语流利作为被听见的条件。  位置、顺序和因果词放进实际动作：杯子在盘旁，地湿先擦再走。说错时自然示范，不把谈话变成每句重说三遍的训练。若持续理解或表达困难，向合适专业人员咨询，不只增加卡片数量。"},{"ch":7,"id":"c07-s002","title":"7.3　三岁半至四岁：同一个身体可以有不同解法","text":"在安全场所练走地面标记、跨低障碍、推轻箱、滚球、钻和爬。每次只增一个难度，如方向或顺序，不同时增加高度、速度和竞争。活动结束应仍有余力参与正常生活。  观察舒适、愿意继续和能否调整，不急于形成专业姿势。持续疼痛、动作显著不对称或能力下降应评估，不能统一解释为长身体。体力挑战不是服从训练，更不能用跑圈惩罚情绪。  手部活动可以揉捏适龄材料、撕纸、夹取大物、涂画和使用适合工具。成人先示范工具安全并看护，作品不必达到展示标准。材料探索本身就是完整活动。"},{"ch":7,"id":"c07-s003","title":"7.4　四至四岁半：从为什么到小型调查","text":"面对问题，区分知道、需要观察和暂时不知道。成人承认不确定，再共同寻找证据。可以研究不同折法的纸能否站稳，先猜、分别尝试、再比较，不需要实验室装备。  一次明确改变了什么，其他条件尽量类似。猜错不是失败，看到不同结果就问发生了什么。记录可用一幅画、一张照片或一句话，不必抄完整报告。成人若承担全部操作和解释，孩子只观看，就没有真正参与调查。  户外观察可以选择一棵树、一块阴影或某种常见声音，多次回到同一位置比较。避免抓取不明动植物、入口尝试或进入危险水域。探索与安全约束可以同时存在，限制危险不等于取消好奇。"},{"ch":7,"id":"c07-s004","title":"7.5　四岁半至五岁：规则、轮流与修复","text":"选择规则少且结束清楚的游戏，开始前确认怎样轮流、发生争议找谁。不要由输的一方随时改规则，也不偷偷作弊保证孩子一直赢。成人自己失误时可以示范承认与继续。  输后允许失望，平静后讨论策略、再玩或结束。不要用输不起以后怎么办进行人格评判。情绪恢复不必通过强迫继续到表现合格完成。  合作任务可让两人各搭一段路再连接。接不上时共同讨论调整，不由成人直接重建。孩子获得的是别人计划也影响结果的信息。修复争执可以是归还、收拾、重新约定，不只表演道歉。"},{"ch":7,"id":"c07-s005","title":"7.6　五至五岁半：数字、文字与时间服务生活","text":"分餐具时数实际人数，让每个人对应一份。数错重新对应，不通过增加背数上限掩盖理解。比较长短、多少、轻重用安全实物，不让孩子拿过重物品证明能力。  时间从早餐后、出门前、今天、明天等真实顺序进入。日历标记实际事件，不急于要求理解所有抽象单位。等待时可以用看得见的短过程提示，例如歌曲结束换人，而不是不断说等一下。  文字从姓名、标识、故事和本人想传达的话进入。孩子口述一句，成人写出再读，让其理解文字能够保存意思。书写需考虑舒适和精细动作，不用长时间描摹替代语言理解。"},{"ch":7,"id":"c07-s006","title":"7.7　五岁半至六岁：入学首先是生活过渡","text":"了解学校作息、饮水、厕所、午餐、接送与求助方式。练习向负责成人说不舒服、找不到东西和需要帮助。会背课文不能代替这些能力，成绩准备也不能掩盖环境是否可及。  成人陪同走真实通学路线，认识路口、出入口和走失时的安全求助。记住规则不代表能够独立应对复杂交通，独立出行要看能力、环境和当地要求。不要为了训练勇敢让孩子独自完成超出能力的路线。  书包只放真正需要的用品，知道每样用途和固定位置。回家有放包、洗手与恢复的过渡，不立刻切到第二轮课程。需要特殊沟通、用药、行动或感觉支持的孩子，应提前与学校落实适配，而非等反复失败才开始。"},{"ch":7,"id":"c07-s007","title":"7.8　阅读的三个层次","text":"共同享受是第一层：故事、图片与语言节奏，可以反复选同一本。成人无需每页考试，允许叙事完整流动。第二层是理解：角色想做什么、遇到什么、结果怎样，回到图文找依据。第三层是表达：换个结局、给角色写话、把自己的经历画出来。  材料不必昂贵，借书、讲熟悉故事和家庭口述都可使用。面对看不懂的内容，先补词语、背景和图片解释，不立刻归因于不认真。语言或视听困难需要适当评估，阅读时长不能代替必要支持。  孩子的解释与成人不同，可以问从哪里看出。合理的不同解读不必统一；明显误解则温和回到材料。这样既保留想象，也练习结论与依据之间的连接。"},{"ch":7,"id":"c07-s008","title":"7.9　艺术不是提前进入评比","text":"绘画先给安全材料，再问在做什么，不从第一笔纠正比例。音乐可比较快慢、强弱和停顿，避免靠近耳部的高声刺激。舞动探索节奏与空间，不一定转成舞台整齐。  展示作品征求孩子意愿，不是每次进步都要拍照发布。保留少量本人选的作品，其他可回收，避免家庭变成果仓库。孩子可以只享受过程，不必把兴趣发展成特长。  选择课程看是否安全、被尊重、愿意参与，教师怎样对待错误、拒绝和疼痛。价格、奖牌与考级不能单独证明适合。试听后听孩子描述具体体验，不只听机构评价。"},{"ch":7,"id":"c07-s009","title":"7.10　同伴关系不等于讨好所有人","text":"可以喜欢不同游戏、暂时独处或拒绝某种玩法。成人不以别人会不喜欢你控制所有行为。礼貌与边界并存，孩子不必用牺牲舒适换取接纳。  说没人跟我玩时了解具体情境：一次未加入，兴趣不同，长期排斥还是持续伤害。不要立刻要求送礼、道歉或变活泼。必要时由机构成人提供保护与参与机会。  加入游戏可以练具体句子，例如你们还需要一个送货的人吗。未成功时寻找其他活动，不把一次拒绝变成个人价值判断。持续排斥或伤害需升级处理，不让孩子独自承担改善群体环境的责任。"},{"ch":7,"id":"c07-s010","title":"7.11　卫生与身体参与","text":"成人持续监督并必要协助刷牙，直到孩子有能力有效完成；能拿牙刷不等于能清洁。含氟牙膏的年龄用量与牙科安排统一见卷十九。 S61 洗手拆为可参与步骤，水温、滑倒和清洁用品安全由成人控制。  衣物适合活动和如厕，鞋合脚并适合场景。检查标签、袜口、鞋内异物和摩擦，持续拒绝某件衣服先了解不适。不是所有感觉差异都应靠坚持穿来克服。  身体不适可以报告，休息不需先证明严重。学校或家庭若要求忍痛参与，应重新检查规则。疼痛与疲劳的表达能力也是需要培养的生活能力。"},{"ch":7,"id":"c07-s011","title":"7.12　活动与空白时间","text":"主动活动应分散在全天，不能久坐一天后仅靠一节课补偿。WHO五岁以下指南强调主动游戏、减少长时间受限和久坐，具体参考在运动卷。 S62  保留没有预设学习目标的时间。发呆、重复摆物、观察同一件事不必立刻增加刺激。可用材料与陪伴支持无聊，而不是每次用屏幕填补。  户外要考虑高温、空气、雷雨、交通与场地，不以全年打卡忽视风险。活动后若长期影响进食、睡眠和情绪，应调整负担。参与的目标是持续生活，不是证明能承受最多安排。"},{"ch":7,"id":"c07-s012","title":"7.13　用观察替代标签","text":"把注意力差改成在哪种环境难完成什么任务，把胆小改成陌生场景需要多久熟悉，把脾气大改成转换活动需要怎样预告。具体描述能指向支持，标签只能反复确认成人原有印象。  每月只选一个真实问题观察，记情境、行为、回应与结果，不全天采集。跨场景持续困难、明显生活影响或能力退步时寻求评估，不以家庭实验无限替代。  展开学前日程P：有集体生活与没有集体生活 有幼儿园时，家庭补足稳定回应、自由游戏、适合活动、进餐与休息，不复制全部课程。接回后先了解身体需要与情绪。 没有幼儿园时，一天围绕一个完整生活活动，如准备简单点心、整理角落或观察天气。安排主动探索、休息、同伴机会与自由游戏，社会接触不必等同付费课程。 睡前可问今天什么有趣、是否需要帮助，孩子不想回答也可以。次日新增内容以平静完成为限，基础照护和关系优先，练习没有补课债。  不要在六岁前用一项表现给人生封顶。可以承认当前优势与困难，同时保留改变空间。最值得积累的是问题可以拆开、错误可以修复、身体值得照顾、求助可以得到回应的经验。"},{"ch":8,"id":"c08-s000","title":"8.1　学校不是全部人生","text":"若睡眠、活动、进餐和家庭交流都为学业不断让路，短期成绩即使提高，也不能直接说明整体生活更优。本卷把学习、身体、关系、自理与探索并列，允许每日比重不同，但不让基础领域长期消失。  学校归属意味着学生感到被成人和同伴关心、重视与支持，它不是可有可无的装饰。 S65 所以下面逐年新增任务既包括学习，也包括求助、边界、交通和真实生活。  这些年份是可调整编排。教育制度、入学年龄、残障和个人发展会改变顺序，每年新增一项稳定责任已有意义，不必一次接管全部生活。"},{"ch":8,"id":"c08-s001","title":"8.2　六岁：建立可以恢复的学习日","text":"前晚准备常用物，晨间给早餐、如厕和出门留余地。不要同时纠正衣着、追问成绩、批评速度又补讲知识。稳定起点比不断提前叫醒更值得先尝试。  放学后先转换状态：饮水、适当进食、活动或安静休息，再看作业。先确认知道要做什么，再判断会不会做。卡住可能是没听懂、看不清、写得疼、忘记方法或情绪过载，不能统一要求认真。  本年责任可选收好自己的学习材料。成人提供少量清单和固定位置，逐步减少提醒。遗忘后修流程，不故意长期让孩子承受羞辱来证明责任心。"},{"ch":8,"id":"c08-s002","title":"8.3　七岁：错误变得可定位","text":"选一次练习，将错误分成概念不懂、步骤漏掉、题意误解和偶然笔误。每类一个代表即可，不把整页反复抄写。下一次需要改哪个动作，比总是粗心更有用。  阅读从读出声走向说明意思。用自己的话讲一小段，再回原文找依据。讲不出先看词汇、背景和理解，缩短材料或补解释后再试，不直接提高阅读时长。  本年生活责任可是一段洗漱整理，成人保留必要检查。另有一项不以成绩为目的的体验，如简单手工、球类或种植，观察普通练习中是否仍愿意参与，不只看初次新鲜感。"},{"ch":8,"id":"c08-s003","title":"8.4　八岁：第一次独立小项目","text":"项目可以是路线图、游戏、模型或主题展示。先确定看得见的结果，再列材料、步骤和需要帮助处。成人控制范围，不替孩子做成展示级作品。  每天推进一个步骤，结束知道下一步。失败后看目标是否太大、材料是否合适、时间是否足够，不只归因于努力。保留中间结果，可以比较预测与现实。  本年责任可参与采购：列几项、找货、比较数量、核对买齐。重点是需求与约束，不是提前接触复杂金融产品。社交上问谁让孩子感到安全、争执找谁，不只统计朋友多少。"},{"ch":8,"id":"c08-s004","title":"8.5　九岁：理解规则的目的","text":"讨论一条家庭规则保护什么、代价是什么、能否改善。例如设备充电位置为了睡眠与管理，不是证明权威。不能解释的规则也值得成人重新检查。  看到广告时问谁在说、是否出售东西、有没有其他解释。识别商业意图不是不信任所有人，而是增加核对步骤。成人自己的购买也可以示范暂停。  本年可管理一个范围有限的小预算，金额按家庭实际，允许可承受失误而非无限追加。记录买了什么、是否真正使用，比复杂收益计算更适合。运动选择保留多样性，不因体形或竞技成绩排除参与。"},{"ch":8,"id":"c08-s005","title":"8.6　十岁：自己安排顺序","text":"给几个真实任务和结束时间，让孩子先排顺序并说明理由。只提醒安全和明显不可行的部分，不立即改成成人版本。结束比较预计与实际，修下一次。  学习时开始先回忆再看答案，具体方法在卷二十三。熟悉不等于会用，暴露不知道是获得信息，不是丢脸。本年家务可承担一个完整链，如整理衣物或准备简单冷餐。  刀具、热源和电器权限按实际能力、环境与成人指导逐步增加，不由生日自动授权。身体变化教育也应提前提供，不等变化已发生才让孩子独自害怕。"},{"ch":8,"id":"c08-s006","title":"8.7　十一岁：自我评价不只剩排名","text":"一起看理解、表达、合作、创作、运动、耐心、求助与修复等维度，不要求每项优秀。用具体事实谈进步，也承认真正困难，不用空泛赞美掩盖问题。  共同明确私人信息和安全例外。普通日记、身体隐私与同伴聊天应尊重；威胁、伤害、勒索或迫近危险需要适当成人帮助。不能把保护扩展为永久无边界监视。  本年练习自己向老师或服务人员提出问题。提前演练，必要时陪同，但让本人表达。沟通障碍可用替代方式，不以口头流利作为独立唯一标准。"},{"ch":8,"id":"c08-s007","title":"8.8　十二岁：进入共同决策","text":"重新协商睡眠、设备、外出、活动与学习规则，给权限增加一条透明路径，不让孩子靠猜测成人心情争取自由。权限与责任可以同时逐步增加。  就医时让孩子先描述症状、理解相关药物和过敏信息，适当情况下获得私人交流。家长补充而非全程代答。本年责任可管理一周计划，知道考试、生病或活动改变时怎样调整。  进入青春期前至少知道：身体变化可以提问，压力可以拒绝，受伤害可以求助，成绩不决定是否值得被爱。这些信息需要在成人行动中得到验证。"},{"ch":8,"id":"c08-s008","title":"8.9　学业困难先分流，不先加时间","text":"持续读写困难先了解视听、语言背景、教学匹配和具体过程。看不清、听漏指令、书写疼痛或基础缺口都可能表现为不专心。长期问题需要教育与医疗评估，不只提高监督强度。  作业过长时记录几天的任务类型和卡点，带给教师讨论。把写到很晚拆成哪类占时、是否重复已会内容、是否未理解就要求速度。必要适配不应等同降低尊重，也不能把成本全放在睡眠。  训练前写清目标和复查时间。只在课程内得分提高，实际学校任务仍一样困难，应重新评估，不自动续费更多课时。真正效果应能转移到本人需要的场景。"},{"ch":8,"id":"c08-s009","title":"8.10　运动不是惩罚，也不只为比赛","text":"六至十七岁一般目标为每日至少六十分钟中高强度活动，并在一周中包含高强度、肌肉和骨骼强化活动，学校、游戏与出行可计入，不必全部成为训练课。 S32 疾病或残障按能力与专业建议适配。  安全步行、课间、球类、舞蹈、游泳课程或其他喜欢形式都可构成机会。持续疼痛、胸部不适、明显头晕和异常气短要停止并评估，不能以坚持压过症状。  头部撞击后症状可能延迟。头痛加重、反复呕吐、混乱、难唤醒、抽搐或神经异常需紧急就医；疑似脑震荡不继续参赛。 S63 恢复学习与运动按个体计划，不能因重要比赛绕过评估。"},{"ch":8,"id":"c08-s010","title":"8.11　欺凌与普通冲突","text":"欺凌涉及实际或感知的权力不平衡，以及重复或可能重复的伤害，可表现为攻击、威胁、羞辱、散谣或故意排斥，不只是打架。 S64 普通力量相近的分歧需要协商，持续权力性伤害需要保护。  孩子报告时先保证安全，明确告诉孩子：“受到欺凌不是你的错，向可信赖的成人求助也没有错。”保存必要事实，联系学校责任人，要求具体措施和复核日期。不只要求更强硬、送礼求和或反复回到危险场景证明勇敢。  对实施伤害者，停止行为、承担适当责任并了解背景；困难不能为伤害开脱。旁观者可安全求助、支持受害者、不传播羞辱内容，不要求独自冒险制止一切。"},{"ch":8,"id":"c08-s011","title":"8.12　数字世界通行规则","text":"独立使用前约定目的、地点、结束信号、付费权限和不适内容求助。关闭不需要的公开定位和陌生人联系，不将真实姓名、学校、住址与日程拼成公开画像。  三个暂停点：有人要求秘密、转钱、私密图像或个人信息。孩子不必先判断对方是不是坏人，先停止并找可信成人。成人承诺先解决安全，不因违反过小规则拒绝帮助。  监护应说明范围、原因、期限与退出条件，随能力增长调整。不能让所有隐私永久成为获得一点自由的交换品。数字工具既提供学习，也有消费和操控风险，具体信息判断见卷二十三。"},{"ch":8,"id":"c08-s012","title":"8.13　家务与金钱的边界","text":"区分共同生活基础责任与可协商报酬的额外任务。家庭可有不同规则，但不把所有互助变交易，也不让孩子长期填补成人缺位。家务要适龄、安全、占时合理。  金钱从需要和想要、一次购买和持续成本、借用和拥有进入。买东西可问放哪里、多久用、坏了怎么办。孩子可以理解家庭有预算，但不承担父母债务和关系冲突。  经济困难时解释哪些选择需要变，仍明确基本照护由成人负责。不要通过恐吓自己可能被抛弃来促使节约；也不让孩子因同伴消费不同而承担家庭比较压力。  展开学龄日程K 晨间基础照护与出门，不加临时训练。学校期间饮水、如厕、活动与必要药物确实可及。回家转换后做范围清楚的任务，中间有移动和休息。 每天保留非评价交流或共同活动，夜间准备次日用品，避免睡前高压力争论。睡眠范围见卷十六，完成无限作业不是睡觉许可条件。 周末补生活多样性而非补满全部课程。考试周保留最低底座，生病时使用恢复分支，未完成的非必要任务可取消，不以熬夜追偿。"},{"ch":8,"id":"c08-s013","title":"8.14　年度验收看支持有没有到位","text":"每年问：困难时知道找谁吗，能表达身体需要吗，有不被成绩评价的关系吗，是否获得一项更独立的生活能力，学校和家庭有哪些障碍需要改变。答案差时不全面加码，先修最限制生活的一环。  可能真正需要的是合适眼镜、学习适配、一个愿意听的老师或停止辱骂的家庭环境，而不是更复杂的自律系统。帮助孩子识别和改善环境，也是学习如何生活。"},{"ch":9,"id":"c09-s000","title":"9.1　责任与权限必须一起增长","text":"家长继续承担必要保护、资源和医疗责任，青少年则需要越来越真实的选择。不能一面要求像成人负责，一面不给生活决定权。可以自主选择房间安排、部分时间、兴趣与求助对象，同时了解哪些情境需要成人参与。  青春期开始和进程存在差异，不依据同学身高、声音、体形或月经给人排名。明显过早、过晚、进程停滞、疼痛或强烈困扰应评估，不自行购买激素、增高或发育套餐。 S67  身体讨论分成事实、当前不便、可提供支持三层。月经先解决用品和疼痛求助，声音变化不模仿取笑，痤疮不成为自律评分。让人愿意继续提问，是安全的重要条件。"},{"ch":9,"id":"c09-s001","title":"9.2　十二岁：私人空间与求助并存","text":"约定进房先敲门，更衣和身体检查尊重遮挡，家庭群不随意公布照片、病史或成绩。隐私不等于必须独自承担危险；威胁、胁迫和让人害怕的秘密可以告诉可信成人。  管理一套随身用品：饮水、必要卫生用品、交通与紧急联系，医疗用品按成人和团队确认的权限保管。重点是位置、补充和丢失处理，不是品牌。  说出三类求助入口：学习、身体、人身安全。家长不必是所有问题唯一入口，但应成为说出问题后不会首先受羞辱的入口。可以共同找学校或社区中真正可信赖的人，不只指定名单却从不建立联系。"},{"ch":9,"id":"c09-s002","title":"9.3　十三岁：理解同意","text":"同意应自愿、清楚、具体并可撤回。答应一次不代表以后都答应，关系亲密不等于拥有对方身体；沉默、僵住、醉酒或被威胁不能轻率当许可。它同样适用于拥抱、玩笑、拍照、公开内容和查看设备。  日常先练询问与停止。别人不愿拍照就不拍，不要求解释到筋疲力尽才允许拒绝。涉及未成年人的性接触和影像有当地法律与保护要求，不能只用双方愿意概括。成年人利用身份、资源或秘密控制关系时，应优先寻求保护。  性教育提供准确、适龄的身体知识、避孕与感染预防入口，允许没有兴趣或暂不想谈。不把一个问题自动解释为已经发生性行为，也不将性别表达差异当疾病或道德缺陷。具体个人医疗问题由适当专业人员处理。"},{"ch":9,"id":"c09-s003","title":"9.4　十四岁：给同伴压力一个退出路径","text":"区分可恢复的挑战与高代价风险。上台、参加社团或尝试新技能可能令人害怕但可安全探索；酒后骑乘、危险攀高和胁迫接触不能因大家都做就接受。  外出前明确回程、接应与求助。家庭可约定一句求助词，先接人离开现场，安全后再讨论责任。拒绝可以很短：我不做，我要走了。不必在压力场景赢辩论。  合理边界若换来持续威胁和羞辱，需要重新评估关系。成人也示范拒绝不合理要求，不能只让孩子独自对抗群体。安全计划应包括可靠交通，而非让另一个同样不清醒的朋友送回。"},{"ch":9,"id":"c09-s004","title":"9.5　十五岁：处理任务量与恢复的冲突","text":"青春期节律可能偏晚，学校要求却未必改变。检查作业、通勤、咖啡因、手机与焦虑，不只说早点躺下。大脑持续发展不表示青少年意见无效，也没有某个生日突然获得全部理性的开关。 S66  从截止时间倒推，先放睡眠、吃饭、清洁和交通。超出容量时删减或协商，不让不足全部变熬夜。考试问题拆成概念、检索、审题、时间与紧张，对不同卡点采用不同方法。  明日任务分必须、可推进、可不做。家长检查现实性，不要求三栏全空。明显疲惫、持续失眠或生活功能下降时先处理状态，不能靠加课证明重视。"},{"ch":9,"id":"c09-s005","title":"9.6　十六岁：接触真实工作，但不急于定型","text":"选择低风险项目：采访从业者、志愿活动、做一个有人使用的小作品，或在合法保护下接触工作。责任、监督与退出清楚，不把危险劳动和无边界免费替岗包装为锻炼。  职业观察不只看收入。一天做什么，能力从哪里来，最消耗什么，失败后能否转向？把喜欢游戏拆成叙事、竞争、系统、美术或社交，把想学医拆成愿意长期学习、接触患者、面对不确定和承担责任。  新练习是追溯一条重要消息：找到初始来源，区分事实、评论与广告，找一个可能反例。身体、升学捷径和投资类内容尤其不能仅因转发多而接受。"},{"ch":9,"id":"c09-s006","title":"9.7　十七岁：独立办事与就医表达","text":"在当地规定允许范围内，让本人描述症状、提问、复述下一步，家长补充而非全程代答。知道过敏、重要病史、药物和证件位置。私人健康问题无需向每位亲戚说明。  办理报名、交通、住宿和支付时核对对象、金额、期限、退款、隐私授权与求助。未取得相应法律资格的事务由合适监护人处理，不能以独立训练越权签约。  试住或集体活动前练完整链：起床、找路、进食、洗衣、保管财物、身体不适与联系支持。小失误修流程，药物、过敏、火灾和人身安全缺口则先补好再独立。"},{"ch":9,"id":"c09-s007","title":"9.8　十八岁入口：支持不应突然撤走","text":"成年权限因地区和事务不同，不是十八岁所有规则同时切换。讨论哪些决定由本人承担，经济支持是什么，共同生活怎样协商，出现疾病、失业和重大错误时有哪些帮助。  支持条件应提前明确。学费是否附带专业要求，住宿是否有边界，钱是借款还是赠与，不能事后用未说出的条件惩罚选择。亲密不等于交出全部密码和关系决定权。  独立不是不用别人，而是知道自己能处理什么、需要怎样帮助、如何对承诺负责。能够承认不会，是比表演无所不能更重要的成年能力。"},{"ch":9,"id":"c09-s008","title":"9.9　月经、皮肤、体味与体形","text":"记录月经开始、明显生活影响、异常出血和疼痛即可，不必追踪每个感觉。疼痛严重、显著加重、经常影响上学或伴异常出血等，应评估，不能因女性都这样长期忍耐。 S68  清洁与衣物按实际需要安排，运动后换潮湿衣物，用品保持卫生。痤疮不同时叠加多种刺激产品，不挤压后再强刺激消毒；疼痛、留疤或严重困扰时寻求皮肤科支持，完整协议见卷十九。  体形变化不自动触发减肥。不要当众评价胸部、体毛、肌肉和臀腿，也不无条件赞美体重下降。进食障碍可发生在不同体重与性别人群，限制、失控进食、代偿或强迫运动应认真评估，不奖励意志力。 S69"},{"ch":9,"id":"c09-s009","title":"9.10　尼古丁、酒精与提神捷径","text":"对未吸烟青少年，电子烟不是健康入门品，气溶胶不是单纯水蒸气，尼古丁有成瘾风险。已使用者需要适龄戒除支持而非羞辱到隐瞒。 S70  高咖啡因饮料、来源不明聪明药、他人处方兴奋剂或健身药物，不能作为考试和体形工具。药物适应证需要医疗判断，不能复制同伴体感；受监管物质还须遵守当地法律。  询问第一次接触发生在什么情境、想解决什么问题。压力、孤独、好奇与同伴需求要分别处理，单纯没收不一定改变需求。寻求帮助不应自动招致羞辱性公开。"},{"ch":9,"id":"c09-s010","title":"9.11　不能只当作叛逆的变化","text":"持续退缩、兴趣丧失、功能下降、自伤言论、危险性明显增加、睡眠饮食显著改变或遭受胁迫，需要认真听取和适当帮助。一次沉默不诊断疾病，成绩好也不排除困难。  可以直接平静询问是否想伤害自己。存在即时风险时陪同、在安全可行范围内移开危险物并联系当地急救或危机服务；不要让同龄朋友独自承担保密救援责任。详细心理分流见卷二十二。  展开青少年日程A 晨间确认用品、交通和主要任务。白天履行学校责任，同时保障如厕、饮水、活动、必要医疗和真实交流。身体不适允许报告。 放学先看饥饿、疲惫、情绪与任务量，再排学习。卡点写成问题，不在同一错误上熬到深夜。兴趣可轮换，不要求每天各领域最高水平。 晚间保留私人时间，准备次日后结束工作。设备规则共同协商并对成人同样适用，临睡前不启动审判谈话。持续功能变化切求助分支，不靠更严打卡解决。  本阶段要交给青少年的，是理解身体、判断风险、维护边界、建立关系与求助的能力。保护的目的应当是支持逐步自主，而不是让依赖永久化。"},{"ch":10,"id":"c10-s000","title":"10.1　先画生活地图","text":"这一阶段可能在升学、工作、迁移、照护家人、康复或探索，不只有大学到第一份工作的路线。共同任务是看懂自己的生活输入、承诺和求助路径，不以学历、职业起点和离家早晚判断成熟。  生活地图写住所、食物、收入或支持、医疗、交通、紧急联系和需要别人协助的任务。地图应指出断点：收入尚可但病时无人送餐，住所安全但通勤使工作难持续，技能足够但重要资料全在一台易失设备上。  每天新增动作可以很小：找到基层医疗入口、保存离线紧急联系、做一顿可重复饭、确认室友规则。它们比购买一套自律设备更直接决定高压时期能否继续生活。"},{"ch":10,"id":"c10-s001","title":"10.2　十八至二十岁：自由意味着看见成本","text":"晚睡、社交、兼职、学习和旅行都可能是选择，但同一段身体、时间和经济预算不能重复使用。先填真实固定事项，再决定剩余时间，不从理想清单反推不存在的额外小时。  集体居住提前确认噪声、清洁、访客、公共物品、过敏与费用。写成行为：夜间能否外放，谁清洗水槽，访客是否过夜，而不是大家自觉。冲突先描述影响和请求，不评价人格教养。  离开熟悉环境保留一个稳定联系点。新关系从共同活动逐步建立，观察守约、尊重和分歧处理。孤独不必通过迅速进入亲密关系解决，倾诉全部隐私也不是建立信任的必经步骤。"},{"ch":10,"id":"c10-s002","title":"10.3　二十一至二十三岁：学习开始面向真实使用者","text":"接任务先确认交付物、使用者、期限、资源和验收。陌生任务可先做小样确认理解，再投入全部精力。问清不等于能力不足，在错误方向安静努力才容易浪费。  作品记录包含问题、方法、约束、结果与改进，不只保存荣誉。涉及客户和雇主资料遵守授权，保留脱敏方法，不把机密原件当个人作品集。原始数据所有权与自己的经验要分开。  求职不只看名义工资，还看通勤、时段、训练支持、安全、结算和成本。合同按本地现行法律理解。要求先交高额费用、扣原件、替人担保或参与不明资金往来时暂停并独立核实。"},{"ch":10,"id":"c10-s003","title":"10.4　二十四至二十六岁：分清成长与单纯消耗","text":"忙不自动等于成长。检查是否积累可迁移能力、得到具体反馈、有适度新责任，身体和关系是否付出不可持续代价。任务增加但学习与自主不增加，应讨论优先级和资源，不只研究少睡一小时。  过量负荷、低控制、歧视与不安全环境可能成为心理健康风险，工作困扰不能全归个人抗压差。组织调整与合理支持同样重要。 S71  常用问句是：这件事今天必须完成，哪件可延期？谁最终确认结果？继续前缺什么信息？把模糊压力转成可协商事项。暴力、骚扰或危险劳动不只是沟通技巧问题，应优先安全与专业支持。"},{"ch":10,"id":"c10-s004","title":"10.5　二十七至三十岁：决定哪些承诺值得长期化","text":"长期承诺包括关系、房屋、城市、创业、照护和治疗。决定前看退出成本、不可逆部分、最坏情境、对他人的影响，以及是否能小规模试验。过去投入不自动构成继续理由。  共同居住先讨论家务、财务、私人时间、访客、宠物、疾病和冲突。创业先验证需求、结算与基本交付，再增加不可回收投入。迁移先了解现实通勤、医疗与支持，不只喜欢旅行印象。  三十岁不是截止线。没有婚姻、房产或使命不等于失败。更重要的是选择越来越出于理解，还是越来越受比较驱动；是否保留调整路径，还是把全部资源锁进一个未经验证假设。"},{"ch":10,"id":"c10-s005","title":"10.6　个人医疗连续性","text":"第一次独立就医准备症状时间线：起始、频率、加重减轻、功能影响、相关用药和病史，不带一页未经验证的自我诊断。旧资料用于补充，不能掩盖今天的新变化。  离开诊室前确认判断、未确定之处、今天行动、复查、提前联系条件和结果由谁解释。拿到报告不等于完成医疗；待解释结果应保留为未闭环事项。  药物知道名称、目的、用法、主要注意和续药入口。不分享处方，不将不同药片混进无标签瓶，不凭网友经验处理漏服。完整用药协议见卷二十。"},{"ch":10,"id":"c10-s006","title":"10.7　亲密关系中的健康责任","text":"信任不能从外貌、职业和承诺推断感染状态。许多性传播感染可能无症状，预防结合适用疫苗、正确屏障措施和风险对应检测。 S72  避孕与感染防护不同。某些避孕方法不提供感染保护，选择要看健康条件、偏好、可获得性和正确使用能力，而非只看宣传成功率。 S73 具体药物由专业人员共同决定，不把月经应用当普遍可靠的独立方案。  保护失败、暴露或非自愿接触后尽早联系医疗和支持，因为某些处理有时间窗口。不要为避免尴尬等待数周，也不以反复清洗代替评估。本人可选择可信陪伴者，获得帮助不需要先向所有人解释。"},{"ch":10,"id":"c10-s007","title":"10.8　独居餐食的物流","text":"难点常不是知识，而是购买量、剩食、清洁与下班精力。准备少数可轮换组合：主食、蛋白来源、易处理蔬果和安全储存再加热。完整营养原则见卷十七，此处只解决执行。  采购按实际做饭天数，不按理想自律版本囤积。留一个安全可负担的备用餐，避免没做完美就不吃或吃变质食物。外食可在现有选项里改善，不需每餐称重。  无厨房时用正规餐食、适宜即食和合法安全加热方案。不要在禁明火或供电不足的住房硬搭厨房。环境限制必须进入设计，不能写成个人意志缺陷。"},{"ch":10,"id":"c10-s008","title":"10.9　钱先保护生活连续性","text":"区分固定、可调、债务和突发支出。储备没有普遍适用的月数，要看收入波动、公共保障、保险、支持网络和照护责任。目标是意外不立即迫使危险选择，而不是理财排名。  借贷投资前用自己的话说明最坏损失、何时发生、是否影响住房医疗与依赖者、对方利益关系和退出是否真实。解释不清先暂停。本书不推荐具体资产或杠杆，也不承诺收益。  与熟人涉及钱时明确赠与、借款、消费还是投资，保留适当记录。金额影响基本生活越大，越需要独立判断。感情不能替代双方对同一承诺的共同理解。"},{"ch":10,"id":"c10-s009","title":"10.10　运动习惯不依赖热血","text":"选择普通工作周能持续的形式，考虑地点、费用、交通、氛围和身体适配。新运动先学规则、防护与受伤求助，不复制熟手强度。总量和训练进阶在卷十八统一展开。  活动可嵌入生活，但不是所有碎片都必须锻炼。步行要安全路线，家练要稳定空间。身体不适或恢复期调整，不用连续打卡证明健康。  记录持续疼痛、睡眠影响、日常能力和精神状态，区分正常疲劳与需评估症状。长期参与通常比短期最高成绩更符合一般生活目标。"},{"ch":10,"id":"c10-s010","title":"10.11　建立不同功能的关系网络","text":"日常陪伴、共同兴趣、专业支持和紧急求助不必由一个人全包。低成本联系可以是散步、吃饭或共同完成小事，不把朋友管理成客户表。  进入不同生活阶段后联系节奏会变，先问怎样联系舒服，不用回复速度单独判断关系。求助尽量具体：陪一次就医、听十分钟、帮核对一份材料。别人做不到时找其他路径，不将一个拒绝解释为无人关心。  持续要求隐瞒、交出控制、切断外部联系或接受威胁的关系，进入安全分支。亲密不应让所有其他支持消失。"},{"ch":10,"id":"c10-s011","title":"10.12　从失败提取信息","text":"区分能力、信息、资源、时机和运气。哪些当时能核对却没核对，哪些不可合理预见，哪些目标不适合，哪些执行需改。既不全部归外部，也不全部归自己不够好。  短复盘写预期、实际、关键差异、保留、改变和停止。到能改变下一步就结束，不反复重播羞耻。失业或分手先恢复生活连续性，再作高不可逆决定，避免疲惫时同时重启所有领域。"},{"ch":10,"id":"c10-s012","title":"10.13　独立不是单机运行","text":"为了证明成年而拒绝任何支持，会增加不必要成本；反过来让别人永久替自己处理所有重要事务，也会减少选择。可以将任务分成已会、正在学、需要长期协助，分别设计下一步。  长期协助不一定是失败。有残障或疾病的人可以通过辅助技术、个人助理和制度支持独立决定生活；能够决定怎样被帮助，也是自主能力。评价应看掌控和参与，不只看是否亲手完成每一步。  展开初成年接口Y 普通工作学习日继承基础协议，安排一个主要交付和生活维护。每天最多新增一个现实需要的能力，掌握后折叠为常规。 探索日先写想了解的问题，选择低风险体验，结束记录改变判断的信息，不要求立即变收入或身份。失序日守住安全、供给、治疗和求助，先处理不可逆后果，其他逐步恢复。 不要用同时减肥、搬家、创业、断交和极端训练掩盖一个具体问题。真正的重启可以只是修复生活中最关键的一处断点。"},{"ch":11,"id":"c11-s000","title":"11.1　新增变量是责任耦合","text":"这一时期可能有工作、养育、父母照护、创业或自身疾病，也可能没有这些典型情境。共同问题是，一个决定常同时影响收入、身体、关系和未来。晚间不能运动，可能不是不重视，而是接送、做饭和工作没有结束边界。  先画反复冲突的链条：什么触发，谁接手，哪里无备份，最后损失什么。修最上游可改变的一处，观察是否减少后续混乱。把所有问题都转成更早起、更晚睡，只是把系统缺口藏进身体。"},{"ch":11,"id":"c11-s001","title":"11.2　三十至三十四岁：承诺账本","text":"写清必须自己做、可以交接、只是一直自己做的事情。家务、照护、情绪支持、行政和恢复都算真实负担，不能只记录带来收入的工作。  接受长期承诺时问替代什么。答案若是只要努力就不影响，通常漏算时间或恢复。可设试行期、最低交付和退出条件；对依赖者的退出须有妥善接替，不将边界解释成突然失联。  完整交接包括发现、计划、执行和收尾。一个人永远提醒、安排与验收，其他人只临时帮忙，仍没有转移真正负担。明确责任链比增加待办应用更有用。"},{"ch":11,"id":"c11-s002","title":"11.3　三十五至三十九岁：恢复进入工作设计","text":"工作结束可以有收尾动作：记录停在哪、下一步、需要通知谁，然后关闭非必要入口。结束不是所有事情完成，而是未完成有可靠位置，不继续占满整晚注意。  密集会议和即时消息让人工作时无法完成工作，先查入口与权限，不只增加效率技巧。过量负荷、低控制和家庭工作冲突也属于环境问题，不应一律归个人抗压差。 S71  保留真正恢复的空间，其形式可由本人选择，不必产生作品或被打分。若休闲同样带来强烈消费、竞争和义务，重新判断是否仍在恢复。"},{"ch":11,"id":"c11-s003","title":"11.4　四十至四十四岁：中途校准","text":"先看仍能做什么、什么变难、原因可能是健康、技能、环境还是负担。不要只看外貌老了多少。外观愿望可以被尊重，但不自动获得压过全部生活的优先级。  检查居住、工作、关系约定和兴趣是否仍适合。用小试验探索新安排，不为证明改变同时辞职、搬迁、借贷和断联。已经不再属于自己的目标可以停止，先处理承诺和损失，允许释然与悲伤并存。  减少一个长期耗损目标，可能比新增五个习惯更有效。校准是让计划再次服务本人，不是为过去选择寻找道德判决。"},{"ch":11,"id":"c11-s004","title":"11.5　身体变化不默认等于年龄","text":"持续疲劳、运动耐受下降、反复疼痛、无意体重变化或情绪功能改变，记录起始、相关事件、睡眠工作和药物，必要时就医。不要以中年为诊断，也不用抗衰套餐替代针对性问诊。  区分偶发且可恢复，与持续、进展和影响生活。紧急信号立即处理，非紧急但持续的问题预约评估，明确可观察的按计划复查。数据应回答具体问题，不用手表或体脂秤单次结果触发治疗。"},{"ch":11,"id":"c11-s005","title":"11.6　生育是分支，不是必经节点","text":"有意愿时双方共同核对健康、药物、既往妊娠和未来照护。计划自然妊娠、有规律未避孕性交且没有其他已知风险时，ASRM参考路径按拟妊娠者年龄与尝试时间讨论评估：三十五岁以下十二个月，三十五岁及以上六个月；四十岁以上可更早。月经明显异常、已知输卵管或男性因素等不必等满期限，双方评估应衔接，不只检查一方。 S165 具体路径见孕期卷，不只要求可能怀孕者调整生活。暂不生育选择适合避孕，不生育者可以建设支持与未来照护，孩子并不自动等于可靠养老系统。  治疗、流产或长期未受孕可能有身体、情绪与经济负担，不用放松就好带过，也不将结果归咎于一次情绪或一餐。专业评估与双方可承受边界一起进入决定，不无限追加。"},{"ch":11,"id":"c11-s006","title":"11.7　照护首先需要连续性","text":"不只算总小时，还看分布、能否离场、夜间打断与主照护者生病后的接替。一页交接表记录本人偏好、必要任务、异常、用品和专业联系。  真正替班需要知道怎样完成任务，不让疲惫者一边休息一边远程指挥。复杂问题可寻求社区、社会工作、康复和正规照护支持，按可获得资源安排。  照护者本人有看病、吃饭、休息和拒绝额外任务的资格。把这些排进计划，不留到别人全部满意后才允许发生。"},{"ch":11,"id":"c11-s007","title":"11.8　家庭运行会处理协调，不审判人格","text":"选择双方不极度疲惫时，讨论下周不可移动事项、责任、费用和独处需要。情感深谈另约，不把全部矛盾塞进一次排班。  标准描述为可观察结果，例如厨房结束后台面可用、食品妥善保存，不说像我一样认真。不同偏好可以分工或接受足够好。暂停冲突应有返回时间，不能无限冷处理；暴力与控制进入安全分支，不以沟通练习包办。"},{"ch":11,"id":"c11-s008","title":"11.9　管理者不把自己的透支复制给别人","text":"深夜派普通任务、频繁改优先级和要求随时在线，会改变他人恢复条件。明确紧急定义、响应时限和休息边界，不用自己也辛苦取消组织责任。  业务建立授权备份：流程、承诺、权限与交付状态能接续。备份保护公司，也让个人有生病、休假和处理家庭事务的余地。短期冲刺要有范围、结束条件和后续恢复，没有期限的冲刺就是常态制度。"},{"ch":11,"id":"c11-s009","title":"11.10　财务压力进入现实排序","text":"先看必要生活和治疗，不为让预算漂亮把健康成本藏到未来。区分安全照护、严重违约后果、可协商延期与形象消费。法律和债务事项寻求当地合格帮助，不用新高风险借贷自动覆盖旧压力。  共享风险的人应获得相称的信息，不能要求对方承担债务却拒绝说明承诺；同时合理个人隐私和独立资源应保留。透明不等于一方永久监控另一方每笔正常支出。"},{"ch":11,"id":"c11-s010","title":"11.11　父母需要帮助时，先看任务","text":"共同做饭、走熟悉路线、处理实际事务，了解哪一步变难。不会新手机或一次忘事不等于整体认知下降。提出具体帮助选项，保留本人决定。  持续功能变化或安全事件要评估，不在家族群投票决定接管财产。平稳时讨论紧急联系和未来偏好，正式授权按当地法律，目的在听见本人而非推行子女预设方案。"},{"ch":11,"id":"c11-s011","title":"11.12　给私人身份留一个角落","text":"保留一项不只服务别人的活动，不必优秀、昂贵或可变副业。问最近因好奇做过什么，是否有不围绕分配任务的关系。责任不是唯一自我定义。  长期无兴趣、无恢复感或麻木时，不只追加娱乐，也考虑睡眠、情绪和负荷评估。  展开多重责任日M 晨间确认不可移动责任、实际接手和备用。将疲惫纳入驾驶、设备与决策风险。工作保留主目标，新任务明确替代关系。 交接写状态，不写人格评价。晚间收尾并保留短而真实的个人或关系时段。超载时找上游缺口，每周改一个能减少重复劳动的接口，熟练后回归常规。  一个不允许任何人生病、犯错或暂退的系统，即使平时效率很高，也不是稳健生活。最优不是每个角色满分，而是重要责任可靠、本人的恢复与选择仍被保护。"},{"ch":12,"id":"c12-s000","title":"12.1　年龄提醒复核，不替人决定退场","text":"本卷不假设每个人四十五岁出现同样变化。以本人过去功能、当前目标与资源为参照，不用同龄榜单判定合格。维护看三条线：持续新变化、治疗预防未闭环、生活是否支持重要功能。  年度目标可分保住、恢复、尝试。保住独立出行，恢复受限活动，尝试新学习或关系，可以并行。不是风险全部清零后才允许生活。"},{"ch":12,"id":"c12-s001","title":"12.2　四十五至四十九岁：风险档案不是报告堆","text":"记录重要家族史、疾病、吸烟暴露、已知指标、用药和复查。家族史尽量有关系、诊断和发病年龄，不将模糊印象当事实。  高血压可无明显症状，精神好或不头晕不能排除；异常应规范测量并评估，生活调整不能自动代替需要的治疗。 S74  询问风险判断来自单项还是整体，是否需确认测量，收益与复核时间是什么。参考范围内不保证所有情境无风险，一次轻微超出也不自动要求治疗。具体解释依病史与方法。"},{"ch":12,"id":"c12-s002","title":"12.3　五十至五十四岁：预防要走到结果处理","text":"筛查按所在地、器官、年龄、家族史和既往结果选择，不越全面越好。重点是预约、完成、取得解释和后续行动，完整原则见卷二十。  检查前核对准备、药物、交通、陪同、结果时间和后续成本。禁食停药按团队要求，不复制网上通用攻略。结果后明确下一次日期和提前联系条件。  别让昂贵检查挤掉牙痛、听力、睡眠或血压等实际问题。能改善每天生活的基础事项，不应被更像科技的项目遮住。"},{"ch":12,"id":"c12-s003","title":"12.4　五十五至五十九岁：为下一阶段保留选择","text":"讨论工作量和居住不等于立刻退休。分清收入需求、身份、社交和工作兴趣，再分别设计，避免一个职位承担全部人生功能。  居住从入口、楼梯、浴室、服务距离和可靠关系评估。暂不搬也可改善照明和常用物位置，不必一次预言未来三十年，但尽量别制造难逆障碍。  重要资料和事务应有安全可接续方式，不只本人知道。接续不等于公开所有密码，授权、最小权限和恢复测试见卷二十四。"},{"ch":12,"id":"c12-s004","title":"12.5　围绝经期：围绕症状与本人目标","text":"月经、潮热、睡眠、情绪和泌尿生殖不适可能变化，程度不同。记录最影响生活的几项即可。绝经后出血即使少量或一次也要评估，不能自行解释为恢复年轻。 S75  向医生描述真实影响，如夜醒妨碍工作、疼痛妨碍亲密。不要把所有疲劳、心悸和情绪变化都归此阶段，其他原因仍需考虑。  激素与非激素方案应结合症状、病史、风险和偏好讨论，不是人人必用，也不是一概不能谈，更非统一抗衰处方。 S26 剂量、途径、配合治疗和复查由合格人员确定。"},{"ch":12,"id":"c12-s005","title":"12.6　不经历绝经者同样需要针对性评估","text":"性欲、勃起、精力和体形变化可涉及睡眠、关系、药物与疾病，不能凭年龄和网络问卷认定激素不足，不自行用睾酮。说清持续情况、病史和目标，避免正常差异全部医疗化。  性健康不等于固定频率或表现。讨论舒适、同意、疼痛与保护，症状需要诊疗，不用不明成分产品掩盖。身体价值不以性功能和生育能力为唯一标准。"},{"ch":12,"id":"c12-s006","title":"12.7　肌肉、骨与关节围绕任务维护","text":"列想保有的任务：提物、台阶、起身、地面活动、旅行或运动，再拆力量、平衡、耐力、活动范围和技巧。训练细则见卷十八，不仅关注体重外形。  骨质疏松在骨折前可能无明显症状，男性也会受影响。低创伤骨折、相关家族史或长期某些药物，应讨论评估，喝奶和体形结实不能排除。 S76  关节不适不在完全不动与忍痛练之间二选一。急性损伤、红肿热痛或骤变先评估，再安排活动。记录任务影响，不将每天疼痛数字当唯一进展。"},{"ch":12,"id":"c12-s007","title":"12.8　感官输入影响参与","text":"小字、噪声中谈话和反复确认变费力时，调整字体、照明、座位与交流，按变化安排视听评估。别长期依赖猜测，也不将可改善问题全部视为年龄。  交流先降背景噪声、面对对方、清楚正常语速，而非直接吼。突然明显视听变化及时评估。退出聚会可能是听不清，少读书可能是看得累，先问障碍再评价动机。"},{"ch":12,"id":"c12-s008","title":"12.9　睡眠：打鼾不代表睡得香","text":"大声鼾声伴暂停、喘憋、反复醒或白天困倦，值得评估睡眠呼吸暂停，不能靠手表确诊。 S77 困倦驾驶与设备风险当天就需处理，不能等检查结束。  失眠可能被疼痛、潮热或夜尿打断，分流见卷十六。不要统一添加酒精、镇静产品或深睡补剂，不用他人处方。若监测反而制造焦虑，可降频，保留能改变行动的信息。"},{"ch":12,"id":"c12-s009","title":"12.10　体形管理避免惩罚逻辑","text":"变化有意还是无意、速度怎样、饮食活动药物是否改变、有没有其他症状，先说清。无意下降不自动好，衣服变紧也不自动授权极低热量饮食。  调整保留足够供给、可接受食物与社会生活，不因聚餐就禁食或过量运动补偿。评价同时看体力、睡眠、可持续性、必要指标和感受，不让单一数字统治生活。"},{"ch":12,"id":"c12-s010","title":"12.11　角色需要重新协商","text":"孩子长大、父母需要帮助、伴侣工作变化，旧分工不会自动适应。分别讨论需要、愿意和能做到的事情，不把能力不足直接视为不关心。  离岗后不必立刻用同等头衔填空，孩子离家后关心不等于继续全管。保留跨角色关系，避免一个角色受挫时所有支持一起消失。"},{"ch":12,"id":"c12-s011","title":"12.12　年度维护的最小文件","text":"一页记录重要变化、当前治疗、关键目标、下一步和最重视的功能。原报告另存。优先新问题、持续疾病、明确到期项目和药物复核，其余分散安排，不一天完成全部。  展开中年维护接口R 普通日沿用底座，不每天加一套抗衰动作。持续变化按分流处理，不等年度体检，也不立即买十种产品。 定期关闭一个行政或医疗环节，年度比较功能与目标。若健康方案长期牺牲睡眠、预算和重要关系，重新检验净价值。基础行动优先，年龄不是退出生活的命令。"},{"ch":13,"id":"c13-s000","title":"13.1　不从退休身份推导能力","text":"退休与保障规则因地区和时间不同，本书不指定必须退出工作的生日。决定看本人意愿、工作条件、收入和支持，而非单一标签。  健康老龄化关注在具体环境中能否做重视的事，不要求完全无病。人群差异很大，环境支持能够改变功能，没有适合所有老人的统一日程。 S22  先列想去哪里、见谁、学什么、继续承担和停止什么，再反推支持。活动可以是舞蹈、研究、编程或安静阅读，不由别人想象的适老生活决定。"},{"ch":13,"id":"c13-s001","title":"13.2　六十至六十四岁：试运行时间结构","text":"工作减少后，原有通勤和任务锚点变化。先稳定起居、进餐、活动、联系和维护，其余灵活，不立即用课程填满。  观察是否恢复、是否真实参与、是否长期陷入本人并不满意的被动消耗。偶尔娱乐不是问题，长期挤掉想做的事才需要调整入口与环境，而非羞辱性禁令。  继续工作可讨论任务、夜班、工具与通勤，保留学习机会。不要因年龄默认不愿学，也不为证明年轻接受不必要危险。"},{"ch":13,"id":"c13-s002","title":"13.3　六十五至六十九岁：建立任务基线","text":"在真实生活观察起身、转身、出行、药物、账单和沟通，而非家人偷偷打失能分。本人参与支持地图，知道记录用来做什么。  写具体限制：平路可以、夜间楼梯不稳；纸账单能看、手机字太小；原本会管理药物、最近处方变化造成混乱。它们分别指向环境、界面或医疗整合，不必笼统增加限制。  正式功能测试由合适人员指导。已有跌倒、疼痛、头晕或虚弱者，不在家无保护挑战单脚站和地面起身以证明达到网络标准。"},{"ch":13,"id":"c13-s003","title":"13.4　七十至七十四岁：增加备用路径","text":"交通临时不可用怎样就医，主要联系人不在谁接应，断电时信息哪里找。备用不是多几个人监控，而是关键功能不依赖单点。  常用品无需攀高，灯和开关易达，电话和助具在手边，通道清楚。改动先试用，不突然重排熟悉环境。帮助明确时间、范围、反馈和退出，接受服务不等于放弃表达不满意的权利。"},{"ch":13,"id":"c13-s004","title":"13.5　活动以能力和目标分级","text":"老年活动通常仍包含有氧、力量与平衡，按能力和病情调整。达不到通用量时仍寻找安全参与方式，而不是全停。 S33  去市场需要走、转、携物与休息；园艺可调整工具高度和分段；轮椅使用者围绕上肢、转移、耐力和兴趣适配。复杂情况寻求康复支持，不由家人凭视频强练。  记录去了哪里、需要怎样帮助、回来能否正常生活。只有步数会漏掉力量、轮椅和参与，也可能鼓励走到无法安全返回。"},{"ch":13,"id":"c13-s005","title":"13.6　跌倒预防是一组接口","text":"风险涉及平衡、感官、疾病、药物和环境。跌倒或明显担忧后评估原因，不只叮嘱小心。合脚鞋、去绊倒物、可靠扶手和合适助具属于具体方向。 S78  沿床到厕所、厨房到餐桌和门到电梯的真实路线检查摸索、急转、跨越和手不够用之处。先修实际障碍，不大量购买未用产品。承重设施要可靠安装，不能用不稳定吸附件代替。  夜间单独检查灯、鞋、助具和通道。起身头晕、新不稳需要评估，不自行靠少喝水避免夜间起床。"},{"ch":13,"id":"c13-s006","title":"13.7　药物按真实执行复核","text":"把处方、非处方、草药与补剂放同一清单，说明实际服法与未遵循原因。目的让团队看到现实，不是接受批评。  每项回答为什么用、谁管理、何时复核。药多不等于可自行停，用多年也不等于永远必要。症状变化带清单讨论，具体调整由团队完成。  药盒和提醒按能力适配，先确认能否离开原包装和储存条件。看不清或认知受限时，不把复杂分药交给未受训者。完整协议见卷二十。"},{"ch":13,"id":"c13-s007","title":"13.8　吃得到、吃得动、吃得下","text":"食欲问题可能涉及采购、准备、牙口、吞咽、药物、情绪和疾病。先问实际障碍，不一律让人多吃或买营养粉。  无意体重下降、持续少吃或功能受影响要评估。虚弱时沿用年轻减重限制可能不适合；能量蛋白结合营养与疾病状态，不按年龄统一加量。  共同吃饭可支持，但不强迫疲惫聚餐。在安全计划内保留熟悉口味、安静环境和节奏。食物也承担文化与选择，而不只是营养素。"},{"ch":13,"id":"c13-s008","title":"13.9　学习与贡献不只剩娱乐","text":"可做真实项目：教技能、整理历史、社区协作、创作或新工具。责任匹配意愿，不因有经验默认无限免费贡献。  学技术从一个可用目标开始，如预约或联系朋友，调整字体、输入和提示。一次讲完所有功能再把遗忘归年龄并不合理。  传承记录判断与约束，不只结论。说明当时为何适用、今天变化后哪里需改，既尊重经验，也避免将过去成功方法永久化。"},{"ch":13,"id":"c13-s009","title":"13.10　关系质量与隐私","text":"独居不必然孤独，共居也不保证理解。分别看平时交流、求助回应和愿意参与的活动。电话数量不能代替关系感受。  联系节奏双方商定，平稳时未即时回复不自动失踪；有明确风险时制定未回应流程。定位和摄像须考虑本人同意、数据权限和谁负责响应，不以安全无限监控。  新关系保持开放，同时独立核实大额转账、产品和保密要求。支持判断与防骗不等于取消所有交易权。"},{"ch":13,"id":"c13-s010","title":"13.11　外出先准备返回能力","text":"除了目的地，还看药物、资料、分段体力、厕所、休息、无障碍和同行分工。身体变化后先小规模体验，不用别人都能走决定行程。  运输药物、时区、储存、保险和目的地卫生要求需出发前查官方现行规则。费用已付不代表必须继续高风险活动，能调整更有利于保留以后外出的可能。"},{"ch":13,"id":"c13-s011","title":"13.12　提前表达照护偏好","text":"平稳时谈重病时重视舒适、清醒、独立、延长生命或关系等哪些目标。可以有冲突和变化，不需一次永久答案。  指定希望参与的人，按当地法律了解授权和预先照护文件。家人的理解应来自表达，不是推测一定希望不惜一切。  展开自主老年日程O 继续成人底座，按状态调整节奏。活动看环境和辅助，进食看摄入与舒适，用药统一，每天保留一件本人选择的事。 一周分散外出、活动与维护，避免一天耗尽后多日恢复。新功能变化展开评估，不折叠成老了都这样。帮助哪一步说清，能自己完成的保留；成功看仍能参与多少重视的生活。"},{"ch":14,"id":"c14-s000","title":"14.1　按任务选择支持","text":"本卷不要求到七十五岁就接受护理。能够独立且愿意继续原有活动的人沿用卷十三；出现特定困难才启用相应支持。需要协助洗澡，不代表不能处理钱款、不能决定吃什么或不能表达治疗偏好。  每项任务可标为独立、工具辅助、提醒、旁边保护、部分代做、完全协助。状态可以随疾病、环境与一天精力变化。标记用于分配支持，不是人格等级。照护计划第一句应写本人希望怎样生活，第二句才是哪里需要帮助。"},{"ch":14,"id":"c14-s001","title":"14.2　七十五至七十九岁：尽早处理具体变化","text":"比较本人原有状态。原来能去市场，现在多次停下；原来能安排药物，现在连续混淆；原来参加聚会，现在因为听不清回避。这样的记录比最近老了很多更有用。  先看工具、药物、环境、疼痛与感觉是否变化，持续或进展问题再进入专业评估。不能只增加摄像头来应对所有变化，也不能因本人还能完成其他任务就忽视一个持续恶化的问题。  支持从一项开始并试用。共同采购仍由本人选择食物，协助核药仍解释变化，接送不取消全部外出。帮助解决卡点，而不是借机替换全部生活。"},{"ch":14,"id":"c14-s002","title":"14.3　八十至八十四岁：治疗负担也是负担","text":"多科就诊和多种治疗需要交通、理解、执行、费用与恢复。把实际负担带入诊室，明确最看重减少症状、保持清醒、走路、在家生活还是其他目标。单项指南目标不能不经协调全部相加。  可以请求一份统一计划：主要协调人、优先问题、可观察问题和复核时间。必要时讨论简化剂次与安排，但具体调整由团队完成。家属不要自己删药，也不要将复杂清单执行失败归咎于本人不配合。"},{"ch":14,"id":"c14-s003","title":"14.4　八十五至八十九岁：压力测试照护系统","text":"在平稳时讨论主照护者生病、夜间设备故障、临时复诊和药物短缺。每种情境有一个真实联系人和下一步，不只写家人负责。备用人需要掌握当前计划，不能危机时从零学习。  明确受训者才能做的操作。复杂转移、管路、伤口和吞咽不能凭短视频上手。培训应有示范、回演、纠错和求助入口；多发几页说明书不等于学会。"},{"ch":14,"id":"c14-s004","title":"14.5　晨间第一轮：先看状态，再开始任务","text":"进入前让本人知道谁来了、准备做什么，确认是否清醒、是否有新不适。不要一进门就拉被子、测一串数值和安排起床。能表达者先听本人，表达困难者观察与平常不同的动作、表情、呼吸和反应。  把当天必须任务与可推迟任务分开。本人明显疲倦时，可以调整洗浴或外出，不因此取消必要治疗与安全。晨间例行流程的目的应是帮助进入一天，而非在短时间完成最多护理记录。"},{"ch":14,"id":"c14-s005","title":"14.6　转移与起身：保护两个人","text":"需要协助的人按已经评估的方式转移，不突然拉手臂、不靠一名家属硬抱。实际设备的刹车、脚踏、扶手和高度按专业指导核对。不能凭看起来结实就把桌椅当承重支撑。  操作前说明目标、确认本人能做的部分、清理路线、准备好终点。途中才找椅子或调整脚踏会增加混乱。若今天能力明显不同于原计划，暂停并求助，不强行照旧完成。照护者腰背或肩部受伤也会破坏照护连续性，因此工具与培训同时保护双方。"},{"ch":14,"id":"c14-s006","title":"14.7　如厕：时间、位置与尊严","text":"了解本人习惯、路线和求助方式，衣物易穿脱，必要设施可靠。门是否便于求助与保护隐私，可以提前共同决定，而不是在紧急时争论。不能因为担心弄脏就长期限制饮水或不让外出。  尿失禁值得评估类型和原因，不是必须接受的年龄结局；治疗与支持需要个体选择。 S83 用品的作用是保持生活和皮肤舒适，不是代替评估。更换时先解释、适度遮挡，不在无关人面前讨论排泄细节。"},{"ch":14,"id":"c14-s007","title":"14.8　洗浴：不是每次都必须完成全套","text":"选择本人较有精力的时间，用品预先摆齐，地面和室温适宜，帮助范围提前说清。身体不适、伤口或医疗限制需要团队指导。不能为了固定护理表强行站立或长时间洗浴。  可根据状态分区清洁、调整时段或使用适合设施，但安全承重和水温控制不能省。衣物与毛巾准备好，避免洗完后长时间等待。本人能洗的部位保留自行完成，成人照护不要使用幼儿化语气。"},{"ch":14,"id":"c14-s008","title":"14.9　口腔与假牙：小任务连接进食与交流","text":"每天的口腔护理应有负责人，能够自己做就提供工具和适合姿势，不能只因吃得少而取消。牙痛、口腔破损、假牙不适或口干会影响进食，应提出来而不是只换成更软食物。  假牙清洁和夜间处理按牙科及产品要求，不以热水、强清洁剂或自行修磨解决。将牙刷、杯子和假牙容器明确区分，照护交接说明用品位置，避免被当作普通杂物丢弃。口腔完整规则见卷十九。"},{"ch":14,"id":"c14-s009","title":"14.10　穿衣：支持表达，也支持功能","text":"衣物选择考虑温度、摩擦、关节活动、管路和如厕，同时保留颜色、风格与个人偏好。不因便于照护就默认所有人只能穿同样衣物。扣子、拉链或鞋具困难可以改接口，不代表本人没有穿衣决定权。  协助前说明顺序，避免突然移动疼痛关节。发现新肿胀、皮肤破损或鞋子明显不合脚时记录并评估。本人愿意打扮不是不必要负担，它可能是重要身份和社交表达。"},{"ch":14,"id":"c14-s010","title":"14.11　进餐：完成一顿饭的真实链条","text":"先看食物能否获得、是否合口味、能否坐到餐桌、看清并拿起餐具。准备失败不能被归为食欲差。需要协助时尊重节奏，小范围提供选择，不边看手机边机械喂食。  观察吃到多少、是否疲惫、是否出现咳呛或不适，记录能改变下一步的异常。不要以盘子清空作为唯一成功，也不以一顿吃少立即强加大量营养品。持续摄入不足或体重无意下降，应讨论评估与适合营养支持。"},{"ch":14,"id":"c14-s011","title":"14.12　吞咽分支：不能靠大声催促","text":"进食饮水时咳嗽、呛咳、卡住感、湿性声音、气短或反复胸部感染等，需要及时评估吞咽；问题可能涉及不同食物和液体，并不只发生于高龄。 S80  已确诊者使用评估后的姿势、质地、餐具和协助方案。不要给所有人统一加增稠剂、用吸管或仰头饮水，也不将药片随意碾碎混食。吞咽方案与药物剂型需要分别确认。急性气道梗阻按急救培训和调度处理，不能继续喂水试图冲下。"},{"ch":14,"id":"c14-s012","title":"14.13　皮肤与压力：按风险制定计划","text":"行动受限者更易发生压力损伤，骨突处持续变色、温热、硬软改变、疼痛或破损需要关注；较深肤色不一定呈鲜红。怀疑损伤应联系医疗人员，伴发热、流脓、明显加重疼痛等更需及时处理。 S82  由团队制定换位、减压、皮肤与营养计划，频率依据风险、表面、状态和耐受，不能将固定两小时当作所有人的唯一答案。专用床垫不意味着无需其他护理。不要在可疑损伤处用力按摩，也不自行剪除组织或随意换药。"},{"ch":14,"id":"c14-s013","title":"14.14　药物交接：读得懂，还要知道已经做了什么","text":"每次变化更新同一份清单，明确从何时开始、旧药怎样处理、谁解释。新旧包装同时存在时避免重复。实际给药记录需要能区分已给、未给、拒绝或因何暂缓，不只写一个模糊勾号。  本人拒绝药物时先了解吞咽、恶心、困惑、担心或意愿，不偷偷藏入食物。隐蔽给药涉及严格医疗和法律边界，不能由家属自行决定。漏服和呕吐后的处理查具体药物计划，不自动补倍量。"},{"ch":14,"id":"c14-s014","title":"14.15　疼痛与不适：表达困难不代表没有感受","text":"询问具体位置、动作影响、开始时间和本人最希望缓解什么。无法流畅表达时，观察护住某部位、面部变化、回避移动、睡眠和行为改变，并提供适合沟通方式。观察用于帮助专业评估，不等于家属自行确定原因。  镇痛目标可以是能够翻身、吃饭、休息或交流。药物与非药物措施按团队安排，出现新严重症状先评估。不能把安静当作无痛，也不要求忍耐来避免被视为麻烦。"},{"ch":14,"id":"c14-s015","title":"14.16　认知改变：按具体决定支持","text":"痴呆不是正常老化必然结果，持续记忆、思考和生活能力变化需要评估与支持。 S81 诊断不自动取消全部选择，决定能力可能因事项复杂度与状态不同，需要专业和当地法律框架判断。  沟通可放慢、减少同时提问、用熟悉语言与可见物帮助。可以给少量具体选择，而不是十个选项；也不要每次都考还记得我是谁。意见不同不等于没有判断能力，家属方便不能代替本人利益。"},{"ch":14,"id":"c14-s016","title":"14.17　突然混乱：不是等几天观察的年龄现象","text":"突然认不清时间地点、无法清楚思考、明显异常言行或新的困惑，应立即获得医疗帮助，原因可能多样，不自行诊断为痴呆加重。 S79 既有认知问题也不能排除急性情况。  等待帮助时保持陪伴和环境安全，说明身份与位置，准备药物清单和最后正常时间。不要多人围问、争辩或强行要求回答大量问题；也不要为让人安静自行增加镇静药。急症优先覆盖普通照护表。"},{"ch":14,"id":"c14-s017","title":"14.18　视听和沟通设备","text":"眼镜、助听器、义齿和沟通板应在需要时可用、状态正常。设备找不到或没电，可能让人看似理解下降。就诊、住院和转移时记录随身物，不把它们当次要附件。  交流先减少背景干扰、面对本人、清楚说明，不在他面前只和照护者谈论他。辅助沟通可包含图片、文字、手势与技术，选择本人能使用的方式。对隐私问题提供尽可能独立的表达机会。"},{"ch":14,"id":"c14-s018","title":"14.19　白天仍应有生活，而不只是护理","text":"在护理之间安排本人选择的小活动：看窗外、听喜欢的音乐、读几段文字、触摸熟悉材料、与人讨论一件事。活动不必全被标为认知训练，也不要求表现提升。  保留贡献机会，例如选择菜单、讲一个经验、参与简单整理或决定来访。帮助者不要为了效率把所有决定提前完成。即使身体受限，一个人仍可以影响自己的环境和关系。"},{"ch":14,"id":"c14-s019","title":"14.20　出院交接必须重新核对能力","text":"出院前问当前哪些任务与住院前不同，能否安全转移、进食和如厕，是否需要设备与培训，何时复诊，谁负责结果。回到熟悉住所并不自动意味着原计划仍适用。  把停药、新药、剂量变化和临时药分别说明，确认药物实际到手。交通安排考虑座位、陪同、楼梯和到家后的第一顿饭，不止预订一辆车。若必要支持未准备，应向团队明确表达，不把困难藏到回家后。"},{"ch":14,"id":"c14-s020","title":"14.21　夜间方案：保护睡眠与响应能力","text":"明确夜间哪些事项必须观察，哪些无需例行叫醒，使用个体医疗计划而非家属焦虑决定。呼叫装置或电话在本人可使用位置，通道有适当照明，必要用品顺手。  传感器报警必须对应响应人、阈值和失败备份，否则只是制造声音。连续误报会消耗注意力，应复核设置与用途。监控需尊重同意与隐私，不把卧室全天直播默认成唯一照护方式。"},{"ch":14,"id":"c14-s021","title":"14.22　照护者也需要一份健康计划","text":"排班明确连续休息、吃饭、本人就医与替补。疲惫导致发怒、动作粗暴、重复用药或无法安全驾驶时，系统已经需要调整，不是再讲一次责任感。  求助应具体到任务与时段。不能让某一位亲属永远值班，只因他住得近、没有孩子或看起来好说话。正式服务也要核对能力、责任、费用与投诉渠道，监督服务质量不等于无边界监视工作人员。"},{"ch":14,"id":"c14-s022","title":"14.23　两种不同的日程示例","text":"独立生活但听视受限者，仍可自己安排早餐、活动与社交，新增只是照明、设备维护和预约支持，不需要全日护理。其日程重心仍是本人目标。  需要部分协助、近期出院者，晨间确认状态与计划，按受训方式转移，进食依吞咽与营养安排，白天穿插恢复和喜欢活动，晚上交接明确夜间响应。这里新增的不是更多娱乐项目，而是每个必要任务都有可执行接口。"},{"ch":14,"id":"c14-s023","title":"14.24　每周复盘只看真正变化","text":"问本人最不舒服的一件事、最希望保留的一件事，再问照护者哪个环节最容易失败。选择一个问题修正：用品位置、沟通方式、替班、药物整合或外出路径。  维持不变的规则折叠保存，不每周重写。出现新诊断、跌倒、出院、能力变化或支持者退出才重新展开相关部分。照护文件应跟随生活，而不是生活被文件驱动。"},{"ch":15,"id":"c15-s000","title":"15.1　九十岁不是临终诊断","text":"年龄不能单独决定预后、治疗价值或应否继续学习与活动。功能稳定的人继续前卷日程；需要帮助的人启用对应任务支持。生命末期部分由实际疾病和专业评估触发，也适用于更年轻的人，不能因为读到这一卷就自动进入。  本阶段先问今天仍然有什么值得期待。它可以是一位来访者、一段音乐、一顿熟悉饭、一封信、一点户外光线或一项尚未完成的工作。别人觉得小的事，可能是本人重要的生活内容，不需要达到宏大意义标准。"},{"ch":15,"id":"c15-s001","title":"15.2　九十至九十二岁：把愿望缩放，不直接删除","text":"无法完成原来的长途旅行，可以讨论更短路程、更多停留、无障碍支持或以其他方式接触相关人和地点。缩放目标保留其核心价值：是想见人、看景、离开日常，还是体验自主？不同核心有不同替代方式。  不能每次用年纪大别折腾结束讨论，也不能为完成愿望忽视本人当前安全。列出必要支持、可取消部分、停止条件和本人愿意承担的负担，让选择变得可说明。"},{"ch":15,"id":"c15-s002","title":"15.3　九十三至九十五岁：减少无意义的搬动与等待","text":"诊疗、家务和社交安排尽量整合，减少反复出门、长时间排队和不必要转换。预约前说明行动、听视、吞咽或沟通需要，确认场地和服务是否可及。  一次外出不仅算活动本身，还算准备、交通、转移和恢复。活动结束后持续多日无法回到平常状态，提示安排需要重新设计。允许拒绝来访或提前结束，不因别人特意来就必须配合到疲惫。"},{"ch":15,"id":"c15-s003","title":"15.4　九十六至九十九岁：保留对环境的影响力","text":"本人可以决定衣物、音乐、会见谁、怎样被称呼、房间物品和谈话内容。身体协助增加不应使所有决定自动转交。表达缓慢时给时间，不替每句话抢答。  生活史可以记录，但不是必须交付的最后作品。有人愿意讲过去，有人更想讨论今天，不要一直问还有什么遗憾。录音、拍摄和公开需同意，故事中的其他人也有隐私。"},{"ch":15,"id":"c15-s004","title":"15.5　一百岁生日当天","text":"先按本人状态完成平常需要，庆祝服从舒适与意愿，不让生日打断药物、休息和必要照护。邀请多少人、是否拍照、吃什么、持续多久，由本人尽可能决定。  不要求发表长寿秘诀，也不要把个人经历当可复制医学证据。可以庆祝生命与关系，而不从幸存者经验推导所有人照做就能百岁。生日之后继续按状态和目标生活，书到一百岁结束，人的权利不会结束。"},{"ch":15,"id":"c15-s005","title":"15.6　从疾病名称转向照护目标","text":"重病时先问最希望保留什么：清醒、交流、舒适、回家、继续某项活动，还是尽可能延长生命。目标可能相互牵制，应由本人和团队讨论，而不是默认所有人同样排序。  把目标转成可观察结果。例如希望见家人，需要交通、探视与症状控制；希望保持清醒，需要讨论药物和症状之间的取舍；希望在家，需要支持能力和突发处理。价值表达只有接到操作上，才真正影响照护。"},{"ch":15,"id":"c15-s006","title":"15.7　缓和医疗并不等于放弃","text":"缓和医疗关注严重疾病相关的身体、心理、社会和精神痛苦，可与其他治疗并行，不应只在最后几天才想到，也不限癌症或高龄。 S23  提出转介时可以说目前症状和治疗负担已经影响生活，希望增加支持。它不自动取消原有治疗，也不是宣告某个准确死亡日期。服务可获得性不同，应向当前团队了解本地资源。"},{"ch":15,"id":"c15-s007","title":"15.8　治疗决策的四个问题","text":"这项治疗希望改善什么，发生机会和不确定性怎样；需要承受什么，包括住院、恢复和后续支持；不做或延后有哪些替代；结果多久能够评价。不要只问能不能做，还要问做了以后可能怎样生活。  数字无法提供时，要求描述合理的较好、常见和较坏情境。无法保证不等于毫无价值，能够实施也不等于符合本人目标。医疗决定须与专业人员共同完成，家庭会议不能替代临床判断。"},{"ch":15,"id":"c15-s008","title":"15.9　试行治疗与复评","text":"某些情况下可与团队商定有限时间的治疗尝试：目标、观察指标、复评日期和无效时下一步。适用性由医疗情况决定，不是家属自行设定停药期限。  提前讨论复评可以避免后来只能在继续所有治疗与突然全部停止之间二选一。记录的是共同理解，不是让本人签一份以后不能改变的承诺。情况变化或意愿改变时，重新讨论。"},{"ch":15,"id":"c15-s009","title":"15.10　抢救决定必须具体","text":"不实施心肺复苏的决定针对心肺复苏，不等于停止其他适当治疗、疼痛缓解、护理和支持。 S87 相关术语、程序、文件效力和代理权限有地区差异，必须由本地团队和合格法律支持确认。  不要因年龄、残障、认知诊断或居住机构统一替一群人决定。也不能把家庭口头说不折腾当作完整有效医疗文件。日常紧急情况仍按已经正式确定的计划和当地急救要求处理，书中一般讨论不构成拒绝救治指令。"},{"ch":15,"id":"c15-s010","title":"15.11　预先照护计划是沟通，不只是签字","text":"记录谁应参与、本人重视什么、哪些情境特别担心、希望在哪里获得照护。文件应能在需要时找到，并让相关团队知道。重要变化后复核，不将多年前一句话脱离当时情境机械执行。  当本人暂时无法表达，依法有权参与者应尽量依据已知意愿与利益，而不是自己的恐惧、内疚或亲戚压力。存在分歧时请团队解释并使用适当伦理、社会工作或法律支持。"},{"ch":15,"id":"c15-s011","title":"15.12　在家、医院或机构：比较实际支持","text":"地点不是善终质量的唯一标准。在家需要实际照护、药物、设备、夜间响应和人员；医院可能提供某些症状处理，但也有环境与探视负担。机构质量需要具体观察，不由名字和装修判断。  选择前列出一天和夜间的真实需求，逐项确认谁完成。不要为满足一定在家的观念让一名亲属独自承担无法安全完成的任务，也不要为了成人方便忽略本人明确偏好。现实限制可以坦诚讨论，不需要包装成唯一正确选择。"},{"ch":15,"id":"c15-s012","title":"15.13　症状控制：不把忍耐当作美德","text":"疼痛、气促、恶心、便秘、焦虑和其他困扰应反馈团队。描述严重程度之外，还说影响了什么。治疗方案、救急药和何时联系由专业人员明确，不能自行增加镇静或止痛药。  照护者可以学习非药物支持和观察，但不能因怕成瘾或怕麻烦擅自扣除已经合理安排的治疗。担心副作用应讨论监测和替代，而不是让本人在无解释中忍受。"},{"ch":15,"id":"c15-s013","title":"15.14　食物与水：临终情境与普通营养不同","text":"经过团队判断处于临终阶段时，食欲和吞咽可能变化，强迫进食并非必要照护。无法安全吞咽时，药物途径和口腔舒适需要专业安排；家属可按指导湿润口唇，不擅自灌水。 S86  这个分支不能用于解释所有高龄者吃得少。尚未明确临终、出现新吞咽或摄入问题时仍需评估可治疗原因。不要因为怕延长痛苦取消普通病人的食物，也不要因为怕饿着对临终者强行喂食。"},{"ch":15,"id":"c15-s014","title":"15.15　呼吸、意识与行为变化","text":"临终时可能更嗜睡、呼吸模式改变或出现混乱，但每个人不同，家属不能仅凭一项表现自行判断剩余时间。新痛苦或行为改变仍要联系团队，可能存在可处理原因。 S86  准备好夜间电话、明确谁来评估和什么情况呼叫急救。若此前没有正式末期计划，突然无反应或呼吸异常仍按急症处理。避免把一般网页描述当作可以不求助的依据。"},{"ch":15,"id":"c15-s015","title":"15.16　陪伴无需持续说话","text":"可以安静坐着、握手前先询问、读熟悉文字、放本人喜欢且不刺激的声音。本人不想说话时允许沉默。别要求一直保持积极、完成和解或安慰所有来访者。  不要在床边只讨论费用、遗产和谁付出多，仿佛本人已经不在。即使反应减少，仍以尊重方式说明照护。关系中的复杂历史不必在最后时刻被强制改写成圆满故事。"},{"ch":15,"id":"c15-s016","title":"15.17　遗憾、道歉与未完成关系","text":"愿意表达时可以说感谢、歉意、爱或具体回忆，但对方没有义务立即原谅。受过伤害的人不必因病情而放弃边界。和解不是获得好结局的必需条件。  不能见面时可选择信件、录音或由可信人转达，也可以决定不联系。尊重双方，不用最后机会施压。未完成本来就是人生的一部分，不必把所有关系问题在短期内解决。"},{"ch":15,"id":"c15-s017","title":"15.18　安排身后事务，但不让事务吞掉当下","text":"有意愿和能力时，按所在地法律整理遗嘱、授权、财产与数字账户处理，寻求合格支持。医疗意愿与财产文件用途不同，不要混成一份未经核实的万能模板。  将必要资料位置和联系人交给适当人员，权限最小化。不要在本人虚弱时匆忙施压签署重大文件，也不要公开密码作为唯一交接方式。争议与利益冲突需要独立协助。"},{"ch":15,"id":"c15-s018","title":"15.19　死亡发生后的第一轮行动","text":"按已有照护计划联系负责团队或当地应急服务，由有资格人员确认并说明后续程序。地点、情境与法律不同，家属不应仅凭本书自行确认死亡、移除设备或处理遗体。  安排可信人陪伴主要家属，暂缓不必要群消息和重大财务决定。必要行政事项分配责任并记录，不让悲伤最强的一人同时处理所有电话。尊重宗教文化，但安全、法律与本人既往意愿仍需协调。"},{"ch":15,"id":"c15-s019","title":"15.20　哀伤没有统一进度表","text":"有人哭、有人成为事务处理者、有人暂时麻木，不能据此排名爱得深浅。不要要求必须经过固定阶段才算正常，也不规定多久必须恢复社交或清理遗物。  保持基本进食、睡眠机会和支持渠道，允许具体帮助。若长期明显不能生活、出现危险物质使用或自伤想法，应寻求专业帮助；急迫风险进入安全路径。失去宠物、朋友或非传统关系同样可以带来真实哀伤。"},{"ch":15,"id":"c15-s020","title":"15.21　留下什么，不必由社会标准决定","text":"遗产可以是财物、技能、作品、关系、照护、一个被改善的地方，也可以只是一段认真生活过的经历。无需为了证明一生值得而产出最后一本书或公开故事。  记录时选择本人愿意保留的片段，并注明回忆可能有误，不将口述自动变成无争议事实。家人可以同时保存不同版本，尊重复杂性，而不为了纪念删除全部矛盾。  展开生命末期支持接口L：只有实际情况适用时启用 当天先确认舒适、症状、意愿与正式医疗计划。必要护理和联系保持可靠，其他任务以本人可承受和愿意为准。活动可以缩短，来访可以拒绝，沟通可以沉默。 照护者有替班和求助，重要变化及时反馈。不要用普通健康打卡要求临终者，也不要把本接口套到仅仅高龄的人。若情况改善或目标改变，重新进入相应生活与治疗路径。  一百年的指南最后并不需要得出用身体榨取最多产出的结论。更重要的是，在拥有能力时发展它，在能力变化时找到支持，在关系中保有尊严，在不确定中作诚实选择，并允许有限的生命本身具有价值。"},{"ch":16,"id":"c16-s000","title":"16.1　先问睡眠机会，而不是先买助眠产品","text":"睡不够、想睡却睡不着、睡了仍很困，是不同问题。前者可能主要缺时间，第二类需要了解失眠、节律、疼痛和环境，第三类可能涉及呼吸、药物或其他疾病。不能用同一份睡前仪式包办。  先画真实的一天：必须何时起床，通勤多久，照护何时发生，工作何时结束，躺下后是否仍在处理事务。若只有五小时可睡，却试图靠床垫获得八小时恢复，结构上已经不成立。真正的第一动作可能是协商任务、交通或照护排班。"},{"ch":16,"id":"c16-s001","title":"16.2　分龄总时长参考","text":"以下为CDC公布的群体参考，婴幼儿包含午睡。它们用于识别机会是否大致足够，不是个体诊断阈值，也不保证在范围内就没有问题。 S05  年龄 每二十四小时睡眠参考 零至三个月 十四至十七小时 四至十二个月 十二至十六小时 一至两岁 十一至十四小时 三至五岁 十至十三小时 六至十二岁 九至十二小时 十三至十七岁 八至十小时 十八至六十岁 至少七小时 六十一至六十四岁 七至九小时 六十五岁及以上 七至八小时  新生儿仍优先保证适用喂养、安全睡眠和医学观察，不能为凑表格小时数延迟喂养或叫醒后训练。成人也不因某晚多睡就自动认为有病；要看变化、日间功能和其他症状。"},{"ch":16,"id":"c16-s002","title":"16.3　四种状态的入口","text":"第一种是机会不足：日程不给睡眠时间，先调整约束。第二种是环境不允许：噪声、光线、温度、拥挤、照护打断，先寻找具体改造。第三种是有机会但持续难睡：考虑专业评估。第四种是睡眠中呼吸、动作或白天清醒出现异常：按相应医疗路径处理。  这些状态可以叠加。一个轮班照护者既可能机会不足，也可能有呼吸暂停。不要因为找到一个合理解释就停止识别其他明显问题，也不要一次把所有可能疾病都当成自己的诊断。"},{"ch":16,"id":"c16-s003","title":"16.4　起床锚点与现实弹性","text":"选择与工作、学习和生活相容的起床范围，尽量保持可预测；入睡机会则根据需要向前安排。规律、安静较暗的睡眠环境、适当日间活动，以及避免临近睡眠的刺激物，是常用基础做法。 S88  规律不是每天误差必须归零。家庭危机、疾病和旅行可能改变安排，回到常规即可，不用第二天极端惩罚补偿。长期不断漂移则值得寻找原因，是工作制度、社交、拖延结束工作还是节律本身难以匹配。"},{"ch":16,"id":"c16-s004","title":"16.5　日间光线与夜间环境","text":"白天有条件时接触自然日间环境，晚上逐步降低不必要的强光和高刺激活动。照明应服务实际任务：需要安全如厕和照护时不能一味追求全黑。感光、眼病或特殊治疗者按专业建议安排。  不要把普通环境管理变成自行实施强光治疗。强光设备、时间安排与某些精神或眼科情况有额外考虑。无法户外时先利用现实可获得的光线和生活节奏，不因为条件不足放弃所有改善。"},{"ch":16,"id":"c16-s005","title":"16.6　睡前不是第二个工作日","text":"设置一个可完成的结束流程：记录未完成处、准备必要物品、停止非紧急回复，再进入清洁和安静活动。重点是给未完成事项可靠位置，不是要求大脑瞬间清空。  睡前待办越长越可能变成新压力。洗澡、阅读、音乐或轻松交流选择适合的一两项即可。仪式被旅行打断不应使人相信今晚一定睡不好；它是支持，不是必须严格执行的安全咒语。"},{"ch":16,"id":"c16-s006","title":"16.7　咖啡因、酒精和其他物质","text":"查看所有来源与使用时间，包括咖啡、茶、能量饮料和某些药品。影响持续时间有个体差异，可从减少靠近睡眠的使用观察，而非统一用杯数判断。孕期的专门上限见卷二，不可混用一般成人习惯。  酒精不应成为助眠方案，尼古丁和其他刺激物同样需要考虑。 S88 已经长期依赖酒精或镇静药者，不自行突然改变高风险用法，应寻求医疗指导，避免把戒断风险误当普通失眠。"},{"ch":16,"id":"c16-s007","title":"16.8　午睡要看用途","text":"午睡可以是补充、轮班安排或年龄需要，不是人人必须，也不是一概有害。若晚间难睡且午睡很长，记录时点与变化，和专业人员讨论。婴幼儿午睡不能套成人规则。  不要在必须马上驾驶或操作危险设备前，把短暂休息当成保证清醒的认证。醒后仍困就继续处理安全问题。午睡地点也要安全，特别是抱着婴儿、停在危险道路或使用可能遮挡呼吸的环境。"},{"ch":16,"id":"c16-s008","title":"16.9　晚上醒来时做什么","text":"偶尔醒来不必立即看表、计算损失或检查设备评分。先处理真实需要：如厕、温度、疼痛或照护，然后回到适合休息的状态。反复确认自己有没有睡着，可能使注意力持续围绕睡眠表现。  若长时间清醒且明显烦躁，可选择安全、低刺激活动，再在有睡意时返回；行动不便、跌倒风险或特定病情者需要适配，不能机械要求夜间下床。持续失眠应进入专业路径，不靠不断更换偏方。"},{"ch":16,"id":"c16-s009","title":"16.10　慢性失眠的治疗入口","text":"失眠认知行为治疗是慢性失眠常用的首选治疗，可通过专业面谈、电话或合适的线上方式开展，内容不只睡眠卫生，还包括思维、行为和睡眠安排。 S17  其中涉及缩短卧床时间的部分不宜凭一句话自行极端执行。癫痫、双相障碍、明显日间困倦、危险职业或其他复杂情况需要专业调整。不能用短期睡得更少作为意志训练，也不把本书的生活建议等同完整治疗。"},{"ch":16,"id":"c16-s010","title":"16.11　呼吸相关问题","text":"打鼾伴被目击的呼吸暂停、喘憋和白天困倦时，向医疗人员描述具体观察，必要时评估。诊断与治疗见相应睡眠服务，不能用一晚手机录音或手表排除。 S77  已经使用呼吸治疗设备者，旅行、面罩不适、漏气、皮肤压痛和清洁问题应向服务团队反馈。不要因为某晚感觉好就自行停用，也不要因为设备难受而默默放弃；可调整的接口问题需要被看见。"},{"ch":16,"id":"c16-s011","title":"16.12　夜间疼痛、夜尿与胃部不适","text":"记录是哪种症状先出现，是否与姿势、进餐、药物或活动有关。频繁被症状打断时，处理原因比单纯增加助眠用品重要。不能为减少夜尿随意严重限水，不能用多种止痛与镇静产品叠加解决。  卧室改造可以帮助，但不应掩盖新症状。新出现明显胸痛、严重气短、意识变化等，按安全卷处理，不因发生在夜里就归为焦虑或睡不好。"},{"ch":16,"id":"c16-s012","title":"16.13　儿童入睡：支持者共同执行","text":"先确认安全、年龄需要、喂养与身体状况，再讨论稳定顺序和回应方式。实际照护者要能执行同一套基本计划，不能一人使用一种方法并互相责备。幼儿对分离或环境变化的反应也需要理解。  不要以停止哭声为唯一效果指标。观察孩子白天功能、照护者状态、是否有疼痛或呼吸问题。褪黑素不是儿童日程管理的默认工具，使用前应与医疗人员讨论。 S89"},{"ch":16,"id":"c16-s013","title":"16.14　青少年：先修日程，不羞辱生物节律","text":"把上学、通勤、训练、作业和社交总量放在一起。学校起得早而任务结束晚时，问题不能全部由孩子承担。减少临睡前争执，协商设备存放和提醒，给真正的睡眠机会。  周末补觉可以显示平日不足，但不能仅凭晚起诊断懒惰。若长期睡得很晚且难以匹配要求，寻求节律相关评估。考试冲刺期间也需保护最低机会，不把通宵视为努力证明。"},{"ch":16,"id":"c16-s014","title":"16.15　轮班：把安全放在排班里","text":"轮班需要根据实际班次安排睡眠、光线和恢复，不能照搬白班起居。NIOSH提供专门培训，强调工作安排与个体策略共同作用。 S90 若可以选择，向雇主讨论足够恢复和疲劳风险，而不只购买提神物。  下班前决定能否安全回家；明显困倦时寻求替代交通或适当安全休息。白天睡眠与家人共同约定不打扰时段，同时留出真正紧急联系。照护儿童者需要实际替班，耳塞不能解决无人照护。"},{"ch":16,"id":"c16-s015","title":"16.16　跨时区旅行","text":"先看出发与到达时间、需要执行的任务、停留长度和药物时点，再决定是否逐步调整。不是所有旅行都值得强行完全倒时差。重要驾驶、手术、考试或高风险工作要考虑到达后的恢复。  褪黑素在某些节律问题和时差中可能有用途，但时点、剂量、产品和个体情况需要核对，不是越多越好。儿童、孕哺期、复杂疾病及长期使用的安全与证据存在边界，应咨询专业人员。 S89"},{"ch":16,"id":"c16-s016","title":"16.17　照护者夜间被打断","text":"先区分哪些夜间任务真的必要、哪些可由其他人接手、哪些是流程不清造成重复。将用品提前准备、明确交接和减少无意义叫醒，可能比任何助眠技巧更有效。  交替值班要能形成实际连续休息，不是一人负责主照护另一人一直被叫来指导。需要全天照护时讨论正式服务与资源，不能要求家庭靠永久睡眠剥夺运转。"},{"ch":16,"id":"c16-s017","title":"16.18　高龄睡眠与夜间安全","text":"不要因为年龄就要求在床上停留更久，也不要将白天困倦全部归为老化。夜间照明、助具、厕所路线和药物需要共同复核。睡眠计划不能增加跌倒风险。  认知改变、夜间不安或昼夜颠倒应结合疾病、药物、环境和日间活动评估，不能自行用更多镇静药压下行为。本人舒适与照护者安全都要进入计划。"},{"ch":16,"id":"c16-s018","title":"16.19　睡眠日记只记录能用的信息","text":"简记大致入床、起床、估计清醒段、午睡、咖啡因与明显事件，不需要每次醒来立即开灯记录。次日大致补记即可。重点是模式和生活影响，不是获得秒级精确。  日记用于回答一个问题，例如是不是工作日机会太少、某段午睡是否影响夜间、症状是否有规律。问题回答后可以降频，持续记录没有决策用途的数据并不自动更科学。"},{"ch":16,"id":"c16-s019","title":"16.20　穿戴设备：辅助观察，不负责判定一夜价值","text":"设备输出是估计和算法结果，不能仅凭深睡或睡眠分数自行诊断与用药。比较时设备、佩戴和算法变化都可能影响结果。临床疑问需要合适评估，消费设备不替代。  可先看本人是否恢复、是否困倦、是否能够安全完成生活，再参考趋势。数据与体感长期矛盾时寻求解释，不自动相信更精细的图。如果每天查看造成焦虑，可以停用一段或只定期看总趋势。"},{"ch":16,"id":"c16-s020","title":"16.21　环境升级的顺序","text":"先解决噪声源、光线、温度舒适、床铺适配和房间用途，再考虑设备。昂贵床垫不能补偿没有睡眠时间，白噪声不能替代处理危险设备声或婴儿求助，香氛也可能造成刺激。  共同居住时明确打扰和紧急例外；环境无法完全控制时寻找可行降级，例如遮光、调整位置、协商安静时段。安全与通风不应为全黑或隔音被牺牲。"},{"ch":16,"id":"c16-s021","title":"16.22　七日睡眠排查示例","text":"第一天只画机会，第二天查主要干扰，第三天核对刺激物和药物，第四天确认是否有呼吸或症状线索，第五天调整一个环境接口，第六天审视日间功能，第七天决定继续观察还是求助。这是整理顺序，不是七天治愈承诺。  一次只改少量变量，才能知道什么有帮助。无改善不代表不努力，可能说明原假设不对。持续明显困扰、危险困倦或异常睡眠表现，不必等七天结束再联系专业人员。  展开睡眠专题调用规则 每天保留足够机会与适宜环境；没有新问题就继续，不重新研究所有技巧。工作、照护、疾病或时区变化时展开对应分支。危险清醒度问题当日处理，持续失眠与呼吸等问题进入专业路径。 不设每天必须获得的深睡分数，不以偶发坏夜惩罚第二天。睡眠服务于清醒时的安全与生活，而不是成为另一项永远达不到的绩效指标。"},{"ch":17,"id":"c17-s000","title":"17.1　先辨认正在解决哪一种问题","text":"吃饭的困难至少有五种：没有稳定食物，食物不安全，总量或结构不合适，身体无法正常进食，以及与食物的关系充满恐惧。它们需要不同方案。没有厨房的人需要可获得的餐食；吞咽困难的人需要专业评估；进食障碍者不适合再增加称重和热量纪律。不能给所有人同一张“少吃多动”的纸。  第一次整理饮食，不必先下载记录应用。看三个普通日：实际什么时候吃、在哪里获得、谁准备、什么最容易缺失、吃完感觉怎样。把周末聚餐与出差另记，不用一个刻意表现完美的日子代表全年。只有知道真实流程，才知道应改采购、份量、选择、烹饪，还是时间安排。  本卷默认能够正常经口进食的一般人群。婴儿奶与辅食使用卷四、卷五；妊娠使用孕期分支；吞咽障碍、慢性肾病、特殊代谢疾病、管饲、严重过敏等使用个体方案。一个食物对多数人合适，不代表对每个病情、每一种质地都安全。"},{"ch":17,"id":"c17-s001","title":"17.2　建立一餐的骨架，而不是背完整菜单","text":"一种可选编排是每餐先考虑三件东西：提供主要能量的主食，明确的蛋白质来源，以及蔬菜或水果等植物性食物；再根据全天饮食安排奶类或合适替代来源、油脂和饮水。它不是每餐必须等比例摆盘的处方，混合菜、面食、粥饭和地方饮食也可以拆出这些部分。  例如一碗面不必被判为“不健康”，可以看是否只有面和汤，是否能加入鸡蛋、豆制品或其他合适来源，是否有蔬菜，汤和调味是否占据太多盐。一份沙拉也不自动营养完整，需要看能量、蛋白来源和整体份量。名称与外观不能替代构成。  当资源有限，先补最明显缺口，不追求每餐完美。连续几天没有蔬菜，就解决购买和准备；早餐只有甜饮，就考虑更稳定的食物组合；晚上总因疲惫放弃进食，就准备一个容易获得的备用餐。改动的价值来自长期能执行，而非拍照时符合某种风格。"},{"ch":17,"id":"c17-s002","title":"17.3　少数参考数字如何使用","text":"WHO的成人公共卫生参考包括每天至少四百克蔬果、食盐少于五克、游离糖低于总能量的百分之十。游离糖包括添加糖及蜂蜜、糖浆、果汁等中的糖，不等于把完整水果一并禁止。这些是群体饮食方向，不是要求婴儿、所有疾病或营养不足者照搬同一个份量。 S02  EFSA对健康成人提出的蛋白质人群参考摄入量为每天每千克体重零点八三克。它用于满足一般人群需要，不是运动员增肌、重病恢复、孕哺期或每个老年人的唯一最优数值，也不是所有人都应该额外购买相同克数蛋白粉。 S97  数字进入日常前要说清单位和来源。包装上“每份”可能不是你实际吃的量；干重与熟重不同；一勺、一个碗、一个手掌并非标准测量。需要精细营养治疗时采用专业方案；普通家庭则可用短期核对建立直觉，不必终身称量每一口。"},{"ch":17,"id":"c17-s003","title":"17.4　主食与碳水化合物：先看形式、份量和情境","text":"主食可以来自米、面、薯类、杂粮和其他当地可获得的食物。选择时考虑个人耐受、烹饪条件、口味以及整餐结构。无需为了追逐一个饮食标签彻底撤掉熟悉食物，也不要把所有精制主食视为毒物。  一种渐进办法是保留熟悉做法，逐步加入能接受的全谷或豆类，而不是突然把整锅饭换成难以消化且不愿吃的组合。胃肠敏感者更需要观察份量和变化速度；有明确疾病饮食要求时向专业人员核对。纤维增加之后身体不舒服，不等于必须继续忍受来“排毒”。  工作量和活动量变化会改变实际需求。长时间体力劳动、训练、发育和恢复中的人，不能把另一位久坐成人的份量直接当成自己的上限。反过来，手表估算的消耗也不是无限补吃的精确凭证。先看持续体重与功能趋势、饥饱和专业目标，而非单餐奖惩。"},{"ch":17,"id":"c17-s004","title":"17.5　蛋白质：辨认来源与总量，不迷信一瓶粉","text":"家庭可轮换蛋、奶、鱼、肉、豆及其制品等适合自身的来源；是否采用纯植物饮食，可以由价值与偏好决定，但需要相应营养规划。每餐明确一个蛋白来源，是本书便于执行的编排，不是要求每一餐达到同一个克数。  蛋白粉是一种方便形式，不是训练资格证。考虑使用前，先看普通食物已提供多少、产品的有效成分和过敏原、每份总量、购买可靠性与是否真正解决便利问题。正在使用的复合饮品也算入总量，不要把不同名称的产品当作互不相关。  慢性肾病的蛋白、钠、钾、磷和液体安排可能随病情、化验、营养状态和是否透析而不同。既不能一律高蛋白，也不能自行把所有蛋白食物撤掉；应与肾脏和营养团队制定方案。 S96 “年纪大就一定多补”与“肾不好就什么都不能吃”，都是过度压缩。"},{"ch":17,"id":"c17-s005","title":"17.6　脂肪：选择之外，还有使用方式","text":"烹饪油、坚果、种子、乳制品、肉类、糕点和酱料都可能贡献脂肪，不能只计算锅里倒了多少油。WHO建议优先采用不饱和脂肪来源、限制饱和脂肪并避免工业反式脂肪；不需要把脂肪全部清零。 S02  实际改动可以从调味方式开始：酱汁另放、少量试味、比较同类产品、减少反复油炸的日常依赖。坚果等食物按年龄和咀嚼吞咽能力提供，婴幼儿的形状风险调用协议C。健康成分并不能抵消噎食危险，也不意味着份量无需考虑。  油品购买看用途、储存和实际消耗速度。不要为追求多样性同时开很多瓶，最后长期受热、见光或放到过期。产品宣传中的“冷压”“天然”等词不能单独证明适合任何烹饪温度或所有身体目标，按标签和可靠食品指导使用。"},{"ch":17,"id":"c17-s006","title":"17.7　蔬果、豆类与纤维：改变供应比提醒更有效","text":"把每天最容易遗漏的植物食物放在容易准备的位置。可以一次洗好适量、分装合适份量，或使用符合需求的冷冻与罐装产品，不必只有昂贵新鲜有机食品才算合格。选择加工产品时核对调味和实际用途，避免把果汁当作所有水果的等价替代。  不同颜色可以作为家庭增加种类的提示，但不是必须凑齐固定色卡的营养处方。重点是长期多样、可获得、愿意吃。孩子可以参与采购和烹饪，但不因拒绝一次新食物被贴上难养标签。多次低压力接触与强迫吃完，是不同的环境。  便秘、腹泻、腹胀或其他症状持续时，应按具体情况评估。不能把所有胃肠问题归为纤维不足，更不能靠不断加粗粮解决吞咽、肠道疾病或药物相关问题。观察记录保留食物、份量、症状和时间即可，不随意排除越来越多的食物组。"},{"ch":17,"id":"c17-s007","title":"17.8　饮水：从可获得性和实际需要开始","text":"饮水计划先解决水源安全、容器可达和是否愿意饮用。办公桌上有水却整天无法离岗，或老人因怕找厕所而不喝，问题不只是忘记。改善厕所、休息和照护条件，常比一连串手机提醒更直接。  水分来自饮料和食物，需求随体形、活动、天气、孕哺与病情改变。本书不要求所有人每天强制八杯或固定大桶。存在心肾疾病、低钠风险或特定用药时，液体目标听从医疗计划；高温、长时运动、呕吐腹泻等情境也可能需要专门安排。 S39 S96  不要把尿液必须完全透明当作健康目标，也不要临睡前补齐全天“欠量”。需要记录摄入时同时记录杯子容量与实际喝入，不只数倒水次数。吞咽困难者的饮水质地与姿势由专业团队评估，不能随手加增稠剂或统一禁用吸管。"},{"ch":17,"id":"c17-s008","title":"17.9　铁：先查原因，再补充","text":"疲劳和脸色变化不能独立证明缺铁。需要时由医疗人员结合症状、病史与检查判断；缺铁也需要理解来源，例如饮食不足、吸收问题或失血，而不仅是把铁数值补上。月经过多、孕期与特定疾病可能改变风险，具体方案需个体化。 S93  铁补充剂不是普通糖果，过量可能有害，尤其要避免儿童误食。标签中的铁化合物重量与元素铁含量不能混淆；治疗量和一般营养摄入量也不是同一概念。 S93 已经使用复合维生素时，把其中铁含量告诉医生或药师。  服用后不适、漏服或与其他药物时间冲突，应询问调整办法，不自行加倍。治疗开始时就问何时复查、预计继续多久、什么情况提前联系。只要不再疲劳就立即停，或检查正常后无限期继续，都可能偏离原计划。"},{"ch":17,"id":"c17-s009","title":"17.10　钙与维生素D：食物、补充和风险分开看","text":"钙可以来自奶类、部分豆制品、强化食品等，具体含量取决于产品和制作方式。需要补充时先估计饮食已有来源，并让专业人员核对剂量、肾结石等病史及药物相互作用；钙片不能代替力量活动和骨健康整体评估。 S94  维生素D需要随年龄、暴露和健康情况考虑。补充过量可以造成伤害，因此不以“脂溶性维生素越高越抗衰”为依据长期叠加；治疗缺乏的方案和一般日常补充也不能互换。 S95 儿童与孕哺期使用适合人群的产品和指导。  实际核对时，把所有产品横向放在一起：复合维生素、钙D合剂、单独D滴剂、强化饮品。记录每份含量、每天份数和单位。很多错误来自重复产品，而不是任何单瓶看起来特别高。"},{"ch":17,"id":"c17-s010","title":"17.11　维生素B12与特殊饮食","text":"纯素或几乎不吃动物性食物的人，需要可靠的维生素B12来源，例如合适强化食品或补充方案；不能把普通未强化植物食物自动算作充足来源。某些吸收障碍、胃肠手术及药物使用也会影响B12状态，需按情况评估。 S92  饮食选择涉及宗教、伦理、过敏、文化和经济条件时，先尊重选择，再寻找营养接口。不要把“吃得和多数人不一样”直接视为错误，也不因为价值坚定就忽略实际缺口。儿童、孕哺期与疾病人群采用限制性饮食，更值得获得有资质的营养支持。  缺乏已经明确时，治疗应考虑原因与吸收，不只是购买最贵的剂型。对并不缺乏的人，B12补充不能自动提供额外精力与运动表现。 S92 体感改善或下降也不能独立替代必要评估。"},{"ch":17,"id":"c17-s011","title":"17.12　过敏、不耐受与“吃完不舒服”","text":"出现呼吸、喉舌肿胀、晕厥等严重反应，直接调用急救规则。已有明确食物过敏的人，应保存行动计划、核对交叉接触与外食信息，并按医生要求携带相关药物。不能因以前只有轻微反应就在家自行做激发试验。 S36 S55  非紧急胃肠不适可以记录发生时间、食物组合、份量和其他因素，带给专业人员。不要依据一份解释不清的商业检测，把几十种常用食物永久列入黑名单。排除饮食需要明确目的、期限、营养替代和复评方式，而不应无限扩张。  家庭中一人有过敏，储存、器具与标签要让其他照护者看懂。临时换包装、共享勺子、误把植物奶与普通奶混淆等，都是流程问题。规则应具体到动作，不只贴“注意过敏”四个字。"},{"ch":17,"id":"c17-s012","title":"17.13　厨房安全协议Q","text":"展开：从购买到剩菜的共用操作 处理食物前后按需要洗手，生食与可直接入口食物避免交叉污染。蔬果用流动安全水清洗，不用洗洁精或漂白液清洗可食部分；生肉清洗飞溅可能扩大污染，不靠反复冲洗代替正确烹饪。肉类熟度需要时用食物温度计确认，而非只看颜色。 S91 易腐食物及时冷藏，一般不在室温放超过两小时；环境高于约三十二摄氏度时缩短至一小时。冰箱目标不高于四摄氏度。剩食分浅容器及时冷却冷藏，不等整锅在室温放一夜。冷冻不等于杀灭所有病原体。 S91 按食品种类核对储存时限与再加热要求；不知道是否在安全温度存放时，不靠闻起来正常决定食用。外卖、饭盒和野餐同样需要冷链或保温安排。停电、洪水及水源异常时采用当地卫生部门指导，不以煮沸解决所有化学污染。 清洁用品和食品分区，容器保留名称和日期。冰箱内原料位置应避免汁液滴到熟食。轮换先用较早购入的合格食物，过期或可疑食物不拿来“练肠胃”，也不转送给更脆弱的人。"},{"ch":17,"id":"c17-s013","title":"17.14　低预算、少时间、无厨房的三种适配","text":"低预算时先比较实际可食份量、储存损耗和准备成本。大包装只有能够安全用完才便宜；赠送很多不适合的食物也不是真正节省。建立几种普通原料的重复组合，通常比追逐不断变化的“超级食物”更容易维持。  少时间时，把决定与烹饪分开。每周预先选择几套能完成的组合，采购时按组合拿材料，忙碌日直接调用。批量准备只做能够安全储存和按时吃完的量，不让节省时间变成食品风险。清洁、分装和补货同样计入总劳动。  无厨房时，寻找正规餐食、可直接食用食品、合适强化食品或可合法安全加热的方案。不要因不具备理想烹饪条件就放弃结构，也不要在禁止明火或电力不足的房间私搭危险设备。最优方案必须活在现实住所里。"},{"ch":17,"id":"c17-s014","title":"17.15　体重目标与进食关系","text":"决定改变体重前，先问目标来自健康、功能、运动表现、外貌意愿，还是外界羞辱。需要医学体重管理的人可以获得正规支持，但任何人都不应通过极端饥饿、催吐、滥用泻药或惩罚性运动完成目标。进食障碍可发生于不同体重的人，不能只看是否很瘦。 S69  建立能长期维持的改变时，先调整一种高频行为，例如含糖饮料、份量不知不觉增加、进食时间混乱或缺乏可用正餐。不要同一天更换全部食物、训练和称重规则，那会使不适原因和真正有效的部分难以分辨。  体重只是结果之一。还要看体力、情绪、社交、饥饿、恢复和必要临床指标。若体重变化伴无意下降、持续疲劳、晕厥或其他症状，进入医疗评估，不以数字变小自动庆祝。"},{"ch":17,"id":"c17-s015","title":"17.16　一周饮食系统的维护顺序","text":"第一步看未来一周在哪里吃，不在家吃的餐次不要重复采购。第二步确定几套可以轮换的主餐和一套备用餐。第三步核对特殊饮食、过敏、药物与食物的要求。第四步安排准备、储存与清洁。第五步决定哪一项变化需要观察，其余保持稳定。  每餐开始前只问：安全么，够不够，有没有明显结构缺口，今天吃起来是否可承受。餐后无需写长报告。若没有明确治疗需要，通常不必把所有食材、排泄和感受永久量化。吃饭应该释放生活能力，而不是成为全天的审计工作。  本卷的终点是一套可靠供给：普通日子能够吃好，忙碌日子有替代，疾病时知道如何转入专业方案，快乐的食物也有位置。它不是一张一百年不变的菜单，而是一种能随身体与生活更新的组织方式。"},{"ch":18,"id":"c18-s000","title":"18.0　婴幼儿与五岁以上儿童：先分清总活动和训练","text":"对象 活动参考 屏幕与使用说明 未满一岁 每日多次互动地面活动；尚不能自由移动者，清醒俯卧逐步分散累积到每天至少三十分钟的WHO参考量 不是要求出生第一天一次趴满三十分钟；先按新生儿短段起步。静坐看屏幕不推荐。 一至二岁 全天多种强度活动合计至少一百八十分钟 一岁不推荐静坐看屏幕；两岁不超过一小时，越少越好。 三至四岁 总活动至少一百八十分钟，其中至少六十分钟为中高强度 静坐看屏幕不超过一小时，越少越好。 五至十七岁 一周内平均每天至少六十分钟中高强度、主要为有氧的活动；每周至少三天含较高强度及增强肌肉、骨骼的活动 游戏、体育课与主动出行可以构成活动；不是每日额外加一小时成人式健身。  前面三行据WHO五岁以下指导；婴幼儿被约束在推车等装置中时，不宜连续超过一小时。最后一行据WHO分龄活动摘要。 S62 S161 上述是健康促进参考，不覆盖疾病、恢复与特殊运动限制。  “一百八十分钟活动”可以由很多玩耍、移动和探索片段组成，不等于三小时高强度训练；“三十分钟俯卧”与安全睡眠仰卧必须严格分场景。不要从耐受很少的起点跳到总量目标，也不因当天不足惩罚性补量。"},{"ch":18,"id":"c18-s001","title":"18.1　先定义你想保有哪一种行动","text":"运动计划可以从具体生活任务开始：走到车站、抱起孩子、从地上站起、搬运物品、参加球赛、长途旅行，或让轮椅移动更省力。不同目标需要不同能力，不能只用跑步公里数代表全部体能。一个人耐力很好，仍可能缺少力量、平衡、技巧或适合的动作范围。  把目标分成耐力、力量、协调与平衡、活动范围、速度或专项技能，再问目前真正限制你的是哪一项。没有必要同时最大化全部维度。普通生活需要足够能力和安全余量，竞技目标才可能要求更专门的训练与恢复资源。  开始前记录当前能够舒服完成的活动，不做极限测试。若已有疾病、近期手术、妊娠风险、反复晕厥、运动胸痛、明显气短或其他担忧，先获得合适评估。不是所有普通散步都需要繁复体检，但有问题时也不能拿“运动有益”作为忽略症状的许可。"},{"ch":18,"id":"c18-s002","title":"18.2　分龄活动参考集中放在这里","text":"一般成人可朝每周至少一百五十分钟中等强度有氧活动，或七十五分钟高强度活动及其等效组合逐步安排，并在每周至少两天进行主要肌群的力量活动；进一步增加至约三百分钟中等强度活动可以是有能力者的选择，而不是所有新手第一周的任务。 S101  老年人在适合的有氧与力量之外，应重视平衡，尤其行动受限者可在专业支持下把相关活动安排到一周三天或更多。儿童青少年的参考见卷八，五岁以下以全天主动游戏为主，不使用成人健身课替代日常探索。 S101 S32 S62  这些总量不意味着必须一次连续完成，也不意味着所有活动必须在健身房。通勤、家务、娱乐和适配运动都可能贡献，但要看实际强度和持续方式。无法达到完整参考时，从能够安全执行的部分开始；特殊疾病的例外见本卷后部。"},{"ch":18,"id":"c18-s003","title":"18.3　判断强度：身体反应优先于同一速度","text":"同样的步速、坡度和重量，对不同人可能代表完全不同的负荷。CDC提供的谈话测试可作粗略参考：中等强度通常仍可说话但难以唱歌，高强度时往往只能说几个词就需换气。零至十分的主观用力感中，中等强度常约五至六分，高强度约七至八分。 S98  这不是急症排除工具。胸痛、异常气短、晕厥感、突然无力或明显不适时，不能因为心率仍在某个区间就继续。药物、心律问题、天气与设备误差也可能影响读数；不要把简单年龄公式或手表颜色当成个人医学处方。  记录强度时可用一句话：“能正常交谈，结束后仍能完成日常事务。”对于语言、呼吸或感觉表达不同的人，使用适合的专业评估方式，不强迫所有人用同一种量表。"},{"ch":18,"id":"c18-s004","title":"18.4　起步协议：先形成可重复的一次","text":"下面是一般低风险成人的编排示例，不是疾病康复处方。先选择一种熟悉且低门槛的活动，时间短到不必大幅改变生活；结束时仍保留余力，并观察之后和次日的反应。连续几次能够舒服完成，再决定增加时长、频率或难度中的一项。  如果连最小版本都做不到，先查入口：场地太远、鞋不合适、担心被评价、工作结束太晚，还是活动本身不喜欢。换一种形式可以比增强纪律更有效。身体有明确限制时寻找适配，不把“无法走路”等同于“没有任何运动选择”。  不要设一个必须每周上涨的百分比。增加应由执行质量、恢复和生活能力决定；有时维持数周就是合适选择。旅行、疾病或照护压力增加时，减量不是失败，而是整个身体负荷发生了变化。"},{"ch":18,"id":"c18-s005","title":"18.5　力量动作的选择逻辑","text":"普通力量计划可以考虑下肢起立与蹲类、髋部伸展、推、拉、携物及躯干稳定等不同任务，但不要求每个人完成同一个动作。动作只是工具，目标是适合身体与生活。深蹲不适合时可以调整范围或选择其他方式，不能把某一种姿势当作合格人体的考试。  器具先检查稳定、承重和抓握。椅子不能带轮或在地面滑动，弹力带固定点应可靠，地面没有绊倒物。重量轻也不意味着无风险，尤其在高处举物、平衡困难或疲劳时。需要教练或康复指导时，优先看资质、是否询问病史、是否解释替代动作与停止条件。  一个动作学会之后再增加复杂度。不要同时更换器具、速度、负重与不稳定表面，否则很难知道身体在适应什么。训练不是展示动作花样，能稳定重复并用于生活，比视频看起来更高级重要。"},{"ch":18,"id":"c18-s006","title":"18.6　低门槛动作示例与边界","text":"椅子起立可以从合适高度的稳定座椅开始，脚得到支撑，向前调整重心后起身，再有控制地坐下。需要扶手或协助的人不应为了达到“不能用手”的挑战而冒险。墙壁推撑可通过离墙距离调整难度，提踵可扶稳固定支持物。NHS提供了这些低门槛动作的公开示范。 S99  上述只是动作入口，不构成人人适用的组数和负重。初学者可以先少量尝试，确认没有异常并能保持控制；有骨折、术后限制、严重平衡问题、胸痛或其他病情时先使用个人方案。呼吸自然，不通过长时间憋气或全身僵硬证明用力。  若动作令人疼痛，不需要硬撑到预定次数。记录疼痛部位、何时出现、是否持续和对生活的影响，必要时评估。替代动作也应解决同一目标，而不是仅仅换一个同样令人不适的姿势。"},{"ch":18,"id":"c18-s007","title":"18.7　力量练习如何记录进展","text":"每次记录动作名称、采用的版本、实际完成量和明显反应即可。随着熟练，可以增加可控次数、合适阻力或动作范围，但一次优先改变一项。没有必要每周测试最大重量，更不靠他人协助勉强完成最后一次来证明有效。  进展也可以表现为同样购物更轻松、上楼更稳定、起身不再需要额外帮助。体形和体重并非力量变化的唯一窗口。使用辅助设备的人可以记录转移更安全、推动更舒适或需要休息减少，而非套用健全人群的动作排行榜。  连续下降时先看睡眠、饮食、疾病、压力和训练安排。不是所有停滞都需要再加一组，也不是每次状态差都意味着计划失效。观察足够的普通训练，再作调整，避免被单日情绪驱动。"},{"ch":18,"id":"c18-s008","title":"18.8　耐力：选择能持续的运动形式","text":"步行、骑行、游泳、舞蹈、划船、轮椅活动或其他适配形式，都可以根据目标与条件考虑。选择时除了强度，还要算交通、器材、天气、学习与安全成本。最有效率的项目不一定最适合你的生活，愿意长期参与的方式更值得优先试验。  路线需要有退出和返回能力。初次外出不把全程体力用在去程；炎热、偏远或陌生路线尤其需要预留。携带必要联系工具和个人救急用品，具体依据自身疾病行动计划。独自活动时让合适的人知道安排，不把公开实时定位当成唯一安全方式。  进入更高强度前，先确认基础活动已稳定、身体适合且理解专项风险。高强度间歇不是人人必需的“效率升级”，更不能在严重缺觉、发热、急性症状或明显恢复不足时强行完成。"},{"ch":18,"id":"c18-s009","title":"18.9　平衡、活动范围与动作技巧","text":"平衡练习应靠近可靠支撑，并根据能力决定是否需要旁人保护。不要闭眼站在高处、用摇晃家具作支撑，或拿跌倒风险换挑战感。已经跌倒、反复头晕或步态变化的人，先进入相应评估，而不是单靠练习解决。  活动范围以舒适、可控制和任务需要为目标。拉伸不是疼得越深越好，也不要求所有关节达到同一角度。对于关节过度活动、术后和神经系统问题，需要个体指导。疼痛、麻木或明显不稳不应被解释成“筋打开了”。  技巧学习把整体动作拆小：先稳定环境，再练一个要点，再放回完整动作。例如球类先练接触与方向，游泳先在正规教学中掌握安全与基本动作。掌握技巧可能降低任务难度，但不意味着可以忽略体力和环境风险。"},{"ch":18,"id":"c18-s010","title":"18.10　久坐工作的变化策略","text":"目标不是找到一个可以保持八小时不变的完美姿势，而是让工作允许变化。把常用工具放在舒适范围，减少持续伸手和耸肩；根据任务轮换坐、站、走和短暂休息。升降桌只是工具，站着不动一整天也不是唯一答案。  提醒频率可以按工作流程编排，例如完成一段任务后离开座位、通话时在安全处移动、取水时顺便休息。不存在本书能够证明对所有人最优的统一二十五分钟或三十分钟间隔。若症状与工作明显相关，记录具体姿势、持续时间和任务，寻求合适的职业健康或医疗建议。  休息时不要同时把另一个屏幕塞进手中，完全保留相同眼部与手部负荷。可以望向远处、改变姿势、活动一下或做非屏幕任务；不必把每次休息都升级成训练课。"},{"ch":18,"id":"c18-s011","title":"18.11　儿童运动：机会与保护同时存在","text":"儿童需要能够参与的活动空间，而不只是被成人观察的训练成绩。把跑、跳、投、接、攀、平衡和节奏等体验放进适龄游戏，不必过早只剩一个专项。已有竞技训练时，也要考虑学校、成长、睡眠与兴趣的总负担。  教练的权威不能覆盖儿童的疼痛报告和身体边界。不能因比赛而强迫带伤上场，也不能用羞辱、体罚或限制饮水作为纪律。选择项目时了解保护规则、急救能力、人员资质和家长投诉渠道，避免只看获奖数量。  成年人提出的外貌目标不应成为儿童训练主轴。减重、体重级别和高负荷训练涉及发育与健康时，应由适当专业团队参与，而不是根据同队孩子的方案复制。"},{"ch":18,"id":"c18-s012","title":"18.12　孕产期与高龄的接口","text":"孕期运动使用产科确认的范围，避免将普通成人计划直接加在妊娠负荷之上。产后恢复还要考虑伤口、盆底症状、睡眠和喂养负担，不由一个固定天数自动解锁跑跳。具体分流已在卷二、卷三展开。  高龄者的练习可以围绕穿衣、起身、携物、行走、上下交通工具等真实目标。使用扶手、助行器或椅子不降低训练价值。若今天只能完成一段安全活动，也可以保留参与，不因没有达到整套标准而取消。  照护者不能把训练变成证明服务质量的强迫任务。先说明目的、获得配合、观察疲劳，并保留停止权。活动结束后仍需要有余力吃饭、洗漱和做本人选择的事，不能把全天能力耗在护理记录上。"},{"ch":18,"id":"c18-s013","title":"18.13　恢复：总负荷不只来自运动","text":"出差、长时间站立、搬家、睡眠中断、情绪危机和照护都可能增加负担。训练计划应随总负荷调整，而不是只看上一次健身日期。恢复不足时可以减少量、降低强度、换形式或休息，具体取决于状态与病情。  普通训练后的感觉不应被强行解释成越疼越有效。疼痛持续、加重、局部明显肿胀、功能受限或有其他异常时，应评估。按摩、冷热和设备可以是个人偏好或治疗辅助手段，但不能掩盖需要处理的损伤，也不能代替基本休息与供给。  没有一个产品能让人在所有条件下无限增加负荷。购买恢复工具前，先明确希望改善哪项结果、怎样判断、会不会因此继续透支。用昂贵恢复项目支持不可持续训练，不是系统优化。"},{"ch":18,"id":"c18-s014","title":"18.14　活动后延迟恶化：必须退出普通递增计划","text":"有些疾病中，轻微体力或认知活动之后也可能出现延迟的明显症状恶化。ME/CFS中的活动后不适可在活动后若干小时至一两天显现，并持续更久；通用健康人群的运动方案可能造成伤害。 S102  这种情况下，不应把“今天撑过去，明天就会适应”作为原则，也不能采用不顾症状固定加量的分级运动方案。应与了解相关疾病的专业人员合作，识别个人限制、安排活动与休息，并以避免恶化为边界。 S103  本书其他章节中“逐步增加”的建议，都不覆盖这一例外。记录活动影响要包括之后的反应，而非只看当时能否完成。疲劳不是懒惰，家务、社交和脑力任务也需要计入个人负荷。"},{"ch":18,"id":"c18-s015","title":"18.15　脑震荡和损伤后的回归","text":"疑似脑震荡时先停止相关运动并评估，危险信号见卷八。回归不能只凭本人感觉想上场；CDC建议在医疗人员批准和监督下分阶段进行，出现新症状或原症状返回时停止并联系团队。 S100  其他损伤、手术和疾病恢复也有自己的限制。把出院或康复要求写清楚：能做什么、暂不做什么、可以怎样替代、何时复查。不能因为疼痛减少就自行认定组织已恢复到全部负荷，也不能因为担心而无限期不动。  回归时的目标先是安全重新参与，再考虑以前的成绩。比较对象应是当前可承受的起点，而不是受伤前最好的那一天。"},{"ch":18,"id":"c18-s016","title":"18.16　一周示例：不是统一处方","text":"假设一位一般健康、已有基础活动且无相关禁忌的成人，希望维持日常功能。本书可选编排为：两天分别安排全身力量练习，其间留出恢复；数天安排喜欢的有氧活动；普通日穿插适合的活动范围与平衡；至少保留能够灵活调整的空间。具体分钟、组数和负重按实际能力与需要选择。  新手可以把示例缩小，不需要第一周就完成全部参考总量。熟练者可以根据目标更专门化，但仍保留安全与恢复。轮班、照护和疾病会改变顺序，“周一”并非身体必须接收某种刺激的日子。  展开：X 每次运动的短检查 开始前确认身体状态、环境、器具、计划和退出方式。先以较容易的方式进入活动，不直接冲向当天最高负荷。进行中观察动作控制与异常，不拿手表数据压过症状。 结束时确认能够安全返回和完成基本生活，记录实际做了什么及需要注意的反应。后续恢复良好再决定是否进阶；出现持续或延迟恶化则回到评估与个体方案。 错过一节不在次日翻倍补偿。运动的收益来自可持续参与与合适负荷，不来自从未断过的打卡记录。"},{"ch":18,"id":"c18-s017","title":"18.17　运动的最终验收","text":"计划至少应回答：你更能做哪些事，是否喜欢其中一部分，是否能够在普通周执行，有没有持续伤害或生活代价，遇到变化是否知道怎样调整。若只有数字增长，实际生活却越来越疲惫、疼痛或狭窄，就应重新检查目标。  最优使用人体不是把身体推到每一天的极限，而是让它在需要时有能力，在不需要时能恢复，并且仍愿意与你一起生活。"},{"ch":19,"id":"c19-s000","title":"19.1　维护的三个层级","text":"第一层是日常保护：清洁、合适环境、减少明确伤害和正确使用工具。第二层是功能变化：看不清、听不清、咀嚼困难、疼痛、排泄变化等，需要记录并按情况评估。第三层是急迫信号：突然、明显或伴严重全身症状的变化，直接进入医疗分流。  器官不能按汽车零件理解成每天都需要单独刺激。心、肺、肝、肾并不要求各服一瓶保养品。睡眠、饮食、活动、减少暴露和适当医疗是共享底座；本卷只展开各个接口特有的操作与警戒，不再复制整套基础建议。"},{"ch":19,"id":"c19-s001","title":"19.2　牙齿：固定顺序，避免漏面","text":"一般日常口腔基础是每天两次使用含氟牙膏刷牙，每次约两分钟，并清洁牙齿之间的部位；牙刷大小与软硬应适合个人，不能用很大力度代替清洁效果。 S18 顺序可以自己固定，例如从一侧外面开始，依次内面、咬合面，再到另一侧，目的是避免只刷最容易接触的位置。  牙缝工具按牙缝大小、牙龈和牙科建议选择。牙线、牙间刷等并非越粗越好，不应硬塞或反复切割牙龈。第一次使用有困难，可以请牙科人员当面示范并让自己回演；比购买更多工具更有价值。  刷牙时留意持续出血、疼痛、松动、食物嵌塞和咬合变化，预约牙科评估。止痛和暂时不出血不代表原因已解决。不要因为清洁会出血就永久停止相应区域，也不要用强力刷洗惩罚牙龈。"},{"ch":19,"id":"c19-s002","title":"19.3　儿童口腔：能力成熟以前成人仍负责结果","text":"第一颗牙出现后开始适合的刷牙护理。三岁以下通常使用薄薄一抹、类似米粒大小的含氟牙膏，三至六岁使用豌豆大小；浓度、额外氟化物和高龋风险方案按当地牙科建议。成人应持续监督并在必要时帮助，而不是孩子会握牙刷就退出。 S61  儿童牙科接触不等牙痛。AAPD建议第一颗牙出现时安排首次牙科检查，最迟不晚于第一周岁；当地服务路径和后续频率由实际风险决定。 S160 预约时带饮食、清洁方式及已知不适，离开时确认下一次随访和家长是否会实际操作。乳牙也需要保护，不能以“反正会换”忽视疼痛与进食影响。  把刷牙变成可预测的小过程，允许选择牙刷颜色或顺序，但安全护理不由是否愿意表演决定。出现感觉敏感、疼痛或持续强烈抗拒时，先查原因并寻找适配，不用压制和羞辱作为唯一方法。"},{"ch":19,"id":"c19-s003","title":"19.4　口干、假牙与口腔异味","text":"持续口干可以影响说话、咀嚼和吞咽，也可能与药物或疾病有关，不是年龄增加后必须接受的状态。向牙科或医生说明症状和全部用药，再讨论适合的处理；不能只靠不断含糖或大量饮水覆盖原因。 S115  假牙、保持器与其他口腔器具按专业指导清洁、保存和复查。松动、磨破或疼痛时，不自行打磨到勉强能戴；也不要用家用胶水修补入口器具。吞咽困难或需要照护的人使用器具时，照护者要知道何时取下、如何标识与保管。  口气问题先检查清洁、牙龈、口干和相关症状，不默认胃有问题，更不只用强烈香味遮盖。口腔中持续不愈的破损、肿块或异常，应获得专业检查，而不是长期自行涂刺激性偏方。"},{"ch":19,"id":"c19-s004","title":"19.5　眼睛：让任务与视觉条件匹配","text":"阅读和工作时，先调整字体、照明、反光和观看距离，让内容能够轻松辨认。需要凑近或眯眼才能完成时，应考虑视力与眼部评估，而不是把坚持看清当成训练。儿童坐到前排只能暂时帮助看见，不能替代适当检查。  长时间近距离任务之间可以安排看向较远处、自然眨眼和更换活动。具体间隔可按任务编排，不把某个秒数当作已证实治疗近视的处方。护眼模式、滤镜和营养品也不能自动替代合适的矫正、检查与环境调整。 S19  工作或运动存在飞溅、碎屑、化学品等风险时，使用针对风险的眼部防护，不以普通眼镜一概代替。儿童游戏材料和成人工具都要考虑眼部风险，不能等一次伤害之后才想到防护。"},{"ch":19,"id":"c19-s005","title":"19.6　眼部变化的紧急入口","text":"突然出现或明显增加的闪光、飞蚊，视野像被幕帘或阴影遮挡，尤其伴视力模糊、眼痛或外伤，应紧急获得眼部评估。长期稳定的飞蚊与新变化不是同一情境，不能凭以前检查正常就忽略今天的改变。 S105  突然明显视力下降或严重眼痛，不应等待下次常规验光，应立即联系急救或眼科。强刺激化学品进入眼内时，在安全前提下立即用大量洁净、非热的缓流水冲洗，轻轻保持眼睑打开，至少二十分钟；同时让旁人联系急救，等待帮助期间持续冲洗，不为先找专用洗眼液或拍照而延误。保留容器信息供医护判断，不揉眼。 S154  尖锐物刺入眼内属于另一分支：不要自行拔出或按压，也不要直接套用普通异物冲洗流程，应立即急救评估。 S154 不把眼睛发红一律当疲劳，不使用他人的处方滴眼液试验。  就诊时说明变化发生时间、单眼或双眼、是否有外伤、隐形眼镜和既往手术。保留必要信息即可，不为拍摄清晰照片反复强光照射或延误就医。"},{"ch":19,"id":"c19-s006","title":"19.7　隐形眼镜的独立操作链","text":"接触镜片前洗净并擦干双手，按指定护理液和更换周期操作，不用水替代护理液，不将新旧护理液混合。洗澡、游泳前取下，除非眼科明确指导，不戴着入睡；镜片不适时取下并联系专业人员。 S109  准备一副度数合适的备用框架眼镜，让取下镜片有现实可行性。旅行、夜班和临时过夜时，备用用品与干净容器应能找到，不为省事继续超时佩戴。美瞳同样涉及医疗器械和感染风险，不因只为外观使用就降低要求。  儿童或青少年使用时，看其是否能够完成清洁、保存、异常报告与随访，而不是只看年龄。需要成人监督的部分应明确，不能一旦购买就把全部责任交给孩子。"},{"ch":19,"id":"c19-s007","title":"19.8　听力：降低暴露，而不是等待损伤证明存在","text":"噪声风险与音量和持续时间有关。保护可以通过降低声源、增加距离、减少暴露时间，以及在合适场景使用正确的听力防护来实现。耳机最大音量的百分比不是跨设备统一安全线；听完持续耳鸣或发闷，也不应当作正常娱乐代价。 S20  在工地、演出、器械或其他高噪环境中，先了解实际风险与防护要求。防护用品需要适配和正确佩戴，普通降噪耳机不自动等于符合职业防护要求的耳塞或耳罩。听音乐时不靠不断调高音量压过环境噪声。  家庭交流先降低背景声音、面向对方，再调整说话方式。听不清不是不认真，听力辅助也不是失败标志。适合的评估与支持，是让人继续参与关系，而不只是让测听图表变化。"},{"ch":19,"id":"c19-s008","title":"19.9　突发听力下降与日常清洁","text":"单耳或双耳突然明显听力下降，即使感觉像耳堵、伴耳鸣或眩晕，也应立即就医评估。不要自行认定只是耳屎、过敏或感冒而等待数天；突发感音神经性听力下降属于时间敏感的医疗问题。 S106  日常清洁重点在外部可见区域，不把尖锐物、棉签深插耳道当作保养。持续疼痛、流液、异味、听力改变或反复堵塞，应由专业人员判断。耳烛和来路不明的“深度清洁”不能作为常规维护。  佩戴助听设备的人，按说明清洁与防潮、检查电量和耳塞配合。声音异常时先查设备与耳部状态，不直接推断认知或理解下降。照护者可以协助，但需询问本人实际听感。"},{"ch":19,"id":"c19-s009","title":"19.10　鼻腔、呼吸与声音","text":"鼻塞或鼻炎影响睡眠、活动和工作时，记录诱发环境、持续情况及已用药物，获得适当评估。长期反复用同一种产品却不清楚成分与适用时间，不是稳定治疗。需要鼻腔冲洗时，采用合适器具与指导。  冲洗水应使用标示为蒸馏或无菌的水，或煮沸后冷却的安全水；不能把可以饮用的自来水直接视为适合鼻腔冲洗。器具按说明清洁干燥，不共享。 S111 本书不提供自行配置漂白液等替代做法。  用声多的人可以安排短暂声带休息、借助扩音、减少在噪声中喊话。声音嘶哑、说话费力或持续改变时，应评估，而非靠含片和继续硬喊维持。过度耳语也不是万能的嗓音休息方式。 S112"},{"ch":19,"id":"c19-s010","title":"19.11　皮肤清洁：先减少刺激，再增加成分","text":"清洁围绕汗液、污物、防晒和彩妆等实际需要，不追求洗后紧绷或彻底脱脂。选择温和且自己能够耐受的方式，避免同一次叠加磨砂、强清洁和多种活性成分。皮肤出现灼痛、明显脱皮或持续红痒时，先减少新增刺激并寻求适当帮助。  痤疮护理尤其不宜频繁换方案或挤压。AAD建议温和清洁、避免刺激和反复挤痘，并给合适治疗足够观察时间；严重、留疤或持续困扰时找皮肤科，而不是无限叠加产品。 S104  护肤记录可以写产品、开始时间、实际频率和反应，不需要每天在不同光线下放大寻找缺陷。治疗用药与普通化妆品分开，孕哺期、儿童及有皮肤病者用药前确认适用性。"},{"ch":19,"id":"c19-s011","title":"19.12　防晒与外观选择","text":"户外可综合使用遮阴、衣帽与适合的防晒产品。AAD建议对未被衣物覆盖的皮肤使用广谱、耐水且SPF三十或以上的产品；这不是让人可以无限延长强烈日晒。 S104 用量、补涂、涉水和擦拭后的处理按产品与专业指导。  防晒要覆盖实际暴露位置，例如耳部、颈部、手背和分缝，而不只涂面中部。儿童、皮肤敏感或特殊疾病者采用适合方案，婴儿优先遮阴与衣物等保护并询问专业建议。不要为“补维生素D”故意晒伤。  外观调整可以是本人真实愿望，但不应以贬低现有面貌为前提。选择医美或侵入性操作前，另用卷三十的证据与风险审查，不把“看起来年轻”直接等同身体健康。"},{"ch":19,"id":"c19-s012","title":"19.13　头发、头皮与指甲","text":"掉发可能有不同原因，先了解发生时间、分布、近期疾病、饮食、压力与用药，再决定是否需要评估。NHS建议在进入商业脱发治疗前先辨认原因，没有一种治疗对所有人完全有效。 S110 不用每天数地漏里的头发来独立诊断。  洗发频率根据头皮和生活需要选择，轻柔处理打结，减少持续牵拉与不舒服的发型。明显头皮疼痛、破损、脓疱或快速变化，应寻求帮助，不用强刺激生姜、精油或高温仪器反复试验。  指甲剪到舒适且不伤皮肤的长度，工具清洁并避免共用可能造成破皮的器具。持续变色、增厚、疼痛或甲周炎症需要判断原因，不把所有变化都归为缺某种维生素。糖尿病、循环或感觉异常者的足部处理更加谨慎。"},{"ch":19,"id":"c19-s013","title":"19.14　手部与足部：高频工具需要合适接口","text":"手部反复接触水、清洁剂或摩擦时，检查工作流程是否可以减少直接暴露，采用适合任务的防护与清洁。护手产品不能抵消不合适化学接触，手套也需要正确材质与更换。持续裂口、疼痛或感染迹象应评估。  鞋袜检查舒适、摩擦、潮湿和空间，不因为鞋昂贵就坚持穿到破皮。走远路或换新鞋时，提前试穿并留意热点。脚底看不到的人可借助镜子或可信照护者；感觉异常时不能只凭痛不痛判断安全。  足部修剪、厚茧和小伤口在不同疾病下处理要求不同。已有糖尿病足风险、血流问题或感觉下降者，使用医疗团队的计划，不自行削切、烫泡或使用强腐蚀鸡眼产品。对应慢病分支见卷二十一。"},{"ch":19,"id":"c19-s014","title":"19.15　排尿：功能问题值得谈，不必等到失控","text":"尿频、尿急、漏尿、排尿困难和夜间反复起床，会影响睡眠与出行。记录发生时机、实际饮水、药物和其他症状，向医疗人员说明，不把所有问题都归为年龄或生育后的必然结果。尿失禁有不同类型，处理不能统一成少喝水或练盆底。 S83  看见或怀疑血尿，即使量少、只一次或没有疼痛，也应及时就医检查。 S113 出现严重疼痛、发热伴明显不适、无法排尿或其他急迫症状时，按紧急程度处理，不等自行消失。  如厕环境也属于治疗接口：能否及时到达，衣物是否方便，夜间照明是否安全，公共场所是否可及。不能因环境不便而长期牺牲正常饮水与外出机会。"},{"ch":19,"id":"c19-s015","title":"19.16　排便：看变化、质地和困难，不要求每天同一时刻","text":"排便维护先提供不被催促的时间与可获得厕所，不长期忽略便意。便秘可能与饮食、液体、活动、药物或疾病有关；持续问题、便血、无意体重下降或新出现的排便习惯改变，应评估，而不是一律加纤维。 S108  在适合的身体条件下，调整坐姿和脚部支撑可能使排便更舒适，但设备应稳定，不能增加跌倒风险。不要长期屏气用力、边刷手机边无限延长厕所时间，或自行反复灌肠作为所谓排毒。  已有痔疮也不能解释每一次出血。症状变化要重新判断，出现大量出血、黑便伴不适、明显腹痛或全身状态异常时应及时医疗处理。成人方案不能直接用于婴幼儿，儿童排便问题使用儿科路径。"},{"ch":19,"id":"c19-s016","title":"19.17　生殖与私密部位：清洁不等于消毒","text":"正常阴道分泌物会随情况变化，不需要清洗阴道内部，也不应使用香味喷雾或反复消毒来追求完全无味。出现异味、颜色或质地改变、瘙痒、疼痛、异常出血等，应评估，不靠外观自行确定感染种类。 S114  其他外生殖部位同样采用温和外部清洁，疼痛、包块、溃疡、分泌物或持续不适需要适当医疗。儿童包皮与私密护理不进行强行牵拉或不必要操作，具体问题由儿科说明。所有照护和检查均应解释并保护隐私。  突然剧烈睾丸疼痛，尤其伴恶心、呕吐或腹痛，应立即就医，不能先按摩、热敷或等待运动后自行恢复；睾丸扭转等问题需要及时处理。 S107"},{"ch":19,"id":"c19-s017","title":"19.18　盆底与性功能：先辨认问题，不统一“收紧”","text":"漏尿、盆腔疼痛、坠胀、排空困难或性接触疼痛，可能需要不同评估和康复。不要把每一种症状都归为松弛，更不把大量重复收缩当成唯一解决方式。合适的盆底训练需要正确识别动作与适应情况，必要时由专业人员指导。  性功能变化应同时考虑身体、药物、情绪、关系和本人意愿。就诊时可以说明最困扰的具体情况，而不是只追求某个次数或时长。关系中不舒适或没有意愿时，有权暂停，不需要通过药物维持他人的期待。  市场上承诺增大、紧致、永久增强或恢复年轻的产品，应使用高风险决策审查。尤其是激素、注射、手术和不明成分药物，不能按网络体验自行试用。"},{"ch":19,"id":"c19-s018","title":"19.19　心、肺、肝、肾：共享维护，不做每日刺激","text":"这些器官的日常支持主要来自基础生活、降低明确暴露、管理既有风险及遵循治疗。不能因没有感觉就排除问题，也不能因网络提到某种“压力”就每天增加器官检查。筛查与监测需根据病史和风险，而不是给所有器官安排年度影像全套餐。  持续咳嗽、异常气短、胸部不适、水肿、黄疸、尿量改变或其他持续变化，应按症状获得评估；严重或突然变化进入安全卷。不要用排毒茶、护肝片、吸氧或抗氧化产品覆盖需要解释的症状。  已确诊疾病的人，需要一份个人行动计划说明平稳日怎么做、哪些变化需要联系、急症怎么处理。具体指标和药物调整不由本书统一设定，详见卷二十与卷二十一。"},{"ch":19,"id":"c19-s019","title":"19.20　感官与身体维护的实际排程","text":"展开：V 日常身体接口检查 晨晚清洁时顺便观察牙齿、皮肤与足部是否有明显新变化，不另开一场全身搜查。工作前调整眼、耳、手和姿势的任务环境，外出前根据阳光、噪声、活动与天气准备防护。 器具使用后按各自说明清洁、保存和补充，尤其隐形眼镜、口腔器具、助听设备与医疗用品。发现持续功能变化时记录并安排评估；危险信号立即覆盖日程。 每次只解决一个高频摩擦：眼镜总找不到、牙缝工具不会用、鞋磨脚、洗手后裂口、厕所难到达。让正确行动更容易发生，比给身体增加更多评价更有用。"},{"ch":19,"id":"c19-s020","title":"19.21　维护不应吞掉感受生活的能力","text":"眼睛不只是视力数值，还用于看风景和人的表情；耳朵不只是听力阈值，还用于音乐与交谈；手不只是握力，还用于触摸、制作和照护；皮肤不只是无瑕，还承担感觉和边界。维护的目的，是保留这些参与，而不是让每次体验都变成检测。  当日常观察让你越来越害怕身体、反复检查或不断寻找缺陷时，应减少无效监测并考虑适当支持。一本人体指南最不应该造成的结果，是让人从此不敢正常使用自己的身体。"},{"ch":20,"id":"c20-s000","title":"20.1　三类检查必须分开","text":"筛查面向没有相关症状、但符合某种风险条件的人，目标是发现有必要更早处理的问题。诊断检查面对已经出现的症状或异常，回答原因是什么。监测则用于已经明确的问题或治疗，判断变化与调整。三者可以使用类似工具，但目的与解释不能混同。  例如出现便血的人，不应因为尚未到普通筛查年龄就等待；长期治疗中的复查，也不能因“不建议无症状人群普查”而自行取消。反过来，一项诊断工具在有症状人群有用，并不证明所有健康人都应每年使用。  每次开检前可以问：“这项检查要解决哪个问题？”若答案只是套餐包含，继续问结果会怎样改变行动。不一定要拒绝，但需要知道它的位置。检查的价值来自能够帮助决定，而不是报告页数。"},{"ch":20,"id":"c20-s001","title":"20.2　筛查的完整链条","text":"筛查前明确适用条件和可能后果；检查时按要求准备；检查后取得正式结果；异常时完成进一步评估；需要治疗时进入适当治疗；最后更新下一次计划。任何一环断开，前面完成的动作都不能自动转化成健康收益。  因此，家庭或个人记录中不能只有“体检已做”，还要有“结果已解释”“需要处理的事项有负责人”“下一次时间明确”。无需让所有亲友看到全部报告，但负责协助的人应拥有足够信息。  遇到不确定结果，不必立刻搜索最严重解释。问清它是测量问题、需要复核、低风险观察，还是确需转诊。把下一步写成时间和条件，不把“有空再看看”当成计划。"},{"ch":20,"id":"c20-s002","title":"20.3　为什么更多检查可能增加不确定性","text":"下面是作者构造的数学示例，不描述任何实际疾病或检测产品。假设一千人中十人真正有某问题，检查能检出其中九人，同时把其余九百九十人中的百分之五判成阳性。那么阳性者约有五十九人，其中真正有问题的约九人。检查很敏感，不等于阳性就接近确诊。  真实检测还涉及特异度、疾病风险、阈值、重复验证和后续路径。这个例子只提醒：结果必须在受检人群背景下解释，不能单凭“准确率很高”就推出个人结论。低风险人群做大量项目，可能出现需要解释的偶然异常。  假阳性不是唯一代价。检查本身、进一步侵入性操作、辐射、焦虑、时间与费用，都需要进入选择。某些发现即使不查也未必在一生中造成问题，这就是讨论过度诊断时需要理解的核心。具体收益与伤害必须看该项目证据，不能因此一概拒绝筛查。 S116 S117"},{"ch":20,"id":"c20-s003","title":"20.4　三个地区指南示例，展示条件而非提供全球日历","text":"以下为本版核对到的美国USPSTF最终建议示例，不是中国或其他地区的统一医嘱，也不涵盖全部高风险和术后情况。使用时仍需核对所在地现行指南与个人病史。  项目 示例条件 不能省略的限定 乳腺筛查 该指南适用的平均风险人群，四十至七十四岁每两年乳腺X线筛查 遗传高风险、既往癌症或特殊治疗史另有路径；较高龄需个体判断。 S116 结直肠筛查 平均风险、无相关症状成人，四十五至七十五岁；可选检测方式与间隔不同 七十六至八十五岁结合整体健康、既往筛查与偏好选择；异常粪便筛查需要相应后续检查。 S117 肺癌筛查 五十至八十岁，至少二十包年吸烟史，仍吸烟或戒烟不足十五年，讨论年度低剂量CT 不是所有人每年做胸部CT；健康情况、能否及愿否接受后续治疗影响决定。 S118  包年是累计吸烟暴露的表达，不是吸烟年数本身。上述例子说明年龄必须与风险、器官和后续处理结合。书后的逐年索引因此安排“核对预防计划”，而不把这一版医学数字冻结一百年。"},{"ch":20,"id":"c20-s004","title":"20.5　用器官与病史建立个人预防卡","text":"个人预防卡记录相关器官、既往手术、重要家族史、既往异常和目前疾病。宫颈、乳腺、前列腺等项目不能仅靠身份证性别简单推导；需要结合实际器官、手术和激素治疗史，由专业人员确定适用路径。  卡片也包含血压与代谢风险、口腔、视听、骨健康、感染暴露、心理状态及生活安全。不是所有项目每年都检查，也不是每个人都需要同样实验室组合。把它们作为与基层医生讨论的议题，再形成个人计划。  对儿童，疫苗、生长与发育观察、视听和口腔属于相应儿童保健路径；对孕产期，采用孕产团队计划；对高龄和重病，结合本人目标及治疗负担。不能拿普通成人体检套餐替代这些路径。"},{"ch":20,"id":"c20-s005","title":"20.6　疫苗：记录比记忆可靠","text":"保存正式接种记录，包括产品、日期、剂次与重要反应。搬迁、转学、留学、工作或怀孕计划变化时，带记录核对当地现行安排。口头说“小时候都打过”可能不足以决定补种，但记录缺失也不意味着自己重打全部。  接种时间和适用性应结合年龄、已有剂次、疾病、用药、妊娠、旅行和暴露，必要时由医疗人员解释。WHO强调按推荐时间完成接种，并在错过后联系服务提供者讨论后续安排，而不是自行猜测是否需要重启。 S121  接种后按机构要求观察，了解常见反应与需要求助的信号。既往反应要如实描述，包括发生时间、具体表现和是否接受治疗，不只写“过敏”两个字。下一剂之前让专业人员判断，不凭网络争论决定全部疫苗的安全性。"},{"ch":20,"id":"c20-s006","title":"20.7　家庭血压：先把测量做对","text":"测量前按指导准备，排空膀胱并安静坐至少五分钟，背部有支撑、双脚平放且不交叉，裸露上臂由桌面支撑在合适高度，袖带尺寸与位置适合，测量时不说话。 S119 不在刚运动、情绪剧烈波动或姿势随意时取得一个数值就当作日常基线。  设备是否经过适当验证、袖带是否适合、需测几次和记录多久，应向医生或药师核对。保留日期、时间、读数和相关症状，不只记最好的一次。设备显示异常但本人不舒服时，症状优先进入医疗判断。  家庭测量不能独立授权增减处方。开始监测时就问清哪些数值或症状需要何种响应，包括何时重复、何时联系、何时急救。不要在没有行动计划时一天量几十次，让监测本身增加焦虑。"},{"ch":20,"id":"c20-s007","title":"20.8　药物总表：一人一份当前真相","text":"药物表应包括通用名称、规格、实际用量、使用时间、用途、开药者和复查安排。外用、滴眼、吸入、贴剂、针剂、非处方药、草药和补充剂都要考虑，不能只有口服处方。已经停用的移到历史区，保留停用原因和日期。  记录真实使用方式。漏服、费用、吞咽困难、不适或不理解导致未执行时，告诉医疗人员才能改进方案；把表写得完美却与实际不同，反而增加风险。照护多人时，每个人药物分区，避免靠包装颜色辨认。  每次住院、出院、换医生、出现新病情或药物改变后做一次核对。明确旧药是继续、替换、暂停还是停止，不让新旧方案同时存在而由家属猜测。必要时请药师协助整合。"},{"ch":20,"id":"c20-s008","title":"20.9　剂量、单位与器具","text":"读懂“每片含量”“每次片数”“每日次数”和“总疗程”是不同信息。毫克、微克、毫升、滴数和国际单位不能互换；液体药的体积必须结合浓度。儿童药物尤其需要按实际处方和适合量具，不能用厨房汤匙估计。  剂型变化也需要核对。不能因为名字相同就认为不同规格、缓释、肠溶或不同途径可以直接替换。需要切片、碾碎、混入食物或经管路给药时，先问药师或医疗团队，不能为了方便自行改变。  标签模糊、药片来源不明、包装破损或储存条件失控时，先暂停使用该不明物并寻求确认。对不能中断的必要药物，应及时联系服务获取安全替代，而不是简单停掉整个治疗。"},{"ch":20,"id":"c20-s009","title":"20.10　漏服与不良反应：事先准备规则","text":"漏服后怎样处理取决于具体药物、距离下一次时间、疾病和风险，不能统一“补上”或“加倍”。最好在开药时问清，并保留说明。发现已经重复给药、剂量明显错误或儿童误服时，立即联系当地急救或中毒咨询，不等待症状出现再处理。  不良反应记录包括何时开始、当时用了什么、表现、持续时间和处理。严重呼吸困难、喉舌肿胀、昏厥等使用安全卷。普通不适也应反馈，尤其影响持续治疗时；不要为了显得配合而一直隐瞒。  部分药物不能突然停用，是否暂停或替换需由专业人员判断。出现问题时要尽快联系，而不是独自忍耐与自行停药二选一。每个长期方案都应有明确的咨询入口。"},{"ch":20,"id":"c20-s010","title":"20.11　抗菌药与家庭剩药","text":"抗菌药不能治疗病毒感染，使用时遵照处方，不与他人共享、不为以后自行储备使用，也不服用为别人开的药。是否需要药物由医疗评估决定，不能根据鼻涕颜色或以前一次经验直接复制。 S120  症状未改善、出现副作用或情况改变时，联系开药者讨论，而不是自行延长、缩短或叠加。网上“必须永远吃满所有剩药”和“舒服了立即停”都不能替代具体医嘱。保存处方与实际使用信息，有助于后续判断。  家庭清理剩药时按当地回收或安全处置要求处理，不把药物随意倒进水槽或放在儿童可接触垃圾中。需要持续使用的药物建立补充提醒，避免因清理或整理而误丢。"},{"ch":20,"id":"c20-s011","title":"20.12　补充剂也进入同一张表","text":"不要把补充剂放在药物之外，当成天然且没有相互作用的独立世界。产品标签、剂量、开始日期与使用目的应能说清，尤其在手术、妊娠、哺乳、慢病和多药使用时向专业人员说明。 S38  若同时使用多种复合产品，先核对重复成分。某一营养素已足够，并不意味着增加就会继续获益。出现症状时不要立刻再加一个产品抵消前一个产品的反应；先考虑是否需要停用新增非必要项目并咨询。  所有前沿“优化”方案在卷三十统一审查，本卷只要求信息透明、来源可靠和适当监督。秘密使用所谓抗衰药物，会使后续诊疗缺少关键资料。"},{"ch":20,"id":"c20-s012","title":"20.13　就诊前、中、后的三张小卡","text":"就诊前写主要问题、症状时间线、正在使用的东西和最希望解决的功能。问题多时排序，先讲最重要的，不把紧急症状放在最后一句。带必要报告，不需要打印所有历史聊天。  就诊中确认自己理解了什么。可以用自己的话复述：“所以目前还不能确定，需要先做这项，再根据结果决定？”听不懂就要求解释，语言或感官障碍可申请合适支持。陪同者帮助补充，不替本人决定一切。  就诊后记录下一步、截止时间、结果入口和异常处理。收费完成不是闭环，预约成功也不是治疗完成。确实无法执行时，联系团队讨论可行替代，而不默默放弃。"},{"ch":20,"id":"c20-s013","title":"20.14　第二意见与意见冲突","text":"需要重大、不可逆或高风险治疗时，可以在不延误紧急处理的前提下寻求适当第二意见。提供完整资料和原建议，重点问适应证、替代方案、预期收益、主要风险和等待代价，不只是寻找一个最合意的答案。  两位医生意见不同，先看是否面对同样信息、讨论同一目标、采用不同证据或承担不同风险偏好。可以请其解释分歧点，必要时由多学科团队协调。不是票数最多的建议自动正确，也不是最昂贵的机构必然更可靠。  对紧急情况，不应为了收集无限意见延误救治。对非紧急且信息不足的决定，则可以先补关键证据，而不是被销售期限推动。"},{"ch":20,"id":"c20-s014","title":"20.15　高龄与重病：停止某项筛查不等于停止照护","text":"是否继续预防性检查，需要看本人整体健康、既往结果、潜在收益出现所需时间、后续治疗是否符合目标和实际负担。年龄可以进入判断，但不能单独决定所有事项。具体例子见本卷地区指南和卷十五。 S117  减少低价值项目后，应把注意力转到疼痛、口腔、感官、功能、营养、关系和舒适。停止一种检查，不代表不再解释新症状；选择缓和医疗，也不等于不给可缓解痛苦的治疗。  家庭讨论要围绕本人目标，而不是把做更多检查当作孝顺证明。真正的照护可能是陪同一次有价值的复诊，也可能是减少一次没有实际意义的奔波。  展开：H 医疗闭环协议 提出问题时注明症状、风险或监测目的；行动前确认适用条件与准备；完成后取得结果并解释；有后续时写负责人和期限；计划变化时更新药物与日历。 每天不需要重复审查全部医疗资料，只处理到期和异常事项。每次跨机构、出院或重要用药变化后，额外做一次整合。没有明确行动的数字不必无限收集，有明确行动的结果不能无人跟进。  预防医疗的目标不是让每一天都像体检日，而是让必要服务准确到位，使普通日子可以放心用于生活。"},{"ch":21,"id":"c21-s000","title":"二十一·一　诊断是一个分流入口，不是整个人的定义","text":"一个人可以有糖尿病，同时是运动爱好者；可以使用轮椅，同时管理复杂项目；可以需要提醒用药，同时对其他生活决定表达清楚。诊断提供重要信息，却不能替代对具体能力、目标和环境的观察。本卷的作用是给前面的年龄日程增加适配接口，不另造一套只剩治疗的人生。  残障并非只由身体内部的状态决定，也与交通、建筑、沟通、制度和资源障碍相互作用。改善可及性是健康与参与的一部分，不应把所有困难都转成个人康复任务。 S128 对本人而言，楼梯无法通行时需要的是可用路线，而不只是被鼓励更加坚强。  所有分支先回答：“今天最想完成什么？”再问“哪一步受限？”限制可能需要治疗、工具、协助或改变环境。不要一上来就要求把所有身体指标恢复成没有疾病的人，才允许工作、亲密、娱乐和选择。"},{"ch":21,"id":"c21-s001","title":"二十一·二　建立一页个人疾病行动卡","text":"行动卡应由本人和相应医疗团队共同确认。写明平稳状态是什么，日常用药与必要监测是什么，哪些变化需要当天联系，哪些情况直接急救，谁能提供支持，夜间如何联系。把药物商品名、成分、剂量单位和使用条件写清楚，不以颜色或模糊绰号作为唯一识别。  行动卡还需要写“不能照搬什么”。例如饮水受到个体限制，活动存在特定禁忌，某些非处方药不适合，或者出现某类症状时不能继续训练。这部分用来覆盖本书的普通建议，避免一条看似健康的通用规则破坏已经建立的治疗方案。  随病情和处方变化更新版本与日期，旧版明显作废。实际照护者应能找到当前版本，并通过复述或回演确认会用。电子文件方便更新，必要时仍保留可离线取得的最小纸质版本。"},{"ch":21,"id":"c21-s002","title":"二十一·三　糖尿病：平日、病日和急症不是同一张菜单","text":"日常饮食、运动、监测和药物应形成互相协调的方案。工作时能否按需进食、是否随身携带必要用品、设备故障后如何处理，都是实际治疗条件。不能在开始新运动或改变饮食后，仍假设原来所有操作无需复核。  对于已经确诊、清醒且能安全吞咽、其个人计划适用的低血糖情形，常见成人处理规则是摄入十五克快速吸收碳水，十五分钟后复测并按结果处理。儿童可能需要更少，必须使用医生给出的量。意识受损或不能安全吞咽时，不向口中塞糖或灌水；立即求助，按已经开具且受过培训的胰高血糖素方案处理。 S122  反复低血糖不是靠不断增加零食就算闭环，应带着进食、活动、监测与用药记录请团队调整。不要自行照书修改胰岛素剂量。本书只说明行动计划的接口，不能提供适用于所有人的注射算法。  生病时要提前知道何时测血糖或酮体、哪些药物如何处理、何时联系。明显呕吐、腹痛、深快呼吸、异常嗜睡或其他严重不适可能提示需要急诊评估；酮症酸中毒可危及生命，不以“今天没吃东西所以不用管”处理。 S123"},{"ch":21,"id":"c21-s003","title":"二十一·四　糖尿病足：感觉不到疼痛也要看得到变化","text":"按个人医疗计划每天检查足底、趾间和鞋内，视力或动作受限时使用镜子或请人协助。发现水疱、伤口、颜色或温度变化、局部红肿等，应及时联系医疗人员；没有疼痛不能作为安全保证。不要自行剪除厚茧、用腐蚀性去鸡眼产品或在足部使用过热水与热源。 S124  把检查嵌入穿袜或清洁后的顺序，用品放在固定位置。若没有人能够看清足底，问题不是“本人不配合”，而是照护方案缺少一个可执行步骤。需要鞋具或专业足部护理时，按评估选择，不凭商品“糖尿病专用”字样认定适合。  这项动作在启用期间每日重复，但只在本处展开。其他年龄章节引用行动卡即可，不必再抄一整份足部清单。"},{"ch":21,"id":"c21-s004","title":"二十一·五　哮喘：会拿吸入器，不等于会正确使用","text":"请医生、护士或药师看一次本人实际操作，再纠正具体装置的技术。不同吸入器与治疗方案并不相同，不能把颜色、吸气方式或一次用量通用于全部产品。个人行动计划应说明平稳期用法、症状恶化时怎么做，以及何时急救。 S125  生活上检查救急药是否能随时取得、是否还有余量、学校或工作场所是否知道必要信息。症状影响活动、夜间反复醒来或越来越需要缓解药时，应复核控制情况，而不是悄悄忍耐。出现严重呼吸困难、持续恶化或按行动计划处理后仍不好，立即寻求紧急帮助。  不要一概取消所有活动，也不要把运动时不适当成锻炼不足必须硬撑。适合的活动方式与事前处理由个人方案决定。刺激物暴露若来自工作或居住环境，应考虑环境调整，而不只增加个人药物负担。"},{"ch":21,"id":"c21-s005","title":"二十一·六　心脏、肾脏与其他需要特殊饮食的疾病","text":"多种疾病共存时，“多喝水”“吃更多蛋白”“多补钾”“低盐就用替代盐”等普通建议，都可能需要重新判断。以慢性肾病为例，营养和液体安排取决于疾病阶段、化验、治疗与整体营养状态，不能由书中的健康成人菜单直接推导。 S96  向团队确认哪些限制真正适用于自己，限制到什么程度，哪些食物可以替代，出现什么变化需要复核。把限制写成可买、可做、可吃的方案，而不是十张互相冲突的禁忌表。若限制多到实际吃不够，应寻求营养专业支持。  日常监测必须有用途。记录体重、血压或其他项目时，问清变化阈值、观察周期和联系对象；不同病情不能共享同一警报值。过多没有后续动作的记录，只会让患者成为数据录入员而不是治疗参与者。"},{"ch":21,"id":"c21-s006","title":"二十一·七　癌症治疗：把生活支持与治疗计划并列","text":"面对诊断，先确认病理信息、目前分期或尚待完成的评估、治疗目标、可选择方案、主要不确定性及下一步时间。需要第二意见时，带齐关键材料，避免仅凭互联网相似病例替自己决定。讨论生育、工作、照护和费用，是治疗规划的一部分，不必等治疗结束后才提。  某些癌症及治疗会增加感染风险。治疗团队应明确发热和感染的联系规则；出现发热、寒战或其他感染提示时及时联系，不先反复用退热药掩盖后等待。特别是中性粒细胞减少等风险状态，需要按团队的紧急计划处理。 S126  把每个治疗周期的交通、陪同、食物、休息和工作安排画出来。状态较好的一天也不必补完全部欠下任务。亲友提供帮助时，优先承接实际负担，而不是持续发送未经核实的“治愈秘方”。任何补充产品、草药或所谓免疫增强方案都应先与团队核对，不能因为不是处方药就认为不会干扰治疗。"},{"ch":21,"id":"c21-s007","title":"二十一·八　疼痛：同时看原因、功能和治疗负担","text":"疼痛描述可以包括位置、开始方式、变化、相关动作、感觉特征、影响的任务和已经尝试的处理。新发、剧烈、伴明显神经变化或其他危险信号的疼痛，先走相应急症或诊疗路径。既有慢性疼痛的人同样可能出现新的问题，不能所有变化都归入旧诊断。  和专业人员讨论一个功能目标，例如能够连续准备简单食物、坐车参加活动或完成必要工作段。目标不是要求忽略疼痛，也不只追逐每天的分数归零。不同原因需要不同治疗与活动安排，本书不提供统一拉伸、按摩或止痛药方案。  家庭支持可以减少不必要的争论：不要求本人每次都证明疼痛真实，不把疼痛看作偷懒，也不替本人预测永远不能做什么。共同寻找合适的活动分段、工具和休息方式，效果不佳时及时复核，而不是不断加码同一种方法。"},{"ch":21,"id":"c21-s008","title":"二十一·九　活动后症状加重：不能套固定递增训练","text":"对于存在活动后症状加重的相关疾病，负荷不仅包括运动，还可能包括思考、社交、直立、通勤和感官刺激。已经在卷十八说明的肌痛性脑脊髓炎／慢性疲劳综合征分支，需要按自身能量界限和专业支持安排，不能以固定每周加量的方式强推。 S102 S103  实用记录关注延迟结果：一次活动之后当天、次日或更后面的生活能力有没有明显恶化。若只在活动结束当下看心率和主观感觉，可能漏掉后续负担。记录到足以识别模式即可，不要求把每一次思考都量化。  把必须任务分段或改用协助，保留恢复空间，允许临时取消。这个分支不是要求所有疲劳者永久不动，也不是给所有疾病同一份卧床计划；首先需要正确评估，之后依据具体疾病与个人反应调整。"},{"ch":21,"id":"c21-s009","title":"二十一·十　康复目标应回到真实任务","text":"康复关注功能、参与和环境适配，不只是治疗室中的某个动作或分数。 S84 可以把大目标“恢复正常”拆成能验收的任务：怎样安全上厕所，怎样与家人交流，怎样回到一部分工作，怎样使用交通。每个任务标明需要的训练、工具、环境改造与协助。  训练结束后检查能否迁移。治疗室可以完成，不代表在拥挤家中、疲惫晚间或没有扶手的公共场所同样可行。把真实场景照片、距离、台阶、工作要求带给康复人员，会比只说“家里不方便”提供更多信息。  进展不一定只体现为动作更接近从前。更省力的替代方式、可靠的辅助沟通、独立使用轮椅或减少照护疼痛，也可能是重要成果。不要为了外观像以前，而拒绝实际上扩大自主的工具。"},{"ch":21,"id":"c21-s010","title":"二十一·十一　动作、视觉、听觉与沟通障碍的四类接口","text":"动作接口关注到达、抓握、转移和稳定。先调整物品位置、操作力度、路径和支撑，再判断是否需要代做。辅助器具需要适配与正确使用，不能由家人随机购买后要求本人迁就。  视觉接口关注字体、对比、触觉标识、语音输出和空间稳定。改变家具与用品位置时说明变化，必要危险提示不要只靠颜色。听觉接口关注清楚可见的交流、背景噪声、文字或其他辅助方式，不以提高音量解决所有问题。  沟通接口关注本人怎样表达选择、疼痛、拒绝和求助。给足回应时间，面向本人讲话，允许辅助沟通工具，不只问旁边的照护者。无法流利说话不自动意味着无法理解，也不意味着没有意见。  所有接口都有一个共同原则：先问“怎样最方便你”，不要从旁观者觉得正常的方式出发。支持的目标是接入生活，不是要求本人每天向环境证明适应能力。"},{"ch":21,"id":"c21-s011","title":"二十一·十二　注意力与执行困难：外部支持不等于能力低下","text":"持续且跨情境的注意、冲动或活动调节困难需要适当评估，不能靠一天拖延或一份网络量表自行诊断注意缺陷多动障碍。治疗和支持可以包含专业评估后的药物、心理社会方法以及学校或工作适配，具体组合因人而异。 S127  无论是否已有诊断，都可以检查任务接口：要求是否太模糊，第一步是否可见，材料是否齐全，提醒是否出现在需要的时候，环境是否一直打断。把“写完报告”改成“打开资料，写出三个待回答问题”，属于降低启动障碍的编排，不是替代治疗。  对感官敏感、转换困难或需要更可预测环境的人，可以提供提前说明、安静空间、清楚顺序和可选择的沟通方式。不要把减少痛苦的适配误解为纵容，也不把所有差异都当成必须纠正的病理。"},{"ch":21,"id":"c21-s012","title":"二十一·十三　手术、外伤与暂时失能：退出条件要写清楚","text":"出院前确认伤口、药物、活动、负重、洗浴、饮食、驾驶、复工和复查的个体要求。不同手术和损伤不能按同一“第七天可以做什么”安排，书中的普通年龄日程暂时退居次位。  回家后先恢复最必要的生活链。用过的物品放回可达到的位置，餐食和用品提前准备，明确谁协助搬运和交通。不要在镇静、疼痛或明显疲劳状态下处理重大财务决定，也不把“已经出院”理解为具备全部原有能力。  需要停止限制时，按照团队的条件复核，而不因日历到了或网上同病者恢复更快就自行升级。与此同时，限制也应有复查点，不能因为家属害怕而无限延长所有活动禁令。"},{"ch":21,"id":"c21-s013","title":"二十一·十四　疾病管理的行政负担也要有人承担","text":"预约、报销、取药、设备维修、材料上传、请假和解释病情，会消耗大量精力。可以指定一个协调入口，减少本人向每个人反复讲述。共享资料按最小必要原则授权，不把方便协作变成公开全部隐私。  学校与工作中的合理支持要具体：需要怎样的座位、休息、任务格式、时间安排或无障碍路径。相关权利、证明和申请流程按当地现行制度核实。不要把申请支持包装成必须公开所有诊断细节的交换。  一份真正可执行的计划应计算交通、人手和费用。若无法做到，告诉团队现实限制，寻求替代路径；不要在诊室答应所有要求，回家独自承受无法执行的羞耻。  展开：D 疾病与残障覆盖协议——先覆盖冲突，再继承常规 读取当前个人行动卡，确认是否处于平稳、需要调整、需及时联系或急症状态。将与个体治疗冲突的通用建议暂停，其余适用的生活底座继续保留。不要因诊断存在就取消所有生活，也不要因今天感觉不错就擅自撤掉必要治疗。 选择一个本人在意的任务，明确独立、工具、提醒或协助的哪一种方式最合适。监测只保留会改变行动的项目，异常按已确认的渠道处理。照护者交接完成后，应有真实休息，而不是随时继续远程指导。 每次病情、药物、环境或支持人员变化后更新方案。进展以功能、安全、舒适、参与和本人目标共同判断，不用“像没有疾病的人一样”作为唯一验收标准。"},{"ch":22,"id":"c22-s000","title":"二十二·一　情绪首先提供信息，不自动提供命令","text":"生气可能提示边界受到侵扰，也可能来自疲惫、误解或旧经历；害怕可能提示真实危险，也可能高估不确定性；羞耻可能反映社会评价，却不一定说明自己真的做错。可以认真听见情绪，同时暂缓依据情绪做不可逆决定。  一个简短的分解是：发生了什么，我现在有什么感受，我怎样解释它，我想做什么，实际采取哪一步最合适。前四项可以自动出现，第五项仍然可以选择。这不是要求所有情绪都经过理性审批，而是在强烈情绪与重大行为之间留一点空间。  情绪没有必须达到的每日理想比例。悲伤、愤怒和失落也可能是正常生活的一部分；长期压住它们，只为维持“积极状态”，不是本书的目标。真正需要判断的是危险、持续程度、生活影响与可获得的支持。"},{"ch":22,"id":"c22-s001","title":"二十二·二　先区分需要安慰、需要行动和需要专业帮助","text":"有些困扰需要被理解，例如一次失望或孤独；有些需要实际改变，例如工作负荷、住房噪声和关系分工；有些需要专业评估，例如持续严重焦虑、明显抑郁、功能下降或危险行为。三种需要可以同时存在，不必只选一个。  在交流前可以问：“现在更希望我听你说，帮你整理，还是一起做一件事？”回答可以变化。不要在对方需要理解时立即给十条建议，也不要在对方需要实际帮助时只说“照顾好自己”。支持的质量在于是否接上真实需求。  自己的困扰同样可以这样分流。今天需要的是补一顿饭、联系医生、取消承诺、向别人说明边界，还是容许难过一会儿？把问题缩小为能做的一步，通常比要求立刻恢复整个人生方向更容易执行。"},{"ch":22,"id":"c22-s002","title":"二十二·三　日常情绪检查不应变成全天自我监控","text":"每天有需要时，简短确认精神、身体和生活状态即可。记录可以用自然语言：“下午开会后很紧绷，散步后好些”“几天都无法开始原本喜欢的事”。不必给每小时情绪打分，尤其当记录使你更频繁地审查自己时。  记录的核心是情境、持续和功能，而不是寻找一个完美情绪曲线。若数据不会改变行动，可以降低频率。已经接受治疗的人则按专业计划记录，不用本书的简化方法替换治疗工具。  把恢复放进环境：减少不必要提醒，留一个可以安静坐下的地方，准备容易完成的食物，让求助联系方式好找。情绪支持并不都发生在脑内，有些最有效的个人改动是让日常少一道障碍。"},{"ch":22,"id":"c22-s003","title":"二十二·四　担忧：把可行动问题与无法今天解决的问题分开","text":"面对担忧，写明具体事件、已经知道的证据、最担心的结果与今天能够采取的一步。可以行动的部分落实到日历，例如预约、询问、核对材料；目前无法解决的部分标为等待条件，不进行无限重复推演。  不确定性无法通过反复搜索彻底清除。可以给一次搜索设定问题和停止标准：找到官方要求、比较少数可靠选项、确认是否需要专业评估。搜索结束后若没有新证据，只是再次体验同样恐惧，就不必假装继续浏览仍在提高判断质量。  持续难以控制的焦虑、明显身体或睡眠困扰，以及工作、学习、关系受到影响时，可以寻求心理或医疗帮助。焦虑障碍有相应治疗，不需要先证明自己已经完全无法生活才有资格就诊。 S132"},{"ch":22,"id":"c22-s004","title":"二十二·五　低落：降低启动门槛，而不降低人的价值","text":"在状态低落但没有即时危险时，今天的目标可以很小：完成必要清洁，吃一点合适食物，走到可以接触外界的位置，向可信赖的人发出具体求助。它们是维持生活的支持，不是靠打卡自行治愈疾病的承诺。  持续丧失兴趣、明显绝望、自我贬低或生活功能变化，需要评估；抑郁不是单纯缺乏意志，也可以获得有效治疗。 S21 不要要求患者先跑步、感恩或保持微笑，才愿意提供医疗支持。  亲友可以帮助预约、陪同、处理一部分家务或按约联系。不要把“你条件这么好还难过什么”当作鼓励，也不要让患者承担安慰所有担心他的人的额外任务。支持者可以有边界，但边界不必以羞辱表达。"},{"ch":22,"id":"c22-s005","title":"二十二·六　异常兴奋也可能需要停下来评估","text":"明显少睡却不觉得需要睡、活动和讲话显著增加、异常自信、冲动消费或风险行为增加，不能仅因看起来精力旺盛就认定状态很好。若与平时明显不同，尤其已经影响生活，应尽快专业评估；躁狂或轻躁狂属于需要认真识别的情况。 S130  在状态未明确时，减少重大投资、借贷、驾驶等高风险决定的机会，可以让可信赖的人协助保护日常事务。不要自行停用已经开具的精神科药物，也不要根据一次情绪低落自行使用他人的抗抑郁药。  这些提示用于发现需要帮助的变化，不用于给活跃、外向或短期开心的人贴诊断标签。关键是相对基线的显著改变、持续性、行为风险和专业判断。"},{"ch":22,"id":"c22-s006","title":"二十二·七　创伤经历：本人有权决定讲多少","text":"经历事故、暴力、灾害或其他创伤后，不必立即详细复述来证明愿意恢复。支持者可以提供安全环境、具体帮助与专业入口，允许本人控制叙述的时间、内容和听众。不要在家庭聚会中要求其公开讲述，也不要未经同意传播经历。  某些场景、声音或身体感觉令人强烈不适时，可以先回到当前环境，确认现在是否安全，减少刺激并联系支持。持续困扰应交由合适专业人员评估；不自行设计强制重现经历或高强度暴露挑战。  恢复不是必须原谅伤害者，也不是必须把创伤变成人生礼物。本人可以选择怎样理解经历，获得帮助不以积极叙事为条件。法律、医疗、心理和生活支持可以各自提供不同功能，不要求一名朋友独自完成全部救援。"},{"ch":22,"id":"c22-s007","title":"二十二·八　心理治疗怎样选择与使用","text":"选择服务时了解专业资质、擅长问题、治疗方式、费用、保密与例外、紧急情况处理和是否与医疗治疗协调。心理治疗有不同方法，适合的选择需要结合问题与个人情况，不能只看某个流派的流行程度。 S24  第一次交流可以说明最希望改变的实际困难，例如反复恐慌影响出门，关系冲突造成失眠，或无法处理丧失。共同确认目标怎样观察、多久复核、若不适合如何调整。治疗不需要每次都有顿悟，但应能够讨论是否正在朝目标前进。  如果服务者要求不合理依赖、模糊私人关系、推销大量无关产品、阻止必要医疗或羞辱来访者，应认真评估安全与边界，必要时换服务或向合适渠道反映。困难治疗过程中的不舒服与不当行为不是同一回事。"},{"ch":22,"id":"c22-s008","title":"二十二·九　用药与日常支持并行","text":"精神科药物的选择、调整和停药需要专业安排。出现不适、效果不足、经济困难或不愿继续服药时，把原因直接告诉开药者，讨论替代和调整，而不是在失联中自行突然改变方案。  日常支持可以帮助按约就诊、保留睡眠机会、减少物质使用和维持生活，但不能被用来证明“不需要药”。反过来，药物也不自动解决危险工作环境、暴力关系和全部现实压力。治疗与环境改变可以同时必要。  家属协助用药应尊重权限和知情，不能把药物秘密混入饮食或以威胁维持服从。涉及决策能力和紧急处置的特殊情况，遵守专业评估与当地法律，不由家庭私自扩大强制权。"},{"ch":22,"id":"c22-s009","title":"二十二·十　自伤或自杀风险：安全优先于保密承诺","text":"当担心某人可能自杀，可以直接、平静地询问，并认真听。直接询问不会因为提到了这个问题就自动增加自杀想法。帮助减少可安全控制的危险接触、联系专业和可信赖支持，并在危机后继续联系，是重要的支持方向。 S129  存在即时危险、已采取伤害行动、无法保证安全或明显意识与行为异常时，立即联系当地急救或危机服务，并在确保自身安全的前提下陪同。不要只让对方签一份“保证不做”的承诺，也不要让一个未成年人独自承担全天候看护。  支持者不必独自判断所有风险等级。可以说：“我很在意你的安全，这件事需要更多人一起帮助。”说明需要联系谁，尽可能让本人参与；但在迫近危险时不能为了保守秘密而停止求助。具体联系方式按所在地区当前服务核对。"},{"ch":22,"id":"c22-s010","title":"二十二·十一　愤怒与冲突：暂停动作，不否定感受","text":"在没有暴力危险的普通冲突中，先说明需要暂停，并给出可返回的时间或条件。暂停期间不继续发送攻击信息、不以失联惩罚对方。等能够听见对方再讨论事实、影响、需要和具体请求。  把“你从来不在乎我”改成“昨天约好的事情没有完成，我承担了额外工作，希望下次提前说明”。具体表达不保证对方同意，却能让争议有可讨论对象。一次只处理一个问题，避免把多年所有遗憾一起作为证据倾倒。  修复需要行为，不只需要道歉。明确谁补上遗漏、怎样避免重演、什么时候检查是否改善。对方可以暂时不接受道歉，受到影响的人不负有立刻恢复亲密的义务。"},{"ch":22,"id":"c22-s011","title":"二十二·十二　暴力和控制不能降级成沟通问题","text":"亲密关系暴力不仅包括身体攻击，也可能包含性胁迫、心理虐待和控制行为。 S131 被持续威胁、限制行动、剥夺必要资源、监控或强迫切断支持时，优先考虑安全与专业帮助，而不是只练习更温柔的表达。  准备离开或求助时，考虑对方是否能查看设备、位置和通信，选择更安全的渠道。必要证件、医疗信息、孩子或其他被照护者的安全安排，可以在当地专业服务支持下准备。不要为了收集证据故意激怒对方，也不要强行要求受害者立即采取其尚不安全的行动。  本节安全原则适用于任何性别的受害者。本人没有义务通过足够耐心治好施暴者；支持者也不应替其决定关系去留，而应帮助增加安全、信息与可行选择。"},{"ch":22,"id":"c22-s012","title":"二十二·十三　孤独、独处和连接是三个不
