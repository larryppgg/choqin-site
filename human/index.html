牙出现时建立牙科就诊，最迟不晚于第一周岁。。\u003c/p\u003e\n\u003cp\u003e本轮核对：2026-09-29；页面／文件日期：页面未见明确更新日。\u003c/p\u003e\n\u003cp\u003e核对命题：儿童第一颗牙出现时建立牙科就诊，最迟不晚于第一周岁。。仅核对这些命题，不代表认可页面全部陈述或整本书。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s161\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S161] WHO / Europe｜Physical activity\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.who.int/europe/news-room/fact-sheets/item/physical-activity\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ePhysical activity\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：WHO分龄活动目标，5—17岁周内平均每日60分钟；成人150—300分钟及老年平衡。。\u003c/p\u003e\n\u003cp\u003e本轮核对：2026-09-29；页面／文件日期：2021-09-01。\u003c/p\u003e\n\u003cp\u003e核对命题：WHO分龄活动目标，5—17岁周内平均每日60分钟；成人150—300分钟及老年平衡。。仅核对这些命题，不代表认可页面全部陈述或整本书。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s162\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S162] CDC｜What Counts as Physical Activity for Adults\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.cdc.gov/physical-activity-basics/adding-adults/what-counts.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eWhat Counts as Physical Activity for Adults\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：成人力量训练8—12次为一组、至少一组的参考；相对运动强度。。\u003c/p\u003e\n\u003cp\u003e本轮核对：2026-09-29；页面／文件日期：2023-12-06。\u003c/p\u003e\n\u003cp\u003e核对命题：成人力量训练8—12次为一组、至少一组的参考；相对运动强度。。仅核对这些命题，不代表认可页面全部陈述或整本书。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s163\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S163] USPSTF｜Osteoporosis to Prevent Fractures: Screening\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/osteoporosis-screening\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eOsteoporosis to Prevent Fractures: Screening\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：2025最终建议：女性65岁及以上、较年轻绝经后高风险者；男性普筛证据不足。。\u003c/p\u003e\n\u003cp\u003e本轮核对：2026-09-29；页面／文件日期：2025-01-14。\u003c/p\u003e\n\u003cp\u003e核对命题：2025最终建议：女性65岁及以上、较年轻绝经后高风险者；男性普筛证据不足。。仅核对这些命题，不代表认可页面全部陈述或整本书。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s164\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S164] USPSTF｜Cervical Cancer: Screening\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/cervical-cancer-screening\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eCervical Cancer: Screening\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：公开最终建议页标2018并提示更新中；宫颈筛查方法择一，停止条件非只看年龄。。\u003c/p\u003e\n\u003cp\u003e本轮核对：2026-09-29；页面／文件日期：2018-08-21（页面提示更新中）。\u003c/p\u003e\n\u003cp\u003e核对命题：公开最终建议页标2018并提示更新中；宫颈筛查方法择一，停止条件非只看年龄。。仅核对这些命题，不代表认可页面全部陈述或整本书。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s165\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S165] ASRM｜Fertility evaluation of infertile women: a committee opinion (2021)\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.asrm.org/practice-guidance/practice-committee-documents/fertility-evaluation-of-infertile-women-a-committee-opinion-2021/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eFertility evaluation of infertile women: a committee opinion (2021)\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：无其他指征时按年龄12个月或6个月未孕评估，40岁以上及明确风险更早，双方同步。。\u003c/p\u003e\n\u003cp\u003e本轮核对：2026-09-29；页面／文件日期：2021。\u003c/p\u003e\n\u003cp\u003e核对命题：无其他指征时按年龄12个月或6个月未孕评估，40岁以上及明确风险更早，双方同步。。仅核对这些命题，不代表认可页面全部陈述或整本书。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s166\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S166] CDC｜Testing for Cholesterol\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.cdc.gov/cholesterol/testing/index.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eTesting for Cholesterol\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：血脂无症状不能排除；多数健康成人4—6年复核为美国公众参考，高风险不同。。\u003c/p\u003e\n\u003cp\u003e本轮核对：2026-09-29；页面／文件日期：2024-05-15（正文尾另列05-14）。\u003c/p\u003e\n\u003cp\u003e核对命题：血脂无症状不能排除；多数健康成人4—6年复核为美国公众参考，高风险不同。。仅核对这些命题，不代表认可页面全部陈述或整本书。\u003c/p\u003e\n\u003chr/\u003e\n\u003ch2\u003e出版与使用记录\u003c/h2\u003e\n\u003cp\u003e正文保守计数120,280汉字；32卷；166个来源编号中160个在正文被引用；30组折叠标签配对。40汉字以上段落的完全相同文本检查未发现重复，不代表语义完全不重复。\u003c/p\u003e\n\u003cp\u003e日期定位器对四个示例出生日期分别从出生测试到百岁周年，共146,101个日期样例；另测试13个阶段边界和4种状态。测试的是日期路由，不是146,101天个人医疗方案。24小时示例、两周活动示例与矫正年龄算术另有校验记录。\u003c/p\u003e\n\u003cp\u003e本书的健康建议尚未经过全科、妇产、儿科、老年医学等独立临床团队逐条签审。地区服务表和个人医疗参数需另行确认。完整检查、逐项修订与命题核验记录随资料包提供。\u003c/p\u003e\n","sourceHash":"97bdef5c9f180a51a380cc643000ef9893797a1321a7ac5b479c746b393555c5"}</script>

,"subages":[[1,"12—15个月"],[2,"15—18个月"],[3,"18—21个月"],[4,"21—24个月"],[5,"24—27个月"],[6,"27—30个月"],[7,"30—33个月"],[8,"33—36个月"]],"id":4,"dayRef":{"ch":6,"anchor":"c06-s012"}},{"label":"3—5岁","title":"3—5岁，怎么玩、怎么学？","sub":"把游戏、表达和生活自理放进普通的一天。","ch":7,"cards":["pre-school-sleep","pre-school-game","pre-school-read","pre-school-talk","pre-school-help","pre-school-ready"],"faqs":["pre-school-social","pre-school-screen"],"day":[["早晨","早餐、洗漱和出门，留够如厕与准备时间。"],["白天","幼儿园或家庭游戏中，给足主动活动机会。"],["放学后","先看饥饿和疲劳，再自由玩或一起做件小事。"],["晚上","共读、刷牙、换衣，安静进入睡眠。"]],"subages":[],"id":5,"dayRef":{"ch":7,"anchor":"c07-s012"}},{"label":"6—11岁","title":"6—11岁，学习之外还要顾好什么？","sub":"睡觉、活动、吃饭、交朋友，以及遇到困难能开口。","ch":8,"cards":["school-sleep","school-move","school-homework","school-study","school-chore","school-online"],"faqs":["school-bully","school-return"],"day":[["出门前","早餐、如厕、用品齐全，不临时补讲知识。"],["学校里","饮水、如厕、活动和必要用药真正可及。"],["回家后","先恢复，再完成范围明确的作业和一个小家务。"],["睡前","准备次日用品，放下高压力讨论，按时休息。"]],"subages":[],"id":6,"dayRef":{"ch":26,"anchor":"c26-s009"}},{"label":"12—17岁","title":"12—17岁，怎么照顾身体，也学会自己决定？","sub":"睡够、会求助、能拒绝，再慢慢接过自己的生活。","ch":9,"cards":["teen-sleep","teen-work","teen-private","teen-no","teen-period","teen-future"],"faqs":["teen-low","teen-consent"],"day":[["起床后","用品、交通和主要任务准备好。"],["白天","学校任务与活动并行，身体不适及时报告。"],["放学后","先看疲惫与情绪，再安排可完成的学习。"],["晚上","留下私人时间，准备次日后结束学习和消息。"]],"subages":[],"id":7,"dayRef":{"ch":26,"anchor":"c26-s009"}},{"label":"18—29岁","title":"18—29岁，怎么把自己的生活过明白？","sub":"吃饭、工作、钱和关系，从自己能管好的一件事开始。","ch":10,"cards":["adult-sleep","young-food","adult-move","young-work","young-money","young-skill"],"faqs":["young-relationship","young-fail"],"day":[["起床后","吃饭、清洁、出门，确定今天一个主要交付。"],["工作时","集中任务与消息分开，允许起身和姿势变化。"],["下班后","按本周安排活动、吃饭或见人，不叠满所有目标。"],["睡前","把未完事项放好，准备次日，结束工作。"]],"subages":[],"id":8,"dayRef":{"ch":26,"anchor":"c26-s006"}},{"label":"30—44岁","title":"30—44岁，工作、家人和身体怎么兼顾？","sub":"时间不够时先改分工和承诺，不只要求自己再撑一下。","ch":11,"cards":["adult-sleep","mid-chore","adult-move","mid-focus","mid-grow","mid-fatigue"],"faqs":["mid-care","mid-report"],"day":[["早晨","确认今天不可移动的责任，以及谁实际接手。"],["工作时","保留主要交付，新任务明确替代关系。"],["晚间","按约交接照护，吃饭或活动，留一点自己的时间。"],["睡前","收尾而不是做完所有事，让明天能继续。"]],"subages":[],"id":9,"dayRef":{"ch":26,"anchor":"c26-s006"}},{"label":"45—59岁","title":"45—59岁，哪些变化值得认真处理？","sub":"查清持续不适，保住力量，也给下一阶段留选择。","ch":12,"cards":["later-change","adult-move","later-check","later-menopause","later-snore","later-future"],"faqs":["later-weight","later-parents"],"day":[["早晨","按治疗与日常需要安排，不额外堆一套抗衰仪式。"],["白天","工作、活动与姿势变化都保留实际时间。"],["有待办时","完成一个必要的预约、结果解释或资料更新。"],["晚上","保留恢复和关系空间，持续问题按计划评估。"]],"subages":[],"id":10,"dayRef":{"ch":26,"anchor":"c26-s006"}},{"label":"60—74岁","title":"60—74岁，怎么继续做喜欢的事？","sub":"能去哪里、想见谁、还想学什么，先从这些问题开始。","ch":13,"cards":["older-week","older-strength","older-home","older-med","older-food","older-learn"],"faqs":["older-trip","older-choice"],"day":[["起床后","按自己的节奏吃饭、清洁和用药。"],["白天","安排适合的活动或一件想参与的事。"],["外出时","留休息和返回余力，必要工具可用。"],["晚上","用品归位、夜间路线清楚，留舒适的休息。"]],"subages":[],"id":11,"dayRef":{"ch":13,"anchor":"c13-s001"}},{"label":"75—89岁","title":"75—89岁，怎样照顾得更舒服？","sub":"把吃饭、起身、用药和夜间照护，一件件安排清楚。","ch":14,"cards":["care-morning","care-transfer","care-swallow","care-med","care-night","care-choice"],"faqs":["care-confused","care-burnout"],"day":[["早晨","先听状态与意愿，再按计划起身、清洁和进食。"],["白天","护理分散进行，穿插本人喜欢的小活动。"],["换班时","交代实际做过什么、未做什么和下一步。"],["晚上","确认夜间求助和用品位置，减少无意义打扰。"]],"subages":[],"id":12,"dayRef":{"ch":14,"anchor":"c14-s022"}},{"label":"90岁及以后","title":"90岁以后，今天怎样过得舒服、有意思？","sub":"从本人想做的事开始，让必要帮助真正到位。","ch":15,"cards":["oldest-day","oldest-wish","oldest-visit","oldest-pain","oldest-treatment","oldest-record"],"faqs":["oldest-food","oldest-palliative"],"day":[["起床后","先照顾舒适和必要需要，不赶进度。"],["清醒有余力时","做一件本人想做的事，可以很短。"],["有人来访时","按本人愿意的方式见面，累了就结束。"],["晚上","遵循实际医疗计划，安排安静、可靠的照护。"]],"subages":[],"id":13,"dayRef":{"ch":26,"anchor":"c26-s011"}}],"cards":{"pre-folate":{"id":"pre-folate","cat":"备孕","q":"叶酸从什么时候开始吃？","answer":"一般风险人群每天400微克，至少在受精前1个月开始。","extra":"先看复合维生素里已经含多少，别把几种产品重复叠加。","steps":["准备怀孕时就核对叶酸，不等验孕阳性。","带上正在使用的产品标签，让医生或药师核对实际用量。"],"ch":2,"anchor":"c02-s000","link":"看叶酸与孕前准备","note":"有神经管缺陷相关妊娠史等高风险情况，需由医生另定方案。","src":"s03"},"pre-positive":{"id":"pre-positive","cat":"刚发现怀孕","q":"验孕阳性，接下来做什么？","answer":"记下末次月经、检测日期和症状，联系正规孕产服务。","extra":"把既往妊娠、慢病和正在用的药一起说明，由团队安排首次就诊。","steps":["把现有报告和药物清单放在一起。","问清何时面诊，以及等待期间出现什么症状需要提前联系。"],"ch":2,"anchor":"c02-s003","link":"看发现怀孕后的安排","note":"","src":null},"pre-med":{"id":"pre-med","cat":"用药","q":"怀孕了，原来的药要停吗？","answer":"先联系开药医生和产科，不自行停掉必要治疗。","extra":"处方药、偶尔吃的药、外用药和补充剂都要核对。","steps":["按真实用法记录名称、规格、频率。","问清哪些继续、哪些需调整、何时复查。"],"ch":2,"anchor":"c02-s003","link":"看孕期用药核对","note":"","src":null},"pre-food":{"id":"pre-food","cat":"吃饭","q":"恶心没胃口，怎么吃？","answer":"把一大顿拆成更能接受的几次，先保证能喝进去、吃进去。","extra":"气味、温度和质地不舒服，就换一种；让家人接手备餐和清洁。","steps":["找出自己能接受的几种食物与做法。","不要靠强迫进食或不明草药硬撑。"],"ch":2,"anchor":"c02-s005","link":"看孕吐时怎么安排","note":"持续喝不进水、尿量明显减少或头晕，及时联系医疗人员。","src":null},"pre-pet":{"id":"pre-pet","cat":"家里养猫","q":"家里有猫，先改哪些习惯？","answer":"请别人处理猫砂，肉类做熟，园艺和接触猫粪后认真洗手。","extra":"风险要看具体暴露，不把摸过猫直接当作感染。","steps":["必须自己清理猫砂时戴手套，之后洗手。","不喂宠物生肉；检查是否需要检测时，向产科说明实际接触。"],"ch":2,"anchor":"c02-s008","link":"看宠物与食物注意事项","note":"","src":"s42"},"pre-partner":{"id":"pre-partner","cat":"家人能做什么","q":"伴侣怎么帮，才是真帮忙？","answer":"直接接手采购、做饭、清洁或预约交通中的一整件事。","extra":"自己记得补货和收尾，别让她一边休息一边提醒。","steps":["问今天最难受、最费力的是哪件事。","约定谁负责，不把“有需要叫我”当作已经分担。"],"ch":2,"anchor":"c02-s007","link":"看家务怎么分担","note":"","src":null},"pre-pain":{"id":"pre-pain","cat":"身体不适","q":"早孕肚子疼，什么情况不能等？","answer":"单侧下腹痛、肩尖痛，或伴头晕、出血，需及时医疗评估。","extra":"严重疼痛、昏厥时立即求助，不等下次产检。","steps":["联系服务时说明已验孕阳性、疼痛位置和开始时间。","试纸阳性不能确认妊娠位置。"],"ch":1,"anchor":"c01-s002","link":"看孕期求助提示","note":"严重疼痛或昏厥时，立即联系当地急救服务。","src":"s27"},"pre-search":{"id":"pre-search","cat":"焦虑","q":"越查越害怕，怎么办？","answer":"把担心写成几个具体问题，集中问负责的医护。","extra":"检查前问清这次要回答什么，检查后记下下一步。","steps":["暂停反复比较试纸照片。","请一个能实际帮忙的人陪同或记录。"],"ch":2,"anchor":"c02-s009","link":"看早孕焦虑与支持","note":"","src":null},"preg-check":{"id":"preg-check","cat":"产检","q":"下次产检，先确认哪几件事？","answer":"日期、地点、准备要求、结果由谁解释，一起确认。","extra":"前一次的报告还没解释清楚，就把它列在这次的问题里。","steps":["把请假和交通算进预约。","有新症状时先联系产科，不为了等齐问题拖到预约日。"],"ch":3,"anchor":"c03-s001","link":"看产检怎么准备","note":"","src":null},"preg-movement":{"id":"preg-movement","cat":"胎动","q":"胎动明显少了，能等明天吗？","answer":"及时联系产科，不用家用多普勒听到心跳来代替评估。","extra":"关注自己已经熟悉的活动模式，具体观察方法问负责团队。","steps":["保存产科的日间和夜间联系方法。","说明从什么时候开始改变，以及伴随的不适。"],"ch":3,"anchor":"c03-s002","link":"看胎动变化怎么求助","note":"明显减少或改变时就联系，不等下一次日历提醒。","src":"s10"},"preg-bed":{"id":"preg-bed","cat":"婴儿睡觉","q":"婴儿床先准备什么？","answer":"先准备坚实、平坦、独立的睡眠表面，不靠枕头和床围装饰。","extra":"让每位照护者都实际布置一次，知道睡觉时床上该留下什么。","steps":["按产品说明核对尺寸和使用条件。","安全睡眠的详细要求在新生儿章节。"],"ch":4,"anchor":"c04-s002","link":"看婴儿怎么安全睡觉","note":"","src":"s06"},"preg-painrelief":{"id":"preg-painrelief","cat":"分娩","q":"怕生的时候疼，提前问什么？","answer":"问清医院有哪些镇痛方式、何时能用、效果不足怎么办。","extra":"可以写下偏好，也可以在产程中改变主意。","steps":["有特殊病史时提前告知。","陪伴者负责帮助表达，不替本人决定必须忍耐。"],"ch":3,"anchor":"c03-s003","link":"看镇痛与分娩准备","note":"","src":null},"preg-home":{"id":"preg-home","cat":"出院后","q":"回家第一周，谁做饭、谁洗奶瓶？","answer":"把餐食、用品清洗、来访和夜间照护分别交给明确的人。","extra":"产妇的吃饭、伤口、用药和复查，单独列出来。","steps":["婴儿和产妇各有一份需要跟进的事项。","接手的人要能实际做，不只是答应“到时帮忙”。"],"ch":31,"anchor":"c31-s004","link":"看母婴离院清单","note":"","src":null},"preg-route":{"id":"preg-route","cat":"去医院","q":"半夜要去医院，怎么不慌？","answer":"把交通、医院入口、证件和家里其他人的照护安排好。","extra":"至少有一位备用联系人知道资料和钥匙在哪。","steps":["走一遍拿资料、出门、到医院的过程。","破水、出血、胎动变化等按产科给出的联系规则处理。"],"ch":3,"anchor":"c03-s004","link":"看临产联系与出行","note":"","src":null},"preg-birth":{"id":"preg-birth","cat":"分娩选择","q":"分娩方式跟计划不一样怎么办？","answer":"先问为什么要改变、有哪些选项，再按实际情况决定。","extra":"镇痛、助产或剖宫产不是“坚持够不够”的考试。","steps":["条件允许时，请团队解释目的与主要风险。","紧急情况先接受救治，稳定后补充了解。"],"ch":3,"anchor":"c03-s005","link":"看分娩当日的沟通","note":"","src":null},"preg-after":{"id":"preg-after","cat":"产后","q":"生完孩子，总觉得自己撑不住怎么办？","answer":"告诉医护和能帮忙的人，把吃饭、睡觉、疼痛和情绪都说出来。","extra":"请别人真正接手一段照护，不只收到一句“多休息”。","steps":["为产妇安排独立的复查和支持。","家务与来访可以减少，必要照护安排替班。"],"ch":3,"anchor":"c03-s006","link":"看产后怎么恢复","note":"出现幻觉、严重混乱或伤害自己、婴儿的想法，需要立即获得帮助。","src":null},"new-sleep":{"id":"new-sleep","cat":"睡觉","q":"宝宝睡觉，床上应该放什么？","answer":"每次仰卧入睡，独立的平坦床面上只留合适床单。","extra":"不放枕头、床围、玩具、定位器、松散被褥或加重用品。","steps":["同室不同床，别抱着宝宝在沙发上睡着。","出现翻身尝试就停用束缚式襁褓。"],"ch":4,"anchor":"c04-s002","link":"看完整的安全睡眠要求","note":"","src":"s06"},"new-feed":{"id":"new-feed","cat":"喂奶","q":"怎么知道有没有真正吃进去？","answer":"看整次喂养、吞咽、排泄和体重趋势，不只看吃了几分钟。","extra":"请医护看一次含接或瓶喂；叫醒喂奶与间隔按宝宝的具体计划。","steps":["嗜睡无力不能当作“不饿”。","交接时说清上次喂养与需要跟进的异常。"],"ch":4,"anchor":"c04-s001","link":"看每次喂养怎么观察","note":"明显拒奶、难唤醒、呼吸费力或发青时，立即求助。","src":null},"new-formula":{"id":"new-formula","cat":"奶粉","q":"冲奶最容易在哪一步出错？","answer":"先准确量水，再加规定粉量，不冲浓、不冲稀。","extra":"按产品与卫生要求准备；粉状配方并非无菌。","steps":["核对宝宝年龄、风险与产品要求。","喝剩的奶按安全要求丢弃，不与新奶混合，也不用微波炉加热。"],"ch":4,"anchor":"c04-s008","link":"看冲调、保存与丢弃要求","note":"","src":"s13"},"new-check":{"id":"new-check","cat":"回家前","q":"离院时，必须问清什么？","answer":"什么时候复查、哪些结果还没出、半夜有问题找谁。","extra":"药物和维生素要写清产品、浓度、单位与用法。","steps":["婴儿和产妇分开核对随访。","另一位照护者复述一遍，让医护纠正。"],"ch":31,"anchor":"c31-s004","link":"打开离院清单","note":"","src":null},"new-play":{"id":"new-play","cat":"清醒时","q":"这么小，要不要“早教”？","answer":"清醒、舒服时看着宝宝说话，再停下来等反应。","extra":"疲倦、看开或烦躁就减少刺激，不把每次醒来都排成课程。","steps":["短时清醒俯卧须有人持续看护。","趴着睡着时，转回安全睡眠安排。"],"ch":4,"anchor":"c04-s005","link":"看清醒互动与俯卧","note":"","src":null},"new-shift":{"id":"new-shift","cat":"大人休息","q":"怎么换人带，才真的能休息？","answer":"接班的人从准备、照护到安全放回床上，完整接手一轮。","extra":"交代上次喂养、排泄、异常和下一件必须做的事。","steps":["用一份共享记录，避免重复给药。","主照护者能离开吃饭或休息，才算接上了。"],"ch":4,"anchor":"c04-s004","link":"看第一周的照护与交接","note":"","src":null},"new-cry":{"id":"new-cry","cat":"哭闹","q":"哭得大人快崩溃了，先怎么办？","answer":"先将宝宝仰卧放回安全床面，短暂退开冷静，并联系可靠成人接手。","extra":"及时回看；不要摇晃、抛接或击打。","steps":["先排查饥饿、尿布、温度和异常状态。","有疾病信号时求医，不只继续尝试安抚。"],"ch":4,"anchor":"c04-s009","link":"看哭闹时怎么处理","note":"","src":"s52"},"new-fever":{"id":"new-fever","cat":"发热","q":"未满3个月发热，能先在家等吗？","answer":"测得体温达到38℃，应立即联系医疗服务获得及时评估。","extra":"看起来明显生病时，不用“可能测错”作为等待理由。","steps":["说明日龄、测温方法、读数和吃奶反应。","难唤醒、呼吸费力或发青时，立即求助。"],"ch":1,"anchor":"c01-s002","link":"看婴儿求助提示","note":"不要先在家反复退热观察后才联系。","src":"s29"},"inf-sleep":{"id":"inf-sleep","cat":"睡觉","q":"宝宝会翻身了，睡法要改吗？","answer":"仍以仰卧开始睡眠；一有翻身尝试就停止束缚式襁褓。","extra":"能够自行双向翻身后，不必整夜反复翻回，但床面仍要清空。","steps":["不用枕头、定位器帮宝宝固定姿势。","特殊医学睡姿须由治疗团队明确指示。"],"ch":4,"anchor":"c04-s002","link":"看翻身后的睡眠要求","note":"","src":"s40"},"inf-solids":{"id":"inf-solids","cat":"辅食","q":"什么时候开始吃辅食？","answer":"一般约6个月开始，还要看头颈、坐姿、吞咽与健康准备。","extra":"先少量尝试适合质地，奶仍是重要营养来源。","steps":["准备稳定座位和能专心看护的成人。","早产或喂养困难时先向团队确认。"],"ch":5,"anchor":"c05-s005","link":"看辅食开始前的准备","note":"","src":"s04"},"inf-food":{"id":"inf-food","cat":"辅食吃什么","q":"辅食一直是粥和水果，可以吗？","answer":"逐步加入适合的富铁食物，不长期只给稀粥、水果和汤。","extra":"质地跟着能力变化，既不一直只吃细泥，也不照搬同龄视频。","steps":["反复呛咳或吞咽困难时寻求评估。","过敏原引入按个体风险，用安全形态尝试。"],"ch":5,"anchor":"c05-s006","link":"看辅食营养与过敏原","note":"","src":null},"inf-play":{"id":"inf-play","cat":"玩耍","q":"每天怎么陪宝宝玩？","answer":"在安全地面放少量适龄物品，让宝宝自己看、伸手、拿取。","extra":"成人说一句、等一等、再回应，不一直替宝宝完成。","steps":["困倦和烦躁时停下来。","换一个位置或容器就有新玩法，不需要不断买玩具。"],"ch":5,"anchor":"c05-s003","link":"看地面游戏怎么做","note":"","src":null},"inf-teeth":{"id":"inf-teeth","cat":"长牙","q":"第一颗牙出来，要开始刷吗？","answer":"要开始。用婴儿牙刷和薄薄一抹含氟牙膏，由大人帮助清洁。","extra":"同时安排早期牙科接触，不等牙痛才第一次去。","steps":["用量和浓度核对牙科建议。","先让宝宝熟悉，逐步把各个牙面刷到。"],"ch":19,"anchor":"c19-s002","link":"看第一颗牙后的护理","note":"","src":"s61"},"inf-home":{"id":"inf-home","cat":"会移动了","q":"开始爬、扶站，家里先改哪里？","answer":"固定可能拉倒的家具，检查窗边、楼梯、电线和小物件。","extra":"从宝宝能到达的高度看一遍，不只站着看是否整齐。","steps":["药片、电池、磁铁和硬币放到无法取得的位置。","喊“不许碰”不能代替实际保护。"],"ch":5,"anchor":"c05-s008","link":"看移动后的居家保护","note":"","src":null},"inf-choke":{"id":"inf-choke","cat":"吃东西","q":"什么食物形状容易噎住？","answer":"整颗葡萄、整粒坚果、硬糖、圆片香肠和大团坚果酱都要防范。","extra":"按年龄与能力安全处理或不提供，孩子坐稳，大人全程专心看护。","steps":["形状、硬度、黏性都重要，不是切小就安全。","不要让孩子边走边吃。"],"ch":5,"anchor":"c05-s012","link":"看完整防噎要求","note":"","src":"s15"},"inf-development":{"id":"inf-development","cat":"发育","q":"有些动作比别家晚，要不要练猛一点？","answer":"不加倍训练；记录具体情况，带给儿科或儿童保健人员判断。","extra":"看连续变化和实际参与，不拿一次表演排名。","steps":["早产儿发育参照按专业指导使用矫正年龄。","持续担忧、明显不对称或已有能力消失时，及时提出。"],"ch":5,"anchor":"c05-s000","link":"看发育观察与筛查","note":"已经会的能力消失，不等下个月再看。","src":"s54"},"tod-sleep":{"id":"tod-sleep","cat":"睡觉","q":"一天睡多久才够？","answer":"一般参考每天11—14小时，午睡也算在内。","extra":"先给足睡眠时间，再保持较稳定的起床、午睡和睡前顺序。","steps":["睡前结束活跃游戏，刷牙、换衣，再安静陪伴。","偶尔作息打乱后回到常规，不用惩罚性补偿。"],"ch":16,"anchor":"c16-s001","link":"看各年龄的睡眠时间","note":"","src":"s05"},"tod-eat":{"id":"tod-eat","cat":"吃饭","q":"不肯吃饭，要不要追着喂？","answer":"让孩子坐着吃，不追着喂，也不拿手机哄着塞。","extra":"按平时的饭点准备合适的食物。先给小份，允许自己用勺；吃饱了就停。","steps":["成人负责食物、场景和安全，别拿吃完多少跟别家比较。","持续吃得少、生长异常或进餐很痛苦时，找儿科或喂养支持。"],"ch":6,"anchor":"c06-s002","link":"看不肯吃饭时的做法","note":"总是吃得很少，或生长出现异常，就找儿科或喂养专业人员评估。","src":null},"tod-move":{"id":"tod-move","cat":"活动","q":"每天要玩多久、动多久？","answer":"各种身体活动全天累计至少180分钟，可以分很多次。","extra":"走动、滚球、追逐和主动游戏都可以；不是连续上3小时训练课。","steps":["在适合天气和场地里留出户外与地面活动。","减少长时间被固定在推车或座椅里的清醒时段。"],"ch":18,"anchor":"c18-s000","link":"看活动量与适龄玩法","note":"疾病或行动受限时，按能力和专业建议调整。","src":"s62"},"tod-teeth":{"id":"tod-teeth","cat":"刷牙","q":"还这么小，牙要怎么刷？","answer":"每天至少刷2次，其中一次在睡前；大人帮助把牙面刷到。","extra":"3岁以下用薄薄一抹、约米粒大小的含氟牙膏，不挤满牙刷。","steps":["让孩子先熟悉牙刷，再由大人补刷。","持续疼痛或强烈抗拒时先查原因，不用压制代替解决。"],"ch":19,"anchor":"c19-s002","link":"看牙膏用量和刷牙方法","note":"","src":"s61"},"tod-play":{"id":"tod-play","cat":"陪着玩","q":"在家陪孩子玩什么？","answer":"滚球、把积木装进盒子再倒出来、一起翻图画书，都能玩。","extra":"选安全、适龄的材料，让孩子自己试。大人只在卡住时帮一点，不必一直换新玩具。","steps":["物品不要有可脱落、可吞咽的小部件。","先示范一次，再等孩子尝试；累了就停。"],"ch":6,"anchor":"c06-s010","link":"看简单材料的玩法","note":"","src":null},"tod-no":{"id":"tod-no","cat":"说“不要”","q":"什么都说“不要”，怎么回应？","answer":"穿衣服时，可以问：“穿红衣服，还是蓝衣服？”","extra":"两个选项都要是大人能接受的。允许他做小选择；碰到危险，直接平静地阻止。","steps":["离开游戏前先预告，让孩子有过渡。","哭闹时先保护双方，等平静后再说具体办法。"],"ch":6,"anchor":"c06-s003","link":"看哭闹和拒绝时怎么说","note":"","src":null},"tod-toilet":{"id":"tod-toilet","cat":"尿布","q":"几岁开始脱尿布？","answer":"先看能否理解提示、表达需要，以及是否愿意尝试，不按生日硬练。","extra":"多数孩子在2—3岁逐渐具备条件；白天和夜间可以不同步。","steps":["先熟悉便盆和稳定的脚部支撑，不久坐等结果。","弄湿就换衣；大便痛、憋便或尿痛时先处理原因。"],"ch":6,"anchor":"c06-s005","link":"看如厕准备和做法","note":"","src":"s57"},"tod-regress":{"id":"tod-regress","cat":"发育","q":"说话或动作突然退步，要继续等吗？","answer":"已经会的表达或动作消失，及时向儿科或儿童保健人员提出。","extra":"记清原来会什么、何时改变、在哪些场景出现，不靠加课代替评估。","steps":["持续交流担忧也可以提前咨询。","筛查、诊断和实际获得支持，要分别跟进。"],"ch":31,"anchor":"c31-s006","link":"看发育担忧怎么处理","note":"有退步就提出，不等待下一次生日或年度安排。","src":"s152"},"pre-school-sleep":{"id":"pre-school-sleep","cat":"睡觉","q":"幼儿园孩子一天睡多久？","answer":"一般参考10—13小时，包括午睡。","extra":"放学后的课程、通勤和睡前活动，别挤掉实际睡眠时间。","steps":["保持简短、可重复的睡前顺序。","睡不好且影响白天状态时，向医疗人员说明。"],"ch":16,"anchor":"c16-s001","link":"看分龄睡眠时间","note":"","src":"s05"},"pre-school-game":{"id":"pre-school-game","cat":"玩什么","q":"在家玩什么，不用报班也能开始？","answer":"滚球、跨低障碍、搭路、画画、揉捏安全材料，都可以。","extra":"一次只加一个难度，先让孩子愿意参与、自己尝试。","steps":["大人管好工具与材料安全，不替孩子做完。","作品可以不漂亮，也可以不发布。"],"ch":7,"anchor":"c07-s002","link":"看运动与手部游戏","note":"","src":null},"pre-school-read":{"id":"pre-school-read","cat":"读书","q":"共读时，每一页都要提问吗？","answer":"先把故事读完整，孩子想听同一本也可以。","extra":"聊角色做了什么、想做什么，再回到图画或文字找依据。","steps":["允许孩子讲不同的理解。","遇到不懂先解释词和背景，不立刻延长阅读时间。"],"ch":7,"anchor":"c07-s007","link":"看共读的具体方法","note":"","src":null},"pre-school-talk":{"id":"pre-school-talk","cat":"表达","q":"每天问“今天学了什么”，只得到“不知道”？","answer":"换成“今天有什么有趣的事？”然后先听完。","extra":"少一点连续追问，也讲一件自己今天发生的小事。","steps":["练习说需要帮助、哪里不舒服、不想这样玩。","说错时自然示范，不让每句话都重说。"],"ch":7,"anchor":"c07-s001","link":"看怎么跟孩子聊天","note":"","src":null},"pre-school-help":{"id":"pre-school-help","cat":"自理","q":"让孩子帮什么忙比较合适？","answer":"分餐具、放书包、整理自己的用品，从一小件完整的事开始。","extra":"物品放得到、步骤够清楚，做慢一点也有尝试空间。","steps":["刀具、热源和电器仍按能力与看护安排。","收尾是任务一部分，大人提供必要帮助。"],"ch":7,"anchor":"c07-s005","link":"看生活中的数量与顺序","note":"","src":null},"pre-school-ready":{"id":"pre-school-ready","cat":"上学准备","q":"上小学前，先练什么？","answer":"会表达不舒服、会找厕所和求助、知道接送安排，比多背几篇课文更急用。","extra":"和孩子走一遍通学路线，熟悉放包、喝水和吃饭。","steps":["记住规则不代表可以独自应对交通。","有用药、感官或行动需要时，提前跟学校落实。"],"ch":7,"anchor":"c07-s006","link":"看入学前的实际准备","note":"","src":null},"pre-school-social":{"id":"pre-school-social","cat":"同伴","q":"孩子说“没人跟我玩”，先怎么办？","answer":"先问发生了什么，分清一次没加入和持续排斥。","extra":"可以练一句加入游戏的话，也允许另选活动。","steps":["不要立刻要求送礼或道歉换取接纳。","持续伤害需要成人保护与机构介入。"],"ch":7,"anchor":"c07-s009","link":"看同伴关系怎么处理","note":"","src":null},"pre-school-screen":{"id":"pre-school-screen","cat":"屏幕","q":"吃饭和睡前总要看视频，怎么改？","answer":"先把这两个场景的自动播放停下来，大人也把手机放下。","extra":"用一起吃饭、看图书或安静陪伴代替，不用屏幕继续塞食。","steps":["先约定能执行的规则。","偶尔被旅行打乱，之后回到常规即可。"],"ch":6,"anchor":"c06-s011","link":"看屏幕与睡前安排","note":"","src":null},"school-sleep":{"id":"school-sleep","cat":"睡觉","q":"小学生要睡多久？","answer":"一般参考每天9—12小时。","extra":"把起床、通勤和作业一起算，不让写完无限作业成为睡觉条件。","steps":["前晚准备好书包与用品。","作业长期拖到很晚时，记录卡在哪一类，再与老师讨论。"],"ch":16,"anchor":"c16-s001","link":"看学龄睡眠时间","note":"","src":"s05"},"school-move":{"id":"school-move","cat":"运动","q":"体育课之外，还要安排活动吗？","answer":"一般目标每天至少60分钟中高强度活动，游戏和安全出行也可计入。","extra":"球类、舞蹈或游泳等选喜欢的，一周也包含增强肌肉与骨骼的活动。","steps":["先了解学校实际有多少活动。","有疾病或残障时按能力适配，不强行完成统一动作。"],"ch":8,"anchor":"c08-s009","link":"看学龄活动与保护","note":"","src":"s32"},"school-homework":{"id":"school-homework","cat":"作业","q":"作业总写不完，是不认真吗？","answer":"先找卡点：没看懂、不会做、写得疼，还是任务确实太多。","extra":"抽几天记任务类型和用时，带给老师讨论，不先加监督和练习量。","steps":["选一个代表性错误查原因。","看不清、听漏或持续读写困难时，寻求适当评估。"],"ch":8,"anchor":"c08-s008","link":"看学习困难怎么分清","note":"","src":null},"school-study":{"id":"school-study","cat":"学习方法","q":"怎么知道是真的学会，不是看熟了？","answer":"合上资料，用自己的话讲一遍，再做一个变化后的问题。","extra":"想不起来就回去补，不靠反复抄答案装作已经掌握。","steps":["一次先修一类错误。","把反馈用在下一次练习，而不是只收集分数。"],"ch":23,"anchor":"c23-s003","link":"看主动回忆怎么练","note":"","src":null},"school-chore":{"id":"school-chore","cat":"家务","q":"小学生可以独立做什么？","answer":"先完整负责学习用品，逐渐增加衣物整理或简单冷餐。","extra":"成人给必要工具和检查，不因慢就全包，也不让孩子承担成人缺位。","steps":["危险工具的使用看实际能力和看护。","任务说清结果，而不只说“你要自觉”。"],"ch":8,"anchor":"c08-s012","link":"看家务怎么安排","note":"","src":null},"school-online":{"id":"school-online","cat":"上网","q":"第一次独立用手机，先约定什么？","answer":"做什么、何时结束、能否付费、遇到不舒服的内容找谁。","extra":"真实住址、学校与日程不要拼在一起公开。","steps":["有人索要秘密、钱、私密图像或资料时，先停下求助。","大人先处理安全，不因小规则被打破拒绝帮助。"],"ch":8,"anchor":"c08-s011","link":"看儿童上网保护","note":"","src":null},"school-bully":{"id":"school-bully","cat":"被欺负","q":"孩子说被欺负，第一句说什么？","answer":"“谢谢你告诉我，求助不是你的错。”先保证安全。","extra":"记录具体经过，联系学校责任人，问清保护措施和复核时间。","steps":["不让孩子独自反复回到危险场景。","分清普通争执与持续、权力不对等的伤害。"],"ch":8,"anchor":"c08-s010","link":"看欺凌与普通冲突","note":"","src":null},"school-return":{"id":"school-return","cat":"放学后","q":"刚回家就催作业，好不好？","answer":"先给吃饭、喝水、活动或安静恢复的过渡，再排任务。","extra":"学校已经占用了一天，不把放学后的每分钟都填成课程。","steps":["先确认知道做什么，再确认会不会做。","留一点不问成绩的交流。"],"ch":8,"anchor":"c08-s001","link":"看放学后的安排","note":"","src":null},"teen-sleep":{"id":"teen-sleep","cat":"睡觉","q":"青春期到底要睡多久？","answer":"12岁参考9—12小时；13—17岁参考8—10小时。","extra":"从必须起床的时间倒推，把作业、通勤和睡前准备一起算。","steps":["长期机会不够时，先协商任务量。","睡得很晚、一直难以匹配学校时间时，寻求节律相关评估。"],"ch":16,"anchor":"c16-s001","link":"看分龄睡眠时间","note":"","src":"s05"},"teen-work":{"id":"teen-work","cat":"学业","q":"考试一多，怎么排今天的事？","answer":"分成必须完成、可以推进、可以不做，别把三栏都当必须。","extra":"卡在概念、回忆、审题还是紧张，处理办法不同。","steps":["估算实际时间，把吃饭和睡觉先放进去。","明显疲惫或持续失眠时，先处理状态，不靠加课硬撑。"],"ch":9,"anchor":"c09-s004","link":"看考试与恢复怎么安排","note":"","src":null},"teen-private":{"id":"teen-private","cat":"隐私","q":"想要私人空间，怎么跟家里说？","answer":"把请求说具体：进房先敲门、照片先问、哪些事情自己处理。","extra":"同时说清遇到身体、学习或人身安全问题，可以找谁帮忙。","steps":["监护范围、理由与调整条件一起讨论。","涉及威胁或胁迫的秘密，不需要独自保守。"],"ch":9,"anchor":"c09-s001","link":"看隐私与求助","note":"","src":null},"teen-no":{"id":"teen-no","cat":"拒绝","q":"朋友起哄做危险的事，怎么退出？","answer":"一句“我不做，我要走了”就够，不必在现场赢辩论。","extra":"提前准备回程和接应方式，不坐不清醒的人驾驶的车。","steps":["可以约定一句家庭求助词，先离开再讨论。","持续因拒绝而受威胁，重新评估关系并求助。"],"ch":9,"anchor":"c09-s003","link":"看同伴压力下怎么离开","note":"","src":null},"teen-period":{"id":"teen-period","cat":"身体变化","q":"月经痛得影响上学，要忍吗？","answer":"不必硬忍，向医生说明疼痛、出血和实际影响。","extra":"日常备好用品，记录开始时间与明显异常，不需要追踪每个感觉。","steps":["疼痛严重、显著加重或反复影响生活时安排评估。","身体变化不成为取笑或公开评论的理由。"],"ch":9,"anchor":"c09-s008","link":"看青春期身体护理","note":"","src":null},"teen-future":{"id":"teen-future","cat":"未来","q":"不知道选什么专业，怎么试？","answer":"找从业者问普通一天，再做一个安全的小任务。","extra":"看看实际做什么、什么最枯燥、需要哪些能力，不只看头衔和收入。","steps":["保留不喜欢的发现，探索不必马上定终身。","拒绝以锻炼为名的危险劳动或无限免费替岗。"],"ch":9,"anchor":"c09-s005","link":"看职业探索怎么开始","note":"","src":null},"teen-low":{"id":"teen-low","cat":"情绪","q":"成绩不错，但一直低落，也值得求助吗？","answer":"值得。兴趣下降、退缩、睡眠饮食变化和生活受限，都应被认真听见。","extra":"可以先找可信成人、学校或专业服务，说具体变化。","steps":["不等到完全不能生活才求助。","支持者先听，不用“条件这么好”反驳感受。"],"ch":9,"anchor":"c09-s010","link":"看哪些变化需要帮助","note":"有立即伤害自己的危险时，马上联系当地急救或危机服务。","src":null},"teen-consent":{"id":"teen-consent","cat":"身体边界","q":"答应过，就不能反悔了吗？","answer":"可以改变主意。别人撤回同意时，也要先停下来。","extra":"同意需要自愿、清楚、具体，不用沉默或压力代替。","steps":["合照、借物、拥抱也从询问和停止开始。","未成年性接触和影像还要遵守当地保护与法律要求。"],"ch":9,"anchor":"c09-s002","link":"看同意与身体边界","note":"","src":null},"adult-sleep":{"id":"adult-sleep","cat":"睡觉","q":"每天少睡一点，能靠周末补吗？","answer":"先给普通工作日留足睡眠机会；18—60岁一般参考至少7小时。","extra":"如果日程只留5小时，先删任务或改安排，别先买助眠产品。","steps":["把通勤、清洁和工作收尾都算进去。","睡够仍很困，或有喘憋、呼吸暂停等表现时，寻求评估。"],"ch":16,"anchor":"c16-s000","link":"看睡不够、睡不着怎么区分","note":"","src":"s05"},"adult-move":{"id":"adult-move","cat":"运动","q":"平时上班，一周练多少合适？","answer":"一般成人目标：至少150分钟中等强度有氧，加至少2天主要肌群力量活动。","extra":"也可采用75分钟高强度或等效组合；可以分段，新手不必第一周做满。","steps":["先选能持续参与的形式，学会动作与器械使用。","根据恢复逐步增加，不用次日双倍补练。"],"ch":18,"anchor":"c18-s002","link":"看运动量、起步与恢复","note":"有相关疾病、疼痛或异常症状时，按个体情况调整或先评估。","src":"s31"},"young-food":{"id":"young-food","cat":"吃饭","q":"下班很累，不想做饭怎么办？","answer":"准备一套低精力时也能取得的备用餐，不靠每天临时决定。","extra":"一餐先找主食、蛋白来源和蔬果，再考虑储存、加热与清洁。","steps":["按实际在家吃的天数采购。","没有厨房就选安全、可负担的餐食，不在不允许的房间硬搭设备。"],"ch":10,"anchor":"c10-s007","link":"看独居吃饭怎么安排","note":"","src":null},"young-work":{"id":"young-work","cat":"工作","q":"拿到一个模糊任务，先问什么？","answer":"给谁用、什么时候交、交什么、什么算做好。","extra":"先做小样确认方向，再投入整段时间。","steps":["把个人贡献、结果与改进留成记录。","展示作品时不泄露客户或雇主机密。"],"ch":10,"anchor":"c10-s002","link":"看新任务该怎么问清楚","note":"","src":null},"young-money":{"id":"young-money","cat":"钱","q":"存多少钱，才不容易被意外打断？","answer":"先算收入中断后，住房、吃饭、医疗和债务会缺多少。","extra":"储备按收入波动与责任决定，不照搬一个所有人相同的月数。","steps":["未确认的亲友帮助不当成现有资金。","高风险承诺先看最坏损失是否伤到基本生活。"],"ch":24,"anchor":"c24-s009","link":"看钱和生活储备","note":"","src":null},"young-skill":{"id":"young-skill","cat":"学东西","q":"想学很多，怎么真正开始一项？","answer":"挑一个能实际做出来的小结果，先试做，再补不会的部分。","extra":"例如完成一个小脚本或一段清楚的说明，而不是先收藏全部课程。","steps":["练习需要反馈，用一次结果指导下一次。","不必把每个兴趣都变成收入。"],"ch":23,"anchor":"c23-s000","link":"看学习目标怎么定","note":"","src":null},"young-relationship":{"id":"young-relationship","cat":"关系","q":"第一次一起住，哪些事要说清楚？","answer":"家务、钱、访客、私人时间、宠物和争执怎么处理。","extra":"说成能执行的行为，不只说“大家互相体谅”。","steps":["钱是赠与、借款还是共同消费，要共同理解。","对重大承诺了解退出成本和实际负担。"],"ch":10,"anchor":"c10-s004","link":"看共同生活与长期承诺","note":"","src":null},"young-fail":{"id":"young-fail","cat":"失败","q":"项目失败或失业，先处理什么？","answer":"先稳住住房、食物、必要治疗和紧迫账单，再决定下一步。","extra":"把找工作拆成资料、联系、申请、面试和技能，不只反复刷新信息。","steps":["核对实际余额和可用保障。","大转向先做可承受试验，不靠借更多钱证明自己。"],"ch":28,"anchor":"c28-s007","link":"看收入中断后的安排","note":"","src":null},"mid-chore":{"id":"mid-chore","cat":"家务","q":"为什么别人“帮了忙”，你还是很累？","answer":"因为你还在发现、安排和提醒。把一整件事交出去，包括补货与收尾。","extra":"约好做成什么样，接手的人自己记得，不由你继续后台指挥。","steps":["先挑一件每周反复发生的事。","安全要求说清，个人做法差异可以容许。"],"ch":11,"anchor":"c11-s001","link":"看家务怎样完整交接","note":"","src":null},"mid-focus":{"id":"mid-focus","cat":"工作","q":"一整天都在回消息，自己的事做不完怎么办？","answer":"把普通消息集中处理，新任务进来时问清要替代哪一件。","extra":"先关掉不必要的消息提醒，减少重复会议，不只要求自己处理得更快。","steps":["说明谁最终确认结果，以及哪些事真紧急。","收工时记下停在哪、下一步是什么，再关闭非必要提醒。"],"ch":11,"anchor":"c11-s002","link":"看工作结束与消息安排","note":"","src":null},"mid-grow":{"id":"mid-grow","cat":"学习","q":"忙成这样，还怎么积累自己的能力？","answer":"挑一件以后还用得上的事做下去，不同时开十个新目标。","extra":"比如把重复工作做成一份可用的模板，或把刚学的方法用进一个真实项目。","steps":["把通勤、家务与照护一起算进可用时间。","新目标需要替代一部分旧安排，不从睡眠里借。"],"ch":31,"anchor":"c31-s019","link":"看忙的时候怎么继续学习","note":"","src":null},"mid-fatigue":{"id":"mid-fatigue","cat":"身体","q":"总觉得累，能直接归为“年纪到了”吗？","answer":"不能。记录开始时间、持续情况、相关用药和影响了什么。","extra":"睡眠、负担和身体原因都要考虑，持续或进展的问题安排评估。","steps":["说清是偶尔疲惫，还是平常任务明显变难。","不要靠新补剂掩盖需要解释的变化。"],"ch":11,"anchor":"c11-s004","link":"看持续变化怎样就医","note":"","src":null},"mid-care":{"id":"mid-care","cat":"照护","q":"孩子和父母都要照顾，怎么排？","answer":"先画必须有人在场的时段，明确谁接班，别只算全家总小时数。","extra":"夜间被打断和无法离开的时间都是真负担。","steps":["替班者要能独立完成需要的操作。","人手不够时减少非必要事，并寻求可用支持。"],"ch":31,"anchor":"c31-s023","link":"看两位照护者怎么排班","note":"","src":null},"mid-report":{"id":"mid-report","cat":"看病","q":"体检做完，事情就结束了吗？","answer":"拿到报告、得到解释、明确下一步，才算这次事情接上了。","extra":"未回报或未解释的结果，留一个负责人和真实跟进时间。","steps":["把筛查、诊断和长期监测分开。","出现新症状不等下一次年度体检。"],"ch":20,"anchor":"c20-s001","link":"看检查结果怎么跟进","note":"","src":null},"later-change":{"id":"later-change","cat":"身体变化","q":"体力下降、一直疲劳，先怎么查？","answer":"说清相比过去哪些事变难、什么时候开始，以及伴随症状。","extra":"带上病史和全部用药，别只说“最近老得快”。","steps":["把持续、进展与偶发问题分开。","症状明显时不等年度体检或先买抗衰套餐。"],"ch":11,"anchor":"c11-s004","link":"看新变化怎么描述","note":"","src":null},"later-check":{"id":"later-check","cat":"检查","q":"体检项目越多越好吗？","answer":"先问每项检查解决什么，结果会怎样改变下一步。","extra":"依据器官、病史、家族史和所在地建议选，不把套餐当个人方案。","steps":["核对已有结果和真正到期的项目。","异常结果要取得解释，重复检查也要有理由。"],"ch":31,"anchor":"c31-s010","link":"看个人预防检查表","note":"","src":null},"later-menopause":{"id":"later-menopause","cat":"围绝经期","q":"潮热、夜醒、月经变化，怎么处理？","answer":"记录最影响生活的几项，带给医生讨论合适治疗。","extra":"激素和非激素都有各自条件，不凭广告统一补或一概拒绝。","steps":["说明实际影响，不只说“不太舒服”。","不要把所有心悸和疲劳都归给更年期。"],"ch":12,"anchor":"c12-s004","link":"看围绝经期的就医问题","note":"绝经后出血，即使少量或一次，也需要评估。","src":"s75"},"later-snore":{"id":"later-snore","cat":"打鼾","q":"打鼾很响，就是睡得香吗？","answer":"不是。伴呼吸暂停、喘憋或白天困倦时，值得评估。","extra":"手表、手机录音或一晚感觉好，都不能独立排除问题。","steps":["就诊时描述同住者看到的具体表现。","困倦驾驶风险当天处理，不能等检查结束。"],"ch":12,"anchor":"c12-s008","link":"看打鼾与呼吸暂停","note":"","src":"s77"},"later-future":{"id":"later-future","cat":"未来安排","q":"想少工作一点，先算什么？","answer":"把工作提供的收入、社交、兴趣和身份分开看，再找替代。","extra":"先小范围试用新安排，不同一天把工作、住所和关系全部推倒。","steps":["看必要支出和照护责任能否持续。","重要资料与事务安排可靠的接续方式。"],"ch":12,"anchor":"c12-s003","link":"看工作和居住怎么准备","note":"","src":null},"later-weight":{"id":"later-weight","cat":"体重","q":"没刻意减，体重却一直掉，要高兴吗？","answer":"先弄清原因。无意下降不是自动的好结果。","extra":"记录速度、饮食活动与用药变化，伴疲劳或其他症状时就医。","steps":["评价同时看体力、睡眠与日常功能。","不因数字下降就继续限制食物。"],"ch":12,"anchor":"c12-s009","link":"看体重变化该问什么","note":"","src":null},"later-parents":{"id":"later-parents","cat":"父母","q":"父母办事变慢，就该全部替他们做吗？","answer":"先看卡在哪一步：看不清、界面变了，还是持续能力变化。","extra":"改工具或提供必要帮助，仍让本人参与决定。","steps":["平稳时谈希望谁参与医疗和紧急联系。","持续功能变化需要评估，不在家族群里投票接管。"],"ch":11,"anchor":"c11-s010","link":"看怎样帮助父母","note":"","src":null},"older-week":{"id":"older-week","cat":"作息","q":"退休后，普通一周怎么安排？","answer":"先留起居、吃饭、活动和联系的固定位置，其他时间可以自由。","extra":"不要刚停工作就用课程把一周填满。","steps":["分清自己喜欢安静，还是缺少想要的连接。","继续工作的人可以调整任务和通勤，不用证明一直能硬撑。"],"ch":13,"anchor":"c13-s001","link":"看一周怎么排","note":"","src":null},"older-strength":{"id":"older-strength","cat":"活动","q":"只散步就够了吗？","answer":"日常活动也要兼顾力量和平衡，按能力和病情安排。","extra":"目标可以是起身、提物、上下台阶和独立外出，不只看步数。","steps":["练平衡靠近可靠支撑，需要时有人保护。","近期跌倒、头晕或明显虚弱先评估。"],"ch":13,"anchor":"c13-s004","link":"看力量、平衡怎么练","note":"","src":null},"older-home":{"id":"older-home","cat":"防跌","q":"家里先改哪里，出入更稳？","answer":"先检查床到厕所、厨房到餐桌、门到电梯这几条常走的路。","extra":"灯够不够、有没有绊脚物、扶手是否可靠，比买满一屋用品更具体。","steps":["夜间单独检查鞋、灯、助具与通道。","新发不稳或起身头晕要评估。"],"ch":13,"anchor":"c13-s005","link":"看防跌怎么做","note":"","src":"s78"},"older-med":{"id":"older-med","cat":"用药","q":"药越来越多，怎么避免吃乱？","answer":"把处方、非处方、草药和补剂写进同一张当前清单。","extra":"说明真实吃法和漏服原因，请团队一起复核。","steps":["知道每种为什么吃、由谁管理、何时复查。","不因药多自行删，也不因为吃了多年就永远不问。"],"ch":13,"anchor":"c13-s006","link":"看多药怎么核对","note":"","src":null},"older-food":{"id":"older-food","cat":"吃饭","q":"食欲差，是不是买营养粉就行？","answer":"先找具体困难：买不到、做不动、牙痛、吞咽不舒服，还是身体原因。","extra":"对着困难安排支持，别只催“多吃点”。","steps":["持续摄入不足或无意掉体重要评估。","保留本人喜欢、又符合安全计划的口味。"],"ch":13,"anchor":"c13-s007","link":"看吃得少怎么处理","note":"","src":null},"older-learn":{"id":"older-learn","cat":"学习","q":"年纪大了，学手机从哪里开始？","answer":"先学一个真要用的事：联系家人、预约或查路线。","extra":"调整字号、输入和提示，学会后再加下一项。","steps":["请教的人慢一点，一次不要讲所有功能。","能用纸质方法完成的，也可以继续用。"],"ch":13,"anchor":"c13-s008","link":"看学习与参与","note":"","src":null},"older-trip":{"id":"older-trip","cat":"外出","q":"想旅行，先检查什么？","answer":"路线、休息、厕所、用品、交通和回来后的体力都算进去。","extra":"先试短路线，再决定长途，别拿同行者的速度当自己的要求。","steps":["药物携带与时区问题向团队核对。","费用已付也可以调整不合适的安排。"],"ch":13,"anchor":"c13-s010","link":"看外出怎么准备","note":"","src":null},"older-choice":{"id":"older-choice","cat":"家人帮助","q":"家人总替我决定，怎么说？","answer":"说清希望自己决定什么、哪一步需要帮忙。","extra":"帮助可以具体到接送、查资料或拿东西，不代表交出全部选择。","steps":["约定联系频率与真正需要响应的情况。","定位、摄像与资料访问要说明范围。"],"ch":13,"anchor":"c13-s009","link":"看联系、帮助与隐私","note":"","src":null},"care-morning":{"id":"care-morning","cat":"早晨","q":"照护者来了，先做什么？","answer":"先说明谁来了、准备做什么，再听本人有没有新不舒服。","extra":"别进门就拉被子、搬动身体或连续发指令。","steps":["观察今天跟平常的反应和呼吸是否不同。","非必要洗浴、外出可按疲倦程度调整。"],"ch":14,"anchor":"c14-s004","link":"看晨间照护","note":"","src":null},"care-transfer":{"id":"care-transfer","cat":"起身","q":"扶人起床，怎么不伤到双方？","answer":"用已经评估、受过训练的方式，不突然拉手臂或一人硬抱。","extra":"先清理路线、准备好终点，再开始移动。","steps":["核对实际设备的刹车、脚踏和支撑。","今天能力明显不同，就暂停求助，不强行照旧。"],"ch":14,"anchor":"c14-s005","link":"看转移前的准备","note":"","src":null},"care-swallow":{"id":"care-swallow","cat":"吃饭","q":"一吃一喝就呛，要喂得更慢就好吗？","answer":"反复呛咳或吞咽不舒服需要评估，不能只靠催促或自行换稠度。","extra":"按评估后的姿势、质地与协助方案进食。","steps":["不要统一用吸管、仰头喝水或给所有人加增稠剂。","药片能否碾碎要另外问药师。"],"ch":14,"anchor":"c14-s011","link":"看吞咽问题怎么处理","note":"急性气道梗阻立即求助，不能继续灌水试图冲下。","src":"s80"},"care-med":{"id":"care-med","cat":"用药","q":"换了照护者，怎样不重复喂药？","answer":"同一张记录写清已给、未给、拒绝或暂缓，以及原因。","extra":"药变了就更新当前清单，旧方案明显区分。","steps":["不能只留一个含义不明的勾。","漏服和呕吐后按具体药物计划，不自动补倍量。"],"ch":14,"anchor":"c14-s013","link":"看给药怎么交接","note":"","src":null},"care-night":{"id":"care-night","cat":"夜间","q":"夜里起身，先准备好什么？","answer":"可用的灯、电话或呼叫装置、鞋和助具，放在能拿到的位置。","extra":"路上清楚，有人知道什么时候需要响应。","steps":["哪些观察必须叫醒，按个人医疗计划。","不要用严重限水代替如厕支持。"],"ch":14,"anchor":"c14-s020","link":"看夜间照护与睡眠","note":"","src":null},"care-choice":{"id":"care-choice","cat":"自己决定","q":"需要别人帮忙，还能自己决定什么？","answer":"吃什么、穿什么、见谁、听什么，以及希望怎样被帮助，都尽量由本人决定。","extra":"能做的步骤留下来，不为了效率全部替代。","steps":["先问偏好，再安排活动。","表达慢时给时间，不把沉默直接当作同意。"],"ch":14,"anchor":"c14-s018","link":"看护理之外怎么生活","note":"","src":null},"care-confused":{"id":"care-confused","cat":"突然变化","q":"突然糊涂、不认地方，是老了正常吗？","answer":"不是应该等几天的年龄现象，应立即获得医疗帮助。","extra":"既有认知问题，也不能把新变化自动归给原诊断。","steps":["陪伴并保持环境安全，准备药单和最后正常时间。","不多人围问，不自行增加镇静药。"],"ch":14,"anchor":"c14-s016","link":"看突然混乱怎么处理","note":"突然明显混乱，立即求助。","src":"s79"},"care-burnout":{"id":"care-burnout","cat":"照护者","q":"照护者快撑不住了，先改什么？","answer":"安排真实替班，把连续休息、吃饭和自己的就医留出来。","extra":"替班的人要会做，而不是让疲惫者继续远程指挥。","steps":["求助说到具体任务和时段。","无人能安全完成必要照护时，向医疗、社区或服务机构说明缺口。"],"ch":14,"anchor":"c14-s021","link":"看照护者怎样获得支持","note":"","src":null},"oldest-day":{"id":"oldest-day","cat":"今天想做什么","q":"一天该安排什么？","answer":"先问本人想见谁、吃什么、做什么，也允许只想休息。","extra":"年龄不会自动把生活变成全天护理表。","steps":["仍能独立完成的事继续做。","需要帮助的步骤单独安排，不统一接管。"],"ch":15,"anchor":"c15-s000","link":"看高龄日常怎么安排","note":"","src":null},"oldest-wish":{"id":"oldest-wish","cat":"愿望","q":"走不远了，喜欢的活动只能放弃吗？","answer":"先缩短路线、增加停留、调整工具，保留最在意的部分。","extra":"想旅行可能是想见人，也可能是想换个环境，不同愿望有不同做法。","steps":["问清本人愿意承担的负担。","准备必要支持与停止条件，不因“别折腾”就删除全部选择。"],"ch":15,"anchor":"c15-s001","link":"看愿望怎样换个做法","note":"","src":null},"oldest-visit":{"id":"oldest-visit","cat":"探访","q":"亲友来得越多越好吗？","answer":"先问喜欢怎样见面，允许缩短、拒绝或提前结束。","extra":"准备、交通和恢复都占体力，别让一场热闹耗掉后面几天。","steps":["尽量减少不必要往返。","留出平常吃饭、用药和休息的空间。"],"ch":15,"anchor":"c15-s002","link":"看探访和外出怎么安排","note":"","src":null},"oldest-pain":{"id":"oldest-pain","cat":"不舒服","q":"疼、喘、恶心，是不是只能忍？","answer":"告诉负责团队，说明最影响翻身、进食、睡觉还是交流。","extra":"症状控制是照护的一部分，不用忍耐证明不麻烦别人。","steps":["药物和救急办法由团队明确。","有新严重变化时按急症处理，不自行叠加镇静止痛药。"],"ch":15,"anchor":"c15-s012","link":"看症状怎么反馈","note":"","src":null},"oldest-treatment":{"id":"oldest-treatment","cat":"治疗","q":"治不治，只问“能不能做”够吗？","answer":"还要问能改善什么、负担多大、不做或延后怎样、何时能看出结果。","extra":"让本人重视的清醒、舒适、在家或延长生命等目标进入讨论。","steps":["无法给数字时，请团队说明合理的几种结果。","不由年龄单独决定，也不由家庭替代临床判断。"],"ch":15,"anchor":"c15-s007","link":"看治疗前该问什么","note":"","src":null},"oldest-record":{"id":"oldest-record","cat":"回忆","q":"一定要留下“长寿秘诀”或人生总结吗？","answer":"不用。愿意说就听，想聊今天也可以。","extra":"拍照、录音和公开之前问本人，不把分享变成必须完成的任务。","steps":["可以选少量有意义的物件和故事。","允许不解释、不录制，也允许休息。"],"ch":15,"anchor":"c15-s003","link":"看表达与私人空间","note":"","src":null},"oldest-food":{"id":"oldest-food","cat":"吃得少","q":"高龄吃得少，就可以当作临终吗？","answer":"不能。新的吞咽或摄入问题仍要评估可处理的原因。","extra":"只有团队判断进入临终阶段，才采用相应的进食与舒适计划。","steps":["普通高龄营养和临终照护不能混用。","不能自行灌水、强喂或取消食物。"],"ch":15,"anchor":"c15-s013","link":"看不同状态下怎么进食","note":"","src":null},"oldest-palliative":{"id":"oldest-palliative","cat":"更多支持","q":"缓和医疗是不是等于放弃？","answer":"不是。它帮助处理严重疾病带来的痛苦，可以与其他治疗并行。","extra":"向当前团队说明症状和治疗负担，了解本地可用支持。","steps":["它不自动取消原治疗。","实际病情需要时才启用，不按某个生日启动。"],"ch":15,"anchor":"c15-s006","link":"看缓和医疗是什么","note":"","src":"s23"}},"topics":[{"title":"睡不好、白天困","desc":"先分清睡不够，还是有时间却睡不着。","ch":16,"anchor":"c16-s000","examples":["睡不着怎么办","打鼾很响","轮班怎么睡"]},{"title":"每天怎么吃","desc":"普通一餐、外食、食物保存和吃不下时的办法。","ch":17,"anchor":"c17-s001","examples":["下班不想做饭","蛋白质怎么吃","没胃口"]},{"title":"开始锻炼","desc":"练多少、怎么开始、恢复不好时怎么调整。","ch":18,"anchor":"c18-s004","examples":["刚开始运动","一周练几次","练完很累"]},{"title":"牙齿、眼睛、耳朵","desc":"刷牙、用眼、噪声防护，以及突然变化时的求助。","ch":19,"anchor":"c19-s001","examples":["牙怎么刷","耳朵听不清","眼睛不舒服"]},{"title":"体检、吃药、看报告","desc":"该问什么、结果怎么跟进、怎样避免重复用药。","ch":20,"anchor":"c20-s000","examples":["报告没解释","漏服药怎么办","体检项目"]},{"title":"生病以后怎么生活","desc":"把治疗、吃饭、活动和真实需要放在一起安排。","ch":21,"anchor":"c21-s001","examples":["出院回家","运动后不舒服","药怎么交接"]},{"title":"焦虑、低落、吵架","desc":"怎么开口、怎么求助，以及不安全关系里的保护。","ch":22,"anchor":"c22-s001","examples":["总是焦虑","一直没兴趣","跟家人吵架"]},{"title":"把一件事学会","desc":"从小目标到实际练习，用反馈改下一次。","ch":23,"anchor":"c23-s000","examples":["学了记不住","读完就忘","怎么练习"]},{"title":"家务、钱与住处","desc":"分工、基本开支、居家安全和资料备份。","ch":24,"anchor":"c24-s008","examples":["家务怎么分","存多少钱","搬家准备"]},{"title":"生活突然有变化","desc":"出院、失业、搬家、分离或照护中断，先处理哪一步。","ch":28,"anchor":"c28-s001","examples":["失业怎么办","照护者换人","准备搬家"]},{"title":"休息、兴趣和关系","desc":"听歌、写作、做点东西，或好好陪一个人。","ch":29,"anchor":"c29-s000","examples":["不知道玩什么","想开始写作","一个人很孤独"]},{"title":"一天总是不够用","desc":"把时间算完整，再决定留下什么、交给谁。","ch":31,"anchor":"c31-s021","examples":["没时间运动","家人怎么接班","事情一直没做完"]}]}</script>
<script>'use strict';
const D=JSON.parse(document.getElementById('bookData').textContent);
const U=JSON.parse(document.getElementById('uiData').textContent);
const main=document.getElementById('main');
const KEY='life-panorama-reader-2';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validCard=id=>typeof id==='string'&&Object.hasOwn(U.cards,id);
const validChapter=id=>Number.isInteger(id)&&id>=0&&id<D.chapters.length;
const refValid=r=>typeof r==='string'&&(r.startsWith('q:')?validCard(r.slice(2)):r.startsWith('c:')&&validChapter(Number(r.slice(2))));
const validStage=i=>Number.isInteger(i)&&i>=0&&i<U.stages.length;
const defaults=()=>({version:2,sourceHash:D.sourceHash,stage:null,bookmarks:[],known:[],knownCh:[],remember:false,readSize:19,last:null,recent:[],positions:{}});
function cleanState(s){
 const out=defaults();if(!s||typeof s!=='object'||Array.isArray(s))return out;
 out.stage=validStage(s.stage)?s.stage:null;
 out.bookmarks=[...new Set((Array.isArray(s.bookmarks)?s.bookmarks:[]).filter(refValid))].slice(0,500);
 out.readSize=[17,19,21,23].includes(s.readSize)?s.readSize:19;out.remember=s.remember===true;
 if(s.sourceHash===D.sourceHash){out.known=[...new Set((Array.isArray(s.known)?s.known:[]).filter(validCard))].slice(0,500);out.knownCh=(Array.isArray(s.knownCh)?s.knownCh:[]).filter(validChapter).slice(0,32);}
 const last=s.last;if(last&&validChapter(last.ch))out.last={ch:last.ch,anchor:typeof last.anchor==='string'&&D.anchors[last.anchor]===last.ch?last.anchor:''};
 out.recent=[...new Set((Array.isArray(s.recent)?s.recent:[]).filter(refValid))].slice(0,8);
 if(s.positions&&typeof s.positions==='object')for(const [k,v] of Object.entries(s.positions))if(validChapter(Number(k))&&typeof v==='string'&&D.anchors[v]===Number(k))out.positions[k]=v;
 return out;
}
let state=defaults();
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw?.remember)state=cleanState(raw);else{
 const old=JSON.parse(localStorage.getItem('life-panorama-prototype-v1')||'null');
 if(old?.remember)state=cleanState({...old,sourceHash:D.sourceHash,bookmarks:(old.bookmarks||[]).filter(validChapter).map(x=>'c:'+x),known:[],knownCh:old.known,last:validChapter(old.last)?{ch:old.last,anchor:''}:null});
}}catch{}
// The homepage always starts at all ages; an explicit age URL selects a stage.
// Keep saved bookmarks, reading positions and typography settings unchanged.
state.stage=null;
const ageHref=()=>validStage(state.stage)?'#age/'+state.stage:'#map';
let routeKey='',view='map',reading=null,showKnown=false,toastTimer,explicitNavigation=false,lastNonRead='#map',scrollTimer;
const scrolls=new Map();
function save(){if(!state.remember)return;try{localStorage.setItem(KEY,JSON.stringify(state));}catch{state.remember=false;toast('无法保存到浏览器，可以先导出收藏。');}}
function removeStorage(){try{localStorage.removeItem(KEY);localStorage.removeItem('life-panorama-prototype-v1');}catch{}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3200);}
const searchIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>';
function readHref(ch,anchor=''){return '#read/'+ch+(anchor?'/'+encodeURIComponent(anchor):'');}
function getSourceIndex(){
 const t=document.createElement('template');t.innerHTML=D.sources;const out={};
 const anchors=t.content.querySelectorAll('a[id]');
 anchors.forEach(a=>{if(!/^s\d+$/.test(a.id))return;let n=a.parentElement,parts=[];while((n=n.nextElementSibling)){if(n.querySelector('a[id]'))break;parts.push(n.cloneNode(true));}const box=document.createElement('div');parts.forEach(p=>box.append(p));const title=box.querySelector('h3')?.textContent||a.id.toUpperCase();const link=box.querySelector('a[href^="https://"],a[href^="http://"]');const scope=Array.from(box.querySelectorAll('p')).map(p=>p.textContent).find(s=>s.startsWith('对应范围：'))||'';out[a.id]={title,url:link?.href||'',scope:scope.replace('对应范围：','相关内容：')};});return out;
}
const sources=getSourceIndex();
function nav(){document.querySelectorAll('[data-nav]').forEach(a=>{const on=a.dataset.nav===view;a.classList.toggle('active',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.querySelectorAll('.side-link').forEach(a=>a.classList.toggle('active',a.hash===location.hash));}
function footer(){return '<footer class="site-footer"><span>人生全景 · 从出生前到一百岁</span><div class="button-row"><a href="#help">阅读说明</a><a href="#read/1/c01-s001">安全与求助</a></div></footer>';}
function finish(){
 main.insertAdjacentHTML('beforeend',footer());nav();document.documentElement.style.setProperty('--read',state.readSize+'px');
 const stageOption=document.querySelector('#scope option[value="stage"]');
 stageOption.disabled=!validStage(state.stage);
 stageOption.textContent=validStage(state.stage)?U.stages[state.stage].label:'选择年龄后可筛选';
 if(!validStage(state.stage)&&scope==='stage'){scope='all';document.getElementById('scope').value='all';}
}
function pageTitle(title,desc=''){return `<section class="hero"><h1>${E(title)}</h1>${desc?`<p class="subtitle">${E(desc)}</p>`:''}</section>`;}
function track(ref){state.recent=[ref,...state.recent.filter(x=>x!==ref)].slice(0,8);save();}
function savePosition(){
 if(routeKey)scrolls.set(routeKey,window.scrollY);
 if(!validChapter(reading))return;
 const hs=[...main.querySelectorAll('.article h3[id],.article h4[id]')];let h=null;const threshold=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--head'))+110;
 for(const el of hs){if(el.getBoundingClientRect().top<=threshold)h=el;else break;}
 if(h){state.positions[reading]=h.id;state.last={ch:reading,anchor:h.id};save();}
}
function navigate(hash){savePosition();explicitNavigation=true;if(location.hash===hash){route(true);}else location.hash=hash;}
function toggleBookmark(ref){if(!refValid(ref))return;const was=state.bookmarks.includes(ref);state.bookmarks=was?state.bookmarks.filter(x=>x!==ref):[ref,...state.bookmarks];save();document.querySelectorAll('[data-save]').forEach(b=>{if(b.dataset.save===ref){b.textContent=!was?'已收藏':'收藏';b.classList.toggle('saved',!was);b.setAttribute('aria-pressed',String(!was));}});toast(was?'已取消收藏':'已收藏');}
function cardHTML(id,full=false){
 const c=U.cards[id],known=!full&&!showKnown&&state.known.includes(id),saved=state.bookmarks.includes('q:'+id);
 return `<article class="answer-card ${known?'known-card':''}" id="card-${E(id)}" data-card="${E(id)}"><div class="card-top"><span class="category">${E(c.cat)}</span><button class="save-small ${saved?'saved':''}" data-save="q:${E(id)}" aria-pressed="${saved}" aria-label="收藏：${E(c.q)}">${saved?'已收藏':'收藏'}</button></div><h3>${full?E(c.q):`<a href="#q/${E(id)}">${E(c.q)}</a>`}</h3><p class="answer">${E(c.answer)}${c.src?`<button class="ref-btn" data-source="${E(c.src)}" aria-label="查看${E(c.cat)}的参考资料">依据</button>`:''}</p>${!known?`<p class="answer-extra">${E(c.extra)}</p>`:''}${c.note?`<p class="critical" data-critical>${E(c.note)}</p>`:''}${!known?`<details class="explain" ${full||showKnown?'open':''}><summary>具体怎么做</summary><div class="steps">${c.steps.map((s,i)=>`<p><span class="step-n">${i+1}.</span><span>${E(s)}</span></p>`).join('')}</div></details>`:''}<div class="card-foot"><a href="${readHref(c.ch,c.anchor)}">${E(c.link)} →</a>${!full?`<button class="known-btn" data-known="${E(id)}" aria-pressed="${state.known.includes(id)}">${state.known.includes(id)?'展开补充':'已读，收起'}</button>`:`<button class="known-btn" data-copy="${E(id)}">复制这份回答</button>`}</div></article>`;
}
function resumeHTML(){if(!state.last)return '';const ch=D.chapters[state.last.ch];return `<div class="resume"><p><span class="muted">上次读到</span>　${E(shortTitle(ch.title))}</p><a href="${readHref(state.last.ch,state.last.anchor)}">继续读 →</a></div>`;}
function ageSelectHTML(){
 return `<div class="age-choose"><label for="ageSelect">查看年龄</label><select id="ageSelect" aria-label="查看年龄"><option value="all" ${!validStage(state.stage)?'selected':''}>全部年龄</option>${U.stages.map((s,i)=>`<option value="${i}" ${i===state.stage?'selected':''}>${E(s.label)}</option>`).join('')}</select></div>`;
}
function showAllAges(){
 view='map';document.title='全部年龄 · 人生全景';
 main.innerHTML=`<div class="agebar">${ageSelectHTML()}<a class="all-age-back" href="#book">读全书 →</a></div>
 <section class="hero"><h1>从出生前到100岁，<br class="only-mobile">每个阶段怎么过？</h1><p class="subtitle">吃什么、睡多久、怎么锻炼、怎样学习和照顾家人。选一个年龄，看具体做法。</p></section>
 <section aria-labelledby="allAgesTitle"><div class="section-head"><h2 id="allAgesTitle">全部年龄</h2><a class="all-age-back" href="#topics">直接查问题 →</a></div>
 <div class="age-overview-grid">${U.stages.map((s,i)=>`<a class="age-overview-card" href="#age/${i}" data-age-entry="${i}" aria-label="查看${E(s.label)}指南"><div class="age-overview-heading"><h3>${E(s.label)}</h3><span aria-hidden="true">→</span></div><p>${E(s.sub)}</p></a>`).join('')}</div></section>
 <div class="all-age-resume">${resumeHTML()}</div>`;
 finish();
}
function showMap(){

}
function highlight(text,terms){const usable=[...new Set(terms)].filter(x=>x.length>=2&&x.length<70).sort((a,b)=>b.length-a.length);if(!usable.length)return E(text);const pattern=usable.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');const re=new RegExp(pattern,'gi');let out='',last=0;for(const m of text.matchAll(re)){out+=E(text.slice(last,m.index))+'<mark>'+E(m[0])+'</mark>';last=m.index+m[0].length;}return out+E(text.slice(last));}
function excerpt(x,terms){let pos=-1;for(const term of terms){const p=x.text.toLowerCase().indexOf(term.toLowerCase());if(p>=0){pos=p;break;}}const start=x.type==='question'?0:Math.max(0,pos-40);const text=x.text.slice(start,start+145);return (start?'…':'')+highlight(text,terms)+(start+145<x.text.length?'…':'');}
function runSearch(){
 const q=query.value.trim().slice(0,100),box=document.getElementById('results');
 if(!q){box.innerHTML=`<div class="search-suggestions"><p>可以这样问</p><div class="picks">${['孩子不肯吃饭','晚上睡不着','耳朵听不清','家务怎么分','照护者换人','一天怎么安排'].map(q=>`<button data-query="${E(q)}">${E(q)}</button>`).join('')}</div></div>`;document.getElementById('resultCount').textContent='';return;}
 const list=findResults(q);document.getElementById('resultCount').textContent=`${list.length===250?'至少 ':''}${list.length}条相关内容`;
 box.innerHTML=list.length?list.slice(0,queryLimit).map(x=>`<div class="result"><a href="${x.href}" data-search-result>${highlight(x.title,x.terms)}</a><p>${excerpt(x,x.terms)}</p><small>${E(x.type==='question'?'简短回答':humanChapterTitles[x.ch])}</small></div>`).join('')+(list.length>queryLimit?'<button data-do="more" style="margin-top:18px">再看15条</button>':''):`<div class="empty"><p>没找到“${E(q)}”。${scope!=='all'?'可以换成“全书”再找，或':'试试'}缩短关键词。</p><a href="#book" data-search-result>到目录找一找 →</a></div>`;
}
function openSearch(text){queryLimit=15;if(typeof text==='string')query.value=text;if(!searchDialog.open)searchDialog.showModal();query.focus();runSearch();}
function openSource(id){const s=sources[id];if(!s){toast('暂未找到这条资料，可以到正文参考资料中查看。');return;}document.getElementById('sourceBody').innerHTML=`<h3>${E(s.title)}</h3>${s.scope?`<p>${E(s.scope)}</p>`:''}${s.url?`<p><a href="${E(s.url)}" target="_blank" rel="noopener noreferrer">查看原始资料 ↗</a></p>`:''}<p class="small muted">请结合正文中的年龄、身体情况与适用条件阅读。</p>`;if(!sourceDialog.open)sourceDialog.showModal();}
function openAges(){document.getElementById('ageBody').innerHTML=`<div class="age-list"><a class="${!validStage(state.stage)?'active':''}" href="#map" ${!validStage(state.stage)?'aria-current="true"':''}>全部年龄</a>${U.stages.map((s,i)=>`<a class="${i===state.stage?'active':''}" href="#age/${i}" ${i===state.stage?'aria-current="true"':''}>${E(s.label)}</a>`).join('')}</div>`;ageDialog.showModal();}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function copyCard(id){const c=U.cards[id];if(!c)return;const text=`${c.q}\n\n${c.answer}\n${c.extra}\n${c.note?'\n注意：'+c.note+'\n':''}\n${c.steps.map((s,i)=>(i+1)+'. '+s).join('\n')}\n\n《人生全景指南》：${D.chapters[c.ch].sections.find(s=>s.id===c.anchor)?.title||humanChapterTitles[c.ch]}`;try{await navigator.clipboard.writeText(text);toast('回答已复制');}catch{document.getElementById('copyText').value=text;document.getElementById('copyDialog').showModal();document.getElementById('copyText').select();}}
function replaceCard(id){const el=document.getElementById('card-'+id);if(!el)return;const top=el.getBoundingClientRect().top;el.outerHTML=cardHTML(id);const after=document.getElementById('card-'+id);window.scrollBy(0,after.getBoundingClientRect().top-top);after.querySelector('[data-known]')?.focus({preventScroll:true});}
const ACTION_TEMPLATE='# 我的计划\n\n要解决的问题：\n\n今天先做什么：\n\n开始前需要准备什么：\n\n谁负责／需要谁帮忙：\n\n做到怎样算完成：\n\n约定的时间：\n\n什么情况暂停或求助：\n\n下次什么时候再看：\n\n参考资料：\n\n注：涉及诊疗的日期、用法和剂量，使用已经确认的个人医疗安排。\n';
document.addEventListener('click',ev=>{
 const b=ev.target.closest('a,button');if(!b)return;
 if(b.dataset.source){openSource(b.dataset.source);return;}
 if(b.dataset.query!==undefined){openSearch(b.dataset.query);return;}
 if(b.dataset.save){toggleBookmark(b.dataset.save);return;}
 if(b.dataset.remove){state.bookmarks=state.bookmarks.filter(x=>x!==b.dataset.remove);save();const y=window.scrollY;showMine();window.scrollTo(0,y);toast('已移除收藏');return;}
 if(b.dataset.known){const id=b.dataset.known;if(!validCard(id))return;state.known=state.known.includes(id)?state.known.filter(x=>x!==id):[...state.known,id];showKnown=false;save();replaceCard(id);const all=main.querySelector('[data-do="show-known"]');if(all)all.textContent='展开所有做法';return;}
 if(b.dataset.copy){copyCard(b.dataset.copy);return;}
 if(b.tagName==='A'){
  const href=b.getAttribute('href')||'';
  if(!href.startsWith('#')||ev.ctrlKey||ev.metaKey||ev.shiftKey||ev.altKey)return;
  if(href==='#main'){ev.preventDefault();main.focus();return;}
  const id=href.slice(1);if(/^s\d+$/.test(id)){ev.preventDefault();openSource(id);return;}
  ev.preventDefault();if(searchDialog.open)searchDialog.close();if(ageDialog.open)ageDialog.close();
  if(Object.hasOwn(D.anchors,id)){navigate(readHref(D.anchors[id],id));return;}
  if(b.closest('.mobile-toc'))b.closest('.mobile-toc').open=false;
  navigate(href);return;
 }
 const act=b.dataset.do;
 if(act==='search')openSearch();
 if(act==='close-search')searchDialog.close();
 if(act==='close-source')sourceDialog.close();
 if(act==='close-ages')ageDialog.close();
 if(act==='close-copy')document.getElementById('copyDialog').close();
 if(act==='ages')openAges();
 if(act==='more'){queryLimit+=15;runSearch();}
 if(act==='show-known'){const y=window.scrollY;showKnown=!showKnown;showMap();window.scrollTo(0,y);main.querySelector('[data-do="show-known"]')?.focus({preventScroll:true});}
 if(act==='size'){const sizes=[17,19,21,23];state.readSize=sizes[(sizes.indexOf(state.readSize)+1)%sizes.length];document.documentElement.style.setProperty('--read',state.readSize+'px');b.textContent='字号 '+state.readSize;save();}
 if(act==='focus'){const on=document.body.classList.toggle('focus-mode');b.textContent=on?'退出专注':'专注阅读';b.setAttribute('aria-pressed',String(on));}
 if(act==='print')window.print();
 if(act==='known-ch'&&validChapter(reading)){const on=!state.knownCh.includes(reading);state.knownCh=on?[...state.knownCh,reading]:state.knownCh.filter(x=>x!==reading);save();b.textContent=on?'已读 · 撤销':'标记已读';b.setAttribute('aria-pressed',String(on));}
 if(act==='export')download('人生全景_我的收藏.json',JSON.stringify({...state,kind:'life-panorama-reading',exportedAt:new Date().toISOString()},null,2),'application/json');
 if(act==='import')document.getElementById('importFile').click();
 if(act==='template')download('人生全景_我的计划.md',ACTION_TEMPLATE,'text/markdown;charset=utf-8');
 if(act==='clear'&&confirm('清空收藏、阅读标记和阅读位置？清空前可以先导出备份。')){state=defaults();removeStorage();showMine();toast('记录已清空');}
});
document.addEventListener('change',async ev=>{
 const el=ev.target;
 if(el.id==='ageSelect')navigate(el.value==='all'?'#map':'#age/'+Number(el.value));
 if(el.id==='subageSelect'&&el.value&&validStage(state.stage))navigate(readHref(U.stages[state.stage].ch,el.value));
 if(el.id==='remember'){state.remember=el.checked;if(state.remember)save();else removeStorage();el.checked=state.remember;toast(state.remember?'已开启保存':'已关闭保存');}
 if(el.id==='scope'){scope=el.value;queryLimit=15;runSearch();}
 if(el.id==='importFile'){
  const file=el.files[0];el.value='';if(!file)return;if(file.size>1024*1024){toast('这个文件太大，请选择导出的收藏文件。');return;}
  try{const imported=JSON.parse(await file.text());if(imported.kind!=='life-panorama-reading'||imported.version!==2||!Array.isArray(imported.bookmarks))throw Error();const safe=cleanState(imported);if(!confirm(`导入${safe.bookmarks.length}项收藏，并合并到当前记录？`))return;state.bookmarks=[...new Set([...state.bookmarks,...safe.bookmarks])].slice(0,500);state.known=[...new Set([...state.known,...safe.known])].slice(0,500);state.knownCh=[...new Set([...state.knownCh,...safe.knownCh])];save();if(view==='mine')showMine();toast('收藏已导入');}catch{toast('无法读取，请选择本网站导出的收藏 JSON 文件。');}
 }
});
query.addEventListener('compositionstart',()=>composing=true);query.addEventListener('compositionend',()=>{composing=false;runSearch();});query.addEventListener('input',()=>{if(composing)return;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{queryLimit=15;runSearch();},100);});
query.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();runSearch();document.querySelector('#results a[data-search-result]')?.click();}});
document.addEventListener('keydown',e=>{if((e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.activeElement.isContentEditable&&!document.querySelector('dialog[open]')){e.preventDefault();openSearch();}});
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
let beforePrint=[];window.addEventListener('beforeprint',()=>{beforePrint=[...main.querySelectorAll('details')].map(el=>[el,el.open]);beforePrint.forEach(([el])=>el.open=true);});window.addEventListener('afterprint',()=>beforePrint.forEach(([el,open])=>el.open=open));
window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(savePosition,220);},{passive:true});
window.addEventListener('pagehide',savePosition);window.addEventListener('hashchange',()=>route());route();

// Keep focused controls above the bottom navigation on small screens.
document.addEventListener('focusin',e=>{
 const el=e.target;if(!main.contains(el)||!el.matches('a,button,input,select,summary')||document.querySelector('dialog[open]'))return;
 requestAnimationFrame(()=>{const r=el.getBoundingClientRect(),top=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--head'))+10;const bottom=innerHeight-(innerWidth<=760&&!document.body.classList.contains('focus-mode')?84:12);if(r.bottom>bottom)window.scrollBy(0,r.bottom-bottom);else if(r.top<top)window.scrollBy(0,r.top-top);});
});
</script></body></html>
