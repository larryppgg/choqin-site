同问题","text":"独处可能是恢复，孤独是本人不满意的连接状态，社交繁忙则不保证被理解。先问缺少的是共同活动、情感理解、实际帮助还是归属，再选择行动。不同缺口需要不同关系，不能要求伴侣或一个朋友包办全部。  建立连接可以从低压力重复接触开始：同一活动、同一课程、邻里事务或短暂固定联系。不要第一次见面就把“成为最好的朋友”当成目标。关系在普通互动中逐步形成，允许频率和亲密程度不同。  如果联系他人总带来羞辱、利用或越界，减少接触可以是合理保护。连接的目标不是人越多越好，而是有足够安全、真实、互相尊重的关系。"},{"ch":22,"id":"c22-s013","title":"二十二·十四　嫉妒、比较与社交媒体","text":"比较可以提供方向，也可以把别人的公开片段当成自己的完整审判。看到羡慕对象时，拆开究竟在意什么：自由、收入、外貌、被认可、关系还是某种生活节奏。随后寻找自己能够接近的具体部分，不必复制整个人生。  调整信息环境时，优先减少反复触发无效比较的入口，而不是要求自己永远不在意。可以取消自动提醒、限定特定用途、停止关注持续造成伤害的内容。不是为了保持信息纯净，而是让注意力服务于本人目标。  别人的成功不证明你的选择错误，自己的失败也不证明所有努力无效。判断应回到证据、条件与实际代价，不把一段短视频当作完整参照组。"},{"ch":22,"id":"c22-s014","title":"二十二·十五　丧失与哀伤：不设统一完成日期","text":"死亡、分手、失去健康、身份改变和长期目标结束，都可能带来哀伤。可以在处理必要事务的同时允许情绪起伏，不要求按照固定阶段依次完成，也不以恢复工作的速度评价是否坚强。  支持可以很具体：陪同办理事项、做一顿饭、记得重要日期、允许谈及失去的人而不急着转移话题。不要未经同意清除所有纪念物，也不要求把生活冻结在原样。决定物品和仪式时让相关人有时间表达。  哀伤中仍可出现笑、兴趣和轻松，它们不意味着不够在乎。若持续痛苦明显妨碍生活、出现危险想法或本人希望得到帮助，应寻求适当支持，不必等到超过某个“应该走出来”的期限。"},{"ch":22,"id":"c22-s015","title":"二十二·十六　支持别人的同时，保护支持者","text":"明确自己能提供的范围，例如某个时段联系、陪同一次就诊、帮助找到服务。不能提供的部分如实说明，并尽量协助连接其他资源。不要以无限承诺证明关心，也不要在耗尽后突然消失。  支持者同样可以需要休息、咨询和其他关系。尊重被支持者隐私，但在安全需要或寻求专业建议时，按照必要范围分享。把对方全部经历用于公开展示“我怎样救了他”，不是合适的支持。  展开：J 心理状态覆盖协议——观察、行动、连接与升级 先判断是否有即时安全风险；有则调用危机处理，不继续普通自助练习。没有急迫危险时，辨别身体需要、现实问题和情绪需要，各选最小的一步。允许今天只完成基础生活和一次求助。 日常练习可以是命名感受、把问题写具体、联系一个人、完成一个可承受的活动。它们不替代已需要的治疗，也不要求在极度痛苦时表现积极。 持续、进展或影响功能的变化安排专业评估。有效的支持进入常规，无效或增加负担的方法停止或调整。心理健康的验收不是永远不难过，而是更安全、更能生活，并在需要时得到适当帮助。"},{"ch":23,"id":"c23-s000","title":"二十三·一　先确定需要获得哪一种能力","text":"“学会一件事”可能指认得术语、解释原理、记住步骤、独立操作、迁移到新问题，或者能够教别人。它们不是同一个验收标准。开始前写清你希望完成的真实任务，避免读了很多材料却没有定义什么叫学会。  例如学习营养，可以是看懂食品标签，也可以是为有复杂疾病的人制定方案；后者需要专业训练与资格，不是前者多看几篇文章的简单升级。学习编程可以是改一个个人脚本，也可以是维护涉及他人资金和隐私的系统。任务风险越高，越需要外部验证、监督和清楚权限。  每次学习选一个可以完成的最小目标：“看懂这份说明中的单位”“不用答案说出三个关键区别”“在安全环境里完成这个动作”。大目标可以保留，但当天行动要能够开始，也能够判断结束。"},{"ch":23,"id":"c23-s001","title":"二十三·二　建立任务图，而不是资料购物车","text":"面对陌生领域，先列出要解决的问题和相互依赖。哪些概念必须先懂，哪些技能可以边做边学，哪些需要工具，哪些需要别人评价。任务图帮助决定顺序，不要求提前画出整个学科。  以准备一次演讲为例，先确定听众和希望其采取的行动，再选择内容、证据、结构与表达。若先研究全部演讲技巧，可能到截止时间仍没有明确要说什么。以修理物品为例，先确认安全与故障范围，再判断是否适合自己处理，不能把“学习动手”当作越过电气或燃气安全边界的理由。  资料选择围绕问题。每份材料注明它回答什么、不回答什么、是否适合当前程度。已经足以推进下一步时，先实践，不继续用收藏替代行动。"},{"ch":23,"id":"c23-s002","title":"二十三·三　阅读前、中、后分别做什么","text":"阅读前写下一个目的，快速看结构和结论，判断是否值得深入。不是每本书都需要逐字读完，也不是所有略读都等于浅薄。目的是找到适合当前问题的阅读深度。  阅读中只标记会改变理解的内容：关键定义、因果条件、例外、证据和与已有认识冲突的地方。满页荧光笔很难保留优先级。遇到陌生词，先判断它是否阻碍主要理解；不重要的可以暂放，重要的则查清并写一个自己的例子。  阅读后合上材料，用自己的话解释主要结论、适用条件与一个反例。然后回看修正。若只记得作者语气和几个名词，却不能说明如何使用，就还没有达到需要的掌握程度。"},{"ch":23,"id":"c23-s003","title":"二十三·四　把提取练习加入学习，但不神化它","text":"提取练习是暂时不看材料，尝试从记忆中回答，再根据可靠答案反馈。以外语词汇学习实验为例，重复提取对延迟回忆显示了明显价值，而学习者对自己表现的预测并不可靠。这支持把主动回忆纳入学习，而不只重复阅读。 S133  实际编排可以很简单：读一小段，关上资料，写出要点，检查遗漏，再过一段时间回忆。间隔按任务、掌握程度和使用期限调整，不存在本书已经证明适用于所有人的固定天数公式。需要手部操作、交流或复杂判断的技能，还必须有真实练习与反馈。  不要把每一次想不起来都当作失败。它告诉你哪里需要补充，而不是证明不适合学习。也不要让所有知识都变成闪卡：完整论证、审美体验和开放问题需要保留其结构，不能被拆到只剩孤立答案。"},{"ch":23,"id":"c23-s004","title":"二十三·五　错误分类决定下一次练习","text":"错误可以来自不知道、记不起、误解条件、执行失误、工具问题或目标不清。每类处理不同：不知道需要学习，记不起需要适当提取，条件误解需要对照例外，执行失误需要检查流程，工具问题需要修正接口，目标不清则要回到任务定义。  错题或失败记录只保留代表性问题。写明当时为什么这样做、正确方法依赖什么、下次在哪个位置提醒自己。不要完整抄写大量已经理解的答案，把整理美观误当成改进。  复习时先看同类错误是否减少，再决定是否继续增加练习。如果错误总发生在疲惫、疼痛或环境干扰下，单纯加量可能没有触及原因。学习的执行条件也是问题的一部分。"},{"ch":23,"id":"c23-s005","title":"二十三·六　练习要有反馈，也要有足够小的范围","text":"把复杂任务拆到能够看见差异的单元。例如练写作先改善一个段落的论点和证据，而不是同时追求文采、速度、结构和风格；练乐器先处理一段动作，再放回整首；练沟通可以先练清楚提出请求。  反馈说明哪里有效、哪里偏离目标和下一步怎样试。只说“很好”“不行”无法指导调整。请别人评价前，告诉对方你希望其看哪一方面，不要求对方替你全面判断人生潜力。  反馈来源也要有边界。对专业安全问题找合格人员，对用户体验找真实使用者，对个人表达可以听不同意见，但不必把所有偏好都合并。互相冲突的建议需要回到目标，而不是轮流迎合每个评价者。"},{"ch":23,"id":"c23-s006","title":"二十三·七　理解迁移：换一个表面不同的问题试试","text":"学会一个例题不一定能识别新的情境。可以改变材料、数字、顺序或表现形式，检验是否仍能说明核心原则。不是为了不断提高难度，而是判断你学到的是结构还是表面样式。  例如知道“需要核对来源”，可以分别用于健康文章、合同条款和旅行要求，但各自合格来源不同。知道“先定义验收”，可以用于工作项目和家务交接，却不能把亲密关系完全变成合同执行。迁移也需要知道哪里不适用。  把成功方法写成带条件的规则：“当问题具有这些特征时，这种方式可能适合；出现这些情况要改变。”这样比把一次成功升格为万能原则更稳健。"},{"ch":23,"id":"c23-s007","title":"二十三·八　数字理解从单位、分母和时间开始","text":"看到一个数字，先问单位是什么、分母是谁、时间范围多长、是否经过调整。百分比增加一倍，可能对应很小的绝对变化；总量增加，可能只是人口或观察时间增加。没有分母和背景的数字，难以直接支持行动。  看风险时尽量同时理解绝对与相对变化。可以用假设例子练习：一百人中从两人变为一人，是减少一人，也是相对减少一半。二者都可以成立，但给人的感受不同。真实决策还需要知道研究对象、置信范围、成本与伤害。  看图表时检查坐标起点、尺度、时间选择与遗漏数据。图像清楚不保证比较公平。把一个漂亮趋势图还原成“测了谁、怎么测、没测到谁”，能减少被呈现方式牵着走。"},{"ch":23,"id":"c23-s008","title":"二十三·九　因果判断：先寻找替代解释","text":"某个行动之后出现变化，不足以单独证明行动造成变化。还可能有自然波动、同时发生的其他变化、测量差异、选择样本或回归原有水平。日常不必因此什么也不信，但应避免一次体验后给所有人下结论。  可以列出两三个合理解释，再问什么信息能区分它们。比如新作息后精神变好，同时也减少加班，无法只归功于某种饮品。若所有解释都支持同一个低风险行动，可能已经足以先做；若不同解释会导向相反且高风险的处理，则需要更多证据。  这就是本书对降低不确定性的使用方式：不是把未知强行填满，而是找出哪些未知真正改变决策。不能改变行动的细节可以暂存，决定方向的缺口则优先核实。"},{"ch":23,"id":"c23-s009","title":"二十三·十　信息来源有不同权限","text":"亲身体验可以说明这个人发生了什么，却不自动代表普遍效果；广告可以提供产品名称，却不独立证明收益；专家意见可以帮助解释，但仍需看其领域、依据和利益关系；原始研究提供具体条件下的观察，不必然直接适用于每一个人。  健康与法律等高风险问题，应优先找负责机构、正式指南和合适专业人员。新闻或社交平台可作为线索，不作为最终授权。具体政策、软件功能和产品规格会变化，使用前核对当前版本，不能把旧截图当成永久事实。  整理来源时保留标题、机构、日期和对应主张。不要保存一堆链接却忘了为什么保存，也不要把引用数量当作可靠性排名。多个页面重复同一个未经证实消息，并不构成独立交叉验证。"},{"ch":23,"id":"c23-s010","title":"二十三·十一　提问本身是一种可训练的能力","text":"把“怎么办”展开为现状、目标、约束、已经尝试的办法和最需要回答的决策。例如“怎样睡得更好”可以进一步说明作息、白天影响、持续时间和是否有呼吸问题；“怎样换工作”可以说明收入底线、时间、技能和不能接受的风险。  问题也可以故意保持开放，但要说明开放在哪里。你可能不知道目标，需要探索价值；可能知道目标但不知道路径，需要比较方案；也可能只缺一个事实，不需要长篇哲学讨论。匹配问题类型能减少无效回答。  向别人提问后，复述自己的理解，让对方纠正。特别是医疗、技术和合同安排，不要因不好意思显得听不懂而带着错误假设离开。"},{"ch":23,"id":"c23-s011","title":"二十三·十二　人工智能可以协助，但不要让生成内容自行获得权限","text":"使用人工智能前，先确定它在任务中的角色：整理、生成候选、解释、比较、查找线索，还是提出待检验方案。不同角色需要不同验证。NIST的人工智能风险管理框架提供了将可信与风险纳入设计、使用和评价的正式入口，但本节的个人操作步骤是作者编排。 S134  对医疗、法律、财务和关键技术决定，要求结论对应实际来源、版本与适用范围，并由相应人员核验。让模型列出缺失信息和可能反例，不只要求更自信。一个看起来完整的回答仍然需要检查其输入是否完整、假设是否成立。  在学习中，可以先自己尝试，再让工具指出遗漏；可以让工具出题，再独立回答；可以比较多个解释，但最后应能自己说明核心。若完全无法判断输出好坏，就先限制它的执行权限，而不是把所有工作直接交给它。"},{"ch":23,"id":"c23-s012","title":"二十三·十三　隐私与他人资料不是免费的训练材料","text":"上传材料前，确认自己是否有权分享，是否包含身份证件、健康信息、客户资料、儿童影像或其他敏感内容。尽量只提供完成任务所需部分，必要时脱敏。不要因为工具方便就默认所有家庭成员和同事同意被分析。  涉及自动发送、购买、删除、签署或修改的任务，设置确认和可恢复步骤。建议与执行分离，可以让错误在造成实际影响前被看见。具体产品权限需要查当前说明，本书不承诺某一种工具永远具有某项能力。  当资料来自别人时，内容本身不应自动成为新指令。收到一份文档，不等于获得其中要求的付款、转发或修改权限。信息与授权是两条不同的线。"},{"ch":23,"id":"c23-s013","title":"二十三·十四　知识管理只保留有再用价值的结构","text":"一条笔记可以包含问题、结论、证据、条件、例子和下一次使用场景，不必全部都有。若只是临时办事，完成后可以归档或删除；若是可重复方法，保留步骤和失败条件；若是重要决策，保留当时依据与未确定部分。  文件命名和目录以将来找得到为目标，不以复杂为目标。把当前版本与历史版本区分，重大修改留下原因。不要为了整理全部旧资料而永远不开始使用，也不要把收藏规模当成知识规模。  每隔一段时间检查实际检索：能否在需要时找到答案，是否出现互相冲突的版本，是否保存了太多没有授权的私人资料。知识库需要退出规则，否则会成为新的维护负担。"},{"ch":23,"id":"c23-s014","title":"二十三·十五　学习计划如何随年龄与能力改变","text":"儿童更需要成人提供材料、安全、反馈和自由探索，不把成人工作法完整下放。青少年可以参与规划与评价，逐步接管目标。成年学习者需要把时间、职业和照护预算算进去，不能假设每天都有完整安静时段。  高龄或存在感官、运动、认知困难时，调整字号、语速、输入方式、练习长度与反馈形式。目标可以是独立完成某个任务，而不必掌握整套系统。会用纸质方式的人没有义务为了证明跟上时代而放弃更可靠的接口。  真正需要帮助的是当前任务，不是一个抽象的年龄。先提供适配，再评价表现，才能避免把环境障碍当作个人能力结论。"},{"ch":23,"id":"c23-s015","title":"二十三·十六　结束学习也是一种判断","text":"当任务已经能够可靠完成，可以降低练习频率，转向维护或新的问题。不要因为课程还有很多、资料还没看完，就认为尚未获得使用资格；高风险专业任务的资格与监督要求则另行遵守。  当成本持续超过收益，也可以停止。停止前保留最有价值的结果，记录原因，未来条件改变再重新考虑。不是每个兴趣都必须变成专长，每个专长都必须变成职业。  展开：U 学习闭环——问题、尝试、反馈、迁移与停止 开始时写清一个可验收目标，确认必要材料与安全边界。先尝试，再补知识；需要记忆时加入提取，需要操作时加入真实练习。错误分类后只修最关键的一项。 结束时用自己的话说明获得了什么，在哪些条件下可用，仍有什么不知道。安排一次合适的后续使用或复习，而不是把所有内容无限加入每天日程。 没有新目标的日子，不必强行制造学习任务。真实生活、关系、休息与审美同样值得投入，人的价值不由每天新增知识量决定。"},{"ch":24,"id":"c24-s000","title":"二十四·一　先画一天的真实路线","text":"从起床到入睡，依次写出卧室、卫生间、厨房、通道、交通、工作场所和经常去的公共空间。对每个位置只问三件事：最可能造成严重伤害的是什么，最反复消耗体力的是什么，最容易在疲劳时出错的是什么。路线图比泛泛购买“健康家居”更容易找到优先项。  让不同家庭成员各自走一遍。儿童视线低，轮椅需要转弯空间，视力受限者依赖对比与稳定摆放，夜间照护者需要单手操作。一个对站立成人方便的设计，不一定适合其他人。改动应邀请实际使用者试用，而不是只由装修者或照护者决定。  先处理明显危险，再处理高频摩擦，最后才是美观与自动化。自动化不能替代机械上可靠的基本结构，也不能让断电或网络故障时连开门、照明和求助都无法完成。"},{"ch":24,"id":"c24-s001","title":"二十四·二　交通安全的每天动作","text":"每一程都正确使用安全带，不因路近、坐后排或使用网约车而省略。腰带贴近髋部而不是腹部，肩带经过胸部，不放在腋下或背后；孕期同样需要正确约束，腰带位于腹部下方的髋骨区域。 S135  儿童使用适合其年龄、体格与装置说明的安全座椅或增高座垫，并按照车辆与产品说明安装。升级依据实际适配和规定，不是孩子催促或到了某个方便的生日。抱在成人怀中不能替代儿童约束系统。 S136  出发前设置路线与必要信息，行驶中不手持处理消息。疲倦时不要用音乐、开窗或能量饮料证明自己还能撑；咖啡并不能可靠消除严重睡眠不足造成的驾驶风险。应在安全地点停止，安排休息、替代驾驶或其他交通。 S141"},{"ch":24,"id":"c24-s002","title":"二十四·三　步行、骑行和夜间出行","text":"选择路线时把过街、照明、车辆出入口、路面和可停留位置算进去，不只看地图最短距离。需要辅助器具的人，先核对路线是否实际可通行；平台标注与现场条件不符时，保留替代路径。  骑行及其他相关活动使用符合当地要求、适合活动与头围的头盔及必要防护，按制造商要求检查和更换。不要把头盔挂在车上当作装饰，也不因速度不快就忽略道路环境。儿童独立交通能力需要分步评估，不能只凭已经背会规则授权。  夜间出行提前知道回程、紧急联系和安全停留位置。陌生环境中感到不安全时，可以改变路线或求助，不需要为了显得礼貌继续接触。安全计划应该增加选择，而不是要求人永久不出门。"},{"ch":24,"id":"c24-s003","title":"二十四·四　水边安全：会游泳只是其中一层","text":"婴幼儿接触浴盆、泳池及其他水体时，需要明确且专心的成人看护；不要把看护责任交给“在场所有人”。围栏、适合的救生衣、游泳技能与成人监督共同构成防护，玩具浮具不能替代救生衣或看护。 S137  指定看护者后，交接必须有人明确接手，不能只喊一句“帮我看一下”便离开。照护者需要洗手、取物或接电话时，先把孩子带离危险，或完成真实交接。孩子已经上过游泳课，也不能自动获得无人看护的权限。  不会安全救援的人不要贸然下水成为第二个受害者。呼叫现场救援和当地急救，使用能够从安全位置提供的帮助，并按受训流程行动。呼吸异常或失去反应时进入急救路径，具体心肺复苏需要正规实操训练。"},{"ch":24,"id":"c24-s004","title":"二十四·五　烟雾、一氧化碳与火灾出口","text":"住所应有适合当地规范的烟雾报警器，并按照设备要求测试、维护和更换；装上以后长期不检查不等于已经获得持续保护。 S138 听力受限者需要考虑能够实际察觉的报警方式，不能只安装本人听不见的声音设备。  一氧化碳无色无味，燃烧设备必须正确安装使用，不能依靠闻气味判断是否安全。发电机、炭火等不得在室内或会使废气进入居所的位置使用；相应报警与设备维护按当地要求安排。 S37  疏散路线不被鞋柜、杂物和充电设备堵住。家庭成员知道出口和集合点，必要协助者有明确分工。发生火灾时优先离开危险并联系消防，不为取回手机、文件或宠物用品重新进入已经危险的场所；复杂情况听从现场救援。"},{"ch":24,"id":"c24-s005","title":"二十四·六　电、燃气、热源与清洁剂","text":"不使用破损电线、异常发热的插接设备或来源不明的充电器；维修涉及电气、燃气或承重结构时，交给符合当地要求的专业人员。本文不提供带电操作或燃气排故的自学流程。  热水、热饮、锅具和取暖设备考虑儿童及行动受限者的实际接触路径。端热物时先确认通道，避免同时抱孩子。调整设备温度和防烫措施时按家庭情况与专业建议，不能依靠所有人永远反应迅速来防止烫伤。  清洁剂保留原包装，按标签使用，不随意混合。药物、农药、清洁剂与食品分开并防止误取；不要用饮料瓶盛装。照护者视力或认知改变后，应重新评估标识和存放方式，而不只是重复口头提醒。"},{"ch":24,"id":"c24-s006","title":"二十四·七　空气、噪声与温度要服务实际需要","text":"通风、过滤、除湿和温度控制应根据污染来源、建筑条件与本人健康需要选择。不要因为一个设备显示某项数值良好，就认定所有空气风险已经消失；也不要不断追逐所有传感器读数而忽略明显烟雾、霉变或不当燃烧。  高温环境下，婴幼儿、老年人、某些慢病患者和户外工作者需要特别考虑降温与支持；不能只靠忍耐或一味喝水应对所有情况。高温相关不适及危险信号按当地卫生指导和医疗计划处理。 S39  噪声控制优先减少源头、距离和暴露，必要时使用合适防护；具体听力维护见卷十九。住宅隔声的实际价值在于能否睡眠、交流和工作，不只是材料宣传的单个数字。"},{"ch":24,"id":"c24-s007","title":"二十四·八　工作台与工具：减少长期别扭，而不追求唯一姿势","text":"把常用物放在容易达到的位置，调整屏幕和输入工具，使任务不必持续扭转、耸肩或前伸。不同任务可以使用不同姿势，并留出变化机会。没有必要整天维持一张图片规定的完美姿势，身体舒适与任务变化同样重要。  重复劳动、搬运、粉尘、化学品、噪声、夜班和极端温度等岗位，需要职业安全评估与相应防护。个人拉伸和补剂不能抵消缺失的工程控制与劳动保护。提出问题时说明具体材料、动作、时长和症状，便于专业人员判断。  居家工作同样需要结束与收纳。床、餐桌和工作台若长期混在一起，可通过时间和摆放创造可辨识的边界，不一定需要更大房子。优先解决最影响生活的一处，不把购买整套设备当作开始工作的前提。"},{"ch":24,"id":"c24-s008","title":"二十四·九　家务设计要允许疲惫的人完成","text":"把家务拆成完整链：发现、准备、执行、清理、补货。安排责任时明确由谁承接整条链，避免一个人永远作为后台调度者。无法完整交接时，也应说明各自负责哪一步，不靠猜测。  用品靠近使用地点，清洁工具容易取放，耗材设一个可见的补充信号。减少需要攀高、搬重物或反复往返的步骤。家务标准可以分为安全必需与偏好提升，资源不足时先保前者。  家庭成员的可用时间和能力改变后，分工也应改变。过去一直由谁做，不是永久义务的充分理由；收入高低也不能自动决定谁无权休息。共同生活的运行成本需要被看见。"},{"ch":24,"id":"c24-s009","title":"二十四·十　钱的第一用途是保护可持续生活","text":"财务安排先区分必要供给、固定承诺、可调整消费与风险投入。这里不推荐资产、收益率或统一储蓄比例，而提供判断问题：失去收入时哪些生活功能最先断裂，现有保障覆盖什么，哪些人依赖你，什么支出可以协商。  储备需要与实际风险匹配。稳定收入与灵活支出的人，和收入波动大、照护责任重的人，不必使用同一标准。储备不仅是账户金额，也包括可用公共服务、保险、支持网络和减少固定负担的能力；但不能把尚未得到确认的亲友帮助当成已存在的资金。  高风险决定前做生活压力测试：最坏情境是否影响住房、必要治疗、孩子或失能者照护。若会，必须把这些后果明确纳入，而不只计算平均收益。法律与投资判断需要相应专业支持，本书不为任何风险交易背书。"},{"ch":24,"id":"c24-s010","title":"二十四·十一　保险、保障与合同：看缺口，不只看名称","text":"了解自己所在地区可用的基本医疗、劳动、养老和其他保障，核对资格、等待期、报销或赔付条件、除外责任、续保与申请材料。制度会变化，实际决定以当前正式文件和合格解释为准。  商业合同同样需要知道谁承担什么、什么时候生效、哪些情况不承担、发生争议怎样处理。销售口头承诺应与正式文本核对。看不懂的重要条款可以请独立专业人员解释，不因为对方催促就跳过。  为家庭整理资料时，保留必要的合同位置、联系人和申请入口。不是让所有人知道全部资产细节，而是让发生紧急事件时，合法有权处理的人能够找到需要的信息。"},{"ch":24,"id":"c24-s011","title":"二十四·十二　诈骗防护：把“现在立刻”变成暂停信号","text":"冒充熟悉机构、制造危机或奖品、催促立即行动、要求特定异常支付方式，是常见诈骗信号。收到意外请求时，不使用对方提供的链接或号码直接核实，而通过自己已知可靠的独立渠道联系；先与可信赖的人讨论也有帮助。 S139  家庭可以约定大额或异常转账的第二次确认方式，尤其在紧急求助、变更收款账户或要求保密时。确认规则适用于所有年龄，不把年长者当作唯一可能受骗的人。  已经遭遇损失时，尽快联系相关金融机构、平台和当地执法或消费者保护渠道，保存必要记录。不要因为羞耻继续隐瞒，也不要再支付所谓“追回资金保证费”来弥补第一次损失。支持者先协助止损，不以嘲笑阻断后续求助。"},{"ch":24,"id":"c24-s012","title":"二十四·十三　账户安全从最重要的入口开始","text":"优先保护主要邮箱、手机账户、支付和重要资料账户。使用强且不重复的密码，合适时使用密码管理工具，并启用可用的多因素认证；保持设备和软件安全更新。 S140 具体方式按当前产品说明，不能由旧截图推导权限。  恢复信息必须自己能够取得。换号、搬家或失去旧设备时及时更新恢复渠道，妥善保存备用恢复材料。安全措施若导致本人永久无法进入必要账户，也没有完成目标，因此需要提前测试恢复路径。  共享设备分清账户与权限。照护者协助不等于拥有无限浏览权，儿童使用也不等于所有家庭资料应该暴露。授权应当与任务相称，完成后可以撤回。"},{"ch":24,"id":"c24-s013","title":"二十四·十四　同步、备份与恢复是三件事","text":"同步使多处保持一致，因此错误删除也可能同步过去；备份需要保留能够恢复的独立副本或历史版本。这个区别来自机制本身：若所有副本都会跟随同一个错误变化，就不能依靠它们应对该错误。  选择少量真正重要的数据先保护，例如身份与法律文件、不可替代照片、工作成果和关键医疗资料。记录主副本在哪里、多久更新、谁有权限、设备失效后怎么恢复。不要把所有资料无差别复制十份，却不知道哪份当前有效。  定期恢复一个小样本，确认文件能打开、密码可用、内容正确。恢复演练的范围要安全，不覆盖现有唯一副本。云服务和本地设备各有条件，目标是可恢复，不是押注某一种介质永远不会出问题。"},{"ch":24,"id":"c24-s014","title":"二十四·十五　隐私、监测与家庭自动化","text":"安装摄像头、定位、门锁或健康监测前，明确目的、覆盖区域、谁能看、保存多久、报警由谁响应。卧室、卫生间和私人谈话等情境尤其需要尊重隐私与法律。不能因为设备属于房主，就默认所有人同意被持续观察。  自动提醒应当减少漏事，不制造全天警报。每个警报都有响应规则，长期误报则需要修正；没有人负责处理的警报只是把压力转给所有人。关键系统应保留安全的人工替代和退出方式。  对认知或行动受限者，优先采用最少限制、能实现目标的支持。技术可以协助，但不能以“为了你好”为由跳过本人能够参与的决定。"},{"ch":24,"id":"c24-s015","title":"二十四·十六　突发事件的家庭运行方案","text":"按照所在地常见风险和官方要求准备必要物资与联系计划，不复制不适合自己地区的灾害清单。考虑水、食物、必要药物、照明、通信、特殊设备、婴儿与宠物需要，以及无法自行撤离者的支持。  明确失联时怎样集合、谁联系外地亲友、学校或机构怎样交接。纸质联系方式与离线资料能减少对单一设备的依赖。物资按实际储存条件与有效期维护，不为囤积牺牲日常通道和预算。  发生事件后，优先官方应急指引和现场安全。不要为了打卡生活计划而外出运动、取快递或继续既定旅行。正常协议暂停并不是失败，而是系统按风险正确切换。  展开：G 外部环境维护——日常、定期与变更后 日常只检查将要使用的关键接口：交通约束、通道、热源、必要用品和当天工作风险。发现明显危险先停止相关操作并寻求合适帮助，不把修理所有设备变成个人义务。 定期维护报警、合同与保障资料、账户恢复和数据备份。频率按实际风险、设备说明和变化决定，不给所有家庭统一加一套复杂日历。 搬家、添新成员、病情变化、换设备或更换照护者后，重新走一次真实生活路线。环境的验收是让人更安全、更省力、更能自主，而不只是看起来更智能。"},{"ch":25,"id":"c25-s000","title":"二十五·一　怎样读这张索引","text":"本卷覆盖出生后零至一百周岁，受精至出生的索引在卷二和卷三。零岁并不省略婴儿月份：出生后的逐日任务见卷四，满月后的逐月任务见卷五。此处的年度主题用于快速定位和补充观察，不替代更细的分龄内容。  每个年龄条目包含一个可移动的年度主题。它不是医学上只在该年开放的窗口，也不表示此前可以忽略、此后无法补做。成人主题尤其是一套作者编排的生活课题；某个问题已经发生，就立即按相关章节处理，不必等到排定的生日。  普通日只执行相应基础协议与当前计划。主题可以在一段合适时间内了解、试行、复核，完成后折叠，不需要全年每天重复。没有相关情境、已经掌握或者当前资源不足时，跳过、提前或后移都可以。条目中的帮助和照护只在实际需要时启用，年龄本身不构成失能判断。"},{"ch":25,"id":"c25-s001","title":"二十五·二　出生前的定位","text":"受精日及其后约两周使用卷二的受精时钟；确认妊娠后，产检与孕期任务按医疗团队确认的临床孕周进行。不能将估计的受精日直接当作临床孕周起点。临床孕四至十二周见卷二，十三周至出生见卷三；任何症状、早产或高风险路径均优先于普通日历。"},{"ch":25,"id":"c25-s002","title":"二十五·三　年度卡片","text":""},{"ch":25,"id":"c25-s003","title":"0岁｜照护者共享的事实","text":"把喂养、复查和必要处置信息放在一份共同记录中，让另一位照护者能接手一轮。新的价值不在记录更多，而在减少两个人各自以为对方已经做过的遗漏；稳定后删去不再影响决定的字段。  分龄入口： 卷04 ； 第一年月龄变化 。"},{"ch":25,"id":"c25-s004","title":"1岁｜可到达的世界","text":"从孩子的高度观察一条生活路线，找出想参与却够不到的安全用品。只改一个位置，让其能够自己拿取或归还；危险物仍由成人管理，不以探索为由开放全部抽屉。  分龄入口： 卷06 。"},{"ch":25,"id":"c25-s005","title":"2岁｜一个可以表达的拒绝","text":"选择日常的小场景，示范怎样说不要、想换一种或需要帮助。成人至少兑现一次合理拒绝，让语言真的能改变环境；必要安全边界由成人平静保持，不靠争赢孩子维护。  分龄入口： 卷06 。"},{"ch":25,"id":"c25-s006","title":"3岁｜两个人不同的想法","text":"共同搭建一个小场景，各自说希望增加什么，再找能同时保留双方想法的办法。活动不要求最后一致，重点是第一次看见合作可以包含差异，而不是只有服从或抢夺。  分龄入口： 卷07 。"},{"ch":25,"id":"c25-s007","title":"4岁｜预测之后允许改口","text":"用安全材料做一次结果不明显的小观察，先说猜想，再看实际发生什么。成人也公开修正自己的猜想，使改变看法成为有依据的行动，而不是输掉面子。  分龄入口： 卷07 。"},{"ch":25,"id":"c25-s008","title":"5岁｜把指令交给别人试用","text":"让孩子告诉成人怎样完成一个简单收纳或游戏动作，成人按字面执行，再一起改进不清楚的地方。这是在体验表达需要考虑听者，不是检验孩子是否已经像成人一样精确。  分龄入口： 卷07 。"},{"ch":25,"id":"c25-s009","title":"6岁｜找得到帮助的地图","text":"在熟悉场所共同标记厕所、出口和可以求助的成人位置，使用真实走访而不只背诵。场所改变后更新地图；知道位置不等于获得独自穿越交通或离开看护的权限。  分龄入口： 卷08 。"},{"ch":25,"id":"c25-s010","title":"7岁｜保留一张有用的错误","text":"从一次学习或生活失误中挑出一个可改变的步骤，画出下一次的提醒。只保留这张卡到问题改善，不把全部错误长期陈列，让记录服务行动而不是固定自我评价。  分龄入口： 卷08 。"},{"ch":25,"id":"c25-s011","title":"8岁｜邀请真实使用者反馈","text":"完成一个小作品后，请实际使用者指出一处好用和一处不方便。先听再修改，不急着解释自己多努力；成人帮助区分可采纳反馈与单纯个人口味。  分龄入口： 卷08 。"},{"ch":25,"id":"c25-s012","title":"9岁｜拆开一次购买愿望","text":"看到想买的东西，分别说明想获得的体验、物品本身与持续费用。寻找一个可借用或低成本试用方式，体验后再决定；不通过故意羞辱消费欲望来教育节制。  分龄入口： 卷08 。"},{"ch":25,"id":"c25-s013","title":"10岁｜估计和实际的差距","text":"挑一个普通任务，先估计所需步骤和时间，结束后比较实际。只问漏掉了什么，不把估计错误当成失信；用结果调整下次安排，而不是要求从此永远准时无误。  分龄入口： 卷08 。"},{"ch":25,"id":"c25-s014","title":"11岁｜把建议改成请求","text":"在一次家庭协作中，练习说明事实、影响和一个具体希望。听者可以提出替代方案。目标是让孩子体验协商，不是要求其用完美措辞才有资格表达不舒服。  分龄入口： 卷08 。"},{"ch":25,"id":"c25-s015","title":"12岁｜私人信息分层","text":"共同区分可公开、只给熟悉的人、只给必要专业人员和需要保留的资料。拿一次真实上传或拍照决定练习，允许本人对非必要公开说不，并说明安全求助的例外。  分龄入口： 卷09 。"},{"ch":25,"id":"c25-s016","title":"13岁｜尊重一个撤回的同意","text":"从合照、借物或游戏开始，练习答应之后仍可改变主意。别人撤回时先停止，不追问到对方屈服；把这条规则迁移到身体边界，相关法律与保护要求另行遵守。  分龄入口： 卷09 。"},{"ch":25,"id":"c25-s017","title":"14岁｜预先写好退出句","text":"为不愿参与的危险或越界场景准备一句短句和一个可用接应方式。练习离开而不是辩论胜利；实际需要求助时先保障安全，之后再讨论经过。  分龄入口： 卷09 。"},{"ch":25,"id":"c25-s018","title":"15岁｜删掉一项不现实承诺","text":"把一周的学校、交通、生活和恢复全部写入同一张时间图，找到重叠部分。协商减少或延后一项任务，亲自体验容量管理不是懒惰，而是让承诺变得真实。  分龄入口： 卷09 。"},{"ch":25,"id":"c25-s019","title":"16岁｜观察一种职业的普通日","text":"询问从业者一天最常做、最枯燥和最需要判断的事情，再做一个安全的小样任务。比较想象与实际，保留不喜欢的发现；探索无需立刻宣布终身专业。  分龄入口： 卷09 。"},{"ch":25,"id":"c25-s020","title":"17岁｜自己完成一次问诊表达","text":"提前整理症状和问题，在合适的监护与医疗框架下由本人先说明，结束时复述下一步。成人补充而非全程抢答；目标是逐步参与，不是突然撤掉支持。  分龄入口： 卷09 。"},{"ch":25,"id":"c25-s021","title":"18岁｜承诺的四个角","text":"选一份即将接受的真实安排，写明自己要做什么、对方要做什么、何时结束和退出会怎样。看不懂的重要部分先核实，不用成年身份替代理解，也不为训练独立越过法律权限。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s022","title":"19岁｜第一次可逆的生活试验","text":"选择一个可安全撤回的改变，例如学习时段或物品位置，先写预期，再试用。结束后看便利是否真实增加，允许恢复原样；不要把药物、极端饮食或睡眠剥夺作为个人试验材料。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s023","title":"20岁｜建立低精力备用餐","text":"按当前居住条件准备一套在疲惫时仍能安全取得的普通餐食方案。确认购买、储存、加热和清洁都可完成，避免计划只在精力充沛的周末成立。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s024","title":"21岁｜向一个领域提出好问题","text":"联系愿意交流的从业者或教师，提出一个已经做过基础了解的问题。说明自己卡在哪里，交流后用实际行动检验答案；不以收集名人联系方式代替学习。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s025","title":"22岁｜记录一次完整交付","text":"保存一个项目的目标、约束、个人贡献和实际结果，并将敏感资料脱敏。以后展示时能够说明做了什么，而不是只展示漂亮页面或把团队全部成果归为自己。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s026","title":"23岁｜把模糊工作问清楚","text":"收到新任务时确认使用者、截止时间、可交付形式和验收方式。先完成一个小样减少方向误差，再投入大量时间；把提问看作工作的一部分而不是能力不足。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s027","title":"24岁｜识别一种不适合自己的成功","text":"写出一个很受赞赏、却需要你长期接受不愿承担代价的目标。区分真正在意的部分和社会包装，寻找不同路径；不是所有高地都值得由你去占领。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s028","title":"25岁｜技能的第二种用途","text":"选择一项已有能力，尝试用于表面不同的小问题，并写出哪些部分迁移成功、哪些不适用。不要因为一次有效就升格为万能方法，保留环境与权限边界。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s029","title":"26岁｜财务承诺的压力测试","text":"对一项较大承诺模拟收入降低或意外支出，检查基本住房、食物与医疗是否仍可维持。金额和安排由实际情况决定，涉及合同或投资时寻求独立专业解释。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s030","title":"27岁｜协作前讨论冲突","text":"在共同项目或共同生活开始前，讨论意见不同时怎样决定、暂停和退出。把最难开口的问题提前说清楚，不假设关系好就不会出现不同目标。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s031","title":"28岁｜维护一个不靠工作的关系","text":"安排一次没有业务交换目的的共同活动，关注对方实际经历而非只更新成就。活动要能重复且双方愿意，不把友情维护变成新的绩效任务。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s032","title":"29岁｜给十年目标做去名词化","text":"把房子、职位、婚姻或创业等名词改写为希望获得的功能，例如稳定、自由、连接或创造。再比较实现这些功能的不同方式，减少被单一外观锁定。  分龄入口： 卷10 。"},{"ch":25,"id":"c25-s033","title":"30岁｜画出生活的单点依赖","text":"找出一旦自己或某件设备失效就会停摆的关键事务，为其中一项建立可靠接续。备份必须有人能用，不只是一份没人知道放在哪里的文件。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s034","title":"31岁｜把家务交出完整链条","text":"选择一项反复劳动，让接手者同时了解发现、计划、执行和收尾。双方约定足够好的标准，原负责人不在后台继续承担所有提醒与验收。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s035","title":"32岁｜取消一个低价值入口","text":"统计一种反复打断自己的消息或会议，判断它是否真正需要即时响应。调整入口、时间或责任人，观察重要事情是否仍能及时处理，而不是只增加个人忍耐。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s036","title":"33岁｜学会写一个有边界的答应","text":"接受帮助请求时说明能做的范围、时间和不能承担的部分。把善意变成可兑现行动，不通过无限承诺积累未来的怨恨和突然失联。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s037","title":"34岁｜把恢复条件说给别人听","text":"向共同生活者或合作方说明哪一种中断最耗损自己，以及一个具体可行的调整。恢复不必被解释成特殊奖励，而应像其他资源一样进入协作安排。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s038","title":"35岁｜检查一次长期默认选择","text":"挑一项多年未重新讨论的安排，核对当初理由是否仍成立。先进行小范围调整，不为证明改变同时重置所有生活；保留仍然有效的部分。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s039","title":"36岁｜把照护时间画成时段","text":"有照护责任时，记录不可离开的具体时段与夜间打断，而不只计算总小时。没有相关责任者可用来检查其他支持任务，找出真正需要替班的位置。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s040","title":"37岁｜为自己的医疗资料做导航","text":"将重要诊断、过敏、药物和未闭环事项整理成一页索引，原始报告另存。测试能否在就医时迅速找到，删除重复或过时的版本。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s041","title":"38岁｜重新分配一项隐形劳动","text":"注意是谁总在记生日、发现缺货、安排预约或安抚冲突。选择一项公开讨论并重新承担，不把情绪与行政劳动因为难计时就视为不存在。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s042","title":"39岁｜允许一个目标正式结束","text":"回顾一个持续耗损却不再认同的目标，处理相关责任后决定停止或降级。保留已有成果，不因沉没成本要求未来继续支付。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s043","title":"40岁｜写一份功能愿望而非年龄愿望","text":"描述十年后仍希望独立完成的真实活动，再找到现在最值得维护的一项基础能力。不要用看起来年轻几岁代替可参与的生活目标。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s044","title":"41岁｜检查一种舒适的惯性","text":"挑一个因为熟悉而一直保留的流程，询问它是否仍节省时间、减少风险或带来快乐。没有价值的部分可以删掉，不必等它造成严重问题才调整。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s045","title":"42岁｜向下一代传一个判断过程","text":"讲述一次真实决定时，同时说明约束、未知和当时的取舍，不只给出正确答案。没有子女也可以向同事或朋友分享，让经验可被理解而不是被膜拜。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s046","title":"43岁｜为关系安排一次无任务会面","text":"与重要的人见面时，不把谈话全部用于分工、孩子或账单。可以谈尚未形成结论的想法，允许关系存在于共同管理之外。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s047","title":"44岁｜盘点自己仍想第一次做的事","text":"列出几项没有重大不可逆风险的新体验，选最容易开始的一项。目的不是赶在某岁前完成清单，而是验证学习和好奇仍有进入生活的通道。  分龄入口： 卷11 。"},{"ch":25,"id":"c25-s048","title":"45岁｜让预防项目有负责人","text":"对已经由专业人员确认需要的检查，明确预约、结果解释与后续处理。不要因为收到报告就当作完成，也不因年龄卡出现某主题自行追加筛查。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s049","title":"46岁｜讨论一项身体变化的实际影响","text":"把不适描述为具体任务受限，而不只用越来越老概括。带着时间线和问题寻求合适评估，避免由广告替你决定原因与产品。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s050","title":"47岁｜清点拥有物的维护成本","text":"选择一类物品，计算存放、保养、耗材和寻找所需精力。留下真正服务生活的部分，处理不再使用的物品时注意隐私、环保与他人意愿。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s051","title":"48岁｜更新家庭应急角色","text":"确认主要联系人不在时谁能接手，谁知道药物资料和必要钥匙。演练只在安全条件下进行，不制造真实危险来检验家人是否关心。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s052","title":"49岁｜给下半程留下空白","text":"在未来几年规划里保留可调整资源，不把所有时间与经济能力预先锁死。空白可以用于疾病、学习、关系和意外机会，不是计划不完整的缺点。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s053","title":"50岁｜重看衡量成功的尺子","text":"列出目前最影响满意度的三种生活功能，再检查日程是否向它们分配资源。若目标与实际投入长期相反，先改一项承诺，不急于寻找更强的自律方法。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s054","title":"51岁｜与父母或长辈核对偏好","text":"在对方愿意且适用时，询问希望怎样获得帮助、谁可参与医疗讨论。没有相关长辈者可以整理自己的偏好，重点是让本人表达而不是替其预设。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s055","title":"52岁｜检验一次信息恢复","text":"从安全备份中恢复一个不影响原件的小样，确认能打开、权限可用且内容正确。备份的价值在恢复，不在硬盘数量或云端图标。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s056","title":"53岁｜寻找一种更轻的参与方式","text":"对仍喜欢但负担增加的活动，调整交通、工具、时长或角色。先尝试改变接口，不因无法按原方式完成就立即放弃整个兴趣。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s057","title":"54岁｜给经验增加反例","text":"写下一条过去常用的经验，再找出它不适用的条件。向别人分享时一起说明边界，让经验保有价值而不变成阻止变化的权威。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s058","title":"55岁｜试过一种未来作息","text":"在可行范围内体验工作量减少后的普通一周，观察活动、关系和独处的真实感受。不要用假期的兴奋推断长期生活，也不预设所有人必须退休。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s059","title":"56岁｜把收入与身份分开讨论","text":"分别说明工作提供的经济、贡献、结构和社交功能，看看哪些可以有其他来源。这样即使职位变化，也不必让整个人的价值同时失去支撑。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s060","title":"57岁｜更新住宅的高频接口","text":"选择一次最费力的取物、洗浴或出入过程，改变高度、照明或路径。涉及承重与电气等安全改动交给专业人员，不把适配变成危险手工。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s061","title":"58岁｜建立一项跨代共同任务","text":"与不同年龄的人完成一个双方都有贡献的小项目，避免一方只负责教、一方只负责听。共同结果可以是菜谱、故事、工具说明或社区小事。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s062","title":"59岁｜清理不再需要的证明","text":"识别一项主要为证明自己仍年轻、仍成功或仍被需要而承担的负担。决定是否保留真实喜欢的部分，让选择回到本人而不是观众。  分龄入口： 卷12 。"},{"ch":25,"id":"c25-s063","title":"60岁｜设计自己的普通星期","text":"安排少量稳定锚点与可自由变化的时间，分别容纳生活维护、参与和恢复。普通星期能持续，比一次盛大的转型计划更值得测试。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s064","title":"61岁｜给新技术一个具体用途","text":"只选择一个需要完成的目标学习工具，例如联系、预约或获取资料。完成后再扩展，不用掌握所有功能来证明跟上时代。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s065","title":"62岁｜让公共空间更可用","text":"实际走访一个经常使用的地点，记录入口、座位、厕所和沟通障碍。能自行调整的先改，需要机构处理的提出具体反馈，而不只忍耐。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s066","title":"63岁｜给朋友网络增加一种连接","text":"选择一项可重复且低压力的共同活动，邀请适合的人参与。关系不必都很深，但应有本人愿意进入的机会，不把社交数量当任务。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s067","title":"64岁｜把专业知识写成操作例子","text":"选择一件自己熟悉的事，用一个真实但脱敏的案例说明怎样判断。让初学者试读并提出疑问，留下可用经验而不是只留下术语。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s068","title":"65岁｜共同观察一次真实功能","text":"以本人愿意的生活任务为参照，了解哪些步骤顺利、哪些需要工具或协助。不是家庭竞赛；有安全疑虑的测试交由专业人员指导。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s069","title":"66岁｜明确一个可以拒绝的责任","text":"对持续被期待承担的事务，说明自己仍愿意做多少、何时需要替代。经验与亲情不意味着永远没有退出权，交接可以体面而清楚。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s070","title":"67岁｜选择一种不靠排名的活动","text":"加入或保留一个允许不同能力参与的兴趣环境，关注体验和连接。若活动不断制造羞辱与比较，可以换形式，不必放弃整个兴趣。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s071","title":"68岁｜给远行做一次小规模试用","text":"先体验较短路线，核对休息、交通、用品和返回能力。用实际负担调整长途计划，不因同行者节奏快就压过自己的需要。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s072","title":"69岁｜检查重要资料的合法接续","text":"确认在本人无法临时处理时，合适且有权的人怎样获得必要信息。正式授权按当地法律办理，便利不能替代隐私和权限。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s073","title":"70岁｜让帮助只覆盖受限步骤","text":"试着把一件困难任务拆开，保留本人能完成且愿意完成的部分。帮助不应自动扩大到全部生活，也不要求为了独立拒绝必要工具。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s074","title":"71岁｜为一个常见故障准备替代","text":"选择停电、手机失灵或主要交通中断中的一个情境，准备可用的联系与生活路径。无需制造恐慌，只确认关键需要不会立即失去入口。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s075","title":"72岁｜重新选择想贡献的地方","text":"问自己现在愿意把经验和时间给谁、给什么问题。贡献可以小而稳定，也可以选择不承担额外事务；价值不由他人需要的程度决定。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s076","title":"73岁｜把感官障碍说具体","text":"若有看不清、听不清或交流困难，说明发生在哪种环境和任务中，再寻找适配或评估。不要把退出活动全部解释成不感兴趣。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s077","title":"74岁｜听一次没有结论的谈话","text":"与重要的人交流尚未想清楚的愿望或担忧，不急着提出方案。对方的作用可以只是理解，关系不必每次都产出行动清单。  分龄入口： 卷13 。"},{"ch":25,"id":"c25-s078","title":"75岁｜更新协助地图","text":"按任务注明独立、工具、提醒和协助的需要，并由本人参与决定。只开启实际需要的分支，不用年龄给所有能力统一降级。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s079","title":"76岁｜为夜间路线做单独检查","text":"在安全条件下核对照明、通道、必要助具和求助入口。问题若来自新发头晕或不稳，应就医评估，不能只通过限制饮水或禁止起夜应付。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s080","title":"77岁｜减少一项治疗行政负担","text":"找出最费力的预约、取药或资料提交过程，与团队或支持者商量简化。简化的是流程，不是自行停掉必要治疗；保留结果和随访闭环。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s081","title":"78岁｜把喜欢的活动改成坐着也能参与","text":"对适用的人，尝试调整桌面、工具或角色，使活动不完全依赖站立与长距离移动。若不需要适配，继续原方式，不为年龄制造限制。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s082","title":"79岁｜给照护者写一条真实偏好","text":"说明一种让自己舒服或不舒服的照护方式，例如先解释、慢一点或保留私人时间。偏好应进入实际执行，不只写在无人阅读的档案里。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s083","title":"80岁｜比较治疗收益与生活负担","text":"带着本人最在意的功能，与医疗团队讨论目前计划是否仍合适。不同疾病建议需要协调，不能由家属自行停药，也不必追求所有数字同时最激进。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s084","title":"81岁｜为交流留出更合适的条件","text":"选择光线、噪声、距离和时间更合适的环境，允许文字或辅助工具。不要用快速回答测试理解能力，先让信息确实能够到达。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s085","title":"82岁｜选择一件想教而不是被安排的事","text":"由本人决定分享什么、向谁分享和何时结束。接收者尊重节奏，不把经验交流变成录制全部人生的义务。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s086","title":"83岁｜处理一个反复找不到的物品","text":"和本人一起确定固定位置、标识与替代方案，先解决环境问题。不要未经说明重排全部物品，再把寻找困难归为记忆退步。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s087","title":"84岁｜把探访改成真正喜欢的形式","text":"询问喜欢短时间、散步、共同吃饭还是安静陪伴，减少仅为热闹的密集来访。客人离开后仍有生活需要，探访不应耗尽全部精力。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s088","title":"85岁｜测试照护替班是否真实可用","text":"让备班者在安全监督下完成必要任务并能找到当前计划。主要照护者能够真正离开休息，才算形成替班，而不只是多一个联系电话。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s089","title":"86岁｜为无聊准备可自主选择的材料","text":"放置本人能方便取得的图书、音乐、手工或其他兴趣材料，允许随时停止。娱乐不必全部由机构统一播放，也不要求每项活动都有治疗目标。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s090","title":"87岁｜留下一个由本人纠正的故事","text":"记录一段愿意分享的经历，让本人检查、修改并决定谁能看到。记忆中的不确定可保留，不为了故事完整而补造细节。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s091","title":"88岁｜确认最重要的就医问题","text":"预约前由本人选出最想解决的两三件事，照护者再补充安全相关信息。不要让就诊只围绕陪同者方便，而漏掉真正影响舒适的困扰。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s092","title":"89岁｜减少一次不必要的往返","text":"检查能否合并合理事务、改善交通或使用适合的远程沟通。便利不能牺牲需要面对面评估的内容，是否可替代由实际问题决定。  分龄入口： 卷14 。"},{"ch":25,"id":"c25-s093","title":"90岁｜重申今天仍然属于本人","text":"问希望怎样度过普通一天，而不只安排庆寿和体检。身体需要支持时提供支持，仍然允许兴趣、亲密、拒绝和无所事事。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s094","title":"91岁｜保留一个自己决定的时段","text":"在必要护理之间留一段本人可选择的时间，不预先填满节目。有人希望聊天，有人希望安静，照护记录应容纳这种差异。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s095","title":"92岁｜给选择增加表达时间","text":"提出少量清楚选项后等待，必要时使用图片、文字或熟悉动作。不能因回答慢就立即替代决定，也不把无法口述等同没有偏好。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s096","title":"93岁｜让一个熟悉体验重新可及","text":"寻找因工具、交通或感官障碍而中断的兴趣，尝试安全适配。体验可以缩短或改变形式，不要求恢复到几十年前的表现。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s097","title":"94岁｜检查疼痛与不适是否被听见","text":"用本人能使用的方式表达位置、情境和影响，必要时寻求专业评估。不要把不适自动归为年龄，也不要让无法清楚说话的人失去被观察的机会。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s098","title":"95岁｜由本人挑选想保留的物件","text":"选择少量有意义的物品并说明希望怎样处理，尊重不想解释的部分。整理不是提前清空人生，也不由他人只按市场价值决定。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s099","title":"96岁｜给重要的人留一种合适的话","text":"可以是一封短信、一段录音或当面表达，内容由本人决定。允许只是日常喜欢和感谢，不要求庄严总结，也不把未完成当遗憾债务。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s100","title":"97岁｜确认支持计划仍尊重隐私","text":"检查来访、监测、身体护理和资料共享的实际范围，删除不必要的侵入。更多照护需要不等于本人自动失去私人生活。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s101","title":"98岁｜允许一次临时改变主意","text":"当天原定活动若不再想做，可以调整；必要医疗决定则与团队沟通。自主不仅是曾经签过文件，也包括现在仍可表达新的偏好。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s102","title":"99岁｜减少为别人展示健康的负担","text":"不要求在聚会、采访或镜头前证明长寿秘诀。本人可以分享，也可以休息；个体经历不必被包装成适用于所有人的因果公式。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s103","title":"100岁｜继续生活，而不是完成终章","text":"百岁不是停止日程的开关。仍按实际功能、疾病计划和本人愿望安排今天；有临终需要才启用相应照护分支，不因生日自动预设生命末期。  分龄入口： 卷15 。"},{"ch":25,"id":"c25-s104","title":"二十五·四　主题完成后的归档","text":"完成一张卡时，留下的结果应是一个可使用的改变：明确的联系人、合适的位置、一次实际反馈、可执行的交接，或者一个已经作出的选择。只有思考没有行动并不总是失败，但需要区分现在是探索还是执行，避免把收藏卡片当作改变生活。  不必保存所有过程。已经稳定的做法只保留简短规则；尚有风险的保留条件与下一次复核；决定不做的也可以记下原因，避免每年重新陷入同一场没有新增证据的争论。  如果某一年没有完成主题，下一年不需要叠加补课。重新选择当下最有价值的一个即可。这张表提供入口，不制造人生欠账。"},{"ch":26,"id":"c26-s000","title":"二十六·一　先做四个输入，不先填满日历","text":"每天只需要四类输入：今天所处生命阶段，今天的身体与心理状态，今天不可移动的责任，以及可用的人力、时间和物资。年龄决定入口，状态决定是否覆盖，责任决定真实容量，资源决定可执行版本。任何一个输入发生变化，都可能改变今天的安排。  这套编排不诊断疾病，不计算个体药物剂量，也不根据手表分数自动决定是否就医。个人医疗行动计划优先，危险信号调用安全卷。健康问题尚未明确时，计划可以保留不确定，而不需要为了生成完整日程假装已经知道原因。  一天的输出可以只有三行：沿用哪个基础协议，今天真正新增什么，出现什么情况停止或求助。输出越短越容易执行，详细解释已经存放在相应章节中，不必每天重新打印整本书。"},{"ch":26,"id":"c26-s001","title":"二十六·二　日期覆盖表：不让边界日掉进空隙","text":"时间区间 主要入口 日常继承 新增内容从哪里读取 受精日起、尚未进入已确认孕期计划 卷二 可能怀孕时的安全与医疗咨询 受精早期区间任务；不伪造精确着床日 医疗团队确认的临床孕早期 卷二 孕早期每日卡 对应孕周及个体检查安排 临床孕十三周至实际出生 卷三 孕期既有安全和照护 对应周准备；高风险路径覆盖 出生日至未满一个日历月 卷四 N新生儿、S安全睡眠，F在适用时 逐日与日龄区间任务 满一个月至未满一周岁 卷五 适龄喂养、睡眠与照护 每个月龄的新能力与环境调整 一至未满三岁 卷六 T幼儿 季度增量与实际准备条件 三至未满六岁 卷七 P学前 半年度主题与能力变化 六至未满十二岁 卷八 K学龄 逐年生活与学习责任 十二至未满十八岁 卷九 A青少年 自主、隐私、求助与责任递进 十八至未满三十岁 卷十 B基础与Y初成年 当前生活过渡与年度卡 三十至未满四十五岁 卷十一 B基础与M多重责任 责任、交接和恢复变化 四十五至未满六十岁 卷十二 B基础与R中年维护 风险、功能及已有预防安排 六十至未满七十五岁 卷十三 O自主老年及适用B 本人参与目标与功能变化 七十五至未满九十岁 卷十四 适用O与必要支持 按具体任务启用协助 九十至一百岁及以后 卷十五 适用O、支持和本人选择 不自动启用临终；按实际情况覆盖  “未满”表示不含下一个边界日，满龄当天进入下一行。生日并不使旧技能失效，也不要求一夜之间更换全部安排。入口切换只是避免漏读可能有用的新问题，真正行动仍以能力和情境为准。"},{"ch":26,"id":"c26-s002","title":"二十六·三　出生后第几天、满几个月与几周岁怎样协调","text":"日龄由出生日期到目标日期实际经过的天数计算。月龄和周岁用日历周年，而不是把一律三十天当一个月、三百六十五天当一年。出生在月末时，下一个月没有同日，可以在本书定位器中按该月最后一天作阅读索引；这是一项软件约定，不是医疗或法律年龄定义。  同样，二月二十九日出生者在非闰年按二月最后一天切换本书的周年入口。涉及法定年龄、保险、学校资格和医疗月龄的实际认定，使用负责机构的规定。定位器只帮助找书，不替这些机构作决定。  未满一个月的日子一律仍可使用新生儿基础协议。某个月较长，日龄二十九或三十尚未满月时，继续沿用卷四后期照护与个人随访；较短月份已经满月时，进入月龄入口，不再为了“补齐三十天”重复前段任务。"},{"ch":26,"id":"c26-s003","title":"二十六·四　每天的覆盖顺序","text":"最高优先级是急迫安全问题，其次是当前个人医疗行动计划，再次是基本照护与供给，然后是不可移动责任，最后才是新增能力与探索。这个顺序避免某项普通好习惯在错误情境中造成伤害。  比如平时鼓励活动，遇到需要急诊的症状就停止；平时鼓励饮食多样，遇到明确过敏和疾病饮食就适配；平时鼓励自主，遇到实际无法安全转移时提供合适协助，但不因此取消其他决定权。  覆盖不是把整个人生清空。只暂停冲突部分，其余安全且本人愿意的生活继续。一个正在治疗的人仍可以读书、选择音乐、联系朋友；一个需要休息的人仍可以有重要意见。"},{"ch":26,"id":"c26-s004","title":"二十六·五　七个轮换主题，不是七条强制任务","text":"第一天看恢复：哪一项负担值得减轻。第二天看环境：哪一处反复让任务困难。第三天看能力：哪一个小技能值得练习。第四天看关系：哪一次联系或协商真正需要发生。第五天看资料：哪件到期或未闭环事项需要处理。第六天看体验：有没有一种安全而愿意的新接触。第七天看回顾：保留什么，停止什么。  这一轮换可以对应星期，也可以按轮班、照护或学习周期移动。它不要求每天完成一个项目，主题只是提醒，不是欠账。婴幼儿的主题由照护者使用来改善环境，不要求孩子执行成人维护任务。  若本周已经有重大事件，整轮可以暂停。若没有新增问题，继续基础协议即可。没有变化的一天不需要为了显得充实而创造一次购物、一次检测或一次自我挑战。"},{"ch":26,"id":"c26-s005","title":"二十六·六　第一次使用本书的二十八天启动页","text":"下面是一份可选的成人或照护者启动顺序。已完成的直接跳过，资源不足时延后，有疾病时先用个人计划。安全、必要用药、喂养与其他时间敏感事项在需要的当下处理，不等此表排定的某一天；这里只安排复核、学习和系统搭建。它的用途是把系统搭起来，而不是在二十八天内改造身体。每项都引用既有解释，不重复展开医疗操作。  **第一天：确定一个真正目标。**写今天最希望维持或改善的生活功能，不写笼统的成为最好版本。用卷〇检查目标是否属于本人。  **第二天：找到紧急入口。**确认当地急救方式、住址和一个实际可联系的人。检查信息离线时是否仍能取得，详见卷一。  **第三天：统一当前药物资料。**有用药者核对当前版本和负责者；无用药者不用为完成任务购买产品。操作边界见卷二十。  **第四天：走一次夜间路线。**在安全条件下检查照明和通道，只修一个明显障碍。存在头晕或不稳时不进行无保护挑战。  **第五天：准备低精力餐。**让备用方案覆盖获得、储存和清洁，而不只是一张营养菜单。食物安全调用卷十七。  **第六天：观察真实睡眠机会。**记录工作结束、准备入睡和必须起床之间实际留出的空间。先看机会是否足够，不立即追逐睡眠评分。  **第七天：删除一个无效提醒。**判断它有没有明确动作和实际价值。没有就取消，给重要信息留下位置。  **第八天：选择适合的活动起点。**使用卷十八的能力与风险分流，不以他人的最高水平决定今天强度。  **第九天：说明一个持续不适。**写清时间、情境与功能影响，按卷二十决定是否安排评估；没有不适则跳过，不主动寻找疾病。  **第十天：检查口腔操作是否能完成。**确认工具、清洁方式和必要协助，具体规则见卷十九，不增加无指征的产品。  **第十一天：调整一个阅读或工作界面。**改变字号、反光、位置或输入方式，比较真实任务是否更容易。  **第十二天：改善一次交流环境。**减少背景噪声、留出回应时间或使用更合适形式，不先评价对方理解能力。  **第十三天：保留一个无产出体验。**选择本人愿意的音乐、散步、观察或游戏，不要求它证明有益。  **第十四天：关闭一件医疗尾项。**取得结果解释、确认复查或联系负责者。没有尾项不新增检查，使用卷二十闭环规则。  **第十五天：核实一条重要信息。**选真正影响行动的主张，找到原始或负责来源，记录适用条件，见卷二十三。  **第十六天：把一个任务拆到能开始。**确定第一步、所需材料与结束条件，减少模糊带来的拖延。  **第十七天：请求一种具体帮助。**说明需要什么、何时需要和对方可以拒绝的范围，不让求助依赖猜心。  **第十八天：交接一条完整任务链。**检查接手者是否能独立完成必要步骤，而不是原负责人继续在后台管理。  **第十九天：核对一个固定支出。**知道金额、用途、续期和退出条件。财务法律问题使用当前正规解释，不凭印象处理。  **第二十天：保护一个关键账户。**按照当前平台规则检查密码、认证与恢复入口，详见卷二十四。  **第二十一天：恢复一个备份小样。**不覆盖原件，确认资料能使用。备份失败时先修复，不立即扩充更多存储。  **第二十二天：说清一个关系边界。**选择安全的普通场景提出具体请求；存在暴力或控制时不用普通沟通练习替代安全计划。  **第二十三天：给一个兴趣降低门槛。**减少材料、距离或时长，让它能够进入普通生活，而不是只适合假期。  **第二十四天：检查计划的总容量。**把交通、家务、照护和恢复一起算入，删去一个无法兑现的承诺。  **第二十五天：更新个人偏好。**写清希望怎样获得帮助、哪些资料不愿公开，以及谁可以参与必要讨论。  **第二十六天：选择一张年度卡。**从卷二十五挑当前最相关的一张，不因年龄而勉强执行不适用的主题。  **第二十七天：检验一次最低可行日。**只在安全前提下简化非必要任务，确保必要照护不会因为成人忙碌消失。  **第二十八天：删减而不是加码。**保留真正有用的改动，删除无效记录，明确下一次需要复核的少数事项。启动完成后不再每日重做启动页。"},{"ch":26,"id":"c26-s006","title":"二十六·七　普通上班日：把整段时间算完整","text":"假设一个健康成人早晨出门、白天工作、晚间回家。日程先安排实际需要的睡眠机会、清洁、进食、通勤和工作，再看活动与关系放在哪里。活动可以来自安全出行和专门练习，具体总量按运动卷；不能把通勤与运动占用同一分钟，却又在预算里各算一遍。  当日新增任务可以放在一个短而明确的窗口，例如整理医疗索引。若实际加班，应删去非必要新增项，而不默认压缩睡眠。晚间完成收尾后，允许娱乐与空白。一天不需要同时完成力量训练、长跑、语言课程、深度阅读、社交和全面家务。  若本人原来就有特殊时段工作，改用下一节的相对时序，不把某个起床钟点当作普遍美德。"},{"ch":26,"id":"c26-s007","title":"二十六·八　轮班日：相对于睡醒安排，而不照抄早九晚五","text":"将主要睡眠段、上班前准备、交通、工作和下班后恢复分别画出。优先处理下班后的困倦驾驶和睡眠环境，相关原则见卷十六与卷二十四。家务和社交预约放在实际清醒且有余力的位置。  轮班变化前，确认照护和用药等固定事项由谁承接；药物时点受时区或作息影响时咨询专业人员，不自行把所有处方简单平移。活动放在能持续的位置，不以牺牲主要睡眠段维持打卡。  对家庭来说，需要保护的是这个人的睡眠机会，不是要求其白天随时待命。白天在家不等于有空，夜间工作也不取消获得安静休息的权利。"},{"ch":26,"id":"c26-s008","title":"二十六·九　有婴儿的家庭日：按循环与交接编排","text":"婴儿调用N、S及适用喂养协议，不按成人钟点硬分。成人先分配每一段实际照护和休息机会，明确谁处理食物、清洁和来访。新增任务只选与当前月龄、安全或复查相关的一项。  当婴儿状态变化或喂养需要调整，先与相应人员确认，不为维持日历而忽略需求。主要照护者疲惫时，减少非必要记录和家务，而不是减少婴儿必要照护。家庭的“完成度”不能只看孩子，产妇和其他照护者同样需要供给和恢复。"},{"ch":26,"id":"c26-s009","title":"二十六·十　学龄与青少年日：学校已经占用了容量","text":"把学校、交通和作业作为真实任务加入，再安排活动、生活技能和休息。家长不应把孩子放学后的全部时间视为尚未使用的空白。新技能可以每周推进，而不每天增加一门课程。  出现学习卡点先分类，遇到身体或心理问题先分流，具体见卷八和卷九。晚间家庭交流不只检查成绩。考试周仍需保护最低生活底座，考后也不要求立即补完所有被暂停的项目。"},{"ch":26,"id":"c26-s010","title":"二十六·十一　功能受限者的一天：任务分段与选择权同时存在","text":"先确认个人行动卡和需要协助的步骤，将转移、进食、药物、清洁与必要治疗安排清楚。剩余时间仍由本人参与选择，不把护理之间的每个空隙都填成康复训练。  支持者到来与离开时完成实际交接。活动后症状可能延迟加重的人，按相关分支管理总负荷，不能只看当下是否能够完成。当天取消一个项目可能是在保护后续生活，而不是没有进步。"},{"ch":26,"id":"c26-s011","title":"二十六·十二　一百岁的一天：不预设只剩告别","text":"按照本人实际功能调用自主老年或协助协议。能够独立生活的人不因百岁生日自动接受全套护理；有疾病者使用个人计划；确实进入生命末期时才使用相应照护。年龄不替代判断。  当天可以继续学习、见人、表达意见、选择食物和音乐，也可以只想休息。庆祝、采访和分享长寿经验都需要本人同意。最重要的新任务可能是取消一项为了他人展示而安排的负担。"},{"ch":26,"id":"c26-s012","title":"二十六·十三　低资源版本与高资源版本的差别","text":"低资源版本先保护安全、必要治疗、食物、睡眠机会与求助渠道，并利用当地可获得公共服务。使用纸笔、普通食物、步行或适配活动、借阅和真实关系，都可以构成完整的生活支持。缺少设备不等于没有资格开始。  高资源版本可以增加便利、专业支持和环境适配，但不自动需要更多检查、补剂或监测。新增资源应减少负担或改善明确目标，而不是制造维护复杂度。每次增加工具，都问停电、失联、忘记操作时是否仍能安全生活。"},{"ch":26,"id":"c26-s013","title":"二十六·十四　日期定位器的作用与限制","text":"随分卷包提供的出生后日期定位器，只计算日龄、日历月龄、周岁、分龄入口和年度主题。它不读取身体传感器、不诊断、不推荐药物，也不替你判断当天是否安全。状态由使用者按实际情况选择，医疗与急症决策仍遵循本书边界和专业帮助。  出生前的部分不能由出生日期精确倒推。孕期索引使用当时医疗团队确认的临床孕周，受精日只在确实知道或明确标为估计时使用。定位器的日历约定也不作为法律资格计算工具。"},{"ch":26,"id":"c26-s014","title":"二十六·十五　怎样判断这套日程真的有用","text":"用一周或一个适合的周期观察：必要事项是否更少遗漏，日程是否更容易开始，是否减少无效记录，身体与关系是否获得了应有空间，新增任务是否在现实容量之内。不能只看打勾数量增加。  如果系统让你每天花更多时间管理自己，却没有改善任何生活功能，就应删减。能够从容执行少数重要行动，胜过维护一张永远不可能完成的完美人生表。重复内容已经折叠，新增内容也应当由真实需要决定。"},{"ch":27,"id":"c27-s000","title":"二十七·一　先写需要作出的决定","text":"一个问题可以讨论很久，却始终没有对应决定。把“怎样更健康”改成“本月最值得改变哪一项日常安排”，把“这个东西好不好”改成“它是否值得替代当前方案”，把“我是不是做错了”改成“现在需要保留、调整还是停止什么”。  决定要有时间范围。今天的决定可能是是否出门，三个月的决定可能是建立运动习惯，十年的决定可能涉及居住和照护。短期与长期目标可以不同，不必强行用同一个数字衡量。今天需要止损时，不要让遥远收益成为继续承受危险的理由。  本书使用的优化，是在现实约束中选择更合适的行动，不是找出人类生命的唯一标准答案。只要目标不同、资源不同、身体状态不同，合理答案就可能不同。"},{"ch":27,"id":"c27-s001","title":"二十七·二　把事实、估计、偏好和未知分开","text":"事实需要来源，例如实际睡眠机会、已确认药物、已经发生的支出和检查结果。估计可以有用，但要说明怎样得到。偏好是本人愿意怎样生活，不需要伪装成科学结论。未知则明确保留，不用一个看起来合理的数字填上。  可以用四列记录同一件事。准备增加活动时，事实是可用时间和当前能力；估计是交通和准备负担；偏好是喜欢独处还是群体；未知是某种活动是否适合现有疼痛，需要评估。这样不同问题会被送到不同入口，而不是一起变成意志力测试。  不要把计划当作已经执行，把购买当作已经使用，把设备估计当作临床测量，把宣传中的平均结果当作个人承诺。很多错误不是推理不复杂，而是输入身份已经混淆。"},{"ch":27,"id":"c27-s002","title":"二十七·三　定义真实目标与替代指标","text":"真实目标可以是白天有精神、能够独立出行、减少必要照护遗漏、保留重要关系。步数、体重、打卡次数或睡眠分数只是可能相关的窗口。窗口有用时保留，开始扭曲行为时就需要修正。  给每个主要指标配一个反向检查。追求更多活动时看是否疼痛或恢复变差；追求更低支出时看是否牺牲必要食物和治疗；追求学习时长时看是否真正理解；追求效率时看是否把成本转嫁给家人。反向检查帮助发现“数字好看、生活变差”的情形。  指标不需要很多。优先保留能够改变行动、测量相对可靠且维护负担低的少数项目。测得更频繁不自动使决定更好，尤其当每个波动都会触发新的焦虑和调整。"},{"ch":27,"id":"c27-s003","title":"二十七·四　至少比较三个选项","text":"比较新增方案时，同时保留维持现状、修复基础和采用新方案三个候选。否则讨论容易变成“怎么买、怎样用”，跳过是否需要。维持现状也有成本，修复基础也需要投入，都应如实列出。  例如工作时腰背不适，候选不是只在两把昂贵椅子中选择，还可能包括检查实际工作姿势与任务分段、处理需要评估的疼痛、调整工具位置或改变会议安排。此例不诊断疼痛原因，只说明购买不是唯一决策空间。  候选不要无限增加。先保留真正不同的路径，而不是十个名称不同、机制相同的产品。发现某个必要前提尚未满足，优先补前提，不急于比较后续细节。"},{"ch":27,"id":"c27-s004","title":"二十七·五　把成本算完整","text":"成本包括钱、时间、准备、清洁、交通、注意力、恢复、隐私和对他人的影响。一个方案标价低，却需要每天复杂操作；另一个方案价格高，但减少真实照护负担。是否值得需要结合本人资源，不能只按购买价排序。  每个方案还要写持续成本和退出成本。设备需要耗材、维修和学习；课程需要练习与交通；长期承诺需要稳定人力。不能只在新鲜期计算投入，也不能把未来一定更自律当作免费资源。  对依赖你的人，成本不能未经同意转移。你决定每天增加训练，可能意味着伴侣额外承担照护；你决定极端节省，可能影响共同生活者基本需要。共同后果需要共同讨论，而不是只优化个人表格。"},{"ch":27,"id":"c27-s005","title":"二十七·六　先看不能承受的失败，再看平均收益","text":"某些失败可以轻易恢复，例如不喜欢一本书或一个收纳方式；某些失败会伤害身体、泄露不可收回的信息、破坏基本住房或影响他人安全。后者需要更严格证据、专业支持和更小风险预算。  可以把最坏情境写得具体：“如果效果没有出现，最多损失什么？”“如果判断错误，谁承担后果？”“有没有中途发现并停止的机会？”不必假装知道每个事件精确概率，但要看见后果的性质。  安全边界不等于禁止探索。它可以让探索更大胆地发生在可恢复区域，而不是在最不可逆的地方用勇气代替证据。"},{"ch":27,"id":"c27-s006","title":"二十七·七　信息什么时候值得再查","text":"继续查资料的价值，取决于新信息会不会改变行动。若不同合理解释都指向同一个低风险步骤，可以先做；若不同解释会导致相反且高风险的处理，则需要更多证据或专业评估。  假设一个小项目有两种方案，成本差异很小且都可撤回，花很多时间寻找绝对最优可能不划算。另一个决定涉及长期借贷、手术或重要治疗，哪怕核实需要较大成本，也可能值得。这里没有统一的搜索时长，只有与决策后果匹配的核实深度。  写下停止标准：“已经确认正式要求”“已经比较实际可用的三条路径”“关键未知不会改变下一步”。停止搜索不是宣布世界已被完全理解，而是承认当前行动已经有足够依据。"},{"ch":27,"id":"c27-s007","title":"二十七·八　个人试验只用于合适的低风险问题","text":"可以试验的例子包括物品摆放、学习顺序、工作提醒、非必要信息入口、普通休闲安排或合适的低风险生活习惯。药物剂量、停药、极端禁食、故意缺觉、过敏原挑战和危险冷热暴露，不属于本书建议的自我试验范围。  试验前写清问题、一个主要变化、观察结果、时间范围和停止条件。不要同时更改饮食、运动、补剂、睡眠与工作，再把所有变化归功于其中一种产品。若确实需要同时改变，承认无法单独归因即可，不强行编造因果。  个人试验得到的是在特定条件下对自己的有限观察，不是普遍医学证据。无效可能是方法不适合，也可能是观察不足或执行条件改变；有效同样需要考虑其他解释。"},{"ch":27,"id":"c27-s008","title":"二十七·九　一个完整的低风险试验示例","text":"假设目标是减少早晨找东西造成的迟到。先记录几次真正丢时间的物品和步骤，再把钥匙、证件与常用包放在固定出门区。其他作息尽量不变，观察是否减少寻找与遗漏，同时检查是否妨碍其他家庭成员使用空间。  如果改善，保留这个位置与简单规则，不需要继续每天记录寻找秒数。没有改善，就看是否其实缺少前夜准备、物品被多人移动或早晨任务过多。下一轮只改最相关的一项。  这项试验之所以合适，是因为风险低、结果可观察、可以撤回、不会替代必要医疗。它展示方法，不宣称固定收纳能解决所有拖延或执行困难。"},{"ch":27,"id":"c27-s009","title":"二十七·十　一个不宜自行试验的示例","text":"假设读者服用处方药后感觉疲惫，想停几天看看精神是否改善。这里不能照搬上一节，因为停药可能有医疗后果，症状也可能来自疾病或其他因素。正确下一步是整理症状、用药时间和相关变化，联系开药者讨论，而不是自行设计停药实验。  同理，怀疑食物过敏不能通过在家加大摄入验证；怀疑睡眠问题不能用连续熬夜测试意志；怀疑运动耐受异常不能用最大强度训练排除疾病。实验精神需要与风险权限相匹配。  不自己执行危险试验，不代表放弃理解。可以通过专业检查、受监督评估和更安全的观测获得信息。"},{"ch":27,"id":"c27-s010","title":"二十七·十一　如何处理互相冲突的建议","text":"先确认建议是否针对同一目标、同一人群和同一条件。一个面向健康成年人的建议，与一个面向肾病患者的建议不同，不一定是科学互相矛盾。一个强调短期表现，一个强调长期维护，也可能使用不同目标。  再看证据层次与更新时间，确认是否只是不同表达、不同地区政策或旧版本。需要专业协调时，把冲突原文和自己的实际情况一起带去，不让本人在多个科室之间凭直觉拼凑方案。  如果可靠来源仍存在分歧，保留分歧并说明影响。可以选择风险更可控、可撤回且符合本人偏好的路径，同时设复核点；不能为了让答案显得干净，把尚未解决的冲突删除。"},{"ch":27,"id":"c27-s011","title":"二十七·十二　优先级不必伪装成精密总分","text":"可以用高、中、低粗略比较预期价值、证据把握、负担和风险，不必给所有维度编出小数。若没有真实测量依据，一张精确到百分位的评分表只是装饰。  优先处理危险且可避免的损失，再修复明显限制生活的基础问题，再考虑长期积累和低风险探索。某个低成本、能解决高频摩擦的改动，可能比一项理论收益更高但几乎无法执行的方案更值得先做。  排序之后只选当前容量能够承担的数量。一个方案因为暂时没有资源而后移，不等于它没有价值；把暂缓与否定分开，可以减少不必要的内疚。"},{"ch":27,"id":"c27-s012","title":"二十七·十三　设计停止条件和复核点","text":"停止条件包括出现危险信号、功能明显恶化、成本超出约定、侵犯隐私或他人边界，以及关键前提不再成立。医疗相关变化按专业计划处理，不由本书给统一阈值。  复核点可以是完成一次项目、经历一个普通工作周期、环境改变或获得新证据。复核时只问是否达到目标、代价是否可接受、是否继续。不要因为已经购买年费就拒绝承认方案不适合。  有效方案进入维护，无效方案停止或修改，不确定方案保留明确下一步。持续存在却无人复核的计划，容易成为惯性负担。"},{"ch":27,"id":"c27-s013","title":"二十七·十四　把决策留成可读的记录","text":"一份简短记录可以包含日期、决定、目标、关键依据、未知、替代方案与复核条件。以后结果不好时，能够区分当时判断是否合理和后来是否遇到无法预见的变化；结果好也不自动证明方法可靠。  记录不是为了日后找人负责，而是减少重复争论和记忆改写。共同决定中，把不同意见保留为合理分歧，不在事后把所有人都写成早已支持最终结果。  涉及隐私的记录限制访问，过时和无用内容可删除。没有必要把每顿饭和每次聊天都制作成决策档案，只用于真正重要或反复出现的问题。"},{"ch":27,"id":"c27-s014","title":"二十七·十五　三个不同资源水平的同一目标","text":"假设目标是让一位行动受限者更方便参与社区活动。低资源路径可能是选择更近、可进入的地点，并明确一次可靠接送；中等资源路径可能加入合适辅具和固定服务；高资源路径可能改善住宅与交通条件。三者都要由本人参与，且不因预算不同而改变尊严标准。  比较时看实际参与是否增加，是否更安全，照护负担怎样变化，方案能否持续。昂贵并不自动优越，便宜也不自动可行。若低成本方案完全依赖某位家人无限免费劳动，它的真实成本并不低。  这类比较展示的是多条路径，而不是给人分等级。最优方案必须存在于真实资源中，不能只在理想表格里获胜。"},{"ch":27,"id":"c27-s015","title":"二十七·十六　失败后的学习与恢复","text":"先处理后果，再分析原因。出现伤害、财务危机或关系安全问题时，优先获得适当帮助，不在急迫状态下组织长篇复盘。稳定后再区分信息、方法、资源、执行与运气。  找到一项可改变的步骤就可以开始，不必把人格全部重新解释。承认自己当时不知道，与为明显可以核实却没有核实的错误负责，可以同时成立。复盘的目的在于下一次更好，不在于无限惩罚过去。  展开：Z 决策卡——用一次，留下必要结果 决定是什么；真实目标是什么；哪些是事实、估计、偏好和未知；至少有哪些不同路径；最坏后果由谁承担；关键证据是否足够；哪一步可先安全尝试；何时停止或复核。 答案可以是现在做、先补信息、寻求专业支持、暂缓或不做。没有新增价值的行动不必为了保持优化状态而执行。最终看生活是否更可持续、更自主、更能完成重要任务，而不是决策表是否越来越复杂。"},{"ch":28,"id":"c28-s000","title":"二十八·一　事件覆盖年龄，而不等待生日","text":"事故、疾病、失业、迁移、分离和丧失，可以发生在任何阶段。它们改变当前计划的优先级，因此不应被藏在某个年龄后面。遇到事件时先停止不再适用的普通日程，保留必要安全和生活供给，再重新分配资源。  本卷所用“第一天、第一周、之后”是组织事务的编排，不是临床恢复时限。需要急救的事情立即处理，不等第一天结束；需要长期恢复的事情也不因日历过了一周就必须完成。"},{"ch":28,"id":"c28-s001","title":"二十八·二　最初一段时间只做四类事","text":"第一类是确保人身安全与必要医疗。第二类是让食物、住所、药物和依赖照护者的需求不断供。第三类是确定一个可靠联系人和信息入口，减少反复解释。第四类是保留必须及时处理的证据与文件，但不能为取物或记录再次进入危险。  其余事项可以排序。公开回应、社交更新、解释责任和作长期决定，往往不必同时完成。疲惫、惊恐或剧痛时尤其应谨慎处理不可逆承诺，必要时由合适人员协助。"},{"ch":28,"id":"c28-s002","title":"二十八·三　发生事故或突然身体异常","text":"先看现场是否安全，再按照卷一的急救分流处理。不要在交通、火灾、电气或水域危险中让施救者成为新的受害者。联系当地急救时说明地点、发生了什么、人数和当前状态，并按调度员指示行动。  稳定后记录事件时间、受伤部位、症状变化、已经采取的处理和相关药物。不要把社交平台对相似事故的评论作为排除严重问题的依据。头部受伤、症状延迟出现等分支见卷十八，仍需按实际评估安排恢复。  回到日常前，确认工作、交通、活动和照护能力是否已经足够。能够完成一次动作，不代表能够在疲劳、复杂环境或全天重复中安全完成。"},{"ch":28,"id":"c28-s003","title":"二十八·四　热烫伤、中毒与动物暴露","text":"普通热烫伤先脱离热源，用凉的流动水冷却约二十分钟，不涂油脂或随意药膏、不用冰直接接触、不强行撕掉粘在皮肤上的衣物。大面积、深部、特殊部位或化学、电烧伤等需要及时专业评估；注意其他部位保暖，不因凑足冲水时间延误急救。 S144  疑似吞入、吸入或接触有毒物时，立即联系当地急救或中毒咨询服务，说明物质、时间、可能剂量和症状，保留包装。在未获专业指示前，不自行催吐，不随意喂食饮水或进行所谓酸碱中和；没有症状也不代表可以等待。 S146  被可能传播狂犬病的动物咬伤或抓伤，立即用肥皂和流水充分清洗至少十五分钟，并尽快就医评估暴露后预防。不能仅凭动物看起来健康、伤口很小或自己养的就自行排除风险；当地流行情况与暴露类型由专业人员判断。 S145  这些是启动动作，不是完整家庭治疗教程。后续疫苗、免疫制剂、抗感染或伤口处理按专业方案完成。"},{"ch":28,"id":"c28-s004","title":"二十八·五　非自愿性接触或性侵之后","text":"先到安全地点，联系可信赖支持和适当医疗服务。没有明显外伤、认识对方或已经洗澡，都不使经历失效，也不取消获得帮助的资格。医疗可以处理伤害、妊娠与感染风险，并提供相关支持；是否采集证据和具体报告规则按当地制度及保护要求说明。 S147  某些处理有时间窗口。可能需要HIV暴露后预防时应立即咨询，启动不能晚于暴露后七十二小时，越早越好；不要等检测结果自行判断安全。 S142 可能需要紧急避孕时也应尽早就医或联系合适服务，不同方法有不同条件，部分可在五天内使用，但不能因此故意等待。 S143  支持者先听、确认不是受害者的错、询问需要什么，不进行责备式盘问。触摸和拥抱也应先征求同意。涉及儿童或持续危险时，及时联系合适的保护和急救渠道，不由家庭私下处理全部事项。"},{"ch":28,"id":"c28-s005","title":"二十八·六　收到重大诊断或令人担忧的报告","text":"第一步确认到底已经知道什么：是筛查提示、疑似诊断、已确诊疾病，还是仍需进一步检查。记录负责解释的人和下一步时间。不要从报告上一个异常标记直接推导完整预后，也不要因为医生暂时没有给出全部答案就认为所有信息都无用。  找一位能够帮助记录和处理生活事务的人，前提是本人愿意。可以把对外信息统一为简短说明，暂时不回答所有亲友的问题。资料共享按必要范围，不因诊断出现就自动变成家庭公开财产。  下一阶段分别安排治疗、经济、工作、照护与心理支持。需要第二意见时使用完整关键资料，而不是只发一张截图请求陌生人决定。疾病行动卡见卷二十一。"},{"ch":28,"id":"c28-s006","title":"二十八·七　住院与出院之间的断点","text":"住院期间明确谁能代表或协助沟通、谁保管重要资料、谁处理家中依赖照护者。本人能够表达时直接参与，不让陪同者抢走所有问答。每天不必反复追问所有人同一问题，可以集中整理尚未解决的重点。  出院前确认药物变化、治疗要求、复查、伤口或设备护理、活动限制、饮食以及何时求助。旧药与新药清楚区分，未回报结果有负责人追踪。不能把“回家休息”当成完整说明。  回家第一晚尤其要确保照明、用品、必要协助、食物与夜间联系方式可用。复杂护理先经过培训和回演，不把一本书或短视频当作现场教学的替代。"},{"ch":28,"id":"c28-s007","title":"二十八·八　失业、收入骤降或项目失败","text":"先稳定住房、食物、必要治疗和紧迫账单，核对可获得的保障、合同权利和申请期限，具体按当地现行规定。整理现金流时使用真实余额与承诺，不用尚未获得的收入安慰自己，也不因羞耻完全停止查看。  接下来恢复一个基本日程：起居、求职或项目处理、活动、联系和休息各有位置。不要把失业后的每小时都变成找工作，也不要失去所有结构。求职任务可分为资料、联系、申请、面试与技能补足，避免只重复刷新信息。  重大转向先做可承受试验。一次失败不要求立即借更多钱证明自己，也不要求永远退出同一领域。把事实、方法与自我价值分开，决策工具见卷二十七。"},{"ch":28,"id":"c28-s008","title":"二十八·九　关系结束、分居或离婚","text":"普通分离先处理居住、共同财务、物品、通信和必要照护安排，相关法律事项咨询当地合格人员。涉及孩子时，尽量避免让其传递攻击性信息、承担站队或成为获取另一方隐私的工具。  情绪与事务可以分开时段处理。重要协商保留清楚记录，避免在深夜激烈争吵中决定全部财产和未来关系。共同账户、访问权限和数据共享需合法妥善调整，不以报复为目的擅自删除他人资料。  存在暴力、胁迫、跟踪或控制时，普通协商步骤可能不安全，应优先专业安全支持。不能因为曾经亲密就假设单独见面一定适合，也不能要求受害者为了体面维持接触。"},{"ch":28,"id":"c28-s009","title":"二十八·十　搬家、迁移与陌生环境","text":"在打包之前准备第一晚可用包：必要药物、基本洗漱、换洗衣物、食物与饮水获取、充电、重要联系和孩子或被照护者的熟悉用品。让这包物资独立可取，不与全部家具一起暂时失踪。  到达后先检查出入口、热水与电气安全、睡眠位置、交通和医疗入口，再处理装饰与全面收纳。陌生环境中的生活成本不只包括租金，还包括通勤、无障碍、语言和支持网络。  跨地区迁移需要核对医疗、保险、药物携带、证件与法律资格等当前要求。不要凭旧经验假设所有规定一致。建立至少一个当地可靠联系，避免所有帮助都只能来自远方。"},{"ch":28,"id":"c28-s010","title":"二十八·十一　主要照护者突然无法工作","text":"立即把依赖照护者的需求按安全与时间敏感性排序，联系预先安排的替补或正式服务。没有替补时，向医疗、社区或社会服务说明具体缺口，不只说家里有点忙。  交接当前状态、药物、饮食、转移和危险信号，不要求接手者阅读全部历史聊天。对不会的复杂操作承认不会，寻求专业支持，不能临时拉一个人凭力气处理。  主要照护者的疾病和休息本身也需要安排。不能只把他视为坏掉的资源，修好后马上恢复原来超负荷。事件过后复核为什么没有冗余，优先减少单点依赖。"},{"ch":28,"id":"c28-s011","title":"二十八·十二　失去亲人或重要的人","text":"若发现人无反应且无法确认是否已按既定临终计划处理，先联系急救或负责医疗团队，不自行判定死亡。已有明确预先计划时，按相应专业和当地流程执行。  确认死亡后，必要医疗、登记与后续事务按当地规定办理。让一位合适的人帮助整理清单和联系，避免每个亲友同时向主要哀伤者索取信息。尊重本人留下的合法意愿和相关人的感受，不把仪式规模当作爱的证明。  物品、照片、纪念和公开表达可以逐步决定。不要在最疲惫时强行清空所有东西，也不要要求永远不改变。哀伤支持见卷二十二，事务完成不代表情绪必须结束。"},{"ch":28,"id":"c28-s012","title":"二十八·十三　流产、妊娠结束与生育计划变化","text":"先按医疗团队要求处理身体恢复、出血或疼痛等风险、复查和后续生育咨询。既往经历可以影响下一次计划，但不能由一次结果推导所有未来。不要把结局归因于一方某次情绪、日常小行为或道德缺陷。  双方可能有不同表达方式和恢复节奏。可以共同处理医疗与生活，也允许各自需要不同支持。亲友不要以“还会有的”迅速抹去这一次经历，也不要求公开全部详情。  未来是否继续尝试、何时尝试、是否改变路径，都需要结合本人意愿、健康、资源与专业信息。没有一种选择能自动证明更勇敢或更爱家庭。"},{"ch":28,"id":"c28-s013","title":"二十八·十四　公共危机、灾害与长期中断","text":"按所在地官方应急指引行动，优先安全撤离或避险、必要药物与照护、食物水源和通信。普通日程暂停，不能为维持训练或工作承诺进入危险环境。家庭准备细则见卷二十四。  在长期中断中，重新建立少量稳定锚点：起居、食物、必要学习工作、联系与可行活动。儿童需要适龄解释，成人不必假装完全不担心；说明当前知道什么、正在做什么和下一次什么时候更新。  消息核实优先负责机构与可靠来源，减少重复传播未经确认的警报。信息过载时可以指定查看时段与一个家庭信息入口，但不能因此漏掉必须即时接收的官方安全通知。"},{"ch":28,"id":"c28-s014","title":"二十八·十五　回到工作、学校或原有活动","text":"恢复不是一键回到原计划。先确认医疗要求、实际耐受和任务环境，再讨论分段返回、适配、协助和复核。对某些疾病需要特殊负荷管理，使用卷二十一分支，不套固定加量。  返回前告诉相关人员哪些支持必要、哪些信息愿意分享、怎样反馈问题。没有必要公开全部病史来换取基本尊重；正式证明和适配流程按当地要求办理。  一段时间后复核真实结果：是否能完成必要任务，是否出现延迟恶化，是否还有资源处理生活。工作场所表现看起来正常，不代表回家后的全部生活成本可以忽略。"},{"ch":28,"id":"c28-s015","title":"二十八·十六　重建未来，但不急于讲一个漂亮故事","text":"重大事件之后，价值和目标可能改变，也可能大部分仍然保留。不要要求立刻找到意义、成为更强的人或宣布全新人生。先恢复安全和生活连续性，再允许新的选择逐渐形成。  可以记录这次事件暴露了哪个系统缺口，哪些支持真正有效，哪些承诺需要改变。留下能够减少未来损失的改动，而不是把每个细节都永久保存为创伤档案。  展开：E事件协议的具体使用——第一步、短期与后续 第一步处理危险与必要医疗。短期保障供给、住所、照护、可信联系和时间敏感事务。之后再分配工作、法律、财务、关系与恢复任务，交给合适人员，不由一个人全部承担。 旧日程只恢复仍适用的部分，不补做错过的普通打卡。新状态持续多久由实际情况决定，不被作者编排的第一周或第一个月强行结束。"},{"ch":29,"id":"c29-s000","title":"二十九·一　留下一块不被绩效占据的生活","text":"如果每顿饭都只剩营养，每次散步都只剩步数，每次交流都只剩关系维护，那么使用人体的计划可能已经遮住了生活本身。本卷不再增加健康指标，而是提供一些可以自由选择的体验入口。它们无需证明能够延寿，也不需要转化为收入。  选择一个入口时，只问本人是否愿意、是否安全、资源是否可承受。没有兴趣可以跳过，做了一半可以停止。活动的意义由参与者决定，不由书中的任务安排者决定。  可以给自己留一个没有成果要求的小窗口。时间长短不重要，重要的是这段时间不自动被其他人的需求占满，也不在结束后被审问值不值得。"},{"ch":29,"id":"c29-s001","title":"二十九·二　重新看见熟悉的空间","text":"选一个每天经过的地方，只观察其中一个维度：光从哪里进入，哪些颜色重复，声音怎样远近变化，物品怎样被使用。把注意力放在具体差异，不急着总结人生道理。  随后改变一个低风险细节，例如挪开遮挡视线的杂物、把喜欢的物品放在容易看见的位置，或者让一块工作表面更清楚。改变后看自己是否更愿意使用这个空间。美感可以从可达、清楚和个人偏好开始，不必先购买昂贵装饰。  视觉受限者可以使用触觉、声音和空间顺序；听觉受限者可以关注视觉、振动或动作。感官差异不使体验变低级，只需要不同入口。"},{"ch":29,"id":"c29-s002","title":"二十九·三　一次只接触一个感官维度","text":"吃一口适合自己的普通食物，注意温度、质地和味道的先后；听一段熟悉音乐，留意一个乐器或一处停顿；触摸一件安全材料，描述软硬、纹理和重量。观察没有标准答案，不需要使用专业词汇。  有吞咽、过敏、感官敏感或其他疾病时，按个人安全方案选择，不以丰富体验为由突破禁忌。任何不舒服的刺激都可以减少或停止。这里不是暴露治疗，也不主张通过忍耐训练感官。  把体验说给别人听时，可以用比喻，但区分自己的感受与事实。例如“像雨后一样清新”是感受，不代表空气已经通过安全检测。"},{"ch":29,"id":"c29-s003","title":"二十九·四　音乐可以是参与，不只是在背景中播放","text":"选一段音乐，完整听一次，不同时完成其他任务。第二次可以跟着节奏轻敲、哼唱或用自己能够完成的动作回应。身体或听觉需要适配时，使用合适形式，不追求统一表现。  与他人一起听时，可以交换各自注意到的部分，而不是立即评价品味高低。一个人想到童年，另一个人注意节奏，都可以成立。音乐不需要每次都成为情绪调节工具，也可以只是喜欢。  音量和暴露遵守听力安全原则，详见卷十九。昂贵器材不是开始的前提，能够可靠播放、适合环境且不伤害他人休息的设备就可以服务体验。"},{"ch":29,"id":"c29-s004","title":"二十九·五　身体移动也可以不以训练为目的","text":"在安全且适合能力的范围内，随音乐移动、玩一个轻松的传球游戏、探索不同步伐，或在适配支持下改变身体与空间的关系。活动是否快乐，不必由消耗热量或完成强度决定。  可以与朋友约定一场不计分的活动，允许不同水平参与，轮流提出规则。已经有疼痛、疾病或活动后症状问题的人，按相应计划调整；快乐不是忽视身体限制的理由。  把运动与羞辱分开。没有赢、动作不漂亮、需要辅助或中途休息，都不应成为被嘲笑的理由。合适的参与环境可以比某一种活动名称更重要。"},{"ch":29,"id":"c29-s005","title":"二十九·六　游戏让规则成为可讨论的东西","text":"选择一个规则少的游戏，先玩，再共同改变一条规则，观察体验怎样变化。也许合作比竞争更适合今天，也许缩短一轮能让更多人参与。规则的价值在于服务参与者，而不是因为一直如此就不能改变。  游戏中仍然尊重同意和边界。恶作剧若让人害怕、受伤或被公开羞辱，不能只用开玩笑解释。有人不想玩，可以选择旁观或离开，不必证明幽默感。  独自游戏也可以有价值，但要看是否仍是本人选择，是否挤掉必要生活、经济安全或想保留的关系。需要改变时，先明确哪部分失控，不把所有娱乐一概定罪。"},{"ch":29,"id":"c29-s006","title":"二十九·七　写作：把尚未成形的想法放到外面","text":"从一个具体场景开始，写看见了什么、发生了什么、自己怎样理解。第一遍不追求好看，第二遍删掉不能帮助表达的部分。这样可以把表达拆成发现与编辑两个任务，而不要求每句话一开始就完美。  可以把同一件事写成事实记录、私人感受和虚构故事三个版本，明确它们的身份。事实不能为了好看而添加未经发生的细节；虚构可以自由创造，但不冒充他人的真实经历。  写给自己看的内容不必公开。写给别人时，考虑其理解需要与隐私边界，涉及他人经历先获得适当同意或作必要处理。表达自由不要求所有私人材料都进入互联网。"},{"ch":29,"id":"c29-s007","title":"二十九·八　绘画、摄影与观看：先形成自己的问题","text":"看一幅作品时，可以先问视线从哪里进入、什么让自己停留、哪些地方不理解。不同解释可以并存，但若讨论作者经历或历史背景，需要可靠来源，不能用自己的联想替代事实。  自己创作时，可以给一个小限制：只用少数颜色，只表现一个物品的轮廓，或从几个不同角度观察同一对象。限制用于帮助开始，不是评判天赋。完成后选择一处喜欢和一处想再试的地方即可。  拍摄他人尤其是儿童、病人和私人场景时，尊重同意与发布边界。作品拥有者和参与者的权利需要按实际情况核对，不把喜欢一张图自动等同于可以随意使用。"},{"ch":29,"id":"c29-s008","title":"二十九·九　制作与修复：体验自己能够改变物质世界","text":"选择安全、可逆、失败代价小的项目，例如缝补一处普通布料、整理一件非危险机械小物的外观、制作纸模型或搭建简单收纳。先检查工具、材料和操作能力，涉及电气、燃气、承重或其他高风险结构时交给专业人员。  把项目分成准备、制作、测试和收尾。收尾包含清理尖锐小物、妥善存放工具和让空间恢复安全，不把危险留给其他人。儿童参与时，成人负责材料与工具权限。  作品可以不完美，却要清楚是否能够安全使用。装饰性物品与承担重量、接触食物或保护身体的物品，验收标准不同，不能因为是亲手制作就降低安全要求。"},{"ch":29,"id":"c29-s009","title":"二十九·十　自然体验不需要变成征服","text":"在可安全到达的地方观察季节、光线、植物形态或天气变化。先学会停留和辨别，不急着攀登最难路线、采集物种或完成距离。未知植物、动物和水体不随意触摸、食用或接近。  带着一个小问题外出，例如同一条路上午和傍晚有什么不同。回来后可以画图、记一句话或不记录。体验本身已经发生，不需要通过发布证明。  行动受限、天气不合适或环境不安全时，可以从窗边、可及公共空间、室内安全材料或其他方式接触。替代形式不是失败，不应把户外生活变成新的能力阶层。"},{"ch":29,"id":"c29-s010","title":"二十九·十一　烹饪与共同进餐的文化层","text":"选择一道与个人或家庭记忆有关的普通食物，了解谁做过、怎样变化、现在希望保留什么。食谱可以为健康、过敏、吞咽或现实材料调整，改变做法不等于背叛传统。  共同进餐不必总是大型聚会。少数人、简单食物和足够时间，可能更适合交流。让参加者能够说明饮食限制和不喜欢的东西，不通过劝酒、强迫进食或评价体形制造关系义务。  没有条件烹饪时，选择现有食物、认真摆放或与人一起吃，也可以具有意义。文化与连接不由厨房面积和食材价格决定。"},{"ch":29,"id":"c29-s011","title":"二十九·十二　亲密：允许不同形式的靠近","text":"亲密可以是聊天、共同完成一件事、拥抱、陪伴或双方愿意的身体接触。它需要同意、舒适和可以拒绝的空间，不以频率、表现或某种标准形式评价关系。  身体变化、疾病、疲惫或生活压力出现后，可以重新讨论什么让彼此感觉被理解。不要把以前愿意的事当作永久义务，也不要把暂时不愿意直接解释成不爱。需要医疗或关系支持时寻求适当帮助。  独身或没有伴侣的人同样可以获得连接、温暖和有意义的生活。亲密关系不是完成一个人的必要证书，也不应成为忍受控制和伤害的理由。"},{"ch":29,"id":"c29-s012","title":"二十九·十三　独处：主动选择与被迫隔绝要分清","text":"主动独处可以用来休息、创造或只是安静。可以提前告诉共同生活者自己希望不被打扰的范围和时间，避免对方把它误解成惩罚或危险信号。独处结束后不必提交成果。  若独处主要来自羞耻、恐惧、被排斥或失去可用关系，处理方式可能不同。可以从一次低压力联系开始，也可以寻求专业支持。不要把所有隔离都浪漫化为独立，也不要把喜欢安静的人都当作需要被修正。  给自己保留来回通道：愿意独处时有空间，需要联系时有入口。两种能力可以同时存在。"},{"ch":29,"id":"c29-s013","title":"二十九·十四　社区参与：把贡献做成可持续的小事","text":"寻找一个具体而有限的问题，例如帮助整理公共信息、参与一次经过正规组织的活动、分享技能或改善共同空间。先了解真实需求和既有负责人，不因为热心就擅自介入他人的生活。  明确时间、责任、隐私和退出条件。志愿服务不是无限免费劳动，也不应让参与者承担超出训练的医疗、法律或安全责任。涉及儿童和脆弱人群的工作，遵守相关保护与机构要求。  贡献可以不显眼。持续完成一个小任务、认真听见一个人、帮助修正一处信息错误，都不需要包装成宏大使命。拒绝超出能力的任务，也是在保护长期可持续性。"},{"ch":29,"id":"c29-s014","title":"二十九·十五　价值冲突不一定有一个毫无遗憾的答案","text":"家庭、自由、工作、创造、安全和探索都可能重要，却不可能在每一时刻同时最大化。选择时说明愿意优先什么、为什么、代价由谁承担，以及以后是否可以调整。不要假装真正艰难的选择只要再努力就没有取舍。  可以将决定分成可逆与较难逆转部分，先保留选择空间。对需要共同承担后果的人进行充分沟通，对属于个人自主的部分则保留边界。价值判断可以得到信息支持，但不应被一张未经验证的评分表完全替代。  做出决定后允许遗憾存在。遗憾不自动证明决定错误，可能只是你同时重视另一个没有被选择的东西。"},{"ch":29,"id":"c29-s015","title":"二十九·十六　如何与有限性相处","text":"本书写到一百岁，并不是承诺每个人都有同样长的时间。有限性可以提醒我们把重要关系和愿望放进现实，却不需要制造“每天必须活到极致”的压力。普通的一天也可以值得过。  可以选择一件不愿无限推迟的事，缩小到现在能开始的版本：说一句重要的话、了解一个想学的问题、修复一段愿意修复的联系，或者停止一个不再认同的负担。行动不必壮烈，也不要求一次完成。  宗教、哲学、艺术、家庭和社会贡献可以提供不同的意义来源。本人可以探索、怀疑、改变或不采用任何一种，不必接受书中作者的世界观才配拥有完整生活。"},{"ch":29,"id":"c29-s016","title":"二十九·十七　十二个无需特殊设备的体验入口","text":"看同一个窗景在不同时间怎样变化；听完一首音乐后描述最记得的片段；给熟悉物品换一个安全摆放位置；写下一个没有急着解决的问题。它们训练的是注意与表达的使用机会，不承诺治疗效果。  与人交换一道食物的记忆；把一件简单事教给愿意学习的人；重新玩一个不以输赢为中心的游戏；为自己整理一小块舒适空间。每项都可以根据能力、文化和资源改变形式。  写一封不必寄出的信；问一位熟悉的人一个真正好奇的问题；完成一个很小的安全制作；留一段不需要记录的休息。任选其一即可，不把十二项变成新的一周考核。"},{"ch":29,"id":"c29-s017","title":"二十九·十八　不把快乐强制化","text":"身体疼痛、情绪低落、疲惫或经历丧失时，暂时感受不到乐趣并不意味着读者没有认真使用本书。可以先获得照护和支持，降低要求。必要专业帮助见相应章节，而不是用本卷活动替代。  亲友也不应以安排很多娱乐来要求对方赶快开心。先问是否愿意，允许改变计划。陪伴可以是共同安静，而不总是制造气氛。  这一卷的最终规则很简单：体验是给人的，不是人给体验清单服务。维护身体是为了继续感受、行动、连接与选择；当维护本身占满全部生活时，就需要把一部分空间重新还给生活。"},{"ch":30,"id":"c30-s000","title":"三十·一　先把“有希望”放在正确的位置","text":"对新技术保持兴趣，与要求可靠证据并不冲突。本书不把尚未完成验证的方法一律判定为无效，也不把未来可能有效当作今天可以直接用于人体的许可。一个想法值得研究，和一个方案值得让普通人现在付费接受，是两个不同问题。  阅读一项新发现时，先把它放入对应层次：机制推测，细胞或动物结果，人体可行性，短期指标变化，实际症状或功能改善，长期疾病与生存结局。层次之间需要补证据，不能用一张复杂的机制图跨过全部中间步骤。某一方法可能对特定疾病有价值，却没有回答健康人是否受益；可能改善一个指标，却同时带来没有测量的代价。  今天可以做的第一件事，是把广告句子改写成可以检验的问题。不要问“这个是不是抗衰”，而问“对与我相似的人，使用这个具体产品和方案，与合理替代选择相比，是否改善我在意的结果，代价是什么”。问题越具体，越容易看见证据缺口，也越不容易被宽泛名词说服。"},{"ch":30,"id":"c30-s001","title":"三十·二　生物年龄不是另一张出生证明","text":"所谓生物年龄，可能来自血液指标、体能数据、影像、基因表达或DNA甲基化等不同信息与算法。讨论时必须知道具体测量名称、使用的人群、想预测的结果以及算法版本，不能把不同产品输出的“岁数”直接相减，再解释成身体逆转了多少年。  一个有代表性的原始研究例子是CALERIE试验的甲基化分析。研究在两年干预的框架内观察到DunedinPACE指标的改变，但PhenoAge与GrimAge等指标没有同样的显著变化；作者也明确指出，相关改变是否转化为长期疾病与死亡风险的改善，仍需要更长随访。这篇研究不能被改写成已经证实某种节食方案让每个人多活若干年。 S150  个人拿到一份报告，可以先问三个不同问题：测量是否可靠；这个指标与重要健康结果是否有关；主动改变这个指标是否已经被证明能改善那些结果。前两个问题的肯定答案，并不能在逻辑上自动回答第三个。若供应商只有一条“数字下降”的故事，却没有提供相应验证，应把结论留在它实际能够支持的层次。  复测之前也要有决策计划。若结果变好会继续原样，变差也只是多买产品，那么测量正在成为营销环节，而不是帮助选择。把功能、症状和必要医疗结果同时保留，可以避免用一个抽象分数覆盖整个人的生活。"},{"ch":30,"id":"c30-s002","title":"三十·三　“全面检测”先回答结果之后怎么办","text":"基因、微生物组、营养、激素、影像和各种算法报告，可以包含真实信息，但信息量多不等于决策价值高。检测前列出可能结果，以及每种结果会带来什么后续：复核、观察、治疗、遗传咨询，还是实际上没有可验证的行动。后续安排不清楚时，先解决解释能力，而不是继续增加检测范围。  FDA对直接面向消费者的检测提醒：不同检测的证据水平与覆盖范围不同，阴性结果不排除所有相关风险，阳性风险结果也不等于必然发病；消费者检测不能替代常规医疗评估，不能单独据此开始、停止或改变治疗。 S149  影像同样需要明确目的。因症状安排的诊断检查、对特定高风险人群的监测和面向无症状者的商业全身扫描，不是同一任务。不要把一种检查在某种疾病中的价值直接推广到所有人。具体适用筛查及假阳性问题见卷二十，这里不再复制检查清单。  结果需要专业解释时，尽量让解释者能够独立于产品销售。问清是否需要确认检测、是否会影响家人的信息权益、原始数据存放在哪里、是否允许删除。基因与其他敏感数据不仅关系到今天的健康决定，也可能涉及亲属和未来的隐私选择。"},{"ch":30,"id":"c30-s003","title":"三十·四　药物名称不能替代适应证","text":"看到某种处方药出现在抗衰讨论中，首先确认讨论对象是谁、为什么用、研究终点是什么。治疗已确诊疾病时的收益风险，不能照搬到没有该疾病的人；已获批准的某个用途，也不能自动为所有营销用途背书。  对正在按医嘱服药的人，本章不是停药理由。对没有相应处方的人，本章也不提供自行尝试雷帕霉素、二甲双胍、激素或其他药物的剂量。临床决策可能包括批准范围外的使用，但这需要个体化理由、风险讨论、监测和责任明确的专业管理，不能只凭网络群体共识。  就诊前可以准备四项信息：自己的目标与实际症状；正在使用的全部产品；所见研究的原始来源；愿意承担与不愿承担的代价。把问题交给能够同时考虑病史和研究的人，避免在多个只讨论单一机制的社群之间拼接出一份无人负责的处方。"},{"ch":30,"id":"c30-s004","title":"三十·五　补充剂叠加的复杂度需要被计算","text":"一个产品单独看起来简单，多个产品叠加后却可能无法判断总量、相互作用和不适来源。建立清单时记录成分与含量，而不只写品牌名；同一种成分可能同时存在于复合维生素、饮料、运动产品与单独补充剂中。具体营养素与疾病限制已在饮食卷展开，这里只管理叠加结构。  新增前先说明缺口是什么。若目标是治疗缺乏，应有相应评估与复查；若目标是改善明确症状，需知道适用证据与替代方法；若只是探索，则应清楚其不确定性，且不能挤掉必要治疗。NCCIH强调补充剂并非因为“天然”就自动安全，某些产品会与药物或手术过程发生重要关联。 S38  不要同时新增很多项目后，把所有变化归功于最贵的一项。也不要在出现不适后，通过继续增加“保护性补剂”掩盖可能的原因。出现明显症状时应按医疗分流处理；产品标签、批次、使用时间和实际摄入记录，能帮助专业人员判断。"},{"ch":30,"id":"c30-s005","title":"三十·六　注射与再生医学：进入人体的路径也是风险的一部分","text":"服务使用“自体”“天然”“年轻细胞”“外泌体”等词语，并不能免除产品质量、适应证、监管和临床证据的要求。FDA曾报告未获批准的再生医学产品相关严重不良事件，包括感染、失明和肿瘤形成；其提醒也明确，出现在临床试验登记网站、企业完成某种注册，并不等于产品已经获准合法上市。 S148  这里引用的是监管机构对特定未批准产品的风险提醒，不把旧网页上的产品批准清单当作本版年份的完整现状。实际准备接受某项治疗时，必须核对具体国家、产品、生产者、机构、适应证和现行批准状态，不能仅凭“某国已经批准干细胞”概括所有制剂和用途。  对任何进入血管、组织或体腔的非必要干预，询问谁负责操作、怎样控制感染、发生反应时在哪里处理、随访由谁承担、能否获得完整记录。收费合同与同意书不等于风险已被理解；读不懂时应暂停并获得独立解释，而不是因为预约难得就赶着签字。"},{"ch":30,"id":"c30-s006","title":"三十·七　高压氧与其他设备：治疗参数不能从体验感反推","text":"高压氧在特定临床问题中有用途，同时存在压力相关耳部损伤、氧相关不良反应等风险，富氧环境还需要严格防火管理。它应由了解病情和设备要求的团队管理，不能把“吸氧”理解成一种可以任意加量的普通休息方式。 S151  一种技术能够用于某种疾病，不构成它已经适合健康人普遍延寿的证据。比较研究与商业服务时，不能只比较设备名称，还要看人群、压力、供氧方式、疗程、监测与终点是否相同。若这些条件不同，不能把研究图表直接贴在另一种服务上作为效果承诺。  本书不根据年龄给出高压氧、冷热刺激或其他设备的统一日程。正在接受医疗治疗的人遵循个人方案；为了探索而考虑服务的人，先核对证据与风险，不把体感放松或短暂精神变化直接等同长期健康收益。设备越复杂，越需要明确谁负责异常识别和紧急处置。"},{"ch":30,"id":"c30-s007","title":"三十·八　强刺激并不自动产生强收益","text":"“让身体受一点压力就会更强”不能成为所有极端做法的总许可证。需要分别说明是什么刺激、由谁接受、强度和恢复怎样控制、研究观察到了什么、哪些人被排除。身体能承受一次，不等于适合长期重复；主观兴奋也不等于组织和功能没有付出代价。  禁食、冷水、高温和高强度训练，不应为了追求某个抗衰标签而同时叠加。疾病用药、孕产期、儿童生长、进食障碍史、虚弱和运动后症状加重等情况，已经在相关章节设置了优先分支，不能被“健康挑战”重新覆盖。  要识别一个危险的叙事：每次不适都被解释为排毒、适应或即将进步，因此永远没有需要停止的证据。任何值得执行的方案都应允许失败、允许不适被认真评估、允许退出。禁止反证的方案，不适合用身体替它作担保。"},{"ch":30,"id":"c30-s008","title":"三十·九　外貌愿望与健康愿望可以分开","text":"想改善外貌是可以被尊重的选择，不需要假装所有美容都是治疗，也不需要把不愿接受美容的人定义为放弃自己。先说清想改变的是皮肤表现、发型、比例、某个结构，还是对被评价的担忧，不把不同问题都压成“抗衰”。  任何不可逆或侵入性美容决策，都应比较实际目标、可达到程度、并发症、恢复期、维持成本和不做的选项。不要把修图、不同光线和选择性照片当作可复制结果；也不要在连续不满意时立即追加下一项目。需要暂停的可能是决策过程，而不一定是某个身体部位仍然不够好。  低风险日常皮肤与口腔护理见卷十九，不因进入中年就需要升级为越来越复杂的操作。外貌不应成为获得社交、工作和亲密关系的资格考试，医学也不应该被用来执行一个无限收紧的审美标准。"},{"ch":30,"id":"c30-s009","title":"三十·十　参与研究，与购买承诺不同","text":"正规研究也存在不确定性，参加研究的意义不能被描述成保证获得更先进治疗。阅读知情同意时，理解研究目的、分组方式、可能没有直接受益、需要做哪些检查、退出和后续照护安排，以及谁承担相关费用和伤害处理。  可以独立核实伦理审查、负责机构和公开登记信息，但登记本身不回答产品是否已被证明有效，也不替代监管授权。 S148 研究团队应允许提问，不以“错过这次就没有机会”阻止冷静判断。付款模式、宣传方式和实际研究文件不一致时，需要进一步核实。  本人无法充分理解或表达时，需要依适用法律与伦理要求提供支持与保护，不能把照护者的希望直接替代本人的利益。儿童与高度依赖照护的人，更不应成为家庭未经验证优化计划的试验对象。"},{"ch":30,"id":"c30-s010","title":"三十·十一　把证据卡写成一页","text":"一份可用的证据卡不需要堆满术语。第一行写具体主张，第二行写适用人群与比较对象，随后记研究设计、测量结果、持续时间、主要限制和不良事件。原始来源能找到，广告改写处能识别，已经足以比只收藏结论前进一步。  另外单独写“我为什么考虑它”。同一个产品可能有人为缓解症状，有人为社交归属，有人为缓解对死亡的焦虑。只有第一类问题能直接由产品的生物学证据回答；其他需求需要自己的处理路径，不能无限用新项目替代。  最后写行动状态：不适用；资料不足暂缓；带给专业人员讨论；符合条件可按专业方案执行；已有明确理由停止或复核。状态可以随证据变化而更新，不必把早先的选择维护成身份认同。承认以前判断需要修改，是信息真正产生价值的时刻。"},{"ch":30,"id":"c30-s011","title":"三十·十二　未来一百年的更新规则","text":"本书只能代表本版核对范围，不可能预先固定未来一百年的指南、技术、法律与个人状态。真正应保留的是更新接口：什么新信息出现时需要重读，哪类专业人员负责解释，旧建议怎样退出，改变后如何确认没有遗漏必要照护。  更新可以由四类事件触发：本人状态改变；有质量较高且适用的新证据；当地规则或可用服务改变；原方案出现负担或不良后果。没有这些变化时，不必每天重建全部生活。把更新频率设得低于信息流刷新频率，才能保留执行和体验的空间。  新增方法应替代或补充一个明确缺口，不能只因新颖就永久加入清单。每增加一项维护，问是否可以删除另一项低价值维护。一个越来越复杂、只有精力最好时才能运行的健康系统，可能正在偏离最初目标。"},{"ch":30,"id":"c30-s012","title":"三十·十三　全书的最后一天，仍然可以很普通","text":"想象出生后一百岁的一天。它不需要完成全书总结，不需要证明所有选择正确，也不需要为了成为励志故事配合别人的镜头。根据真实状态，吃喜欢且适合的食物，得到需要的帮助，与愿意见的人联系，完成一点想做的事，或者安静休息，都可以是一种完整生活。  同样的原则适用于一岁、十八岁和四十岁。身体不是必须榨取最大产出的机器，也不是只能小心封存的收藏品。它是你参与世界的条件之一；使用得好，既包含维护，也包含行动、感受、学习、连接和在必要时接受帮助。  这本书最后交还给读者的，不是一份不能违背的百年命令，而是一套能够定位今天、理解变化、减少无谓风险并保留选择的方法。今天没有新增事项，就把重复部分折叠起来，继续生活。真正重要的改变出现时，再展开对应的一页。"},{"ch":31,"id":"c31-s000","title":"31.1　行动卡：让一句建议拥有执行条件","text":"“注意营养”“定期检查”“多交流”都可以是正确方向，却还不能告诉一个人今天做什么。需要重复执行或跨人交接的建议，应当落在一张行动卡中。卡片不是越长越好，而是不能省掉会使行动分叉的条件。  一张完整卡可以回答十个问题：为谁服务；解决什么具体问题；何时启动；开始前必须满足什么；由谁负责；实际做什么、做到何种程度；什么算完成；发生什么需要停止或求助；何时复核；依据来自哪里。没有药物或医疗剂量的任务，不必硬加“剂量”；但清楚的持续时间、范围或交付物仍有价值。  字段 应当填写的内容 不合格的替代 适用对象 实际年龄、相关能力、疾病与资源条件 “所有人都适用” 目标 维持或改善的真实功能 “变得更好” 启动条件 事件、已确认到期日、首次出现的需要 只写一个任意生日 必要前提 安全环境、已获授权、工具或专业计划 假设条件天然存在 责任人 一个能接手的人或明确负责团队 “家里有人会管” 执行动作 动词、对象、范围、必要单位与顺序 “加强管理” 完成证据 结果、回演、可恢复文件或已生效安排 只看是否买过、预约过 停止与升级 具体变化及联系路径 “不舒服就注意” 复核与退出 到期、状态改变或任务已无需维持 永远每日打卡 来源身份 临床计划、正式建议、作者示例或个人偏好 把所有文字视为同等证据  这里的“完成证据”不能被误解成必须上传截图。许多任务当面验证后即可，不需要制造新的隐私材料。能够独立完成一次安全的钥匙取放，不必持续拍摄家中出入；能够复述医嘱，也不代表必须录下整段诊疗。  展开：可直接复制的单项行动卡 任务名称： 适用对象与当前状态： 我要保住或改善的生活功能： 启动条件／已确认到期日： 必要前提与授权： 责任人；缺席时替代人： 今天的动作；必要的量、单位与顺序：\n完成后应该出现的结果： 出现什么就停止／提前联系谁： 下次复核条件；何时可以退出： 依据、版本、解释人及尚未解决的问题：  不清楚的字段写“未确认”，而不是填一个看起来合理的答案。对于时间敏感医疗事项，未确认意味着立即找到负责团队核实；对于普通兴趣任务，未确认可能只意味着先做一个可撤回的小样。两类未知不应触发同一种处理。"},{"ch":31,"id":"c31-s001","title":"31.2　时间窗口：阅读日、开始日、截止日不是同一件事","text":"日历至少包含四种时间。阅读日是方便学习的安排；开始日是某项措施真正需要生效的时间；截止日是不能随意越过的服务或医学节点；复核日则检查已经运行的安排。把它们混成一个日期，就可能在已经需要行动时继续等待。  情境 最先触发的是什么 今天需要产生的结果 开始考虑怀孕 受精前准备，而非试纸阳性之后才启动全部准备 核对既有疾病、用药与叶酸安排，进入孕前计划 新生儿即将出院 离院前交接，而非家庭日历第三天 明确随访、待回报项目、照护操作和异常联系 听力筛查未通过 结果本身，而非等下一次年度卡 得到诊断评估的负责人和预约路径 第一颗牙出现 实际事件，而非一律等一岁 启动相应清洁，并安排早期牙科接触 孩子开始翻身、攀爬或能打开容器 新能力出现，而非下一月龄页面 立即重新审查睡眠用品、跌落路径与危险物存放 强刺激化学品进入眼内 暴露当时，而非医生回电话之后 立即冲洗并同步求助 收到异常报告 结果需要解释，而非“检查已完成” 解释、后续决定和承担跟踪的人 换药、换照护者或出院 原方案可能已失效，而非新年再整理 统一当前版本并让接手者回演 年度兴趣主题到了 可选提醒，而非新增义务 有价值且有容量才做，否则跳过  医学窗口的依据分别见孕期、新生儿、器官维护卷及本卷相应来源；生活组织的顺序是作者编排。该表的作用是分清触发关系，不是给每种事件设一个全球统一期限。  遇到“截止六个月”这样的目标，不要读成“六个月之前什么都不用做”；遇到“适用于五岁以上”，也不能推导“四岁不需要活动”。截止是避免失访的边界，年龄组是证据与建议的组织方式，实际能力和风险仍然存在。  一个任务有多个时钟时，分别保存。例如早产儿的实际年龄、矫正年龄、出院后天数和下一次随访日期，回答不同问题。软件能够准确算出年龄，不等于它已经知道该采用哪个临床时钟。"},{"ch":31,"id":"c31-s002","title":"31.3　受精前行动卡：把准备往上游移动","text":"一般风险叶酸的量与受精前开始时间见卷二，不在每张表里重复抄写。这里补充的是准备如何交付：不能只有“双方重视健康”，应当留下当前药物清单、已有检查的索引、接种记录、重要既往经历，以及需要找谁解释的少数问题。  药物清单写实际服用，而非购物记录。长期处方、偶尔使用的药、外用药与补充剂分开，保留成分、剂量、频率和开药者。不清楚是否适合备孕时，联系负责者讨论；提前核对的目的，是为必要调整留下空间，不是让所有人自行停药。  既往经历不只填写“是否生过孩子”。将重要妊娠结果、已知生殖问题、既往治疗和家族中的明确诊断带给相应人员；没有可靠资料就保留未知，不凭亲戚说法给自己作遗传诊断。由专业人员决定哪些信息需要进一步验证，而不是把全部基因检测当作准备完成的证明。  生活支持也要落实到可运行的选择。发生不适时怎样就医，产检时间从哪里腾出，主要照护者需要休息时谁接手，收入中断后哪些必要支出仍能维持。无需在受精前解决未来十八年的全部问题，但至少识别现阶段没有替代的单点依赖。  这张卡的完成标准是：关键资料可以找到；药物和已有疾病有负责人员；叶酸方案明确；下一次咨询有具体问题；双方知道自己正在承担什么。已经怀孕者从现在完成适用部分，不把此前遗漏转化为对自己或伴侣的责备。 S03"},{"ch":31,"id":"c31-s003","title":"31.4　围产期乙肝：一个不能断在科室之间的实例","text":"乙肝表面抗原用HBsAg表示。CDC的围产期路径要求每次妊娠核对HBsAg；阳性结果需要传递给计划接生机构和新生儿团队。按该美国路径，HBsAg阳性孕妇所生婴儿，应在出生十二小时内由医疗团队给予乙肝疫苗及乙肝免疫球蛋白HBIG。 S157  照护者要推动的是四个节点：妊娠结果已确认；接生团队已收到原始结果；出生后的处置有正式记录；后续接种及检测已有负责人。产妇结果未知、低出生体重或早产，不应由家长自行照抄普通婴儿时间表，应让团队立即采用对应分支。  对这类暴露婴儿，CDC参考路径还包括九至十二月龄的HBsAg与抗-HBs检测；接种延迟时另按完成时间安排。这里不是成人的乙肝“三项筛查”组合，不能因名称相似而直接套用。 S157 本地医疗团队负责确认当地程序，家长不自行安排注射或解释全部检验结果。  一条可用交接信息是：“母亲结果及日期在哪里；医院是否已经确认收到；婴儿已做哪些处置；下一次接种与检测由哪家机构负责。”一条不可用信息是：“乙肝问题医生应该知道。”前者能被接手，后者没有验证点。  这个实例也说明一般产检的管理方式：检测、结果解释、临床决定、执行和后续追踪不是同一件事。对其他孕期项目，不由本书任意复制时限，而让产科团队把需要提前安排的项目和分娩时必须知道的信息填进同一张交接表。"},{"ch":31,"id":"c31-s004","title":"31.5　新生儿离院单：两个人、两条照护线","text":"婴儿平稳并不等于产妇平稳，产妇可以出院也不自动证明婴儿所有待回报项目已经正常。因此离院计划分为婴儿与产妇两栏，各自写下一次随访、未解决问题和异常联系，再写共用的照护与交通安排。  交接项 应当拿到什么 常见的假完成 身份与时间 出生时间、孕周、重要出生信息 只有一张纪念照片 喂养 当前方式、需要额外帮助的地方、个体复评要求 只记录喂了多少分钟 筛查 已完成、待回报、需重做、已解释分别标记 把“做过”填成“正常” 随访 具体机构、日期或明确联系流程、负责者 “回去有问题再说” 维生素与药物 实际产品、浓度、单位、用法和给药人 只写“每天一滴” 夜间异常 当地急救入口、可联系团队、哪些变化不等天亮 只有工作日总机号码 产妇支持 个人医疗计划、饮食、睡眠机会和替班 只关心婴儿是否睡得好 照护能力 第二位照护者能实际接手关键步骤 第二个人只是看过视频  不要把缺少某个表格本身当成延迟必要出院或医疗处理的理由；表格是核对工具。真正缺少的可能是结果、解释、可联系的人或操作能力，补的是这些东西，而不是纸面格式。  如果只来得及问三个问题，就问：回家后最需要注意什么；什么情况要提前求助、找谁；下一步什么时候、在哪里完成。得到答案后由接手者复述，再让医疗团队纠正。这个动作比带走一大袋未读宣传单更容易暴露真实误解。"},{"ch":31,"id":"c31-s005","title":"31.6　早产儿：保留两个年龄，不把两个时钟混用","text":"评价发育时，可使用矫正年龄帮助理解早产影响。AAP的计算方法是：实际出生后周龄，减去出生孕周距离四十周的差值；头两年常用这一参照。例如三十二孕周出生、出生后十六周，矫正周龄为十六减八，得到八周。 S158 计算使用周，不把每个月一律当四周。  矫正年龄不是对真实出生日期的修改，也不是所有治疗、服务和接种都要整体后移。CDC指出，多数临床稳定早产儿按实际年龄和通常接种安排处理，低出生体重婴儿的乙肝接种等有特定例外。 S159 具体营养、用药、喂养准备与随访使用负责团队的方案。  家庭主表至少保存出生日期、出生孕周、预产期或专业确认的矫正依据、出院日期与当前随访团队。阅读月龄内容时标明采用哪个年龄；办理预约、填写药物资料时不要为了让表格好看偷偷改出生日期。  对明显能力倒退或新发异常，不能把“早产所以慢一点”当成自动解释。矫正年龄提供参照，不负责排除疾病。担忧出现时带真实时间线咨询，比在多个应用中寻找一个更令人安心的年龄更有用。"},{"ch":31,"id":"c31-s006","title":"31.7　发育窗口：观察、标准化筛查、诊断、支持各有结果","text":"家庭日常观察负责发现变化，标准化筛查负责用规范方式识别需要进一步评估的风险，诊断评估回答具体问题，支持服务则帮助实际参与。前一环完成，不代表后一环已经完成。  美国AAP经CDC公布的参考节点为一般发育筛查九、十八、三十月龄，孤独症专项筛查十八和二十四月龄；任何年龄出现担忧，都应及时提出，不等待下一窗口。 S152 这些是美国服务示例，不替代中国或其他地区儿童保健安排；在使用地确定一条当前有效路径，不把多个国家的全套检查叠加。  节点 保存的最小记录 完成标志 家庭观察 具体能力、出现情境、是否相比本人过去改变 担忧被准确表达，而非给孩子贴标签 标准化筛查 工具或项目、日期、结果与解释者 知道是否需进一步评估 进一步评估 负责专业、预约状态、需要携带的资料 得到可理解的结论与下一步 支持服务 实际目标、服务者、家庭怎样配合 服务已开始，不只是收到转介单 复核 什么能力或参与情况要看变化 根据结果保留、修改或结束相应支持  观察可以围绕动作、交流、共同注意、游戏、自理和真实参与，但不将自制清单称为已经验证的筛查量表。孩子不在陌生人面前展示某项能力，与在所有熟悉情境中都没有这项能力，不是同一个观测。  听力流程也使用相同管理方式。原书新生儿卷已经给出“1—3—6”目标；没有通过筛查的婴儿，下一步不是反复播放声音在家验证，而是完成合适诊断与支持衔接。 S153 把“已转介”与“已经接受服务”分成两个状态，才能发现排队、交通、费用或联系失败造成的失访。"},{"ch":31,"id":"c31-s007","title":"31.8　牙齿与辅食：出现一次，不等于任务已经完成","text":"第一颗牙出现后，家庭清洁开始产生新的实际任务，牙科接触也需要安排。首次就诊时间与清洁剂量见卷十九。本节只新增交付标准：照护者能示范刷牙；牙科人员知道喂养与清洁习惯；家庭知道下次随访；必要协助有人承担。买了儿童牙刷不等于建立了口腔护理。 S160  辅食过敏原也不能以“尝过一次”作为永久完成。NHS建议约六月龄开始辅食时逐一引入可能致敏食物，以便识别反应；确认能够耐受后，将其保留在通常饮食中。已有食物过敏、湿疹或相关风险的婴儿，应在引入前与专业人员讨论，不自行挑战已怀疑过敏的食物。 S55  记录的重点是食物实际形态、少量尝试时的情境、是否出现反应以及后续安排。食物名称相同但形态不同，入口安全可能不同；例如不能把儿童适宜形态的坚果制品与整粒坚果视作同一操作。具体避免食物和噎呛防护沿用喂养及安全卷，不在这里重印。  已经排除一种食物的人，需要知道限制的理由、替代营养来源和是否需要复核。不要因为一篇文章提到某种风险，就永久删除多个食物类别；也不要因为别人说“越早越好”，绕过孩子已有的症状和医疗计划。"},{"ch":31,"id":"c31-s008","title":"31.9　儿童活动：把全天碎片算清，不把玩耍升级成训练营","text":"运动卷的分龄表已经列出量。本节解决怎样把量识别出来：先区分低强度移动、较活跃的玩耍、固定体育活动和长时间受限。推车里的通勤不是孩子正在运动，成人抱着移动也不能按同样分钟替代孩子的自主活动。  一个三至四岁孩子的活动安排，可以散布在早晨、户外游戏、园内活动与下午生活中。家长首先问照护机构一天实际怎样组织活动，再补家里缺少的机会；不能假设上了一整天幼儿园就完全没有活动，也不能假设“有体育课”已经满足全部需要。  记录一两个具有代表性的普通日即可，用于发现长时间受限或几乎没有主动探索的时段。它不是为了给每个跳跃计秒，也不要求长期让儿童佩戴设备证明完成。记录改变了环境之后就可以折叠，新的照护方式出现再复核。  成人提供安全材料、空间、同伴机会与可参与规则；孩子选择怎样进入活动。不会某个游戏时可以降低速度、改变球的大小、缩短一轮或增加支持。活动有明确医疗限制者按相应方案；需要适配不等于只剩旁观。"},{"ch":31,"id":"c31-s009","title":"31.10　成人力量与有氧：明确起点、参考量和进阶是三件事","text":"公共卫生活动目标不是久坐者第一次训练必须完成的量。成人的一般参考包括每周有氧活动和至少两天增强肌力；CDC还给出力量活动每组八至十二次、至少一组的操作参考。 S31 S162 这些数字帮助理解剂量，不代替具体动作学习、疾病分流和恢复观察。  以下为作者设计的低门槛起步示例，适用于无急性症状、没有明确运动禁忌，且能够安全步行或使用相应替代方式的成人。已训练者不必退回此表；孕产恢复、明显疼痛、心肺问题或运动后延迟恶化者，应使用对应专业分支，而非照表加量。  阶段 有氧起步示例 力量学习示例 这一阶段验收什么 第一周 五天各十分钟、强度适合本人的步行或替代活动；可以拆短 分开两天，先学少量动作和器械安全，选择能够控制动作的阻力 能开始、能结束、没有靠压缩睡眠或忽略异常坚持 第二周 前一周耐受良好才考虑五天各十五分钟；也可以维持第一周 继续两次；熟练后再把适用动作向一组八至十二次靠近 动作质量与日常功能没有下降，后续生活仍有余力 后续维护 按实际耐受逐步接近适用的周总量，不限定必须第几周达标 逐渐覆盖主要肌群；是否增加组数、阻力或复杂度一次只改少数因素 计划可持续，且确实服务本人需要的功能  第一周五十分钟、第二周七十五分钟只是这个示例的有氧合计，低于一般成人一百五十分钟中等强度周目标；不能把“完成两周起步”宣传成已经全面达标，也不能为追赶目标一次补完缺少的分钟。  动作选择围绕真实功能，例如适配的坐站、推、拉、髋部活动与安全提踵。第一次不会做时，获取合格示范或选择更容易控制的版本。不要为追求组次数强行做痛、憋气硬顶或依赖他人把重量拉起来；学习期保留动作余地是本示例的保守安排，不是声称所有训练目标都应采用同一努力程度。  每次结束只记录必要信息：做了哪类活动、约多长或多少组、当时反应、接下来生活是否明显受影响。存在运动后症状加重可能者，不能只以“刚做完感觉还行”判定耐受；相关边界见卷二十一。发生危险信号时终止普通训练路径，不等周末复盘。"},{"ch":31,"id":"c31-s010","title":"31.11　个人预防总表：从三种癌症例子扩展为完整入口","text":"预防管理首先是一张适用性地图，不是一张全部需要抽血和拍片的采购单。每一行都允许出现“当前不适用”“已完成、待未来复核”“资料未知”“需要专业判断”四种不同答案。未知不是正常，未安排也不自动表示被遗漏。  入口 先核对什么 下一动作由什么决定 血压 既往可靠测量、家庭测量方法、已知诊断与用药 重复结果、症状、整体风险及个人计划 血脂与心血管风险 LDL-C、HDL-C、甘油三酯等已有结果、重要家族史、吸烟和既有疾病 风险评估，不由体形或感觉良好排除 血糖与代谢 已有异常、相关症状、妊娠或家族等背景 适用的本地筛查或诊断路径，不给所有年龄同一频率 肾脏与其他慢病风险 既往疾病、药物及专业人员已要求的复查 疾病监测与一般筛查分开 感染与接种 乙肝等已有记录、暴露背景、接种史及免疫状态相关信息 本地适应证；暴露后预防不等普通复核日 器官相关癌症筛查 实际器官、既往结果、手术、家族史与当地建议 方法、频率、启动和停止条件分别确认 骨骼与跌倒 既往骨折、绝经、相关用药、跌倒及功能变化 无症状筛查与已有疾病评估分开 牙齿、眼睛、听力 上次检查、症状和真实使用困难 按风险维护；新发紧急变化进入诊断而非等筛查 精神与社会功能 持续困扰、生活受限、照护负担及可用支持 本人表达与专业判断，不用单项应用评分替代  这张地图不是医学机构的完整检查规范；它用于将各专题中分散的问题接到本人真实记录。具体检查项目只有在适用性明确后，才进入到期表。  **血脂示例。**CDC公众资料指出，高胆固醇可以没有症状，多数健康成人每四至六年复核是其参考；存在心血管病、糖尿病或相关家族史者可能需要不同频率。 S166 不能把这个间隔当成所有人的处方，也不能因一次正常结果永久删除这项入口。携带原始单位和结果，避免把不同单位的数值直接比较。  **宫颈示例。**本轮检索到的USPSTF最终建议页面标注二〇一八年并提示更新中。其一般风险示例是二十一至二十九岁细胞学每三年；三十至六十五岁可在细胞学每三年、主要高危HPV检测每五年或联合检测每五年中选择适用路径，而不是全部叠加。超过六十五岁是否停止，仍需考虑既往筛查充分性与高风险史。 S164 这里保留版本身份，不把该页当成二〇二六年新发布的全球标准。  **骨骼示例。**USPSTF二〇二五年最终建议支持女性六十五岁及以上，以及较年轻但风险增加的绝经后女性接受适当筛查；男性普遍筛查证据不足，不等于有骨折、症状或高风险时不需要评估。已有脆性骨折、已知骨质疏松或继发性骨病等不属于照搬一般筛查表的情形。 S163  同一次就诊可以完成总表的适用性核对，不要求当天把所有不确定都变成检测。每个被激活的项目留下下一步；没有指征的项目保留明确理由，在状态改变时再看。"},{"ch":31,"id":"c31-s011","title":"31.12　成人乙肝状态：感染、免疫和既往暴露不能混为一谈","text":"美国CDC建议十八岁及以上成人至少进行一次乙肝三项筛查：HBsAg、抗-HBs与总抗-HBc；持续风险者另行考虑复查。妊娠有单独路径，不因过去接种或检测过就自动跳过本次妊娠的HBsAg核对。 S156 这是注明地区的公共卫生示例，实际检测按所在地与本人情况决定。  家中已有报告时，先找齐日期、项目与解释，不凭“打过疫苗”“肝功能正常”或一个单独阳性标志自行推断完整状态。不同结果组合要回答的问题不同，需要相应专业解释；资料不全时，不用购物平台抗体检测套餐填补所有未知。  一张可用的乙肝记录包含：已经得到哪些结果；谁解释过；是否需要接种、进一步评估或随访；下一节点由谁负责。对怀孕、计划使用影响免疫的治疗或有重要暴露的情况，主动向治疗团队提供既往结果，让相应分支被识别。不是让读者据此自行启动抗病毒药。  儿童尤其是围产期暴露婴儿使用前面的专门路径，不能拿成人三项表照抄。不同用途的同名检测，只有放回年龄、暴露与治疗背景中才有意义。"},{"ch":31,"id":"c31-s012","title":"31.13　接种卡：记录完成链条，而不是只收藏年龄表","text":"接种表应来自所在地当前有效的卫生与接种服务，不从多个国家、年份和产品网页拼成一张混合表。家庭需要维护的是本人实际记录与下一步，而不是自己成为疫苗程序设计者。原书疫苗基础见卷二十。 S121  每个项目至少分清疾病名称或疫苗名称、既往剂次及日期、记录是否可靠、当前是否适用、下一次最早或最迟的安排是否由接种人员确认。有的任务需要补齐记录，有的需要补种讨论，有的当前无需操作；三种情况不能全部写成“未完成”。  核对场景 带给接种人员什么 需要得到的输出 儿童常规保健 完整接种记录、出生情况和已知禁忌相关信息 当前程序、下一剂安排和可用机构 成人记录不全 能找到的旧记录、既往不良反应及当前疾病用药 哪些记录可用，哪些需要重新确认 备孕或妊娠 当前妊娠状态、接种史和产科计划 本阶段适用、暂不适用及后续安排 慢病或影响免疫的治疗前后 完整治疗时间线及负责医生信息 由治疗与接种团队协调的个人计划 迁移、旅行或职业变化 目的地、时间、活动和实际暴露类型 当地当前要求及必要医疗建议 动物咬抓伤等暴露 发生时间、伤口与动物等真实情况 立即进入暴露后医疗评估，不等待普通接种复核  流感、乙肝、HPV、带状疱疹、肺炎球菌及儿童程序中的其他疫苗，是否适合本人，应在对应的年龄、疾病、既往接种和当地可用产品下判断。这里列名称是提醒核对范围，不是要求每个人全部补齐同一清单，也不提供跨地区通用剂次。  如果预约失败，任务仍处于“需要处理”，而不是因为点过预约就消失。记录替代机构或下一次联系；若涉及明确时限，说明时限，让接种团队决定如何处理。不要由软件自动改日期后假装仍在原程序内。"},{"ch":31,"id":"c31-s013","title":"31.14　戒烟行动卡：从“知道不该吸”进入可获得支持的过程","text":"WHO的成人戒烟指导支持行为干预与药物治疗，并指出两者结合能够改善戒烟成功。其提到的有效药物选择包括尼古丁替代治疗、伐尼克兰、安非他酮和金雀花碱；适应证、禁忌、供应及具体用法由当地合格专业人员核对，本书不提供个人处方。 S155  行动不必从“先证明意志足够强”开始。先记录实际烟草使用方式、最常出现的场景、过去尝试时最难的部分以及目前愿意接受的帮助。把问题带给能提供戒烟支持的医疗或正规服务人员，讨论行为支持与适用治疗，而非只再听一遍危害。  可以把行为安排拆成三个实际接口。第一是供给：家中、车内和常去场景是否仍随手可取，谁会递烟。第二是触发：工作停顿、聚会、压力或固定时刻，哪个最容易让原习惯自动发生。第三是替代联系：困难时能找谁、怎样取得支持，是否已经知道复查入口。该拆分是作者提供的执行工具，不是经过验证的独立治疗程序。  本人愿意推进时，与支持者商定清楚目标和开始安排；不愿公开给所有人也可以，只让必要的人知道怎样配合。短暂再次使用不等于全部努力归零，但需要如实记录，分析哪个接口失效并继续获得帮助；不能为了保住连续打卡而隐瞒。  这张卡的验收不是买到戒烟产品，也不是家人监督更严，而是获得了适合的支持、治疗责任清楚、日常触发有应对办法，并能在困难时返回服务。孕哺期、未成年人或有复杂病史者不照抄普通成人药物选择。酒精或镇静药物依赖也不能照搬自行骤停的方式，相关安全边界见睡眠与用药卷。"},{"ch":31,"id":"c31-s014","title":"31.15　多个“好建议”冲突时，只覆盖冲突的部分","text":"身体维护不是把每条建议相加。建议的目标、适用人群、疾病状态和资源前提不同，直接相加可能产生矛盾。管理冲突的关键，是知道哪条规则需要退出，而非再加一个“更全面”的方案。  原来适用的普通建议 新条件出现后 需要采取的结构性动作 逐渐增加活动 活动后延迟恶化、已有相关疾病计划 暂停固定加量，进入相应疾病分支，不以当天表现替代后续反应 多样饮食和一般补充建议 已知过敏、吞咽限制或肾病饮食 保留安全适用的部分，由负责人员明确替代与限制 通过含钾代盐减少钠 慢性肾病或其他需限制钾的情况 先核对适用性，不把低钠标签当成适合所有人 S96 按长期处方维持 出院、手术或新处方改变了方案 核对当前版本，不把旧清单与新清单简单叠加 鼓励个人独立 某一步确实无法安全完成 只提供该步骤需要的支持，不统一接管全部决定 增加学习或训练时间 照护、睡眠和必要责任已经占满容量 先调整责任与资源，不能凭空挤出时间  第一、二、四行的具体医学规则已经分别放在慢病、营养、用药与出院章节，本表不另创停药或治疗阈值。它只使使用者知道该去哪个入口解决冲突。  冲突记录只需要三句：原规则是什么；哪个前提已经变了；谁确认新的处理。暂时无法确认时，不让普通优化任务覆盖必要医疗与安全规则。已经知道怎样处理的部分继续执行，无须把全部生活一起暂停。"},{"ch":31,"id":"c31-s015","title":"31.16　功能储备卡：先问身体正在支持哪些真实任务","text":"同样的年龄和相似的体检指标，可能对应不同的生活能力。维护目标应落在本人想完成的任务上，例如起身、洗澡、走到交通站点、听懂会议、做饭、处理账单或照护家人，而不是只写“保持年轻”。  生活任务 目前需要什么支持 希望保住的结果 何时重新看 出门与返回 独立、工具、提醒、陪同或交通服务 能够参加本人在意的活动 路线、身体或交通改变 吃饭与口腔清洁 准备、摆放、动作或吞咽相关支持 安全摄入并完成清洁 食欲、疼痛、体重或吞咽变化 理解与沟通 安静环境、文字、助听或表达时间 信息真正到达，本人能参与选择 设备、感官或认知状态变化 医疗任务 取药、整理、理解或操作支持 正确执行当前方案 新药、住院、照护者变化 兴趣与贡献 材料、工具、空间或共同参与者 仍能从事喜欢的事 原方式过重或兴趣改变  “独立”不必意味着没有工具；“有支持”也不等于失去本人决定权。记录支持类型比记录“还能不能”更准确，能够把问题定位到某个步骤，而不是把整个人分成能用与不能用。  这张卡不是家庭体能竞赛，不要求高龄或有疾病者在无保护条件下完成计时起立、单脚站立或极限运动。需要标准化功能测试时由适当人员选用和实施。家庭可以安全观察的是：本来能做的日常任务是否发生了实际变化、是否需要更多协助、这种变化是否持续或突然出现。  维护计划以一个任务为单位检验。例如更换照明后，夜间路线是否更容易辨认；调整会议字幕后，参与者是否能表达意见。工具数量增加而参与没有增加，就重新检查问题是否找错，不继续购买同类设备堆叠。"},{"ch":31,"id":"c31-s016","title":"31.17　一次问诊的完整交付：不要只带着“帮我看看”离开","text":"预约之前用最少文字说明：主要问题是什么，何时开始，怎样变化，影响了哪项生活任务，已有的关键疾病和用药是什么，最希望这次获得什么决定。没有证据的推测可以提出，但单独标记，避免把怀疑病名写成已确诊。  会面中优先解决最影响安全与生活的少数问题。离开前核对诊断处于什么确定程度、需要做什么、可能出现什么变化、什么情况需要提前联系、谁负责尚未回报的结果。若专业人员建议观察，应把观察对象与回顾条件说清，而非只留下一个没有期限的“再看看”。  展开：问诊与出院后的七行复述 现在确定知道： 仍需要确认： 今天开始／继续／改变的事项： 药物变化及当前有效清单位置： 出现这些情况不等原预约，联系： 待回报项目、预计获得结果的方式和负责人： 下一次复查；若未收到结果或预约失败怎样处理：  把这七行给实际执行者复述。听懂解释与能够在家完成操作是两回事；涉及复杂设备、转移、伤口或喂养操作时，需要相应培训与回演，不能仅靠一段文字替代。  当多个科室给出不同建议时，不由家属在群里投票。将具体冲突、当前全部用药和目标带给负责协调的专业人员。书中通用规则、旧处方和当前个人计划不能默认权重相同，也不因新建议来自更近的一次聊天就自动更可靠。"},{"ch":31,"id":"c31-s017","title":"31.18　能力进阶：按照前置能力开放，不按照生日强行授权","text":"生活能力的增加可以按四级安排：看过并能解释，受到支持时能完成，在熟悉环境能稳定完成，遇到适度变化能判断何时求助。四级是本书的教学编排，不是临床发育量表；不要求所有人经过同一种动作或在同一年龄到达。  能力 前置条件 一个真实而低风险的练习 完成后新增加的自由 表达需要 有可用的语言、图示、手势或沟通工具 在普通活动里表达想继续、换一种或停止，并得到回应 不必完全靠别人猜测 准备个人用品 认识物品用途，有安全取放位置 按一张简短清单完成外出准备，回来复位 减少临出门对他人的依赖 准备食物 能遵守相应卫生与工具权限 先做无需危险热源的简单准备，再逐项学习更复杂操作 在疲惫或照护中断时仍有备用供给 处理信息 能区分事实、转述和未知 为一条真正影响决定的信息找到原始入口，并说明限制 减少被一句标题带走 处理一笔支出 理解金额、对象与是否持续收费 在许可范围内核对一次实际交易与收据 能发现误付或不需要的续费 完成一个学习项目 目标明确，有材料和反馈者 交付一个可被使用或检查的小作品，再修改一次 可以用结果而不只用时长表达能力 独立出行 实际路线、交通技能、求助渠道与法律权限满足要求 先在安全支持下走完一条真实路线，识别中断时的返回方式 能参与更多地点与活动 医疗沟通 理解能力、授权与支持适当 本人先说明一个问题，再复述下一步 逐步掌握自己的照护信息  授权只覆盖已经会做的部分。会查路线不等于能够独自穿越复杂交通；会看药盒不等于可以独立调整剂量；会完成一次网上购买不等于能判断借贷合同。一个能力取得进展，不自动解锁所有相邻风险。  遇到失败时，定位缺的是知识、操作、环境、支持还是判断。只会在安静家中完成的人，可以先练习在轻微变化中保持步骤；如果失败来自工具根本不适配，就先改工具，不要求本人无限加练。  年幼儿童练习必须在照护和保护边界内，高龄或残障者也可用替代形式逐步增加自主。这里衡量的是获得了哪些真实选择，而不是与别人比较快慢。"},{"ch":31,"id":"c31-s018","title":"31.19　学习的最小可验证循环：输入之后必须出现可观察的能力","text":"卷二十三已经解释检索练习与反馈。这里把它落成一个可直接试用的三十分钟学习块：先用五分钟写清一个具体问题及自己目前的答案；十分钟查阅必要材料；合上资料用十分钟解释、解题或操作；最后五分钟核对差异，留下下一次最值得处理的一个错误。三十分钟和分配比例是作者示例，不是经研究确定的个人最优时长。  检索练习的证据支持主动回忆的重要性，不能被扩大为“所有知识都按同一个间隔复习”或“所有学习都只做题”。 S133 概念、动作、审美、语言和协作需要不同的输出；选择与目标相符的检验，不用一个统一分数覆盖所有能力。  希望学会什么 输入之后的检验 容易造成错觉的替代 理解一个概念 不用原文解释，并给一个适用例与一个不适用例 能认出熟悉句子 解决一类问题 独立完成未见过但同结构的问题 重抄已经展示的答案 掌握一个操作 在安全条件下完成，并指出何时不能照做 连续看很多演示 提高表达 让目标读者复述实际听懂了什么 自己觉得文字很流畅 学习判断 写出关键未知、不同选项及会改变选择的新证据 收藏更多结论截图  下一次学习不必从头重读。先尝试取回上次结果，找出哪里仍然卡住；已经稳定的部分折叠，只展开新增问题。某项技能需要真实反馈，而本人长期得不到，就应把寻找反馈者作为下一步，而不是继续加大输入。  精力下降时可以缩短学习块，保留问题与检验的结构。持续困扰已经影响生活时，使用相应健康与学习支持，不把所有困难归为缺少专注力或再努力就会好。"},{"ch":31,"id":"c31-s019","title":"31.20　增长机会：给可复用成果留一个位置","text":"维护身体是基础，却不等于把全部时间都分给维护。本人希望学习、创造、工作或探索时，可以为“今后仍能使用的成果”留出一个小项目：一项技能、一份说明、一段可以复用的代码、一组可靠关系，或者一件能够继续改进的作品。  这个项目先定义接收者和验收方式。写文章的人明确给谁解决哪个问题；做工具的人让真实使用者试一次；学习职业技能的人保留目标、个人贡献、约束和实际结果。作品集的价值来自可核对能力，不来自把每次尝试包装成巨大成功。  可以用三个问题选择项目：失败后最多失去什么；完成后哪些部分仍可继续使用；是否存在得到真实反馈的入口。选择可承受、能结束的小版本，避免用一个不断扩大且没有验收的目标占满生活。  给探索保留空间，不意味着给身体、借贷或他人安全放开上限。医药自我试验使用原书的风险边界；涉及隐私、合同或公共发布的项目，先确认权限。安全限制应当让试错更容易恢复，而不是把所有新体验都堵住。  项目结束后可选三种结果：保留并维护；修改一个关键环节再试；停止并留下可复用部分。不是每次尝试都要长期坚持，也不要求每种兴趣最终变现。"},{"ch":31,"id":"c31-s020","title":"31.21　资源压力测试：先算真的能够调用什么","text":"日程中的时间与账上的钱都需要按可调用程度区分。已经承诺的资源不再是完全自由的资源；尚未收到的帮助与收入也不能在基础安排中当成已经到账。这个区分是计划的算术前提，不依赖对未来的乐观或悲观判断。  例如，一份纯粹用于演示的现金表：可立即使用资金三万元，每月必要现金流出一万元，假设没有新增收入和额外支出，则能覆盖三个月。这只是三万元除以一万元的情景计算，不是建议每个人只留三个月储备，也没有计入风险分布。加入一项两万元的近期必要支出，剩余覆盖期立刻改变；说明大额到期事项不能藏在平均月支出之外。  资源 先确认的事实 压力情景要问什么 时间 工作、交通、睡眠机会、照护和维护的实际占用 主要责任增加时删哪项，谁同意接手 资金 可用现金、必要支出、到期承诺 收入延迟或必要支出增加后，基本生活是否不断供 照护 谁在什么时段真正可用，掌握哪些操作 主要照护者生病时谁能立即接上 信息 关键记录在哪里，谁有合法访问权限 设备或账号失效时能否取得必要资料 工具与环境 哪些设备、交通或住所条件不可替代 中断时有没有低技术替代方案  做完压力测试，不需要立即把最坏情景都买成一套产品。先修最可能使必要生活停摆的单点，再核对各项成本。涉及保险、借贷、合同或投资的具体决定，使用当地当前材料和适当专业解释，本书不把一个示例比率推广成个人金融建议。  资源预算也不能把伴侣、父母或员工的时间按默认免费填入。共同承担的方案需要对方真实同意，并且能够持续；否则计划只是把自己的缺口藏到另一个人身上。"},{"ch":31,"id":"c31-s021","title":"31.22　二十四小时容量表：让所有任务回到同一张账上","text":"下面是一份作者构造的普通工作日示例，假定工作时段较固定、通勤共一小时三十分钟，没有需要全天照护的婴儿或重病家人。它用于核对时间是否闭合，不声称适用于所有职业、家庭或睡眠需要。  时段 用途 小时 23:00—次日07:00 睡眠机会 8.00 07:00—08:00 起床、清洁、早餐、出门准备 1.00 08:00—08:45 通勤 0.75 08:45—12:00 工作 3.25 12:00—13:00 午餐与休息 1.00 13:00—17:45 工作 4.75 17:45—18:30 通勤 0.75 18:30—19:15 晚餐及相关准备 0.75 19:15—20:00 家务与必要家庭事务 0.75 20:00—20:45 适用活动、准备及清洁；非训练日可重新分配 0.75 20:45—21:15 一个新增学习或项目块 0.50 21:15—22:15 关系、兴趣或休息 1.00 22:15—23:00 收尾、次日准备与缓冲 0.75 合计 每个时段只记一次 24.00  这里预留的是八小时睡眠机会，不保证八小时实际睡眠。活动窗口中的准备和清洁不能再次算进有氧分钟；午餐不能一边在工作小时中占满，一边又在休息预算中重复出现。只有交通条件安全且实际达到相应活动条件的部分，才可在用途说明中同时标注活动价值，但时长仍只能计一次。  计划新增一小时课程时，必须指出从哪里移出这一小时：减少某项可选活动、重新协商家务、改变通勤，或更换课程形式。不能在二十四小时已经用尽后，只在表格底部继续添加。  照护家庭应换用自己的真实约束。上表家务时段不代表照顾婴儿只需四十五分钟，也不意味着轮班者应当调整到这个起床钟点。先保住必要照护和恢复，再安排少数新增；缺少容量时，缩小项目通常比每天制造失败欠账更合适。"},{"ch":31,"id":"c31-s022","title":"31.23　连续两周的新增示例：重复底座不再印十四遍","text":"本表服务于一般成人或照护者的系统搭建，不是临床疗程。安全与必要医疗事项已经按需要处理，不能等此表轮到它。每一天最多选一个真正有用的新增，其余继续适用底座；不存在的问题直接跳过。  日次 当天只展开的新增 应当留下的东西 以后何时再打开 第1天 把个人当前状态和需要支持的任务写清 一张功能卡，而不是健康标签 状态或目标改变 第2天 找齐一项既往重要检查及其解释 原始结果、解释和下一步的位置 出现新结果或到期 第3天 把一个“定期做”改写成行动卡 负责人、触发和完成条件 执行失败或前提改变 第4天 测试一种低精力时仍能取得的餐食 食物获取、储存与清洁链 环境或饮食条件改变 第5天 试一次合适的活动起步 实际完成量与后续反应 下一次活动与计划复核 第6天 交出一项完整家庭任务 接手者能完成并知道异常怎样处理 人员或任务改变 第7天 查看本周真实容量 删掉或缩小一个超额承诺 责任明显增加 第8天 完成一个小学习输出 解释、作品或解决的一道新问题 下次检索与反馈 第9天 为当前预防安排补一处真实空白 预约、结果解释或明确不适用理由 到期或风险改变 第10天 测试一个重要资料的获取路径 另一位获授权者能找到必要信息 权限、设备或人员改变 第11天 为一项高频困难改变环境 新的位置、工具或入口实际可用 困难再次出现 第12天 给想长期保留的能力做一次迁移练习 换一个场景仍能用，或发现明确限制 下一次遇到新场景 第13天 处理一个未闭环事项 结束、明确暂缓理由，或下一责任人 约定的复核条件 第14天 保留有效改变、删除多余记录 简短维护规则和少数到期任务 重大变化或适当周期  完成后不再从第一天无限循环。已经稳定的基础动作压缩成短规则，只有真正到期、出现变化或失效的内容重新展开。连续两周只是阅读与组织示例，不是身体形成习惯或康复需要的固定天数。"},{"ch":31,"id":"c31-s023","title":"31.24　两位照护者的容量不能用一个总小时数代替","text":"照护的困难常常不在总小时，而在不可离开的时段、夜间打断和操作门槛。两个成人都在家，不等于任何时刻都有人能够安全接手；一人同时开会、做饭与看护，也不能在三项任务上都被计为完整负责人。  实际排班先标记四种状态：正在负责照护、可随时接手但暂未负责、不可被调用、受到保护的休息。交接时明确改变状态，而不是默认谁听见哭声谁就负责。婴儿需要喂养或病人需要治疗时，仍按照个人计划，不能为守住表格让需要无人响应。  夜间任务应当连同准备、操作、清洁和重新安定计入负担，而不只统计主要动作的几分钟。亲友提供帮助时，可以承担餐食、取物、交通或家务，把真正可休息的时间还给主要照护者，而不是只增加一位需要招待的客人。  当两位主要照护者都已无法安全完成必要工作，解决方案不是继续优化提醒频率。应减少非必要事务，寻求可用亲友、正式照护或医疗与社区支持，并说明具体缺口。照护不足属于需要处理的资源问题，不是靠一张完美日程能够消失的问题。"},{"ch":31,"id":"c31-s024","title":"31.25　到期任务的状态：预约过不等于完成，过期不等于重新开始","text":"一条真正需要跟踪的任务可以处于：待判断是否适用、已激活待安排、已预约、已执行待结果、结果待解释、后续处理中、已完成、明确暂缓或不再适用。把这些状态分开，是为了看见任务卡在哪一环，而不是增加行政层级。  重复基础动作使用一张有效规则，不每天创建一条新的“刷牙项目”。存在明确截止或未闭环结果的事项才进入到期表；可选年度主题放在另一层，不与急症、喂养或重要随访争抢提醒。  任务 来源与授权 当前状态 下一动作 负责人 下一时间与依据 完成证据 示例：已由团队安排的复查 当前医疗计划 已预约 准备资料并按约就诊 本人／合法支持者 使用真实预约，不由本书生成 结果已解释，下一步明确 示例：筛查未回报 检查机构 已执行待结果 按既定渠道取得结果 指定跟踪人 机构明确的回报安排 正式结果与解释 示例：新增学习作品 本人选择 已激活待安排 完成一个可检验小样 本人 按实际容量选择 作品与真实反馈  错过一项医疗预约时，联系负责机构确认新安排，不能由软件自行“顺延一周”并假装医学条件没有改变。更不能把漏掉的一次剂量、活动或学习统一按“下次双倍补做”处理。不同任务的补救规则各不相同。  执行模板可以保存在纸张、普通文本或本人认可的工具中。涉及他人健康和身份资料，限制访问，不把完整病史放入公开任务看板。自动提醒只能提示已确认的任务，不能把尚未核实的建议自动转换为处方或强制日程。"},{"ch":31,"id":"c31-s025","title":"31.26　源信息变化时，怎样更新而不让整本书失效","text":"一条可维护的证据记录，需要保存具体主张、适用人群、地区、来源及其版本日期、实际核对日期、支持到什么程度，以及哪些行动依赖它。网页今天还能打开，不等于它今天刚更新；页脚版权年份，也不能当作医学建议的版本。  当某项建议改变时，先找受影响的规则与任务，而不是让读者从第一卷重新读到最后。比如某地调整接种程序，更新本人的接种计划与到期任务；睡眠环境、生活技能或备份规则并不会因此全部失效。只有共享同一前提的内容才一起复核。  同样，“需要进一步研究”可能影响证据把握，却不一定改变今天的行动。如果一项非必要干预一直缺少可靠的人体获益证据，新的机制故事不自动使它值得立即使用。相反，发现原来适用条件被误读、药物重复或时间敏感步骤漏掉，就应优先修正。  本版的来源登记区分继承来源与本轮实际重核的命题。未重核不等于错误，但不能把旧编号自动升级成“本轮全部确认”。读者针对个人高风险决定，应由相应专业人员核对当前条件；工具格式检查只能保证编号与链接结构，不提供临床担保。"},{"ch":31,"id":"c31-s026","title":"31.27　四个有区分力的使用情景","text":"**第一种：两月龄，听力筛查未通过，尚未落实进一步评估。**当天新增不是练一项两月龄游戏，而是推进诊断评估的联系与安排。其他必要喂养和安全照护照常。年龄主题不能覆盖一个已经出现的时间敏感分支。 S153  **第二种：三十二岁，自觉状态好，从未找到血脂记录。**不能因此判为异常，也不能把未知填成正常。下一步是核对是否做过、是否适用当前风险评估；不是立即购买全面扫描，更不是依据书中的年龄安排自行用药。 S166  **第三种：开始运动后，当天尚可，但以后生活明显受影响。**不能只以训练打卡成功判断方案有效。先区分普通负担与需要评估的变化，按运动和慢病分支调整；本书的两周起步表不覆盖个人疾病计划。  **第四种：八十岁，某项日常任务变慢，但本人仍能参与决定。**先观察具体受限步骤与环境，支持需要帮助的部分，保留本人偏好。不因年龄或速度变化统一接管，也不为证明独立拒绝必要协助。变化突然或明显时先获得合适评估，不用功能卡自行诊断。  这四个情景的共同点不是“每天增加更多”，而是新信息真正改变了哪一步。没有新问题时，继续当前有效规则；出现会改变行动的信息时，准确展开相应分支。书的使用价值，应当体现在少一些遗漏、少一些重复折腾，以及多一些本人真正能够做的事。"}],"sources":"\u003cp\u003e\u003ca id=\"sources\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003e来源与证据说明\u003c/h2\u003e\n\u003cp\u003e来源支持相邻的具体命题，不代表机构认可作者编排的日程、动作顺序或整本书。来源登记共166项，正文引用160项；6项仅保留为导航或扩展入口。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e本轮核对范围：24项来源中的指定命题，包括9项原有来源与15项新增来源。其余142项来源沿用原版登记，本轮没有重新逐页核验。\u003c/strong\u003e“沿用”不等于错误，也不等于已经重新确认。新编的时间预算、任务卡、能力进阶与练习时长，是明确标注的作者编排，不是临床试验结论。\u003c/p\u003e\n\u003cp\u003e核对日期为2026年9月29日。页面更新时间与实际核对时间分别记录；较早的最终建议未被改称为2026年新指南。美国、英国及国际机构的具体数值或路径均保留适用范围，不能拼接成全球统一的检查套餐。网上来源可能后续迁移、更新或撤回。\u003c/p\u003e\n\u003cp\u003e书中原有来源标题可能沿用原登记，命题核验登记保留本轮实际读取的页面名称。逐条记录见资料包中的 \u003ccode\u003edata/本轮命题核验登记.json\u003c/code\u003e；正文与该表均不提供个人诊疗授权。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s01\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S01] WHO｜Physical activity\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/physical-activity\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ePhysical activity\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：体力活动总体依据。\u003c/p\u003e\n\u003cp\u003e本轮核对：2026-09-29；页面／文件日期：2024-06-26。\u003c/p\u003e\n\u003cp\u003e核对命题：一般体力活动、各年龄指南入口；不作为详细剂量唯一来源。仅核对这些命题，不代表认可页面全部陈述或整本书。\u003c/p\u003e\n\u003cp\u003e正文未直接引用，保留为导航／扩展入口。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s02\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S02] WHO｜Healthy diet\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/healthy-diet\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eHealthy diet\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：膳食结构与成人盐糖参考。\u003c/p\u003e\n\u003cp\u003e本版状态：沿用1.0来源登记，本轮未重新逐页核验。实际高风险决策须复核原始来源、现行版本与适用条件。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s03\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S03] CDC｜About Folic Acid\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.cdc.gov/folic-acid/about/index.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eAbout Folic Acid\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：一般风险叶酸基础。\u003c/p\u003e\n\u003cp\u003e本轮核对：2026-09-29；页面／文件日期：2026-09-18。\u003c/p\u003e\n\u003cp\u003e核对命题：一般风险叶酸400微克及受精前至少1个月。仅核对这些命题，不代表认可页面全部陈述或整本书。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s04\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S04] WHO｜Infant and young child feeding\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.who.int/news-room/fact-sheets/detail/infant-and-young-child-feeding\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eInfant and young child feeding\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：婴幼儿喂养。\u003c/p\u003e\n\u003cp\u003e本版状态：沿用1.0来源登记，本轮未重新逐页核验。实际高风险决策须复核原始来源、现行版本与适用条件。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s05\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S05] CDC｜About Sleep\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://www.cdc.gov/sleep/about/index.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eAbout Sleep\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：分龄睡眠参考范围。\u003c/p\u003e\n\u003cp\u003e本版状态：沿用1.0来源登记，本轮未重新逐页核验。实际高风险决策须复核原始来源、现行版本与适用条件。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"s06\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e[S06] NICHD｜Safe Sleep Environment for Baby\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://safetosleep.nichd.nih.gov/reduce-risk/safe-sleep-environment\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eSafe Sleep Environment for Baby\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e对应范围：婴儿睡眠环境。\u0
