样控制感染、发生反应时在哪里处理、随访由谁承担、能否获得完整记录。收费合同与同意书不等于风险已被理解；读不懂时应暂停并获得独立解释，而不是因为预约难得就赶着签字。\u003c/p\u003e\n\u003ch3 id=\"c30-s006\"\u003e三十·七　高压氧与其他设备：治疗参数不能从体验感反推\u003c/h3\u003e\n\u003cp\u003e高压氧在特定临床问题中有用途，同时存在压力相关耳部损伤、氧相关不良反应等风险，富氧环境还需要严格防火管理。它应由了解病情和设备要求的团队管理，不能把“吸氧”理解成一种可以任意加量的普通休息方式。\u003ca href=\"#s151\"\u003eS151\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e一种技术能够用于某种疾病，不构成它已经适合健康人普遍延寿的证据。比较研究与商业服务时，不能只比较设备名称，还要看人群、压力、供氧方式、疗程、监测与终点是否相同。若这些条件不同，不能把研究图表直接贴在另一种服务上作为效果承诺。\u003c/p\u003e\n\u003cp\u003e本书不根据年龄给出高压氧、冷热刺激或其他设备的统一日程。正在接受医疗治疗的人遵循个人方案；为了探索而考虑服务的人，先核对证据与风险，不把体感放松或短暂精神变化直接等同长期健康收益。设备越复杂，越需要明确谁负责异常识别和紧急处置。\u003c/p\u003e\n\u003ch3 id=\"c30-s007\"\u003e三十·八　强刺激并不自动产生强收益\u003c/h3\u003e\n\u003cp\u003e“让身体受一点压力就会更强”不能成为所有极端做法的总许可证。需要分别说明是什么刺激、由谁接受、强度和恢复怎样控制、研究观察到了什么、哪些人被排除。身体能承受一次，不等于适合长期重复；主观兴奋也不等于组织和功能没有付出代价。\u003c/p\u003e\n\u003cp\u003e禁食、冷水、高温和高强度训练，不应为了追求某个抗衰标签而同时叠加。疾病用药、孕产期、儿童生长、进食障碍史、虚弱和运动后症状加重等情况，已经在相关章节设置了优先分支，不能被“健康挑战”重新覆盖。\u003c/p\u003e\n\u003cp\u003e要识别一个危险的叙事：每次不适都被解释为排毒、适应或即将进步，因此永远没有需要停止的证据。任何值得执行的方案都应允许失败、允许不适被认真评估、允许退出。禁止反证的方案，不适合用身体替它作担保。\u003c/p\u003e\n\u003ch3 id=\"c30-s008\"\u003e三十·九　外貌愿望与健康愿望可以分开\u003c/h3\u003e\n\u003cp\u003e想改善外貌是可以被尊重的选择，不需要假装所有美容都是治疗，也不需要把不愿接受美容的人定义为放弃自己。先说清想改变的是皮肤表现、发型、比例、某个结构，还是对被评价的担忧，不把不同问题都压成“抗衰”。\u003c/p\u003e\n\u003cp\u003e任何不可逆或侵入性美容决策，都应比较实际目标、可达到程度、并发症、恢复期、维持成本和不做的选项。不要把修图、不同光线和选择性照片当作可复制结果；也不要在连续不满意时立即追加下一项目。需要暂停的可能是决策过程，而不一定是某个身体部位仍然不够好。\u003c/p\u003e\n\u003cp\u003e低风险日常皮肤与口腔护理见卷十九，不因进入中年就需要升级为越来越复杂的操作。外貌不应成为获得社交、工作和亲密关系的资格考试，医学也不应该被用来执行一个无限收紧的审美标准。\u003c/p\u003e\n\u003ch3 id=\"c30-s009\"\u003e三十·十　参与研究，与购买承诺不同\u003c/h3\u003e\n\u003cp\u003e正规研究也存在不确定性，参加研究的意义不能被描述成保证获得更先进治疗。阅读知情同意时，理解研究目的、分组方式、可能没有直接受益、需要做哪些检查、退出和后续照护安排，以及谁承担相关费用和伤害处理。\u003c/p\u003e\n\u003cp\u003e可以独立核实伦理审查、负责机构和公开登记信息，但登记本身不回答产品是否已被证明有效，也不替代监管授权。\u003ca href=\"#s148\"\u003eS148\u003c/a\u003e 研究团队应允许提问，不以“错过这次就没有机会”阻止冷静判断。付款模式、宣传方式和实际研究文件不一致时，需要进一步核实。\u003c/p\u003e\n\u003cp\u003e本人无法充分理解或表达时，需要依适用法律与伦理要求提供支持与保护，不能把照护者的希望直接替代本人的利益。儿童与高度依赖照护的人，更不应成为家庭未经验证优化计划的试验对象。\u003c/p\u003e\n\u003ch3 id=\"c30-s010\"\u003e三十·十一　把证据卡写成一页\u003c/h3\u003e\n\u003cp\u003e一份可用的证据卡不需要堆满术语。第一行写具体主张，第二行写适用人群与比较对象，随后记研究设计、测量结果、持续时间、主要限制和不良事件。原始来源能找到，广告改写处能识别，已经足以比只收藏结论前进一步。\u003c/p\u003e\n\u003cp\u003e另外单独写“我为什么考虑它”。同一个产品可能有人为缓解症状，有人为社交归属，有人为缓解对死亡的焦虑。只有第一类问题能直接由产品的生物学证据回答；其他需求需要自己的处理路径，不能无限用新项目替代。\u003c/p\u003e\n\u003cp\u003e最后写行动状态：不适用；资料不足暂缓；带给专业人员讨论；符合条件可按专业方案执行；已有明确理由停止或复核。状态可以随证据变化而更新，不必把早先的选择维护成身份认同。承认以前判断需要修改，是信息真正产生价值的时刻。\u003c/p\u003e\n\u003ch3 id=\"c30-s011\"\u003e三十·十二　未来一百年的更新规则\u003c/h3\u003e\n\u003cp\u003e本书只能代表本版核对范围，不可能预先固定未来一百年的指南、技术、法律与个人状态。真正应保留的是更新接口：什么新信息出现时需要重读，哪类专业人员负责解释，旧建议怎样退出，改变后如何确认没有遗漏必要照护。\u003c/p\u003e\n\u003cp\u003e更新可以由四类事件触发：本人状态改变；有质量较高且适用的新证据；当地规则或可用服务改变；原方案出现负担或不良后果。没有这些变化时，不必每天重建全部生活。把更新频率设得低于信息流刷新频率，才能保留执行和体验的空间。\u003c/p\u003e\n\u003cp\u003e新增方法应替代或补充一个明确缺口，不能只因新颖就永久加入清单。每增加一项维护，问是否可以删除另一项低价值维护。一个越来越复杂、只有精力最好时才能运行的健康系统，可能正在偏离最初目标。\u003c/p\u003e\n\u003ch3 id=\"c30-s012\"\u003e三十·十三　全书的最后一天，仍然可以很普通\u003c/h3\u003e\n\u003cp\u003e想象出生后一百岁的一天。它不需要完成全书总结，不需要证明所有选择正确，也不需要为了成为励志故事配合别人的镜头。根据真实状态，吃喜欢且适合的食物，得到需要的帮助，与愿意见的人联系，完成一点想做的事，或者安静休息，都可以是一种完整生活。\u003c/p\u003e\n\u003cp\u003e同样的原则适用于一岁、十八岁和四十岁。身体不是必须榨取最大产出的机器，也不是只能小心封存的收藏品。它是你参与世界的条件之一；使用得好，既包含维护，也包含行动、感受、学习、连接和在必要时接受帮助。\u003c/p\u003e\n\u003cp\u003e这本书最后交还给读者的，不是一份不能违背的百年命令，而是一套能够定位今天、理解变化、减少无谓风险并保留选择的方法。今天没有新增事项，就把重复部分折叠起来，继续生活。真正重要的改变出现时，再展开对应的一页。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c30-s000","title":"三十·一　先把“有希望”放在正确的位置"},{"id":"c30-s001","title":"三十·二　生物年龄不是另一张出生证明"},{"id":"c30-s002","title":"三十·三　“全面检测”先回答结果之后怎么办"},{"id":"c30-s003","title":"三十·四　药物名称不能替代适应证"},{"id":"c30-s004","title":"三十·五　补充剂叠加的复杂度需要被计算"},{"id":"c30-s005","title":"三十·六　注射与再生医学：进入人体的路径也是风险的一部分"},{"id":"c30-s006","title":"三十·七　高压氧与其他设备：治疗参数不能从体验感反推"},{"id":"c30-s007","title":"三十·八　强刺激并不自动产生强收益"},{"id":"c30-s008","title":"三十·九　外貌愿望与健康愿望可以分开"},{"id":"c30-s009","title":"三十·十　参与研究，与购买承诺不同"},{"id":"c30-s010","title":"三十·十一　把证据卡写成一页"},{"id":"c30-s011","title":"三十·十二　未来一百年的更新规则"},{"id":"c30-s012","title":"三十·十三　全书的最后一天，仍然可以很普通"}]},{"id":31,"title":"卷三十一　时间窗口、执行卡与能力进阶：把原则接成能执行的一天","html":"\u003ch2\u003e卷三十一　时间窗口、执行卡与能力进阶：把原则接成能执行的一天\u003c/h2\u003e\n\u003cp\u003e\u003ca id=\"c31\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c31-s000\"\u003e31.1　行动卡：让一句建议拥有执行条件\u003c/h3\u003e\n\u003cp\u003e“注意营养”“定期检查”“多交流”都可以是正确方向，却还不能告诉一个人今天做什么。需要重复执行或跨人交接的建议，应当落在一张行动卡中。卡片不是越长越好，而是不能省掉会使行动分叉的条件。\u003c/p\u003e\n\u003cp\u003e一张完整卡可以回答十个问题：为谁服务；解决什么具体问题；何时启动；开始前必须满足什么；由谁负责；实际做什么、做到何种程度；什么算完成；发生什么需要停止或求助；何时复核；依据来自哪里。没有药物或医疗剂量的任务，不必硬加“剂量”；但清楚的持续时间、范围或交付物仍有价值。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e字段\u003c/th\u003e\n\u003cth\u003e应当填写的内容\u003c/th\u003e\n\u003cth\u003e不合格的替代\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e适用对象\u003c/td\u003e\n\u003ctd\u003e实际年龄、相关能力、疾病与资源条件\u003c/td\u003e\n\u003ctd\u003e“所有人都适用”\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e目标\u003c/td\u003e\n\u003ctd\u003e维持或改善的真实功能\u003c/td\u003e\n\u003ctd\u003e“变得更好”\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e启动条件\u003c/td\u003e\n\u003ctd\u003e事件、已确认到期日、首次出现的需要\u003c/td\u003e\n\u003ctd\u003e只写一个任意生日\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e必要前提\u003c/td\u003e\n\u003ctd\u003e安全环境、已获授权、工具或专业计划\u003c/td\u003e\n\u003ctd\u003e假设条件天然存在\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e责任人\u003c/td\u003e\n\u003ctd\u003e一个能接手的人或明确负责团队\u003c/td\u003e\n\u003ctd\u003e“家里有人会管”\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e执行动作\u003c/td\u003e\n\u003ctd\u003e动词、对象、范围、必要单位与顺序\u003c/td\u003e\n\u003ctd\u003e“加强管理”\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e完成证据\u003c/td\u003e\n\u003ctd\u003e结果、回演、可恢复文件或已生效安排\u003c/td\u003e\n\u003ctd\u003e只看是否买过、预约过\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e停止与升级\u003c/td\u003e\n\u003ctd\u003e具体变化及联系路径\u003c/td\u003e\n\u003ctd\u003e“不舒服就注意”\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e复核与退出\u003c/td\u003e\n\u003ctd\u003e到期、状态改变或任务已无需维持\u003c/td\u003e\n\u003ctd\u003e永远每日打卡\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e来源身份\u003c/td\u003e\n\u003ctd\u003e临床计划、正式建议、作者示例或个人偏好\u003c/td\u003e\n\u003ctd\u003e把所有文字视为同等证据\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e这里的“完成证据”不能被误解成必须上传截图。许多任务当面验证后即可，不需要制造新的隐私材料。能够独立完成一次安全的钥匙取放，不必持续拍摄家中出入；能够复述医嘱，也不代表必须录下整段诊疗。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开：可直接复制的单项行动卡\u003c/summary\u003e\n\u003cp\u003e任务名称：\u003c/p\u003e\n\u003cp\u003e适用对象与当前状态：\u003c/p\u003e\n\u003cp\u003e我要保住或改善的生活功能：\u003c/p\u003e\n\u003cp\u003e启动条件／已确认到期日：\u003c/p\u003e\n\u003cp\u003e必要前提与授权：\u003c/p\u003e\n\u003cp\u003e责任人；缺席时替代人：\u003c/p\u003e\n\u003cp\u003e今天的动作；必要的量、单位与顺序：\n完成后应该出现的结果：\u003c/p\u003e\n\u003cp\u003e出现什么就停止／提前联系谁：\u003c/p\u003e\n\u003cp\u003e下次复核条件；何时可以退出：\u003c/p\u003e\n\u003cp\u003e依据、版本、解释人及尚未解决的问题：\u003c/p\u003e\n\u003c/details\u003e\n\u003cp\u003e不清楚的字段写“未确认”，而不是填一个看起来合理的答案。对于时间敏感医疗事项，未确认意味着立即找到负责团队核实；对于普通兴趣任务，未确认可能只意味着先做一个可撤回的小样。两类未知不应触发同一种处理。\u003c/p\u003e\n\u003ch3 id=\"c31-s001\"\u003e31.2　时间窗口：阅读日、开始日、截止日不是同一件事\u003c/h3\u003e\n\u003cp\u003e日历至少包含四种时间。阅读日是方便学习的安排；开始日是某项措施真正需要生效的时间；截止日是不能随意越过的服务或医学节点；复核日则检查已经运行的安排。把它们混成一个日期，就可能在已经需要行动时继续等待。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e情境\u003c/th\u003e\n\u003cth\u003e最先触发的是什么\u003c/th\u003e\n\u003cth\u003e今天需要产生的结果\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e开始考虑怀孕\u003c/td\u003e\n\u003ctd\u003e受精前准备，而非试纸阳性之后才启动全部准备\u003c/td\u003e\n\u003ctd\u003e核对既有疾病、用药与叶酸安排，进入孕前计划\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e新生儿即将出院\u003c/td\u003e\n\u003ctd\u003e离院前交接，而非家庭日历第三天\u003c/td\u003e\n\u003ctd\u003e明确随访、待回报项目、照护操作和异常联系\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e听力筛查未通过\u003c/td\u003e\n\u003ctd\u003e结果本身，而非等下一次年度卡\u003c/td\u003e\n\u003ctd\u003e得到诊断评估的负责人和预约路径\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第一颗牙出现\u003c/td\u003e\n\u003ctd\u003e实际事件，而非一律等一岁\u003c/td\u003e\n\u003ctd\u003e启动相应清洁，并安排早期牙科接触\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e孩子开始翻身、攀爬或能打开容器\u003c/td\u003e\n\u003ctd\u003e新能力出现，而非下一月龄页面\u003c/td\u003e\n\u003ctd\u003e立即重新审查睡眠用品、跌落路径与危险物存放\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e强刺激化学品进入眼内\u003c/td\u003e\n\u003ctd\u003e暴露当时，而非医生回电话之后\u003c/td\u003e\n\u003ctd\u003e立即冲洗并同步求助\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e收到异常报告\u003c/td\u003e\n\u003ctd\u003e结果需要解释，而非“检查已完成”\u003c/td\u003e\n\u003ctd\u003e解释、后续决定和承担跟踪的人\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e换药、换照护者或出院\u003c/td\u003e\n\u003ctd\u003e原方案可能已失效，而非新年再整理\u003c/td\u003e\n\u003ctd\u003e统一当前版本并让接手者回演\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e年度兴趣主题到了\u003c/td\u003e\n\u003ctd\u003e可选提醒，而非新增义务\u003c/td\u003e\n\u003ctd\u003e有价值且有容量才做，否则跳过\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e医学窗口的依据分别见孕期、新生儿、器官维护卷及本卷相应来源；生活组织的顺序是作者编排。该表的作用是分清触发关系，不是给每种事件设一个全球统一期限。\u003c/p\u003e\n\u003cp\u003e遇到“截止六个月”这样的目标，不要读成“六个月之前什么都不用做”；遇到“适用于五岁以上”，也不能推导“四岁不需要活动”。截止是避免失访的边界，年龄组是证据与建议的组织方式，实际能力和风险仍然存在。\u003c/p\u003e\n\u003cp\u003e一个任务有多个时钟时，分别保存。例如早产儿的实际年龄、矫正年龄、出院后天数和下一次随访日期，回答不同问题。软件能够准确算出年龄，不等于它已经知道该采用哪个临床时钟。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"r31-preconception\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c31-s002\"\u003e31.3　受精前行动卡：把准备往上游移动\u003c/h3\u003e\n\u003cp\u003e一般风险叶酸的量与受精前开始时间见卷二，不在每张表里重复抄写。这里补充的是准备如何交付：不能只有“双方重视健康”，应当留下当前药物清单、已有检查的索引、接种记录、重要既往经历，以及需要找谁解释的少数问题。\u003c/p\u003e\n\u003cp\u003e药物清单写实际服用，而非购物记录。长期处方、偶尔使用的药、外用药与补充剂分开，保留成分、剂量、频率和开药者。不清楚是否适合备孕时，联系负责者讨论；提前核对的目的，是为必要调整留下空间，不是让所有人自行停药。\u003c/p\u003e\n\u003cp\u003e既往经历不只填写“是否生过孩子”。将重要妊娠结果、已知生殖问题、既往治疗和家族中的明确诊断带给相应人员；没有可靠资料就保留未知，不凭亲戚说法给自己作遗传诊断。由专业人员决定哪些信息需要进一步验证，而不是把全部基因检测当作准备完成的证明。\u003c/p\u003e\n\u003cp\u003e生活支持也要落实到可运行的选择。发生不适时怎样就医，产检时间从哪里腾出，主要照护者需要休息时谁接手，收入中断后哪些必要支出仍能维持。无需在受精前解决未来十八年的全部问题，但至少识别现阶段没有替代的单点依赖。\u003c/p\u003e\n\u003cp\u003e这张卡的完成标准是：关键资料可以找到；药物和已有疾病有负责人员；叶酸方案明确；下一次咨询有具体问题；双方知道自己正在承担什么。已经怀孕者从现在完成适用部分，不把此前遗漏转化为对自己或伴侣的责备。\u003ca href=\"#s03\"\u003eS03\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"r31-hbv-birth\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c31-s003\"\u003e31.4　围产期乙肝：一个不能断在科室之间的实例\u003c/h3\u003e\n\u003cp\u003e乙肝表面抗原用HBsAg表示。CDC的围产期路径要求每次妊娠核对HBsAg；阳性结果需要传递给计划接生机构和新生儿团队。按该美国路径，HBsAg阳性孕妇所生婴儿，应在出生十二小时内由医疗团队给予乙肝疫苗及乙肝免疫球蛋白HBIG。\u003ca href=\"#s157\"\u003eS157\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e照护者要推动的是四个节点：妊娠结果已确认；接生团队已收到原始结果；出生后的处置有正式记录；后续接种及检测已有负责人。产妇结果未知、低出生体重或早产，不应由家长自行照抄普通婴儿时间表，应让团队立即采用对应分支。\u003c/p\u003e\n\u003cp\u003e对这类暴露婴儿，CDC参考路径还包括九至十二月龄的HBsAg与抗-HBs检测；接种延迟时另按完成时间安排。这里不是成人的乙肝“三项筛查”组合，不能因名称相似而直接套用。\u003ca href=\"#s157\"\u003eS157\u003c/a\u003e 本地医疗团队负责确认当地程序，家长不自行安排注射或解释全部检验结果。\u003c/p\u003e\n\u003cp\u003e一条可用交接信息是：“母亲结果及日期在哪里；医院是否已经确认收到；婴儿已做哪些处置；下一次接种与检测由哪家机构负责。”一条不可用信息是：“乙肝问题医生应该知道。”前者能被接手，后者没有验证点。\u003c/p\u003e\n\u003cp\u003e这个实例也说明一般产检的管理方式：检测、结果解释、临床决定、执行和后续追踪不是同一件事。对其他孕期项目，不由本书任意复制时限，而让产科团队把需要提前安排的项目和分娩时必须知道的信息填进同一张交接表。\u003c/p\u003e\n\u003ch3 id=\"c31-s004\"\u003e31.5　新生儿离院单：两个人、两条照护线\u003c/h3\u003e\n\u003cp\u003e婴儿平稳并不等于产妇平稳，产妇可以出院也不自动证明婴儿所有待回报项目已经正常。因此离院计划分为婴儿与产妇两栏，各自写下一次随访、未解决问题和异常联系，再写共用的照护与交通安排。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e交接项\u003c/th\u003e\n\u003cth\u003e应当拿到什么\u003c/th\u003e\n\u003cth\u003e常见的假完成\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e身份与时间\u003c/td\u003e\n\u003ctd\u003e出生时间、孕周、重要出生信息\u003c/td\u003e\n\u003ctd\u003e只有一张纪念照片\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e喂养\u003c/td\u003e\n\u003ctd\u003e当前方式、需要额外帮助的地方、个体复评要求\u003c/td\u003e\n\u003ctd\u003e只记录喂了多少分钟\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e筛查\u003c/td\u003e\n\u003ctd\u003e已完成、待回报、需重做、已解释分别标记\u003c/td\u003e\n\u003ctd\u003e把“做过”填成“正常”\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e随访\u003c/td\u003e\n\u003ctd\u003e具体机构、日期或明确联系流程、负责者\u003c/td\u003e\n\u003ctd\u003e“回去有问题再说”\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e维生素与药物\u003c/td\u003e\n\u003ctd\u003e实际产品、浓度、单位、用法和给药人\u003c/td\u003e\n\u003ctd\u003e只写“每天一滴”\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e夜间异常\u003c/td\u003e\n\u003ctd\u003e当地急救入口、可联系团队、哪些变化不等天亮\u003c/td\u003e\n\u003ctd\u003e只有工作日总机号码\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e产妇支持\u003c/td\u003e\n\u003ctd\u003e个人医疗计划、饮食、睡眠机会和替班\u003c/td\u003e\n\u003ctd\u003e只关心婴儿是否睡得好\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e照护能力\u003c/td\u003e\n\u003ctd\u003e第二位照护者能实际接手关键步骤\u003c/td\u003e\n\u003ctd\u003e第二个人只是看过视频\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e不要把缺少某个表格本身当成延迟必要出院或医疗处理的理由；表格是核对工具。真正缺少的可能是结果、解释、可联系的人或操作能力，补的是这些东西，而不是纸面格式。\u003c/p\u003e\n\u003cp\u003e如果只来得及问三个问题，就问：回家后最需要注意什么；什么情况要提前求助、找谁；下一步什么时候、在哪里完成。得到答案后由接手者复述，再让医疗团队纠正。这个动作比带走一大袋未读宣传单更容易暴露真实误解。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"r31-preterm\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c31-s005\"\u003e31.6　早产儿：保留两个年龄，不把两个时钟混用\u003c/h3\u003e\n\u003cp\u003e评价发育时，可使用矫正年龄帮助理解早产影响。AAP的计算方法是：实际出生后周龄，减去出生孕周距离四十周的差值；头两年常用这一参照。例如三十二孕周出生、出生后十六周，矫正周龄为十六减八，得到八周。\u003ca href=\"#s158\"\u003eS158\u003c/a\u003e 计算使用周，不把每个月一律当四周。\u003c/p\u003e\n\u003cp\u003e矫正年龄不是对真实出生日期的修改，也不是所有治疗、服务和接种都要整体后移。CDC指出，多数临床稳定早产儿按实际年龄和通常接种安排处理，低出生体重婴儿的乙肝接种等有特定例外。\u003ca href=\"#s159\"\u003eS159\u003c/a\u003e 具体营养、用药、喂养准备与随访使用负责团队的方案。\u003c/p\u003e\n\u003cp\u003e家庭主表至少保存出生日期、出生孕周、预产期或专业确认的矫正依据、出院日期与当前随访团队。阅读月龄内容时标明采用哪个年龄；办理预约、填写药物资料时不要为了让表格好看偷偷改出生日期。\u003c/p\u003e\n\u003cp\u003e对明显能力倒退或新发异常，不能把“早产所以慢一点”当成自动解释。矫正年龄提供参照，不负责排除疾病。担忧出现时带真实时间线咨询，比在多个应用中寻找一个更令人安心的年龄更有用。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"r31-development\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c31-s006\"\u003e31.7　发育窗口：观察、标准化筛查、诊断、支持各有结果\u003c/h3\u003e\n\u003cp\u003e家庭日常观察负责发现变化，标准化筛查负责用规范方式识别需要进一步评估的风险，诊断评估回答具体问题，支持服务则帮助实际参与。前一环完成，不代表后一环已经完成。\u003c/p\u003e\n\u003cp\u003e美国AAP经CDC公布的参考节点为一般发育筛查九、十八、三十月龄，孤独症专项筛查十八和二十四月龄；任何年龄出现担忧，都应及时提出，不等待下一窗口。\u003ca href=\"#s152\"\u003eS152\u003c/a\u003e 这些是美国服务示例，不替代中国或其他地区儿童保健安排；在使用地确定一条当前有效路径，不把多个国家的全套检查叠加。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e节点\u003c/th\u003e\n\u003cth\u003e保存的最小记录\u003c/th\u003e\n\u003cth\u003e完成标志\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e家庭观察\u003c/td\u003e\n\u003ctd\u003e具体能力、出现情境、是否相比本人过去改变\u003c/td\u003e\n\u003ctd\u003e担忧被准确表达，而非给孩子贴标签\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e标准化筛查\u003c/td\u003e\n\u003ctd\u003e工具或项目、日期、结果与解释者\u003c/td\u003e\n\u003ctd\u003e知道是否需进一步评估\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e进一步评估\u003c/td\u003e\n\u003ctd\u003e负责专业、预约状态、需要携带的资料\u003c/td\u003e\n\u003ctd\u003e得到可理解的结论与下一步\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e支持服务\u003c/td\u003e\n\u003ctd\u003e实际目标、服务者、家庭怎样配合\u003c/td\u003e\n\u003ctd\u003e服务已开始，不只是收到转介单\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e复核\u003c/td\u003e\n\u003ctd\u003e什么能力或参与情况要看变化\u003c/td\u003e\n\u003ctd\u003e根据结果保留、修改或结束相应支持\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e观察可以围绕动作、交流、共同注意、游戏、自理和真实参与，但不将自制清单称为已经验证的筛查量表。孩子不在陌生人面前展示某项能力，与在所有熟悉情境中都没有这项能力，不是同一个观测。\u003c/p\u003e\n\u003cp\u003e听力流程也使用相同管理方式。原书新生儿卷已经给出“1—3—6”目标；没有通过筛查的婴儿，下一步不是反复播放声音在家验证，而是完成合适诊断与支持衔接。\u003ca href=\"#s153\"\u003eS153\u003c/a\u003e 把“已转介”与“已经接受服务”分成两个状态，才能发现排队、交通、费用或联系失败造成的失访。\u003c/p\u003e\n\u003ch3 id=\"c31-s007\"\u003e31.8　牙齿与辅食：出现一次，不等于任务已经完成\u003c/h3\u003e\n\u003cp\u003e第一颗牙出现后，家庭清洁开始产生新的实际任务，牙科接触也需要安排。首次就诊时间与清洁剂量见卷十九。本节只新增交付标准：照护者能示范刷牙；牙科人员知道喂养与清洁习惯；家庭知道下次随访；必要协助有人承担。买了儿童牙刷不等于建立了口腔护理。\u003ca href=\"#s160\"\u003eS160\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e辅食过敏原也不能以“尝过一次”作为永久完成。NHS建议约六月龄开始辅食时逐一引入可能致敏食物，以便识别反应；确认能够耐受后，将其保留在通常饮食中。已有食物过敏、湿疹或相关风险的婴儿，应在引入前与专业人员讨论，不自行挑战已怀疑过敏的食物。\u003ca href=\"#s55\"\u003eS55\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e记录的重点是食物实际形态、少量尝试时的情境、是否出现反应以及后续安排。食物名称相同但形态不同，入口安全可能不同；例如不能把儿童适宜形态的坚果制品与整粒坚果视作同一操作。具体避免食物和噎呛防护沿用喂养及安全卷，不在这里重印。\u003c/p\u003e\n\u003cp\u003e已经排除一种食物的人，需要知道限制的理由、替代营养来源和是否需要复核。不要因为一篇文章提到某种风险，就永久删除多个食物类别；也不要因为别人说“越早越好”，绕过孩子已有的症状和医疗计划。\u003c/p\u003e\n\u003ch3 id=\"c31-s008\"\u003e31.9　儿童活动：把全天碎片算清，不把玩耍升级成训练营\u003c/h3\u003e\n\u003cp\u003e运动卷的分龄表已经列出量。本节解决怎样把量识别出来：先区分低强度移动、较活跃的玩耍、固定体育活动和长时间受限。推车里的通勤不是孩子正在运动，成人抱着移动也不能按同样分钟替代孩子的自主活动。\u003c/p\u003e\n\u003cp\u003e一个三至四岁孩子的活动安排，可以散布在早晨、户外游戏、园内活动与下午生活中。家长首先问照护机构一天实际怎样组织活动，再补家里缺少的机会；不能假设上了一整天幼儿园就完全没有活动，也不能假设“有体育课”已经满足全部需要。\u003c/p\u003e\n\u003cp\u003e记录一两个具有代表性的普通日即可，用于发现长时间受限或几乎没有主动探索的时段。它不是为了给每个跳跃计秒，也不要求长期让儿童佩戴设备证明完成。记录改变了环境之后就可以折叠，新的照护方式出现再复核。\u003c/p\u003e\n\u003cp\u003e成人提供安全材料、空间、同伴机会与可参与规则；孩子选择怎样进入活动。不会某个游戏时可以降低速度、改变球的大小、缩短一轮或增加支持。活动有明确医疗限制者按相应方案；需要适配不等于只剩旁观。\u003c/p\u003e\n\u003ch3 id=\"c31-s009\"\u003e31.10　成人力量与有氧：明确起点、参考量和进阶是三件事\u003c/h3\u003e\n\u003cp\u003e公共卫生活动目标不是久坐者第一次训练必须完成的量。成人的一般参考包括每周有氧活动和至少两天增强肌力；CDC还给出力量活动每组八至十二次、至少一组的操作参考。\u003ca href=\"#s31\"\u003eS31\u003c/a\u003e\u003ca href=\"#s162\"\u003eS162\u003c/a\u003e 这些数字帮助理解剂量，不代替具体动作学习、疾病分流和恢复观察。\u003c/p\u003e\n\u003cp\u003e以下为作者设计的低门槛起步示例，适用于无急性症状、没有明确运动禁忌，且能够安全步行或使用相应替代方式的成人。已训练者不必退回此表；孕产恢复、明显疼痛、心肺问题或运动后延迟恶化者，应使用对应专业分支，而非照表加量。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e阶段\u003c/th\u003e\n\u003cth\u003e有氧起步示例\u003c/th\u003e\n\u003cth\u003e力量学习示例\u003c/th\u003e\n\u003cth\u003e这一阶段验收什么\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e第一周\u003c/td\u003e\n\u003ctd\u003e五天各十分钟、强度适合本人的步行或替代活动；可以拆短\u003c/td\u003e\n\u003ctd\u003e分开两天，先学少量动作和器械安全，选择能够控制动作的阻力\u003c/td\u003e\n\u003ctd\u003e能开始、能结束、没有靠压缩睡眠或忽略异常坚持\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第二周\u003c/td\u003e\n\u003ctd\u003e前一周耐受良好才考虑五天各十五分钟；也可以维持第一周\u003c/td\u003e\n\u003ctd\u003e继续两次；熟练后再把适用动作向一组八至十二次靠近\u003c/td\u003e\n\u003ctd\u003e动作质量与日常功能没有下降，后续生活仍有余力\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e后续维护\u003c/td\u003e\n\u003ctd\u003e按实际耐受逐步接近适用的周总量，不限定必须第几周达标\u003c/td\u003e\n\u003ctd\u003e逐渐覆盖主要肌群；是否增加组数、阻力或复杂度一次只改少数因素\u003c/td\u003e\n\u003ctd\u003e计划可持续，且确实服务本人需要的功能\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e第一周五十分钟、第二周七十五分钟只是这个示例的有氧合计，低于一般成人一百五十分钟中等强度周目标；不能把“完成两周起步”宣传成已经全面达标，也不能为追赶目标一次补完缺少的分钟。\u003c/p\u003e\n\u003cp\u003e动作选择围绕真实功能，例如适配的坐站、推、拉、髋部活动与安全提踵。第一次不会做时，获取合格示范或选择更容易控制的版本。不要为追求组次数强行做痛、憋气硬顶或依赖他人把重量拉起来；学习期保留动作余地是本示例的保守安排，不是声称所有训练目标都应采用同一努力程度。\u003c/p\u003e\n\u003cp\u003e每次结束只记录必要信息：做了哪类活动、约多长或多少组、当时反应、接下来生活是否明显受影响。存在运动后症状加重可能者，不能只以“刚做完感觉还行”判定耐受；相关边界见卷二十一。发生危险信号时终止普通训练路径，不等周末复盘。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"r31-prevention\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c31-s010\"\u003e31.11　个人预防总表：从三种癌症例子扩展为完整入口\u003c/h3\u003e\n\u003cp\u003e预防管理首先是一张适用性地图，不是一张全部需要抽血和拍片的采购单。每一行都允许出现“当前不适用”“已完成、待未来复核”“资料未知”“需要专业判断”四种不同答案。未知不是正常，未安排也不自动表示被遗漏。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e入口\u003c/th\u003e\n\u003cth\u003e先核对什么\u003c/th\u003e\n\u003cth\u003e下一动作由什么决定\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e血压\u003c/td\u003e\n\u003ctd\u003e既往可靠测量、家庭测量方法、已知诊断与用药\u003c/td\u003e\n\u003ctd\u003e重复结果、症状、整体风险及个人计划\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e血脂与心血管风险\u003c/td\u003e\n\u003ctd\u003eLDL-C、HDL-C、甘油三酯等已有结果、重要家族史、吸烟和既有疾病\u003c/td\u003e\n\u003ctd\u003e风险评估，不由体形或感觉良好排除\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e血糖与代谢\u003c/td\u003e\n\u003ctd\u003e已有异常、相关症状、妊娠或家族等背景\u003c/td\u003e\n\u003ctd\u003e适用的本地筛查或诊断路径，不给所有年龄同一频率\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e肾脏与其他慢病风险\u003c/td\u003e\n\u003ctd\u003e既往疾病、药物及专业人员已要求的复查\u003c/td\u003e\n\u003ctd\u003e疾病监测与一般筛查分开\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e感染与接种\u003c/td\u003e\n\u003ctd\u003e乙肝等已有记录、暴露背景、接种史及免疫状态相关信息\u003c/td\u003e\n\u003ctd\u003e本地适应证；暴露后预防不等普通复核日\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e器官相关癌症筛查\u003c/td\u003e\n\u003ctd\u003e实际器官、既往结果、手术、家族史与当地建议\u003c/td\u003e\n\u003ctd\u003e方法、频率、启动和停止条件分别确认\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e骨骼与跌倒\u003c/td\u003e\n\u003ctd\u003e既往骨折、绝经、相关用药、跌倒及功能变化\u003c/td\u003e\n\u003ctd\u003e无症状筛查与已有疾病评估分开\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e牙齿、眼睛、听力\u003c/td\u003e\n\u003ctd\u003e上次检查、症状和真实使用困难\u003c/td\u003e\n\u003ctd\u003e按风险维护；新发紧急变化进入诊断而非等筛查\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e精神与社会功能\u003c/td\u003e\n\u003ctd\u003e持续困扰、生活受限、照护负担及可用支持\u003c/td\u003e\n\u003ctd\u003e本人表达与专业判断，不用单项应用评分替代\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e这张地图不是医学机构的完整检查规范；它用于将各专题中分散的问题接到本人真实记录。具体检查项目只有在适用性明确后，才进入到期表。\u003c/p\u003e\n\u003cp\u003e**血脂示例。**CDC公众资料指出，高胆固醇可以没有症状，多数健康成人每四至六年复核是其参考；存在心血管病、糖尿病或相关家族史者可能需要不同频率。\u003ca href=\"#s166\"\u003eS166\u003c/a\u003e 不能把这个间隔当成所有人的处方，也不能因一次正常结果永久删除这项入口。携带原始单位和结果，避免把不同单位的数值直接比较。\u003c/p\u003e\n\u003cp\u003e**宫颈示例。**本轮检索到的USPSTF最终建议页面标注二〇一八年并提示更新中。其一般风险示例是二十一至二十九岁细胞学每三年；三十至六十五岁可在细胞学每三年、主要高危HPV检测每五年或联合检测每五年中选择适用路径，而不是全部叠加。超过六十五岁是否停止，仍需考虑既往筛查充分性与高风险史。\u003ca href=\"#s164\"\u003eS164\u003c/a\u003e 这里保留版本身份，不把该页当成二〇二六年新发布的全球标准。\u003c/p\u003e\n\u003cp\u003e**骨骼示例。**USPSTF二〇二五年最终建议支持女性六十五岁及以上，以及较年轻但风险增加的绝经后女性接受适当筛查；男性普遍筛查证据不足，不等于有骨折、症状或高风险时不需要评估。已有脆性骨折、已知骨质疏松或继发性骨病等不属于照搬一般筛查表的情形。\u003ca href=\"#s163\"\u003eS163\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e同一次就诊可以完成总表的适用性核对，不要求当天把所有不确定都变成检测。每个被激活的项目留下下一步；没有指征的项目保留明确理由，在状态改变时再看。\u003c/p\u003e\n\u003ch3 id=\"c31-s011\"\u003e31.12　成人乙肝状态：感染、免疫和既往暴露不能混为一谈\u003c/h3\u003e\n\u003cp\u003e美国CDC建议十八岁及以上成人至少进行一次乙肝三项筛查：HBsAg、抗-HBs与总抗-HBc；持续风险者另行考虑复查。妊娠有单独路径，不因过去接种或检测过就自动跳过本次妊娠的HBsAg核对。\u003ca href=\"#s156\"\u003eS156\u003c/a\u003e 这是注明地区的公共卫生示例，实际检测按所在地与本人情况决定。\u003c/p\u003e\n\u003cp\u003e家中已有报告时，先找齐日期、项目与解释，不凭“打过疫苗”“肝功能正常”或一个单独阳性标志自行推断完整状态。不同结果组合要回答的问题不同，需要相应专业解释；资料不全时，不用购物平台抗体检测套餐填补所有未知。\u003c/p\u003e\n\u003cp\u003e一张可用的乙肝记录包含：已经得到哪些结果；谁解释过；是否需要接种、进一步评估或随访；下一节点由谁负责。对怀孕、计划使用影响免疫的治疗或有重要暴露的情况，主动向治疗团队提供既往结果，让相应分支被识别。不是让读者据此自行启动抗病毒药。\u003c/p\u003e\n\u003cp\u003e儿童尤其是围产期暴露婴儿使用前面的专门路径，不能拿成人三项表照抄。不同用途的同名检测，只有放回年龄、暴露与治疗背景中才有意义。\u003c/p\u003e\n\u003ch3 id=\"c31-s012\"\u003e31.13　接种卡：记录完成链条，而不是只收藏年龄表\u003c/h3\u003e\n\u003cp\u003e接种表应来自所在地当前有效的卫生与接种服务，不从多个国家、年份和产品网页拼成一张混合表。家庭需要维护的是本人实际记录与下一步，而不是自己成为疫苗程序设计者。原书疫苗基础见卷二十。\u003ca href=\"#s121\"\u003eS121\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e每个项目至少分清疾病名称或疫苗名称、既往剂次及日期、记录是否可靠、当前是否适用、下一次最早或最迟的安排是否由接种人员确认。有的任务需要补齐记录，有的需要补种讨论，有的当前无需操作；三种情况不能全部写成“未完成”。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e核对场景\u003c/th\u003e\n\u003cth\u003e带给接种人员什么\u003c/th\u003e\n\u003cth\u003e需要得到的输出\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e儿童常规保健\u003c/td\u003e\n\u003ctd\u003e完整接种记录、出生情况和已知禁忌相关信息\u003c/td\u003e\n\u003ctd\u003e当前程序、下一剂安排和可用机构\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e成人记录不全\u003c/td\u003e\n\u003ctd\u003e能找到的旧记录、既往不良反应及当前疾病用药\u003c/td\u003e\n\u003ctd\u003e哪些记录可用，哪些需要重新确认\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e备孕或妊娠\u003c/td\u003e\n\u003ctd\u003e当前妊娠状态、接种史和产科计划\u003c/td\u003e\n\u003ctd\u003e本阶段适用、暂不适用及后续安排\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e慢病或影响免疫的治疗前后\u003c/td\u003e\n\u003ctd\u003e完整治疗时间线及负责医生信息\u003c/td\u003e\n\u003ctd\u003e由治疗与接种团队协调的个人计划\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e迁移、旅行或职业变化\u003c/td\u003e\n\u003ctd\u003e目的地、时间、活动和实际暴露类型\u003c/td\u003e\n\u003ctd\u003e当地当前要求及必要医疗建议\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e动物咬抓伤等暴露\u003c/td\u003e\n\u003ctd\u003e发生时间、伤口与动物等真实情况\u003c/td\u003e\n\u003ctd\u003e立即进入暴露后医疗评估，不等待普通接种复核\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e流感、乙肝、HPV、带状疱疹、肺炎球菌及儿童程序中的其他疫苗，是否适合本人，应在对应的年龄、疾病、既往接种和当地可用产品下判断。这里列名称是提醒核对范围，不是要求每个人全部补齐同一清单，也不提供跨地区通用剂次。\u003c/p\u003e\n\u003cp\u003e如果预约失败，任务仍处于“需要处理”，而不是因为点过预约就消失。记录替代机构或下一次联系；若涉及明确时限，说明时限，让接种团队决定如何处理。不要由软件自动改日期后假装仍在原程序内。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"r31-tobacco\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c31-s013\"\u003e31.14　戒烟行动卡：从“知道不该吸”进入可获得支持的过程\u003c/h3\u003e\n\u003cp\u003eWHO的成人戒烟指导支持行为干预与药物治疗，并指出两者结合能够改善戒烟成功。其提到的有效药物选择包括尼古丁替代治疗、伐尼克兰、安非他酮和金雀花碱；适应证、禁忌、供应及具体用法由当地合格专业人员核对，本书不提供个人处方。\u003ca href=\"#s155\"\u003eS155\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e行动不必从“先证明意志足够强”开始。先记录实际烟草使用方式、最常出现的场景、过去尝试时最难的部分以及目前愿意接受的帮助。把问题带给能提供戒烟支持的医疗或正规服务人员，讨论行为支持与适用治疗，而非只再听一遍危害。\u003c/p\u003e\n\u003cp\u003e可以把行为安排拆成三个实际接口。第一是供给：家中、车内和常去场景是否仍随手可取，谁会递烟。第二是触发：工作停顿、聚会、压力或固定时刻，哪个最容易让原习惯自动发生。第三是替代联系：困难时能找谁、怎样取得支持，是否已经知道复查入口。该拆分是作者提供的执行工具，不是经过验证的独立治疗程序。\u003c/p\u003e\n\u003cp\u003e本人愿意推进时，与支持者商定清楚目标和开始安排；不愿公开给所有人也可以，只让必要的人知道怎样配合。短暂再次使用不等于全部努力归零，但需要如实记录，分析哪个接口失效并继续获得帮助；不能为了保住连续打卡而隐瞒。\u003c/p\u003e\n\u003cp\u003e这张卡的验收不是买到戒烟产品，也不是家人监督更严，而是获得了适合的支持、治疗责任清楚、日常触发有应对办法，并能在困难时返回服务。孕哺期、未成年人或有复杂病史者不照抄普通成人药物选择。酒精或镇静药物依赖也不能照搬自行骤停的方式，相关安全边界见睡眠与用药卷。\u003c/p\u003e\n\u003ch3 id=\"c31-s014\"\u003e31.15　多个“好建议”冲突时，只覆盖冲突的部分\u003c/h3\u003e\n\u003cp\u003e身体维护不是把每条建议相加。建议的目标、适用人群、疾病状态和资源前提不同，直接相加可能产生矛盾。管理冲突的关键，是知道哪条规则需要退出，而非再加一个“更全面”的方案。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e原来适用的普通建议\u003c/th\u003e\n\u003cth\u003e新条件出现后\u003c/th\u003e\n\u003cth\u003e需要采取的结构性动作\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e逐渐增加活动\u003c/td\u003e\n\u003ctd\u003e活动后延迟恶化、已有相关疾病计划\u003c/td\u003e\n\u003ctd\u003e暂停固定加量，进入相应疾病分支，不以当天表现替代后续反应\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多样饮食和一般补充建议\u003c/td\u003e\n\u003ctd\u003e已知过敏、吞咽限制或肾病饮食\u003c/td\u003e\n\u003ctd\u003e保留安全适用的部分，由负责人员明确替代与限制\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e通过含钾代盐减少钠\u003c/td\u003e\n\u003ctd\u003e慢性肾病或其他需限制钾的情况\u003c/td\u003e\n\u003ctd\u003e先核对适用性，不把低钠标签当成适合所有人\u003ca href=\"#s96\"\u003eS96\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e按长期处方维持\u003c/td\u003e\n\u003ctd\u003e出院、手术或新处方改变了方案\u003c/td\u003e\n\u003ctd\u003e核对当前版本，不把旧清单与新清单简单叠加\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e鼓励个人独立\u003c/td\u003e\n\u003ctd\u003e某一步确实无法安全完成\u003c/td\u003e\n\u003ctd\u003e只提供该步骤需要的支持，不统一接管全部决定\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e增加学习或训练时间\u003c/td\u003e\n\u003ctd\u003e照护、睡眠和必要责任已经占满容量\u003c/td\u003e\n\u003ctd\u003e先调整责任与资源，不能凭空挤出时间\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e第一、二、四行的具体医学规则已经分别放在慢病、营养、用药与出院章节，本表不另创停药或治疗阈值。它只使使用者知道该去哪个入口解决冲突。\u003c/p\u003e\n\u003cp\u003e冲突记录只需要三句：原规则是什么；哪个前提已经变了；谁确认新的处理。暂时无法确认时，不让普通优化任务覆盖必要医疗与安全规则。已经知道怎样处理的部分继续执行，无须把全部生活一起暂停。\u003c/p\u003e\n\u003ch3 id=\"c31-s015\"\u003e31.16　功能储备卡：先问身体正在支持哪些真实任务\u003c/h3\u003e\n\u003cp\u003e同样的年龄和相似的体检指标，可能对应不同的生活能力。维护目标应落在本人想完成的任务上，例如起身、洗澡、走到交通站点、听懂会议、做饭、处理账单或照护家人，而不是只写“保持年轻”。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e生活任务\u003c/th\u003e\n\u003cth\u003e目前需要什么支持\u003c/th\u003e\n\u003cth\u003e希望保住的结果\u003c/th\u003e\n\u003cth\u003e何时重新看\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e出门与返回\u003c/td\u003e\n\u003ctd\u003e独立、工具、提醒、陪同或交通服务\u003c/td\u003e\n\u003ctd\u003e能够参加本人在意的活动\u003c/td\u003e\n\u003ctd\u003e路线、身体或交通改变\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e吃饭与口腔清洁\u003c/td\u003e\n\u003ctd\u003e准备、摆放、动作或吞咽相关支持\u003c/td\u003e\n\u003ctd\u003e安全摄入并完成清洁\u003c/td\u003e\n\u003ctd\u003e食欲、疼痛、体重或吞咽变化\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e理解与沟通\u003c/td\u003e\n\u003ctd\u003e安静环境、文字、助听或表达时间\u003c/td\u003e\n\u003ctd\u003e信息真正到达，本人能参与选择\u003c/td\u003e\n\u003ctd\u003e设备、感官或认知状态变化\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e医疗任务\u003c/td\u003e\n\u003ctd\u003e取药、整理、理解或操作支持\u003c/td\u003e\n\u003ctd\u003e正确执行当前方案\u003c/td\u003e\n\u003ctd\u003e新药、住院、照护者变化\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e兴趣与贡献\u003c/td\u003e\n\u003ctd\u003e材料、工具、空间或共同参与者\u003c/td\u003e\n\u003ctd\u003e仍能从事喜欢的事\u003c/td\u003e\n\u003ctd\u003e原方式过重或兴趣改变\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e“独立”不必意味着没有工具；“有支持”也不等于失去本人决定权。记录支持类型比记录“还能不能”更准确，能够把问题定位到某个步骤，而不是把整个人分成能用与不能用。\u003c/p\u003e\n\u003cp\u003e这张卡不是家庭体能竞赛，不要求高龄或有疾病者在无保护条件下完成计时起立、单脚站立或极限运动。需要标准化功能测试时由适当人员选用和实施。家庭可以安全观察的是：本来能做的日常任务是否发生了实际变化、是否需要更多协助、这种变化是否持续或突然出现。\u003c/p\u003e\n\u003cp\u003e维护计划以一个任务为单位检验。例如更换照明后，夜间路线是否更容易辨认；调整会议字幕后，参与者是否能表达意见。工具数量增加而参与没有增加，就重新检查问题是否找错，不继续购买同类设备堆叠。\u003c/p\u003e\n\u003ch3 id=\"c31-s016\"\u003e31.17　一次问诊的完整交付：不要只带着“帮我看看”离开\u003c/h3\u003e\n\u003cp\u003e预约之前用最少文字说明：主要问题是什么，何时开始，怎样变化，影响了哪项生活任务，已有的关键疾病和用药是什么，最希望这次获得什么决定。没有证据的推测可以提出，但单独标记，避免把怀疑病名写成已确诊。\u003c/p\u003e\n\u003cp\u003e会面中优先解决最影响安全与生活的少数问题。离开前核对诊断处于什么确定程度、需要做什么、可能出现什么变化、什么情况需要提前联系、谁负责尚未回报的结果。若专业人员建议观察，应把观察对象与回顾条件说清，而非只留下一个没有期限的“再看看”。\u003c/p\u003e\n\u003cdetails open=\"\"\u003e\n\u003csummary\u003e展开：问诊与出院后的七行复述\u003c/summary\u003e\n\u003cp\u003e现在确定知道：\u003c/p\u003e\n\u003cp\u003e仍需要确认：\u003c/p\u003e\n\u003cp\u003e今天开始／继续／改变的事项：\u003c/p\u003e\n\u003cp\u003e药物变化及当前有效清单位置：\u003c/p\u003e\n\u003cp\u003e出现这些情况不等原预约，联系：\u003c/p\u003e\n\u003cp\u003e待回报项目、预计获得结果的方式和负责人：\u003c/p\u003e\n\u003cp\u003e下一次复查；若未收到结果或预约失败怎样处理：\u003c/p\u003e\n\u003c/details\u003e\n\u003cp\u003e把这七行给实际执行者复述。听懂解释与能够在家完成操作是两回事；涉及复杂设备、转移、伤口或喂养操作时，需要相应培训与回演，不能仅靠一段文字替代。\u003c/p\u003e\n\u003cp\u003e当多个科室给出不同建议时，不由家属在群里投票。将具体冲突、当前全部用药和目标带给负责协调的专业人员。书中通用规则、旧处方和当前个人计划不能默认权重相同，也不因新建议来自更近的一次聊天就自动更可靠。\u003c/p\u003e\n\u003ch3 id=\"c31-s017\"\u003e31.18　能力进阶：按照前置能力开放，不按照生日强行授权\u003c/h3\u003e\n\u003cp\u003e生活能力的增加可以按四级安排：看过并能解释，受到支持时能完成，在熟悉环境能稳定完成，遇到适度变化能判断何时求助。四级是本书的教学编排，不是临床发育量表；不要求所有人经过同一种动作或在同一年龄到达。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e能力\u003c/th\u003e\n\u003cth\u003e前置条件\u003c/th\u003e\n\u003cth\u003e一个真实而低风险的练习\u003c/th\u003e\n\u003cth\u003e完成后新增加的自由\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e表达需要\u003c/td\u003e\n\u003ctd\u003e有可用的语言、图示、手势或沟通工具\u003c/td\u003e\n\u003ctd\u003e在普通活动里表达想继续、换一种或停止，并得到回应\u003c/td\u003e\n\u003ctd\u003e不必完全靠别人猜测\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e准备个人用品\u003c/td\u003e\n\u003ctd\u003e认识物品用途，有安全取放位置\u003c/td\u003e\n\u003ctd\u003e按一张简短清单完成外出准备，回来复位\u003c/td\u003e\n\u003ctd\u003e减少临出门对他人的依赖\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e准备食物\u003c/td\u003e\n\u003ctd\u003e能遵守相应卫生与工具权限\u003c/td\u003e\n\u003ctd\u003e先做无需危险热源的简单准备，再逐项学习更复杂操作\u003c/td\u003e\n\u003ctd\u003e在疲惫或照护中断时仍有备用供给\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e处理信息\u003c/td\u003e\n\u003ctd\u003e能区分事实、转述和未知\u003c/td\u003e\n\u003ctd\u003e为一条真正影响决定的信息找到原始入口，并说明限制\u003c/td\u003e\n\u003ctd\u003e减少被一句标题带走\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e处理一笔支出\u003c/td\u003e\n\u003ctd\u003e理解金额、对象与是否持续收费\u003c/td\u003e\n\u003ctd\u003e在许可范围内核对一次实际交易与收据\u003c/td\u003e\n\u003ctd\u003e能发现误付或不需要的续费\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e完成一个学习项目\u003c/td\u003e\n\u003ctd\u003e目标明确，有材料和反馈者\u003c/td\u003e\n\u003ctd\u003e交付一个可被使用或检查的小作品，再修改一次\u003c/td\u003e\n\u003ctd\u003e可以用结果而不只用时长表达能力\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e独立出行\u003c/td\u003e\n\u003ctd\u003e实际路线、交通技能、求助渠道与法律权限满足要求\u003c/td\u003e\n\u003ctd\u003e先在安全支持下走完一条真实路线，识别中断时的返回方式\u003c/td\u003e\n\u003ctd\u003e能参与更多地点与活动\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e医疗沟通\u003c/td\u003e\n\u003ctd\u003e理解能力、授权与支持适当\u003c/td\u003e\n\u003ctd\u003e本人先说明一个问题，再复述下一步\u003c/td\u003e\n\u003ctd\u003e逐步掌握自己的照护信息\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e授权只覆盖已经会做的部分。会查路线不等于能够独自穿越复杂交通；会看药盒不等于可以独立调整剂量；会完成一次网上购买不等于能判断借贷合同。一个能力取得进展，不自动解锁所有相邻风险。\u003c/p\u003e\n\u003cp\u003e遇到失败时，定位缺的是知识、操作、环境、支持还是判断。只会在安静家中完成的人，可以先练习在轻微变化中保持步骤；如果失败来自工具根本不适配，就先改工具，不要求本人无限加练。\u003c/p\u003e\n\u003cp\u003e年幼儿童练习必须在照护和保护边界内，高龄或残障者也可用替代形式逐步增加自主。这里衡量的是获得了哪些真实选择，而不是与别人比较快慢。\u003c/p\u003e\n\u003ch3 id=\"c31-s018\"\u003e31.19　学习的最小可验证循环：输入之后必须出现可观察的能力\u003c/h3\u003e\n\u003cp\u003e卷二十三已经解释检索练习与反馈。这里把它落成一个可直接试用的三十分钟学习块：先用五分钟写清一个具体问题及自己目前的答案；十分钟查阅必要材料；合上资料用十分钟解释、解题或操作；最后五分钟核对差异，留下下一次最值得处理的一个错误。三十分钟和分配比例是作者示例，不是经研究确定的个人最优时长。\u003c/p\u003e\n\u003cp\u003e检索练习的证据支持主动回忆的重要性，不能被扩大为“所有知识都按同一个间隔复习”或“所有学习都只做题”。\u003ca href=\"#s133\"\u003eS133\u003c/a\u003e 概念、动作、审美、语言和协作需要不同的输出；选择与目标相符的检验，不用一个统一分数覆盖所有能力。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e希望学会什么\u003c/th\u003e\n\u003cth\u003e输入之后的检验\u003c/th\u003e\n\u003cth\u003e容易造成错觉的替代\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e理解一个概念\u003c/td\u003e\n\u003ctd\u003e不用原文解释，并给一个适用例与一个不适用例\u003c/td\u003e\n\u003ctd\u003e能认出熟悉句子\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e解决一类问题\u003c/td\u003e\n\u003ctd\u003e独立完成未见过但同结构的问题\u003c/td\u003e\n\u003ctd\u003e重抄已经展示的答案\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e掌握一个操作\u003c/td\u003e\n\u003ctd\u003e在安全条件下完成，并指出何时不能照做\u003c/td\u003e\n\u003ctd\u003e连续看很多演示\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e提高表达\u003c/td\u003e\n\u003ctd\u003e让目标读者复述实际听懂了什么\u003c/td\u003e\n\u003ctd\u003e自己觉得文字很流畅\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e学习判断\u003c/td\u003e\n\u003ctd\u003e写出关键未知、不同选项及会改变选择的新证据\u003c/td\u003e\n\u003ctd\u003e收藏更多结论截图\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e下一次学习不必从头重读。先尝试取回上次结果，找出哪里仍然卡住；已经稳定的部分折叠，只展开新增问题。某项技能需要真实反馈，而本人长期得不到，就应把寻找反馈者作为下一步，而不是继续加大输入。\u003c/p\u003e\n\u003cp\u003e精力下降时可以缩短学习块，保留问题与检验的结构。持续困扰已经影响生活时，使用相应健康与学习支持，不把所有困难归为缺少专注力或再努力就会好。\u003c/p\u003e\n\u003ch3 id=\"c31-s019\"\u003e31.20　增长机会：给可复用成果留一个位置\u003c/h3\u003e\n\u003cp\u003e维护身体是基础，却不等于把全部时间都分给维护。本人希望学习、创造、工作或探索时，可以为“今后仍能使用的成果”留出一个小项目：一项技能、一份说明、一段可以复用的代码、一组可靠关系，或者一件能够继续改进的作品。\u003c/p\u003e\n\u003cp\u003e这个项目先定义接收者和验收方式。写文章的人明确给谁解决哪个问题；做工具的人让真实使用者试一次；学习职业技能的人保留目标、个人贡献、约束和实际结果。作品集的价值来自可核对能力，不来自把每次尝试包装成巨大成功。\u003c/p\u003e\n\u003cp\u003e可以用三个问题选择项目：失败后最多失去什么；完成后哪些部分仍可继续使用；是否存在得到真实反馈的入口。选择可承受、能结束的小版本，避免用一个不断扩大且没有验收的目标占满生活。\u003c/p\u003e\n\u003cp\u003e给探索保留空间，不意味着给身体、借贷或他人安全放开上限。医药自我试验使用原书的风险边界；涉及隐私、合同或公共发布的项目，先确认权限。安全限制应当让试错更容易恢复，而不是把所有新体验都堵住。\u003c/p\u003e\n\u003cp\u003e项目结束后可选三种结果：保留并维护；修改一个关键环节再试；停止并留下可复用部分。不是每次尝试都要长期坚持，也不要求每种兴趣最终变现。\u003c/p\u003e\n\u003ch3 id=\"c31-s020\"\u003e31.21　资源压力测试：先算真的能够调用什么\u003c/h3\u003e\n\u003cp\u003e日程中的时间与账上的钱都需要按可调用程度区分。已经承诺的资源不再是完全自由的资源；尚未收到的帮助与收入也不能在基础安排中当成已经到账。这个区分是计划的算术前提，不依赖对未来的乐观或悲观判断。\u003c/p\u003e\n\u003cp\u003e例如，一份纯粹用于演示的现金表：可立即使用资金三万元，每月必要现金流出一万元，假设没有新增收入和额外支出，则能覆盖三个月。这只是三万元除以一万元的情景计算，不是建议每个人只留三个月储备，也没有计入风险分布。加入一项两万元的近期必要支出，剩余覆盖期立刻改变；说明大额到期事项不能藏在平均月支出之外。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e资源\u003c/th\u003e\n\u003cth\u003e先确认的事实\u003c/th\u003e\n\u003cth\u003e压力情景要问什么\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e时间\u003c/td\u003e\n\u003ctd\u003e工作、交通、睡眠机会、照护和维护的实际占用\u003c/td\u003e\n\u003ctd\u003e主要责任增加时删哪项，谁同意接手\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e资金\u003c/td\u003e\n\u003ctd\u003e可用现金、必要支出、到期承诺\u003c/td\u003e\n\u003ctd\u003e收入延迟或必要支出增加后，基本生活是否不断供\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e照护\u003c/td\u003e\n\u003ctd\u003e谁在什么时段真正可用，掌握哪些操作\u003c/td\u003e\n\u003ctd\u003e主要照护者生病时谁能立即接上\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e信息\u003c/td\u003e\n\u003ctd\u003e关键记录在哪里，谁有合法访问权限\u003c/td\u003e\n\u003ctd\u003e设备或账号失效时能否取得必要资料\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e工具与环境\u003c/td\u003e\n\u003ctd\u003e哪些设备、交通或住所条件不可替代\u003c/td\u003e\n\u003ctd\u003e中断时有没有低技术替代方案\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e做完压力测试，不需要立即把最坏情景都买成一套产品。先修最可能使必要生活停摆的单点，再核对各项成本。涉及保险、借贷、合同或投资的具体决定，使用当地当前材料和适当专业解释，本书不把一个示例比率推广成个人金融建议。\u003c/p\u003e\n\u003cp\u003e资源预算也不能把伴侣、父母或员工的时间按默认免费填入。共同承担的方案需要对方真实同意，并且能够持续；否则计划只是把自己的缺口藏到另一个人身上。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"r31-budget\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c31-s021\"\u003e31.22　二十四小时容量表：让所有任务回到同一张账上\u003c/h3\u003e\n\u003cp\u003e下面是一份作者构造的普通工作日示例，假定工作时段较固定、通勤共一小时三十分钟，没有需要全天照护的婴儿或重病家人。它用于核对时间是否闭合，不声称适用于所有职业、家庭或睡眠需要。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e时段\u003c/th\u003e\n\u003cth\u003e用途\u003c/th\u003e\n\u003cth\u003e小时\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e23:00—次日07:00\u003c/td\u003e\n\u003ctd\u003e睡眠机会\u003c/td\u003e\n\u003ctd\u003e8.00\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e07:00—08:00\u003c/td\u003e\n\u003ctd\u003e起床、清洁、早餐、出门准备\u003c/td\u003e\n\u003ctd\u003e1.00\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00—08:45\u003c/td\u003e\n\u003ctd\u003e通勤\u003c/td\u003e\n\u003ctd\u003e0.75\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:45—12:00\u003c/td\u003e\n\u003ctd\u003e工作\u003c/td\u003e\n\u003ctd\u003e3.25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:00—13:00\u003c/td\u003e\n\u003ctd\u003e午餐与休息\u003c/td\u003e\n\u003ctd\u003e1.00\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00—17:45\u003c/td\u003e\n\u003ctd\u003e工作\u003c/td\u003e\n\u003ctd\u003e4.75\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e17:45—18:30\u003c/td\u003e\n\u003ctd\u003e通勤\u003c/td\u003e\n\u003ctd\u003e0.75\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e18:30—19:15\u003c/td\u003e\n\u003ctd\u003e晚餐及相关准备\u003c/td\u003e\n\u003ctd\u003e0.75\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:15—20:00\u003c/td\u003e\n\u003ctd\u003e家务与必要家庭事务\u003c/td\u003e\n\u003ctd\u003e0.75\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e20:00—20:45\u003c/td\u003e\n\u003ctd\u003e适用活动、准备及清洁；非训练日可重新分配\u003c/td\u003e\n\u003ctd\u003e0.75\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e20:45—21:15\u003c/td\u003e\n\u003ctd\u003e一个新增学习或项目块\u003c/td\u003e\n\u003ctd\u003e0.50\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e21:15—22:15\u003c/td\u003e\n\u003ctd\u003e关系、兴趣或休息\u003c/td\u003e\n\u003ctd\u003e1.00\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e22:15—23:00\u003c/td\u003e\n\u003ctd\u003e收尾、次日准备与缓冲\u003c/td\u003e\n\u003ctd\u003e0.75\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e合计\u003c/td\u003e\n\u003ctd\u003e每个时段只记一次\u003c/td\u003e\n\u003ctd\u003e24.00\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e这里预留的是八小时睡眠机会，不保证八小时实际睡眠。活动窗口中的准备和清洁不能再次算进有氧分钟；午餐不能一边在工作小时中占满，一边又在休息预算中重复出现。只有交通条件安全且实际达到相应活动条件的部分，才可在用途说明中同时标注活动价值，但时长仍只能计一次。\u003c/p\u003e\n\u003cp\u003e计划新增一小时课程时，必须指出从哪里移出这一小时：减少某项可选活动、重新协商家务、改变通勤，或更换课程形式。不能在二十四小时已经用尽后，只在表格底部继续添加。\u003c/p\u003e\n\u003cp\u003e照护家庭应换用自己的真实约束。上表家务时段不代表照顾婴儿只需四十五分钟，也不意味着轮班者应当调整到这个起床钟点。先保住必要照护和恢复，再安排少数新增；缺少容量时，缩小项目通常比每天制造失败欠账更合适。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"r31-fortnight\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c31-s022\"\u003e31.23　连续两周的新增示例：重复底座不再印十四遍\u003c/h3\u003e\n\u003cp\u003e本表服务于一般成人或照护者的系统搭建，不是临床疗程。安全与必要医疗事项已经按需要处理，不能等此表轮到它。每一天最多选一个真正有用的新增，其余继续适用底座；不存在的问题直接跳过。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e日次\u003c/th\u003e\n\u003cth\u003e当天只展开的新增\u003c/th\u003e\n\u003cth\u003e应当留下的东西\u003c/th\u003e\n\u003cth\u003e以后何时再打开\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e第1天\u003c/td\u003e\n\u003ctd\u003e把个人当前状态和需要支持的任务写清\u003c/td\u003e\n\u003ctd\u003e一张功能卡，而不是健康标签\u003c/td\u003e\n\u003ctd\u003e状态或目标改变\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第2天\u003c/td\u003e\n\u003ctd\u003e找齐一项既往重要检查及其解释\u003c/td\u003e\n\u003ctd\u003e原始结果、解释和下一步的位置\u003c/td\u003e\n\u003ctd\u003e出现新结果或到期\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第3天\u003c/td\u003e\n\u003ctd\u003e把一个“定期做”改写成行动卡\u003c/td\u003e\n\u003ctd\u003e负责人、触发和完成条件\u003c/td\u003e\n\u003ctd\u003e执行失败或前提改变\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第4天\u003c/td\u003e\n\u003ctd\u003e测试一种低精力时仍能取得的餐食\u003c/td\u003e\n\u003ctd\u003e食物获取、储存与清洁链\u003c/td\u003e\n\u003ctd\u003e环境或饮食条件改变\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第5天\u003c/td\u003e\n\u003ctd\u003e试一次合适的活动起步\u003c/td\u003e\n\u003ctd\u003e实际完成量与后续反应\u003c/td\u003e\n\u003ctd\u003e下一次活动与计划复核\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第6天\u003c/td\u003e\n\u003ctd\u003e交出一项完整家庭任务\u003c/td\u003e\n\u003ctd\u003e接手者能完成并知道异常怎样处理\u003c/td\u003e\n\u003ctd\u003e人员或任务改变\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第7天\u003c/td\u003e\n\u003ctd\u003e查看本周真实容量\u003c/td\u003e\n\u003ctd\u003e删掉或缩小一个超额承诺\u003c/td\u003e\n\u003ctd\u003e责任明显增加\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第8天\u003c/td\u003e\n\u003ctd\u003e完成一个小学习输出\u003c/td\u003e\n\u003ctd\u003e解释、作品或解决的一道新问题\u003c/td\u003e\n\u003ctd\u003e下次检索与反馈\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第9天\u003c/td\u003e\n\u003ctd\u003e为当前预防安排补一处真实空白\u003c/td\u003e\n\u003ctd\u003e预约、结果解释或明确不适用理由\u003c/td\u003e\n\u003ctd\u003e到期或风险改变\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第10天\u003c/td\u003e\n\u003ctd\u003e测试一个重要资料的获取路径\u003c/td\u003e\n\u003ctd\u003e另一位获授权者能找到必要信息\u003c/td\u003e\n\u003ctd\u003e权限、设备或人员改变\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第11天\u003c/td\u003e\n\u003ctd\u003e为一项高频困难改变环境\u003c/td\u003e\n\u003ctd\u003e新的位置、工具或入口实际可用\u003c/td\u003e\n\u003ctd\u003e困难再次出现\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第12天\u003c/td\u003e\n\u003ctd\u003e给想长期保留的能力做一次迁移练习\u003c/td\u003e\n\u003ctd\u003e换一个场景仍能用，或发现明确限制\u003c/td\u003e\n\u003ctd\u003e下一次遇到新场景\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第13天\u003c/td\u003e\n\u003ctd\u003e处理一个未闭环事项\u003c/td\u003e\n\u003ctd\u003e结束、明确暂缓理由，或下一责任人\u003c/td\u003e\n\u003ctd\u003e约定的复核条件\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e第14天\u003c/td\u003e\n\u003ctd\u003e保留有效改变、删除多余记录\u003c/td\u003e\n\u003ctd\u003e简短维护规则和少数到期任务\u003c/td\u003e\n\u003ctd\u003e重大变化或适当周期\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e完成后不再从第一天无限循环。已经稳定的基础动作压缩成短规则，只有真正到期、出现变化或失效的内容重新展开。连续两周只是阅读与组织示例，不是身体形成习惯或康复需要的固定天数。\u003c/p\u003e\n\u003ch3 id=\"c31-s023\"\u003e31.24　两位照护者的容量不能用一个总小时数代替\u003c/h3\u003e\n\u003cp\u003e照护的困难常常不在总小时，而在不可离开的时段、夜间打断和操作门槛。两个成人都在家，不等于任何时刻都有人能够安全接手；一人同时开会、做饭与看护，也不能在三项任务上都被计为完整负责人。\u003c/p\u003e\n\u003cp\u003e实际排班先标记四种状态：正在负责照护、可随时接手但暂未负责、不可被调用、受到保护的休息。交接时明确改变状态，而不是默认谁听见哭声谁就负责。婴儿需要喂养或病人需要治疗时，仍按照个人计划，不能为守住表格让需要无人响应。\u003c/p\u003e\n\u003cp\u003e夜间任务应当连同准备、操作、清洁和重新安定计入负担，而不只统计主要动作的几分钟。亲友提供帮助时，可以承担餐食、取物、交通或家务，把真正可休息的时间还给主要照护者，而不是只增加一位需要招待的客人。\u003c/p\u003e\n\u003cp\u003e当两位主要照护者都已无法安全完成必要工作，解决方案不是继续优化提醒频率。应减少非必要事务，寻求可用亲友、正式照护或医疗与社区支持，并说明具体缺口。照护不足属于需要处理的资源问题，不是靠一张完美日程能够消失的问题。\u003c/p\u003e\n\u003cp\u003e\u003ca id=\"r31-task-state\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"c31-s024\"\u003e31.25　到期任务的状态：预约过不等于完成，过期不等于重新开始\u003c/h3\u003e\n\u003cp\u003e一条真正需要跟踪的任务可以处于：待判断是否适用、已激活待安排、已预约、已执行待结果、结果待解释、后续处理中、已完成、明确暂缓或不再适用。把这些状态分开，是为了看见任务卡在哪一环，而不是增加行政层级。\u003c/p\u003e\n\u003cp\u003e重复基础动作使用一张有效规则，不每天创建一条新的“刷牙项目”。存在明确截止或未闭环结果的事项才进入到期表；可选年度主题放在另一层，不与急症、喂养或重要随访争抢提醒。\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e任务\u003c/th\u003e\n\u003cth\u003e来源与授权\u003c/th\u003e\n\u003cth\u003e当前状态\u003c/th\u003e\n\u003cth\u003e下一动作\u003c/th\u003e\n\u003cth\u003e负责人\u003c/th\u003e\n\u003cth\u003e下一时间与依据\u003c/th\u003e\n\u003cth\u003e完成证据\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e示例：已由团队安排的复查\u003c/td\u003e\n\u003ctd\u003e当前医疗计划\u003c/td\u003e\n\u003ctd\u003e已预约\u003c/td\u003e\n\u003ctd\u003e准备资料并按约就诊\u003c/td\u003e\n\u003ctd\u003e本人／合法支持者\u003c/td\u003e\n\u003ctd\u003e使用真实预约，不由本书生成\u003c/td\u003e\n\u003ctd\u003e结果已解释，下一步明确\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e示例：筛查未回报\u003c/td\u003e\n\u003ctd\u003e检查机构\u003c/td\u003e\n\u003ctd\u003e已执行待结果\u003c/td\u003e\n\u003ctd\u003e按既定渠道取得结果\u003c/td\u003e\n\u003ctd\u003e指定跟踪人\u003c/td\u003e\n\u003ctd\u003e机构明确的回报安排\u003c/td\u003e\n\u003ctd\u003e正式结果与解释\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e示例：新增学习作品\u003c/td\u003e\n\u003ctd\u003e本人选择\u003c/td\u003e\n\u003ctd\u003e已激活待安排\u003c/td\u003e\n\u003ctd\u003e完成一个可检验小样\u003c/td\u003e\n\u003ctd\u003e本人\u003c/td\u003e\n\u003ctd\u003e按实际容量选择\u003c/td\u003e\n\u003ctd\u003e作品与真实反馈\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e错过一项医疗预约时，联系负责机构确认新安排，不能由软件自行“顺延一周”并假装医学条件没有改变。更不能把漏掉的一次剂量、活动或学习统一按“下次双倍补做”处理。不同任务的补救规则各不相同。\u003c/p\u003e\n\u003cp\u003e执行模板可以保存在纸张、普通文本或本人认可的工具中。涉及他人健康和身份资料，限制访问，不把完整病史放入公开任务看板。自动提醒只能提示已确认的任务，不能把尚未核实的建议自动转换为处方或强制日程。\u003c/p\u003e\n\u003ch3 id=\"c31-s025\"\u003e31.26　源信息变化时，怎样更新而不让整本书失效\u003c/h3\u003e\n\u003cp\u003e一条可维护的证据记录，需要保存具体主张、适用人群、地区、来源及其版本日期、实际核对日期、支持到什么程度，以及哪些行动依赖它。网页今天还能打开，不等于它今天刚更新；页脚版权年份，也不能当作医学建议的版本。\u003c/p\u003e\n\u003cp\u003e当某项建议改变时，先找受影响的规则与任务，而不是让读者从第一卷重新读到最后。比如某地调整接种程序，更新本人的接种计划与到期任务；睡眠环境、生活技能或备份规则并不会因此全部失效。只有共享同一前提的内容才一起复核。\u003c/p\u003e\n\u003cp\u003e同样，“需要进一步研究”可能影响证据把握，却不一定改变今天的行动。如果一项非必要干预一直缺少可靠的人体获益证据，新的机制故事不自动使它值得立即使用。相反，发现原来适用条件被误读、药物重复或时间敏感步骤漏掉，就应优先修正。\u003c/p\u003e\n\u003cp\u003e本版的来源登记区分继承来源与本轮实际重核的命题。未重核不等于错误，但不能把旧编号自动升级成“本轮全部确认”。读者针对个人高风险决定，应由相应专业人员核对当前条件；工具格式检查只能保证编号与链接结构，不提供临床担保。\u003c/p\u003e\n\u003ch3 id=\"c31-s026\"\u003e31.27　四个有区分力的使用情景\u003c/h3\u003e\n\u003cp\u003e**第一种：两月龄，听力筛查未通过，尚未落实进一步评估。**当天新增不是练一项两月龄游戏，而是推进诊断评估的联系与安排。其他必要喂养和安全照护照常。年龄主题不能覆盖一个已经出现的时间敏感分支。\u003ca href=\"#s153\"\u003eS153\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**第二种：三十二岁，自觉状态好，从未找到血脂记录。**不能因此判为异常，也不能把未知填成正常。下一步是核对是否做过、是否适用当前风险评估；不是立即购买全面扫描，更不是依据书中的年龄安排自行用药。\u003ca href=\"#s166\"\u003eS166\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**第三种：开始运动后，当天尚可，但以后生活明显受影响。**不能只以训练打卡成功判断方案有效。先区分普通负担与需要评估的变化，按运动和慢病分支调整；本书的两周起步表不覆盖个人疾病计划。\u003c/p\u003e\n\u003cp\u003e**第四种：八十岁，某项日常任务变慢，但本人仍能参与决定。**先观察具体受限步骤与环境，支持需要帮助的部分，保留本人偏好。不因年龄或速度变化统一接管，也不为证明独立拒绝必要协助。变化突然或明显时先获得合适评估，不用功能卡自行诊断。\u003c/p\u003e\n\u003cp\u003e这四个情景的共同点不是“每天增加更多”，而是新信息真正改变了哪一步。没有新问题时，继续当前有效规则；出现会改变行动的信息时，准确展开相应分支。书的使用价值，应当体现在少一些遗漏、少一些重复折腾，以及多一些本人真正能够做的事。\u003c/p\u003e\n\u003chr/\u003e\n","sections":[{"id":"c31-s000","title":"31.1　行动卡：让一句建议拥有执行条件"},{"id":"c31-s001","title":"31.2　时间窗口：阅读日、开始日、截止日不是同一件事"},{"id":"c31-s002","title":"31.3　受精前行动卡：把准备往上游移动"},{"id":"c31-s003","title":"31.4　围产期乙肝：一个不能断在科室之间的实例"},{"id":"c31-s004","title":"31.5　新生儿离院单：两个人、两条照护线"},{"id":"c31-s005","title":"31.6　早产儿：保留两个年龄，不把两个时钟混用"},{"id":"c31-s006","title":"31.7　发育窗口：观察、标准化筛查、诊断、支持各有结果"},{"id":"c31-s007","title":"31.8　牙齿与辅食：出现一次，不等于任务已经完成"},{"id":"c31-s008","title":"31.9　儿童活动：把全天碎片算清，不把玩耍升级成训练营"},{"id":"c31-s009","title":"31.10　成人力量与有氧：明确起点、参考量和进阶是三件事"},{"id":"c31-s010","title":"31.11　个人预防总表：从三种癌症例子扩展为完整入口"},{"id":"c31-s011","title":"31.12　成人乙肝状态：感染、免疫和既往暴露不能混为一谈"},{"id":"c31-s012","title":"31.13　接种卡：记录完成链条，而不是只收藏年龄表"},{"id":"c31-s013","title":"31.14　戒烟行动卡：从“知道不该吸”进入可获得支持的过程"},{"id":"c31-s014","title":"31.15　多个“好建议”冲突时，只覆盖冲突的部分"},{"id":"c31-s015","title":"31.16　功能储备卡：先问身体正在支持哪些真实任务"},{"id":"c31-s016","title":"31.17　一次问诊的完整交付：不要只带着“帮我看看”离开"},{"id":"c31-s017","title":"31.18　能力进阶：按照前置能力开放，不按照生日强行授权"},{"id":"c31-s018","title":"31.19　学习的最小可验证循环：输入之后必须出现可观察的能力"},{"id":"c31-s019","title":"31.20　增长机会：给可复用成果留一个位置"},{"id":"c31-s020","title":"31.21　资源压力测试：先算真的能够调用什么"},{"id":"c31-s021","title":"31.22　二十四小时容量表：让所有任务回到同一张账上"},{"id":"c31-s022","title":"31.23　连续两周的新增示例：重复底座不再印十四遍"},{"id":"c31-s023","title":"31.24　两位照护者的容量不能用一个总小时数代替"},{"id":"c31-s024","title":"31.25　到期任务的状态：预约过不等于完成，过期不等于重新开始"},{"id":"c31-s025","title":"31.26　源信息变化时，怎样更新而不让整本书失效"},{"id":"c31-s026","title":"31.27　四个有区分力的使用情景"}]}],"anchors":{"c00":0,"c00-s000":0,"c00-s001":0,"c00-s002":0,"c00-s003":0,"c00-s004":0,"c00-s005":0,"c00-s006":0,"c00-s007":0,"c00-s008":0,"c00-s009":0,"c00-s010":0,"c00-s011":0,"c01":1,"c01-s000":1,"c01-s001":1,"c01-s002":1,"c01-s003":1,"c01-s004":1,"c01-s005":1,"c01-s006":1,"c01-s007":1,"c01-s008":1,"c01-s009":1,"c01-s010":1,"c02":2,"c02-s000":2,"c02-s001":2,"c02-s002":2,"c02-s003":2,"c02-s004":2,"c02-s005":2,"c02-s006":2,"c02-s007":2,"c02-s008":2,"c02-s009":2,"c02-s010":2,"c03":3,"c03-s000":3,"c03-s001":3,"c03-s002":3,"c03-s003":3,"c03-s004":3,"c03-s005":3,"c03-s006":3,"c03-s007":3,"c04":4,"c04-s000":4,"c04-s001":4,"c04-s002":4,"c04-s003":4,"c04-s004":4,"c04-s005":4,"c04-s006":4,"c04-s007":4,"c04-s008":4,"c04-s009":4,"c05":5,"c05-s000":5,"c05-s001":5,"c05-s002":5,"c05-s003":5,"c05-s004":5,"c05-s005":5,"c05-s006":5,"c05-s007":5,"c05-s008":5,"c05-s009":5,"c05-s010":5,"c05-s011":5,"c05-s012":5,"c05-s013":5,"c05-s014":5,"c06":6,"c06-s000":6,"c06-s001":6,"c06-s002":6,"c06-s003":6,"c06-s004":6,"c06-s005":6,"c06-s006":6,"c06-s007":6,"c06-s008":6,"c06-s009":6,"c06-s010":6,"c06-s011":6,"c06-s012":6,"c06-s013":6,"c07":7,"c07-s000":7,"c07-s001":7,"c07-s002":7,"c07-s003":7,"c07-s004":7,"c07-s005":7,"c07-s006":7,"c07-s007":7,"c07-s008":7,"c07-s009":7,"c07-s010":7,"c07-s011":7,"c07-s012":7,"c08":8,"c08-s000":8,"c08-s001":8,"c08-s002":8,"c08-s003":8,"c08-s004":8,"c08-s005":8,"c08-s006":8,"c08-s007":8,"c08-s008":8,"c08-s009":8,"c08-s010":8,"c08-s011":8,"c08-s012":8,"c08-s013":8,"c09":9,"c09-s000":9,"c09-s001":9,"c09-s002":9,"c09-s003":9,"c09-s004":9,"c09-s005":9,"c09-s006":9,"c09-s007":9,"c09-s008":9,"c09-s009":9,"c09-s010":9,"c10":10,"c10-s000":10,"c10-s001":10,"c10-s002":10,"c10-s003":10,"c10-s004":10,"c10-s005":10,"c10-s006":10,"c10-s007":10,"c10-s008":10,"c10-s009":1 sources","s84":"sources","s85":"sources","s86":"sources","s87":"sources","s88":"sources","s89":"sources","s90":"sources","s91":"sources","s92":"sources","s93":"sources","s94":"sources","s95":"sources","s96":"sources","s97":"sources","s98":"sources","s99":"sources","s100":"sources","s101":"sources","s102":"sources","s103":"sources","s104":"sources","s105":"sources","s106":"sources","s107":"sources","s108":"sources","s109":"sources","s110":"sources","s111":"sources","s112":"sources","s113":"sources","s114":"sources","s115":"sources","s116":"sources","s117":"sources","s118":"sources","s119":"sources","s120":"sources","s121":"sources","s122":"sources","s123":"sources","s124":"sources","s125":"sources","s126":"sources","s127":"sources","s128":"sources","s129":"sources","s130":"sources","s131":"sources","s132":"sources","s133":"sources","s134":"sources","s135":"sources","s136":"sources","s137":"sources","s138":"sources","s139":"sources","s140":"sources","s141":"sources","s142":"sources","s143":"sources","s144":"sources","s145":"sources","s146":"sources","s147":"sources","s148":"sources","s149":"sources","s150":"sources","s151":"sources","s152":"sources","s153":"sources","s154":"sources","s155":"sources","s156":"sources","s157":"sources","s158":"sources","s159":"sources","s160":"sources","s161":"sources","s162":"sources","s163":"sources","s164":"sources","s165":"sources","s166":"sources"},"search":[{"ch":0,"id":"c00-s000","title":"〇·一　先定义“最优”，否则勤奋可能朝着错误方向累积","text":"这本书把“最优地使用人体”解释为：在本人能够理解并认可的目标下，尽可能保有行动能力、学习能力、感受能力、关系能力与选择能力，同时减少可避免的伤害、痛苦和照护失控。活得久是其中一个目标，但不是可以吞掉其余目标的唯一数字。一个人为延长理论寿命而失去吃饭的快乐、持续害怕自己的心率、拒绝所有亲密关系，未必是在更好地生活。另一个人用极短期兴奋交换长期功能，也不能只凭“当时很开心”忽视代价。  本书不假设所有人都要结婚、生育、创业、拥有健全肢体、取得高收入或者活到一百岁。人生不是单一赛道。受精卵没有可自行执行的待办清单；胎儿、婴儿以及暂时不能独立决策的人，需要的是照护者正确地安排环境，而不是被要求为自己的发育负责。成年以后，书中的建议逐渐从“照护者应该做什么”转为“本人可以选择什么”。高龄以后，协助可能增加，但决策权不应因此自动被收走。  为了实际取舍，可以把每个计划放在五个问题下检验：它保护了什么功能；它占用多少时间、金钱、注意力和恢复空间；它最坏会造成什么；它是否会挤掉一件更重要的事；本人是否愿意让这种生活持续一年。这里不把答案硬算成一个貌似科学的总分。不同人的取舍不能由一组未经验证的权重替代。  全书的默认排序是：先处理急迫危险，再守住基本供给，然后恢复受限功能，继而发展能力，最后探索边际收益不确定的优化。排序并不意味着生活必须先毫无缺陷才允许快乐。恰恰相反，能让人愿意继续生活的关系、兴趣和自主感，应该进入基础层，而不是被放在“所有指标达标之后”的奖励层。"},{"ch":0,"id":"c00-s001","title":"〇·二　两套年龄，避免从第一页就算错时间","text":"本书使用受精时钟与出生时钟。受精当天写作“受精第零日”，是生物学叙述的起点。临床孕周通常按末次月经或超声校正结果记录，不能简单等同于受精后的周数；在常见的日期估算中，两者大约相差两周，但周期、排卵和辅助生殖情况都可能改变算法。实际产检以医疗团队确认的孕周和预产期为准，不用这本书反推一个声称精确到天的受精日期。 S07 S11  出生当天另起“日龄零日”。出生后一个月、六个月、一周岁，均按出生日期计算；讨论早产儿发育时，还需要医疗团队指导使用矫正年龄。全书覆盖受精至出生后满一百周岁这一段时间，因此不是把怀孕的月份从一百岁中扣掉。一个人的百岁生日也不是计划终止日：到达这个节点后，仍可继续使用高龄、照护和自主选择的协议。  日龄区间一律采用前端包含、后端不包含的理解。例如“六至十二个月”指已满六个月、未满十二个月；满十二个月当天进入下一阶段。连续日龄的数学覆盖并不表示人的能力会在午夜突然升级。月龄和周岁只是索引，真正的切换条件还包括能力、症状、生活事件和专业评估。"},{"ch":0,"id":"c00-s002","title":"〇·三　“每天应该干什么”的完整解法","text":"每天的行动不是从零重新发明，而由五层叠加：当前生命阶段的基础协议、年龄或能力带来的新增任务、当周轮换主题、已经发生的事件、当天的资源限制。除此以外，还有一个有权打断所有层次的安全判断。只要出现急迫危险，就先寻求适当帮助，而不是完成当天运动量后再处理。  读者可以把它理解成一个不会强迫执行的日程生成器。早晨先问：今天是在平稳状态、恢复状态，还是需要求助的状态？平稳时照常；恢复时减少非必要负荷；需要求助时把就医、转移危险、联系可信赖的人放在首位。然后打开所在年龄的章节，只看上一次没有出现过的增量。最后选一个今天确实容得下的新动作，而不是把全书同时搬进日历。  对婴儿，日程以喂养、睡眠、清醒互动、清洁和照护者交接为节律，不应按成人办公钟硬切。对学生，学校已经占用的时间必须进入总预算；不能再把每项能力训练都当作额外增加的免费时间。对工作者，通勤、家务、照护、恢复都是真实负荷。对高龄者，活动前后需要的准备和休息，也是任务的一部分。  如果某一天没有任何新增情况，正确答案就是继续执行已经展开过的基础协议。重复行动可以重复发生，但不需要重复写三万多遍。书中的折叠块负责保存这些共用行动；章节链接负责说明从哪里继承；新增内容负责告诉读者发生了什么变化、为何变化、怎么调整。"},{"ch":0,"id":"c00-s003","title":"〇·四　四种标签，防止把编排当成医学定律","text":"“依据”表示该结论有对应的官方指南、公共卫生资料或原始研究入口，正文用方括号来源编号标注。“编排”表示作者为了便于执行而设计的日程、练习、问题或顺序，不是临床试验已经证明的唯一最优解。“条件”表示必须先满足的能力、环境或医疗条件。“待核”表示此项依赖所在地政策、具体产品说明书、个体病史或未来更新，不能凭书中概括直接实施。  尤其需要注意：本书把某个主题安排在二十三岁、四十七岁或者八十二岁，不代表科学证明那一年存在独一无二的窗口。成人逐年主题是一份可移动的年度审视清单。已经掌握的人可以跳过；目前正遭遇这个问题的人可以提前使用；没有相关生活情境的人不需要为了完成表格而制造一个。  一个建议旁边没有药物剂量，往往不是遗漏，而是它本来就不应该变成跨越所有年龄、所有病史的自我处方。营养素的公共参考值也不等于每个人必须另吞一片补充剂。食物、强化食品、复合产品与处方可能共同构成总摄入量，不能把各处建议机械相加。"},{"ch":0,"id":"c00-s004","title":"〇·五　用身体能力，而不是只用年龄分流","text":"从能否安全完成任务来分流，比只看年龄更可操作。准备练习上楼的人，先确认是否能够安全起身、行走、转身以及表达不适；准备独立做饭的孩子，先确认能否理解热源、刀具、过敏和求助规则；准备独居的人，先确认能否处理紧急联系、基本生活和药物，而不是只问是否达到某个生日。  因此，年龄主线之外，本书始终保留四种接口：需要他人代执行、需要旁边协助、可以独立执行、可以教别人执行。它们不是人的等级，只是任务的权限状态。一个人在财务上能完全独立，在身体转移上需要协助，在语言沟通上需要辅助设备，在医疗决策上又能清楚表达，这些状态可以同时存在。  当功能下降，先找出具体任务哪里卡住，不要立即给整个人贴上“不行了”的标签。拿不到杯子可能是杯架太高；不愿出门可能是厕所难找；不回答问题可能是听不清；不会用手机可能是界面改变。先改接口，再判断能力，能够避免不少由环境制造出来的无能感。"},{"ch":0,"id":"c00-s005","title":"〇·六　最低可行日、常规日与探索日","text":"最低可行日是给生病、照护中断、考试冲刺、家庭危机或极端忙碌准备的降级方案。它只保留安全、基本进食饮水、必要治疗、可获得的休息、最低限度卫生，以及一个能求助的联系渠道。婴儿和依赖照护者的人不能因为成人忙碌而削减必要照护，降级应当从成人的非必要事务开始。  常规日是长期真正会反复发生的日子。它包含可以持续的睡眠安排、符合能力的活动、可负担的饮食、工作或学习、连接他人的时间和一点不被绩效考核的空白。常规日不需要每天都很精彩。它的检验标准是明天还能继续，而不是今天把所有项目都刷满。  探索日用来接触新运动、新知识、新环境和新关系，但应先划定风险预算。第一次攀登、第一次使用新设备、第一次处理高额合同，都不能只凭热情复制熟手的做法。探索可以让生活更丰富，前提是失败仍在可承受范围内，且不会把依赖你的人一起推入未经同意的风险。  这三种日型之间可以切换。没有必要把最低可行日解释成人格失败，也不要因为某个探索日特别有成就感，就要求全年维持同样强度。人的生活需要节奏，而不是一条永远向上的负荷曲线。"},{"ch":0,"id":"c00-s006","title":"〇·七　一个成人的示例日，展示生成方式而非规定钟点","text":"假设读者三十五岁，主要坐着工作，没有已知运动禁忌，今天精神平稳。晨间先完成必要卫生和早餐安排，确认今天一项最重要的工作结果，再决定活动放在哪里。通勤能安全步行的部分可以计入活动；工作间歇可以更换姿势、短暂离开屏幕；午间不必同时完成学习课程、社交和高强度训练。  下午把需要集中判断的工作与琐碎沟通分开，避免一天所有时间都被即时消息切碎。傍晚根据本周计划安排适量运动，或在疲惫时改为较轻的活动。晚上完成生活维护、必要沟通和第二天准备，留出结束工作的边界。这一天的新增事项可能只是“把家中药物清单整理成一页”，不需要再加十个健康挑战。  如果同一个人昨晚几乎未睡、今天还要长途驾驶，生成结果应当改变：驾驶风险优先，训练和额外学习可以取消。如果今天出现新发胸痛伴明显不适，日程生成器被安全规则打断，进入急救评估，而不是把不适解释成缺少意志力。这才叫真正的按天安排。"},{"ch":0,"id":"c00-s007","title":"〇·八　一个家庭的示例日，展示冲突如何处理","text":"假设家中有婴儿、上班的伴侣和行动不便的老人。三套最理想的个人日程相加，通常会超过家庭的人力预算。此时应先画出必须由真人完成的任务：谁负责喂养，谁处理老人转移，谁能连续休息，谁在突发情况时接班。家务可以推迟或外包，必要照护不能假装由“大家”负责。  安排交接时，不写“下午帮忙看一下”，而写清谁接手、何时接手、上一项照护完成到哪里、什么情况需要联系另一人。重要信息用一份可更新的记录，而不是散落在多人聊天的回忆里。这样做的目的不是把家庭变成机构，而是减少疲劳状态下的遗漏和相互指责。  真正需要优化的往往不是某个人更自律，而是家庭减少一次无谓往返、取消一项没有意义的消费、让一个照护者能够完整吃饭，或者让求助变得不丢脸。身体处在关系网络之中，维护一个人的功能，有时必须先维护支持他的系统。"},{"ch":0,"id":"c00-s008","title":"〇·九　记录什么，才能真正降低不确定性","text":"记录不是越多越好。一个有用的记录，应当能改变未来的行动。若某项数据既没有可靠测量方式，也不知道出现变化后怎么办，那么持续记录它可能只是增加焦虑。优先记录症状发生的时间、持续情况、相关活动、是否影响功能、已经采取的措施，以及专业人员给出的下一步。  对于习惯，只需记录是否执行到足以判断可持续的程度。例如想增加阅读，关注能否回忆和使用内容，比精确计算翻了多少页更重要；想改善家庭沟通，关注是否明确了下一步与责任人，比给每天的情绪打三种颜色更重要；想恢复步行能力，关注安全性、疲劳与生活参与，比追逐一个陌生人的步数纪录更重要。  记录也要有删除规则。已经稳定、不再影响决策的数据可以降频；包含他人隐私的内容要征得适当同意；孩子的照片、病史和日常细节不应因为父母管理方便就被无限公开。降低信息熵不能以剥夺他人的隐私为代价。"},{"ch":0,"id":"c00-s009","title":"〇·十　如何从任意年龄开始，而不是因“错过起点”放弃","text":"第一次打开本书，无论你十六岁、三十岁还是八十岁，都不必补做此前所有章节。先找当前年龄主线，再检查基础协议中是否有一个明显缺口，最后处理正在发生的生活事件。过去的章节仅作为理解背景，不构成需要偿还的作业。  对已经错过的机会，区分三类：仍能直接补上的能力；需要换一种方式实现的目标；已经不可逆但可以减轻后果的经历。例如不会游泳可以寻找合适教学；某项运动已不适合时可以保留其社交和户外价值；童年受到伤害则不应被要求通过“想开一点”重写历史。书中的任务是帮助现在的你拥有更多可行路径，不是裁判以前的你是否合格。"},{"ch":0,"id":"c00-s010","title":"〇·十一　阅读路线与折叠规则","text":"首次阅读建议先看本卷与安全卷，再看所在年龄阶段，随后根据现实问题进入专题。负责婴儿照护的人应同时阅读孕产、新生儿、喂养与安全部分；进入老年照护的人应同时阅读功能、药物、家庭协作和生命末期部分。阅读不是必须从第一页进行到最后一页的考试。  折叠块用来容纳确实反复复用的协议，例如成人日常底座、每周审视和家庭交接。支持原生HTML折叠的Markdown阅读器可以展开与收起；不支持的阅读器通常仍会显示全部文字。正文通过编号和标题引用，而不把同一段话改几个词反复写入不同年龄。必要的安全提醒可能在危险场景再次出现，这是有意保留的少量冗余。  书后提供年度主题、日程示例、异常分流、决策表和来源说明。它们不是让你每天阅读更多，而是让你用更少搜索找到下一步。真正成功的使用方式，是把大量可能性压缩为今天少数值得做的事，然后把注意力还给实际生活。"},{"ch":0,"id":"c00-s011","title":"〇·十二　这本书承认的边界","text":"截至本版核对日期，任何一本书都不能保证一个人活到一百岁，也不能为每一种罕见疾病、每一处法律制度、每一种残障或每一种家庭结构给出完整处方。本书追求的是宽覆盖、细粒度行动和清楚的分流，而不是宣称已穷尽人类生命中的每个信息点。  资料中的年龄范围是群体参考，不是给个人下判决的工具。新的症状不能靠这本书排除严重疾病；治疗、检查与用药需要适当专业人员结合实际情况决定。医学、公共政策和可用技术会变化，因此这是一份可更新的操作手册，不是一份可以封存一百年不再复核的圣典。  “最优”最后仍然要回到本人：这个安排是否让你更能做自己珍视的事，是否让你与他人相处得更有尊严，是否给未来留下选择。如果一个方案让所有数字都变漂亮，却使生活变得更狭窄，就需要重新检查目标，而不是继续加码执行。"},{"ch":1,"id":"c01-s000","title":"一·一　安全不是每天害怕，而是提前决定少数关键动作","text":"安全管理的目标，是让危险发生时少做几次临场猜测。家庭最值得事先统一的不是“大家都要小心”，而是谁知道地址，谁能呼叫当地急救，谁会开门引导救援，谁能提供用药和过敏信息，谁负责其他孩子或依赖照护者。一个人在紧张时未必能同时回忆所有事项，因此把它们写在容易找到的一页上，比要求每个人保持镇定更可靠。  这张卡应包含姓名、紧急联系人、重要疾病、已知严重过敏、正在使用且急救相关的药物、常用医疗机构，以及主要沟通需要。不要把无关的完整人生经历塞进去。家人至少知道卡片放在哪里；独居者可在手机紧急信息和钱包中留出最小版本。涉及隐私的内容以够用为度，不需要公开给所有访客。  平时演练只练动作，不制造恐慌：从房间到门口的路是否畅通，楼栋和门牌是否清楚，电话没电时能否求助，夜间照护者不在时是否有替补。真正的演练结束时，应当留下一个改动，而不是只说“下次注意”。"},{"ch":1,"id":"c01-s001","title":"一·二　全龄紧急覆盖规则","text":"突然失去反应、没有正常呼吸或只有濒死喘息，应立即启动当地急救系统并按调度员指导行动；让旁人取来自动体外除颤器并依提示使用。成人心肺复苏的核心包含胸外按压；常用培训参考为每分钟一百至一百二十次。婴儿、儿童、溺水等情形的流程和通气要求不同，不能把成人摘要原样套用。最有价值的平日动作是接受正式实操培训，而不是只收藏文字。 S34  突然一侧面部下垂、单侧无力、言语异常，或突发明显视力、平衡问题，应把卒中作为需要紧急排除的情况。记录最后一次状态正常的大致时间，不等待自行恢复后再决定；症状短暂消失也不表示风险已经解除。不要自行开车前往急诊，不用进食、按摩或临时服药替代急救评估。 S35  接触食物、药物或昆虫后迅速出现喉舌肿胀、呼吸困难、明显头晕或倒下，可能是严重过敏反应。立即呼叫急救；有医生开具的肾上腺素自动注射器及行动计划时，依培训和说明使用。不能只等抗过敏药起效，也不应让当事人站起或走动去找帮助。 S36  以上不是全部急症清单。持续或剧烈胸痛伴不适、严重呼吸困难、大量出血、抽搐后不能恢复、严重外伤、可疑中毒、突发意识混乱，都应优先获得紧急评估。不能把“书上没有出现这个组合”理解为可以放心等待。紧急程度看症状与状态，不看年龄是否年轻、平时是否自认为健康。"},{"ch":1,"id":"c01-s002","title":"一·三　婴儿与孕产期有更低的求助门槛","text":"未满三个月的婴儿测得体温达到三十八摄氏度，或照护者明显怀疑发热，应立即联系医疗服务获得及时评估，而不是先在家完成多轮退热观察。难唤醒、呼吸费力、发青、明显拒奶或反应异常，需要更紧迫处理。测量方法、环境和设备会影响读数，但不能用“可能是误差”拖延一个看起来生病的婴儿。 S29  孕期和分娩后，严重腹痛、明显出血、胸痛、呼吸困难、持续严重头痛伴视物异常、昏厥，或伤害自己和婴儿的想法，均应及时获得医疗帮助。就医时主动说明正在怀孕或最近一年内分娩过，这项信息不能假设每位接诊者已经知道。 S10  早孕出现单侧下腹痛、肩尖痛、头晕或晕厥等组合，需要警惕异位妊娠相关风险。早孕试纸阳性只回答是否检测到相关激素，不能独立证明妊娠位置和发育情况；是否需要超声、抽血和何时复查，由医疗团队结合症状安排。 S27"},{"ch":1,"id":"c01-s003","title":"一·四　把急救知识放在真正能用的地方","text":"急救箱不是药越多越好。它应当服务于家庭已明确的需要：合适的测温工具、常用敷料、个人处方救急药及其书面计划、可访问的联系方式。药物与工具分区，保留外包装和说明书，定期核对是否过期、是否适用于现有人口。儿童接触不到，不等于老人或照护者在紧急时也找不到。  对每一种救急药，应清楚“给谁用、什么条件下用、怎样用、用后还要做什么”。不知道属于谁的药，不能因为症状看似类似就给另一人使用。需要冷藏、避光或防高温的产品按具体说明保存；外出时也要计算储存条件，不把“带在身上”误当作“仍然有效”。  家庭若有人有严重过敏、癫痫、糖尿病或其他需要应急预案的疾病，应请相应团队制作个人行动计划。本书可以帮助检查计划是否好找、是否有人会执行，却不替代具体疾病的处方和急救教学。"},{"ch":1,"id":"c01-s004","title":"一·五　共用协议B：每天反复使用，只在此处完整展开","text":"展开共用协议B：适用于能参与日常安排的人；婴儿与特殊疾病使用相应分龄版本 晨间先确认今天的功能状态：能否安全起身，是否有明显的新症状，是否已经知道必须执行的治疗或照护。随后完成与个人能力匹配的清洁、口腔护理、进食和必要用药。不要为了晨间仪式一次增加很多产品；有处方时间要求时，围绕处方安排，而非让处方迁就网红作息。 白天安排身体活动与姿势变化，工作、学习、家务和交通一起计入总负荷。用能持续的方式接触日间环境、完成生活任务、与至少一个合适的人保持沟通。活动方式不局限于步行：轮椅推动、上肢活动、康复练习或协助下的转移，都可以是个体计划的一部分。 进食时先满足安全、足量、可获取和基本多样性，再考虑精细优化。饮水围绕实际需要、环境和医疗限制，不用统一的超大量灌水挑战。存在吞咽困难、心肾疾病、婴幼儿喂养问题时，采用专业方案，不套成人日常常识。 晚间完成必要口腔与身体清洁，把次日最容易遗漏的事项放到可以看见的位置，留出结束工作的边界。睡眠需求按年龄参考，睡眠安排应兼顾机会、规律和白天功能；不把可穿戴设备的单项评分当作最终裁判。 S05 每日只做简短复盘：今天最需要处理的异常是什么；哪件事顺利到可以继续；明天需要取消、调整或求助什么。没有新问题时，允许不写长日记。完成基础照护后，娱乐、休息和无目的的体验都可以是合理选择。"},{"ch":1,"id":"c01-s005","title":"一·六　共用协议W：每周维护，而不是每天重新研究人生","text":"展开共用协议W：每周一次的系统维护 先看下一周的不可移动事项：诊疗、考试、出差、照护交接、工作截止日期。再放入基础生活和恢复，最后才加入新增目标。若总量超出可用时间，先删掉低价值承诺，而不是默默削掉睡眠或让某位家人无偿承接。 检查家庭供给：基本食材是否足够，个人处方是否接近用完，交通和接送是否已安排，必要器具能否正常使用。把需要他人配合的事提前确认，不把一周中的每一天都变成临时求救。 选一个值得改善的摩擦点。例如洗漱用品摆放不便、晚餐决定耗时、孩子作业通知散乱、老人外出路线没有休息点。只改一个具体接口，并在下一周判断是否真的减少了问题。不要每周重新更换整套生活系统。 保留一个关系窗口和一个不以产出为目的的空白窗口。前者可以是认真听一个人说话，后者可以是散步、看天、音乐、游戏或什么也不做。它们不是必须被量化的治疗，而是本书对可持续生活的编排建议。"},{"ch":1,"id":"c01-s006","title":"一·七　共用协议E：事件发生时，哪些事暂停","text":"展开共用协议E：疾病、旅行、照护中断和危机的覆盖顺序 出现急迫危险时，暂停普通日程，启动安全分流。出现非紧急但影响功能的新症状时，减少可推迟的负荷，记录关键信息并安排适当评估。已经有医生提供的疾病行动计划时，优先使用该计划。 出差或旅行时，保留必要药物、睡眠机会、食物与水的安全、交通与紧急联系；训练形式可以改变，非必要补充剂可以先向专业人员核对是否需要携带。不要把旅途当成必须维持所有平时数字的考试。 照护者暂时失能时，首先分配依赖照护者的吃、喝、药物、转移、安全与沟通，再处理家务和工作。接替者需要的是具体交接，不是“按照平时来”。家庭危机时，降低目标数量，但不要隔绝所有求助渠道。 恢复后从当前能力重新进入计划，不按旧计划“补课”。错过的运动、学习和社交不需要在下一天翻倍完成；需要补做的疫苗、复查、药物或医疗事项则按专业安排处理，不自行加倍。"},{"ch":1,"id":"c01-s007","title":"一·八　证据的三个误读：平均值、相关性和替代指标","text":"一个群体平均有益的做法，并不代表每个人都从同一剂量获得同样收益。把统计建议落到个人时，要考虑基础状态、疾病、能力、偏好和代价。年龄范围用于提示关注，不是要求在范围边缘突然改变全部行为。  两个现象一起出现，不一定说明一个造成另一个。经常运动的人可能还拥有更安全的社区、更稳定的收入和更多支持。对个人行动而言，不需要因此否定运动，但不能把每一种观察性关联都转译成确定的因果承诺，更不能随手宣称“这一动作能多活多少年”。  体重、步数、睡眠评分、化验结果和生物年龄都只是部分窗口。它们可以有用，却不是完整的人。一个人为了体重下降而丢失力量、为了步数达标而冒险夜行、为了睡眠评分而越躺越焦虑，说明代理指标正在压过真实目标。每个指标都应有配套的功能检查与停止条件。"},{"ch":1,"id":"c01-s008","title":"一·九　购买健康产品之前的九格审查","text":"先写下要解决的问题，是缺乏、症状、疾病风险还是外观愿望；再写明当前最可能的原因，不知道就保留不知道。之后核对产品究竟改变什么，是改善临床结局、缓解症状、改变化验指标，还是仅有机制推测。广告中的“支持”“促进”“焕活”不能自动翻译成可验证的收益。  接着问剂量、适用人群、研究产品与售卖产品是否一致，是否有与现有药物相互作用的可能，是否需要专业监测。补充剂的证据强弱差异很大，孕妇、哺乳期、儿童和准备手术的人尤其不能把“天然”理解为已证实安全。 S38  最后问三件交易层面的事：总成本是什么；多久后能判断是否值得继续；停止后会发生什么。如果一个产品要求无限期坚持，却不允许定义失败标准，就无法形成清楚的决策闭环。即使价格负担得起，注意力和日常维护也不是免费的。"},{"ch":1,"id":"c01-s009","title":"一·十　不要把照护权变成支配权","text":"需要协助的人仍然有偏好。帮助洗澡前说明下一步，协助进食前询问口味和节奏，讨论治疗时尽可能让本人参与，替人处理事务时保留解释和选择。便利不应成为无条件剥夺决定权的理由。  儿童的自主权随理解与能力增加，成人的自主权不会只因年龄增加就归零。不能因为有人记性下降，便把他所有财务、社交和身体选择一次性收走；也不能因为孩子表达不够成熟，就忽视他对疼痛、恐惧或不舒服接触的报告。具体的法律代理和医疗决定权限要按所在地要求核对。  如果照护中出现羞辱、恐吓、限制必要食物、无故阻断求助或强迫不必要接触，应当把它视为需要处理的安全问题，而不是“家事不方便说”。寻求可信赖的医疗、社会服务或当地保护渠道，是维护身体安全的一部分。"},{"ch":1,"id":"c01-s010","title":"一·十一　安全余量从哪里来","text":"安全余量不是把所有风险消灭，而是避免每个环节都刚好卡在极限。时间上，重要出行不把路线安排到毫无缓冲；财物上，必要生活和应急资源不全押在一个不确定结果上；体力上，活动结束仍保留回家、洗澡、进食和照护所需的能力；关系上，不让所有求助都依赖同一个永远不能倒下的人。  检查余量时，可以问一个简单问题：如果今天一个人、一件设备或一个交通环节失效，最重要的生活功能还能不能继续？不能继续的地方，就是优先建设替补的地方。替补可以是一把备用钥匙、一个可靠联系人、一份纸质药单，也可以是把不必要的承诺删掉。  本卷的全部设计最终只服务一件事：让平稳的日子更省力，让不平稳的日子不至于因为混乱而变得更危险。它不要求你每天担忧风险，而是让风险有了明确入口以后，可以把更多注意力用于真正想过的生活。"},{"ch":2,"id":"c02-s000","title":"2.0　受精前的准备入口","text":"叙事从受精开始，但有些准备必须在受精前完成。对可能怀孕的一般风险人群，CDC建议每日摄入四百微克叶酸；计划怀孕时至少提前一个月开始，并在妊娠中继续。既往神经管缺陷相关妊娠及其他高风险情况应提前确定个人剂量，不自行用多种复合维生素拼出高剂量。 S03  准备就诊时，双方整理已有疾病、处方与补充剂、既往妊娠结果、接种记录及重要家族史。已怀孕才打开本书，也应从现在补齐信息，不用没有提前准备推断结局。药物调整、接种适用性与遗传咨询由相应专业人员负责；核对清单与交付要求见 受精前行动卡 。"},{"ch":2,"id":"c02-s001","title":"2.1　此时谁是行动者","text":"受精卵不会执行训练计划。这个阶段所有“今天应该做什么”，行动者都是孕育者、共同养育者、医疗团队与生活环境的管理者。把孕育者当作需要被优化的容器，会同时伤害其自主权与照护质量。因此，本卷每项决定都以孕育者知情同意为前提；伴侣的责任是分担成本，而不是监视饮食、情绪和体重。  本书所说“受精第一天”，只是生命时间线的起点，不是说每个人都能知道受精的准确日期。排卵试纸、同房日期和手机预测不能把误差消除；辅助生殖也有自己的计时方式。临床孕周通常从末次月经起算，再结合超声等资料校正，不能把本书的受精日直接填写为医院的孕周。 S41  这里最有价值的行动，大多很朴素：建立医疗联系，核对药物，降低明确暴露，保证获得食物与休息，预留应急交通，处理家庭中的不安全因素。没有必要把胎儿当作需要按天升级的学习设备；不必给腹部放音箱、购买“脑开发套餐”或追逐每天的细胞变化来指导饮食。"},{"ch":2,"id":"c02-s002","title":"2.2　受精日及随后几天：不要制造可控制一切的幻觉","text":"**受精日。**通常本人尚不知情。如果正在备孕，沿用已经确认安全的生活与用药计划即可。没有一个需要在受精后若干小时内抓住的健身、食补或姿势窗口。共同养育者此时能做的，是把未来两周的高风险饮酒场合、接触有害物质的工作和不必要的熬夜安排调整掉，而不是要求孕育者停止正常生活。  **受精后第一至第三天。**把“可能怀孕”作为用药咨询时需要说明的信息；必要治疗不要因为害怕而自行停掉。整理药盒中的处方药、非处方药、草药、保健品、外用药和长期使用的吸入剂，拍摄正反面标签。需要记录的是有效成分与剂量，不只是商品名。由专业人员判断保留、替换或停用，远比搜集“孕妇禁用药大全”可靠。  **受精后第四至第七天。**可把家庭安全检查安排在这个区间，但这是编排建议，不代表生物学在这一天要求检查。检查烟雾和一氧化碳报警器、燃气设备、通风、厨房生熟分区、清洁剂存放与急诊路线。高处擦窗、搬重物、强刺激清洁等任务交给有条件的其他人或专业服务；不要同时要求孕育者负责发现问题、购买用品和监督整改。  **受精后第八至第十四天。**等待可能带来反复测量与搜索冲动。给信息搜集设定一个容器：把问题记在同一个清单，集中向专业人员求证。单次身体感觉不能证明着床，试纸颜色也不是可供家庭独立判断胚胎发育的精密仪表。出现疼痛、出血或其他担忧时，按症状与医疗建议行动，而不是靠反复比较照片安慰自己。  上述区间中的细胞分裂、迁移和着床并非每个人严格同日发生。这里不提供“第六天必须吃什么帮助着床”一类伪精确任务。 S41"},{"ch":2,"id":"c02-s003","title":"2.3　首次发现怀孕的当天","text":"先解决三个问题：本人是否安全；医疗联系在哪里；已经在用的东西是什么。记录末次月经、检测日期、症状、既往妊娠情况以及重要疾病。联系当地正规的孕产服务，说明慢性病、既往宫外孕、近期出血或疼痛、辅助生殖等情况，让对方决定何时面诊。早发现并不等于必须同一天完成所有抽血与影像检查，也不等于“尚未看见某个结构就一定异常”。  把当前药物清单发给产科及原治疗医生协调。甲状腺病、糖尿病、癫痫、高血压、精神疾病等人群尤其需要连续治疗安排；本书不提供统一调整比例。向医生问清四句话：“目前哪些必须继续？哪些需要尽快评估？什么时候复查？什么症状需要提前联系？”不要以“孕妇不能吃药”取代风险比较。  一般风险人群的叶酸基础建议可参考每日四百微克叶酸；有神经管缺陷相关病史或其他高风险情况，剂量由医生另定。要核对复合维生素是否已经含有叶酸，避免把多个品牌叠加成自己也算不清的总量。单位中毫克与微克相差一千倍，抄写时必须保留单位。 S03  生活方面，先撤掉酒精暴露，并将吸烟、二手烟和其他物质使用如实告诉医疗人员。咖啡因要合计咖啡、茶、能量饮料、巧克力与部分药品，而不是只数咖啡杯。NHS给出的孕期上限参考为每日二百毫克咖啡因；杯型与冲泡浓度差异很大，不能把“一杯”当成固定剂量。 S08"},{"ch":2,"id":"c02-s004","title":"2.4　临床孕四至六周：把不确定性装进计划","text":"这一阶段的家庭任务是建立一页孕期档案。档案包含联系人、就诊机构、预产期及其确定方式、过敏史、既往妊娠与手术、正在使用的药物、医生给出的复查日期。把“尚未确定”明确标出来，胜过填入一个看起来完整但来源不明的数值。  安排家务时，不问“还能不能做”，而问“做这件事的负担是否值得由她承担”。例如日常做饭可以保留，但闻到油烟就恶心的人不必证明自己坚强；可换成由伴侣备餐、购买卫生可靠的熟食、减少复杂烹饪。照护者提供两三个可接受的选择，不进行“为了孩子你必须吃”的说服。  如果出现单侧下腹痛、肩尖痛、头晕欲晕或出血，尤其伴明显疼痛，应及时获得医疗评估；严重疼痛、晕厥或循环不稳是急症。不要因为已经测到阳性，就自行认定妊娠位于宫内。 S27 本卷不让读者在家区分所有原因，而让读者知道何时不该继续观察。  安排等待期时，把“下一次检查要回答什么”写下来。例如是确认位置、复核孕周、评估症状，还是讨论某种筛查。若答案只是“想再安心一次”，也可以坦诚提出，但需要理解额外检查可能产生新的不确定结果。"},{"ch":2,"id":"c02-s005","title":"2.5　临床孕七至八周：建立可吃、可睡、可工作的一天","text":"每日计划从当前耐受度开始。起床后先判断是否能正常饮水进食、能否完成基本活动、是否出现新危险信号。没有异常时，再选择当日工作量。不要把此前运动水平与工作效率当作这个时期必须维持的基准。  进食困难时，可以把一大顿拆成自己更能接受的几次，优先解决可入口和食物安全。记录真正引起恶心的气味、温度、质地，减少家庭反复猜测。若持续呕吐，明显喝不进去、尿量下降、头晕或体重持续下降，应联系医疗人员，不要只靠姜糖或硬撑解决。 S10 药物止吐是否合适由医生判断，不能因为“天然”二字就忽略草药的成分与剂量。  睡眠安排要允许补偿现实负担，但不把床变成全天的信息焦虑中心。需要休息时关闭工作提醒；清醒且感觉可以活动时，安排轻量走动、洗漱和短暂户外活动。这里的目标是舒适和功能，而不是用步数证明妊娠稳定。已有运动习惯的人应根据产科建议调整，避免突然开始不熟悉的高强度、碰撞或高跌落风险活动。 S09  工作场景增加一次“暴露盘点”：是否涉及溶剂、重金属、放射线、感染、极端温度、夜班、长期站立或体力搬运。向职业健康或产科提供具体岗位与材料名称，不用“工作有点累”概括所有风险。任务调整应尽量通过制度完成，而不是让同事私下承担长期不明责任。"},{"ch":2,"id":"c02-s006","title":"2.6　临床孕九至十周：为筛查作决定，而不是被套餐牵着走","text":"筛查的作用是估计某些情况的风险，诊断检查则试图确认特定问题。二者不能混同；筛查阴性不能承诺所有方面正常，筛查阳性也不等于确诊。需要做决定时，请医疗团队解释：查什么、不查什么、假阳性或不确定结果之后怎么办、进一步检查有什么代价、结果是否会改变照护。  这里不提供面向所有国家和所有风险人群的统一检查购物车。年龄、病史、超声结果、当地技术、费用与个人价值会改变选择。普通商业宣传中的“更全面”并不自动等于净收益更大；额外检查可能同时增加偶然发现和需要解释的灰区。  给信息处理留出私人空间。某些检查涉及妊娠选择、遗传信息和家庭意见，应优先听取孕育者本人的意愿，而不是在家庭群里先投票。可以带支持者，但允许单独与医护交流。把“我还没理解，需要再解释”当成正常权利。  此时共同养育者可以整理工作交接、育儿假、医保与费用渠道，先核对本地现行规则，再计算家庭现金流。不要把本书写作年份的规定当作未来每个读者的待遇。预算至少区分医疗、交通、生活协助和出生后照护，不只购买婴儿用品。"},{"ch":2,"id":"c02-s007","title":"2.7　临床孕十一至十二周：把检查结果转化为下一步","text":"不同地区有不同筛查路径。以NHS公开路径为例，早孕超声及部分染色体相关筛查常在十一至十四周窗口讨论；这只是地区示例，不是要求其他地区照搬。 S11 真正需要带走的是：孕周是否调整、结果是什么、是否需转诊、下一次何时来、出现哪些症状提前联系。  每拿到一份报告，做一个三行摘要：“已经确认的事实；仍不确定的事情；明确的下一步。”不要把全部检验数值逐项贴到搜索引擎，再由最吓人的解释决定情绪。报告有异常标记但医生未解释时，可以追问其临床意义；没有异常标记但症状明显时，也应继续表达。  家务、工作和运动的调整在本周做一次复盘。哪些帮助真正减轻了负担？哪些“照顾”反而造成监督感？把同一句建议反复提醒十遍，通常不能替代一次实际分担。将固定任务直接移交：采购、清洁、预约交通、联系长辈、照顾其他孩子与宠物。"},{"ch":2,"id":"c02-s008","title":"2.8　环境与感染：抓住具体路径，不制造全面恐惧","text":"厨房重点是生熟分开、彻底加热、清洁双手与器具、避免未经巴氏消毒的高风险食品，并核对当地对鱼类汞污染的建议。某一国家对特定认证鸡蛋的例外，不应搬到来源不明的鸡蛋上。 S08 外出吃饭可以询问食材与做法，不必把所有外食一概归为危险。  弓形虫预防应关注未熟肉类、被污染的土壤与猫粪，而不是把“摸过猫”直接等同感染。可由其他人处理猫砂；必须自己处理时使用手套、随后洗手，园艺同理。不要给宠物喂生肉。是否检查及如何解释结果，应结合当地孕期路径、具体暴露与医生意见；单纯养猫不是自动进行一串重复化验的充分理由。 S42  清洁不是灭菌竞赛。把清洁剂按标签使用、避免混合、保证通风，比增加香味和消毒频率更重要。需要装修、除虫或处理霉变时，应说明家中有孕妇并选择合适的专业方案；不要让孕育者近距离闻一闻来判断“有没有毒”。  对发热、传染病接触、旅行或职业暴露，记录时间、地点、对方确诊情况和自己症状，交给医疗人员判断。不要自行把所有接触归为胎儿损伤，也不要因没有症状就认定无需咨询。"},{"ch":2,"id":"c02-s009","title":"2.9　早孕的心理与关系任务","text":"怀孕可以同时带来喜悦、担心、犹豫、遗憾或麻木，不需要演出单一情绪。伴侣可问：“今天你更需要我听你说、替你做事，还是一起找答案？”不要把每次哭泣都解释成激素，更不要把正常分歧变成“影响孩子”的道德指控。  有既往流产或创伤经历时，某些日期、检查室和身体感觉可能格外困难。可以事先告知医护，商定检查时是否需要解释过程、是否让陪伴者在场。家庭可以保留希望，也允许不确定；不要承诺“这次一定没问题”。  若出现持续无法生活的焦虑、明显抑郁、自伤念头或感到不安全，应及时寻求专业帮助；出现紧迫伤害风险，进入急症处理。把求助列为照护的一部分，而不是个人意志失败。关于心理危机的详细路径见卷二十二。"},{"ch":2,"id":"c02-s010","title":"2.10　本阶段每日卡与退出条件","text":"展开：孕早期每日卡——只保留当天有变化的信息 晨间先确认能否进水进食、是否有新症状以及今天的主要负担。按已经确认的医嘱用药与补充叶酸，查看当天是否有预约。没有预约不需要为了“做点什么”自行增加检查。 白天把饮食、休息与活动按耐受度分散安排；共同养育者承担一项完整家务链。工作中的暴露或不适要记录具体情境。必要的信息搜索集中进行，避免每次身体感觉都触发长时间浏览。 晚间只记录真正改变下一步的事项：症状加重、药物变化、检查结论、未解决的问题。为次日准备食物与交通，不做胚胎表现评分。睡前保留与怀孕无关的谈话或愉快活动。 危险信号、持续不能进食饮水、医生要求的紧急复查，立即覆盖本卡。妊娠结束、治疗方案变化或进入新的风险路径时，停止沿用旧计划，与医疗团队重新建立适用的照护方案。  本卷要保留的不是完美控制，而是可用的支持：有人知道情况，有人承担事务，有可靠医疗入口，有权改变计划。"},{"ch":3,"id":"c03-s000","title":"3.1　逐周目录怎样变成每天的安排","text":"本卷周序是家庭准备工作的编排，不是胎儿的每日训练表。医疗安排由实际孕周、病史、症状与当地路径决定。每一周第一次阅读新增任务，接下来确认负责人、准备资源、完成行动，余下日子沿用孕期日常卡。任务已经完成就不再重复；不适用就明确跳过；出现危险信号时退出普通日程。  不能把任何一次没有完成的家务、情绪波动或食物选择解释为胚胎发育的原因。孕育者不是要接受连续九个月的生活审计。共同养育者的责任，是接手真实事务、支持医疗决定和保护休息，而不是对每口食物发表评论。"},{"ch":3,"id":"c03-s001","title":"3.2　十三至二十周：让信息有入口、有出口","text":"**十三周，整理信息渠道。**保留正规产科联系、一个可靠资料入口和一份共享档案。把预约写进日历，注明交通、请假、需要携带的材料及检查要回答的问题。退出只制造恐惧、不提供证据和行动的讨论。信息进入后必须有去处：已解决、待问医生、需要行动，不能全部停留在收藏夹。  **十四周，检查饮食是否真的可持续。**盘点一周能买到、做得出、吃得下的基本食物，考虑气味、温度、胃口与预算。共同养育者负责采购和清洁整条任务链。持续吃不下或饮食种类极少时寻求专业支持，不用“为了孩子必须吃”替代帮助。  **十五周，调整工作条件。**把少加班改成可执行安排，例如减少非必要晚间会议、增加可坐下的工作段、明确急事接手人。职业暴露需要提供具体材料与操作，不只说工作很累。无法自行调整时向职业健康、产科和适用的工作支持渠道咨询。  **十六周，关闭前期结果。**每项检查都确认是否已解释、是否需复查、由谁负责。转诊不等于写在纸上就完成，需要知道对方是否收到材料、何时联系、等待期间怎样处理。结果不明确时允许询问，不靠搜索引擎中最吓人的解释作决定。  **十七周，检查居家路线。**沿起床、如厕、洗澡、做饭的实际路线看照明、湿滑、杂物和高处取物。优先移走反复造成负担的障碍，不以准备婴儿为由临时开启大规模装修。本人试用改动，确认真的更方便，而不是只符合家人的想象。  **十八周，准备结构筛查的问题。**问清检查观察什么、不能排除什么、显示不清时怎样补查。NHS的中孕结构超声通常安排在十八至二十一周，这是地区路径示例，不是其他地区必须照搬的时间表。 S11 影像照片是否漂亮不是医学检查质量标准。  **十九周，保留连接，不制造胎教考核。**可以说话、唱歌或温柔触摸腹部，前提是孕育者舒适。这些活动用于关系和体验，不承诺提高智力。不要把高音量设备贴在腹部，也不要根据是否回应某段音乐给胎儿打分。  **二十周，重排出生预算。**将采购分为安全必需、近期会用、可借用、可延后。婴儿睡眠和交通安全优先于装饰；照护者的餐食、替班、交通与休息也必须占有预算。买了满屋用品却没有一个人能接班，不是完整准备。"},{"ch":3,"id":"c03-s002","title":"3.3　二十一至二十八周：把第二条照护路径建立起来","text":"**二十一周，让另一位照护者完整接手一项任务。**从发现需要、购买、整理到补充，都由同一责任人负责。主要照护者不必继续做后台管理。没有伴侣时寻找亲友、社区或正规服务，目标是可用支持，不是限定家庭形式。  **二十二周，整理重要家族史。**记录明确诊断、亲属关系和大致发病年龄。只收集会改变医疗判断的信息，未知保持未知。亲戚的一句猜测不能直接写成遗传病史；必要时通过本人同意获取相关医疗资料。  **二十三周，核对接种。**带既往疫苗记录向当地团队询问孕期与产后适用项目、时机和禁忌。不能把所有疫苗一律推迟，也不能照抄其他国家的项目；地区流行情况与现行政策会变化。 S46  **二十四周，确认代谢检查是否到期。**了解检查前要求、异常后谁跟进、是否需要营养支持。不要为取得正常结果临时极端节食。NHS对较高风险人群的妊娠糖尿病检测常在二十四至二十八周进行，个人安排仍以本地团队为准。 S11  **二十五周，明确胎动变化的联系方法。**了解本人感受到的活动模式，并询问团队建议。明显减少或改变时及时联系产科，不用家用多普勒偶尔听到声音来排除风险，也没有适用于所有胎儿的单一正常次数。 S10  **二十六周，练习出生后的基础操作。**实际照护者分别布置一次安全婴儿床，练习抱持、换尿布和交接。可以用模型，不必提前增加用品。每人都应理解睡眠时为什么要清空床面，具体协议在卷四，只需学习一次并持续执行。  **二十七周，写一页分娩偏好。**包括陪伴者、沟通方式、镇痛意愿、隐私、可能触发恐惧的情境和需要的支持。它是沟通工具，不是保证产程不改变的合同。可以写明希望在条件允许时解释操作，也明确自己可以改变主意。  **二十八周，测试夜间联络。**备用交通、医院入口、资料、钥匙和其他被照护者的安顿都要可用。不能让一人负责接二十通电话才启动全家。最简单的可运行路径，通常优于精美但依赖太多临时协调的计划。"},{"ch":3,"id":"c03-s003","title":"3.4　二十九至三十六周：准备分娩，也准备分娩之后","text":"**二十九周，了解镇痛。**询问机构提供什么、可能何时使用、效果不足怎么办、哪些个人情况需要提前讨论。呼吸和陪伴可以支持，但不能成为拒绝医学镇痛的理由；选择也可以在产程中改变。 S43  **三十周，安排出院第一周。**明确餐食、用品清洁、来访管理、婴儿复查与其他孩子照护的责任人。产妇不应同时负责恢复、喂养、接待和家务项目管理。把不重要的事务正式取消，而不是口头说可以休息却仍留下任务。  **三十一周，检查设备。**核对婴儿床、出行座椅的适用范围、结构和说明书。二手物品也要确认来源与状态；不知道型号和使用历史的安全设备，不因免费就自动合格。不要用成人经验替代产品安装与安全要求。  **三十二周，练习一分钟医疗表达。**孕周、主要症状、开始时间、变化、重要病史和用药依次说清。语言或听力有障碍时准备适合的沟通支持。练习的目的不是自行诊断，而是在紧张时仍能提供关键信息。  **三十三周，提前说清来访规则。**患病不来、先洗手、不要擅自亲吻婴儿口鼻、拍照与发布需要同意、来访应预约。由共同养育者负责对外说明，不把拒绝亲友的压力全部留给产后疲惫的人。  **三十四周，核实行政材料。**入院、保险、出生登记和儿童建档要求按本地现行制度核对。只提供必要个人信息，不将完整证件在无关群中流转。特殊监护或法律身份情况提前咨询正规机构，避免临场猜测。  **三十五周，确认孕晚期项目。**询问当地是否安排相关感染筛查、胎位或其他复查，结果怎样影响分娩。不要因为别人做过就自行追加，也不因为自己没有症状就取消医生依据病史提出的项目。  **三十六周，做一次现实演练。**模拟拿资料、出门、乘车、入院和安顿家中事务。发现缺口后只修实际问题，不不断添加物品。若计划只有一个人知道，至少让备用支持者能够找到关键资料。"},{"ch":3,"id":"c03-s004","title":"3.5　三十七周至出生：等待也需要明确规则","text":"**三十七周，明确何时联系产科。**宫缩、破水、出血、胎动变化和本人特殊风险，需要团队给出适用规则。破水、阴道出血、胎动减少或未足月疑似临产时应及时联系；强烈即将娩出的感觉可能需要紧急帮助。 S44 不只背网上统一口诀。  **三十八周，缩小不必要的安排。**可以继续适合的生活，但重要活动有交通和返回余地。每一天的主要事务最好能够取消或移交，不把已经预约视为必须完成的承诺。长途或特殊活动先核对医疗意见。  **三十九周，讨论超过预产期的路径。**理解等待、监测和引产等选项的适用条件及主要代价。不要自行用草药、蓖麻油、高强度活动或其他偏方催产，也不用是否自然发动衡量本人表现。  **四十周，更新支持而不是催促。**预产期是临床估计，不是交付违约日。减少每日追问怎么还没有生，改问需要什么具体帮助。出现新症状按计划联系，不因为快到预产期就全部归为正常。  **四十一周及之后，使用个体医疗计划。**明确下一次评估和分娩决策安排，不能从书中推导某天之前绝对安全或所有人必须同日引产。若在此前出生，立即切换实际出生后的方案；早产儿需要专门喂养、体温、呼吸与随访安排。"},{"ch":3,"id":"c03-s005","title":"3.6　分娩当日的决策质量","text":"陪伴者先听本人需要：水、安静、姿势、触摸、停止触摸或解释。不要把录像和亲友汇报放在主要位置。医疗操作在条件允许时说明目的、替代方案和重要风险；急症先救治，稳定后补充解释。本人不是一段产程的旁观者。  不同分娩方式不是道德等级。计划改变时先保证安全，不用早知道、你没有坚持等语言增加负担。镇痛、器械助产或剖宫产是否适用，由医学情况与知情选择共同决定，不能以一份理想剧本压过现实。  婴儿出生后的保暖、呼吸与整体评估由团队负责。肌肤接触和早期喂养要在母婴状态允许并获得正确观察时进行。产妇困倦、镇静或无法安全抱持时需要实际协助，不能把促进亲密当成无人看护的理由。"},{"ch":3,"id":"c03-s006","title":"3.7　产后零至六周：母亲也有独立照护单","text":"出院交接除了婴儿事项，还应包括产妇疼痛处理、伤口、出血、排尿排便、活动限制、药物和复查。危险信号调用安全卷。出院不等于已经恢复，身体不适也不能一律用坐月子正常来解释。  安排休息应覆盖完整任务链。有人喂养，有人准备餐食，有人清洗用品，有人处理访客，才可能形成真正休息；只说宝宝睡你就睡，却让所有家务继续等待产妇完成，并没有提供帮助。  恢复运动依分娩方式、症状与专业评估逐步推进。漏尿、明显坠胀、疼痛或活动后加重需要评估，不用大量盆底收缩练习包办所有问题。喂养方式也不决定母爱，困难时尽早获得有资质支持，目标是营养、安全和可持续。  持续明显低落、焦虑、绝望或无法正常生活需要专业帮助；幻觉、妄想、严重混乱或躁狂等产后表现可能是精神急症，不应等待自行恢复。 S45 亲密接触以意愿、舒适、愈合与医疗建议为前提，讨论适合的避孕，不以月经是否回来作为唯一判断。"},{"ch":3,"id":"c03-s007","title":"3.8　第一次家庭复盘","text":"精力允许时进行短会，每人只说最难的时段、无人真正负责的任务、需要更改的规则和可以取消的事项。不要开成对奶量、体重和谁更辛苦的审判。记录一项改动并真实执行即可。  缺乏支持时，寻找社区、医疗、可信亲友或正规照护资源。帮助可以很小但应具体：送一顿饭、清洗一次用品、陪同复查或照顾另一个孩子。物资不是人手，建议不是替班。准备是否成功，要看出生后仍有没有余力和清楚的交接，而不是采购清单是否全部完成。"},{"ch":4,"id":"c04-s000","title":"4.1　适用范围与照护者责任","text":"本卷默认出院后情况稳定的足月新生儿。早产、低出生体重、呼吸支持、低血糖风险、吞咽或其他疾病，使用出院团队的个体计划。出生日期、出生孕周和矫正年龄用途不能混写，更不能只看应用显示的月龄决定喂养。  新生儿不需要像成人一样按办公钟切割时间。循环是获得食物、清洁、保暖、睡眠、短暂清醒与被回应。每次醒来不必变成课程，哭闹也不是操控成人的行为。照护者的工作是识别需要和异常，不是证明孩子已经能够独立。"},{"ch":4,"id":"c04-s001","title":"4.2　协议N：每轮照护的五个检查点","text":"展开新生儿共用照护循环N 接近前清洁双手，确认自己清醒、能够安全抱持；先观察呼吸、肤色、反应与整体状态。明显异常时停止普通循环，进入安全卷分流。 按已确认的方式喂养并回应饥饱信号。寻找、手到口边可能提示饥饿；转头、闭口可能提示饱足。哭闹往往已经较晚，但嗜睡无力也不能误认成乖或不饿。 S51 是否唤醒、间隔上限和补充安排由个体情况决定。 清洁和检查尿布时先把用品放齐，始终防跌；不离开高台去拿东西。温和清洁，不在正常皮肤褶皱或身体开口进行不必要的深部处理。 状态合适时短暂面对面交流；出现疲倦就减少刺激，睡眠切换协议S。成人在旁不等于危险睡姿因此安全。 交接说明最近喂养、排泄、异常、药物和下一项必须完成的事。采用一份统一记录，避免两人分别凭记忆重复喂药。任何人都不得摇晃、抛接或击打婴儿。 S52"},{"ch":4,"id":"c04-s002","title":"4.3　协议S：安全睡眠完整规则","text":"展开一岁内安全睡眠协议S 每次入睡仰卧，使用适合婴儿、坚实平坦水平的独立睡眠表面，床面只保留合适床单。不放枕头、床围、玩具、定位器、松散被褥或加重睡眠用品。同室而不同床；成人床、沙发和扶手椅不能替代婴儿安全睡眠表面。 S06 出行座椅用于交通，不是到家后继续睡眠的默认场所。可行时转移到适合的平坦表面，不抬高床垫处理普通吐奶，不以侧睡替代仰卧。 S06 S40 出现翻身尝试就停止束缚式襁褓。能够自行双向翻身后仍以仰卧开始睡眠，不必整夜反复翻回，但床面保持清空。特殊医学姿势只能由治疗团队明确指示。 S40 照护者困倦时将婴儿放回安全独立床面，尤其避免抱着坐在沙发上睡着。事先准备替班人和放置位置，比要求永远保持警觉更现实。家用监测设备不能替代环境与姿势规则。"},{"ch":4,"id":"c04-s003","title":"4.4　出生当日：核对交接","text":"以下逐日标题是复核与学习的可选顺序，不是推迟必要照护的许可。安全睡眠从第一次睡眠生效，出院随访在离院前落实；适用的维生素D及短时清醒俯卧，不等第十一天或第十天才首次处理。不同出生处境以团队明确的时间表为准。  零日由团队完成出生适应与相关评估。核对身份、出生时间、孕周、体重和重要处置，问清是否需要额外观察。状态允许时肌肤接触和早期喂养，安全优先于照片和仪式。  确认当地维生素K预防、出生时接种和筛查安排。维生素K注射用于预防新生儿维生素K缺乏性出血，不是家长随意购买普通滴剂即可替代的项目。 S47 哪些筛查还未出结果，要有后续取得和解释渠道。  在离院前明确下一次复查日期、地点、负责人和夜间异常联系渠道；未回报筛查标为“待结果”，不标为正常。母乳或混合喂养婴儿通常需在出生不久开始每日四百国际单位维生素D补充；明确产品浓度、实际每次用量和给药人。纯配方喂养者结合实际摄入与产品含量核定，不把某国的奶量门槛直接移用于所有品牌。 S14  成人当天只需把明确计划带走，不必完成所有育儿知识学习。避免婴儿在不同亲友间频繁传递，尊重产妇休息。公开照片前考虑身份、地点、病史等隐私，不让分享成为必须完成的家庭任务。"},{"ch":4,"id":"c04-s004","title":"4.5　第一至第七天：每天新增一个可靠动作","text":"**第一天，观察整次喂养。**请合适人员看含接、吞咽或瓶喂过程，不能只问吃了多久。摄入评估要结合有效进食、排泄、体重与状态，不能用乳房软硬、泵出量或哭声大小单独判断。  **第二天，建立最低记录。**统一记录必要时间、方式、湿尿布、大便、异常和医疗要求。不同时启用多个应用。医生要求的特殊喂养安排优先于任何睡眠训练；不知道是否要叫醒时应问清，不套用睡多久都不要管。  **第三天，复核离院前已经落实的随访。**确认体重、黄疸、筛查结果和周末联系。待回报项目必须有人追踪。出院较早、喂养困难或其他风险可能需要更早复查，按团队安排，不以同龄孩子下次就诊日期替代。  **第四天，正确处理黄疸疑问。**照片与肉眼不能替代需要时的胆红素测量。出生首日黄疸、伴难唤醒或喂养差、深色尿或浅色便等应及时评估，不靠晒太阳、糖水或自行停母乳处理。 S28 S50  **第五天，复核实际摄入趋势。**带有效记录了解排泄与体重是否符合个体预期。反复喂养失败、反应变差或尿量令人担忧，不等待日历上的复查。需要补充时明确内容、方法、复评时间，而不是无限临时追加。  **第六天，让第二照护者独立完成一轮。**从准备到安全放回床面全部接手，第一照护者真正休息。复盘只修安全与效果问题，不把个人手势偏好当唯一正确答案。  **第七天，审计疲劳。**是否抱着打盹、驾驶犯困、重复操作、明显烦躁？若有，应调整排班与支持，不只增加提醒。亲友帮忙优先承担能让主要照护者睡觉和吃饭的任务，而不是只在婴儿安静时抱一会儿。"},{"ch":4,"id":"c04-s005","title":"4.6　第八至第十四天：把环境与互动做稳定","text":"**第八天，整理照护站。**清洁、尿布、备用衣物和垃圾处理顺手；药物、补充剂、消毒液分区。所有液体有清楚标签与浓度，不能将不同透明液体装入无标记小瓶。  **第九天，练习来回交流。**选择清醒、不太饥饿时说几句话，然后停顿等待。孩子看开、烦躁或疲惫就结束。目的不是听够多少词，而是成人根据孩子反应调整。  **第十天，复核已经启动的清醒俯卧。**多数婴儿在出生后一至两天即可按状态开始短时、有人持续看护的清醒俯卧，并不需要等到第十天。可从每天两三次、每次三至五分钟的短段参考起步；需要更短或有医疗限制时相应调整。清醒俯卧与睡眠仰卧是不同场景，困倦或不适就结束，睡着转入安全睡眠，不追求忍哭凑时。 S48  **第十一天，复核补充剂执行，不能把今天当默认起始日。**检查此前确认的维生素D计划是否已经执行、每滴或每毫升含量是否抄对、有没有重复产品、给药人是否明确。喂养方式改变时重新核对，不自行增加总量。 S14 滴、毫升、国际单位不能混用。  **第十二天，准备外出小包。**只放尿布、衣物、喂养、清洁和必要医疗资料。重点是温度、回程与照护，不追求过早见世面，也不因避免外出而推迟必要复查。  **第十三天，检查听力流程是否有下一位负责人。**未通过筛查不等于确诊，但不能失访。CDC的“1—3—6”目标是一个月内筛查、三个月内完成必要诊断、确有听力损失者六个月内进入适当早期干预；能更早完成不必等到期限。只有取得结果解释并落实需要的后续，才算相应节点闭环。 S153 通过后仍关注听觉与沟通变化。  **第十四天，减少无用测量。**若生长喂养稳定，讨论哪些记录可降频。普通家庭不必每餐前后称重；有明确问题则继续按计划监测。减少的是负担，不是必要随访。"},{"ch":4,"id":"c04-s006","title":"4.7　第十五至第二十一天：建立柔和的可预测性","text":"白天保留正常生活光线和交流，夜间减少不必要刺激。不要为培养作息让婴儿白天一直不睡，也不把整夜睡当健康证明。具体分龄睡眠范围在卷十六统一列出，不能拿总时长替代喂养和健康评估。  每天可有一个熟悉连接点，例如换尿布后说同一段话，或一次清醒时看熟悉照护者的脸。固定的是成人回应机会，不是要求婴儿准时表演。没有反应先检查疲倦、饥饿和不适，不直接判定发育问题。  检查衣物是否勒、标签是否摩擦、环境是否过热、抱持是否遮住口鼻。持续偏向一侧、明显不对称、喂养中反复呛咳或其他担忧，向随访团队提出，必要时提前评估；不自行用矫形枕或扳动颈部处理。"},{"ch":4,"id":"c04-s007","title":"4.8　第二十二至第二十八天及满月前过渡","text":"核对全部出生筛查、接种记录、复查结论和下次保健预约。医生说观察时，应知道观察什么、到何时、什么变化提前联系。没有这些条件的观察容易变成无限期忽略。  照护者回岗或更换时，提前让接替者实际完成多轮操作。交接主表保持简短，重要附件可另存，不能让对方从两百条聊天记录猜出当前方案。记录婴儿偏好，但随成长更新，不把早期反应永久标签化。  日龄二十九日到满一个月前，继续本卷日常循环，不存在无协议空档；满一个月后进入卷五月龄增量。月底总结只需：什么已稳定，什么仍担心，下次找谁，不对抬头、哭闹或睡眠作排名。"},{"ch":4,"id":"c04-s008","title":"4.9　协议F：配方奶的准备、保存与丢弃","text":"展开配方奶操作协议F 使用安全水源、合适年龄的正规产品和清洁器具。严格按产品与卫生要求执行水粉比例，先准确量水再加规定粉量，不加浓、不稀释，不凭目测。具体温度与准备方式需匹配产品和婴儿风险。 粉状配方并非无菌。未满两个月、早产或免疫功能受损者需要额外防感染措施，询问是否优先用无菌即食配方及相应冲调冷却要求。 S13 CDC一般时限为冲调后两小时内、开始喂后一小时内使用；未开始喂且立即冷藏的通常二十四小时内使用。接触婴儿口腔的剩奶丢弃，不和新奶混合；不要微波加热。 S13 特殊医学配方和当地条件可能不同，以具体说明和团队计划为准。水被化学污染时煮沸并不必然安全，灾害中应获取卫生部门认可的水源或适用即食配方。"},{"ch":4,"id":"c04-s009","title":"4.10　哭闹与照护失控","text":"先排疾病信号，再看饥饿、尿布、温度、衣物与安抚需要。轻声、温柔抱持、减少刺激都可尝试，但无效不意味着需要加大力度。长时间哭闹不能一概归为肠绞痛，突然安静也不自动代表问题解决。  成人即将失控时，将婴儿仰卧放回安全床面，短暂离开几步冷静、及时回看并联系可靠成人接手。不要交给醉酒、暴怒或有暴力风险者，不摇晃、不抛掷、不击打。 S52 异常呼吸、发绀、难唤醒、反应差、明显脱水或发热优先进入安全卷。  本阶段最优不是最早独立，而是即使完全依赖别人，也能得到足够、稳定、安全并可持续的照护。评价的对象首先是支持系统是否可靠，而不是婴儿是否容易照顾。"},{"ch":5,"id":"c05-s000","title":"5.1　月龄负责导航，能力负责开关","text":"每个孩子在动作、交流、感觉和进食上的进度可能不同。月龄用来提醒成人提供机会，不用来发出合格证。发育观察清单不能替代标准化筛查；持续担忧、明显不对称或已经获得的能力消失，应及时向儿科或儿童保健人员提出。 S53 S54  每天仍调用卷四的安全睡眠与适用喂养协议。短暂清醒时增加一两种当前能力能够参与的活动就足够。重复同一首歌、同一个拿取动作不是浪费；孩子可能正在从同一经验中提取新关系。新增信息不一定来自新产品，也可以来自位置、质地、回应方式或自己动作造成的结果。  下面月序是机会清单，不是医学训练处方。没在某月完成的动作不能靠下月加倍训练补账。生病、早产、残障或家庭困难时，按实际需要调整支持，不能让标准清单成为拒绝参与的理由。"},{"ch":5,"id":"c05-s001","title":"5.2　满一个月至未满两个月：让回应变得可预测","text":"换尿布、抱起和安抚时，先说话、停顿、看反应再继续。描述正在发生的事，而不是全天播放语言。孩子看开、烦躁或疲倦时减少刺激，允许其退出互动。照护者的语气和节奏可以稳定，但不要求孩子每次给出相同反应。  检查声音环境：电视是否全天开着，玩具是否靠近耳朵，助眠声音是否遮盖了正常交流。安静本身就是可用环境，不需要每分钟都有刺激。清醒俯卧依卷四按耐受开展，不按住头部或忍哭凑时间。  本月新增成人任务是固定随访入口与替班。保健不只量体重，也可以讨论喂养、睡眠、视觉、听觉和照护困难。没有问题时不必为证明用心增加检查；有具体问题时也不必等满月仪式结束才求助。"},{"ch":5,"id":"c05-s002","title":"5.3　两至三个月：给孩子发起互动的时间","text":"把脸或安全物品放在容易看见的位置，不持续快速晃动。孩子看向、发声或动作时再回应，避免成人总是抢先填满停顿。记录一个真实变化即可，不要求每天拍出新技能视频。  抱持和摆放时给予左右两侧自然接触机会；持续明显偏向一侧、活动受限或头形疑虑应评估，不使用硬枕、绑带或强行扳动。婴儿难以表达具体不舒服，成人要区分习惯与持续受限，不凭一次照片判断。  外出可以只是安全地看树影、听普通生活声音。拥挤商场和连续陌生人逗弄不天然优于安静散步。天气、空气、个体疾病和可获得照护决定安排，不能为了见世面忽略实际负担。"},{"ch":5,"id":"c05-s003","title":"5.4　三至四个月：让动作能够改变结果","text":"提供少量完整、适龄、便于接触的物品，留出尝试空间。伸手能碰到、碰到会移动、放开会掉下，这些关系比成人不断展示玩具更多地允许孩子参与。一次只改变一个变量，避免声音、灯光和移动同时过强。  出现翻身尝试就更新睡眠与看护，不等成功后再处理。高台、沙发和成人床不能被当作临时安全停车位。睡眠襁褓边界调用协议S，不为延长睡眠而继续束缚可能翻身的孩子。  检查所有可能入口的物品是否脱落、破裂、缠绕或有未封牢的电池仓。家中其他孩子的玩具、药片和遥控器同样要检查；购买标签写婴儿适用，不等于家中摆放就自动安全。"},{"ch":5,"id":"c05-s004","title":"5.5　四至五个月：选择、抓握与自主地面活动","text":"一次给两个安全物品，观察孩子先关注哪一个，不把选择解释为终身天赋。不同状态下偏好会变化。成人可以命名所选物，但不要要求选中成人认为更有教育价值的那个。  地面活动留出移动空间，不长时间固定在各种座椅中，再用几分钟训练补偿。头躯干控制尚不稳定时，不靠枕头围成强迫坐姿，不为照片摆出无法自行维持的位置。坐、站、走的机会跟随能力，不按成人审美升级。  开始了解辅食准备条件与当地建议，但看到孩子盯成人食物不能单独作为开始大量辅食的依据。需要结合大致年龄、头颈和坐姿控制、吞咽及健康条件；早产或复杂情况另行咨询。"},{"ch":5,"id":"c05-s005","title":"5.6　五至六个月：先准备环境和成人能力","text":"准备稳定进食座位、适用约束、可清洁餐具和能专心看护的成人。高脚椅远离可拉到的热物、电线和会导致倾倒的位置。屏幕支架不是进食设施的核心；真正需要的是安全姿势与观察。  实际照护者参加婴幼儿急救实操，学习气道梗阻的识别与处置。不能将成人步骤按比例缩小给婴儿使用。紧急时按当地调度和已受训流程行动，不临时翻找长篇文章。  WHO建议约六个月开始安全、营养适宜的辅食，同时继续母乳喂养；未使用母乳的孩子需要适龄配方方案。 S04 开始日期不是人生分水岭，关键是准备条件、营养与持续评估。"},{"ch":5,"id":"c05-s006","title":"5.7　六至七个月：辅食既是营养，也是新技能","text":"选择清醒、姿势稳定、不过度饥饿或疲惫的时候，从少量开始观察接受与吞咽，奶仍是重要营养来源。不要因为开始吃几口泥就突然撤掉大部分奶，也不拿一顿吃了多少与别家比较。  膳食逐步包含适合的富铁食物，不长期只用稀粥、水果或汤水。是否补铁由喂养方式、早产、贫血等风险决定，不给所有孩子同一剂量。限制多个食物类别时需要检查营养缺口，不让过敏担忧自动变成长期单一饮食。  常见致敏食物不应仅因害怕无限延迟，应按适合的形态、年龄与个体风险引入，耐受后纳入日常；明显湿疹、已有食物过敏等情况先咨询。整粒坚果和一大团黏稠坚果酱不是安全引入形式。 S55  语言跟随正在发生的事：看碗就说碗，伸手就描述想拿。不要把说出词语变成获得食物或帮助的条件。孩子可以先通过手势和动作表达，成人负责把表达连接到回应。"},{"ch":5,"id":"c05-s007","title":"5.8　七至八个月：手、眼、口与空间共同学习","text":"把安全物品放在不同但可及的位置，让孩子尝试伸手、换手或转身。给予时间，明显挫败时降低难度，不用不断拉远物品制造所谓挑战。练习的结果应该可接近，而不是总被成人拿走。  辅食质地随能力逐步调整，不为清洁方便长期停留在完全细滑的形式；也不照搬视频中同龄人的大块食物。反复呛咳、吞咽困难、进食后呼吸异常需要评估，不能用多练就好带过。  成人从地面高度检查插座、电线、植物、宠物食盆、垃圾和小物。站着看整洁不代表婴儿能接触到的区域安全。每次新增移动能力，都要检查其能够到达的新范围。"},{"ch":5,"id":"c05-s008","title":"5.9　八至九个月：移动改变家庭权限","text":"移动方式存在差异，不必强迫一种标准爬行姿势。只要孩子开始改变位置，就提前完成家具防倾倒、楼梯、窗户和门缝保护。安全改造跟随可能做到的下一步，不等待一次险情证明能力。  可以把安全物品放入容器再拿出，观察顺序与空间。容器不能夹手、锋利、套住头部或含可入口的小部件。成人演示后退一步，让孩子操作，而不是完成整套表演。  更换照护者时安排熟悉过程，告别简短稳定，不偷偷消失后将哭闹解释为不独立。孩子可以不立即接受陌生人拥抱，成人负责建立安全关系，而不是要求其配合社交礼仪。"},{"ch":5,"id":"c05-s009","title":"5.10　九至十个月：共同注意与安全拒绝","text":"孩子看向或指向某物时，成人可以看同一个目标并回应。对象可以是窗外车、洗衣物或图画。意义在于共同关注，而不是每次把注意力拉回课程。  安全语言简短一致，例如烫、不碰，同时由成人移走危险物。不能指望婴儿理解禁止来承担安全责任。孩子会听一个词，不等于在兴奋、疲倦或陌生环境下能稳定控制行为。  挥手、拍手和轮流可在自然互动中练习，不强迫向客人表演。孩子拒绝时成人可以替其礼貌回应，保留对身体和注意力的基本边界。"},{"ch":5,"id":"c05-s010","title":"5.11　十至十一个月：自助从小动作开始","text":"允许安全地拿食物、接触勺子、练习杯子。洒落是清洁任务，不是必须立刻制止的失败。用小份量和易清理环境减少成人压力，比连续说不要弄脏更有用。  穿衣时停一下，等待伸手或抬脚；收拾时让孩子把一个物品放进盒子。不要求完成成人标准的整套家务，也不因做得慢就完全撤回机会。成人帮助应恰好填补当前困难。  精细拿取能力增加后，药片、硬币、磁铁、电池更加值得关注。能力进步同时意味着风险接口变化，不能只庆祝而不更新环境。疑似吞入危险物立即联系急救或医疗服务，不等待自行排出。"},{"ch":5,"id":"c05-s011","title":"5.12　十一至十二个月：准备过渡，而不是生日清零","text":"逐渐参与家庭餐桌，但食物仍按安全质地和营养需要调整。奶类、杯子
